ements", "opis": "What the plan must satisfy, e.g. “NRCS 590 plan for an EQIP contract; state rules on fall application [VERIFY WITH YOUR STATE]”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who writes nitrogen management plans for corn, wheat and other crops using 4R principles and NRCS 590 structure. Build an N rate plan from my data.\n\nINPUT:\nGrower and fields: [GROWER AND FIELDS]\nCrop and yield goal: [CROP AND YIELD GOAL]\nState N guidance: [STATE N GUIDANCE]\nCredits and soil tests: [CREDITS AND SOIL TESTS]\nN sources and timing: [N SOURCES AND TIMING]\nPlan requirements: [PLAN REQUIREMENTS]\n\nRULES:\n1. Check the input first. If anything important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Take the base N rate ONLY from the state or land-grant guidance I give you (for example an MRTN result). If I give none, do not suggest a number — mark it [TO FILL IN: state N rate guidance].\n3. Subtract only the credits I document (manure analysis, legume, starter, MAP, soil nitrate) and show each one with its source.\n4. Convert lb N/ac into lb or gal of product per acre and per field for each timing, using the N content I give you.\n5. Never invent rates, critical soil test levels, label numbers, prices, legal limits, setbacks or program rules — use only the numbers I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION] and anything to check against the current rules, label, lab or land-grant guidance [VERIFY].\n6. Show every calculation step by step with units, so I can check it on a calculator. Use the units I give you (lb/ac and ac, or kg/ha and ha).\n\nOUTPUT FORMAT:\nA) Input table per field: crop, acres, yield goal, previous crop, guidance source.\nB) Step-by-step rate calculation: base rate, each credit, net N to apply.\nC) 4R table: source, rate, time (growth stage), place, product per acre and per field.\nD) Product to book for the whole operation.\nE) List of [TO FILL IN] and [VERIFY] items to clear before the plan is signed.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Run the plan for every field and put it in one table.", "Recalculate the split with UAN instead of anhydrous.", "Add the N from the manure analysis I will paste.", "Rework the plan at a different N:corn price ratio I give you.", "Write a one-page version for the grower in plain language.", "Add a column with total tons or gallons to book by product.", "Show what changes if sidedress is rained out and everything goes preplant.", "Add a signature and date block for the 590 plan.", "List the data I still need to finish the plan.", "Compare a two-way split with a three-way split and show the difference."], "checklista": ["Every rate and credit has a source: state guidance, lab report or manure analysis.", "The yield goal comes from the grower's own history, not a record year.", "The N:corn price ratio used matches current prices the grower confirmed.", "Credits from MAP, starter and manure are not double counted.", "Lb N converted to lb or gal of product checked against the product's analysis.", "Application timing respects state rules on fall or winter application [VERIFY WITH YOUR STATE].", "All [VERIFY] markers are cleared before the plan goes into the 590 file."], "uwaga": "The app does not give N rates. Rate guidance, credits and state rules on timing change by state and year — enter them from your land-grant university, state agency or NRCS office and check them before the plan is signed.", "przyklad": {"wejscie": "OK, North 80, Story County, 78 acres. Corn after beans, our five-year average is about 205. I ran the Iowa State MRTN calculator with today's prices and got 140 pounds of N, profitable range 125 to 155. No manure on that field. We put on 100 pounds of MAP in the fall, that's 11-52-0. Plan is anhydrous preplant, 82 percent, about two thirds of the N, and the rest as 32 percent UAN sidedress at V5, V6. It's going in his 590 plan for the EQIP contract. I need the numbers per acre and what to book for the whole field.", "wynik": "N RATE PLAN — North 80, Story County, IA (78 ac), corn after soybeans\n\nA) Input\n| Item | Value | Source |\n| Yield goal | 205 bu/ac | grower 5-yr average |\n| Base N rate | 140 lb N/ac | ISU MRTN, grower's price ratio [VERIFY] |\n| MAP credit | 100 lb × 11% = 11 lb N/ac | fall application |\n| Manure credit | 0 | grower |\n\nB) Calculation\n1. Base rate: 140 lb N/ac\n2. Minus MAP: 140 − 11 = 129 lb N/ac net to apply\n3. Check: within MRTN profitable range 125–155 lb N/ac\n\nC) 4R split\n| Timing | Source | lb N/ac | Product/ac | Field (78 ac) |\n| Preplant | NH3 82% | 86 [ASSUMPTION: two thirds] | 86 / 0.82 = 104.9 lb | 8,182 lb ≈ 4.1 tons |\n| V5–V6 sidedress | UAN 32% | 43 | 43 / 3.54 lb N per gal = 12.1 gal [VERIFY product density] | 944 gal |\n| Total | | 129 | | |\n\nD) To book: about 4.1 tons NH3 and 944 gal UAN 32% for this field.\n\nE) Open items: state rules on fall or winter application [VERIFY WITH YOUR STATE]; sidedress placement (injected or dribbled) [TO FILL IN]; grower signature and date for the 590 plan [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "2.02", "nazwa": "Lime Recommendation From Soil Test", "tag": "LIME PLAN", "co_robi": "Turns soil pH and buffer pH results into a lime plan per field, using only the lime requirement method and target pH from your lab or land-grant guidance. It adjusts the rate for the quality of the lime you can actually buy (ECCE or neutralizing value) and gives tons per acre, tons per field and cost.", "kiedy": "After fall soil sampling, when fields come back with low pH and the grower wants to know how many tons of ag lime to order and what it will cost.", "brief": [{"pole": "Grower and fields", "opis": "Fields, acres and grid or zones, e.g. “Hoffman Brothers, McLean County, IL — Home quarter 152 ac, 2.5-ac grid”."}, {"pole": "Soil test results", "opis": "Water pH, buffer pH, CEC and OM by field or zone, e.g. “Home quarter: pH 5.8, buffer pH 6.6, CEC 18, OM 3.4%”."}, {"pole": "Lime requirement guidance", "opis": "Target pH and the method or table your lab or university uses, e.g. “lab recommends 2.5 ton/ac at 100% ECCE to reach pH 6.5, from their buffer table”."}, {"pole": "Lime source and quality", "opis": "Product, ECCE or neutralizing value, price and spreading cost, e.g. “quarry ag lime, ECCE 78% on the state certificate, $28/ton delivered and spread”."}, {"pole": "Crops and timing", "opis": "Rotation and when lime can go on, e.g. “corn-soybean, liming after soybean harvest this fall, alfalfa planned in 2028”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who writes lime recommendations from soil tests for row crop and forage growers. Build a lime plan from my data.\n\nINPUT:\nGrower and fields: [GROWER AND FIELDS]\nSoil test results: [SOIL TEST RESULTS]\nLime requirement guidance: [LIME REQUIREMENT GUIDANCE]\nLime source and quality: [LIME SOURCE AND QUALITY]\nCrops and timing: [CROPS AND TIMING]\n\nRULES:\n1. Check the input first. If anything important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Use only the target pH and lime requirement (buffer pH method or table) from my lab or land-grant guidance; if missing, mark [TO FILL IN: lime requirement source].\n3. Adjust the rate to the actual lime quality (ECCE, neutralizing value or effective calcium carbonate) I give you, and show the formula.\n4. Flag zones where a split application or a maximum single rate from my guidance applies [VERIFY].\n5. Never invent rates, critical soil test levels, label numbers, prices, legal limits, setbacks or program rules — use only the numbers I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION] and anything to check against the current rules, label, lab or land-grant guidance [VERIFY].\n6. Show every calculation step by step with units, so I can check it on a calculator. Use the units I give you (lb/ac and ac, or kg/ha and ha).\n\nOUTPUT FORMAT:\nA) Table of results by field or zone with the source of the requirement.\nB) Step-by-step rate adjustment for lime quality.\nC) Tons per acre, tons per field and total order.\nD) Cost per acre and per field from the prices I gave.\nE) Timing notes and open [TO FILL IN] and [VERIFY] items.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Make a variable-rate table by grid cell from the results I paste.", "Compare two lime sources with different ECCE and price per ton.", "Recalculate for a higher target pH for alfalfa.", "Split the rate over two years and show both applications.", "Add a column with truckloads based on the truck size I give you.", "Write a short note to the grower explaining why the field needs lime.", "Show the cost per acre per year if the lime lasts the years I give you.", "Flag cells where magnesium is low so I can consider dolomitic lime.", "Make a spreading order for the custom applicator.", "List which results I still need from the lab."], "checklista": ["Water pH and buffer pH are from the same and current sample.", "Lime requirement comes from the lab or land-grant table, with the source named.", "ECCE or neutralizing value is taken from the actual product certificate.", "Units are consistent: tons per acre at 100% ECCE vs. product tons per acre.", "Target pH fits the most sensitive crop in the rotation.", "Order quantity and cost are checked against the field acres.", "Any maximum single rate from the guidance is respected [VERIFY]."], "uwaga": "Lime requirement methods and target pH differ by state, lab and crop. The app does not provide them — use your lab report or land-grant guidance and the lime's quality certificate.", "przyklad": {"wejscie": "Home quarter, Hoffman brothers, McLean County, 152 acres. Lab report says pH 5.8, buffer 6.6, CEC 18, organic matter 3.4. Lab recommends two and a half ton per acre at 100 percent ECCE to get to 6.5. The quarry lime we can get is ECCE 78 on the state certificate, 28 dollars a ton delivered and spread. They're corn-beans, we'd lime after bean harvest this fall. Can you give me tons per acre, total order and what it costs him?", "wynik": "LIME PLAN — Home quarter, McLean County, IL (152 ac)\n\nA) Results\n| pH | Buffer pH | CEC | OM | Requirement | Source |\n| 5.8 | 6.6 | 18 | 3.4% | 2.5 ton/ac at 100% ECCE to pH 6.5 | lab buffer table [VERIFY] |\n\nB) Quality adjustment\nProduct rate = requirement ÷ ECCE\n2.5 ÷ 0.78 = 3.21 ton/ac of quarry lime\n\nC) Order\n| Item | Value |\n| Rate | 3.2 ton/ac |\n| Field | 3.21 × 152 = 487.9 tons |\n| Order | about 488 tons |\n\nD) Cost\n3.21 ton/ac × $28 = $89.88/ac\n487.9 tons × $28 = $13,661 for the field\n\nE) Timing and open items\n- Fall after soybean harvest gives the lime time to react before corn.\n- Maximum single application rate per your state guidance [VERIFY WITH YOUR STATE].\n- Grid or zone variability not provided — whole-field rate [ASSUMPTION]; variable rate possible with grid data [TO FILL IN].\n- Magnesium level to decide calcitic vs. dolomitic [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "2.03", "nazwa": "Soil Test Interpretation for the Grower", "tag": "SOIL TEST", "co_robi": "Explains a soil test report to the grower in plain English: pH, buffer pH, OM, CEC, P and K in ppm by extraction method (Mehlich-3, Bray-1, Olsen), and what it means for next season. It uses only the interpretation ranges your lab or land-grant university provides and never makes up critical levels.", "kiedy": "When the lab report lands and the grower calls asking “is this good or bad?”, or before a winter meeting where you go over soil tests field by field.", "brief": [{"pole": "Grower and fields", "opis": "Grower, location and fields sampled, e.g. “Dave Jensen, south-central Nebraska — 4 fields, 640 ac, zone sampled 0–8 in”."}, {"pole": "Lab results", "opis": "Values with units and extraction method, e.g. “Pivot 2: pH 6.1, OM 2.1%, CEC 12, P 14 ppm (Mehlich-3), K 160 ppm, Zn 0.6 ppm”."}, {"pole": "Interpretation ranges", "opis": "Low, optimum and high ranges from your lab or university, e.g. “UNL ranges from the lab report, P by Mehlich-3, K by ammonium acetate”."}, {"pole": "Planned crops", "opis": "Crops for the next 1–2 seasons, e.g. “irrigated corn 2027, soybeans 2028”."}, {"pole": "Audience", "opis": "Who reads it and how, e.g. “grower and his son, plain language, one page per field”."}, {"pole": "Grower questions", "opis": "What they asked, e.g. “do I need potash this year? why is CEC so low?”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who explains soil test reports to growers in plain, practical language. Interpret this soil test for my grower.\n\nINPUT:\nGrower and fields: [GROWER AND FIELDS]\nLab results: [LAB RESULTS]\nInterpretation ranges: [INTERPRETATION RANGES]\nPlanned crops: [PLANNED CROPS]\nAudience: [AUDIENCE]\nGrower questions: [GROWER QUESTIONS]\n\nRULES:\n1. Check the input first. If anything important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Classify each nutrient only with the interpretation ranges I give you and name the extraction method. Never compare results from different methods (Mehlich-3, Bray-1, Olsen) as if they were the same.\n3. If a range is missing, do not guess it — mark [TO FILL IN: interpretation range for this method].\n4. Explain OM, CEC and buffer pH in one or two simple sentences each, and answer every grower question directly.\n5. Never invent rates, critical soil test levels, label numbers, prices, legal limits, setbacks or program rules — use only the numbers I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION] and anything to check against the current rules, label, lab or land-grant guidance [VERIFY].\n6. Show every calculation step by step with units, so I can check it on a calculator. Use the units I give you (lb/ac and ac, or kg/ha and ha).\n\nOUTPUT FORMAT:\nA) Summary table per field: value, unit, method, class from the given ranges.\nB) Plain-English meaning for each line (what it means for the crop).\nC) Priorities for this season, ranked.\nD) Answers to the grower's questions.\nE) Open [TO FILL IN] and [VERIFY] items, including resampling needs.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Do the same interpretation for all the fields and put them side by side.", "Turn this into a one-page handout for the grower.", "Compare this year's results with the previous test I paste.", "Explain what the Bray-1 and Mehlich-3 differences mean for this report.", "Make a list of questions for the lab about unusual values.", "Highlight zones that need a closer look before a variable-rate prescription.", "Write a short text message version for the grower.", "Suggest a resampling schedule based on the guidance I give you.", "Translate the units if I give you results in lb/ac instead of ppm.", "Prepare talking points for the winter meeting."], "checklista": ["Extraction method is named for every P and K value.", "Interpretation ranges come from the lab or land-grant university, with the source named.", "Sampling depth and date are written on the summary.", "No result is classified with a range from a different method.", "Answers to the grower's questions are direct and short.", "Anything unusual has a [VERIFY] note to check with the lab."], "uwaga": "Critical soil test levels depend on the extraction method, the lab and state guidance. The app does not supply them — enter the ranges from your lab report or land-grant university.", "przyklad": {"wejscie": "Dave Jensen, south-central Nebraska, Pivot 2. Results came back from the lab, sampled 0 to 8 inches. pH 6.1, OM 2.1, CEC 12, P is 14 ppm Mehlich-3, K 160 ppm, zinc 0.6. The lab put UNL ranges on the report: for Mehlich-3 P they show low as under 15 and medium 15 to 25. For K they list 125 and above as high. They didn't give a zinc range. Irrigated corn next year. Dave asked me two things: do I need potash this year, and why is my CEC so low compared to my brother's ground? Keep it simple, he wants one page.", "wynik": "SOIL TEST SUMMARY — Pivot 2, Dave Jensen (0–8 in)\n\nA) Results\n| Test | Value | Method | Class | Source |\n| pH | 6.1 | water | [TO FILL IN: range] | |\n| OM | 2.1% | LOI [VERIFY] | — | |\n| CEC | 12 meq/100 g | sum of cations | — | |\n| P | 14 ppm | Mehlich-3 | Low (under 15) | UNL ranges on lab report |\n| K | 160 ppm | ammonium acetate [VERIFY] | High (125+) | UNL ranges on lab report |\n| Zn | 0.6 ppm | DTPA [VERIFY] | [TO FILL IN: range] | |\n\nB) What it means\n- P is just under the low line: the corn may respond to phosphorus.\n- K is high: the test does not show a need for potash this year.\n- CEC of 12 means sandier soil that holds fewer nutrients than heavier ground.\n\nC) Priorities\n1. Phosphorus plan for corn (rate from UNL guidance) [TO FILL IN].\n2. Check zinc against the lab's range before deciding on Zn.\n\nD) Dave's questions\n- Potash: based on these ranges, no — K tests high.\n- Low CEC: it reflects soil texture and organic matter; your brother's ground is likely heavier. Not something to fix with fertilizer.\n\nE) Open items: pH and zinc ranges from the lab [TO FILL IN]; confirm extraction methods for K and Zn [VERIFY].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "2.04", "nazwa": "Nutrient Budget and Crop Removal", "tag": "NUTRIENT BUDGET", "co_robi": "Builds an N, P2O5 and K2O balance for a field or the whole operation: what went in (fertilizer, manure, legume credits) against what left with the harvested crop. It uses only the removal coefficients and analyses you provide and shows whether each field is building, maintaining or mining.", "kiedy": "At year end, for a 590 plan review, a landlord conversation about soil fertility, or before deciding whether to cut P and K in a tight margin year.", "brief": [{"pole": "Grower and acres", "opis": "Operation and fields included, e.g. “Miller Farms, 4 fields, 620 ac total”."}, {"pole": "Budget period", "opis": "Season or years covered, e.g. “2025 and 2026 seasons, corn-soybean rotation”."}, {"pole": "Nutrient inputs", "opis": "Fertilizer and manure applied, e.g. “North 80: 200 lb/ac MAP in fall 2025, 150 lb/ac potash (0-0-60)”."}, {"pole": "Removal coefficients", "opis": "Nutrient removal per bushel from your source, e.g. “ISU PM 1688 values: corn grain lb P2O5 and K2O per bu — I'll paste them”."}, {"pole": "Harvested yields", "opis": "Actual yields by field, e.g. “North 80: corn 2025 212 bu/ac, soybeans 2026 63 bu/ac”."}, {"pole": "Budget goal", "opis": "Why you need it, e.g. “show the landlord the farm is not mining P and K”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who builds nutrient budgets for growers, landlords and 590 plans. Build a crop removal nutrient balance from my data.\n\nINPUT:\nGrower and acres: [GROWER AND ACRES]\nBudget period: [BUDGET PERIOD]\nNutrient inputs: [NUTRIENT INPUTS]\nRemoval coefficients: [REMOVAL COEFFICIENTS]\nHarvested yields: [HARVESTED YIELDS]\nBudget goal: [BUDGET GOAL]\n\nRULES:\n1. Check the input first. If anything important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Use only the removal coefficients I give you and name their source; if missing, mark [TO FILL IN: removal per bu].\n3. Convert fertilizer products to lb N, P2O5 and K2O from the analysis I give you, and manure only from a manure analysis I provide.\n4. Report the balance per field and per acre as input minus removal, labeled build, maintain or mining, without judging fertility levels I did not give you.\n5. Never invent rates, critical soil test levels, label numbers, prices, legal limits, setbacks or program rules — use only the numbers I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION] and anything to check against the current rules, label, lab or land-grant guidance [VERIFY].\n6. Show every calculation step by step with units, so I can check it on a calculator. Use the units I give you (lb/ac and ac, or kg/ha and ha).\n\nOUTPUT FORMAT:\nA) Input table: product, rate, nutrient content, lb nutrient per acre.\nB) Removal table: crop, yield, coefficient, lb removed per acre.\nC) Balance per field and for the operation (lb per acre and total lb).\nD) Short reading of the result for the stated goal.\nE) List of [TO FILL IN] and [VERIFY] items.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Run the budget for every field and total it for the operation.", "Add the manure analysis I will paste to the inputs.", "Show the balance as a simple chart-ready table.", "Write a one-page summary for the landlord.", "Recalculate with straw or stover removed for baling.", "Estimate what potash is needed to replace removal at next year's yield goal.", "Compare the budget with the change in soil test between samplings.", "Show the cost of replacing removed P and K at the prices I give you.", "Split the budget by year in the rotation.", "List the missing records to complete the budget."], "checklista": ["Removal coefficients come from a named land-grant source.", "Yields are actual harvested yields, not goals.", "Product analyses match the invoices or bills of lading.", "Manure is counted only with a lab analysis.", "P is shown as P2O5 and K as K2O throughout, not mixed with elemental P or K.", "Field acres match FSA or farm records."], "uwaga": "", "przyklad": {"wejscie": "Miller Farms, North 80, 78 acres. Over the last two seasons we put on 200 pounds of MAP per acre in fall 2025, that's 11-52-0, and 150 pounds of potash, 0-0-60. No manure. Corn in 2025 made 212, beans in 2026 made 63. From the Iowa State removal table I'm using 0.32 pounds P2O5 and 0.22 K2O per bushel of corn, and 0.72 P2O5 and 1.17 K2O per bushel of beans. Landlord wants to know if we're mining the farm. Give me a balance per acre and for the field.", "wynik": "NUTRIENT BUDGET — North 80 (78 ac), 2025–2026\n\nA) Inputs (lb/ac)\n| Product | Rate | P2O5 | K2O |\n| MAP 11-52-0 | 200 lb | 200 × 0.52 = 104 | 0 |\n| Potash 0-0-60 | 150 lb | 0 | 150 × 0.60 = 90 |\n| Total | | 104 | 90 |\n\nB) Removal (lb/ac) — coefficients from ISU table [VERIFY edition]\n| Crop | Yield | P2O5 | K2O |\n| Corn 2025 | 212 bu | 212 × 0.32 = 67.8 | 212 × 0.22 = 46.6 |\n| Soybeans 2026 | 63 bu | 63 × 0.72 = 45.4 | 63 × 1.17 = 73.7 |\n| Total | | 113.2 | 120.3 |\n\nC) Balance\n| | P2O5 | K2O |\n| Per acre | 104 − 113.2 = −9.2 | 90 − 120.3 = −30.3 |\n| Field (78 ac) | −718 lb | −2,363 lb |\n| Status | slight mining | mining |\n\nD) Reading for the landlord\nOver two seasons the field removed slightly more P2O5 than was applied and about 30 lb/ac more K2O. Whether that matters depends on current soil test levels [TO FILL IN: latest soil test P and K]. If K tests near or below the optimum range, replacing removal in the next application deserves a look.\n\nE) Open items: stover left in the field [ASSUMPTION]; soil test trend between samplings [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "2.05", "nazwa": "Crop Rotation Plan, 3–5 Years", "tag": "CROP ROTATION", "co_robi": "Lays out a 3–5 year rotation field by field that fits the grower's markets, equipment, weed and disease problems, and any conservation commitments (for example NRCS conservation crop rotation 328 or cover crops 340). It explains the reasons for each sequence and flags conflicts without inventing program rules.", "kiedy": "During winter planning, when a grower wants to break up continuous corn, add wheat or a cover crop, or sign up for an NRCS practice that requires a rotation.", "brief": [{"pole": "Grower and fields", "opis": "Fields, acres and soils, e.g. “Hoffman Brothers, Red River Valley, ND — 6 fields, 2,400 ac, mostly clay loam”."}, {"pole": "Cropping history", "opis": "Last 3 years per field, e.g. “Field 3: soybeans 2024, spring wheat 2025, soybeans 2026”."}, {"pole": "Production goals", "opis": "Markets and enterprises, e.g. “sugar beet contract 600 ac, rest corn, soybeans, spring wheat”."}, {"pole": "Problems and limits", "opis": "Weeds, diseases, equipment, labor, e.g. “waterhemp resistant to group 2, white mold in beans, no corn head for 30-in rows”."}, {"pole": "Program commitments", "opis": "Contracts and practices, e.g. “EQIP contract with practice 328 and 340 [VERIFY WITH NRCS]”."}, {"pole": "Plan horizon", "opis": "Years and start, e.g. “5 years, 2027–2031”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who designs practical crop rotations for row crop and small grain operations. Build a multi-year rotation plan from my data.\n\nINPUT:\nGrower and fields: [GROWER AND FIELDS]\nCropping history: [CROPPING HISTORY]\nProduction goals: [PRODUCTION GOALS]\nProblems and limits: [PROBLEMS AND LIMITS]\nProgram commitments: [PROGRAM COMMITMENTS]\nPlan horizon: [PLAN HORIZON]\n\nRULES:\n1. Check the input first. If anything important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Respect the contracts, acreage and program commitments I list; any program rule I did not give you is marked [VERIFY WITH NRCS] — never invent practice requirements or payment rates.\n3. Explain each sequence in one line (disease break, weed control, N credit, workload).\n4. Flag conflicts such as host crops back to back, herbicide carryover from my records, or a contract acreage not met.\n5. Never invent rates, critical soil test levels, label numbers, prices, legal limits, setbacks or program rules — use only the numbers I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION] and anything to check against the current rules, label, lab or land-grant guidance [VERIFY].\n6. Show every calculation step by step with units, so I can check it on a calculator. Use the units I give you (lb/ac and ac, or kg/ha and ha).\n\nOUTPUT FORMAT:\nA) Field-by-year table for the full horizon.\nB) Crop acres per year and check against contracts and goals.\nC) Reasons for each sequence and the main risks.\nD) Conflicts and how to handle them.\nE) Open [TO FILL IN] and [VERIFY] items.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Add a cover crop in every gap where one fits and say when to seed it.", "Show a version without sugar beets for comparison.", "Check that crop acres per year stay within my contract numbers.", "Flag every herbicide carryover risk from the records I paste.", "Make a simple map-style list by field for the shop wall.", "Write the rotation narrative for my NRCS conservation plan.", "Show the workload per month at planting and harvest.", "Rework the plan if one field goes to a cash rent tenant.", "Add an alternative if spring is too wet to plant wheat.", "List the information I still need from the grower."], "checklista": ["Every field has a crop for every year of the horizon.", "Contract acres are met each year.", "No host crop back to back where the problem list says not to.", "Herbicide carryover from previous seasons checked against labels [CHECK LABEL].", "Program practice requirements confirmed with NRCS [VERIFY WITH NRCS].", "Equipment and labor can handle the crop mix."], "uwaga": "NRCS practice standards and contract terms are set locally. The app does not state them — confirm with your NRCS field office before committing a rotation in a contract.", "przyklad": {"wejscie": "Hoffman brothers, Red River Valley, six fields, 2,400 acres. We have a beet contract for 600 acres a year. Field 3 has been beans, wheat, beans. White mold has been bad in beans and the waterhemp is group 2 resistant. They want to stay with corn, beans, spring wheat and beets. They signed EQIP with conservation crop rotation and cover crops but I don't have the exact rules here. Give me a five-year plan for 2027 through 2031 by field, and tell me where the problems are.", "wynik": "ROTATION PLAN 2027–2031 — Hoffman Brothers (excerpt, fields 1–3)\n\nA) Field by year\n| Field | Acres | 2027 | 2028 | 2029 | 2030 | 2031 |\n| 1 | [TO FILL IN] | sugar beets | spring wheat | soybeans | corn | spring wheat |\n| 2 | [TO FILL IN] | corn | sugar beets | spring wheat | soybeans | corn |\n| 3 | [TO FILL IN] | corn | spring wheat | sugar beets | spring wheat | soybeans |\n\nB) Acres check\nBeet acres per year must equal 600 ac; field acres are missing, so the check is open [TO FILL IN: acres per field].\n\nC) Reasons\n- Field 3 leaves soybeans for 4 years after beans-wheat-beans to break the white mold cycle [ASSUMPTION: break length to confirm with extension].\n- Wheat before beets spreads the workload and gives a fall window for a cover crop.\n- Corn adds a different herbicide program for group 2 resistant waterhemp.\n\nD) Conflicts\n- Herbicide carryover to sugar beets from previous corn or wheat programs [CHECK LABEL].\n- Whether the rotation meets the EQIP practice 328 and 340 requirements [VERIFY WITH NRCS].\n\nE) Open items: acres per field, herbicide records for 2025–2026, cover crop species allowed in the contract [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "2.06", "nazwa": "Planting Plan: Hybrid, Date and Seeding Rate", "tag": "PLANTING PLAN", "co_robi": "Builds a planting plan per field: hybrid or variety, planting window, target seeding rate, seeds per acre to bags and planter settings. Rates and dates come only from seed company data, university guidance and the field conditions you give.", "kiedy": "Before planting, when seed is booked and you need to assign hybrids to fields, set seeding rates per zone and know how many units to have in the shed.", "brief": [{"pole": "Field and soils", "opis": "Field, acres and productivity zones, e.g. “Creek field, 112 ac, McLean County, IL; high zone 70 ac, low zone 42 ac”."}, {"pole": "Crop and hybrid", "opis": "Crop, hybrid or variety and maturity, e.g. “corn, Seed company hybrid 111-day [product from seed guide]”."}, {"pole": "Seed company data", "opis": "What the seed guide or agronomist says, e.g. “seed guide: target 34,000 seeds/ac high productivity, 30,000 low; good on poorly drained soils”."}, {"pole": "Seed lot", "opis": "Units, germination, seeds per unit, e.g. “80,000-seed units, germ 95% on the tag”."}, {"pole": "Planter and timing", "opis": "Planter, row spacing, planting window, e.g. “16-row 30-in planter with VR drives; plan April 25 – May 10 [VERIFY crop insurance earliest planting date]”."}, {"pole": "Field conditions", "opis": "Soil temp, moisture, residue, e.g. “soybean stubble, no-till, tile drained, cold wet spots in low zone”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who builds planting plans and seeding rate prescriptions with growers and seed reps. Build a planting plan from my data.\n\nINPUT:\nField and soils: [FIELD AND SOILS]\nCrop and hybrid: [CROP AND HYBRID]\nSeed company data: [SEED COMPANY DATA]\nSeed lot: [SEED LOT]\nPlanter and timing: [PLANTER AND TIMING]\nField conditions: [FIELD CONDITIONS]\n\nRULES:\n1. Check the input first. If anything important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Take seeding rates only from the seed company data or university guidance I give you; if missing, mark [TO FILL IN: seeding rate source].\n3. Convert target stand to seeds per acre using the germination and expected emergence I give you, then to units per field.\n4. Planting dates must respect crop insurance earliest and final planting dates for the county — I give them, otherwise mark [VERIFY WITH YOUR CROP INSURANCE AGENT].\n5. Never invent rates, critical soil test levels, label numbers, prices, legal limits, setbacks or program rules — use only the numbers I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION] and anything to check against the current rules, label, lab or land-grant guidance [VERIFY].\n6. Show every calculation step by step with units, so I can check it on a calculator. Use the units I give you (lb/ac and ac, or kg/ha and ha).\n\nOUTPUT FORMAT:\nA) Field table: zone, acres, hybrid or variety, target seeding rate, source.\nB) Calculation of units needed per zone and per field.\nC) Planting window and order of fields.\nD) Planter settings and checks before rolling.\nE) Open [TO FILL IN] and [VERIFY] items.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Make a variable-rate seeding prescription table by zone.", "Recalculate units if germination on the tag is lower.", "Plan the planting order across all fields by soil temperature and drainage.", "Compare a flat rate with the zone rates and show the seed cost difference.", "Add a replant decision checklist using the guidance I give you.", "Do the same plan for soybeans in 15-in rows.", "Write a one-page sheet for the planter operator.", "Add stand count instructions for checking emergence.", "Show what changes if planting slips past the date I give you.", "List what I still need from the seed rep."], "checklista": ["Seeding rates come from the seed guide or university data, with the source named.", "Germination comes from the actual seed tag.", "Units ordered cover the acres plus a small buffer.", "Planting window fits the crop insurance dates for the county [VERIFY].", "Hybrid maturity fits the field's location and planting window.", "Planter calibration and VR file checked before planting."], "uwaga": "Seeding rates, planting dates and replant rules depend on the seed company, your state and your crop insurance policy. Confirm earliest and final planting dates with your crop insurance agent.", "przyklad": {"wejscie": "Creek field, 112 acres, McLean County. Corn on bean stubble, no-till, tiled. Two zones from yield maps: high is 70 acres, low is 42, the low one stays cold and wet. Hybrid is a 111-day from the seed guide, they recommend 34,000 on high productivity and 30,000 on low. Units are 80,000 seeds, tag says germ 95. Planter is a 16-row 30-inch with VR drives. We want to go April 25 to May 10 if soil warms up. How many units do I need and what do I put in the prescription?", "wynik": "PLANTING PLAN — Creek field (112 ac), corn on soybean stubble\n\nA) Zones\n| Zone | Acres | Hybrid | Target rate | Source |\n| High | 70 | 111-day [product from seed guide] | 34,000 seeds/ac | seed guide |\n| Low | 42 | same | 30,000 seeds/ac | seed guide |\n\nB) Units\nNote: seed guide rates are seeds dropped per acre [ASSUMPTION — confirm with seed rep whether germination is already factored in].\n1. High: 70 × 34,000 = 2,380,000 seeds ÷ 80,000 = 29.75 units\n2. Low: 42 × 30,000 = 1,260,000 seeds ÷ 80,000 = 15.75 units\n3. Total: 45.5 units → order 46–47 units with buffer\n\nC) Planting window\n- Plan April 25 – May 10; start in the high zone and leave the cold, wet low zone for last.\n- Earliest planting date for replant coverage [VERIFY WITH YOUR CROP INSURANCE AGENT].\n- Minimum soil temperature trigger [TO FILL IN: from seed company or extension].\n\nD) Planter\n- Load 34,000 and 30,000 in the VR prescription by zone; check the zone file matches the field boundary.\n- Check seed meters and downforce for no-till before rolling.\n\nE) Open items: whether the 95% germination changes the dropped rate [VERIFY with seed rep]; replant guidance [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "2.07", "nazwa": "Manure Management Plan", "tag": "MANURE PLAN", "co_robi": "Builds a manure application plan for a livestock operation: how much manure is produced, how much N, P2O5 and K2O it supplies from a manure analysis, which fields can take it and how much. Setbacks, timing restrictions and P limits come only from the state rules and permit you provide.", "kiedy": "Before the fall or spring pump-out, when a CAFO or AFO plan has to be updated, or when a grower wants to stop guessing the fertilizer value of manure.", "brief": [{"pole": "Operation and livestock", "opis": "Species, head and housing, e.g. “Jensen Hog Farm, Iowa, 2,400-head wean-to-finish, deep pit”."}, {"pole": "Manure volume", "opis": "Storage and volume per year, e.g. “deep pit, about 1.1 million gal per year from pumping records”."}, {"pole": "Manure analysis", "opis": "Lab results and availability factors from your guidance, e.g. “lab: 52 lb total N, 38 lb P2O5, 34 lb K2O per 1,000 gal; first-year N availability from ISU table”."}, {"pole": "Receiving fields", "opis": "Fields, acres, crop, soil test P, e.g. “North 80 (78 ac) corn, soil P 28 ppm Mehlich-3; Creek field (112 ac) corn”."}, {"pole": "Setbacks and timing rules", "opis": "Your state or permit rules, e.g. “separation distances from wells and streams, frozen-ground rules from my state permit [VERIFY WITH YOUR STATE]”."}, {"pole": "Equipment and timing", "opis": "Application method and window, e.g. “custom applicator, drag hose injection, fall after soil temps drop”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who writes manure management plans for livestock operations and works with state permits and NRCS 590. Build a manure application plan from my data.\n\nINPUT:\nOperation and livestock: [OPERATION AND LIVESTOCK]\nManure volume: [MANURE VOLUME]\nManure analysis: [MANURE ANALYSIS]\nReceiving fields: [RECEIVING FIELDS]\nSetbacks and timing rules: [SETBACKS AND TIMING RULES]\nEquipment and timing: [EQUIPMENT AND TIMING]\n\nRULES:\n1. Check the input first. If anything important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Use only the nutrient content from my manure analysis and the availability factors I give you; if missing, mark [TO FILL IN: manure analysis] or [TO FILL IN: availability factor].\n3. Setbacks, application bans, frozen-ground rules and P-based limits come only from my state rules or permit — never state a distance or a date yourself; mark them [VERIFY WITH YOUR STATE].\n4. Calculate the gal per acre that meets the crop N need I give you and show the P2O5 and K2O that come with it.\n5. Never invent rates, critical soil test levels, label numbers, prices, legal limits, setbacks or program rules — use only the numbers I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION] and anything to check against the current rules, label, lab or land-grant guidance [VERIFY].\n6. Show every calculation step by step with units, so I can check it on a calculator. Use the units I give you (lb/ac and ac, or kg/ha and ha).\n\nOUTPUT FORMAT:\nA) Manure produced and nutrients available per year.\nB) Field table: crop N need, gal per acre, acres, total gal, nutrients supplied.\nC) Check that all manure has a place and no field is over the limits I gave.\nD) Setbacks and timing rules as given, with sources.\nE) Open [TO FILL IN] and [VERIFY] items.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Spread the manure over all my fields and show what is left over.", "Recalculate with the new manure analysis I will paste.", "Show the commercial fertilizer still needed after manure on each field.", "Calculate the fertilizer value of the manure at the prices I give you.", "Make a field sheet for the custom applicator with gal per acre and setbacks.", "Switch from injection to surface application and show the change in available N.", "Check every field against the P-based limit in my permit.", "Add a record sheet for each application date, field and volume.", "Write a summary for the grower's lender or landlord.", "List what I still need for the annual permit report."], "checklista": ["Manure analysis is recent and representative of the storage.", "Availability factors come from a named land-grant source.", "Setbacks and timing restrictions come from the current state rules or permit [VERIFY WITH YOUR STATE].", "Fields with high soil test P checked against the P limit in the plan.", "Total volume applied matches storage records.", "Application records ready for the annual report or inspection."], "uwaga": "Manure setbacks, frozen and saturated ground rules and P limits are set by your state and your permit. The app never states them — take them from your state agency, permit or NRCS and check before every application season.", "przyklad": {"wejscie": "Jensen hog farm, 2,400 head wean-to-finish, deep pit. Pumping records say about 1.1 million gallons a year. Lab came back 52 total N, 38 P2O5, 34 K2O per thousand gallons. I'm using the ISU first-year availability for injected swine manure, which I have as 100 percent for this calc. Fields are North 80, 78 acres, and Creek field, 112, both going to corn. Corn N need I'm planning 140 pounds. Custom guy injects in the fall. I don't have the setback list in front of me. How many gallons per acre and does it all fit?", "wynik": "MANURE PLAN — Jensen Hog Farm, fall application\n\nA) Manure available\n1.1 million gal × 52 lb N / 1,000 gal = 57,200 lb total N\nAvailable N: 52 lb per 1,000 gal × 100% [VERIFY availability factor in ISU table] = 52 lb per 1,000 gal\n\nB) Rate to meet N need\nCorn N need 140 lb N/ac ÷ 52 lb per 1,000 gal = 2,692 gal/ac → round to 2,700 gal/ac\n| Field | Acres | gal/ac | Total gal | P2O5 lb/ac | K2O lb/ac |\n| North 80 | 78 | 2,700 | 210,600 | 2.7 × 38 = 102.6 | 2.7 × 34 = 91.8 |\n| Creek field | 112 | 2,700 | 302,400 | 102.6 | 91.8 |\n| Total | 190 | | 513,000 | | |\n\nC) Does it fit?\n1,100,000 − 513,000 = 587,000 gal with no field assigned. You need about 587,000 ÷ 2,700 = 217 more acres [TO FILL IN: additional receiving fields].\n\nD) Rules\n- Separation distances from wells, streams, tile inlets and residences [VERIFY WITH YOUR STATE].\n- Fall timing and soil temperature, frozen or snow-covered ground restrictions [VERIFY WITH YOUR STATE].\n- North 80 soil P 28 ppm — check the P-based limit in your plan or permit [VERIFY].\n\nE) Open items: setback list, receiving fields for the rest of the pit, application record forms [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "2.08", "nazwa": "Foliar and Micronutrient Plan", "tag": "FOLIAR PLAN", "co_robi": "Decides whether a foliar or micronutrient application makes sense, based on tissue tests, soil tests and symptoms in the field. It plans timing by growth stage, tank-mix fit with planned sprays and products, with rates taken only from the label.", "kiedy": "In season, when the grower sees yellowing or striping, a tissue test comes back low, or a rep pitches a foliar product and you need an objective answer.", "brief": [{"pole": "Field and crop", "opis": "Field, crop and stage, e.g. “Creek field, soybeans, R1 at the time of the call”."}, {"pole": "Tissue and soil tests", "opis": "Results with sampling details and lab ranges, e.g. “tissue test, uppermost trifoliate at R1: Mn 18 ppm, lab sufficiency range on report; soil pH 7.4”."}, {"pole": "Field symptoms", "opis": "What you see and where, e.g. “interveinal yellowing on high-pH knolls, about 15% of the field”."}, {"pole": "Planned sprays", "opis": "Herbicides and fungicides already planned, e.g. “fungicide at R3, glyphosate pass not planned”."}, {"pole": "Available products", "opis": "Products and labels you have, e.g. “manganese sulfate foliar product, label attached [CHECK LABEL]”."}, {"pole": "Timing and growth stage", "opis": "Window you are planning, e.g. “apply in the next 7 days, before R2”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who uses tissue and soil tests to decide on foliar and micronutrient applications without overselling products. Build a foliar and micronutrient plan from my data.\n\nINPUT:\nField and crop: [FIELD AND CROP]\nTissue and soil tests: [TISSUE AND SOIL TESTS]\nField symptoms: [FIELD SYMPTOMS]\nPlanned sprays: [PLANNED SPRAYS]\nAvailable products: [AVAILABLE PRODUCTS]\nTiming and growth stage: [TIMING AND GROWTH STAGE]\n\nRULES:\n1. Check the input first. If anything important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Judge deficiency only with the sufficiency ranges from my lab or land-grant guidance; if missing, mark [TO FILL IN: sufficiency range].\n3. Take product rates, water volumes, tank-mix compatibility and restrictions only from the label I give you; otherwise mark [CHECK LABEL].\n4. Separate what the data supports from what is a guess, and say clearly when no application is justified.\n5. Never invent rates, critical soil test levels, label numbers, prices, legal limits, setbacks or program rules — use only the numbers I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION] and anything to check against the current rules, label, lab or land-grant guidance [VERIFY].\n6. Show every calculation step by step with units, so I can check it on a calculator. Use the units I give you (lb/ac and ac, or kg/ha and ha).\n\nOUTPUT FORMAT:\nA) Decision table: nutrient, test value, range, source, conclusion.\nB) Recommendation: apply, monitor or no application, with reasons.\nC) Application plan: product, rate from label, stage, tank mix, acres.\nD) Follow-up: what to check after application.\nE) Open [TO FILL IN] and [CHECK LABEL] items.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Compare the cost of the foliar pass with the value at the yield and price I give you.", "Add a strip-trial design to test the product on this field.", "Check tank-mix compatibility with the fungicide I plan to use.", "Plan a jar test procedure before mixing.", "Write a short reply to the rep who pitched the product.", "Make a tissue sampling plan to confirm the result.", "Map which zones need it and which don't from my notes.", "Explain to the grower why soil pH causes this deficiency.", "Add a soil-applied option for next year based on the guidance I give you.", "List which results I still need from the lab."], "checklista": ["Tissue sample taken at the right stage and plant part for the ranges used.", "Sufficiency ranges are from the lab or land-grant source.", "Product rate and restrictions taken from the label [CHECK LABEL].", "Tank-mix compatibility confirmed on the label or with a jar test.", "The decision says plainly whether the data supports applying.", "Untreated check strip planned to see if it paid."], "uwaga": "Foliar product rates, mixing and restrictions come from the label — the label is the law. The app does not give rates; check the product label and your land-grant guidance.", "przyklad": {"wejscie": "Creek field, soybeans, they're at R1. Grower called about yellow between the veins on the high-pH knolls, maybe 15 percent of the field. I pulled tissue, top trifoliate, manganese came back 18 ppm and the lab report lists sufficiency starting at 20. Soil pH on those knolls is 7.4. Fungicide is planned at R3. Rep is pushing a manganese foliar product, I have the label. Do we spray now or wait and tank-mix at R3? He doesn't want to pay for a pass that does nothing, so tell me straight if the numbers don't support it.", "wynik": "FOLIAR AND MICRONUTRIENT PLAN — Creek field, soybeans (R1)\n\nA) Decision table\n| Nutrient | Value | Sufficiency | Source | Conclusion |\n| Mn | 18 ppm | starts at 20 ppm | lab report [VERIFY sampling stage matches range] | below range |\n| Soil pH | 7.4 | — | soil test | high pH limits Mn availability |\n\nB) Recommendation\nThe tissue test and symptoms both point to manganese deficiency on the high-pH knolls. Treat the affected zones (about 15% of the field) [ASSUMPTION: zones can be mapped and sprayed separately], not necessarily the whole field.\n\nC) Application plan\n| Item | Detail |\n| Product | manganese foliar product from the label |\n| Rate | [CHECK LABEL] |\n| Water volume | [CHECK LABEL] |\n| Timing | now, at R1, rather than waiting for R3 — symptoms are active |\n| Tank mix with R3 fungicide | only if a second pass is needed; compatibility [CHECK LABEL] and jar test |\n\nD) Follow-up\n- Leave an untreated check strip on a knoll.\n- Look for green-up in 7–10 days [VERIFY with extension guidance].\n- A second application may be needed if new growth shows symptoms [CHECK LABEL for repeat applications].\n\nE) Open items: label rate and restrictions [CHECK LABEL]; exact acres of affected zones [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "2.09", "nazwa": "Crop Mix and Season Production Plan", "tag": "PRODUCTION PLAN", "co_robi": "Builds the season's crop mix and production plan: which crop on how many acres, expected production, gross revenue and the main input needs, based on the grower's yields, prices, contracts and limits. It compares scenarios without inventing prices or yields.", "kiedy": "In fall and winter, when the grower is deciding corn vs. soybeans acres, booking inputs and talking to the ag lender about operating money.", "brief": [{"pole": "Operation and resources", "opis": "Acres, equipment, labor, storage, e.g. “Miller Farms, Story County, IA — 1,850 ac, 60,000 bu storage, two full-time people”."}, {"pole": "Fields and tenure", "opis": "Owned and rented fields, e.g. “1,200 ac cash rent, 650 ac owned; rotation history attached”."}, {"pole": "Crops planned", "opis": "Crop options, e.g. “corn and soybeans, maybe 150 ac seed beans”."}, {"pole": "Yields and prices", "opis": "Grower's yield history and price assumptions, e.g. “APH corn 205, beans 60; new-crop bids $4.40 corn, $10.60 beans”."}, {"pole": "Markets and contracts", "opis": "Contracts and delivery, e.g. “30,000 bu corn forward-sold, seed bean contract pays premium [TO FILL IN]”."}, {"pole": "Constraints", "opis": "Limits to respect, e.g. “operating line limit from Farm Credit, no more than 1,100 ac corn for the dryer”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who builds annual production plans for growers and works with their ag lenders. Build a crop mix and season production plan from my data.\n\nINPUT:\nOperation and resources: [OPERATION AND RESOURCES]\nFields and tenure: [FIELDS AND TENURE]\nCrops planned: [CROPS PLANNED]\nYields and prices: [YIELDS AND PRICES]\nMarkets and contracts: [MARKETS AND CONTRACTS]\nConstraints: [CONSTRAINTS]\n\nRULES:\n1. Check the input first. If anything important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Use only the yields, prices, costs and contract terms I give you; any missing price or cost is [TO FILL IN], never a market number you picked.\n3. Show at least two crop mix scenarios and their production, revenue and main input needs.\n4. Check each scenario against the constraints I list (storage, dryer, labor, lender limit, rotation).\n5. Never invent rates, critical soil test levels, label numbers, prices, legal limits, setbacks or program rules — use only the numbers I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION] and anything to check against the current rules, label, lab or land-grant guidance [VERIFY].\n6. Show every calculation step by step with units, so I can check it on a calculator. Use the units I give you (lb/ac and ac, or kg/ha and ha).\n\nOUTPUT FORMAT:\nA) Acres by crop and field group for each scenario.\nB) Expected production and gross revenue step by step.\nC) Main input needs (seed, N, P and K, crop protection) as quantities, with costs only where I gave prices.\nD) Constraint check and comparison of scenarios.\nE) Open [TO FILL IN] and [VERIFY] items.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Add a third scenario with more soybeans.", "Show revenue at prices 10% lower than the bids I gave.", "Add input costs per acre from the budget I paste.", "Calculate the break-even price for each crop at my costs.", "Make a one-page summary for the ag lender.", "Check storage needs against my bins at harvest.", "Show how much of the crop is already sold by scenario.", "Plan the planting and harvest workload by week.", "Write the acreage summary I need for FSA reporting [VERIFY dates with FSA].", "List the information I still need from the grower."], "checklista": ["Yields come from the grower's records or APH, not a guess.", "Prices are the grower's current bids or contract prices, with a date.", "Total acres match FSA records.", "Rotation constraints from the field history are respected.", "Storage, dryer and labor limits checked for each scenario.", "Scenario numbers reviewed with the grower before going to the lender."], "uwaga": "", "przyklad": {"wejscie": "Miller Farms, 1,850 acres in Story County. 1,200 rented, 650 owned. They have dryer capacity for about 1,100 acres of corn. Yields from APH: corn 205, beans 60. New-crop bids today, corn 4.40, beans 10.60. They forward-sold 30,000 bushels of corn. Thinking 1,000 corn and 850 beans, or flip toward 1,100 corn. Need two scenarios with production and gross revenue for the Farm Credit meeting next week. Costs I'll add later, I just need the production side and how much of the corn is already covered. Also flag anything that bumps into the dryer limit.", "wynik": "SEASON PRODUCTION PLAN — Miller Farms (1,850 ac)\n\nA) Scenarios\n| | Scenario 1 | Scenario 2 |\n| Corn | 1,000 ac | 1,100 ac |\n| Soybeans | 850 ac | 750 ac |\n\nB) Production and revenue\nScenario 1\n1. Corn: 1,000 × 205 = 205,000 bu × $4.40 = $902,000\n2. Beans: 850 × 60 = 51,000 bu × $10.60 = $540,600\n3. Gross revenue: $1,442,600\nScenario 2\n1. Corn: 1,100 × 205 = 225,500 bu × $4.40 = $992,200\n2. Beans: 750 × 60 = 45,000 bu × $10.60 = $477,000\n3. Gross revenue: $1,469,200\nDifference: +$26,600 for scenario 2, before costs [TO FILL IN: cost per acre by crop].\n\nC) Sales coverage\n30,000 bu forward-sold = 14.6% of corn in scenario 1, 13.3% in scenario 2.\n\nD) Constraints\n| Check | Scenario 1 | Scenario 2 |\n| Dryer (1,100 ac corn) | OK | at the limit |\n| Rotation (corn on corn acres) | [TO FILL IN] | [TO FILL IN] |\n| Operating line | [TO FILL IN] | [TO FILL IN] |\n\nE) Notes for the lender meeting\nScenario 2 brings more gross revenue but uses all dryer capacity and likely adds corn-on-corn acres with higher N and costs [VERIFY with field history]. Revenue uses today's bids [ASSUMPTION: prices as of the meeting date].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "2.10", "nazwa": "Hybrid and Variety Selection From Trials", "tag": "VARIETY SELECTION", "co_robi": "Compares hybrids or varieties using university and state variety trial results, seed company plot data and the grower's own strips, and builds a short list per field. It weighs yield stability across locations and years, disease ratings and maturity, without inventing ratings or yields.", "kiedy": "In late fall, when trial results are published and the grower has to book seed, or when a rep's plot data needs an independent second look.", "brief": [{"pole": "Farm and conditions", "opis": "Location, soils, management, e.g. “Dave Jensen, south-central Nebraska, irrigated and dryland, silt loam”."}, {"pole": "Crop and market", "opis": "Crop and end use, e.g. “soybeans, commodity market, 2.8–3.2 RM range”."}, {"pole": "Trial results", "opis": "University or state trial data you paste, e.g. “UNL variety test 2025 and 2026, irrigated sites, yield and rank by entry”."}, {"pole": "Candidates", "opis": "Hybrids or varieties under consideration, e.g. “five varieties from three seed companies, with RM and traits”."}, {"pole": "Selection criteria", "opis": "What matters most, e.g. “yield stability, SCN resistance source, white mold rating, standability”."}, {"pole": "Own plot data", "opis": "Grower or seed company strips, e.g. “side-by-side strips on Pivot 2 in 2026, weigh wagon data”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who helps growers choose hybrids and varieties with independent trial data. Build a variety selection from my data.\n\nINPUT:\nFarm and conditions: [FARM AND CONDITIONS]\nCrop and market: [CROP AND MARKET]\nTrial results: [TRIAL RESULTS]\nCandidates: [CANDIDATES]\nSelection criteria: [SELECTION CRITERIA]\nOwn plot data: [OWN PLOT DATA]\n\nRULES:\n1. Check the input first. If anything important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Use only the trial results, ratings and plot data I paste, with the source and year; never fill in a missing rating or yield — mark [TO FILL IN].\n3. Compare entries only within the same trial and location set, and favor results repeated across sites and years over a single plot.\n4. Treat seed company plot data and single strips as supporting evidence, and say so.\n5. Never invent rates, critical soil test levels, label numbers, prices, legal limits, setbacks or program rules — use only the numbers I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION] and anything to check against the current rules, label, lab or land-grant guidance [VERIFY].\n6. Show every calculation step by step with units, so I can check it on a calculator. Use the units I give you (lb/ac and ac, or kg/ha and ha).\n\nOUTPUT FORMAT:\nA) Comparison table: entry, RM, yield or rank by site and year, key ratings, source.\nB) Stability and risk notes per candidate.\nC) Short list per field type with reasons.\nD) What to test in the grower's own strips next season.\nE) Open [TO FILL IN] and [VERIFY] items.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Add the 2024 trial results I will paste and redo the ranking.", "Rank the candidates only on dryland sites.", "Show the seed cost per acre difference at the prices I give you.", "Make a placement plan by field from the short list.", "Design a side-by-side strip trial for next year.", "Write a short summary for the grower to take to the seed meeting.", "Flag candidates that share the same SCN resistance source.", "Compare my strip data with the university results.", "Show which candidates have only one year of data.", "List the trial data I still need."], "checklista": ["Every number has a source: trial, year and site.", "Entries are compared within the same trial and sites.", "Multi-year and multi-site results weigh more than single plots.", "Disease and agronomic ratings come from the trial or seed guide, not memory.", "Maturity fits the farm's location and planting window.", "Seed company data is labeled as such."], "uwaga": "", "przyklad": {"wejscie": "Dave Jensen, south-central Nebraska, irrigated silt loam. He's picking soybeans, 2.8 to 3.2 maturity. From the UNL irrigated trials I have three entries that were in both 2025 and 2026: Variety A was 3rd in 2025 and 4th in 2026, Variety B was 1st in 2025 and 14th in 2026, Variety C was 6th and 5th. Variety D the rep likes, it only shows up in their company plots, two locations. He had a white mold problem on Pivot 2. I don't have white mold ratings for all of them. Which ones go on the short list?", "wynik": "VARIETY SELECTION — Dave Jensen, irrigated soybeans (2.8–3.2 RM)\n\nA) Comparison\n| Entry | Source | 2025 rank | 2026 rank | White mold rating | Note |\n| Variety A | UNL irrigated | 3 | 4 | [TO FILL IN] | consistent |\n| Variety B | UNL irrigated | 1 | 14 | [TO FILL IN] | unstable |\n| Variety C | UNL irrigated | 6 | 5 | [TO FILL IN] | consistent |\n| Variety D | seed company plots, 2 sites | — | — | [TO FILL IN] | company data only |\n\nB) Stability and risk\n- A and C stayed near the top in both years: the most dependable picks.\n- B won 2025 but dropped to 14th in 2026: strong upside, higher risk.\n- D has no independent data; treat it as a test entry.\n\nC) Short list\n1. Variety A — main acres [VERIFY white mold rating before Pivot 2].\n2. Variety C — second choice and to spread risk.\n3. Variety B — limited acres only, on fields without white mold history [ASSUMPTION].\n\nD) Own strips next season\nPut D side by side with A on one pivot, with weigh wagon data.\n\nE) Open items: white mold and SCN ratings per entry [TO FILL IN]; RM of each entry [VERIFY with trial report].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}]}, {"dzial_nr": 3, "dzial": "Costs, Budgets & Margins", "opis": "Agronomy ends in the field, but the decision gets made at the kitchen table: what a bushel costs, whether a bid covers it, whether to rent the ground, buy the machine or store the grain. You enter your own invoices, bids and yields and get a step-by-step calculation to check — without a single made-up number.", "skills": [{"id": "3.01", "nazwa": "Cost of Production per Acre", "tag": "COST PER ACRE", "co_robi": "Builds a crop enterprise budget from the grower's own invoices and plans: every cost line in $/ac, $ per field and $/bu. Separates direct inputs from machinery and other costs so you can see exactly where the money goes.", "kiedy": "In the winter planning window, or when a grower asks what a bushel really costs him and the invoices are sitting in a folder on the pickup dash.", "brief": [{"pole": "Grower and crop", "opis": "Grower, crop, field, acres, county, e.g. “Miller Farms, corn on the Home quarter, 155 ac, Story County, IA”."}, {"pole": "Direct input costs", "opis": "Seed, fertilizer, crop protection in $/ac from invoices or the plan, e.g. “seed $118/ac, fertilizer $165/ac, chemicals $62/ac”."}, {"pole": "Machinery and custom work", "opis": "Fuel, repairs, custom application or harvest, e.g. “fuel and repairs $38/ac from my records, custom spraying $14/ac”."}, {"pole": "Other costs", "opis": "Crop insurance premium, drying, interest, cash rent, hired labor, e.g. “crop insurance $24/ac, drying $30/ac, operating interest $12/ac, land is owned”."}, {"pole": "Expected yield", "opis": "Your yield history or plan, e.g. “205 bu/ac, my 3-year APH-style average on that field”."}, {"pole": "Purpose", "opis": "Why you are running the numbers, e.g. “for the ag lender meeting” or “to know what price I need”."}], "prompt": "You are an experienced independent agronomist and farm management advisor (CCA) who builds crop enterprise budgets with growers every winter. Prepare a cost of production budget for one crop.\n\nINPUT:\nGrower and crop: [GROWER AND CROP]\nDirect input costs: [DIRECT INPUT COSTS]\nMachinery and custom work: [MACHINERY AND CUSTOM WORK]\nOther costs: [OTHER COSTS]\nExpected yield: [EXPECTED YIELD]\nPurpose: [PURPOSE]\n\nRULES:\n1. Check the data first. If anything important is missing, ask me at most 6 short questions and wait for my answers.\n2. Do not invent prices, yields, rates, program payments, insurance figures or “typical” values. Work only with my numbers. Mark missing data [TO FILL IN], anything you assume [ASSUMPTION], anything uncertain [VERIFY].\n3. Show every calculation step by step with units ($/ac, $/bu, bu/ac, ac) and round only the final result.\n4. Group costs: direct inputs, machinery and custom work, other costs. Show every line in $/ac and $ for the whole field, plus its share of total cost.\n5. Cost per bushel = total $/ac divided by expected yield. If I gave no yield, do not guess one.\n6. State clearly what the budget leaves out (depreciation, unpaid family labor, land charge on owned ground, management), so nobody compares it with a full-cost budget from extension or the lender.\n\nOUTPUT FORMAT:\nA) Cost table | item | $/ac | $/field | share % |.\nB) Totals in $/ac, $/field and $/bu, with the math shown.\nC) The three biggest cost lines and one question worth asking about each.\nD) List of gaps and assumptions to close before the budget is used.\n\nEnd with: “This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Add machinery depreciation using the values I give you.", "Recalculate cost per bushel for a yield 20 bu/ac lower and 20 bu/ac higher.", "Break fertilizer out by product, rate and timing from my nutrient plan.", "Turn this into a one-page budget for my ag lender.", "Compare this budget with last year's, which I will paste in.", "Add a land charge for owned ground at the figure I give you.", "Scale the budget to all my corn acres on the farm.", "Flag any line that looks unusual and should be checked against invoices.", "Format the table so I can paste it into Excel.", "Write a three-sentence summary for the grower."], "checklista": ["Every dollar figure comes from invoices, retailer quotes or the grower's plan, not from the AI's memory.", "Units are consistent: $/ac, $/field, $/bu, with no mixing of per-unit and per-acre prices.", "Field acres match the FSA-578 acreage report or the grower's maps.", "The yield used for cost per bushel is realistic for that field's history.", "The budget states what it does not include (depreciation, own labor, land charge).", "All [TO FILL IN] gaps are closed before the budget goes to the lender."], "uwaga": "The budget is only as good as the grower's numbers. Check whether input invoices include prepay discounts, finance charges or sales tax — the AI does not know the operation's tax situation; that is a question for the accountant or tax preparer.", "przyklad": {"wejscie": "Okay, Miller Farms, corn on the Home quarter, 155 acres, Story County. We own that ground, so no rent. Off the invoices per acre I've got seed 118, fertilizer 165 all in, chemicals 62. Fuel and repairs I figure about 38 an acre from my records. Custom spraying from the co-op was 14 an acre. Crop insurance premium came to 24, drying about 30 an acre last fall, and interest on the operating line works out to around 12. Yield, put me at 205, that's my three-year average on that field. Leave out depreciation, I don't have the machinery values written down, and don't count my own labor. I just want to know what a bushel costs me before I start booking any sales, and something I can show my son and the lender.", "wynik": "COST OF PRODUCTION — Corn, Home quarter, 155 ac, Story County, IA\n\n| item | $/ac | $/field | share % |\n| seed | 118 | 18,290 | 25.5 |\n| fertilizer | 165 | 25,575 | 35.6 |\n| chemicals | 62 | 9,610 | 13.4 |\n| fuel and repairs | 38 | 5,890 | 8.2 |\n| custom spraying | 14 | 2,170 | 3.0 |\n| crop insurance | 24 | 3,720 | 5.2 |\n| drying | 30 | 4,650 | 6.5 |\n| operating interest | 12 | 1,860 | 2.6 |\n| TOTAL | 463 | 71,765 | 100 |\n\nMath:\n1. Direct inputs: 118 + 165 + 62 = $345/ac\n2. Machinery and custom: 38 + 14 = $52/ac\n3. Other: 24 + 30 + 12 = $66/ac\n4. Total: 345 + 52 + 66 = $463/ac; × 155 ac = $71,765\n5. Cost per bushel: $463/ac ÷ 205 bu/ac = $2.26/bu\n\nBiggest lines: fertilizer (35.6%) — are rates tied to current soil tests and your state N guidance?; seed (25.5%) — does the seeding rate match the yield environment?; chemicals (13.4%) — how many passes were really needed?\n\nNot included: machinery depreciation [TO FILL IN], own labor [TO FILL IN], land charge on owned ground [TO FILL IN]. Full cost per bushel will be higher than $2.26.\n\n[ASSUMPTION] 205 bu/ac = your 3-year field average.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "3.02", "nazwa": "Gross Margin and Return over Direct Costs", "tag": "GROSS MARGIN", "co_robi": "Calculates gross revenue, direct costs and return over direct costs per acre and for the enterprise. Shows the margin with and without government payments and crop insurance indemnities, so the farm can see whether the crop pays on its own.", "kiedy": "When deciding the crop mix for next year, comparing corn and soybeans, or explaining to a grower why a good-yield year still felt tight.", "brief": [{"pole": "Enterprise and acres", "opis": "Crop, acres, location, e.g. “Hoffman Brothers, soybeans, 320 ac, McLean County, IL”."}, {"pole": "Yield and price", "opis": "Actual or expected yield and the price you used, e.g. “62 bu/ac, contracted at $10.40/bu”."}, {"pole": "Direct costs", "opis": "Seed, fertilizer, chemicals, insurance, trucking, interest in $/ac, e.g. “seed 62, fert 48, chem 55, insurance 18, trucking 8, interest 9”."}, {"pole": "Government payments and indemnities", "opis": "Only figures you have from FSA or your crop insurance agent, e.g. “ARC-CO paid about $22/ac last year, nothing confirmed for this year”."}, {"pole": "Other income", "opis": "Straw, stover, seed premiums, cover crop grazing, e.g. “no other income on this crop”."}, {"pole": "Comparison", "opis": "What to compare against, e.g. “last year's soybean margin was $398/ac”."}], "prompt": "You are an experienced independent agronomist and farm management advisor (CCA) who runs crop margins with growers and their ag lenders. Calculate the gross margin (return over direct costs) for one crop enterprise.\n\nINPUT:\nEnterprise and acres: [ENTERPRISE AND ACRES]\nYield and price: [YIELD AND PRICE]\nDirect costs: [DIRECT COSTS]\nGovernment payments and indemnities: [GOVERNMENT PAYMENTS AND INDEMNITIES]\nOther income: [OTHER INCOME]\nComparison: [COMPARISON]\n\nRULES:\n1. Check the data first. If anything important is missing, ask me at most 6 short questions and wait for my answers.\n2. Do not invent prices, yields, rates, program payments, insurance figures or “typical” values. Work only with my numbers. Mark missing data [TO FILL IN], anything you assume [ASSUMPTION], anything uncertain [VERIFY].\n3. Show every calculation step by step with units ($/ac, $/bu, bu/ac, ac) and round only the final result.\n4. Gross revenue = yield × price, plus other income only if I gave it. Direct costs = only the items I listed.\n5. Show two versions: margin from the market alone, and margin including government payments (ARC/PLC) and crop insurance indemnities. Mark every program or insurance figure [VERIFY] and never estimate one yourself — the numbers come from FSA or the insurance agent.\n6. Do not include fixed costs (depreciation, land, overhead) unless I give them; say clearly this is not net farm income.\n\nOUTPUT FORMAT:\nA) Table | item | $/ac | $/enterprise |.\nB) Return over direct costs without and with payments, math shown.\nC) Comparison with the reference I gave, difference in $/ac.\nD) Gaps, assumptions and items to confirm with FSA or the agent.\n\nEnd with: “This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Run the same margin for corn with the numbers I will give you.", "Show the margin at a price $1.00/bu lower and higher than mine.", "Add fixed costs from the figures I paste so we get a full-cost picture.", "List the questions I should ask the FSA office about this year's ARC/PLC.", "Prepare a short version for the ag lender.", "Compare this field's margin with the farm average I give you.", "Show what share of the margin depends on government payments.", "Recalculate if the crop insurance indemnity I enter is paid.", "Turn the table into a format I can paste into Excel.", "Write two sentences explaining the result to the grower."], "checklista": ["Yield and price come from scale tickets, settlement sheets or contracts.", "Direct costs match the invoices; no fixed costs mixed in.", "ARC/PLC and indemnity figures are confirmed with FSA or the crop insurance agent, not estimated.", "Both versions (with and without payments) are labeled clearly.", "Acres match the FSA-578 acreage report.", "The comparison uses the same cost definition as the reference year."], "uwaga": "Program payments and insurance indemnities depend on current program rules, county data and policy terms. Never treat them as certain income — confirm with the FSA county office and the crop insurance agent before anyone budgets on them.", "przyklad": {"wejscie": "Hoffman Brothers, soybeans, 320 acres in McLean County. We averaged 62 bushels and most of it is contracted at ten forty. Direct costs per acre: seed 62, fertilizer 48, herbicide and fungicide together 55, crop insurance premium 18, trucking 8, and operating interest about 9. No other income off the beans. On government money, ARC paid us roughly 22 an acre last year but nobody's told us anything for this year, so show it both ways. Last year our bean margin came out at 398 an acre, I want to see how we compare. Don't put land or machinery in, the brothers want just return over direct costs for the family meeting.", "wynik": "RETURN OVER DIRECT COSTS — Soybeans, 320 ac, McLean County, IL\n\n| item | $/ac | $/enterprise |\n| gross revenue (62 bu × $10.40) | 644.80 | 206,336 |\n| seed | 62 | 19,840 |\n| fertilizer | 48 | 15,360 |\n| herbicide and fungicide | 55 | 17,600 |\n| crop insurance | 18 | 5,760 |\n| trucking | 8 | 2,560 |\n| operating interest | 9 | 2,880 |\n| direct costs total | 200 | 64,000 |\n\nMath:\n1. Revenue: 62 bu/ac × $10.40/bu = $644.80/ac; × 320 ac = $206,336\n2. Direct costs: 62 + 48 + 55 + 18 + 8 + 9 = $200/ac; × 320 = $64,000\n3. Margin, market only: 644.80 − 200 = $444.80/ac; × 320 = $142,336\n4. Margin with ARC: 444.80 + 22 = $466.80/ac; × 320 = $149,376 — the $22/ac is last year's payment [VERIFY with the FSA county office]; this year's payment is unknown [TO FILL IN].\n\nComparison: market-only margin is 444.80 − 398 = $46.80/ac above last year [VERIFY last year used the same cost items].\n\nNot included: land, machinery, labor, overhead — this is not net farm income.\n[ASSUMPTION] all 62 bu/ac priced at the $10.40 contract; any uncontracted bushels [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "3.03", "nazwa": "Breakeven Price and Yield", "tag": "BREAKEVEN", "co_robi": "Calculates the breakeven price ($/bu) at the expected yield and the breakeven yield (bu/ac) at the offered price. Adds a sensitivity table so the grower sees how margin moves with yield and price.", "kiedy": "Before booking a forward contract, when an elevator bid comes in, or when a grower asks “at what price do I stop losing money?”", "brief": [{"pole": "Crop and field", "opis": "Crop, field, acres, irrigated or dryland, e.g. “Dave Jensen, irrigated corn, pivot 130 ac, south-central Nebraska”."}, {"pole": "Costs per acre", "opis": "Total costs you want covered in $/ac, broken down, e.g. “direct costs $410, machinery and pumping $120, cash rent $250”."}, {"pole": "Expected yield", "opis": "Your realistic yield, e.g. “230 bu/ac, five-year average under the pivot”."}, {"pole": "Offered price", "opis": "The bid or contract price you have, e.g. “harvest delivery bid $4.10/bu at the local elevator”."}, {"pole": "Sensitivity range", "opis": "How far to swing yield and price, e.g. “yield ±20 bu, price ±$0.40”."}], "prompt": "You are an experienced independent agronomist and farm management advisor (CCA) who helps growers decide when a price or a yield covers their costs. Calculate breakeven price and breakeven yield for one crop.\n\nINPUT:\nCrop and field: [CROP AND FIELD]\nCosts per acre: [COSTS PER ACRE]\nExpected yield: [EXPECTED YIELD]\nOffered price: [OFFERED PRICE]\nSensitivity range: [SENSITIVITY RANGE]\n\nRULES:\n1. Check the data first. If anything important is missing, ask me at most 5 short questions and wait for my answers.\n2. Do not invent prices, yields, rates, program payments, insurance figures or “typical” values. Work only with my numbers. Mark missing data [TO FILL IN], anything you assume [ASSUMPTION], anything uncertain [VERIFY].\n3. Show every calculation step by step with units ($/ac, $/bu, bu/ac, ac) and round only the final result.\n4. Breakeven price = total costs $/ac ÷ expected yield. Breakeven yield = total costs $/ac ÷ offered price. Use only the cost items I listed and say which ones they are.\n5. Build the sensitivity table only from the ranges I gave. If I gave none, ask — do not pick your own.\n6. Do not forecast prices or comment on where the market is going. Basis, futures and storage questions go in a note, not into the math.\n\nOUTPUT FORMAT:\nA) Summary: breakeven price, breakeven yield, margin at expected yield and offered price.\nB) Step-by-step math.\nC) Sensitivity table | yield bu/ac | price 1 | price 2 | price 3 | with margin in $/ac.\nD) What is not covered by these costs, plus gaps and assumptions.\n\nEnd with: “This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Add the land charge on owned ground at the figure I give you.", "Rebuild the sensitivity table with the price steps I specify.", "Show the breakeven price if crop insurance covers part of the loss at the level my agent confirms.", "Calculate breakeven for soybeans with the costs I paste.", "Make a one-line version I can text to the grower.", "Show how many bushels I need to sell at this bid to cover cash costs only.", "Compare the breakeven of two fields with different rent.", "Add a column for a price including the basis I enter.", "Turn the table into a format for Excel.", "List the cost items I should double-check before using this breakeven."], "checklista": ["The cost per acre includes everything the grower wants covered and nothing extra.", "The yield is realistic for the field, not a best-year number.", "The price is an actual bid or contract, with delivery period and basis noted.", "Sensitivity ranges were set by the grower, not by the AI.", "The breakeven is labeled clearly as cash-cost or full-cost.", "No price forecast slipped into the text."], "uwaga": "", "przyklad": {"wejscie": "Dave Jensen, irrigated corn under the 130-acre pivot, south-central Nebraska. My costs per acre: direct costs about 410, machinery plus pumping 120, and cash rent is 250 on that one, so call it 780 all in. Five-year average under the pivot is 230. The elevator is bidding 4.10 for harvest delivery. I want to know what price I need to break even and how low the yield can go before I'm underwater at that bid. Swing it plus or minus 20 bushels and plus or minus 40 cents so I can see the range. I'm not asking where the market's going, just the math.", "wynik": "BREAKEVEN — Irrigated corn, pivot 130 ac, south-central Nebraska\nCosts covered: direct 410 + machinery and pumping 120 + cash rent 250 = $780/ac\n\nMath:\n1. Breakeven price: $780/ac ÷ 230 bu/ac = $3.39/bu\n2. Breakeven yield at the $4.10 bid: $780/ac ÷ $4.10/bu = 190.2 bu/ac\n3. Margin at 230 bu and $4.10: 230 × 4.10 = $943.00/ac − 780 = $163.00/ac; × 130 ac = $21,190\n\nSensitivity — margin $/ac (revenue − $780)\n| yield bu/ac | $3.70 | $4.10 | $4.50 |\n| 210 | −3.00 | 81.00 | 165.00 |\n| 230 | 71.00 | 163.00 | 255.00 |\n| 250 | 145.00 | 245.00 | 345.00 |\n\nExample cells: 210 × 3.70 = 777.00 − 780 = −3.00; 250 × 4.50 = 1,125.00 − 780 = 345.00.\nBreakeven price at 210 bu: 780 ÷ 210 = $3.71/bu; at 250 bu: 780 ÷ 250 = $3.12/bu.\n\nNot covered: machinery depreciation and own labor if they are not in the $120 [VERIFY], crop insurance premium [TO FILL IN if not in direct costs].\n[ASSUMPTION] the $4.10 bid is for harvest delivery with no extra trucking or shrink.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "3.04", "nazwa": "Season Budget and Cash Flow", "tag": "CASH FLOW", "co_robi": "Lays out a month-by-month or quarter-by-quarter cash fl
