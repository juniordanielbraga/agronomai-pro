<title>AgronomAI PRO — the agronomist's AI office</title>

<style>
:root{--g9:#1E4620;--g8:#2C5E2E;--leaf:#7CB342;--cta:#2E7D32;--gold:#D9A82B;--red:#C62828;
--bg:#F5F0E3;--grid:rgba(30,70,32,.055);--card:#fff;--ink:#1d1f1b;--mut:#6b6a5f;--line:#e7e0cc;--soft:#f3eedf;--pre:#17351a;--pretx:#e9f1e3;
--c1:#4E8A3E;--c2:#1E4620;--c3:#D9A82B;--c4:#7A5232;--c5:#3FA34D;--c6:#C62828}
[data-theme=dark]{--bg:#121711;--grid:rgba(165,212,106,.05);--card:#1b2219;--ink:#eef2e8;--mut:#a3ab98;--line:#2c3628;--soft:#222b1f;--pre:#0d130c;--g9:#a5d46a;--g8:#a5d46a}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.55;
background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.mono,.k,.lab,.pill,.cnt,.chip{font-family:'Space Mono',monospace}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.sidetop{padding:22px 20px 0;flex:none}.sidemid{flex:1;overflow:auto;padding:0 12px 10px}.sidebot{flex:none;border-top:1px solid var(--line);padding:14px 20px 18px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px;cursor:pointer}
.brand svg{width:44px;height:44px;flex:none;border-radius:11px}
.brand b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.3px}.brand small{font-family:'Space Mono';font-size:10.5px;letter-spacing:1.6px;color:var(--mut);text-transform:uppercase}
.sbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--soft);margin-bottom:6px}
.sbox input{border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);flex:1;min-width:0;outline:0}
.sbox kbd{font-family:'Space Mono';font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--mut);background:var(--card)}
.lab{font-size:10.5px;letter-spacing:2px;color:var(--mut);margin:18px 10px 8px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:14px;white-space:nowrap}
.nav a span.t{overflow:hidden;text-overflow:ellipsis;flex:1}
.nav a:hover{background:var(--soft)}.nav a.on{background:var(--soft);font-weight:600}
.num{width:27px;height:27px;border-radius:7px;color:#fff;font-family:'Space Mono';font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.ico{width:27px;height:27px;border-radius:7px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.cnt{margin-left:auto;font-size:11px;color:var(--mut);background:var(--soft);border-radius:99px;padding:1px 8px;flex:none}
.nav a.on .cnt{background:var(--card);color:var(--ink);font-weight:700}
.prog{display:flex;justify-content:space-between;font-family:'Space Mono';font-size:10.5px;letter-spacing:1.8px;color:var(--mut)}
.bar{height:6px;background:var(--soft);border-radius:9px;margin:8px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--leaf);border-radius:9px}
.night{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:11px;padding:9px;font:inherit;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
main{padding:34px 48px 60px;max-width:1120px;width:100%;min-width:0}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:1.8px;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;margin-bottom:18px;text-transform:uppercase}
.pill:before{content:'';width:7px;height:7px;border-radius:50%;background:#3FA34D;box-shadow:0 0 0 3px rgba(63,163,77,.18)}
.pill.np:before{display:none}
h1{font-size:64px;line-height:1.02;font-weight:800;letter-spacing:-2.2px}
h1 em{font-style:normal;color:var(--g8);display:block}
h2{font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
h3{font-size:17px;font-weight:700;letter-spacing:-.2px}
.lead{color:var(--ink);opacity:.86;max-width:720px;margin:18px 0 26px;font-size:16.5px;line-height:1.7}.lead b{font-weight:700;opacity:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 34px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.stat b{font-size:32px;font-weight:800;display:block;letter-spacing:-1px;line-height:1.1}.stat small{font-family:'Space Mono';font-size:10.5px;letter-spacing:1.8px;color:var(--mut);text-transform:uppercase;display:block;margin-top:6px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 14px;gap:12px}.sech .k{margin:0}
.k{font-size:10.5px;letter-spacing:1.9px;color:var(--mut);display:block;margin-bottom:6px;text-transform:uppercase}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.step i{font-style:normal;display:inline-flex;width:30px;height:30px;border-radius:8px;background:var(--g9);color:#fff;align-items:center;justify-content:center;font-weight:700;margin-bottom:10px;font-family:'Space Mono'}
[data-theme=dark] .step i{color:#121711}
.step b{display:block;font-weight:700}.step p{font-size:13.5px;color:var(--mut);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:.15s}
.card:hover{border-color:#cfc39f;box-shadow:0 6px 18px rgba(30,70,32,.07)}
.card .top{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.card p{font-size:13.5px;color:var(--mut)}
.list{display:grid;gap:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;gap:16px;align-items:center;cursor:pointer;transition:.15s}
.row:hover{border-color:#cfc39f;box-shadow:0 6px 18px rgba(30,70,32,.07)}
.row .id{font-family:'Space Mono';font-weight:700;font-size:12.5px;color:#fff;border-radius:7px;padding:5px 9px;flex:none}
.row .tx{flex:1;min-width:0}.row b{font-weight:700;font-size:16px;display:block}
.row p{font-size:13.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex:none}
.chip{font-size:10.5px;letter-spacing:1.3px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:4px 10px;color:var(--mut);text-transform:uppercase;white-space:nowrap}
.star{border:0;background:none;font-size:19px;cursor:pointer;color:#c9bd98;flex:none;line-height:1;padding:4px}.star.on{color:var(--gold)}
.dzico{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--soft);border:1px solid var(--line);margin-bottom:18px}
.dh h1{font-size:48px;letter-spacing:-1.6px}
.skh{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.skh .bandx{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--soft)}
.skh .nm{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.skh .nm h1{font-size:34px;letter-spacing:-1px;line-height:1.1;flex:1}
.meta{display:grid;grid-template-columns:repeat(4,1fr)}.meta>div{padding:12px 20px;font-family:'Space Mono';font-size:13.5px;font-weight:700}.meta>div+div{border-left:1px solid var(--line)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.box.acc{border-left:4px solid var(--leaf)}
.field{margin-bottom:14px}.field label{display:block;font-weight:600;font-size:14px}
.field small{display:block;color:var(--mut);font-size:12.5px;margin:1px 0 6px}
.field textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical;background:var(--soft);color:var(--ink)}
.field textarea:focus{outline:2px solid var(--leaf);background:var(--card)}
pre{white-space:pre-wrap;word-wrap:break-word;font-family:'Space Mono',monospace;font-size:12.5px;line-height:1.6;background:var(--pre);color:var(--pretx);border-radius:12px;padding:18px;max-height:420px;overflow:auto}
pre mark,.ex mark{background:none;color:#ffb4a9;font-weight:700}.ex mark{color:var(--red)}
pre .ph{color:#ffd54a}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 15px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:#cfc39f}
.btn.g{background:var(--cta);border-color:var(--cta);color:#fff}.btn.d{background:#1E4620;border-color:#1E4620;color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.cmd{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 16px;margin-bottom:8px;font-size:14.5px}
.cmd .n{font-family:'Space Mono';font-size:12px;color:var(--mut);flex:none}.cmd .t{flex:1}.cmd .b{display:flex;gap:6px;flex:none}
.chk label{display:flex;gap:11px;padding:7px 0;font-size:14.5px;cursor:pointer;border-bottom:1px dashed var(--line)}.chk label:last-child{border:0}
.chk input{accent-color:var(--cta);width:18px;height:18px;flex:none;margin-top:3px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.ex .hd{font-family:'Space Mono';font-size:11.5px;letter-spacing:2px;padding:12px 20px;background:var(--soft);border-bottom:1px solid var(--line);text-transform:uppercase}
.ex .hd:before{content:'● ';color:var(--cta)}
.ex .bd{padding:18px 20px;font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.ex .bd.out{font-family:'Space Mono',monospace;font-size:12.8px;line-height:1.7;border-top:1px solid var(--line)}
.warn{background:#fbf3dc;border:1px solid #ecd9a0;border-radius:13px;padding:13px 16px;font-size:14px;color:#5d4a14;margin-top:14px}
[data-theme=dark] .warn{background:#2a2715;border-color:#4a4320;color:#eadca8}
.agc{display:flex;flex-direction:column}.agc .em{font-size:26px;width:46px;height:46px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.agc .cat{font-family:'Space Mono';font-size:10px;letter-spacing:1.6px;color:var(--mut);text-transform:uppercase}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#1E4620;color:#fff;padding:11px 20px;border-radius:99px;font-weight:600;opacity:0;transition:.2s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.mtop{display:none}
.back{display:none}
.empty{color:var(--mut);padding:20px 0}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 body{overflow-x:hidden}
 aside{position:fixed;inset:0 auto 0 0;width:86%;max-width:330px;z-index:30;transform:translateX(-105%);transition:.22s;box-shadow:0 0 40px rgba(0,0,0,.2)}
 body.menu aside{transform:none}
 .shade{display:none}body.menu .shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
 .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
 .mtop svg{width:34px;height:34px;border-radius:9px}.mtop b{font-weight:700;flex:1;font-size:15.5px}.mtop b span{color:var(--g8)}
 .mtop button{border:1px solid var(--line);background:var(--soft);border-radius:10px;width:40px;height:40px;font-size:18px;color:var(--ink);cursor:pointer}
 main{padding:22px 16px 50px}
 h1{font-size:44px;letter-spacing:-1.4px}.dh h1{font-size:34px}
 .lead{font-size:15px;margin:14px 0 20px}
 .stats{grid-template-columns:1fr 1fr;gap:10px}.stat b{font-size:27px}
 .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
 .steps{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.step{padding:13px}.step p{font-size:12.5px}
 .pill{font-size:10px;letter-spacing:1.2px;padding:6px 11px}
 .sech{flex-wrap:wrap}
 .chips{display:none}.row{padding:14px}
 .skh .nm h1{font-size:25px}.meta{grid-template-columns:1fr 1fr}.meta>div:nth-child(3){border-left:0}.meta>div:nth-child(n+3){border-top:1px solid var(--line)}
 .cmd{flex-wrap:wrap}.cmd .b{width:100%;justify-content:flex-end}
 .back{display:inline-flex;margin-bottom:14px}
 .btn{flex:1 1 auto;justify-content:center}
}
@media print{aside,.mtop{display:none}.app{display:block}}

<script>
const D={"dzialy": [{"dzial_nr": 1, "dzial": "Field Scouting & Visits", "opis": "The field walk ends at the field edge, but the work keeps going at the desk: scouting reports, photos, damage reports and recommendations for the grower. Dictate in the pickup or paste your notes, and get a finished document back — with calculations shown step by step and every gap clearly flagged before you sign.", "skills": [{"id": "1.01", "nazwa": "Pre-Visit Scouting Plan", "tag": "BEFORE THE VISIT", "co_robi": "Builds your visit plan before you leave the yard: what to check in each field, what to ask the grower and what to throw in the truck. You show up prepared instead of winging it.", "kiedy": "The night before a scouting route or over coffee in the morning, when a grower has called with a concern and you want to walk in with a plan.", "brief": [{"pole": "Visit purpose", "opis": "Why you're going out, e.g. “first spring scouting pass on winter wheat after green-up”."}, {"pole": "Grower and fields", "opis": "Who, where, how many acres, e.g. “Miller Farms, Story County, IA — 4 fields, about 620 ac”."}, {"pole": "Crops and stages", "opis": "Crop, hybrid or variety, planting date, growth stage, e.g. “corn planted May 2, about V5; soybeans planted May 10, VC–V1”."}, {"pole": "History and signals", "opis": "What you already know: past problems, passes, the grower's call, e.g. “grower says yellow strips in the Creek field after the heavy rain”."}, {"pole": "Weather and conditions", "opis": "Last couple of weeks and forecast, e.g. “3 in. of rain last week, cool nights, warming up and dry through the weekend”."}, {"pole": "Time and gear", "opis": "How long you have and what's in the truck, e.g. “about 90 minutes for this grower; shovel, hand lens, tape, sample bags”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who has scouted row crops and small grains for growers for years. Help me prepare for a field visit so I don't have to drive back for a missed sample or a question I forgot to ask.\n\nINPUT:\nVisit purpose: [VISIT PURPOSE]\nGrower and fields: [GROWER AND FIELDS]\nCrops and growth stages: [CROPS AND STAGES]\nField history and grower signals: [HISTORY AND SIGNALS]\nWeather and conditions: [WEATHER AND CONDITIONS]\nTime and gear: [TIME AND GEAR]\n\nRULES:\n1. Before you start, check the input for completeness. If something important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Never invent product rates, thresholds, REI or PHI intervals, prices, program rules or legal requirements. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n3. Think IPM: observe and identify first, decide later. Say what is usually worth checking at each growth stage (V/R stages for corn and soybeans, Feekes or Zadoks for wheat), but do not quote economic thresholds with numbers — if I need one, ask me for my land-grant extension source or the label.\n4. Write grower questions in plain language, the way you'd ask them at the shop or the end of the field, grouped by topic.\n5. Fit the plan to the time I have. If I can't cover everything, flag what is priority and what can wait.\n\nOUTPUT FORMAT:\nA) Visit plan step by step: field order and a rough time for each.\nB) What to check in each field: observations, method (W or zigzag pattern, stand count, dig plants, sweep net, sticky cards) and what to record.\nC) Questions for the grower grouped: passes and fertility, weather and field conditions, what the grower has seen, plans.\nD) Truck checklist of gear and sample supplies.\nE) Data gaps list with markers.\n\nAlways end with: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Cut the plan down to 45 minutes and keep only the must-check items.", "Add questions about this season's pesticide application records.", "Turn the truck list into a tap-to-check list for my phone.", "Build a separate detailed plan for the field with the biggest problem.", "Add which tissue, soil or plant samples to pull and how to label them.", "Reword the questions so the grower doesn't feel interrogated.", "Add a blank notes column I can fill in at the field.", "Write a short text to the grower confirming the visit time.", "Point out which observations I should document with photos.", "Make a version for a first-year agronomist going out alone."], "checklista": ["The plan covers every field the grower mentioned.", "Field order makes sense for driving time and priority.", "Grower questions ask for facts and don't lead the answer.", "No threshold or rate came from the AI — you have your own sources.", "Sample bags, labels and a charged phone are in the truck.", "Data gaps are filled in or knowingly left for the visit."], "uwaga": "", "przyklad": {"wejscie": "Okay, tomorrow I'm heading out to Miller Farms, Story County. Four fields, roughly 620 acres total. Two corn fields, planted May 2nd, should be about V5 now. Two soybean fields planted May 10th, just cracking through, VC maybe V1. Dave called today, says he's got yellow strips in the corn on the Creek field after that big rain last week, we got like three inches. Last year the North 80 beans had some white mold issues late. Nights have been cool, supposed to warm up and stay dry through the weekend. I've got about an hour and a half there before my next stop. What should I check, what do I ask Dave, and what do I need in the truck?", "wynik": "A) VISIT PLAN — Miller Farms, Story County, IA (about 90 min)\n| Order | Field | Time | Why |\n| 1 | Corn — Creek field | 30 min | grower-reported yellow strips — priority |\n| 2 | Corn — second field | 15 min | compare against Creek field |\n| 3–4 | Soybeans (2 fields) | 30 min | emergence and early stand |\n| — | Talk with Dave | 15 min | fill data gaps |\n\nB) WHAT TO CHECK — Corn, Creek field\n- Pattern of the strips: low spots, wheel tracks, planter passes, whole rows?\n- Dig plants from yellow and green areas: roots, mesocotyl, nodal root development.\n- Possible causes to separate in the field: saturated soil and N loss, sidewall compaction, cool-weather stress, herbicide injury — [VERIFY] on site.\n- Photos: strip from a distance, whole plant, roots side by side.\n\nC) QUESTIONS FOR DAVE\n- When did you first notice the strips? Getting better or worse?\n- What N source, timing and placement went on this field? [TO FILL IN]\n- Any herbicide passes since planting — product and date from the application record?\n- Does water stand in that area after a big rain?\n\nD) TRUCK: spade, knife, hand lens, measuring tape, sample bags and marker, soil probe, charged phone.\n\nE) GAPS: N program on Creek field [TO FILL IN]; soybean variety and seeding rate [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "1.02", "nazwa": "Field Scouting Report", "tag": "SCOUTING REPORT", "co_robi": "Turns your scouting notes into an organized report: crop condition, diseases, insects, weeds, nutrients and conclusions. It separates facts from interpretation and makes it clear what you still don't know.", "kiedy": "Right after a field walk, when you have notes on your phone and the grower wants to know what's going on before the end of the day.", "brief": [{"pole": "Grower and field", "opis": "Grower, field name and acres, e.g. “Hoffman Brothers, McLean County, IL — South 160, about 155 ac”."}, {"pole": "Crop and stage", "opis": "Crop, hybrid or variety, planting date and stage, e.g. “soybeans, planted May 8, R3”."}, {"pole": "Date and conditions", "opis": "Scouting date, time and weather, e.g. “July 22, mid-morning, 84 °F, humid, dew still on”."}, {"pole": "Field observations", "opis": "What you saw: diseases, insects, weeds, nutrient symptoms, stand, e.g. “frogeye spots on upper canopy in the west half, some bean leaf beetle feeding, waterhemp escapes on the end rows”."}, {"pole": "Previous passes", "opis": "Passes so far this season from the records, e.g. “pre-emerge residual in May, one post pass June 18”."}, {"pole": "Report recipient", "opis": "Who reads it and how, e.g. “the grower by email, copy into the field file”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who writes scouting reports growers actually read. Turn my field notes into a clean, professional scouting report.\n\nINPUT:\nGrower and field: [GROWER AND FIELD]\nCrop and stage: [CROP AND STAGE]\nDate and conditions: [DATE AND CONDITIONS]\nField observations: [FIELD OBSERVATIONS]\nPrevious passes: [PREVIOUS PASSES]\nReport recipient: [REPORT RECIPIENT]\n\nRULES:\n1. Before you start, check the input for completeness. If something important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Never invent product rates, thresholds, REI or PHI intervals, prices, program rules or legal requirements. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n3. Keep facts (what I saw and counted) separate from interpretation (what it probably means). Never upgrade a suspicion into a diagnosis.\n4. Organize by category: stand and crop condition, diseases, insects, weeds, nutrients and other. If I gave counts or percentages, show any calculation step by step.\n5. Do not compare anything to an economic threshold unless I give you the threshold and its source (land-grant extension, label). Otherwise write [TO FILL IN: threshold and source].\n6. Never name a product or rate on your own. If action may be needed, write the decision that needs to be made and mark product and rate [CHECK LABEL].\n\nOUTPUT FORMAT:\nA) Report header: grower, field, acres, crop, stage, date, scout.\nB) Observations table: category | what was seen | where in the field | severity or count.\nC) Interpretation and likely causes, each marked as confirmed or [VERIFY].\nD) Recommended next steps and re-scout timing.\nE) Open questions and data gaps with markers.\n\nAlways end with: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Shorten the report to a half-page summary for the grower's phone.", "Add a column with the GPS point or flag number for each observation.", "Rewrite the interpretation section in plain language without jargon.", "Make a version for the farm manager with only decisions and deadlines.", "List which observations need a lab or diagnostic clinic sample to confirm.", "Add a re-scout schedule for the next two weeks.", "Pull out every [VERIFY] item into a list for my next visit.", "Add a section comparing this visit to my last report on this field.", "Draft a short text to the grower with the three key findings.", "Format the report so I can paste it into my scouting app notes."], "checklista": ["Grower, field, crop, stage and date are correct.", "Facts and interpretation are clearly separated.", "Any threshold comparison cites your own source, not the AI.", "No product name or rate appears without [CHECK LABEL] or your label in hand.", "Counts and percentages match your field notes.", "Every [VERIFY] item has a plan to confirm it.", "The report is signed with your name and credentials."], "uwaga": "This report does not replace the pesticide label or your land-grant extension recommendations. Choose products and rates only from the current label (the label is the law) and log every application in your pesticide application records, including restricted-use pesticide records where required.", "przyklad": {"wejscie": "Hoffman Brothers, South 160, McLean County, about 155 acres of beans. Planted May 8th, they're at R3 now. Scouted this morning, July 22nd, around ten, 84 degrees, real humid, dew still on. West half has frogeye leaf spot on the upper leaves, I'd say maybe one in four plants I looked at had a few lesions. Some bean leaf beetle feeding, nothing crazy, I'd guess under ten percent defoliation. Waterhemp escapes along the east end rows, some knee high. They had a pre with residual in May and one post pass June 18th. Send it to the Hoffmans by email and I'll put a copy in the file.", "wynik": "SCOUTING REPORT\nGrower: Hoffman Brothers | Field: South 160, McLean County, IL | ~155 ac\nCrop: soybeans, planted May 8 | Stage: R3 | Date: July 22, ~10:00 a.m., 84 °F, humid | Scout: [TO FILL IN]\n\nB) OBSERVATIONS\n| Category | What was seen | Where | Severity |\n| Disease | frogeye leaf spot lesions, upper canopy | west half | ~25% of plants checked (scout estimate) |\n| Insects | bean leaf beetle feeding | scattered | <10% defoliation (estimate) |\n| Weeds | waterhemp escapes, up to knee high | east end rows | localized |\n| Stand | [TO FILL IN] | — | — |\n\nC) INTERPRETATION\n- Frogeye in the upper canopy at R3 in humid weather is worth watching; disease pressure and response depend on variety resistance [TO FILL IN] and conditions. Whether a fungicide pass is justified [VERIFY] against your land-grant extension guidance.\n- Defoliation level is compared to a threshold only once you supply it: [TO FILL IN: threshold and source].\n- Waterhemp escapes after a pre and one post — possible herbicide resistance or a timing gap [VERIFY]; note for next season's plan.\n\nD) NEXT STEPS\n- Decision: fungicide or not on the west half — product and rate [CHECK LABEL], including PHI [CHECK LABEL].\n- Re-scout in about 7 days [ASSUMPTION], focus on frogeye spread and beetle feeding.\n- Flag waterhemp patches for seed-bank management.\n\nE) GAPS: variety and frogeye rating [TO FILL IN]; post-pass product from records [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "1.03", "nazwa": "Voice Note to Report", "tag": "VOICE NOTE", "co_robi": "Takes the raw transcript of what you dictated in the pickup and turns it into a real document: a scouting report, a field file note or a short message to the grower. It fixes words dictation mangled and asks when something can't be read.", "kiedy": "Between farms or at the end of the day, when your notes are all in voice memos and you don't have time to type them up.", "brief": [{"pole": "Voice note transcript", "opis": "Paste the raw dictation, typos and all, e.g. “ok creek field corn v6 yellow strips worse on the east side dug some plants roots look ok…”."}, {"pole": "Grower and field", "opis": "Grower and field the note is about, e.g. “Dave Jensen, Creek field, Story County, IA”."}, {"pole": "Visit date", "opis": "When you were there, e.g. “June 12, afternoon”."}, {"pole": "Document type", "opis": "What you want back, e.g. “scouting report for the field file”."}, {"pole": "Recipient", "opis": "Who reads it, e.g. “Dave, by text — keep it short”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who has to turn messy voice dictation from the truck into clean documents. Take my raw transcript and produce the document I ask for.\n\nINPUT:\nVoice note transcript: [VOICE NOTE TRANSCRIPT]\nGrower and field: [GROWER AND FIELD]\nVisit date: [VISIT DATE]\nDocument type: [DOCUMENT TYPE]\nRecipient: [RECIPIENT]\n\nRULES:\n1. Before you start, check the input for completeness. If something important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Never invent product rates, thresholds, REI or PHI intervals, prices, program rules or legal requirements. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n3. Fix words that speech-to-text obviously garbled (crop terms, stages like V6 or R3, Feekes stages, weed and pest names). List every correction you made so I can check it.\n4. If a word or number can't be read with confidence, do not guess — mark it [VERIFY] and ask me.\n5. Keep only what I actually said. Do not add observations, causes or recommendations I didn't make; if something seems logically missing, list it as a question.\n6. Match tone and length to the recipient: a grower text is short and plain; a field file note is complete and factual.\n\nOUTPUT FORMAT:\nA) The finished document in the requested format.\nB) Speech-to-text corrections: original word → corrected word.\nC) Unclear spots and questions for me, marked [VERIFY] or [TO FILL IN].\nD) Optional: a 2–3 sentence version for a quick text to the grower.\n\nAlways end with: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Make it a text message under 300 characters.", "Turn it into a bulleted field file note with date and stage up top.", "Pull out every number I mentioned into a small table.", "Split the note into separate entries, one per field.", "Add headings so it matches my standard scouting report.", "Highlight anything that sounds like an action item for the grower.", "Rewrite it in a more formal tone for the farm manager.", "List the questions I should call the grower back about.", "Mark which statements are observations and which are my guesses.", "Translate the grower-facing part to simple Spanish for the farm crew."], "checklista": ["Every speech-to-text correction is right — especially stages and pest names.", "No observation was added that you didn't actually make.", "Numbers (counts, acres, dates) match what you said.", "Unclear spots are resolved or still marked [VERIFY].", "Tone and length fit the recipient."], "uwaga": "", "przyklad": {"wejscie": "ok this is dave jensen creek field june twelve afternoon. corn looks like v six maybe v seven on the hill. yellow strips are worse on the east side by the waterway, dug up maybe a dozen plants roots look okay no real pruning. lower leaves yellow from the tip down kind of a v shape. he put on anhydrous in the fall and nothing since. water stood there for a couple days after the big rain. found a couple of army worms on the field edge in the grass not much in the corn. need to tell dave to maybe look at a side dress option and send in a tissue sample. send him something short by text.", "wynik": "A) TEXT TO DAVE (short)\nDave — walked the Creek field this afternoon (June 12). Corn is about V6, V7 on the hill. Yellowing is worst on the east side by the waterway, where water stood after the rain. Roots look okay. Lower leaves yellowing tip-down in a V shape, which can point to N loss [VERIFY]. I'd like to pull a tissue sample and talk about a sidedress option. A few armyworms in the grass on the field edge, not much in the corn yet. Call you tomorrow.\n\nB) FIELD FILE NOTE\n- Grower: Dave Jensen | Field: Creek field | Date: June 12, p.m.\n- Stage: V6, V7 on the hill.\n- Yellow strips worse on east side near waterway; ponding reported for a couple of days after heavy rain.\n- About 12 plants dug: roots look okay, no obvious pruning.\n- Lower leaves yellow from the tip in a V pattern.\n- N program: fall anhydrous, nothing since. Rate [TO FILL IN].\n- Armyworms: a few in grass at field edge, little in corn.\n- To do: tissue sample; discuss sidedress (rate based on his N plan and state guidance [TO FILL IN]).\n\nC) CORRECTIONS\n- \"army worms\" → armyworms\n- \"v six\" → V6, \"v seven\" → V7\n\nD) QUESTIONS\n- Fall anhydrous rate and timing? [TO FILL IN]\n- Was a nitrification inhibitor used? [VERIFY]\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "1.04", "nazwa": "Field Photo Documentation", "tag": "PHOTO LOG", "co_robi": "Organizes your scouting photos: consistent captions, numbering and descriptions, plus a summary for a report, claim file or archive. A photo with no caption is useless in a month — here each one has context.", "kiedy": "After a field visit with a camera roll full of leaves, roots and patches, especially when the photos may end up with an adjuster, a lender or in a dispute.", "brief": [{"pole": "Photo list", "opis": "File names or a quick description of each photo, e.g. “IMG_4412 patch from road, IMG_4413 close-up of leaf, IMG_4414 dug roots”."}, {"pole": "Grower and field", "opis": "Grower, field and acres, e.g. “Miller Farms, North 80, about 78 ac”."}, {"pole": "Crop and stage", "opis": "Crop and growth stage when photographed, e.g. “corn, R2 blister”."}, {"pole": "Date and time", "opis": "When the photos were taken, e.g. “August 3, 9:30–10:15 a.m.”."}, {"pole": "Location in field", "opis": "Where in the field, GPS or landmarks, e.g. “NW corner by the grain bins, flag 3”."}, {"pole": "Documentation purpose", "opis": "What the photos are for, e.g. “evidence for a hail claim with the crop insurance adjuster”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who keeps photo documentation that still makes sense a year later. Organize my field photos into a consistent, captioned photo log.\n\nINPUT:\nPhoto list: [PHOTO LIST]\nGrower and field: [GROWER AND FIELD]\nCrop and stage: [CROP AND STAGE]\nDate and time: [DATE AND TIME]\nLocation in field: [LOCATION IN FIELD]\nDocumentation purpose: [DOCUMENTATION PURPOSE]\n\nRULES:\n1. Before you start, check the input for completeness. If something important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Never invent product rates, thresholds, REI or PHI intervals, prices, program rules or legal requirements. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n3. Give every photo a number, a consistent file name (date_grower_field_number) and a caption: what it shows, where, crop stage and why it matters.\n4. Describe only what is visible or what I told you. Do not diagnose from a caption — if a cause is suspected, write it as suspected and mark [VERIFY].\n5. If the purpose is evidence (insurance, a dispute, drift complaint), add what each photo proves and what a reviewer may still ask for, such as a scale reference, a wide shot or an undamaged check area.\n6. Point out gaps in the set: missing wide shots, missing close-ups, no reference for size, no time stamp.\n\nOUTPUT FORMAT:\nA) Photo log table: no. | file name | caption | location | what it documents.\nB) Short summary paragraph for the report or claim file.\nC) Missing shots to take on the next visit.\nD) Data gaps with markers.\n\nAlways end with: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Rename all the files using the date_grower_field_number pattern.", "Group the photos by problem instead of by time.", "Write captions short enough to fit under a photo in a slide.", "Add a column for GPS coordinates I'll paste from my phone.", "Build a one-page photo appendix for the scouting report.", "List the photos that best show the problem to the grower.", "Add a note on which photos need a scale reference retaken.", "Make a shot list for documenting the same spots in two weeks.", "Rewrite captions in neutral language for an insurance file.", "Create a folder structure for this season's photos by grower and field."], "checklista": ["Every photo has a number, a date and a location.", "Captions describe what is visible and don't overstate a diagnosis.", "Wide shots and close-ups both exist for each problem area.", "Evidence photos have a scale reference and an undamaged comparison.", "Original files are kept unedited alongside any copies.", "The photo log matches the written report or claim notes."], "uwaga": "", "przyklad": {"wejscie": "Miller Farms, North 80, about 78 acres of corn at R2 blister. Took these August 3rd between 9:30 and 10:15. This is for the hail claim, the adjuster is coming next week. IMG_4412 is the shredded leaves from the road looking north. 4413 close-up of a leaf with the hail shredding. 4414 broken stalk, I think maybe green snap from the wind with the same storm. 4415 bruised stalk with the knife cut showing the inside. 4416 the good part of the field on the south end for comparison. All in the northwest quarter by the grain bins except the last one. Didn't have anything for scale.", "wynik": "A) PHOTO LOG — Miller Farms, North 80 (~78 ac), corn R2 | August 3, 9:30–10:15 a.m.\n| No. | File | Caption | Location | Documents |\n| 1 | 0803_Miller_N80_01 | Shredded leaves, view north from the road | NW quarter by grain bins | extent of leaf damage |\n| 2 | 0803_Miller_N80_02 | Close-up of a leaf with shredding typical of hail | NW quarter | type of damage |\n| 3 | 0803_Miller_N80_03 | Broken stalk; suspected green snap from wind in the same storm [VERIFY] | NW quarter | stalk breakage |\n| 4 | 0803_Miller_N80_04 | Bruised stalk cut open to show internal tissue | NW quarter | stalk bruising |\n| 5 | 0803_Miller_N80_05 | Undamaged corn for comparison | south end | check area |\n\nB) SUMMARY FOR THE CLAIM FILE\nPhotos 1–4 document leaf shredding, stalk bruising and broken stalks in the northwest quarter after the storm. Photo 5 shows the south end with no visible damage for comparison. Storm date [TO FILL IN]. Share of field affected [TO FILL IN] — to be measured, not estimated from photos.\n\nC) MISSING SHOTS\n- Scale reference (tape, pocketknife or hand) in close-ups.\n- Wide shot showing the boundary between damaged and undamaged areas.\n- GPS or flag numbers for each spot.\n- Hail stones or ground damage if still visible [ASSUMPTION: likely gone].\n\nD) GAPS: storm date and time [TO FILL IN]; policy and notice-of-loss date [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "1.05", "nazwa": "Winter Survival Assessment", "tag": "WINTER SURVIVAL", "co_robi": "Walks you through a spring winter-survival and stand assessment for winter wheat and winter canola: how to count, what to look at on the plant and how to record the result. It calculates survival step by step from your data and compares it with criteria you supply.", "kiedy": "In early spring at green-up, after a hard or open winter, when the grower is asking whether the stand is good enough to keep.", "brief": [{"pole": "Grower and field", "opis": "Grower, field and acres, e.g. “Dave Jensen, Home quarter, Saskatchewan — about 155 ac”."}, {"pole": "Crop and variety", "opis": "Crop, variety, seeding date and rate, e.g. “winter wheat, hard red variety, seeded Sept 20”."}, {"pole": "Fall condition", "opis": "How the stand went into winter, e.g. “2–3 tillers, good crown, decent fall stand”."}, {"pole": "Winter conditions", "opis": "Snow cover, cold snaps, ice, e.g. “open winter, little snow, hard cold snap in January, ice sheeting in low spots”."}, {"pole": "Assessment results", "opis": "Your counts and checks, e.g. “plants per foot of row in 8 spots, bag test on 20 crowns: 14 greened up”."}, {"pole": "Decision criteria", "opis": "Your minimum stand and replant criteria with source, e.g. “extension guide: keep if stand at least … plants/sq ft — I'll enter my number”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who assesses winter survival in winter wheat and winter canola every spring. Walk me through a winter survival and stand assessment and help me write up the result.\n\nINPUT:\nGrower and field: [GROWER AND FIELD]\nCrop and variety: [CROP AND VARIETY]\nFall condition: [FALL CONDITION]\nWinter conditions: [WINTER CONDITIONS]\nAssessment results: [ASSESSMENT RESULTS]\nDecision criteria: [DECISION CRITERIA]\n\nRULES:\n1. Before you start, check the input for completeness. If something important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Never invent product rates, thresholds, REI or PHI intervals, prices, program rules or legal requirements. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n3. Explain how to assess: where and how many spots to count, how to dig and check crowns, how to do a bag or bucket regrowth test, and what to look for on the plant (white healthy crown tissue vs. brown, mushy tissue).\n4. Calculate survival percentage and average plants per unit area from my numbers step by step, and show the spread between spots.\n5. Compare results only with the decision criteria I give you, with their source. Never supply a minimum stand number yourself — if I didn't give one, write [TO FILL IN: minimum stand and source].\n6. Lay out the keep-or-replace decision honestly, including uneven stands, and remind me to contact the crop insurance agent before tearing up or replanting any insured acres.\n\nOUTPUT FORMAT:\nA) Assessment method used and anything to repeat or add.\nB) Calculations step by step: plants per area per spot, average, survival %.\nC) Comparison with my criteria and a keep or replace discussion.\nD) Short assessment record for the field file and the grower.\nE) Data gaps with markers.\n\nAlways end with: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Make a printable count sheet for 10 spots per field.", "Explain the bag test step by step for the grower's son to do at home.", "Recalculate everything if I add three more count spots.", "Split the result by zone: hilltops, slopes and low spots.", "List what information the insurance agent will likely ask for.", "Write a short text to the grower with the result and next step.", "Add a side-by-side comparison of keep vs. replant considerations.", "Show what the field would look like on a map sketch by zone.", "Create a reminder list for re-checking the stand in 10 days.", "Rewrite the assessment record in a more formal tone for the lender."], "checklista": ["Counts come from enough spots across the whole field, including low spots and hilltops.", "Survival percentage and plants per area are calculated correctly.", "Minimum stand and replant criteria come from your own source.", "Plants were checked for live crowns, not just green leaves.", "The crop insurance agent was notified before any tear-up or replant.", "The record has the date, field, method and who did the assessment."], "uwaga": "Minimum stand and replant criteria depend on the crop, variety, region and source — enter them yourself. For insured acres, contact the crop insurance agent and wait for an adjuster's release before destroying or replanting the crop.", "przyklad": {"wejscie": "Dave Jensen, Home quarter, about 155 acres of winter wheat up by Saskatoon. Seeded September 20th, went into winter with two, three tillers, looked good. Pretty open winter, not much snow, we had that hard cold snap in January and there's some ice sheeting in the low spots. I counted plants per foot of row in eight spots, seven-and-a-half inch rows: 9, 11, 8, 3, 2, 10, 12, 9. The 3 and 2 were both in low spots. Did a bag test on 20 crowns, 14 greened up. Dave wants to know if he keeps it or seeds something else. I'll put in the minimum from the provincial guide myself.", "wynik": "A) METHOD\nPlants per foot of row in 8 spots (7.5 in. rows) plus a bag test on 20 crowns. Add 2–4 more counts on hilltops and slopes to balance the low spots [ASSUMPTION].\n\nB) CALCULATIONS\n1. Total plants: 9 + 11 + 8 + 3 + 2 + 10 + 12 + 9 = 64\n2. Average per foot of row: 64 ÷ 8 = 8.0\n3. Rows per foot of width: 12 ÷ 7.5 = 1.6\n4. Plants per sq ft: 8.0 × 1.6 = 12.8\n5. Range: 2 to 12 per foot of row; low spots (2, 3) are well below the rest.\n6. Excluding low spots: 59 ÷ 6 = 9.8 per ft of row → 15.7 plants/sq ft\n7. Bag test survival: 14 ÷ 20 = 70%\n\nC) COMPARISON\n| Measure | Result | Your criterion |\n| Plants/sq ft, whole field | 12.8 | [TO FILL IN: minimum from provincial guide] |\n| Plants/sq ft, excluding low spots | 15.7 | same |\n| Bag test survival | 70% | [TO FILL IN] |\nThe stand is uneven: low spots with ice sheeting are the weak zone. A partial decision (keep most of the field, deal with low spots separately) may be worth discussing [VERIFY] once you enter the minimum.\n\nD) RECORD FOR THE FILE\nHome quarter, ~155 ac winter wheat. Spring assessment [TO FILL IN: date]. Average 12.8 plants/sq ft; 70% bag-test regrowth. Low spots affected by ice sheeting. Contact crop insurance agent before any tear-up or reseeding.\n\nE) GAPS: assessment date [TO FILL IN]; size of low-spot area in acres [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "1.06", "nazwa": "Stand Count Assessment", "tag": "STAND COUNT", "co_robi": "Converts your field counts into plants per acre, shows spread and emergence uniformity, then compares the result with the target stand you supply. It helps you weigh a replant decision honestly.", "kiedy": "A couple of weeks after planting, or after a crusting rain, frost or flooding, when the grower asks whether the stand is good enough or the field needs replanting.", "brief": [{"pole": "Grower and field", "opis": "Grower, field and acres, e.g. “Hoffman Brothers, Creek field, about 120 ac”."}, {"pole": "Crop and planting", "opis": "Crop, hybrid, seeding rate, row spacing, planting date, e.g. “corn, 30-in. rows, planted April 28, seeding rate from the planter monitor”."}, {"pole": "Counting method", "opis": "How you counted, e.g. “1/1000th acre: 17 ft 5 in. of row, 10 spots”."}, {"pole": "Count results", "opis": "Your raw counts, e.g. “28, 31, 30, 24, 29, 31, 22, 30, 29, 30”."}, {"pole": "Target stand", "opis": "The target or replant criteria with source, e.g. “seed company replant guide — I'll enter the numbers”."}, {"pole": "Emergence notes", "opis": "Uneven emergence, gaps, doubles, e.g. “a lot of late emergers in the wet end, some skips behind one row unit”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who does stand counts and replant evaluations every spring. Turn my field counts into a clear stand assessment.\n\nINPUT:\nGrower and field: [GROWER AND FIELD]\nCrop and planting: [CROP AND PLANTING]\nCounting method: [COUNTING METHOD]\nCount results: [COUNT RESULTS]\nTarget stand: [TARGET STAND]\nEmergence notes: [EMERGENCE NOTES]\n\nRULES:\n1. Before you start, check the input for completeness. If something important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Never invent product rates, thresholds, REI or PHI intervals, prices, program rules or legal requirements. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n3. Convert my counts to plants per acre step by step, using the method I describe (1/1000th acre row length for my row spacing, hoop or frame, or plants per foot of row). Use the units I give you; if I work in hectares, report per hectare.\n4. Show the average, the range and the variation between spots, and comment on emergence uniformity (late emergers, skips, doubles) based only on what I reported.\n5. Compare the result only with the target stand or replant criteria I give you, with their source. If none were given, write [TO FILL IN: target stand and source]. Never supply a seeding rate or a yield-loss percentage yourself.\n6. Lay out the replant question fairly: stand, uniformity, calendar date, seed and cost [TO FILL IN], and remind me to contact the crop insurance agent before replanting insured acres.\n\nOUTPUT FORMAT:\nA) Count summary table: spot | count | plants per acre.\nB) Calculations step by step: conversion, average, range.\nC) Emergence uniformity notes.\nD) Comparison with target and a replant discussion.\nE) Data gaps with markers.\n\nAlways end with: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Recalculate for 15-in. rows instead of 30-in.", "Make a count sheet I can fill in on my phone in the field.", "Split results into the wet end and the rest of the field.", "Add a column that counts late emergers separately.", "Show the result in plants per hectare for my Canadian grower.", "Write a short text to the grower with the stand result.", "List the questions to ask before deciding on a replant.", "Create a planter performance note for skips and doubles.", "Rewrite the summary for the crop insurance agent.", "Build a template I can reuse for every stand count this spring."], "checklista": ["The row length used matches the actual row spacing.", "Counts come from enough spots across the field, not just the worst area.", "Plants per acre and averages are calculated correctly.", "Target stand and replant criteria come from your own source.", "Late emergers and skips are described, not just the total.", "The insurance agent is contacted before replanting insured acres."], "uwaga": "Target stands and replant criteria depend on the crop, hybrid or variety, planting date and region — the user provides them from the seed company or land-grant extension. The AI only converts and organizes the numbers.", "przyklad": {"wejscie": "Hoffman Brothers, Creek field, about 120 acres corn. Thirty-inch rows, planted April 28th. We got that crusting rain right after planting. Did 1/1000th acre counts, so 17 feet 5 inches of row, ten spots. Counts were 28, 31, 30, 24, 29, 31, 22, 30, 29, 30. The 24 and the 22 were down in the wet end. A fair number of late emergers there, maybe one or two leaves behind, and I saw some skips behind what looks like one row unit. The guys want to know if they should replant the wet end. I'll put in the replant numbers from the seed company guide.", "wynik": "A) COUNT SUMMARY — Creek field, corn, 30-in. rows\n| Spot | Count (1/1000 ac) | Plants/ac |\n| 1 | 28 | 28,000 |\n| 2 | 31 | 31,000 |\n| 3 | 30 | 30,000 |\n| 4 | 24 | 24,000 |\n| 5 | 29 | 29,000 |\n| 6 | 31 | 31,000 |\n| 7 | 22 | 22,000 |\n| 8 | 30 | 30,000 |\n| 9 | 29 | 29,000 |\n| 10 | 30 | 30,000 |\n\nB) CALCULATIONS\n1. 17 ft 5 in. of 30-in. row = 1/1000 acre, so plants/ac = count × 1,000.\n2. Total: 284 → average 28.4 per 1/1000 ac = 28,400 plants/ac.\n3. Range: 22,000 to 31,000.\n4. Excluding wet end (spots 4 and 7): 238 ÷ 8 = 29.75 → 29,750 plants/ac.\n5. Wet end only: (24 + 22) ÷ 2 = 23 → 23,000 plants/ac.\n\nC) EMERGENCE\nLate emergers in the wet end, about 1–2 leaves behind — these plants may contribute less [VERIFY]. Skips behind one row unit suggest a planter issue to check [VERIFY].\n\nD) COMPARISON AND REPLANT DISCUSSION\n| Zone | Plants/ac | Target or replant criterion |\n| Rest of field | 29,750 | [TO FILL IN: seed company guide] |\n| Wet end | 23,000 | [TO FILL IN] |\nOther factors: current date vs. replant date, seed availability and cost [TO FILL IN], size of the wet end in acres [TO FILL IN]. Contact the crop insurance agent before replanting.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "1.07", "nazwa": "Crop Damage Report", "tag": "DAMAGE REPORT", "co_robi": "Drafts a crop damage report from your field inspection after hail, wind or flooding: event description, assessment method, measurements and the share of the field affected. It organizes the evidence so it holds up with the crop insurance adjuster, a landlord or a lender.", "kiedy": "In the days after a storm or flood, when the grower has filed or is about to file a notice of loss and needs his own documented record before the adjuster comes out.", "brief": [{"pole": "Damage type", "opis": "What happened, e.g. “hail with strong wind, some flooding in the low ground”."}, {"pole": "Grower and field", "opis": "Grower, field, legal description and acres, e.g. “Miller Farms, SW¼ Sec. 14, about 152 ac”."}, {"pole": "Crop and stage", "opis": "Crop and stage when damage happened, e.g. “soybeans, R2 at the time of the storm”."}, {"pole": "Event and inspection dates", "opis": "Date of the event and of your inspection, e.g. “storm July 14 evening, inspected July 16”."}, {"pole": "Inspection findings", "opis": "What you measured and saw, e.g. “defoliation estimates in 6 spots, node counts, broken stems, area flooded”."}, {"pole": "Purpose and attendees", "opis": "Who was there and what the report is for, e.g. “grower present, for the crop insurance claim — adjuster visit pending”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who documents crop damage for growers. Draft a crop damage report from my field inspection that will hold up in a conversation with the crop insurance adjuster.\n\nINPUT:\nDamage type: [DAMAGE TYPE]\nGrower and field: [GROWER AND FIELD]\nCrop and stage: [CROP AND STAGE]\nEvent and inspection dates: [EVENT AND INSPECTION DATES]\nInspection findings: [INSPECTION FINDINGS]\nPurpose and attendees: [PURPOSE AND ATTENDEES]\n\nRULES:\n1. Before you start, check the input for completeness. If something important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Never invent product rates, thresholds, REI or PHI intervals, prices, program rules or legal requirements. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n3. Describe the event, the method and the findings factually. Separate what was measured from what was estimated, and estimates from opinions.\n4. Show every calculation step by step (averages, share of the field affected, acres affected). Do not estimate yield loss with a formula or table unless I provide the official method and source; otherwise write [TO FILL IN: loss method and source].\n5. Do not state policy terms, deadlines, coverage or what the insurer will pay. Write what the grower must confirm with the crop insurance agent, and mark it [VERIFY].\n6. Add an evidence list (photos, GPS points, weather data) and a list of what is still missing.\n\nOUTPUT FORMAT:\nA) Report header: grower, field, acres, crop, stage, event and inspection dates, attendees.\nB) Event description.\nC) Assessment method and sampling.\nD) Findings table and calculations step by step.\nE) Evidence list and open items for the agent and adjuster.\nF) Signature block left blank.\n\nAlways end with: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Add a table with GPS coordinates for every assessment spot.", "Write a short summary the grower can send to his crop insurance agent.", "List the questions the grower should ask the agent about the claim.", "Separate the hail damage from the flood damage in the report.", "Add a section for re-inspection in 10 days as the crop recovers.", "Make a field sketch description showing damaged zones.", "Rewrite the report in neutral language without any opinions.", "Create a photo appendix outline that matches the findings table.", "List all weather data sources I should attach.", "Make a version for the landlord with only the key facts."], "checklista": ["Event and inspection dates are correct and consistent.", "Sampling spots cover damaged and undamaged areas.", "Measured values, estimates and opinions are clearly separated.", "Calculations of affected area are checked.", "No policy term, deadline or payout is stated as fact.", "Photos and GPS points match the findings table.", "The grower has confirmed notice-of-loss requirements with the agent."], "uwaga": "Claim procedures, notice deadlines and loss adjustment methods depend on the insurer, the policy and the type of damage. The AI does not know the current requirements — confirm them with the crop insurance agent before filing, and do not destroy or replant the crop without the adjuster's release.", "przyklad": {"wejscie": "Miller Farms, SW quarter Section 14, about 152 acres of soybeans, they were at R2 when the storm came through. Hail with strong wind the evening of July 14th, I was out there the 16th with Dave. Checked six spots. Defoliation I'd estimate 30, 45, 50, 40, 20 and 35 percent. Some stems broken at the lower nodes in the two worst spots. The low ground on the east side had water standing for about a day and a half, I'd say about 18 acres of it. He already called his agent. This is for the insurance claim, adjuster hasn't been out yet. Took photos at every spot.", "wynik": "CROP DAMAGE REPORT — DRAFT\nGrower: Miller Farms | Field: SW¼ Sec. 14 | ~152 ac | Crop: soybeans, R2 at time of event\nEvent: hail with strong wind, July 14 (evening) | Inspection: July 16 | Present: Dave Miller, agronomist [TO FILL IN: name]\n\nA) EVENT\nHail and strong wind passed over the field the evening of July 14. Standing water on low ground on the east side for about 1.5 days afterward (grower report).\n\nB) METHOD\nVisual defoliation estimates at 6 spots; stem breakage noted; flooded area estimated by the agronomist. Sampling pattern and spot locations [TO FILL IN: GPS].\n\nC) FINDINGS AND CALCULATIONS\n| Spot | Defoliation (estimate) | Notes |\n| 1 | 30% | — |\n| 2 | 45% | broken stems at lower nodes |\n| 3 | 50% | broken stems at lower nodes |\n| 4 | 40% | — |\n| 5 | 20% | — |\n| 6 | 35% | — |\n1. Average defoliation: (30 + 45 + 50 + 40 + 20 + 35) ÷ 6 = 220 ÷ 6 = 36.7% (estimate)\n2. Flooded area: ~18 ac of 152 ac = 11.8% of the field (estimate)\nYield loss: [TO FILL IN: loss method and source] — not estimated in this report.\n\nD) EVIDENCE AND OPEN ITEMS\n- Photos at all 6 spots; GPS points [TO FILL IN].\n- Weather data for July 14 [TO FILL IN].\n- Notice of loss called in by grower; date and claim number [TO FILL IN].\n- Requirements for leaving check strips or delaying field work [VERIFY] with the agent.\n\nE) Signature: ____________________ Date: ________\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "1.08", "nazwa": "Grower Recommendation Letter", "tag": "RECOMMENDATIONS", "co_robi": "Turns your field findings into clear recommendations for the grower: what to do, on which field, in what order and by when. No jargon and no made-up rates — products and rates always from the label or the nutrient plan.", "kiedy": "After a visit, when the grower needs written next steps today and you want a record of what you recommended.", "brief": [{"pole": "Visit findings", "opis": "What you found, e.g. “frogeye leaf spot on the west half, waterhemp escapes on end rows, possible K deficiency on the hill”."}, {"pole": "Grower and fields", "opis": "Grower and fields involved, e.g. “Hoffman Brothers — South 160 and the Home place, about 310 ac”."}, {"pole": "Agreed with grower", "opis": "What you already talked about, e.g. “Tom agrees on a fungicide decision this week, wants a soil test on the hill this fall”."}, {"pole": "Farm resources", "opis": "Equipment, labor, custom applicator, e.g. “own 90-ft sprayer, custom airplane available, one guy on the farm in July”."}, {"pole": "Weather forecast", "opis": "Next few days, e.g. “dry through Thursday, storms Friday, windy Saturday”."}, {"pole": "Delivery format", "opis": "How the grower gets it, e.g. “email with a PDF and a short text”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who writes clear recommendation letters to growers after a field visit. Turn my findings into practical recommendations: what to do, on which field, in what order and by when.\n\nINPUT:\nVisit findings: [VISIT FINDINGS]\nGrower and fields: [GROWER AND FIELDS]\nAgreed with grower: [AGREED WITH GROWER]\nFarm resources: [FARM RESOURCES]\nWeather forecast: [WEATHER FORECAST]\nDelivery format: [DELIVERY FORMAT]\n\nRULES:\n1. Before you start, check the input for completeness. If something important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Never invent product rates, thresholds, REI or PHI intervals, prices, program rules or legal requirements. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n3. Write in plain language for the grower, not for other agronomists. One clear action per line.\n4. Never write a product rate, REI, PHI or tank-mix on your own. For any pesticide, write the product type and mark product, rate, REI and PHI [CHECK LABEL]. For nutrients, refer to the soil test and the nutrient plan — mark rates [TO FILL IN].\n5. Order recommendations by urgency and fit them to the weather forecast and the farm's equipment and labor.\n6. Include what to watch and when I will re-check, and leave room for my signature and credentials.\n\nOUTPUT FORMAT:\nA) Short summary: the 3 most important actions.\nB) Recommendation table: priority | field | action | timing | notes.\nC) Details per field, with label and record-keeping reminders.\nD) What to monitor and when I come back.\nE) Signature block and data gaps with markers.\n\nAlways end with: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Make a one-paragraph text version for the grower's phone.", "Add a column with the latest date each action makes sense.", "Rewrite it for the hired man who'll run the sprayer.", "Add a reminder to record each application in the pesticide records.", "Split recommendations into must-do this week and can-wait.", "Add a short why behind each recommendation in plain words.", "Make a version for the landlord with only the decisions.", "Include what to do if the Friday storm hits before spraying.", "Add a follow-up visit date and what I'll check then.", "Format it as a letter on my company letterhead."], "checklista": ["Every pesticide product and rate comes from the current label in hand.", "REI and PHI are checked on the label, not assumed.", "Nutrient rates match the soil test and the nutrient management plan.", "Actions are ordered by urgency and fit the forecast.", "The grower can understand each line without a phone call.", "The letter is dated and signed with your credentials."], "uwaga": "Choose pesticide products and rates only from the current label (EPA registration; PMRA in Canada) — the label is the law, including REI, PHI and Worker Protection Standard requirements. Nitrogen and other nutrients follow the soil test, the nutrient management plan (NRCS 590 where it applies) and state guidance. The recommendation is signed by the agronomist.", "przyklad": {"wejscie": "Hoffman Brothers, South 160 and the Home place, about 310 acres beans total. Found frogeye on the west half of the South 160, waterhemp escapes on the end rows, and on the hill at the Home place the beans look like potassium deficiency, yellow leaf edges on the older leaves. Tom agreed we make a fungicide call this week and he wants a soil test on that hill this fall. They've got their own 90-foot sprayer but only one guy in July, and there's a custom plane if needed. Dry through Thursday, storms Friday, windy Saturday. Send him an email with a PDF and a short text.", "wynik": "RECOMMENDATIONS — Hoffman Brothers | Date: [TO FILL IN]\n\nA) TOP 3 ACTIONS\n1. South 160, west half: decide on a fungicide pass by Thursday, before Friday storms.\n2. Home place hill: soil test this fall to confirm suspected potassium deficiency.\n3. South 160 end rows: note waterhemp escapes for next season's weed plan.\n\nB) RECOMMENDATION TABLE\n| Priority | Field | Action | Timing | Notes |\n| 1 | South 160 (west) | Fungicide labeled for frogeye in soybeans | by Thu (dry window) | product, rate, REI, PHI [CHECK LABEL] |\n| 2 | Home place hill | Soil sample (K, pH, CEC) | after harvest | zone sample the hill separately |\n| 3 | South 160 end rows | Map waterhemp patches | before harvest | no rescue pass recommended now [ASSUMPTION] |\n\nC) DETAILS\n- Fungicide: if your own sprayer can't cover it by Thursday, consider the custom applicator. Record the application (product, EPA reg. no., rate, date, field) in your pesticide records.\n- Potassium: symptoms on older leaves fit K deficiency but need confirming [VERIFY]; rates only from the soil test and your fertility plan [TO FILL IN].\n\nD) FOLLOW-UP\nI'll re-check the west half about 7–10 days after application [ASSUMPTION].\n\nE) Agronomist: [TO FILL IN: name, CCA no.] Signature: ________\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "1.09", "nazwa": "Weekly Route Plan", "tag": "WEEKLY PLAN", "co_robi": "Builds your week of visits: who to see, when and in what order so urgent issues don't wait and miles don't pile up. It works around the weather, growers' schedules and your other commitments.", "kiedy": "Sunday night or Monday morning in season, when the phone has been ringing and you need to fit everyone into five days.", "brief": [{"pole": "Grower list", "opis": "Growers and fields to visit this week, e.g. “Miller Farms (4 fields), Hoffman Bros (2), Jensen (3), Kowalski Ag (1)”."}, {"pole": "Urgency and deadlines", "opis": "What can't wait, e.g. “Hoffman fungicide call by Thursday, Jensen stand count before replant window”."}, {"pole": "Home base and availability", "opis": "Where you start and your hours, e.g. “office in Ames, available Mon–Fri 7–6, Wednesday afternoon in a meeting”."}, {"pole": "Drive times", "opis": "Rough drive times between farms, e.g. “Ames to Miller 25 min, Miller to Hoffman 40 min”."}, {"pole": "Weather forecast", "opis": "This week's forecast, e.g. “rain Tuesday, dry Wed–Fri, hot Thursday”."}, {"pole": "Grower constraints", "opis": "When growers can or can't meet, e.g. “Dave only after 3 p.m., Tom not available Friday”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who runs a busy territory in season. Build my weekly visit plan and route so urgent calls don't wait and windshield time stays low.\n\nINPUT:\nGrower list: [GROWER LIST]\nUrgency and deadlines: [URGENCY AND DEADLINES]\nHome base and availability: [HOME BASE AND AVAILABILITY]\nDrive times: [DRIVE TIMES]\nWeather forecast: [WEATHER FORECAST]\nGrower constraints: [GROWER CONSTRAINTS]\n\nRULES:\n1. Before you start, check the input for completeness. If something important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Never invent product rates, thresholds, REI or PHI intervals, prices, program rules or legal requirements. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n3. Rank visits by urgency first (time-sensitive decisions, spray windows, replant deadlines), then group nearby farms to cut miles.\n4. Use only the drive times I gave. If one is missing, mark it [TO FILL IN] and do not guess distances.\n5. Plan scouting around the weather: avoid scheduling field walks during rain where possible and keep spray-decision visits ahead of the dry windows.\n6. Leave a buffer each day for emergency calls, and flag any visit that doesn't fit with a suggestion to move or phone it.\n\nOUTPUT FORMAT:\nA) Weekly overview table: day | grower | fields | purpose | time window.\nB) Daily route order with drive times and total time.\nC) Visits at risk and alternatives.\nD) Messages to confirm visit times with growers.\nE) Data gaps with markers.\n\nAlways end with: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Move everything off Tuesday because of the rain and re-plan.", "Add a two-hour buffer every afternoon for emergency calls.", "Make a printable one-page version for my truck dash.", "Write the confirmation texts for each grower.", "Show the total drive time for each day.", "Re-plan the week if the Hoffman call becomes urgent tomorrow.", "Add the Wednesday meeting and keep the rest of the day useful.", "Mark which visits could be done by phone or with photos.", "Make a version I can paste into my Google Calendar.", "Build a template I can reuse every week with the same growers."], "checklista": ["Every urgent decision has a visit before its deadline.", "Drive times match reality and nothing was guessed.", "Growers' time constraints are respected.", "Rain days aren't packed with field walks.", "Each day has a buffer for emergency calls.", "Confirmation messages went out to every grower."], "uwaga": "", "przyklad": {"wejscie": "Okay, this week. Miller Farms four fields, Hoffman Brothers two, Jensen three fields, and Kowalski Ag one. Hoffman needs the fungicide call by Thursday, Jensen needs a stand count before he decides on replant. I start from the office in Ames, I'm available Monday to Friday seven to six but Wednesday afternoon I've got the co-op meeting. Ames to Miller 25 minutes, Miller to Hoffman 40, Hoffman to Jensen 30, Jensen to Kowalski 20, Kowalski back to Ames 50. Rain Tuesday, dry Wednesday through Friday, hot Thursday. Dave Jensen only after 3, Tom Hoffman is out Friday.", "wynik": "A) WEEKLY OVERVIEW\n| Day | Grower | Fields | Purpose | Time window |\n| Mon | Hoffman Bros | 2 | fungicide decision scouting | 8:00–10:30 |\n| Mon | Jensen | 3 | stand count before replant decision | 3:00–5:30 |\n| Tue | (rain) | — | office: reports, calls | — |\n| Wed a.m. | Miller Farms | 4 | routine scouting | 7:30–11:30 |\n| Wed p.m. | co-op meeting | — | — | — |\n| Thu | Kowalski Ag | 1 | scouting | 8:00–9:30 |\n| Fri | buffer | — | follow-ups, emergency calls | — |\n\nB) MONDAY ROUTE\nAmes → Hoffman: [TO FILL IN: direct drive time] (only Ames–Miller–Hoffman given: 25 + 40 = 65 min)\nHoffman → Jensen: 30 min, but Dave is only free after 3 p.m. — fill the gap with office work or calls [ASSUMPTION].\nJensen → Ames: [TO FILL IN] (via Kowalski: 20 + 50 = 70 min)\n\nC) AT RISK\n- Hoffman fungicide call: Monday visit leaves Wednesday and Thursday dry for application.\n- Jensen stand count: if Monday slips, Wednesday after 3 p.m. conflicts with the meeting — Thursday after 3 is the backup.\n\nD) CONFIRMATION TEXTS\n- Tom, I'll be out Monday around 8 to look at the beans before your fungicide call. Work for you?\n- Dave, can I meet you at the field Monday at 3 for stand counts?\n\nE) GAPS: direct drive times Ames–Hoffman and Jensen–Ames [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "1.10", "nazwa": "Field History Card", "tag": "FIELD HISTORY", "co_robi": "Pulls every scouting visit, observation, pass and soil test from the season into one chronological field history card. It shows what worked, what keeps coming back and what to remember next season.", "kiedy": "After harvest or during winter planning meetings, when you sit down with the grower to review the season field by field.", "brief": [{"pole": "Field data", "opis": "Field name, location, acres, soil type, e.g. “North 80, McLean County, IL — 78 ac, mostly Drummer silty clay loam”."}, {"pole": "Crop and previous crop", "opis": "This season's crop and rotation, e.g. “corn after soybeans, hybrid planted April 30”."}, {"pole": "Soil test results", "opis": "Latest soil test with lab and date, e.g. “fall 2025, commercial lab: pH, OM, CEC, Bray-1 P and K in ppm”."}, {"pole": "Scouting entries", "opis": "Dated notes from your visits, e.g. “May 20 V3 good stand; June 15 V9 some gray leaf spot low; July 25 R2 hail”."}, {"pole": "Passes and fertility", "opis": "Applications from the records, e.g. “spring anhydrous, pre-emerge, one post pass, fungicide at VT”."}, {"pole": "Yield and final notes", "opis": "Harvest result and lessons, e.g. “yield monitor average 212 bu/ac, wet corner lower again”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who keeps a season history for every field. Pull together all scouting entries, passes, soil tests and yield into one field history card.\n\nINPUT:\nField data: [FIELD DATA]\nCrop and previous crop: [CROP AND PREVIOUS CROP]\nSoil test results: [SOIL TEST RESULTS]\nScouting entries: [SCOUTING ENTRIES]\nPasses and fertility: [PASSES AND FERTILITY]\nYield and final notes: [YIELD AND FINAL NOTES]\n\nRULES:\n1. Before you start, check the input for completeness. If something important is missing, ask me at most 5–7 short questions and wait for my answers.\n2. Never invent product rates, thresholds, REI or PHI intervals, prices, program rules or legal requirements. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n3. Put everything in chronological order with dates and growth stages (V/R stages, Feekes or Zadoks where relevant). Use the units I give you.\n4. Use only what I provided. Do not add products, rates or soil values; anything missing goes in as [TO FILL IN].\n5. Point out patterns: recurring problems, zones that keep underperforming, what seemed to work. Mark interpretations as [VERIFY] when the data can't prove them.\n6. End with notes for next season, phrased as questions to decide, not as rates or product choices.\n\nOUTPUT FORMAT:\nA) Field header: name, location, acres, soil, crop, previous crop.\nB) Soil test summary table with lab and date.\nC) Season timeline: date | stage | event or observation | pass applied.\nD) Yield and comparison with past years if provided.\nE) Patterns and lessons.\nF) Notes for next season and data gaps.\n\nAlways end with: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Add last season's card and compare the two years side by side.", "Turn the timeline into a one-page summary for the winter meeting.", "List every recurring problem across the seasons I gave you.", "Make a section for zones within the field that underperform.", "Pull out all passes into a table I can match with the application records.", "Add questions for the grower to answer before next season.", "Create a blank card template for the rest of this grower's fields.", "Write a short narrative of the season for the landlord.", "Highlight where soil test data is older than three years.", "Format the card so it fits on a tablet screen."], "checklista": ["Every date and growth stage matches your scouting notes.", "Soil test values match the lab report, with lab name and date.", "Passes match the pesticide application records and fertilizer tickets.", "Yield numbers come from the yield monitor or scale tickets.", "Patterns marked [VERIFY] are not presented as proven.", "Next-season notes are questions, not rates."], "uwaga": "The field history card is your working document. It does not replace the required pesticide application records (including restricted-use pesticide records), the nutrient management plan or any records your state or program requires.", "przyklad": {"wejscie": "North 80, McLean County, 78 acres, mostly Drummer silty clay loam. Corn after beans this year, planted April 30th. Soil test from fall 2025 at the commercial lab, pH 6.4, OM 4.1, Bray P1 28 ppm, K 165 ppm, CEC 24. Scouting: May 20th V3 good stand; June 15th V9 some gray leaf spot low in the canopy; July 25th R2 hail with some leaf shredding, no claim. Passes: spring anhydrous, a pre, one post, fungicide at VT. Yield monitor said 212 average, and the wet corner by the tile outlet was lower again like last year.", "wynik": "FIELD HISTORY CARD — North 80\nLocation: McLean County, IL | 78 ac | Soil: mostly Drummer silty clay loam\nCrop: corn | Previous crop: soybeans | Planted: April 30\n\nA) SOIL TEST (fall 2025, commercial lab [TO FILL IN: lab name])\n| pH | OM | Bray-1 P | K | CEC |\n| 6.4 | 4.1% | 28 ppm | 165 ppm | 24 |\n\nB) SEASON TIMELINE\n| Date | Stage | Observation | Pass |\n| spring | — | — | anhydrous, rate [TO FILL IN] |\n| [TO FILL IN] | — | — | pre-emerge herbicide [TO FILL IN: product] |\n| April 30 | — | planted, hybrid [TO FILL IN] | — |\n| May 20 | V3 | good stand | — |\n| June 15 | V9 | gray leaf spot, low in canopy | — |\n| [TO FILL IN] | — | — | post-emerge pass |\n| [TO FILL IN] | VT | — | fungicide [TO FILL IN: product] |\n| July 25 | R2 | hail, leaf shredding; no claim filed | — |\n\nC) YIELD\nYield monitor average: 212 bu/ac. Wet corner by the tile outlet lower again (second year in a row).\n\nD) PATTERNS\n- Wet corner underperforms two seasons running — drainage or tile issue possible [VERIFY].\n- Gray leaf spot present at V9; how much the VT fungicide helped can't be shown without a check strip [VERIFY].\n\nE) NEXT SEASON\n- Should the wet corner be managed as its own zone?\n- Is a tile inspection worth scheduling?\n- Leave an untreated check strip if a fungicide goes on?\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}]}, {"dzial_nr": 2, "dzial": "Production Planning & Nutrient Management", "opis": "Nitrogen plans, lime, soil tests, nutrient budgets, rotations, planting and seed choice — every season starts with numbers and paperwork. You enter your soil tests, state and land-grant guidance and trial data, and get a ready plan with step-by-step math, where nothing is made up and everything to check is clearly marked.", "skills": [{"id": "2.01", "nazwa": "Nitrogen Rate Plan (4R)", "tag": "NITROGEN PLAN", "co_robi": "Builds a field-by-field nitrogen plan following 4R Nutrient Stewardship (right source, rate, time, place) and the structure of an NRCS 590 nutrient management plan. It works the rate step by step only from the state or land-grant guidance, credits and soil tests you enter, then splits it into timings and product amounts.", "kiedy": "In winter planning or before sidedress season, when a grower asks “how much N do I need to book?” or a 590 plan has to be updated for a cost-share contract.", "brief": [{"pole": "Grower and fields", "opis": "Grower, county, fields and acres, e.g. “Miller Farms, Story County, IA — North 80 (78 ac) and Creek field (112 ac)”."}, {"pole": "Crop and yield goal", "opis": "Crop, previous crop and realistic yield, e.g. “corn after soybeans, 5-year APH about 205 bu/ac”."}, {"pole": "State N guidance", "opis": "The rate guidance you use and its source, e.g. “Iowa State MRTN calculator, corn after soybeans, my N:corn price ratio gave 140 lb N/ac, profitable range 125–155”."}, {"pole": "Credits and soil tests", "opis": "Manure, legume or soil nitrate credits you have, e.g. “no manure since 2021; late-spring nitrate test planned for June”."}, {"pole": "N sources and timing", "opis": "Products, N content and planned timing, e.g. “anhydrous 82-0-0 preplant, UAN 32% sidedress at V5–V6, MAP from the P program”."}, {"pole": "Plan requir
