cre or $ retainer per season]\nNot included: full farm budget, NRCS / FSA program applications.", "kopiuj": true}, {"tytul": "Premium package", "tekst": "PREMIUM PACKAGE — “Full-service agronomy”\nWho it's for: larger operations that want one advisor for agronomy, numbers and paperwork.\nWhat's included:\n• everything in Standard\n• weekly scouting in season and priority response (same or next day) [TO FILL IN]\n• cost and margin per acre by field, break-even price and yield\n• season budget and cash-flow review\n• help preparing NRCS (EQIP, CSP, 590 plan) and FSA paperwork — final submission stays with the grower and the agency\n• end-of-season report and planning meeting for next year\nFee: [TO FILL IN: $ per acre or $ retainer per season]\nOption: [TO FILL IN: add-ons such as grid / zone sampling, drone imagery, on-farm trials]", "kopiuj": true}, {"tytul": "Proposal template", "tekst": "ADVISORY PROPOSAL\nFor: [GROWER / FARM] | Prepared by: [NAME, CCA NO., COMPANY] | Date: [DATE]\n\n1. Your operation: [ACRES, CROPS, COUNTIES, KEY GOALS]\n2. What you told me matters most: [PRIORITY 1, PRIORITY 2, PRIORITY 3]\n3. What I propose: [PACKAGE NAME] covering [ACRES] ac\n4. Scope:\n| Service | Frequency | Deliverable |\n| [SCOUTING] | [FREQUENCY] | [REPORT AFTER EACH VISIT] |\n| [NUTRIENT PLAN] | [ONCE PER SEASON] | [PLAN BY FIELD] |\n5. Fee: [TO FILL IN: $ per acre × acres = total, or retainer] | Payment terms: [TO FILL IN]\n6. What I need from you: [FIELD MAPS / FSA MAPS, SOIL TESTS, YIELD DATA, INPUT INVOICES]\n7. Independence: [I do not sell inputs / I am paid only by you — adjust to your situation]\n8. Start date and term: [DATE, SEASON / 12 MONTHS]\nValid until: [DATE]\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": true}, {"tytul": "Proposal email", "tekst": "Subject: Agronomy proposal for [FARM NAME] — [CROP YEAR]\n\nHi [FIRST NAME],\n\nThanks for walking the fields with me on [DATE]. As promised, I've attached a proposal for the [CROP YEAR] season.\n\nIn short:\n• [PACKAGE] for [ACRES] acres\n• [NUMBER] visits with a written report after each one\n• [MAIN BENEFIT — e.g., a nitrogen plan by field and a clear cost per acre]\n\nFee: [TO FILL IN]. The proposal is valid until [DATE].\n\nIf it helps, I can go through it with you over the phone in 15 minutes — would [DAY] or [DAY] work?\n\nBest,\n[NAME]\n[PHONE] | [COMPANY]", "kopiuj": true}, {"tytul": "Follow-up (after 3–5 days)", "tekst": "Subject: Quick follow-up — [FARM NAME] proposal\n\nHi [FIRST NAME],\n\nJust checking in on the proposal I sent on [DATE]. I know this time of year is busy.\n\nTwo quick things:\n1. Is there anything in the scope you'd like to add or take out? I can adjust the package to fit your operation.\n2. If timing is the issue, the first visit would be around [DATE / STAGE] — we'd need to confirm by [DATE] to get soil sampling or scouting scheduled.\n\nHappy to answer any questions by phone or text.\n\nThanks,\n[NAME]\n[PHONE]", "kopiuj": true}, {"tytul": "Price list — structure", "tekst": "PRICE LIST — [YOUR BUSINESS NAME] — [CROP YEAR]\n(Fill in your own rates based on your costs, time and local market. Check your state custom rate survey and what other independent agronomists in your area charge [TO FILL IN].)\n\n| Service | Unit | Rate | Notes |\n| Basic package | $ / ac / season | [TO FILL IN] | [MINIMUM ACRES] |\n| Standard package | $ / ac / season | [TO FILL IN] | |\n| Premium package | $ / ac / season or retainer | [TO FILL IN] | |\n| Extra field visit | $ / visit | [TO FILL IN] | [MILEAGE POLICY] |\n| Soil sampling (grid / zone) | $ / ac or $ / sample | [TO FILL IN] | lab fees [INCLUDED / BILLED SEPARATELY] |\n| Nutrient management plan (NRCS 590) | $ / plan or $ / ac | [TO FILL IN] | |\n| Cost and margin analysis | $ / farm | [TO FILL IN] | |\n| Program paperwork support | $ / hour | [TO FILL IN] | |\n| Hourly consulting | $ / hour | [TO FILL IN] | |\n\nPayment terms: [TO FILL IN] | Mileage: [TO FILL IN] | Valid until: [DATE]", "kopiuj": true}, {"tytul": "Objection answers", "tekst": "“It's too expensive.”\n→ “I get it. Let's run the numbers together: on [ACRES] acres the package works out to [TO FILL IN: $ per acre]. One unnecessary pass or one missed problem across the whole field usually costs more than that — I can work it out with your own input prices.”\n\n“The co-op agronomist does it for free.”\n→ “Your co-op agronomist does good work. The difference is that their service is built into the price of the inputs they sell. I don't sell anything — my recommendation is independent, and you buy wherever you get the best deal.”\n\n“I already have a seed rep.”\n→ “Keep him — seed reps know their lineup. I look at the whole picture: every field, every input and the cost per acre, and I'm not tied to one brand.”\n\n“I've been farming for 30 years, I know what I'm doing.”\n→ “And it shows in your fields. I'm not here to replace your experience — I take the scouting legwork, the record keeping and the math off your plate, and the decisions stay with you.”\n\n“I'll think about it.”\n→ “Sure. What matters most to you in this decision — the price, the scope or trust? If it helps, I can do one trial visit for [TO FILL IN].”\n\n“Not this year, maybe next season.”\n→ “Understood. Let me check back before [TIME OF YEAR]. In the meantime, can I send you a short list of what to watch in your fields?”\n\n“My extension office gives me that information.”\n→ “Extension is a great resource and I use their research too. What I add is someone who walks your specific fields at the right time and turns that research into a plan for your farm.”", "kopiuj": true}]}, {"id": "B4", "ikona": "✅", "tytul": "20 Filled-In Examples", "podtytul": "See exactly what to type and what you get back — across all 6 departments.", "opis": "20 real situations from an agronomist's season: soybean scouting, a 4R N plan, cost per acre, a hail claim, an FSA acreage report checklist and an RUP record from a voice note. Each example shows the input and an excerpt of the result. Every number comes from the user — the AI never invents rates, thresholds or deadlines and marks gaps with [TO FILL IN], [VERIFY] and [CHECK LABEL].", "sekcje": [{"tytul": "1. Soybean scouting report: SDS and white mold risk (Skill 1.02)", "tekst": "WHAT YOU TYPE:\n“Miller Farms, McLean County IL, Creek field 95 ac, soybeans at R3. SDS showing in the low spots on the east side — interveinal yellowing, maybe 10 plants in 20 ft of row in the worst area. Canopy closed, lots of rain last 2 weeks, white mold history in 2023. Write it up for Tom.”\n\nWHAT YOU GET:\nSCOUTING REPORT — Miller Farms, Creek field (95 ac), soybeans R3\n| Item | Observation | Assessment |\n| SDS | ~10 symptomatic plants / 20 ft of row, east low spots | Localized; map affected area [TO FILL IN: % of field] |\n| White mold | No apothecia found | High-risk setup: closed canopy, wet weather, field history |\n| Stage | R3 | [VERIFY: confirm on 10 plants] |\nNotes: SDS cannot be fixed with a foliar spray this season — record it for variety and seed-treatment decisions next year. White mold: any fungicide decision follows the label and your extension risk tool [VERIFY]; product, rate and timing [CHECK LABEL].\nNext visit: [TO FILL IN: date] to check for apothecia and lower-stem lesions.\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "2. Voice note → visit report: wheat stripe rust in Kansas (Skill 1.03)", "tekst": "WHAT YOU TYPE:\nDictated in the pickup: “Hoffman Brothers, Section 14 wheat, south-central Kansas, flag leaf just emerging I'd say Feekes 8, stripe rust pustules on the second leaf down, not on the flag yet, maybe 1 in 10 plants. Variety is [I forget]. Grower wants to know if we spray. Make it short.”\n\nWHAT YOU GET:\nVISIT REPORT — Hoffman Brothers, SW¼ Sec. 14, winter wheat\n1. Stage: Feekes 8 [VERIFY: flag leaf fully emerged?].\n2. Stripe rust: pustules on flag-1 leaf, ~10% of plants; flag leaf clean at this visit.\n3. Variety: [TO FILL IN] — its stripe rust rating drives the decision.\n4. Decision factors: variety rating, weather forecast, yield potential and grain price vs. application cost [TO FILL IN]. Check current K-State rust reports [VERIFY].\n5. If sprayed: fungicide labeled for wheat stripe rust; rate, latest growth stage and PHI [CHECK LABEL].\n6. Record any application in the spray records.\nQuestion for you: what yield are you expecting on this field?\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "3. Corn stand count and emergence in Iowa (Skill 1.06)", "tekst": "WHAT YOU TYPE:\n“Story County IA, North 80, corn on corn, 30-inch rows, planted at 34,000 seeds/ac. Counted 1/1000 acre (17 ft 5 in) in 5 spots: 31, 29, 33, 30, 27. Some gaps where the planter skipped near the waterway. Is the stand OK?”\n\nWHAT YOU GET:\nSTAND COUNT — North 80, corn, 30\" rows\nAverage: (31+29+33+30+27)/5 = 150/5 = 30 plants per 1/1000 ac\nStand: 30 × 1,000 = 30,000 plants/ac\nEmergence: 30,000 / 34,000 × 100 = 88.2%\n| Metric | Value |\n| Seeding rate | 34,000 seeds/ac (your data) |\n| Final stand | 30,000 plants/ac |\n| Loss vs. seeding rate | 4,000 plants/ac |\nReplant: compare with your state extension replant guide for this planting date [VERIFY] — do not decide on the average alone.\nGaps near the waterway: count separately [TO FILL IN] and check uniformity (doubles/skips) [ASSUMPTION: planter singulation issue].\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "4. Hail damage report: canola in Saskatchewan (Skill 1.07)", "tekst": "WHAT YOU TYPE:\n“Jensen Farms near Humboldt SK, Home quarter 160 ac canola, hail last night around 9 pm. Plants bolting to early flower. Stems bruised, about half the leaf area gone in the worst strip along the south side, north half looks fine. Grower called his insurer already. Need a damage report with photos list.”\n\nWHAT YOU GET:\nCROP DAMAGE REPORT — Jensen Farms, Home quarter (160 ac), canola\nEvent: hail, [TO FILL IN: date], ~9 pm (grower's report)\nStage: bolting to early flower [VERIFY: BBCH on 10 plants]\n| Zone | Damage seen | Est. area |\n| South strip | Stem bruising, ~50% leaf loss | [TO FILL IN: ac] |\n| North half | Minimal visible damage | [TO FILL IN: ac] |\nRecovery: canola can compensate depending on stage and stand — reassess in [ASSUMPTION: 7–10 days] before any decision.\nPhoto list: GPS-tagged photos per zone, stems, close-ups, check areas.\nInsurance: the adjuster sets the loss — do not work or reseed the field before the claim is inspected [VERIFY with policy].\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "5. Corn N rate plan with 4R: corn on corn in Iowa (Skill 2.01)", "tekst": "WHAT YOU TYPE:\n“Iowa, Story County, 300 ac corn following corn. Using the Iowa State MRTN calculator. My N price is $0.55/lb N and I'm using $4.20/bu corn. Plan is fall anhydrous plus sidedress. Build a 4R plan for the grower.”\n\nWHAT YOU GET:\n4R NITROGEN PLAN — 300 ac corn following corn\nPrice ratio: $0.55 / $4.20 = 0.13 (lb N : bu corn)\n| 4R | Plan |\n| Right source | Anhydrous ammonia + sidedress [TO FILL IN: UAN or other] |\n| Right rate | From MRTN calculator, corn-following-corn, ratio 0.13 [TO FILL IN: lb N/ac] |\n| Right time | Fall vs. spring split [VERIFY: soil temp guidance for fall NH3] |\n| Right place | Injected; sidedress between rows |\nNote: corn-on-corn typically needs a different MRTN rate than corn after soybeans — use the corn-corn curve [VERIFY].\nTotal N to buy: rate × 300 ac = [TO FILL IN] lb N.\nIf this is part of an NRCS 590 plan, match the plan's rate and records [VERIFY].\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "6. N budget with a soybean credit (Skill 2.04)", "tekst": "WHAT YOU TYPE:\n“Corn after soybeans, 220 ac, Illinois. My target total N from the state guidance is 160 lb N/ac. Already on: spring anhydrous 100 lb N/ac and MAP 11-52-0 at 100 lb product/ac. How much do I sidedress? There's also the soybean credit.”\n\nWHAT YOU GET:\nN BUDGET — 220 ac corn after soybeans\nN from MAP: 100 lb × 11% = 11 lb N/ac\nApplied so far: 100 + 11 = 111 lb N/ac\nRemaining to target: 160 − 111 = 49 lb N/ac\n| Source | lb N/ac |\n| Target (your state guidance) | 160 |\n| Anhydrous | 100 |\n| MAP | 11 |\n| Balance | 49 |\nSoybean credit: [TO FILL IN]. Important: if your 160 is an MRTN rate for corn after soybeans, the rotation effect is already built in — subtracting a credit again double-counts it [VERIFY].\nSidedress total: 49 × 220 = 10,780 lb N, before any credit adjustment.\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "7. Soil test interpretation and lime (Skill 2.03)", "tekst": "WHAT YOU TYPE:\n“Dave Jensen, Creek field 72 ac, new lab report: water pH 5.6, buffer pH 6.5, OM 3.1%, CEC 14, Mehlich-3 P 18 ppm, K 140 ppm. Corn-soy rotation. Explain it for Dave and tell me what's missing for a lime rec.”\n\nWHAT YOU GET:\nSOIL TEST SUMMARY — Creek field (72 ac)\n| Test | Result | Reading |\n| Water pH | 5.6 | Below the usual corn-soy target [VERIFY: your state target pH] |\n| Buffer pH | 6.5 | Used to set the lime rate |\n| OM | 3.1% | Your lab's value |\n| CEC | 14 | Moderate buffering |\n| P (Mehlich-3) | 18 ppm | Category [VERIFY: state interpretation table] |\n| K | 140 ppm | Category [VERIFY: state table] |\nLime rate: [TO FILL IN] ton/ac from your lab or state buffer-pH table, adjusted for ECCE/ENP of the lime you'll buy.\nStill missing: sample depth, the lime source's quality data, and the target pH.\nFor Dave: acidity first — fixing pH helps the P and K you already have.\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "8. Corn cost per acre with the grower's numbers (Skill 3.01)", "tekst": "WHAT YOU TYPE:\n“Hoffman Brothers, 400 ac corn. Per acre: seed $120, fertilizer $165, crop protection $55, machinery and fuel $70, crop insurance $22, operating interest $18, cash rent $260. Expected yield 210 bu/ac. Give me cost per acre and per bushel.”\n\nWHAT YOU GET:\nCOST PER ACRE — 400 ac corn\n| Item | $/ac |\n| Seed | 120 |\n| Fertilizer | 165 |\n| Crop protection | 55 |\n| Machinery & fuel | 70 |\n| Crop insurance | 22 |\n| Operating interest | 18 |\n| Cash rent | 260 |\n| Total | 710 |\nCheck: 120+165+55+70+22+18+260 = 710 $/ac\nWhole field: 710 × 400 = $284,000\nCost per bushel: 710 / 210 = $3.38/bu\nNot included: labor, drying and hauling [TO FILL IN]. Yield 210 bu/ac is your estimate [ASSUMPTION] — check it against APH.\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "9. Soybean breakeven price and yield (Skill 3.03)", "tekst": "WHAT YOU TYPE:\n“Soybeans, 600 ac, total cost $520 per acre including rent. APH is 58 bu/ac. Current new-crop bid is $10.40. What's my breakeven price and breakeven yield?”\n\nWHAT YOU GET:\nBREAKEVEN — 600 ac soybeans\nBreakeven price: $520 / 58 bu = $8.97/bu\nBreakeven yield at $10.40: $520 / $10.40 = 50.0 bu/ac\n| Metric | Value |\n| Cost | $520/ac (your data) |\n| APH | 58 bu/ac |\n| Bid | $10.40/bu |\n| Margin at APH | (58 × 10.40) − 520 = 603.20 − 520 = $83.20/ac |\n| Whole farm | 83.20 × 600 = $49,920 |\nSensitivity: each $0.50/bu change moves the margin by 58 × 0.50 = $29/ac.\nBasis and the exact bid date: [VERIFY]. Crop insurance indemnity is not included [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "10. Own sprayer vs. custom application (Skill 3.07)", "tekst": "WHAT YOU TYPE:\n“Should we keep our sprayer? Annual costs: depreciation $28,000, interest $9,000, insurance and shed $3,000, repairs $6,000. Fuel and labor about $1.10/ac. We cover 2,500 ac a year. Custom quote is $9.50/ac.”\n\nWHAT YOU GET:\nOWN vs. CUSTOM — 2,500 ac/yr\nOwnership + repairs: 28,000 + 9,000 + 3,000 + 6,000 = $46,000\nPer acre: 46,000 / 2,500 = $18.40 + 1.10 operating = $19.50/ac\n| Option | $/ac | Annual |\n| Own | 19.50 | 19.50 × 2,500 = $48,750 |\n| Custom | 9.50 | 9.50 × 2,500 = $23,750 |\n| Difference | 10.00 | $25,000 |\nBreakeven acres: 46,000 / (9.50 − 1.10) = 46,000 / 8.40 ≈ 5,476 ac\n[ASSUMPTION: repairs treated as fixed; they actually rise with use.]\nNot priced yet: timeliness — value of spraying on time [TO FILL IN]. Compare the quote with your state custom rate survey [VERIFY].\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "11. Canola gross margin in Saskatchewan (Skill 3.02)", "tekst": "WHAT YOU TYPE:\n“1,200 ac canola near Saskatoon. Expected 45 bu/ac, price $14.00/bu CAD. Variable costs $390/ac (seed, fert, chem, fuel, insurance). What's the gross margin?”\n\nWHAT YOU GET:\nGROSS MARGIN — canola, 1,200 ac (CAD)\nRevenue: 45 × $14.00 = $630/ac\nGross margin: 630 − 390 = $240/ac\n| Item | $/ac | Total |\n| Revenue | 630 | 630 × 1,200 = $756,000 |\n| Variable costs | 390 | 390 × 1,200 = $468,000 |\n| Gross margin | 240 | $288,000 |\nYield sensitivity: −5 bu/ac = −5 × 14.00 = −$70/ac, margin $170/ac.\nNot in gross margin: land, depreciation, overhead [TO FILL IN for net margin].\nPrice $14.00 is your assumption [VERIFY: delivery month and grade].\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "12. Advisory proposal for a new grower (Skill 4.01)", "tekst": "WHAT YOU TYPE:\n“Proposal for Hoffman Brothers, 1,800 ac corn and soybeans, south-central Nebraska. Independent, no product sales. Weekly scouting May–August, N plan, fungicide decisions, end-of-season report. My fee is $6.50/ac.”\n\nWHAT YOU GET:\nPROPOSAL — Independent Crop Advisory, 2027 season\nClient: Hoffman Brothers, 1,800 ac corn/soybeans\nScope:\n1. Weekly field scouting, May–August, written report after each visit\n2. Nitrogen plan (4R) and in-season adjustments\n3. Fungicide and insecticide decisions with threshold documentation\n4. End-of-season report with yield and field-by-field notes\nIndependence: I don't sell seed, fertilizer or chemicals — every recommendation is based on your fields only.\n| Fee | Calculation | Total |\n| $6.50/ac | 6.50 × 1,800 | $11,700/season |\nPayment terms: [TO FILL IN]. Start date: [TO FILL IN].\nNot included: soil sampling lab fees, application [VERIFY with client].\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "13. Reply to “the co-op agronomist does it for free” (Skill 4.10)", "tekst": "WHAT YOU TYPE:\n“Grower Dave Jensen says: why pay you $6/ac when the co-op agronomist comes out for free? He farms 900 ac. Write me a short, respectful text reply. No trash talk about the co-op.”\n\nWHAT YOU GET:\nTEXT REPLY:\n“Dave, fair question. The co-op agronomist does good work, and the visit is free because it's part of how products get sold. My recommendations come only from your fields — I don't earn more if you spray, and I'll tell you when not to. On your 900 acres, $6/ac is $5,400 a season. One skipped pass that wasn't needed, or one fungicide timed right, can cover that [ASSUMPTION — your numbers will decide]. Want me to walk one field with you this month, no charge, so you can compare?”\nWhy it works:\n| Point | Purpose |\n| Respects the co-op | Keeps trust |\n| Independence | Your real value |\n| Math with his acres | 6 × 900 = 5,400 |\n| Low-risk next step | Moves to a visit |\nPayback example is illustrative [VERIFY] — use a real case from your own clients if you have one.\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "14. Monthly report for a grower (Skill 4.05)", "tekst": "WHAT YOU TYPE:\n“July report for Miller Farms. 4 visits, 9 fields. Gray leaf spot found on 2 corn fields, below spray decision, watching. Japanese beetles on soybeans, defoliation about 10%. One fungicide applied on Creek field corn on July 22. Next: tar spot watch, yield checks in August.”\n\nWHAT YOU GET:\nMONTHLY REPORT — Miller Farms, July\n| Metric | Value |\n| Visits | 4 |\n| Fields scouted | 9 |\n| Applications | 1 (Creek field corn, July 22) |\nKey findings:\n1. Gray leaf spot — 2 corn fields, below your decision level; monitoring weekly [TO FILL IN: field names].\n2. Japanese beetle — soybeans, ~10% defoliation; compare with extension threshold for the stage [VERIFY].\n3. Creek field fungicide — product and rate per the application record [TO FILL IN].\nAugust plan: tar spot scouting on lower leaves, yield estimates per field [TO FILL IN: dates].\nOne question for you: do you want yield checks on all corn fields or only the top 4?\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "15. FSA acreage reporting checklist (Skill 5.01)", "tekst": "WHAT YOU TYPE:\n“Dave Jensen, Red River Valley ND, wheat 640 ac, soybeans 900 ac, sugar beets 300 ac, some prevented planting on the north quarter. Make a checklist of what he needs to bring to the county FSA office for the acreage report.”\n\nWHAT YOU GET:\nACREAGE REPORTING CHECKLIST — Dave Jensen, ND\n| Item | Status |\n| Farm and tract numbers for every field | [TO FILL IN] |\n| Crop and acres: wheat 640, soybeans 900, sugar beets 300 | from grower |\n| Total reported | 640 + 900 + 300 = 1,840 ac |\n| Planting dates per crop and field | [TO FILL IN] |\n| Maps with field boundaries marked | [TO FILL IN] |\n| Share arrangements with landlords | [TO FILL IN] |\n| Prevented planting acres, north quarter | [TO FILL IN: ac] |\nDeadlines: acreage report and prevented planting notice dates [VERIFY with county FSA office and crop insurance agent] — do not rely on last year's dates.\nMatch acres with the crop insurance report to avoid discrepancies [VERIFY].\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "16. Hail claim documentation in Nebraska (Skill 5.07)", "tekst": "WHAT YOU TYPE:\n“Hoffman Brothers, south-central Nebraska, irrigated corn at V12, hail on 2 pivots, about 260 ac total. Leaves shredded, some stalks broken. Grower already called the agent this morning. Help me organize the documentation for the adjuster.”\n\nWHAT YOU GET:\nCLAIM DOCUMENTATION — Hoffman Brothers, hail on corn (V12)\n| Item | Status |\n| Notice of loss to agent | Done today [TO FILL IN: time, claim number] |\n| Fields and acres | 2 pivots, ~260 ac [TO FILL IN: FSA field numbers] |\n| Stage at event | V12 [VERIFY on 10 plants per pivot] |\n| Photos | GPS-tagged, per pivot: leaves, broken stalks, growing point |\n| Weather | Storm date/time, local hail reports [TO FILL IN] |\n| Untouched check strips | Leave for adjuster [VERIFY with policy] |\nRules: no tillage, replant or destruction before the adjuster releases the field [VERIFY]. Loss %, yield and payment are set by the adjuster under the policy — not estimated here.\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "17. Inspection prep: state Dept. of Agriculture records check (Skill 5.09)", "tekst": "WHAT YOU TYPE:\n“Got a letter: state Dept. of Agriculture wants to review RUP records and WPS compliance at Miller Farms next month. Grower is nervous. Make a prep list for him.”\n\nWHAT YOU GET:\nINSPECTION PREP — Miller Farms\n| Item | Ready? |\n| RUP application records, required period | [VERIFY: how many years your state requires] |\n| Each record: product, EPA reg. no., amount, crop, acres, location, date, applicator + cert. no. | [TO FILL IN: gaps] |\n| Applicator certifications current | [TO FILL IN: expiration dates] |\n| WPS: safety info and application info displayed | [VERIFY] |\n| WPS: worker/handler training records | [TO FILL IN] |\n| Labels on file for every product used | [TO FILL IN] |\n| Storage: locked, signed, spill kit | [TO FILL IN] |\nNext steps: copy the letter's request list exactly; fix gaps now, don't back-date anything; call the inspector to confirm scope [VERIFY].\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "18. RUP application record from a voice note (Skill 6.01)", "tekst": "WHAT YOU TYPE:\nDictated: “Sprayed the Creek field today, Story County, corn pre, 80 acres, restricted-use atrazine product, 1 quart per acre, 15 gallons water, wind southwest 6 to 8, started 7:40 finished 9:15. I'm the applicator, cert number in my wallet.”\n\nWHAT YOU GET:\nPESTICIDE APPLICATION RECORD — Restricted Use\n| Field | Entry |\n| Date | [TO FILL IN: today's date] |\n| Location | Creek field, Story County IA |\n| Crop / site | Corn, preemergence |\n| Area treated | 80 ac |\n| Product (brand name) | [TO FILL IN: exact name from label] |\n| EPA Reg. No. | [TO FILL IN] |\n| Rate | 1 qt/ac (your data) [CHECK LABEL] |\n| Total product | 80 × 1 qt = 80 qt = 20 gal |\n| Carrier | 15 gal/ac → 80 × 15 = 1,200 gal spray |\n| Time | 7:40–9:15 |\n| Wind | SW 6–8 mph |\n| Applicator + cert. no. | [TO FILL IN] |\nREI for this field: [CHECK LABEL]. Keep the record for the period your state requires [VERIFY].\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "19. Soybean aphid threshold decision (Skill 6.02)", "tekst": "WHAT YOU TYPE:\n“Soybeans R2, Story County. Counted aphids on 10 plants: 180, 260, 310, 140, 220, 290, 350, 200, 240, 210. Extension threshold I use is 250 per plant and increasing. Last week's average was 120. Spray or not?”\n\nWHAT YOU GET:\nTHRESHOLD DECISION — soybeans R2\nAverage: (180+260+310+140+220+290+350+200+240+210)/10 = 2,400/10 = 240 aphids/plant\nPlants above 250: 4 of 10 = 40%\nTrend: 120 → 240 = doubled in one week (increasing)\n| Check | Result |\n| Average vs. 250 | 240 — just below |\n| Population increasing | Yes |\n| Natural enemies | [TO FILL IN] |\nDecision: not at threshold today, but close and rising. Re-count in [ASSUMPTION: 3–4 days] on at least 20 plants across the field.\nIf it crosses: insecticide labeled for soybean aphid; rate and PHI [CHECK LABEL]; consider resistance groups [VERIFY].\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}, {"tytul": "20. Label check before a white mold fungicide rec (Skill 6.04)", "tekst": "WHAT YOU TYPE:\n“Planning a fungicide for white mold on soybeans at R1–R3 for Miller Farms, McLean County IL. I have the product name and the label PDF. What do I need to check on the label before I write the rec?”\n\nWHAT YOU GET:\nLABEL CHECK — fungicide, soybeans, white mold\n| Check | Result |\n| Soybeans and white mold (Sclerotinia) on the label | [CHECK LABEL] |\n| Registered in Illinois | [VERIFY with state lead agency] |\n| Rate range per acre | [CHECK LABEL] |\n| Application timing / growth stage | [CHECK LABEL: R1–R3 allowed?] |\n| Max per application and per season | [CHECK LABEL] |\n| REI | [CHECK LABEL] |\n| PHI | [CHECK LABEL] |\n| Carrier volume, ground vs. air | [CHECK LABEL] |\n| Tank-mix restrictions | [CHECK LABEL] |\n| PPE and WPS requirements | [CHECK LABEL] |\nAlso: FRAC group for resistance rotation [CHECK LABEL]. The label is the law — every number in the rec comes from it.\n\nThis is a draft for your review — the final call, signature and liability stay with you.", "kopiuj": false}]}, {"id": "B5", "ikona": "📲", "tytul": "Installation Guide: free ChatGPT, Claude & Gemini + the app on your phone and computer", "podtytul": "Your agronomy office ready to go in 10 minutes — on your computer and your phone.", "opis": "Step by step, we show you how to run AgronomAI PRO in ChatGPT, Claude or Gemini, including on a free account. You get ready-made system instructions to paste and the steps to put the app icon on your phone's home screen and your computer. Button names in these services change from time to time — if something looks different, look for an option with a similar name.", "sekcje": [{"tytul": "ChatGPT", "tekst": "1. Go to chatgpt.com (or download the ChatGPT app for iPhone or Android) and sign up for free with your email, Google, Microsoft or Apple account.\n2. Free account: start a new chat, paste the system instructions from the last section of this guide as your first message, then paste the MASTER PROMPT of the Skill you need.\n3. To avoid pasting the instructions every time: open Settings → Personalization → Custom instructions and paste them there (they'll apply to all your chats).\n4. Paid plan (Plus or higher): create a Project (e.g., “Agronomy office”) and paste the system instructions into the project instructions. You can also upload files to it, such as your price list or report templates. Another option is a custom GPT: Explore GPTs → Create → paste the instructions under “Instructions”.\n5. In the field, use the microphone button to dictate your notes, then ask ChatGPT to turn them into a report with the right Skill.\nTip: button names change from time to time — if something looks different, look for the option with a similar name.", "kopiuj": false}, {"tytul": "Claude", "tekst": "1. Go to claude.ai (or download the Claude app for iPhone or Android) and sign up for free with your email or Google account.\n2. Free account: start a new chat, paste the system instructions from the last section of this guide, and then paste the MASTER PROMPT of the Skill you need.\n3. Projects: create a Project (e.g., “Agronomy office”), open “Project instructions” and paste the system instructions there. Every chat inside the project will follow them automatically. You can also add files to the project knowledge — report templates, your price list, a sample label or soil test report.\n4. You can paste long documents (labels, soil test reports, program fact sheets) or upload PDFs and photos, and ask Claude to work from them.\nTip: one Skill = one new chat inside the project.", "kopiuj": false}, {"tytul": "Gemini", "tekst": "1. Go to gemini.google.com (or open the Gemini app on your phone) and sign in with your Google account — a free Gmail account works.\n2. Free account: start a new chat, paste the system instructions from the last section of this guide, then paste the MASTER PROMPT of the Skill you need.\n3. Gems: open Gems → New Gem, give it a name (e.g., “AgronomAI PRO”) and paste the system instructions into the instructions field. Then open the Gem whenever you want to work on agronomy tasks.\n4. Gemini works well with Google Sheets and Google Docs — handy for the Spreadsheet Pack and the report templates.\nTip: if Gems aren't available on your account, simply paste the system instructions at the start of each chat.", "kopiuj": false}, {"tytul": "Install the AgronomAI PRO app on your phone and computer", "tekst": "AgronomAI PRO is a web app (PWA) — nothing to download from an app store.\nApp link: https://juniordanielbraga.github.io/agronomai-pro/en/app/\n\niPhone (Safari):\n1. Open the app link in Safari.\n2. Tap the Share icon (the square with an arrow).\n3. Choose “Add to Home Screen” → “Add”.\n\nAndroid (Chrome):\n1. Open the app link in Chrome.\n2. Tap the menu (⋮, three dots in the top-right corner).\n3. Choose “Add to Home screen” or “Install app” → confirm.\n\nComputer (Chrome / Edge on Windows or Mac):\n1. Open the app link in the browser.\n2. Click the install icon in the address bar (a monitor with a down arrow, or a “+”), or open the menu → “Install AgronomAI PRO” / “Install page as app”.\n\nMac (Safari):\n1. Open the app link in Safari.\n2. Go to File → Add to Dock.\n\nTip: in the field, dictation saves a lot of time — use the microphone in the ChatGPT, Claude or Gemini app to record your scouting notes, then paste them together with the Skill's MASTER PROMPT.", "kopiuj": false}, {"tytul": "How to use Skills and agents", "tekst": "1. Pick a department (e.g., “6 Crop Protection & Application Records”) and the Skill that fits the task.\n2. Read “When to use it” and get the brief data ready: grower, field, crop, growth stage, observations, soil test results, prices.\n3. Copy the MASTER PROMPT, paste it into ChatGPT, Claude or Gemini and replace the fields in square brackets with your data. You can also paste the prompt without data — the AI will ask you questions.\n4. Answer the AI's questions. Don't know something? Type “I don't know” — the AI will mark it [TO FILL IN].\n5. Polish the result with the short follow-up commands listed under each Skill, e.g., “Cut it to one page”, “Add an application table”.\n6. Go through the checklist and check every [VERIFY] and [CHECK LABEL] marker — especially rates, REI, PHI and program deadlines.\n7. AI agents are ready-made specialists for longer work (e.g., a nutrient agent, a programs agent, a proposals agent). Paste the agent's instructions at the start of a new chat, answer its 5 starter questions and work with it like a colleague in the office.\n8. One Skill = one new chat. Long chats covering many fields and topics lose track of the context.", "kopiuj": false}, {"tytul": "System instructions to paste", "tekst": "You are the office assistant for an agronomist and farm advisor working in the United States, Canada, Australia or New Zealand. You support independent agronomists, Certified Crop Advisers (CCAs), retail agronomists at ag retailers and co-ops, extension-style farm advisors and farm managers in preparing scouting reports, recommendations, nutrient plans, cost and margin calculations, advisory proposals, program paperwork and pesticide application records. You know the day-to-day practice: 4R Nutrient Stewardship (right source, rate, time, place), NRCS 590 nutrient management plans, soil test reports in ppm (Mehlich-3, Bray-1, Olsen), CEC, OM and buffer pH, growth stages (V/R stages for corn and soybeans, Feekes or Zadoks for small grains), IPM and university extension economic thresholds, product labels and EPA registration numbers (\"the label is the law\"; PMRA labels in Canada), restricted-use pesticide (RUP) record keeping, the Worker Protection Standard (WPS), USDA FSA (acreage reporting, ARC/PLC), NRCS programs (EQIP, CSP, conservation practices), RMA crop insurance, and land-grant university extension recommendations.\n\nWORKING RULES:\n1. Ask first. If data is missing (crop, hybrid or variety, growth stage, acres, soil test results, product label, prices, current program rules), ask no more than 5–7 short questions before drafting. If the user wants a draft anyway, write it and clearly show the gaps.\n2. Do not invent. Never give pesticide or fertilizer rates, REI or PHI days, economic thresholds with numbers, program payment rates, insurance figures, prices, deadlines, or regulation section numbers from memory. Rates, REI and PHI come only from the product label; nutrient levels come from the soil test report; N rate guidance comes from the user's state or land-grant recommendations; program rules and deadlines come from the current FSA, NRCS or RMA information; prices come from the user.\n3. Mark clearly: missing data [TO FILL IN], assumptions you made [ASSUMPTION], anything uncertain or to be checked against the source [VERIFY], and anything that must come from the product label [CHECK LABEL].\n4. Calculate step by step. Lay out every calculation (N budget, cost per acre, margin per acre, product needed per field, break-even) so it can be checked in a spreadsheet. Always show units: ac, bu/ac, lb/ac, gal/ac, fl oz/ac, ppm, $/ac, $/bu, $/ton. If the user works in hectares or metric units, use the units they give you.\n5. Format for easy reading: headings, simple tables in the | a | b | format, numbered steps and checklists. Write documents for growers in plain language, without jargon.\n6. Write in clear, professional American English, the way a working agronomist talks in the field and in the office — direct and concise.\n7. Safety and compliance: whenever pesticides come up, remind the user to follow the label, including REI, PHI, PPE, buffer zones, drift and pollinator protection, and RUP record keeping where it applies. For FSA, NRCS or RMA programs and crop insurance, remind the user to verify the current rules and deadlines with the local FSA or NRCS office or their crop insurance agent.\n8. End every document, recommendation or calculation with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "kopiuj": true}]}]}};

 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast(msg)).catch(fb);else fb()}

 const ws=q.split(/\s+/);const hit=t=>{t=norm(t);return ws.every(w=>t.includes(w))};

 $('#main').innerHTML=`<span class="pill np">RESULTS: ${r.length+ag.length}</span><h2>Searching: “${esc(e.target.value.trim())}”</h2>

 ${!r.length&&!ag.length?'<p class="empty">No results — try another word, e.g. “nitrogen”, “corn”, “FSA”, “proposal”.</p>':''}`}

 $('#main').innerHTML=`<span class="pill">Access active · Version 1.0 · Ag Team</span>
 <h1>AgronomAI<em>PRO</em></h1>
