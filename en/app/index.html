on.", "Add a section on conservation practices already in place.", "Turn the key facts into a one-page fact sheet.", "Rewrite it in the first person, as if the grower wrote it.", "List every statement that needs a document behind it.", "Add a short paragraph on marketing and risk management.", "Write a version for a new landlord."], "checklista": ["Acres, yields and head counts match the grower's records.", "Owned and rented land are described correctly.", "No qualifications, awards or certifications were added that the grower doesn't have.", "Length and tone fit the purpose and any character limit.", "All [TO FILL IN] items were completed or removed.", "The grower approved the final wording."], "uwaga": "", "przyklad": {"wejscie": "Need a farm description for Hoffman Brothers LLC in Clay County, Nebraska. Two brothers and one of their sons, they started in 1987. 2,600 irrigated corn and beans, 400 dryland wheat, about 150 cow-calf pairs. They own 1,100 acres and rent 1,900. 180,000 bushels of storage, two full-time hired guys. Thirty-some years farming, the son has an ag business degree, they all have private applicator licenses. Sell corn to the ethanol plant 25 miles away and the co-op, calves go to the sale barn. This is for the Farm Credit loan file, keep it to a page.", "wynik": "A) Master description\nHoffman Brothers LLC is a family crop and cattle operation in Clay County, Nebraska, started in 1987 and run today by two brothers and the son of one of them. The operation farms 3,000 acres: 2,600 irrigated acres of corn and soybeans and 400 dryland acres of wheat (2,600 + 400 = 3,000). They own 1,100 acres and rent 1,900 (1,100 + 1,900 = 3,000). The herd is about 150 cow-calf pairs.\n\nThe farm has 180,000 bu of on-farm grain storage and employs two full-time workers. The owners bring more than 30 years of farming experience; the son holds an agricultural business degree, and all three hold private applicator licenses.\n\nCorn is sold to an ethanol plant about 25 miles away and to the local co-op; calves are marketed through the sale barn. [TO FILL IN: crop insurance, marketing approach, average yields.]\n\nB) Key facts\n| item | value | source |\n| total acres | 3,000 | grower |\n| owned / rented | 1,100 / 1,900 | grower [VERIFY with leases] |\n| storage | 180,000 bu | grower |\n| cattle | about 150 pairs | grower |\n\nC) Missing\nYield history, lease terms, insurance coverage, equipment list.\n\nD) For the lender\nEmphasize owned base, storage and diversified income from cattle.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "5.09", "nazwa": "Agency Records Request & Inspection Prep", "tag": "RECORDS AND INSPECTION", "co_robi": "Reads an agency letter or inspection notice — FSA or NRCS compliance review, spot check, or a state Department of Agriculture restricted-use pesticide (RUP) record inspection — and drafts a factual response plus a document checklist. It points out gaps before the inspector does, and never invents rules or deadlines.", "kiedy": "When a client gets a letter asking for records, a spot check is scheduled, or the state is coming to look at pesticide application records and you want everything in order first.", "brief": [{"pole": "Letter or request", "opis": "Paste the letter, email or notice the grower received, e.g. “FSA letter requesting proof of planted acres for the North 80 (pasted below)”."}, {"pole": "Farm and application", "opis": "Which farm, program or contract it concerns, e.g. “Dave Jensen, Story County, IA — ARC-CO, current crop year, FSA farm number on the letter”."}, {"pole": "Facts on the ground", "opis": "What actually happened, in your words, e.g. “North 80 planted to corn, 78 ac, but 6 ac drowned out and were replanted to soybeans in June”."}, {"pole": "Available records", "opis": "What documents exist, e.g. “planter monitor maps, seed invoices, RUP application records, insurance acreage report”."}, {"pole": "Procedures", "opis": "Paste any rules, instructions or inspection notice you have, e.g. “state Dept. of Agriculture notice of RUP record inspection (pasted below)”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who helps farm clients with USDA program paperwork, lenders and compliance every season. Help me respond to an agency records request or prepare for an inspection.\n\nINPUT:\n- Letter or request (pasted): [LETTER OR REQUEST]\n- Farm and application: [FARM AND APPLICATION]\n- Facts on the ground: [FACTS ON THE GROUND]\n- Available records: [AVAILABLE RECORDS]\n- Procedures (pasted): [PROCEDURES]\n\nRULES:\n1. If important data is missing, ask me up to 5–7 short questions first and wait for my answers before you write the document.\n2. Do not invent payment rates, dollar amounts, program deadlines, form numbers, eligibility rules or regulation citations. Work only from the program rules and documents I paste; anything not covered there, mark [VERIFY].\n3. Mark missing data [TO FILL IN] and anything you assume [ASSUMPTION]. If you calculate anything (acres, totals, percentages), show the math step by step.\n4. Read the letter carefully and list exactly what is being asked. Response deadlines and requirements come only from the letter or rules I paste; if missing, mark [VERIFY].\n5. Never invent regulation citations, penalty amounts or record-keeping requirements. For RUP records, list the fields we hold and compare them with the requirements I paste; otherwise [VERIFY WITH YOUR STATE].\n6. Be factual. If the facts don't match what was reported, say so plainly and suggest the grower talk to the agency or his own advisor before answering.\n\nOUTPUT FORMAT:\nA) What the agency is asking for, point by point, with any deadline from the letter.\nB) Gap check: | request | record we have | gap or risk |.\nC) Draft response letter, short and factual.\nD) Document checklist for the inspection or office visit.\nE) Talking points for the grower, and what not to guess about.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Make the response letter shorter and more formal.", "Build a binder index for the inspection.", "Compare my RUP application records with the requirements I'll paste.", "List every record that is missing or incomplete.", "Write a phone script for calling the county office to clarify the request.", "Prepare a timeline of what happened on the field.", "Make a checklist for the Worker Protection Standard items on the farm.", "Add a section explaining the replanted acres.", "Write a cover note listing the attached documents.", "Summarize the risk for the grower in three sentences."], "checklista": ["Every point in the letter is answered.", "The deadline from the letter is on the calendar.", "Every statement in the response matches the records.", "No regulation citations or rules were added without a source.", "Pesticide records include what the state and federal rules require [VERIFY].", "The grower has read and signs the response himself.", "Copies of everything sent are kept with the date."], "uwaga": "If the facts don't match what was reported, the grower may want to talk to the agency or a qualified advisor before responding. Pesticide record-keeping rules for private applicators come from federal and state requirements — confirm them with your state lead agency. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Dave Jensen got a letter from FSA asking for proof of planted acres on the North 80 for this crop year, I'll paste it. What happened: we planted 78 acres of corn, but about 6 acres drowned out by the creek and he replanted those to beans in June. I'm not sure the acreage report was updated. We've got planter monitor maps for both passes, seed invoices, insurance acreage report. Also the state Ag Department wants to look at his RUP records next month. Help me get ready for both.", "wynik": "A) What FSA is asking\n- Proof of planted acres, North 80, current crop year [TO FILL IN: exact wording and response deadline from the letter].\n\nB) Gap check\n| request | record we have | gap or risk |\n| corn planted acres | planter map, seed invoice | 78 ac shown, but 6 ac were later replanted |\n| soybean replant | planter map, June | not on acreage report? [VERIFY] |\n| acreage report | copy at FSA | may still show 78 ac corn |\n\nCorn actually harvested area: 78 − 6 = 72 ac [ASSUMPTION: drowned-out area mapped at 6 ac].\n\nC) Draft response\n“In response to your letter dated [TO FILL IN], enclosed are planter monitor maps and seed invoices for the North 80. 78 acres were planted to corn on [TO FILL IN]. About 6 acres drowned out and were replanted to soybeans on [TO FILL IN]. We request guidance on correcting the acreage report if needed.”\n\nD) Checklist\n- Both planter maps, seed invoices, insurance acreage report.\n- RUP inspection: every application record — product, EPA registration number, rate, date, location, applicator certification [VERIFY WITH YOUR STATE the required fields].\n\nE) Talking points\nStick to the records; talk to the county office before sending if the report differs from the facts.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "5.10", "nazwa": "Compliance Calendar & Farm Deadlines", "tag": "COMPLIANCE CALENDAR", "co_robi": "Builds a year-round compliance calendar for the operation: FSA acreage reporting, crop insurance dates, NRCS contract tasks, loan renewals, pesticide record-keeping and certifications. It only uses dates you paste from official sources — every other date is a placeholder marked [VERIFY].", "kiedy": "At the start of the crop year or after a client signs a new contract, when you want one calendar that keeps the grower — and you — from missing a date.", "brief": [{"pole": "Farm operation", "opis": "Who, where, what they grow, e.g. “Miller Farms, McLean County, IL — corn and soybeans, 1,800 ac, 3 employees”."}, {"pole": "Programs and contracts", "opis": "Everything they're enrolled in, e.g. “ARC-CO, CSP contract, revenue protection crop insurance, Farm Credit operating line, grain contracts with the co-op”."}, {"pole": "Required records", "opis": "Records they must keep, e.g. “RUP application records, WPS postings, 590 nutrient application records, grain contract confirmations”."}, {"pole": "Pasted dates", "opis": "Paste the dates from official sources — FSA, RMA, NRCS, lender, state, e.g. “county FSA newsletter and the agent's sales closing reminder (pasted below)”."}, {"pole": "Calendar format", "opis": "How you want it, e.g. “month-by-month table I can print and pin on the shop wall”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who helps farm clients with USDA program paperwork, lenders and compliance every season. Build a compliance calendar for this farm operation.\n\nINPUT:\n- Farm operation: [FARM OPERATION]\n- Programs and contracts: [PROGRAMS AND CONTRACTS]\n- Required records: [REQUIRED RECORDS]\n- Dates pasted from official sources: [PASTED DATES]\n- Calendar format: [CALENDAR FORMAT]\n\nRULES:\n1. If important data is missing, ask me up to 5–7 short questions first and wait for my answers before you write the document.\n2. Do not invent payment rates, dollar amounts, program deadlines, form numbers, eligibility rules or regulation citations. Work only from the program rules and documents I paste; anything not covered there, mark [VERIFY].\n3. Mark missing data [TO FILL IN] and anything you assume [ASSUMPTION]. If you calculate anything (acres, totals, percentages), show the math step by step.\n4. Use only dates from the text I paste. For every other obligation, write the task with the month left open and mark it [VERIFY] — never fill in a typical date from memory, even if you think you know it.\n5. For each item show the source of the date (which document I pasted) or [VERIFY WITH YOUR FSA OFFICE], [VERIFY WITH YOUR AGENT], [VERIFY WITH YOUR LENDER] or [VERIFY WITH YOUR STATE].\n6. Group by month, and add a lead-time reminder before each date so the grower has time to prepare.\n\nOUTPUT FORMAT:\nA) Calendar table: | month | date | obligation | program or agency | what to prepare | date source |.\nB) Items with no confirmed date yet, grouped by who to ask.\nC) Ongoing records to keep all year (pesticides, nutrients, contracts).\nD) Reminder plan: who reminds whom, and how far ahead.\nE) Version in the format I asked for.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Turn the calendar into a list I can paste into Google Calendar.", "Add two-week reminders before every confirmed date.", "Make a separate calendar for the grower's employees.", "List every date that still needs confirming, grouped by agency.", "Add the dates from the lender letter I'll paste.", "Make a one-page printable version for the shop wall.", "Add license and certification renewals for each applicator.", "Write a text message template for monthly reminders.", "Highlight the dates where missing them costs the grower money.", "Update the calendar with the new dates I'll paste."], "checklista": ["Every date has a source document or a [VERIFY] marker.", "No dates were filled in from memory.", "All programs, contracts and loans the grower has are included.", "Applicator license and certification renewals are listed.", "Reminders give enough lead time to prepare.", "The grower knows who is responsible for each item."], "uwaga": "Program, insurance and regulatory dates change every year and differ by state, county and crop. Never rely on a date the AI didn't get from you — confirm each one with FSA, your crop insurance agent, NRCS, your lender and your state lead agency. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Calendar for Miller Farms, McLean County, corn and beans, 1,800 acres, three employees. They're in ARC-CO, have a CSP contract, revenue protection crop insurance, an operating line with Farm Credit and some grain contracts with the co-op. Records: RUP applications, WPS stuff for the guys, the 590 nutrient records, grain contract confirmations. I pasted the county FSA newsletter that has the acreage reporting date in it, nothing else official yet. Give me a month-by-month table I can print, and tell me what dates I still need to chase down.", "wynik": "A) Calendar\n| month | date | obligation | program or agency | what to prepare | date source |\n| per newsletter | as pasted | acreage report, spring crops | FSA | field list, planting dates, maps | FSA newsletter |\n| [VERIFY] | [VERIFY WITH YOUR AGENT] | sales closing, crop insurance | agent | coverage decisions | — |\n| [VERIFY] | [VERIFY WITH YOUR AGENT] | production reporting | agent | yield records by unit | — |\n| [VERIFY] | [VERIFY WITH YOUR FSA OFFICE] | ARC/PLC election and enrollment | FSA | election decision | — |\n| [VERIFY] | [VERIFY WITH NRCS] | CSP annual activities and records | NRCS | contract schedule | — |\n| [VERIFY] | [VERIFY WITH YOUR LENDER] | operating line renewal | Farm Credit | balance sheet, cash flow | — |\n\nB) Dates to chase\n- Crop insurance agent: sales closing, acreage and production reporting.\n- FSA: ARC/PLC enrollment window.\n- NRCS: CSP contract activity dates.\n- Farm Credit: renewal date and required statements.\n- State: applicator license renewals [VERIFY WITH YOUR STATE].\n\nC) Ongoing records\nRUP applications (each one, within the required time [VERIFY]), WPS postings, 590 nutrient applications, grain contract confirmations.\n\nD) Reminders\nTwo weeks ahead: text to grower; one week ahead: check documents are ready.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}]}, {"dzial_nr": 6, "dzial": "Crop Protection & Application Records", "opis": "The application itself takes an hour; the paperwork around it — records, justification, work orders, label checks — eats your evenings. This department turns field notes and pasted labels into finished records, programs and work orders without inventing a single rate, REI or PHI: everything comes from the label and your own data.", "skills": [{"id": "6.01", "nazwa": "Pesticide Application Records", "tag": "APPLICATION RECORDS", "co_robi": "Turns a cab note, text message or voice memo into a complete pesticide application record, including the fields required for restricted-use pesticide (RUP) record keeping. It lays everything out in one table and flags exactly what is still missing before the record is complete.", "kiedy": "The evening after spraying, or before a state Dept. of Agriculture inspection, when the applications are in your head and on scraps of paper but the records have to be complete and readable.", "brief": [{"pole": "Grower and field", "opis": "Grower, field name, legal description or FSA farm and tract, acres treated and crop, e.g. “Dave Jensen, North 80 (SW¼ Sec. 14), Story County, IA — 78 ac soybeans”."}, {"pole": "Date and timing", "opis": "Date, start and finish time and crop growth stage, e.g. “July 29, 6:40–9:15 a.m., soybeans at R3”."}, {"pole": "Product and label rate", "opis": "Product name, EPA reg. no. and the rate copied from the label, e.g. “[product from label], EPA Reg. No. [TO FILL IN], rate per label, 15 gal/ac carrier”."}, {"pole": "Target pest and reason", "opis": "What you sprayed for and why, e.g. “soybean aphid, scouted July 26, counts above the extension threshold”."}, {"pole": "Conditions and equipment", "opis": "Weather at application and the rig, e.g. “72°F, wind SW 4–6 mph, no inversion, 90 ft self-propelled boom, air-induction tips”."}, {"pole": "Applicator", "opis": "Who applied and their certification, e.g. “Dave Jensen, private applicator, cert. no. not on hand, expires [TO FILL IN]”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who helps growers keep pesticide application records that hold up to a state Dept. of Agriculture inspection, including restricted-use pesticide (RUP) records for private applicators. Turn my notes into a complete record.\n\nINPUT:\nGrower, field, acres, crop: [GROWER AND FIELD]\nDate, time, growth stage: [DATE AND TIMING]\nProduct, EPA reg. no., label rate: [PRODUCT AND LABEL RATE]\nTarget pest and reason: [TARGET PEST AND REASON]\nWeather and equipment: [CONDITIONS AND EQUIPMENT]\nApplicator and certification: [APPLICATOR]\n\nRULES:\n1. If key data is missing, first ask me up to 5–7 short questions and wait for my answers.\n2. Never invent rates, REI or PHI intervals, buffer distances, economic thresholds, brand names, seasonal maximums or legal deadlines. Use only the label, my state and extension sources and the data I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION], uncertain items [VERIFY]; anything that must come from the label is [CHECK LABEL].\n3. Show every calculation step by step.\n4. Build the record with at least the federal RUP elements for private applicators: brand or product name, EPA registration number, total amount applied, crop or site, size of area treated, location, month/day/year, and the certified applicator's name and certification number. State rules may add fields, a time limit to record and a retention period — mark them [VERIFY WITH YOUR STATE]. For Australia, follow your state's chemical application record rules [VERIFY WITH YOUR STATE].\n5. Calculate total amount applied as label rate × acres treated, only if I give the label rate.\n6. REI expiry = application end time + REI from the label; earliest harvest = application date + PHI from the label. Without the label, leave [CHECK LABEL].\n\nOUTPUT FORMAT:\nA) Record table: | date | time | field and location | crop and stage | acres | product | EPA Reg. No. | rate | total applied | target pest | applicator and cert. no. |\nB) Calculations step by step: total product, total spray volume, REI expiry, earliest harvest date.\nC) List of fields still to fill in or verify.\nD) One sentence on what to attach (label photo, scouting note, sprayer log).\n\nEnd with this note: “Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Turn all my notes from this week into separate record rows.", "Add a column with the REI expiry time and the earliest legal harvest date.", "Format the record to print on one landscape letter page.", "Check which rows are incomplete and tell me what is missing.", "Total the amount of each product used this season from the table.", "Add an IPM justification line to each application.", "Reformat the table as CSV so I can paste it into Excel.", "Make a single-field history sorted by date.", "List every product where I have not given the label rate or EPA reg. no.", "Write a short summary for the landowner of what was applied on their ground."], "checklista": ["Product name and EPA registration number match the label in the cab.", "The crop and site are on the label and the product is registered in your state.", "Rate and total applied come from the label and the sprayer log, not from memory.", "Acres treated match the FSA map or the as-applied map.", "The applicator's certification number is filled in and the certification is current.", "REI and PHI dates are calculated from the label.", "The record will be kept for the period your state requires [VERIFY WITH YOUR STATE]."], "uwaga": "Apply only as the label directs and only products registered in your state for that crop and site. Rates, REI, PHI, buffers and seasonal maximums come from the label and your state lead agency, never from the AI. RUP records must meet the federal private applicator rules and any stricter state rules on content, timing and retention. Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "OK, yesterday, July 29th, I sprayed the North 80, that's the southwest quarter of section 14 in Story County, beans, 78 acres. Started about twenty to seven, done about quarter after nine. Beans are at R3. It was for soybean aphids — I scouted Friday the 26th and we were over the extension threshold on most of the stops. I used [product from label], it's a restricted-use insecticide, I don't have the EPA number or the rate in front of me, the jug's back at the shed. Ran 15 gallons of water per acre. About 72 degrees, wind southwest maybe 4 to 6, no inversion, dew was off. Our 90-foot self-propelled with air-induction tips. I applied it myself, Dave Jensen, private applicator, can't remember my cert number off the top of my head. Make me a proper record out of this.", "wynik": "A) Application record\n| date | time | field and location | crop and stage | acres | product | EPA Reg. No. | rate | total applied | target pest | applicator and cert. no. |\n| 07/29 | 6:40–9:15 a.m. | North 80, SW¼ Sec. 14, Story County, IA | soybeans, R3 | 78 | [product from label] (RUP) | [TO FILL IN] | [CHECK LABEL] | [TO FILL IN] | soybean aphid, scouted 07/26 | Dave Jensen, private applicator, cert. no. [TO FILL IN] |\n\nB) Calculations\nTotal product = label rate × 78 ac = [CHECK LABEL] × 78 → calculate once the rate is entered.\nSpray volume = 15 gal/ac × 78 ac = 1,170 gal.\nREI expiry = 07/29, 9:15 a.m. + REI from label = [CHECK LABEL].\nEarliest harvest = 07/29 + PHI from label = [CHECK LABEL].\n\nC) To fill in or verify\n- EPA registration number and rate, from the label on the jug.\n- Certification number and expiration date [TO FILL IN].\n- Whether your state requires extra fields (e.g., wind, applicator license type) or a shorter time to record [VERIFY WITH YOUR STATE].\n- Retention period for RUP records [VERIFY WITH YOUR STATE].\n- WPS: if any workers enter the field before REI expiry, posting and notification apply [CHECK LABEL].\n\nD) Attach a photo of the label and your 07/26 scouting counts — that is your best justification if anyone asks.\n\nFollow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "6.02", "nazwa": "Treatment Decision vs. Economic Threshold", "tag": "ECONOMIC THRESHOLD", "co_robi": "Compares your scouting counts with the economic threshold you take from your land-grant extension and turns it into a clear spray / wait / rescout decision. It shows the math, the cost of treating versus the value at risk, and writes a short justification for your records.", "kiedy": "Right after scouting, when counts look close to threshold and you need to decide today whether to call the applicator, and document why.", "brief": [{"pole": "Crop and stage", "opis": "Crop, field, acres and growth stage, e.g. “soybeans, Creek field, 112 ac, R3, McLean County, IL”."}, {"pole": "Pest", "opis": "The pest or disease you are deciding on, e.g. “soybean aphid, winged forms starting to show”."}, {"pole": "Scouting results", "opis": "Counts, sample size and dates, e.g. “20 plants at 5 stops on Aug 1; 8 days ago average was about half”."}, {"pole": "Threshold from source", "opis": "The economic threshold and where it comes from, e.g. “250 aphids per plant with populations increasing — university extension guide, current edition”."}, {"pole": "Prices and costs", "opis": "Expected yield, price and treatment cost, e.g. “60 bu/ac expected, $10.20/bu, product plus custom application about $X per acre”."}, {"pole": "Restrictions", "opis": "Anything that limits the decision, e.g. “neighbor's bees on the east side, PHI must clear before harvest, 2 applications already this season”."}], "prompt": "You are an experienced independent agronomist and CCA who makes integrated pest management decisions based on scouting data and university extension economic thresholds. Help me decide whether a treatment is justified and document the decision.\n\nINPUT:\nCrop, field, acres, stage: [CROP AND STAGE]\nPest or disease: [PEST]\nScouting counts, sample size, dates: [SCOUTING RESULTS]\nEconomic threshold and its source: [THRESHOLD FROM SOURCE]\nYield, price, treatment cost: [PRICES AND COSTS]\nRestrictions: [RESTRICTIONS]\n\nRULES:\n1. If key data is missing, first ask me up to 5–7 short questions and wait for my answers.\n2. Never invent rates, REI or PHI intervals, buffer distances, economic thresholds, brand names, seasonal maximums or legal deadlines. Use only the label, my state and extension sources and the data I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION], uncertain items [VERIFY]; anything that must come from the label is [CHECK LABEL].\n3. Show every calculation step by step.\n4. Use only the threshold I give you and name its source. If I give none, stop and ask; never supply a threshold yourself — mark it [TO FILL IN: threshold from your extension guide].\n5. Calculate averages, percent of plants infested and the trend between scouting dates; flag small sample sizes as [VERIFY].\n6. Compare treatment cost per acre with the value of yield at risk only from my numbers; label any yield-loss estimate [ASSUMPTION].\n7. Give one of three outcomes: treat now, rescout on a stated date, or no treatment — with the reasons.\n\nOUTPUT FORMAT:\nA) Scouting summary table: | date | stops | plants sampled | average count | % infested | trend |\nB) Comparison with the threshold, step by step.\nC) Cost versus value at risk, step by step.\nD) Decision and rescout date.\nE) Three-sentence justification for the IPM record.\n\nEnd with this note: “Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Redo the decision with the counts from today's rescout.", "Show what the decision would be if the price drops by a dollar a bushel.", "Write the justification in two sentences for the grower's file.", "Make a rescout plan with dates and number of stops.", "Explain the decision in plain words I can text to the grower.", "Flag which stops are driving the average up.", "Add a column for natural enemies I saw at each stop.", "List the conditions under which we would treat only part of the field.", "Check whether my sample size is enough for a confident decision.", "Prepare the same table for the next field from my notes."], "checklista": ["The threshold comes from a current extension source and matches the crop stage.", "Counts follow the sampling method that the threshold assumes.", "Trend between scouting dates is calculated, not guessed.", "Prices and treatment cost are current numbers from the grower or the retailer.", "PHI, pollinator and buffer restrictions are checked on the label before any treat decision [CHECK LABEL].", "The decision and its reason are saved in the IPM record."], "uwaga": "Economic thresholds change by region, crop stage, price and edition of the guide — take them from your land-grant extension, never from the AI. Any product used must be labeled for the crop and pest, and the label governs rate, REI, PHI and pollinator restrictions. Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Creek field, 112 acres of beans out by Bloomington, McLean County, they're at R3. Soybean aphid. Scouted August 1st, 5 stops, 20 plants each. My counts: stop one about 180 per plant average, stop two 310, stop three 140, stop four 260, stop five 220. Eight days ago I was averaging roughly 100. Starting to see a few winged ones. The extension guide I use says 250 per plant with populations increasing. Expect about 60 bushel, cash bid $10.20. Insecticide plus custom application, call it [TO FILL IN] per acre, I need to get the quote. There are bee boxes on the east side of the field. Do I spray or wait?", "wynik": "A) Scouting summary\n| date | stops | plants sampled | average count | % infested | trend |\n| 07/24 | [TO FILL IN] | [TO FILL IN] | ~100 | [TO FILL IN] | baseline |\n| 08/01 | 5 | 100 | 222 | [TO FILL IN] | increasing |\n\nB) Threshold comparison\nAverage = (180 + 310 + 140 + 260 + 220) ÷ 5 = 1,110 ÷ 5 = 222 aphids per plant.\nThreshold from your extension guide: 250 per plant with populations increasing [VERIFY: current edition].\nPopulation went from ~100 to 222 in 8 days → more than doubled. 2 of 5 stops (310 and 260) are already above 250.\n\nC) Cost vs. value at risk\nGross value = 60 bu × $10.20 = $612/ac.\nTreatment cost = [TO FILL IN] $/ac → break-even yield protected = cost ÷ $10.20 bu/ac.\nYield loss if untreated: [ASSUMPTION — depends on population growth; not estimated without data].\n\nD) Decision\nNot yet at threshold on the field average, but rising fast. Rescout on 08/04 with the same 5 stops; if the average is at or above 250 and still increasing, treat. Check pollinator restrictions for the bee boxes on the east side before any application [CHECK LABEL].\n\nE) Justification\nOn 08/01 the field averaged 222 aphids per plant, below the 250 threshold from the extension guide, but up from ~100 on 07/24. Treatment deferred; rescout on 08/04.\n\nFollow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "6.03", "nazwa": "Season Crop Protection Program", "tag": "SPRAY PROGRAM", "co_robi": "Builds a season-long crop protection program by growth stage — burndown, pre, post, fungicide and insecticide windows — using only the products and label data you provide. It includes mode-of-action rotation, rotational restrictions and a decision point for every optional pass.", "kiedy": "In winter or early spring when you plan inputs with a grower, place orders with the retailer and want one written program to share with the applicator.", "brief": [{"pole": "Crop and fields", "opis": "Crop, fields, acres and rotation, e.g. “Hoffman Brothers, south-central Nebraska — 1,450 ac corn after soybeans, 9 pivots”."}, {"pole": "Pest history and pressure", "opis": "What has caused trouble in past seasons, e.g. “waterhemp escapes in 2025, gray leaf spot most years, western bean cutworm on the sandier pivots”."}, {"pole": "Products from labels", "opis": "Products you plan to use or already have, with label groups, e.g. “[herbicide A from label] Group 15, [fungicide from label] Groups 3+11 — labels attached”."}, {"pole": "Goal and intensity", "opis": "What the program should achieve and the budget level, e.g. “clean start, residual overlap, fungicide only if disease warrants, keep it under $X per acre”."}, {"pole": "Restrictions", "opis": "Rotation, label and field limits, e.g. “soybeans next year, two pivots next to a creek, organic neighbor on the north line”."}], "prompt": "You are an experienced independent agronomist and CCA who builds season crop protection programs for row-crop growers. Build a written program for this crop and these fields.\n\nINPUT:\nGrower, crop, fields, acres, rotation: [CROP AND FIELDS]\nPest history and pressure: [PEST HISTORY AND PRESSURE]\nProducts and groups from labels: [PRODUCTS FROM LABELS]\nGoal and budget level: [GOAL AND INTENSITY]\nRestrictions: [RESTRICTIONS]\n\nRULES:\n1. If key data is missing, first ask me up to 5–7 short questions and wait for my answers.\n2. Never invent rates, REI or PHI intervals, buffer distances, economic thresholds, brand names, seasonal maximums or legal deadlines. Use only the label, my state and extension sources and the data I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION], uncertain items [VERIFY]; anything that must come from the label is [CHECK LABEL].\n3. Show every calculation step by step.\n4. Use only products I list. Rates, timing windows, crop stage limits, REI, PHI and plant-back intervals come from the labels — otherwise mark [CHECK LABEL].\n5. Organize by growth stage (V/R stages for corn and soybeans, Feekes or Zadoks for small grains, BBCH for canola) and mark each pass as planned or conditional on scouting.\n6. Show the WSSA, FRAC or IRAC group of each product as printed on the label and point out back-to-back use of the same group.\n7. Cost per acre only from prices I give; total it step by step.\n\nOUTPUT FORMAT:\nA) Program table: | timing and stage | pass | product | group | rate | planned or conditional | trigger | notes |\nB) Mode-of-action rotation check.\nC) Rotational, buffer and sensitive-area restrictions for next season and this season.\nD) Cost per acre and per field, step by step.\nE) Scouting calendar with decision points.\n\nEnd with this note: “Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Make a cheaper version that drops every conditional pass.", "Add a column with the plant-back interval for next year's crop.", "Split the program by field where the pressure is different.", "Rewrite it as a one-page summary for the grower.", "Turn the program into a product order list with total quantities.", "Show where the same mode-of-action group is used twice in a row.", "Add a rescue option if waterhemp escapes the post pass.", "Make a scouting calendar for my phone with dates by growth stage.", "Prepare a version for the applicator with only the planned passes.", "Compare this program with what we did last season."], "checklista": ["Every product is registered in your state and labeled for the crop and timing.", "Rates, stage limits and seasonal maximums are copied from current labels.", "Plant-back intervals allow next year's planned crop.", "No mode-of-action group is relied on alone against a problem pest.", "Sensitive areas (water, bees, organic neighbors, sensitive crops) are marked by field.", "Prices and total cost match the retailer's quote.", "Conditional passes have a clear scouting trigger."], "uwaga": "A program is a plan, not a prescription: every pass must be confirmed against the current label, state registration and in-season scouting. The AI does not choose rates or intervals. Follow state rules for any restricted-use product and for drift-sensitive herbicides. Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Hoffman Brothers, down in south-central Nebraska. 1,450 acres of corn on bean ground, all irrigated, 9 pivots. Problems: waterhemp got away on us in '25 on the three east pivots, gray leaf spot shows up most years, and western bean cutworm on the sandy pivots. They want a clean start with a residual overlap, fungicide only if disease actually shows up, and they'd like to keep the whole program reasonable. Products they're leaning toward: [herbicide A from label] Group 15 pre, [herbicide B from label] Groups 27 plus 5 post, a fungicide [from label] Groups 3 and 11. They go to beans next year. Two pivots run along the creek, organic neighbor on the north line of pivot 4. Lay it out for me.", "wynik": "A) Program — corn after soybeans, 1,450 ac\n| timing and stage | pass | product | group | rate | planned or conditional | trigger | notes |\n| at planting | pre | [herbicide A from label] | 15 | [CHECK LABEL] | planned | — | needs activating rain or irrigation [CHECK LABEL] |\n| V4–V6 [CHECK LABEL] | post + overlap residual | [herbicide B from label] | 27 + 5 | [CHECK LABEL] | planned | waterhemp under label height | max crop stage [CHECK LABEL] |\n| VT–R1 | fungicide | [fungicide from label] | 3 + 11 | [CHECK LABEL] | conditional | gray leaf spot on lower leaves per extension guidance [TO FILL IN] | PHI [CHECK LABEL] |\n| R1 window | insecticide | [TO FILL IN] | [TO FILL IN] | [CHECK LABEL] | conditional | WBC egg masses vs. your threshold [TO FILL IN] | bee and creek buffers [CHECK LABEL] |\n\nB) Mode-of-action check\nWaterhemp gets Group 15 pre, then 27 + 5 post with a second residual — two effective sites per pass [VERIFY: resistance history on the east pivots].\n\nC) Restrictions\nPlant-back to soybeans for each product [CHECK LABEL]. Creek pivots: buffers and drift-reduction requirements [CHECK LABEL]. Pivot 4 north line: drift management plan for the organic neighbor [VERIFY with FieldWatch/neighbor].\n\nD) Cost\nPer acre = sum of product prices × rates + application [TO FILL IN: retailer quote].\n\nFollow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "6.04", "nazwa": "Label and Registration Check", "tag": "LABEL CHECK", "co_robi": "Reads the label text you paste and checks your planned use against it point by point: EPA registration number, state registration, crop and site, rate and seasonal maximum, REI, PHI, PPE, buffers, drift and rotational restrictions. Anything not found in the text you pasted is flagged, never filled in.", "kiedy": "Before you write a recommendation or a work order, especially with a new product, a new crop stage or a field near water, bees or sensitive crops.", "brief": [{"pole": "Product and check date", "opis": "Product name, EPA reg. no. and the date you are checking, e.g. “[product from label], EPA Reg. No. [TO FILL IN], checked March 10”."}, {"pole": "Label text", "opis": "Paste the relevant label sections, e.g. “Directions for Use — Corn, Restrictions, PPE, Rotational Crop Restrictions, Spray Drift — pasted below”."}, {"pole": "Planned use", "opis": "Crop, stage, pest, rate and method, e.g. “field corn, V5, waterhemp, ground application, 15 gal/ac”."}, {"pole": "Field surroundings", "opis": "Sensitive areas around the field, e.g. “drainage ditch on the west side, beehives 300 yards east, soybeans on the south line”."}, {"pole": "Previous applications", "opis": "What already went on this field this season, e.g. “pre-emergence Group 15 on May 2; last year soybeans”."}], "prompt": "You are an experienced independent agronomist and CCA who checks every recommendation against the pesticide label before it is signed. The label is the law. Check my planned use against the label text I paste.\n\nINPUT:\nProduct, EPA reg. no., check date: [PRODUCT AND CHECK DATE]\nLabel text (pasted): [LABEL TEXT]\nPlanned use: [PLANNED USE]\nField surroundings: [FIELD SURROUNDINGS]\nPrevious applications: [PREVIOUS APPLICATIONS]\n\nRULES:\n1. If key data is missing, first ask me up to 5–7 short questions and wait for my answers.\n2. Never invent rates, REI or PHI intervals, buffer distances, economic thresholds, brand names, seasonal maximums or legal deadlines. Use only the label, my state and extension sources and the data I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION], uncertain items [VERIFY]; anything that must come from the label is [CHECK LABEL].\n3. Show every calculation step by step.\n4. Work only from the label text I paste. Quote the exact label sentence for every item. If an item is not in the pasted text, write [CHECK LABEL] — never fill it from memory.\n5. Check: EPA reg. no., state registration [VERIFY WITH YOUR STATE], crop and site listed, pest listed, rate and seasonal maximum, number of applications, crop stage limits, REI, PHI, PPE, buffers and drift language, endangered species or Bulletins Live! Two reference, rotational crop restrictions, mixing restrictions. Canada: PMRA label; Australia: APVMA label.\n6. Compare my planned use with each item and mark it compliant, not compliant or cannot confirm.\n\nOUTPUT FORMAT:\nA) Label check table: | item | what the label says (quote) | planned use | status |\nB) Seasonal total calculation step by step, including previous applications.\nC) Items to resolve before recommending.\nD) One-paragraph summary I can paste into the recommendation.\n\nEnd with this note: “Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Check the same planned use against a second label I'll paste.", "List only the items that are not compliant or cannot be confirmed.", "Write the PPE requirements as a short list for the applicator.", "Pull out every rotational crop restriction into a separate table.", "Check whether the label mentions endangered species bulletins.", "Compare the drift and buffer language for the two products.", "Rewrite the summary for a grower who doesn't read labels.", "Check the planned use for the field next to the creek.", "Tell me which label sections I still need to paste.", "Make a label check template I can reuse for every product."], "checklista": ["The label version is current and matches the product in the shed.", "The product is registered in your state for this use [VERIFY WITH YOUR STATE].", "The crop, site and pest are on the label.", "Rate, seasonal maximum and crop stage limits are respected, including earlier passes.", "REI, PHI and PPE are copied word for word from the label.", "Buffers, drift and endangered species requirements are checked for this field.", "Rotational restrictions allow next year's crop."], "uwaga": "The label is the law: any use inconsistent with the label is a violation, regardless of what any tool says. The AI only reads the text you paste; always check the full, current label, state registration and, where applicable, Bulletins Live! Two before recommending. Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Need a label check before I write the rec. [product from label], EPA number I'll paste with the label. Today is March 10. Planned use: field corn, around V5, for waterhemp, ground rig, 15 gallons per acre. I've pasted the corn directions, restrictions, PPE section and the rotational crop part, but not the spray drift section yet. Field has a drainage ditch on the west side, a guy keeps beehives maybe 300 yards east, and beans on the south line. Already this season: a Group 15 pre went on May 2. Last year it was beans. They want to go back to beans next year. Tell me if this works.", "wynik": "A) Label check\n| item | what the label says (quote) | planned use | status |\n| EPA Reg. No. | [TO FILL IN from pasted label] | — | cannot confirm |\n| state registration | not on label | — | [VERIFY WITH YOUR STATE] |\n| crop and site | “field corn” (Directions for Use) | field corn | compliant |\n| pest | waterhemp listed [quote from label] | waterhemp | compliant |\n| crop stage | [CHECK LABEL: max stage] | V5 | cannot confirm |\n| rate and seasonal max | [CHECK LABEL] | not stated | cannot confirm |\n| REI | [CHECK LABEL] | — | to copy |\n| PHI | [CHECK LABEL] | — | to copy |\n| PPE | quoted from pasted PPE section | — | copy to work order |\n| drift and buffers | section not pasted | ditch west, bees east, beans south | [CHECK LABEL] |\n| rotational crops | soybeans: [quote interval] | beans next year | [VERIFY: months from application] |\n\nB) Seasonal total\nPrevious: Group 15 pre on 05/02 (different product). Total of this product = planned rate × number of passes = [CHECK LABEL] — compare with the seasonal maximum.\n\nC) Resolve before recommending\n- Paste the Spray Drift section; check ditch buffer and soybean drift language.\n- Confirm max crop stage covers V5.\n- Check whether the label refers to Bulletins Live! Two for this county.\n\nD) Summary\nPlanned use is on-label for crop and pest; stage, rate, buffers and drift cannot yet be confirmed.\n\nFollow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "6.05", "nazwa": "IPM Decision Documentation", "tag": "IPM RECORD", "co_robi": "Turns your season's scouting notes, alerts and spray decisions into structured integrated pest management documentation using the prevention, avoidance, monitoring and suppression (PAMS) framework. It shows the justification for each treatment and what you learned for next season.", "kiedy": "At season end or before a program review, for an NRCS IPM practice (595) plan, a sustainability program, a buyer audit or simply to show the grower why each pass was made.", "brief": [{"pole": "Grower and crops", "opis": "Grower, crops and acres this season, e.g. “Miller Farms, Story County, IA — 1,100 ac corn and 900 ac soybeans”."}, {"pole": "Rotation and cultural practices", "opis": "Rotation, tillage, hybrids or varieties, cover crops, e.g. “corn-soy, strip-till, cereal rye cover before beans, resistant hybrids for gray leaf spot”."}, {"pole": "Monitoring and alerts", "opis": "How fields were scouted and which alerts were used, e.g. “weekly scouting May–Aug, pheromone traps for western bean cutworm, extension pest alerts”."}, {"pole": "Treatments and justifications", "opis": "Each application and why, e.g. “fungicide on Field 7 at R1 after gray leaf spot found on 3rd leaf below ear”."}, {"pole": "Efficacy review", "opis": "What worked and what didn't, e.g. “waterhemp escapes on Field 3 after post pass, rest clean; fungicide check strip showed no visible difference”."}], "prompt": "You are an experienced independent agronomist and CCA who documents integrated pest management (IPM) decisions for growers, sustainability programs and NRCS conservation practices. Turn my notes into clear IPM documentation.\n\nINPUT:\nGrower, crops, acres: [GROWER AND CROPS]\nRotation and cultural practices: [ROTATION AND CULTURAL PRACTICES]\nMonitoring and alert sources: [MONITORING AND ALERTS]\nTreatments with justifications: [TREATMENTS AND JUSTIFICATIONS]\nEfficacy review: [EFFICACY REVIEW]\n\nRULES:\n1. If key data is missing, first ask me up to 5–7 short questions and wait for my answers.\n2. Never invent rates, REI or PHI intervals, buffer distances, economic thresholds, brand names, seasonal maximums or legal deadlines. Use only the label, my state and extension sources and the data I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION], uncertain items [VERIFY]; anything that must come from the label is [CHECK LABEL].\n3. Show every calculation step by step.\n4. Organize everything under PAMS: prevention, avoidance, monitoring, suppression.\n5. For every treatment record the trigger: scouting result, threshold and its source, alert. If the justification is missing, mark [TO FILL IN] — never write one I didn't give.\n6. If the grower is enrolled in NRCS practice 595 or a buyer program, match its documentation requirements only as I describe them [VERIFY against the plan or program rules].\n7. Count treatments by type and calculate the share of treated acres that had a documented trigger.\n\nOUTPUT FORMAT:\nA) PAMS summary by crop.\nB) Treatment table: | date | field | acres | pest | trigger and source | product | group | result |\nC) Statistics step by step: number of passes, treated acres, share with documented trigger.\nD) Lessons learned and changes for next season.\nE) Gaps to fill before the record is shared.\n\nEnd with this note: “Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Write the PAMS summary as one page for the grower's file.", "Add a column with the WSSA, FRAC or IRAC group of each product.", "List every treatment that is missing a documented trigger.", "Make a version for the NRCS conservationist with only what they asked for.", "Compare this season with last season by number of passes and treated acres.", "Turn the lessons learned into a checklist for next year's plan.", "Rewrite the efficacy review based on my check strip results.", "Make a table of scouting dates by field.", "Prepare a short answer for a grain buyer's sustainability questionnaire.", "Highlight where cultural practices could replace a spray next year."], "checklista": ["Every treatment has a trigger: scouting result, threshold and source, or alert.", "Prevention and avoidance practices are described, not just sprays.", "Scouting dates and methods are recorded for each field.", "Product groups are taken from the labels.", "Efficacy notes are based on observations or check strips, not impressions.", "Program-specific requirements (NRCS 595, buyer audit) are checked against the actual plan [VERIFY]."], "uwaga": "IPM documentation must reflect what was actually done — never back-fill justifications. NRCS practice standards and payment terms vary by state and contract; check them with your NRCS office. Program participation does not change label requirements. Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Season wrap-up for Miller Farms in Story County. 1,100 acres corn, 900 beans. Corn-soy rotation, strip-till, cereal rye ahead of beans, we picked hybrids with good gray leaf spot scores. Scouted weekly May through August, had pheromone traps out for western bean cutworm, and I followed the extension pest alerts. Treatments: fungicide on Field 7, 160 acres, at R1 after we found gray leaf spot on the third leaf below the ear on most plants. Post herbicide on all beans for waterhemp. Insecticide on Field 12, 80 acres, for WBC — honestly I don't remember the egg mass count. Results: Field 3 had waterhemp escapes after the post, the rest was clean. The fungicide check strip on Field 7 didn't show a visible difference. Put this into an IPM record.", "wynik": "A) PAMS summary — Miller Farms 2026\nPrevention: corn-soy rotation, strip-till, cereal rye cover ahead of soybeans.\nAvoidance: hybrids selected for gray leaf spot tolerance.\nMonitoring: weekly scouting May–Aug; WBC pheromone traps; extension pest alerts.\nSuppression: three treatment decisions, below.\n\nB) Treatments\n| date | field | acres | pest | trigger and source | product | group | result |\n| [TO FILL IN] | Field 7 corn | 160 | gray leaf spot | lesions on 3rd leaf below ear, most plants [VERIFY: threshold source] | [product from label] | [CHECK LABEL] | no visible difference vs. check strip |\n| [TO FILL IN] | all soybeans | 900 | waterhemp | weeds at label height [TO FILL IN] | [product from label] | [CHECK LABEL] | escapes on Field 3 |\n| [TO FILL IN] | Field 12 corn | 80 | WBC | egg mass count [TO FILL IN] | [product from label] | [CHECK LABEL] | [TO FILL IN] |\n\nC) Statistics\nTreated acres = 160 + 900 + 80 = 1,140 ac.\nWith documented trigger: 160 ac (Field 7) → 160 ÷ 1,140 = 14%. Field 12 and soybeans need triggers added.\n\nD) Lessons learned\n- Field 3: test waterhemp for resistance and add a residual layer [VERIFY].\n- Field 7: yield check strip data before repeating a fungicide decision.\n\nE) Gaps\nApplication dates, Field 12 egg mass count, product groups from labels.\n\nFollow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "6.06", "nazwa": "Custom Applicator and Drone Work Order", "tag": "WORK ORDER", "co_robi": "Writes a precise work order for a custom applicator, a spray drone operator or your own sprayer operator: field, products, label rates, tank math, weather window, sensitive areas, PPE and what to record afterward. All rates and restrictions come from the label you provide.", "kiedy": "When you hand an application to someone else — co-op, custom applicator, aerial or drone service — and need everything in writing so nothing gets lost between the recommendation and the field.", "brief": [{"pole": "Field and acres", "opis": "Field, location, crop, stage and acres, e.g. “Home quarter, NE¼ Sec. 22, Hall County, NE — 152 ac corn, R1”."}, {"pole": "Products and label rates", "opis": "Products with rates copied from the label, e.g. “[fungicide from label] at label rate, adjuvant per label, 2 gal/ac by drone [CHECK LABEL aerial use]”."}, {"pole": "Equipment settings", "opis": "Rig or aircraft details, e.g. “spray drone with 10 gal tank, 30 ft swath, or ground rig 1,200 gal with 120 ft boom”."}, {"pole": "Weather window", "opis": "When to spray and the limits, e.g. “Thursday or Friday morning, wind under the label limit, no rain for 6 hours”."}, {"pole": "Field restrictions", "opis": "Sensitive areas and access, e.g. “power line along the south edge, beehives at the NE corner, organic neighbor west, enter from county road”."}, {"pole": "Applicator", "opis": "Who will apply and their credentials, e.g. “Plains Air Ag, drone operator Jake Nelson, commercial applicator license [TO FILL IN]”."}], "prompt": "You are an experienced independent agronomist and CCA who writes application work orders for custom applicators, aerial and spray drone operators. Prepare a clear work order the operator can follow in the field.\n\nINPUT:\nField, location, crop, stage, acres: [FIELD AND ACRES]\nProducts and label rates: [PRODUCTS AND LABEL RATES]\nEquipment settings: [EQUIPMENT SETTINGS]\nWeather window: [WEATHER WINDOW]\nField restrictions and access: [FIELD RESTRICTIONS]\nApplicator and credentials: [APPLICATOR]\n\nRULES:\n1. If key data is missing, first ask me up to 5–7 short questions and wait for my answers.\n2. Never invent rates, REI or PHI intervals, buffer distances, economic thresholds, brand names, seasonal maximums or legal deadlines. Use only the label, my state and extension sources and the data I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION], uncertain items [VERIFY]; anything that must come from the label is [CHECK LABEL].\n3. Show every calculation step by step.\n4. Tank math only from my numbers: acres per load = tank capacity ÷ gal per acre; product per load = label rate × acres per load; number of loads = field acres ÷ acres per load.\n5. Mixing order from the labels; if the labels don't state it, mark [VERIFY].\n6. For aerial or drone application, confirm the label allows aerial application and lists the minimum carrier volume [CHECK LABEL], and that the operator holds the required state applicator license and FAA authorizations [VERIFY].\n7. Include the sensitive areas and the field map description; never assume a buffer distance.\n\nOUTPUT FORMAT:\nA) Work order: grower, field, location, crop and stage, acres, products, rates, carrier volume, equipment, weather window.\nB) Tank math step by step.\nC) Restrictions: buffers, drift, pollinators, neighbors, power lines, REI, PPE [CHECK LABEL].\nD) What the operator must report back: time, weather, amount used, as-applied map, problems.\n\nEnd with this note: “Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Make the work order for three fields in one table.", "Redo the tank math for a 20 gal drone tank.", "Write a version in plain words to text to the operator.", "Add a section with the REI posting for the workers.", "List the questions to ask the custom applicator before booking.", "Make a field sketch description with the sensitive areas.", "Add a sign-off line for the grower and the applicator.", "Prepare the record row from what the operator reports back.", "Make a rain-delay plan with a second window.", "Check the work order for anything that needs the label."], "checklista": ["Field, location and acres match the map sent to the applicator.", "Rates, carrier volume and mixing order come from the labels.", "Aerial or drone application is allowed on the label [CHECK LABEL].", "The applicator's license and, for drones, FAA authorizations are current [VERIFY].", "Sensitive areas, beehives and neighbors are marked and communicated.", "REI, PPE and posting requirements are on the work order.", "The operator knows what to report back for the record."], "uwaga": "The applicator must follow the label, state law and, for aircraft or drones, FAA rules — the work order does not override any of them. Not every product is labeled for aerial or low-volume application; check the label. Drift complaints and violations are handled by your state lead agency. Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "I need a work order for Plains Air Ag, they're flying it with a drone. Home quarter, northeast quarter of section 22, Hall County, Nebraska, 152 acres of corn at R1. Fungicide [from label] at the label rate, plus the adjuvant the label calls for. They want to run 2 gallons per acre, I'm not sure the label allows that low for aerial. Drone has a 10-gallon tank, 30-foot swath. Window is Thursday or Friday morning, wind under whatever the label says, need 6 hours dry. Power line along the south edge, beehives on the northeast corner, organic neighbor to the west. Enter off the county road on the east. Operator is Jake Nelson, I don't have his license number.", "wynik": "A) Work order — Plains Air Ag\nGrower field: Home quarter, NE¼ Sec. 22, Hall County, NE\nCrop and stage: corn, R1 | Acres: 152\nProducts: [fungicide from label] at [CHECK LABEL] rate + adjuvant per label [CHECK LABEL]\nCarrier: 2 gal/ac requested — minimum aerial volume [CHECK LABEL]\nEquipment: spray drone, 10 gal tank, 30 ft swath\nWindow: Thu or Fri morning; wind within label limits [CHECK LABEL]; rainfast period [CHECK LABEL]\n\nB) Tank math\nAcres per load = 10 gal ÷ 2 gal/ac = 5 ac.\nProduct per load = label rate × 5 ac = [CHECK LABEL].\nLoads = 152 ÷ 5 = 30.4 → 31 loads.\nTotal product = label rate × 152 ac = [CHECK LABEL].\n\nC) Restrictions\n- Aerial application allowed on label? [CHECK LABEL]\n- Beehives NE corner: pollinator language and notification [CHECK LABEL]; contact the beekeeper [VERIFY].\n- Organic neighbor west: no spraying with wind toward the west line.\n- Power line south edge: operator decides the flight plan.\n- REI and PPE for re-entry [CHECK LABEL].\n- Jake Nelson: state applicator license and FAA authorizations [VERIFY].\n\nD) Report back\nStart and end time, wind and temperature, total gallons and product used, as-applied map, any area skipped.\n\nFollow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "6.07", "nazwa": "Resistance Management Strategy", "tag": "RESISTANCE", "co_robi": "Reviews your application history by WSSA/HRAC, FRAC or IRAC group, spots repeated reliance on one mode of action and builds a multi-year resistance management plan combining chemical and non-chemical tactics. It also outlines how to document suspected resistance and get it tested.", "kiedy": "When a weed, disease or insect survives an application that should have worked, or when planning a multi-year program on fields with known resistance.", "brief": [{"pole": "Crop and problem", "opis": "Crop, fields and the suspected resistance, e.g. “soybeans, 3 fields in McLean County, IL — waterhemp surviving post passes”."}, {"pole": "Application history", "opis": "Products and groups used the last 3–5 seasons, e.g. “2023–2025 glyphosate (Group 9) every year, Group 14 post in 2024 and 2025”."}, {"pole": "Available products and groups", "opis": "Products you could use with label groups, e.g. “[herbicide A from label] Group 15, [herbicide B from label] Group 10, trait package allows it”."}, {"pole": "Rotation and cultural practices", "opis": "Rotation, tillage, row spacing, cover crops, e.g. “corn-soy, no-till, 30-inch rows, no cover crop”."}, {"pole": "Field observations", "opis": "What you see, e.g. “patches of live waterhemp next to dead ones after the post, same growth stage, spreading along the combine path”."}], "prompt": "You are an experienced independent agronomist and CCA specializing in herbicide, fungicide and insecticide resistance management. Analyze my history and build a resistance management strategy.\n\nINPUT:\nCrop, fields, suspected resistance: [CROP AND PROBLEM]\nApplication history by year: [APPLICATION HISTORY]\nAvailable products and groups: [AVAILABLE PRODUCTS AND GROUPS]\nRotation and cultural practices: [ROTATION AND CULTURAL PRACTICES]\nField observations: [FIELD OBSERVATIONS]\n\nRULES:\n1. If key data is missing, first ask me up to 5–7 short questions and wait for my answers.\n2. Never invent rates, REI or PHI intervals, buffer distances, economic thresholds, brand names, seasonal maximums or legal deadlines. Use only the label, my state and extension sources and the data I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION], uncertain items [VERIFY]; anything that must come from the label is [CHECK LABEL].\n3. Show every calculation step by step.\n4. Classify each product only by the WSSA, HRAC, FRAC or IRAC group printed on the label; if not provided, mark [CHECK LABEL].\n5. Count, step by step, how many seasons and passes relied on each group against the target pest.\n6. Rule out other causes of failure first: wrong timing, weed size, rate, coverage, weather, sprayer problems — mark each [VERIFY].\n7. Never claim resistance is confirmed without a lab or university test; call it suspected.\n8. Combine chemical options (multiple effective groups, layered residuals) with non-chemical ones (rotation, cover crops, narrow rows, harvest weed seed control).\n\nOUTPUT FORMAT:\nA) History table: | season | field | product | group | timing | result |\nB) Group reliance count step by step.\nC) Other possible causes of failure.\nD) Three-season strategy: chemical and non-chemical tactics.\nE) How to sample and send for resistance testing [VERIFY lab and method with your extension].\n\nEnd with this note: “Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Make a one-page summary of the strategy for the grower.", "Add a column showing how many effective groups each pass has.", "List non-chemical tactics that fit our equipment.", "Write the sampling instructions for a seed or leaf resistance test.", "Redo the plan if we go to corn on these fields next year.", "Compare two programs by the number of effective groups.", "Explain the resistance risk in plain words for the landowner.", "Make a field map description of where the survivors are.", "Prepare a follow-up scouting plan after the next pass.", "List the questions to ask the retailer about trait and product options."], "checklista": ["Every product's group is taken from the label.", "Other causes of failure (timing, rate, coverage, weather) were ruled out.", "Resistance is called suspected until a test confirms it.", "Each pass relies on more than one effective group against the target pest where possible.", "Non-chemical tactics are included, not just a product swap.", "The plan respects rotational restrictions and trait requirements on the labels."], "uwaga": "Group numbers classify modes of action; they do not tell you rates or efficacy on your fields. Confirm suspected resistance with a lab or your land-grant extension before changing a whole program, and follow every label for rates, trait use and rotational restrictions. Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Got waterhemp problems on three bean fields in McLean County. After the post this year there are live waterhemp right next to dead ones, same size, and it's spreading along where the combine goes. History: glyphosate every year 2023 through 2025, and the Group 14 post in 2024 and 2025. Corn-soy, no-till, 30-inch rows, no cover crop. Options I'm looking at for next time: [herbicide A from label] Group 15 and [herbicide B from label] Group 10, the trait package allows it. Sprayer was calibrated, weeds were maybe 3 to 5 inches. Help me build a plan.", "wynik": "A) History\n| season | field | product | group | timing | result |\n| 2023 | 3 fields | glyphosate | 9 | post | [TO FILL IN] |\n| 2024 | 3 fields | glyphosate + [Group 14 product] | 9 + 14 | post | [TO FILL IN] |\n| 2025 | 3 fields | glyphosate + [Group 14 product] | 9 + 14 | post | survivors next to dead plants |\n\nB) Group reliance\nGroup 9: 3 of 3 seasons. Group 14: 2 of 3 seasons. No residual layer recorded → waterhemp has faced only two post sites of action.\n\nC) Other causes [VERIFY]\nWeed height 3–5 in vs. label maximum [CHECK LABEL]; coverage and carrier volume; rain after application. Survivors next to dead plants of the same size and spread along the combine path point to suspected resistance, not a sprayer issue.\n\nD) Three-season strategy\n- Season 1 (soybeans): Group 15 pre + layered Group 15 residual post with an effective post group [CHECK LABEL]; Group 10 post as allowed by trait.\n- Season 2 (corn): different effective groups pre and post [TO FILL IN from label].\n- Non-chemical: cereal rye cover ahead of soybeans, consider narrower rows, clean the combine before leaving infested fields.\n\nE) Testing\nCollect seed or leaf samples from survivors and send to a university lab [VERIFY lab and method with your extension].\n\nFollow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "6.08", "nazwa": "Tank Mix Compatibility Check", "tag": "TANK MIX", "co_robi": "Checks a planned tank mix against the mixing and tank-mix language on each label, builds a jar test plan scaled to your carrier volume and lists the mixing order from the labels. It flags label prohibitions, missing information and water quality issues.", "kiedy": "Before you combine two or more products in one pass, especially a new combination, hard water or a mix that has caused gelling or clogged screens before.", "brief": [{"pole": "Crop and stage", "opis": "Crop, stage and target, e.g. “soybeans at R3, frogeye leaf spot and soybean aphid”."}, {"pole": "Mix components", "opis": "Every product and adjuvant with formulation, e.g. “[fungicide from label] SC, [insecticide from label] EC, NIS, AMS”."}, {"pole": "Label mixing text", "opis": "Paste the mixing sections, e.g. “Mixing order and Tank Mixing sections from all three labels — pasted below”."}, {"pole": "Application conditions", "opis": "Planned conditions, e.g. “ground rig, early morning, about 70°F, high humidity”."}, {"pole": "Sprayer and water", "opis": "Sprayer, carrier volume and water source, e.g. “1,000 gal sprayer, 15 gal/ac, well water, hard, pH not tested”."}], "prompt": "You are an experienced independent agronomist and CCA who checks tank mixes before they go in the sprayer. Check this mix against the labels I paste and prepare a jar test.\n\nINPUT:\nCrop, stage, target: [CROP AND STAGE]\nMix components with formulation: [MIX COMPONENTS]\nLabel mixing text (pasted): [LABEL MIXING TEXT]\nApplication conditions: [APPLICATION CONDITIONS]\nSprayer, carrier volume, water: [SPRAYER AND WATER]\n\nRULES:\n1. If key data is missing, first ask me up to 5–7 short questions and wait for my answers.\n2. Never invent rates, REI or PHI intervals, buffer distances, economic thresholds, brand names, seasonal maximums or legal deadlines. Use only the label, my state and extension sources and the data I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION], uncertain items [VERIFY]; anything that must come from the label is [CHECK LABEL].\n3. Show every calculation step by step.\n4. Work only from the label text I paste. Any tank-mix prohibition on any label wins; if a label requires a specific mixing order, follow it. If labels are silent, mark the order [VERIFY].\n5. Jar test scaled step by step: jar volume ÷ carrier gal per acre = jar fraction of an acre; product per jar = label rate × that fraction, converting units clearly. Rates must come from the label [CHECK LABEL].\n6. Flag water hardness, pH and temperature as risks only when I give data; otherwise mark [TO FILL IN].\n7. Describe what to look for in the jar: separation, flakes, gel, heat, foam.\n\nOUTPUT FORMAT:\nA) Compatibility table: | component | formulation | label tank-mix language (quote) | issue |\nB) Mixing order with label source.\nC) Jar test plan with calculations step by step.\nD) Go, no-go or test-first conclusion, and what to check in the sprayer.\n\nEnd with this note: “Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Redo the jar test for a quart jar instead of a pint.", "Add a fourth product to the mix and check it again.", "Write the mixing order as steps for the operator.", "List every label sentence that limits this tank mix.", "Explain what each jar test result means and what to do.", "Make a version for 20 gal per acre.", "Check the mix with the water analysis I'll paste.", "Prepare a short note for the retailer about the compatibility question.", "Make a sprayer cleanout reminder for after this mix.", "Turn this into a reusable tank mix check template."], "checklista": ["No label prohibits mixing these products.", "Mixing order follows the most restrictive label.", "Jar test volumes are scaled to the real carrier volume.", "Rates in the jar test are copied from the labels.", "Water quality (hardness, pH, temperature) is known or tested.", "The jar test is done with the same water source as the sprayer.", "The operator has the written mixing order and cleanout steps."], "uwaga": "A tank mix is only legal if every label allows it and the most restrictive label rules are followed. A jar test shows physical compatibility, not crop safety or efficacy. Wear the PPE required by the labels when mixing. Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Want to put three things together on beans at R3: [fungicide from label], it's an SC, and [insecticide from label], an EC, plus NIS and AMS. Going after frogeye leaf spot and aphids. I pasted the mixing sections from both product labels. Ground rig, early morning, around 70, humid. 1,000-gallon sprayer at 15 gallons per acre, well water, it's hard but I never tested pH. Last year we had the screens plug up with a different mix. Is this OK and how do I jar test it?", "wynik": "A) Compatibility\n| component | formulation | label tank-mix language (quote) | issue |\n| [fungicide from label] | SC | [quote from pasted label] | [VERIFY] adjuvant restrictions |\n| [insecticide from label] | EC | [quote from pasted label] | [VERIFY] crop safety in mix |\n| NIS | — | per labels [CHECK LABEL] | — |\n| AMS | — | per labels [CHECK LABEL] | hard water conditioner |\n\nB) Mixing order\nIf labels are silent: water → AMS → SC → EC → NIS [VERIFY — commonly used order, confirm with labels].\n\nC) Jar test (1 quart = 0.25 gal)\nAcre fraction = 0.25 gal ÷ 15 gal/ac = 0.0167 ac.\nFungicide in jar = label rate × 0.0167 ac = [CHECK LABEL], converted to milliliters.\nInsecticide in jar = label rate × 0.0167 ac = [CHECK LABEL].\nUse the same well water; add in the order above, cap and invert after each; let it stand and check [VERIFY timing with your extension jar test guide].\nLook for: separation, flakes, gel, heat, excess foam.\n\nD) Conclusion\nTest first. Water hardness and pH unknown [TO FILL IN] — given last year's plugged screens, test a water sample. If the jar stays uniform, go; check screens after the first load.\n\nFollow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "6.09", "nazwa": "Pest Monitoring and Alerts", "tag": "PEST MONITORING", "co_robi": "Turns trap counts, degree days and scouting results into a monitoring log with trends, compares them to the thresholds and alerts you provide, and writes short alerts for the grower and applicator. It also builds the scouting schedule for the coming week.", "kiedy": "Every week in season, when trap counts and scouting notes pile up and you need to see the trend quickly and tell the right people what to watch.", "brief": [{"pole": "Crops and fields", "opis": "Crops, fields and acres you monitor, e.g. “corn on 6 pivots, south-central Nebraska, about 900 ac”."}, {"pole": "Pests to monitor", "opis": "Target pests and diseases, e.g. “western bean cutworm, corn rootworm adults, tar spot”."}, {"pole": "Tools and methods", "opis": "Traps, sampling methods, degree-day model, e.g. “pheromone bucket traps on 3 pivots, 20 plants per stop, degree days with base temperature from extension”."}, {"pole": "Results and dates", "opis": "Trap counts and scouting results by date, e.g. “WBC moths: 12 on July 8, 31 on July 12, 64 on July 15; no egg masses yet”."}, {"pole": "Threshold and alert sources", "opis": "Where your thresholds and alerts come from, e.g. “university extension WBC threshold, state pest alert newsletter, tar spot tracking map”."}, {"pole": "Alert recipients", "opis": "Who needs to hear about it and how, e.g. “grower by text, applicator by email, farm manager weekly”."}], "prompt": "You are an experienced independent agronomist and CCA who runs pest monitoring programs: traps, degree days and field scouting. Turn my data into a monitoring log and short alerts.\n\nINPUT:\nCrops, fields, acres: [CROPS AND FIELDS]\nPests to monitor: [PESTS TO MONITOR]\nTraps, methods, degree-day model: [TOOLS AND METHODS]\nResults with dates: [RESULTS AND DATES]\nThreshold and alert sources: [THRESHOLD AND ALERT SOURCES]\nWho gets the alert and how: [ALERT RECIPIENTS]\n\nRULES:\n1. If key data is missing, first ask me up to 5–7 short questions and wait for my answers.\n2. Never invent rates, REI or PHI intervals, buffer distances, economic thresholds, brand names, seasonal maximums or legal deadlines. Use only the label, my state and extension sources and the data I give you. Mark gaps [TO FILL IN], assumptions [ASSUMPTION], uncertain items [VERIFY]; anything that must come from the label is [CHECK LABEL].\n3. Show every calculation step by step.\n4. Thresholds, degree-day base temperatures and model start dates come only from the sources I name. If missing, mark [TO FILL IN] — never supply them.\n5. Degree days only from my daily max and min temperatures: (max + min) ÷ 2 − base, negative values count as zero, with any cutoff from the model I name [VERIFY]. Show each day.\n6. Calculate trends between dates (change and percent change) and say whether the trend is rising, flat or falling.\n7. An alert says what was found, where, what it means against the threshold and the next action — no product or rate.\n\nOUTPUT FORMAT:\nA) Monitoring log: | date | field | pest | method | count or result | change | status vs. threshold |\nB) Degree-day and trend calculations step by step.\nC) Alerts: text message (max 300 characters) and email version.\nD) Scouting plan for the next 7 days.\n\nEnd with this note: “Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Add today's trap counts and update the trend.", "Write the alert as a 160-character text message.", "Make a weekly summary for the farm manager.", "Calculate degree days for the last 10 days from the weather I'll paste.", "Flag the fields that need egg mass scouting first.", "Make a chart description of trap counts over time.", "Add a column for the extension alert status in our county.", "Prepare a scouting route for tomorrow morning.", "Compare this year's trap counts with last year's.", "List the data I'm missing to make a treat or wait decision."], "checklista": ["Trap counts are logged with dates and the same trap locations.", "Thresholds and degree-day parameters come from a named extension source.", "Trends are calculated, not described by impression.", "Trap catches are followed by field scouting before any decision.", "Alerts state the next action and the date of the next check.", "The right people received the alert."], "uwaga": "Trap catches and degree days indicate when to scout, not when to spray: the treatment decision needs field scouting and the economic threshold from your extension. Any product used must follow its label. Follow the label — the label is the law. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Weekly update, 6 pivots of corn down in south-central Nebraska, about 900 acres. I've got pheromone bucket traps for western bean cutworm on pivots 2, 4 and 6. Counts per trap: July 8 was 12, July 12 was 31, July 15 was 64, that's the total of the three traps. No egg masses yet on 20 plants per stop at 5 stops per pivot, checked July 15. Corn's about VT on the early pivots. Also watching tar spot, nothing found yet, the state tracking map shows it two counties east. Thresholds I use come from the extension guide, I'll add the WBC number later. Send something to the grower by text and the applicator by email.", "wynik": "A) Monitoring log\n| date | field | pest | method | count or result | change | status vs. threshold |\n| 07/08 | pivots 2, 4, 6 | WBC moths | pheromone traps | 12 | — | trap trend only |\n| 07/12 | pivots 2, 4, 6 | WBC moths | pheromone traps | 31 | +19 (+158%) | rising |\n| 07/15 | pivots 2, 4, 6 | WBC moths | pheromone traps | 64 | +33 (+106%) | rising |\n| 07/15 | all 6 pivots | WBC egg masses | 20 plants × 5 stops | 0 | — | below threshold [TO FILL IN: extension threshold] |\n| 07/15 | all 6 pivots | tar spot | scouting | not found | — | reported two counties east |\n\nB) Trend\n12 → 31: (31 − 12) ÷ 12 = 158% increase. 31 → 64: (64 − 31) ÷ 31 = 106% increase. Flight is building [VERIFY egg-lay timing with extension].\nDegree days: [TO FILL IN — paste daily max and min and the base temperature from your extension model].\n\nC) Alerts\nText to grower: “WBC moth flight rising fast — 64 in traps this week, up from 31. No egg masses yet. Scouting all pivots again Friday. T
