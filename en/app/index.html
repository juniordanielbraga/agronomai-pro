ow for the season: starting cash, expenses, receipts, fixed payments and the operating loan draws and paydowns needed to keep a minimum balance.", "kiedy": "Before the operating loan renewal with Farm Credit or the local bank, or when a grower wants to know when the line will peak and whether it gets paid down after harvest.", "brief": [{"pole": "Operation", "opis": "Farm, acres, crops, e.g. “Olson Farms, Red River Valley, ND — 1,800 ac soybeans and spring wheat”."}, {"pole": "Starting balance", "opis": "Cash on hand, line limit and minimum balance, e.g. “$45,000 in checking, $400,000 operating line, keep $10,000 minimum”."}, {"pole": "Planned expenses", "opis": "Spending by period, e.g. “Q1 seed and fertilizer prepay $180,000 plus first half rent $60,000”."}, {"pole": "Planned receipts", "opis": "Grain sales and other income by period, e.g. “Q1 stored soybeans $90,000, Q4 harvest sales $380,000”."}, {"pole": "Fixed obligations", "opis": "Loan payments and family living, e.g. “machinery note $38,000 in December, family living $6,000 per quarter”."}, {"pole": "Period and purpose", "opis": "Time frame and use, e.g. “calendar year by quarter, for the operating loan renewal”."}], "prompt": "You are an experienced independent agronomist and farm management advisor (CCA) who builds seasonal cash flows for growers and their ag lenders. Prepare a cash flow budget with operating loan draws and repayments.\n\nINPUT:\nOperation: [OPERATION]\nStarting balance: [STARTING BALANCE]\nPlanned expenses: [PLANNED EXPENSES]\nPlanned receipts: [PLANNED RECEIPTS]\nFixed obligations: [FIXED OBLIGATIONS]\nPeriod and purpose: [PERIOD AND PURPOSE]\n\nRULES:\n1. Check the data first. If anything important is missing, ask me at most 6 short questions and wait for my answers.\n2. Do not invent prices, yields, rates, program payments, insurance figures or “typical” values. Work only with my numbers. Mark missing data [TO FILL IN], anything you assume [ASSUMPTION], anything uncertain [VERIFY].\n3. Show every calculation step by step with units ($/ac, $/bu, bu/ac, ac) and round only the final result.\n4. For each period: starting cash + receipts − expenses − fixed obligations = cash before borrowing. If it falls below the minimum balance, draw on the line to bring it back to the minimum; if above, repay the line first.\n5. Track the running line balance and flag the peak against the line limit. Do not calculate loan interest unless I give the rate.\n6. Do not add government payments, insurance indemnities or grain sales I did not list. Mention them only as [VERIFY] items.\n\nOUTPUT FORMAT:\nA) Cash flow table | period | start | receipts | expenses | fixed | draw or repay | end cash | line balance |.\nB) Math for each period.\nC) Peak borrowing, headroom under the limit and the balance left after harvest.\nD) Risks, gaps and questions for the lender.\n\nEnd with: “This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Convert the quarterly table to monthly using the dates I give you.", "Add operating loan interest at the rate on my loan agreement.", "Show what happens if harvest sales come in 20% lower.", "Move the fertilizer prepay to the next period and show the effect.", "Prepare a lender-ready summary for the loan renewal.", "Add the government payment only if I confirm the FSA amount.", "Compare this plan with last year's actual cash flow I paste.", "List the grain sales that must happen on time to keep the line in limit.", "Format the table for Excel.", "Write a short note for the grower about the peak borrowing month."], "checklista": ["Starting cash matches the bank statement.", "Every expense and receipt has a date or period the grower agrees with.", "Loan payments match the note schedules.", "Peak line balance stays under the approved limit.", "No unconfirmed program payments or indemnities are counted as receipts.", "Gaps marked [TO FILL IN] are closed before the lender sees it."], "uwaga": "A cash flow is a plan, not a guarantee. Line limits, interest rates and covenants come from the loan agreement — confirm them with the loan officer, and send tax questions to the accountant or tax preparer.", "przyklad": {"wejscie": "Olson Farms up in the Red River Valley, beans and spring wheat. We start the year with 45 grand in checking, operating line is 400 thousand with Farm Credit, and I want to keep at least 10 thousand in the account. Do it by quarter. Q1 we've got seed and fertilizer prepay 180 thousand and first half rent 60. Q2 chemicals and fuel 70, hired help 15. Q3 fungicide and custom work 25, repairs 20. Q4 harvest fuel, trucking and drying 40 and second half rent 60. Machinery note is 38 thousand due in December. Family living 6 a quarter. Money coming in: stored beans 90 thousand in Q1, then harvest sales 380 in Q4. Don't count any government money, nobody knows yet.", "wynik": "CASH FLOW — Olson Farms, calendar year by quarter ($)\nMinimum balance $10,000 · line limit $400,000\n\n| period | start | receipts | expenses | fixed | draw or repay | end cash | line balance |\n| Q1 | 45,000 | 90,000 | 240,000 | 6,000 | draw 121,000 | 10,000 | 121,000 |\n| Q2 | 10,000 | 0 | 85,000 | 6,000 | draw 91,000 | 10,000 | 212,000 |\n| Q3 | 10,000 | 0 | 45,000 | 6,000 | draw 51,000 | 10,000 | 263,000 |\n| Q4 | 10,000 | 380,000 | 100,000 | 44,000 | repay 236,000 | 10,000 | 27,000 |\n\nMath:\nQ1: 45,000 + 90,000 − (180,000 + 60,000) − 6,000 = −111,000 → draw 121,000 to reach 10,000\nQ2: 10,000 − (70,000 + 15,000) − 6,000 = −81,000 → draw 91,000\nQ3: 10,000 − (25,000 + 20,000) − 6,000 = −41,000 → draw 51,000\nQ4: 10,000 + 380,000 − (40,000 + 60,000) − (6,000 + 38,000) = 246,000 → repay 236,000, keep 10,000\n\nPeak line: $263,000 at end of Q3 — headroom 400,000 − 263,000 = $137,000.\nAfter harvest $27,000 stays on the line (263,000 − 236,000) — talk to the lender about carryover or more Q4 sales.\n\nNot included: line interest [TO FILL IN: rate from the loan agreement], government payments [VERIFY with FSA], crop insurance indemnities.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "3.05", "nazwa": "Input Quote Comparison per Acre", "tag": "QUOTE COMPARISON", "co_robi": "Converts crop protection and fertilizer quotes from different ag retailers into one comparable number: $/ac at the label rate, plus total cost for the acres. Takes discounts and payment terms into account.", "kiedy": "When two or three retailers send quotes in different units ($/gal, $/jug, $/ton) and the grower wants to know which one is really cheaper per acre.", "brief": [{"pole": "Target and crop", "opis": "What the application is for, crop, acres, e.g. “foliar fungicide on soybeans at R3, 480 ac”."}, {"pole": "Quotes", "opis": "Each product, retailer, price and package, e.g. “Product A from the co-op at $320/gal, Product B from the independent at $280/gal in 2.5 gal jugs”."}, {"pole": "Label rates", "opis": "The rate you read on each label, e.g. “A 6 fl oz/ac, B 8 fl oz/ac”."}, {"pole": "Label registration", "opis": "Whether each product is labeled for this crop, pest and state, e.g. “both labeled for soybeans in Iowa, generic C I still need to check”."}, {"pole": "Purchase terms", "opis": "Discounts, payment dates, returns, e.g. “co-op gives 2% early-pay if paid by Dec 1”."}], "prompt": "You are an experienced independent agronomist (CCA) who helps growers compare input quotes from ag retailers. Compare the quotes I give you on a $/ac basis.\n\nINPUT:\nTarget and crop: [TARGET AND CROP]\nQuotes: [QUOTES]\nLabel rates: [LABEL RATES]\nLabel registration: [LABEL REGISTRATION]\nPurchase terms: [PURCHASE TERMS]\n\nRULES:\n1. Check the data first. If anything important is missing, ask me at most 5 short questions and wait for my answers.\n2. Do not invent prices, yields, rates, program payments, insurance figures or “typical” values. Work only with my numbers. Mark missing data [TO FILL IN], anything you assume [ASSUMPTION], anything uncertain [VERIFY].\n3. Show every calculation step by step with units ($/ac, $/bu, bu/ac, ac) and round only the final result.\n4. Use only the rates I took from the labels and mark each one [CHECK LABEL]. Never suggest a rate, a product or a tank mix yourself.\n5. Convert every price to the same unit before comparing (1 gal = 128 fl oz; $/ton to $/lb when needed). Show the conversion.\n6. Compare only products I confirmed are labeled for this crop, pest and state. Anything not confirmed is marked [VERIFY] and kept out of the ranking.\n7. Apply discounts and terms only as I described them; note anything unclear.\n\nOUTPUT FORMAT:\nA) Comparison table | product | retailer | quoted price | label rate | $/ac | $ for all acres |.\nB) Conversion math for each product.\nC) Net cost after discounts and terms.\nD) Label, registration and agronomic questions to check before buying.\n\nEnd with: “This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Add the application cost per acre I give you to each product.", "Compare fertilizer quotes in $/ton and $/lb of nutrient using the analysis I enter.", "Show the cost if I use the low and the high label rate I read.", "Rank the products by $/ac only among the labeled ones.", "Write a short email asking the retailer to confirm price and terms.", "Add a column for the adjuvant the label requires, at the price I give.", "Recalculate for a different number of acres.", "List what I need to verify on each label before purchase.", "Format the table for Excel.", "Summarize in two sentences which quote is cheapest per acre and why."], "checklista": ["Each rate was read from the current label by the user and marked [CHECK LABEL].", "Every product is registered for the crop, target and state.", "Prices are converted to the same unit with the math shown.", "Discounts and payment terms match the written quote.", "Products with different active ingredients or modes of action are not treated as interchangeable without agronomic review.", "Generic products were checked for the same active ingredient and labeled use [VERIFY]."], "uwaga": "The label is the law. Cheapest per acre is not the same as right for the field — check registration for the crop and state, REI, PHI, rotation restrictions and resistance management on the label before switching products.", "przyklad": {"wejscie": "Need to compare fungicide quotes for soybeans at R3, 480 acres. Co-op quoted Product A at 320 a gallon, label says 6 fluid ounces an acre, I read it last night. The independent dealer has Product B at 280 a gallon, comes in two and a half gallon jugs, label rate 8 ounces. Then there's a generic, call it C, at 150 a gallon and the guy says 10 ounces, but I haven't seen that label yet and I'm not sure it's even labeled in Iowa. Co-op gives 2 percent off if I pay by December 1st. Which one's actually cheaper per acre?", "wynik": "QUOTE COMPARISON — Soybean fungicide at R3, 480 ac\n\n| product | retailer | quoted price | label rate | $/ac | $ for 480 ac |\n| A | co-op | $320/gal | 6 fl oz/ac [CHECK LABEL] | 15.00 | 7,200 |\n| B | independent | $280/gal | 8 fl oz/ac [CHECK LABEL] | 17.50 | 8,400 |\n| C | — | $150/gal | 10 fl oz/ac [VERIFY] | 11.72 | 5,625 |\n\nMath (1 gal = 128 fl oz):\nA: 320 ÷ 128 = $2.50/fl oz × 6 = $15.00/ac; × 480 = $7,200\nB: 280 ÷ 128 = $2.1875/fl oz × 8 = $17.50/ac; × 480 = $8,400\nC: 150 ÷ 128 = $1.1719/fl oz × 10 = $11.72/ac; × 480 = $5,625\n\nTerms: A with 2% early pay: 7,200 × 0.98 = $7,056 → 7,056 ÷ 480 = $14.70/ac (if paid by Dec 1).\n\nRanking among confirmed labeled products: A ($14.70/ac net) ahead of B ($17.50/ac).\nC is out of the ranking until you confirm: Iowa registration and soybean use [VERIFY], the 10 fl oz rate [CHECK LABEL], same active ingredient as A or B [VERIFY].\n\nBefore buying: PHI and REI on each label [CHECK LABEL], mode of action vs. what was used last season, adjuvant requirement and its cost [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "3.06", "nazwa": "Cash Rent vs. Crop Share Analysis", "tag": "LAND RENT", "co_robi": "Compares the tenant's return under a cash rent and a crop-share lease on the same ground, using the grower's own yield, price and cost numbers. Shows return per acre, for the parcel, and the breakeven yield under each lease to make the risk shift visible.", "kiedy": "When a landlord offers a choice of lease, a cash rent increase is on the table, or a grower is deciding whether to bid on rented ground.", "brief": [{"pole": "Parcel and lease", "opis": "Field, acres, location, lease term, e.g. “Creek field, 80 ac, Hamilton County, IA, one-year lease from March 1”."}, {"pole": "Rent offer", "opis": "Cash rent and crop-share terms offered, e.g. “$260/ac cash, or crop share 2/3 tenant 1/3 landlord, landlord pays 1/3 of seed, fertilizer and chemicals”."}, {"pole": "Planned production", "opis": "Crop, yield and price you plan with, e.g. “corn, 200 bu/ac, $4.20/bu”."}, {"pole": "Production costs", "opis": "Your costs split into shared and tenant-only, e.g. “seed, fert and chem $340/ac; machinery, fuel, insurance, drying, labor $210/ac”."}, {"pole": "Program payments and other", "opis": "How ARC/PLC and crop insurance would be handled, e.g. “not sure how FSA splits payments on a share lease”."}, {"pole": "Decision goal", "opis": "What you want to decide, e.g. “which lease to sign and what cash rent I could afford”."}], "prompt": "You are an experienced independent agronomist and farm management advisor (CCA) who helps tenants and landowners evaluate farm leases. Compare cash rent and crop-share options for one parcel from the tenant's side.\n\nINPUT:\nParcel and lease: [PARCEL AND LEASE]\nRent offer: [RENT OFFER]\nPlanned production: [PLANNED PRODUCTION]\nProduction costs: [PRODUCTION COSTS]\nProgram payments and other: [PROGRAM PAYMENTS AND OTHER]\nDecision goal: [DECISION GOAL]\n\nRULES:\n1. Check the data first. If anything important is missing, ask me at most 6 short questions and wait for my answers.\n2. Do not invent prices, yields, rates, program payments, insurance figures or “typical” values. Work only with my numbers. Mark missing data [TO FILL IN], anything you assume [ASSUMPTION], anything uncertain [VERIFY].\n3. Show every calculation step by step with units ($/ac, $/bu, bu/ac, ac) and round only the final result.\n4. Cash rent: tenant return = yield × price − all costs − rent. Crop share: tenant return = tenant share of crop × price − tenant share of shared costs − tenant-only costs. Apply the split exactly as I gave it.\n5. Show the breakeven yield for each lease so the risk difference is visible.\n6. Do not estimate how FSA divides ARC/PLC payments or how crop insurance applies to each share. Mark those [VERIFY] with the FSA office and the crop insurance agent.\n7. Do not quote local rent levels or land values; the user may supply a figure from the state land-grant cash rent survey.\n\nOUTPUT FORMAT:\nA) Side-by-side table | item | cash rent $/ac | crop share $/ac |.\nB) Step-by-step math and totals for the parcel.\nC) Breakeven yield under each lease and what that means for risk.\nD) Lease questions, gaps and items to verify before signing.\n\nEnd with: “This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Calculate the maximum cash rent I can pay and still break even at my numbers.", "Run the comparison at a yield 30 bu/ac lower.", "Add a flexible cash rent with the bonus formula the landlord proposed.", "Do the same comparison from the landlord's side.", "Write a short list of terms to put in the written lease.", "Run the comparison for soybeans with the numbers I paste.", "Show the return at three different prices I give you.", "Prepare questions for the FSA office about payment shares on this farm.", "Format the comparison for Excel.", "Summarize in three sentences which lease fits a tight-cash year."], "checklista": ["Shared and tenant-only costs are split exactly as the lease offer says.", "Yield and price are the tenant's own planning numbers.", "Payment and insurance share handling is confirmed with FSA and the agent, not assumed.", "Breakeven yields are shown for both options.", "Lease term, termination notice and payment dates are written down per state law [VERIFY].", "Any rent benchmark comes from a named source the user supplied."], "uwaga": "Lease rules — termination notice dates, written-lease requirements and how program payments are shared — vary by state and by FSA rules. Have the lease reviewed by an ag attorney and confirm program details with the FSA county office.", "przyklad": {"wejscie": "Landlord on the Creek field, 80 acres, gave me two options for next year. Cash rent at 260 an acre, or a crop share where I get two thirds and he gets one third, and he pays a third of seed, fertilizer and chemicals. I'd plant corn, figure 200 bushels and 4.20 for planning. Seed, fertilizer and chemical together are about 340 an acre. Everything else that's mine — machinery, fuel, insurance, drying, labor — call it 210. I'm not sure how FSA would split the ARC or PLC on a share lease, so leave that out for now. Tell me which one leaves me more and where my risk sits.", "wynik": "LEASE COMPARISON — Creek field, 80 ac, corn (tenant side)\n\n| item | cash rent $/ac | crop share $/ac |\n| tenant revenue | 200 × 4.20 = 840.00 | 2/3 × 840 = 560.00 |\n| shared inputs (seed, fert, chem) | 340.00 | 2/3 × 340 = 226.67 |\n| tenant-only costs | 210.00 | 210.00 |\n| cash rent | 260.00 | — |\n| tenant return | 30.00 | 123.33 |\n\nMath:\n1. Cash rent: 840 − 340 − 210 − 260 = $30.00/ac; × 80 ac = $2,400\n2. Crop share: 560 − 226.67 − 210 = $123.33/ac; × 80 ac = $9,867\n\nBreakeven yield:\n- Cash rent: (340 + 210 + 260) = $810/ac ÷ $4.20 = 192.9 bu/ac — only 7.1 bu below your 200 bu plan\n- Crop share: (226.67 + 210) = $436.67/ac ÷ (2/3 × $4.20 = $2.80) = 156.0 bu/ac\n\nWhat it means: at your numbers the crop share leaves more per acre, and the landlord carries part of the yield and price risk. Under cash rent you carry all of it.\n\nTo verify before signing: how FSA divides ARC/PLC on a share lease [VERIFY with the FSA office]; crop insurance on each party's share [VERIFY with your agent]; who markets and stores the landlord's third [TO FILL IN]; termination notice under your state law [VERIFY].\n[ASSUMPTION] 200 bu/ac and $4.20/bu are planning numbers, not a contract.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "3.07", "nazwa": "Custom Hire vs. Owning the Machine", "tag": "CUSTOM VS OWN", "co_robi": "Calculates the full cost per acre of owning a machine (depreciation, interest, insurance and housing, plus operating costs) and compares it with the custom rate the grower was quoted. Shows the acres needed for ownership to break even.", "kiedy": "When a grower is looking at a used planter, sprayer or combine, or a neighbor offers to do the job custom and the question is “buy or hire?”", "brief": [{"pole": "Machine and operation", "opis": "What machine and job, e.g. “used 16-row planter, planting corn and soybeans”."}, {"pole": "Price and useful life", "opis": "Purchase price, years of use, expected trade-in value, e.g. “$180,000, keep 10 years, about $60,000 at trade”."}, {"pole": "Ownership costs", "opis": "Interest rate on the money and yearly insurance and housing, e.g. “7% cost of money, insurance and shed about $1,800 a year”."}, {"pole": "Annual acres", "opis": "Acres the machine will cover per year, e.g. “900 ac of my own, no custom work for others”."}, {"pole": "Operating costs per acre", "opis": "Repairs, tractor and fuel, labor, e.g. “repairs $3.00/ac, tractor and fuel $5.50/ac, labor $2.50/ac”."}, {"pole": "Custom rate quote", "opis": "What the custom operator quoted, or a figure you took from your state custom rate survey, e.g. “neighbor quoted $24/ac”."}], "prompt": "You are an experienced independent agronomist and farm management advisor (CCA) who helps growers decide between owning equipment and hiring custom work. Compare the cost of owning this machine with the custom rate.\n\nINPUT:\nMachine and operation: [MACHINE AND OPERATION]\nPrice and useful life: [PRICE AND USEFUL LIFE]\nOwnership costs: [OWNERSHIP COSTS]\nAnnual acres: [ANNUAL ACRES]\nOperating costs per acre: [OPERATING COSTS PER ACRE]\nCustom rate quote: [CUSTOM RATE QUOTE]\n\nRULES:\n1. Check the data first. If anything important is missing, ask me at most 6 short questions and wait for my answers.\n2. Do not invent prices, yields, rates, program payments, insurance figures or “typical” values. Work only with my numbers. Mark missing data [TO FILL IN], anything you assume [ASSUMPTION], anything uncertain [VERIFY].\n3. Show every calculation step by step with units ($/ac, $/bu, bu/ac, ac) and round only the final result.\n4. Annual fixed cost = depreciation ((price − trade value) ÷ years) + interest on average investment (((price + trade value) ÷ 2) × my rate) + insurance and housing. Fixed cost per acre = annual fixed cost ÷ annual acres.\n5. Ownership cost per acre = fixed per acre + operating per acre. Breakeven acres = annual fixed cost ÷ (custom rate − operating cost per acre).\n6. Do not quote custom rates from any survey yourself. Use only the rate I give; if it comes from a state custom rate survey, I will tell you which one.\n7. List timeliness, availability and labor as non-cash factors; do not put a dollar figure on them unless I give one.\n\nOUTPUT FORMAT:\nA) Cost table | item | $/year | $/ac |.\nB) Step-by-step math: fixed costs, operating costs, total $/ac vs. custom rate.\nC) Breakeven acres and what it means for this farm.\nD) Non-cash factors, gaps and assumptions.\n\nEnd with: “This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Run the comparison if I also do custom work for neighbors on the acres I give you.", "Show the cost per acre at 600, 900 and 1,200 acres.", "Change the trade-in value to the figure the dealer quotes.", "Compare a new and a used machine with the prices I paste.", "Add a timeliness cost using the yield loss per day I enter.", "Write questions to ask the custom operator before agreeing.", "Recalculate with a different interest rate from my lender.", "Compare with leasing at the lease payment I give you.", "Format the table for Excel.", "Summarize the buy-or-hire answer in two sentences."], "checklista": ["Purchase price and trade-in value come from the dealer or a written quote.", "The interest rate is the grower's real cost of money or loan rate.", "Annual acres are realistic for this operation.", "The custom rate is a real quote or a cited state survey figure supplied by the user.", "Timeliness and labor availability are discussed, not ignored.", "Tax depreciation is left to the tax preparer, not mixed into this economic depreciation."], "uwaga": "Economic depreciation here is not tax depreciation. Section 179 or bonus depreciation questions belong to the accountant or tax preparer.", "przyklad": {"wejscie": "Looking at a used 16-row planter, 180 thousand. I'd keep it 10 years and figure it's worth about 60 at trade. My money costs me about 7 percent. Insurance and keeping it in the shed, call it 1,800 a year. I plant about 900 acres a year, corn and beans, no custom work for anybody else. Operating I figure repairs 3 bucks an acre, tractor and fuel 5.50, labor 2.50. My neighbor said he'd plant it all for 24 an acre. Is it worth buying or should I just hire him? I know timeliness matters, he's got his own acres to plant first.", "wynik": "OWN vs. CUSTOM — Used 16-row planter, 900 ac/year\n\n| item | $/year | $/ac |\n| depreciation | 12,000 | 13.33 |\n| interest on average investment | 8,400 | 9.33 |\n| insurance and housing | 1,800 | 2.00 |\n| fixed cost total | 22,200 | 24.67 |\n| operating (repairs 3.00 + tractor and fuel 5.50 + labor 2.50) | — | 11.00 |\n| ownership cost total | — | 35.67 |\n| custom quote (neighbor) | — | 24.00 |\n\nMath:\n1. Depreciation: (180,000 − 60,000) ÷ 10 = $12,000/year\n2. Interest: (180,000 + 60,000) ÷ 2 = 120,000 × 7% = $8,400/year\n3. Fixed: 12,000 + 8,400 + 1,800 = $22,200/year ÷ 900 ac = $24.67/ac\n4. Ownership: 24.67 + 11.00 = $35.67/ac vs. custom $24.00/ac → owning costs $11.67/ac more; per year (22,200 + 11.00 × 900) − 24.00 × 900 = 32,100 − 21,600 = $10,500\n5. Breakeven acres: 22,200 ÷ (24.00 − 11.00) = 1,708 ac\n\nWhat it means: at 900 ac the planter would need about 808 more acres a year to match the custom rate.\n\nNon-cash factors: planting date — the neighbor plants his own acres first [TO FILL IN: likely delay in days]; yield effect of a later date [TO FILL IN from your own data or extension trials].\n[ASSUMPTION] $24/ac is a firm quote; compare it with your state custom rate survey [VERIFY].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "3.08", "nazwa": "Grain Marketing Plan", "tag": "GRAIN MARKETING", "co_robi": "Compares selling at harvest with storing and selling later using the grower's actual bids: cash sales, forward contracts and basis. Calculates the cost of carry (storage and interest) and the net gain per bushel, then builds a sales schedule that meets the farm's cash needs.", "kiedy": "Before harvest, when bins are being filled and the grower has to decide how many bushels go to town now and how many wait for a better bid.", "brief": [{"pole": "Commodity and quantity", "opis": "Crop, expected bushels, quality, e.g. “corn, 60,000 bu expected, normal moisture”."}, {"pole": "Bids and contracts", "opis": "Current bids, basis and existing contracts, e.g. “harvest cash bid $3.95, January forward delivery $4.20 at the same elevator, nothing contracted yet”."}, {"pole": "Storage costs", "opis": "Your on-farm or commercial storage cost, e.g. “on-farm about 2 cents/bu per month for fans and handling”."}, {"pole": "Cost of money", "opis": "Interest rate on the operating line or savings, e.g. “operating line at 7.5%”."}, {"pole": "Cash needs", "opis": "Payments and dates the sales must cover, e.g. “$75,000 by November 15 for rent”."}, {"pole": "Storage and logistics", "opis": "Bin capacity, trucking, delivery windows, e.g. “40,000 bu of bin space on the farm, own semi”."}], "prompt": "You are an experienced independent agronomist and farm management advisor (CCA) who helps growers put together a written grain marketing plan. Build a plan that compares selling at harvest with storing and selling later.\n\nINPUT:\nCommodity and quantity: [COMMODITY AND QUANTITY]\nBids and contracts: [BIDS AND CONTRACTS]\nStorage costs: [STORAGE COSTS]\nCost of money: [COST OF MONEY]\nCash needs: [CASH NEEDS]\nStorage and logistics: [STORAGE AND LOGISTICS]\n\nRULES:\n1. Check the data first. If anything important is missing, ask me at most 6 short questions and wait for my answers.\n2. Do not invent prices, yields, rates, program payments, insurance figures or “typical” values. Work only with my numbers. Mark missing data [TO FILL IN], anything you assume [ASSUMPTION], anything uncertain [VERIFY].\n3. Show every calculation step by step with units ($/ac, $/bu, bu/ac, ac) and round only the final result.\n4. Use only bids, basis and contract prices I give you. Do not forecast futures, basis or prices, and do not recommend a hedge or options position.\n5. Cost of carry per bushel = storage cost per month × months + harvest price × interest rate × months ÷ 12. Net gain from storing = deferred bid − harvest bid − cost of carry.\n6. Bushels that do not fit in storage are sold at harvest or need a commercial storage quote [TO FILL IN].\n7. Check that harvest sales cover the cash needs on time; flag any gap.\n8. Shrink, drying and quality discounts count only if I give the numbers.\n\nOUTPUT FORMAT:\nA) Comparison table | option | bushels | price $/bu | cost of carry $/bu | net $/bu | $ total |.\nB) Step-by-step math.\nC) Sales schedule by month with the cash needs covered.\nD) Contract terms, gaps and questions for the elevator or merchandiser.\n\nEnd with: “This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Add a commercial storage option using the elevator's storage rate I give you.", "Calculate the deferred bid needed just to cover cost of carry.", "Split sales into three increments on the dates I choose.", "Add shrink and drying charges from the elevator's discount schedule I paste.", "Compare the bids from two elevators including trucking cost per bushel.", "Write questions to ask the merchandiser about the forward contract terms.", "Show the plan if harvest comes in 10% below expectations.", "Prepare a one-page marketing plan to share with the ag lender.", "Format the sales schedule for Excel.", "Summarize the plan in three sentences for the grower."], "checklista": ["Every bid and basis figure is current and from a named buyer.", "Contracted bushels do not exceed what the grower can reasonably deliver given insured production [VERIFY with the agent].", "Storage costs and interest rate are the grower's own figures.", "Bin capacity and delivery windows are realistic.", "Cash needs and due dates are covered.", "Contract terms (delivery period, quality, cancellation) are read before signing."], "uwaga": "Forward contracts are binding delivery commitments. Over-contracting beyond what you can produce carries real risk; check with your crop insurance agent how revenue protection relates to forward sales, and read the contract before signing.", "przyklad": {"wejscie": "Corn, I'm expecting about 60,000 bushels this year. Bin space on the farm is 40,000. Elevator in town is bidding 3.95 for harvest delivery and 4.20 for January delivery, same place. Nothing contracted yet. Keeping corn in the bins costs me about 2 cents a bushel a month for fans and handling. My operating line is at 7 and a half percent. I need 75 thousand by November 15th for cash rent. I'd store from October to January, three months. Tell me if storing is worth it and how many bushels go to town at harvest. Don't guess where the market is going, just the numbers I've got.", "wynik": "GRAIN MARKETING PLAN — Corn, 60,000 bu expected\n\n| option | bushels | price $/bu | cost of carry $/bu | net $/bu | $ total |\n| sell at harvest (no bin space) | 20,000 | 3.95 | — | 3.95 | 79,000 |\n| store on farm, sell January | 40,000 | 4.20 | 0.134 | 4.066 | 162,638 |\n\nMath:\n1. Storage: $0.02/bu/month × 3 months = $0.060/bu\n2. Interest: $3.95 × 7.5% × 3 ÷ 12 = $0.074/bu\n3. Cost of carry: 0.060 + 0.074 = $0.134/bu\n4. Net gain from storing: 4.20 − 3.95 − 0.134 = $0.116/bu; × 40,000 bu = $4,638\n5. Harvest sales: 60,000 − 40,000 = 20,000 bu × $3.95 = $79,000\n\nCash needs: $79,000 at harvest ≥ $75,000 rent due Nov 15 → covered, $4,000 left.\n\nSchedule:\n| month | bushels | buyer | price |\n| Oct | 20,000 | elevator, harvest | $3.95 |\n| Jan | 40,000 | elevator, forward | $4.20 [VERIFY contract terms] |\n\nGaps: shrink and drying charges [TO FILL IN from the elevator's discount schedule]; whether the 60,000 bu holds up [ASSUMPTION]; harvest payment date vs. Nov 15 [VERIFY].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "3.09", "nazwa": "Post-Harvest Field Profitability Analysis", "tag": "FIELD PROFITABILITY", "co_robi": "Ranks fields by return per acre after harvest using yield monitor averages, prices received and costs by field. Points to the fields and zones that lost money and lists the agronomic questions to dig into with the yield maps.", "kiedy": "After harvest, once yield maps are cleaned and settlement sheets are in, when planning next year's rent bids, drainage or variable-rate plans.", "brief": [{"pole": "Operation and season", "opis": "Farm, county, crop year, e.g. “Miller Farms, Story County, IA, 2026 crop”."}, {"pole": "Fields and crops", "opis": "Field names, acres, crop, e.g. “North 80 corn 80 ac, Creek field corn 65 ac, Home quarter soybeans 155 ac”."}, {"pole": "Yields and prices received", "opis": "Clean yield map averages and average price received, e.g. “corn 212 and 168 bu/ac, beans 58 bu/ac; corn $4.05, beans $10.20”."}, {"pole": "Costs by field", "opis": "Total cost per acre for each field including rent, e.g. “North 80 $690/ac, Creek field $720/ac, Home quarter $480/ac”."}, {"pole": "Season notes", "opis": "What happened, e.g. “Creek field had about 12 ac of wet spots at 110 bu on the map”."}, {"pole": "Analysis goal", "opis": "What you want out of it, e.g. “decide whether to keep renting the Creek field”."}], "prompt": "You are an experienced independent agronomist and farm management advisor (CCA) who reviews the season with growers using yield maps and field records. Prepare a post-harvest profitability analysis by field.\n\nINPUT:\nOperation and season: [OPERATION AND SEASON]\nFields and crops: [FIELDS AND CROPS]\nYields and prices received: [YIELDS AND PRICES RECEIVED]\nCosts by field: [COSTS BY FIELD]\nSeason notes: [SEASON NOTES]\nAnalysis goal: [ANALYSIS GOAL]\n\nRULES:\n1. Check the data first. If anything important is missing, ask me at most 6 short questions and wait for my answers.\n2. Do not invent prices, yields, rates, program payments, insurance figures or “typical” values. Work only with my numbers. Mark missing data [TO FILL IN], anything you assume [ASSUMPTION], anything uncertain [VERIFY].\n3. Show every calculation step by step with units ($/ac, $/bu, bu/ac, ac) and round only the final result.\n4. Return per acre = yield × price received − cost per acre. Show $/ac and $ per field, then the farm total and the acre-weighted average.\n5. Use only yields from cleaned yield data or scale tickets I give you. If a yield map was not calibrated, mark it [VERIFY].\n6. Calculate the breakeven yield for any field that lost money.\n7. Agronomic causes (drainage, compaction, disease, fertility) are hypotheses to check in the field and against soil tests, not conclusions. Mark them [VERIFY].\n\nOUTPUT FORMAT:\nA) Field ranking table | field | crop | ac | yield bu/ac | price | revenue $/ac | cost $/ac | return $/ac | return $ |.\nB) Step-by-step math and farm totals.\nC) Fields and zones below breakeven, with what the yield map shows.\nD) Agronomic questions to investigate and decisions to make before next season.\n\nEnd with: “This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Add a zone-level analysis for the low-yield area I describe on the map.", "Compare this year's ranking with last year's I paste.", "Calculate the cash rent at which the losing field breaks even.", "Write a list of soil sampling points for the low zones.", "Prepare a short report for the landlord on the rented field.", "Show returns without rent to compare owned and rented ground fairly.", "Rank fields by return per acre over the last three years I enter.", "List questions for the drainage contractor about the wet spots.", "Format the ranking for Excel.", "Summarize the three main takeaways in plain language for the grower."], "checklista": ["Yield monitor data was calibrated and cleaned, or checked against scale tickets.", "Prices are averages actually received, not current bids.", "Costs per field use the same definition for every field (rent included or not).", "Acres match the FSA-578 report or the yield map boundary.", "Agronomic causes are flagged as hypotheses to verify in the field.", "Gaps marked [TO FILL IN] are closed before decisions are made."], "uwaga": "", "przyklad": {"wejscie": "Season wrap for Miller Farms, three fields. North 80 corn, 80 acres, map says 212 after cleaning. Creek field corn, 65 acres, only 168 — there's about 12 acres of wet spots that showed 110 on the map. Home quarter beans, 155 acres, 58 bushels. Corn averaged 4.05 on what we sold, beans 10.20. Costs per acre with rent in: North 80 690, Creek field 720 because that rent's high, Home quarter 480. I want to see which fields made money and whether I keep renting the Creek field. Monitor was calibrated in September.", "wynik": "FIELD PROFITABILITY — Miller Farms, 2026 crop\n\n| field | crop | ac | yield bu/ac | price | revenue $/ac | cost $/ac | return $/ac | return $ |\n| Home quarter | soybeans | 155 | 58 | 10.20 | 591.60 | 480 | 111.60 | 17,298 |\n| North 80 | corn | 80 | 212 | 4.05 | 858.60 | 690 | 168.60 | 13,488 |\n| Creek field | corn | 65 | 168 | 4.05 | 680.40 | 720 | −39.60 | −2,574 |\n\nMath:\n1. North 80: 212 × 4.05 = 858.60 − 690 = $168.60/ac × 80 = $13,488\n2. Creek field: 168 × 4.05 = 680.40 − 720 = −$39.60/ac × 65 = −$2,574\n3. Home quarter: 58 × 10.20 = 591.60 − 480 = $111.60/ac × 155 = $17,298\n4. Farm total: 13,488 − 2,574 + 17,298 = $28,212 on 300 ac = $94.04/ac\n\nBelow breakeven: Creek field. Breakeven yield = 720 ÷ 4.05 = 177.8 bu/ac, 9.8 bu above what it made. The 12 ac of wet spots at 110 bu/ac pulled the field average down.\n\nTo investigate: drainage in the wet zones [VERIFY in the field]; compaction or N loss in those spots [VERIFY with soil tests and tissue data]; whether the rent can be renegotiated [TO FILL IN: lease terms].\n[ASSUMPTION] corn and soybean costs include rent on every field as you said.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "3.10", "nazwa": "Investment and Payback Analysis", "tag": "PAYBACK", "co_robi": "Evaluates a farm investment — grain bin, sprayer, drainage tile — with simple payback and net present value from the grower's own cost, benefit and interest figures. Shows how sensitive the decision is to the benefit estimate and the time horizon.", "kiedy": "When a contractor or dealer quote is on the table and the grower wants to know if the investment pays back before talking to the lender.", "brief": [{"pole": "Investment", "opis": "What, where, how big, e.g. “pattern tile on the Creek field, 70 ac, corn-soybean rotation”."}, {"pole": "Upfront cost", "opis": "Quotes and total, e.g. “contractor quote $1,050/ac installed”."}, {"pole": "Annual benefits", "opis": "Your estimate of extra income or savings, with how you got it, e.g. “+25 bu corn at $4.00 and +8 bu beans at $10.00, alternating years”."}, {"pole": "Operating costs", "opis": "Yearly costs of running it, e.g. “outlet and maintenance about $5/ac/year”."}, {"pole": "Period and rate", "opis": "Horizon and discount rate, e.g. “25 years at 7%”."}, {"pole": "Financing", "opis": "How it will be paid for, e.g. “Farm Credit loan, terms not set yet”."}], "prompt": "You are an experienced independent agronomist and farm management advisor (CCA) who helps growers evaluate capital investments. Prepare an investment analysis with simple payback and net present value.\n\nINPUT:\nInvestment: [INVESTMENT]\nUpfront cost: [UPFRONT COST]\nAnnual benefits: [ANNUAL BENEFITS]\nOperating costs: [OPERATING COSTS]\nPeriod and rate: [PERIOD AND RATE]\nFinancing: [FINANCING]\n\nRULES:\n1. Check the data first. If anything important is missing, ask me at most 6 short questions and wait for my answers.\n2. Do not invent prices, yields, rates, program payments, insurance figures or “typical” values. Work only with my numbers. Mark missing data [TO FILL IN], anything you assume [ASSUMPTION], anything uncertain [VERIFY].\n3. Show every calculation step by step with units ($/ac, $/bu, bu/ac, ac) and round only the final result.\n4. Net annual benefit = annual benefits − operating costs. Simple payback = upfront cost ÷ net annual benefit. NPV = net annual benefit × annuity factor (1 − (1 + r)^−n) ÷ r − upfront cost. Show the factor.\n5. Benefit estimates (yield gains, savings) come only from me; mark them [ASSUMPTION] and suggest what data would support them.\n6. Do not estimate NRCS cost-share, tax depreciation or loan terms. Mark them [VERIFY] with NRCS, the tax preparer and the lender.\n7. For drainage, note that wetland and highly erodible land compliance must be confirmed with NRCS and FSA before work starts.\n\nOUTPUT FORMAT:\nA) Summary table | item | value |.\nB) Step-by-step math: net benefit, payback, NPV.\nC) Sensitivity: horizon or benefit changes I asked for.\nD) Risks, permits, gaps and questions for the lender and NRCS.\n\nEnd with: “This is a draft for your review — the final call, signature and liability stay with you.”", "polecenia": ["Run NPV at the discount rates I give you.", "Show payback if the yield gain is half my estimate.", "Add the loan payment schedule with the terms my lender quotes.", "Compare two contractor quotes I paste.", "Do the same analysis for a grain bin using the drying and basis gains I enter.", "Calculate the benefit needed per acre for NPV to reach zero.", "List the documents the lender will want for this investment.", "Write questions for the NRCS office before I start the project.", "Format the analysis for Excel.", "Summarize the investment case in three sentences."], "checklista": ["The upfront cost matches written quotes.", "Benefit estimates are backed by the grower's yield maps, trials or records.", "Discount rate and horizon were chosen by the grower.", "Wetland and highly erodible land compliance confirmed with NRCS and FSA before drainage work [VERIFY].", "Cost-share, tax depreciation and loan terms are confirmed, not assumed.", "Sensitivity to lower benefits is shown."], "uwaga": "Drainage work can affect wetland conservation compliance and USDA program eligibility. Check with NRCS and the FSA county office before any tile goes in, and take tax treatment questions to the accountant or tax preparer.", "przyklad": {"wejscie": "Thinking about pattern tile on the Creek field, 70 acres. Contractor quoted 1,050 an acre installed. It's corn-bean rotation. My guess is plus 25 bushels on corn at 4 bucks and plus 8 on beans at 10 dollars, every other year each. Upkeep on the outlet and such, figure 5 an acre a year. Look at it over 25 years at 7 percent. I'd finance it with Farm Credit but we haven't talked terms. Don't know if NRCS has anything for it. Does it pay?", "wynik": "INVESTMENT ANALYSIS — Pattern tile, Creek field, 70 ac\n\n| item | value |\n| upfront cost | $73,500 |\n| net annual benefit | $5,950 |\n| simple payback | 12.4 years |\n| NPV, 25 years at 7% | −$4,161 |\n\nMath:\n1. Upfront: $1,050/ac × 70 ac = $73,500\n2. Benefit, corn year: 25 bu × $4.00 = $100/ac; soybean year: 8 bu × $10.00 = $80/ac; rotation average (100 + 80) ÷ 2 = $90/ac/year\n3. Net benefit: 90 − 5 = $85/ac × 70 ac = $5,950/year\n4. Payback: 73,500 ÷ 5,950 = 12.4 years\n5. Annuity factor: (1 − 1.07^−25) ÷ 0.07 = 11.6536\n6. NPV: 5,950 × 11.6536 = $69,339 − 73,500 = −$4,161\n\nSensitivity: over 30 years the factor is 12.4090 → 5,950 × 12.4090 = $73,834 − 73,500 = +$334, essentially breakeven.\n\nWhat it means: at your numbers the tile pays back in about 12 years but does not quite clear 7% over 25 years. The decision hinges on the yield gain.\n\n[ASSUMPTION] +25 bu corn and +8 bu soybeans — check against yield maps of the wet zones.\nTo verify: wetland compliance before tiling [VERIFY with NRCS and FSA]; any NRCS cost-share [VERIFY]; loan terms [TO FILL IN]; tax depreciation [VERIFY with your tax preparer].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}]}, {"dzial_nr": 4, "dzial": "Grower Clients & Paid Advisory", "opis": "Good field knowledge doesn't pay for itself — it has to be priced, written into a proposal, put in an agreement and shown to the grower month after month. This department handles the business side of independent advisory work: from setting your rate and onboarding new growers to monthly reports, field days, tough conversations and growing your client base.", "skills": [{"id": "4.01", "nazwa": "Advisory Proposal With Pricing", "tag": "ADVISORY PROPOSAL", "co_robi": "Turns your notes into a clean, professional advisory proposal with packages, scope and terms. Fees come only from you — the AI never suggests a rate, it organizes what you offer and shows the grower exactly what they are paying for.", "kiedy": "When a grower says “send me something in writing” after a field walk or a winter meeting, and you want the proposal in their inbox that same evening.", "brief": [{"pole": "Advisor profile", "opis": "Who you are and what you know, e.g. “independent CCA, 11 years at a co-op, corn and soybeans, VRT fertility and scouting, covering Story and Boone County, IA”."}, {"pole": "Target grower", "opis": "Who the proposal is for, e.g. “row-crop operations 800–3,000 ac, owner-operator, no agronomist of their own, buys inputs from two retailers”."}, {"pole": "Scope of services", "opis": "What you actually do, e.g. “weekly scouting May–August, grid soil sampling every 4 years, N plan, pesticide records help, year-end field review”."}, {"pole": "Packages and fees", "opis": "Your own fees and options, e.g. “Basic $___ per acre per year, Full Service $___ per acre, single field visit $___” — enter your own numbers."}, {"pole": "Terms", "opis": "Payment, minimums, travel, e.g. “half due at signing, half August 1, one-season agreement, travel within 60 miles included”."}, {"pole": "Tone and format", "opis": "How it should read, e.g. “straight talk, two pages plus a short email version”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who runs a paid advisory business for row-crop growers and writes proposals that growers actually read. Help me build an advisory proposal with pricing.\n\nINPUT:\nAdvisor profile: [ADVISOR PROFILE]\nTarget grower: [TARGET GROWER]\nScope of services: [SCOPE OF SERVICES]\nPackages and fees: [PACKAGES AND FEES]\nTerms: [TERMS]\nTone and format: [TONE AND FORMAT]\n\nRULES:\n1. First check my inputs. If something important is missing, ask me up to 5–7 short questions and wait for my answers.\n2. Use only my fees, per acre or retainer. If a package has no price, write [TO FILL IN] and do not propose a number.\n3. Describe every package concretely: number of visits, written deliverables, response time in season, and what the package does NOT include.\n4. Write the way agronomists and growers talk, no marketing fluff. Show value through better field decisions (timing, N plan, cleaner records), not yield promises.\n5. Do not promise yield gains, ROI or savings in numbers unless I give you my own client data.\n6. If you calculate cost for a sample farm, show the math step by step using my fees only.\n7. Make clear that the grower makes the final decision on every recommendation and that input purchases and applications are not part of the fee unless I say so.\n8. Never invent prices, rates, fees, product rates, dates, legal terms or regulation numbers. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n\nOUTPUT FORMAT:\nA) Proposal ready to send: header, about me, the grower's problem, packages, terms, contact.\nB) Package comparison table: | package | what's included | fee |.\nC) Short email or text version, 8 sentences max.\nD) List of gaps and assumptions to fix before sending.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Add a third “Starter” package for operations under 500 acres.", "Calculate the Full Service cost for a 1,450-acre farm with my fees, step by step.", "Cut the proposal down to one page.", "Add a “What this does not cover” section to prevent misunderstandings.", "Write a version for a landowner who cash-rents to several operators.", "Write a short third-person bio for the footer.", "Add a 5-question FAQ with the questions growers ask most.", "Make the tone more direct, like talking at the tailgate.", "Write a text message with a link to the proposal and an invite to a call.", "Check the proposal for any claim I can't back up."], "checklista": ["Every fee comes from my own price list and is current for this season.", "It is clear how travel is charged and whether sales tax applies [VERIFY WITH YOUR STATE].", "Each package lists visits, response time and written deliverables.", "There is a “not included” section (inputs, custom application, responsibility for how an application is done).", "No yield or ROI promises without data behind them.", "Contact details and the offer expiration date are filled in."], "uwaga": "You set the fees and terms. If the proposal becomes the basis for an agreement, move the scope into a written services agreement and have it reviewed by an attorney.", "przyklad": {"wejscie": "OK so I'm an independent CCA, spent nine years agronomist at a co-op in central Iowa before going out on my own. Mostly corn and beans, some seed corn acres, Story and Boone County. Two packages. Basic is scouting every week from mid-May through August, N plan, help keeping the pesticide records straight, eight bucks an acre. Full Service is all that plus grid sampling on a four-year rotation, the soil test interpretation and unlimited calls in season, fourteen an acre. Travel inside 60 miles is on me, past that I'll figure the mileage. Half at signing, half August first. Target guys are 800 to 3,000 acres, owner runs it. Keep it short, no fluff.", "wynik": "AGRONOMY ADVISORY PROPOSAL — [TO FILL IN: season]\n\nWho it's for: owner-operated corn and soybean operations, 800–3,000 ac, in Story and Boone County, IA, without an agronomist on staff.\n\nWhat you get: input and timing decisions based on weekly scouting instead of guesswork, pesticide records that are ready when someone asks for them, and one phone number that knows your fields.\n\n| package | what's included | fee |\n| Basic | weekly scouting mid-May–Aug, N plan, pesticide record support | $8.00/ac/yr |\n| Full Service | Basic + grid sampling on a 4-year rotation, soil test interpretation, unlimited in-season calls | $14.00/ac/yr |\n\nSample cost (Full Service, 1,450 ac): 1,450 ac × $14.00 = $20,300/yr. Half at signing: $20,300 ÷ 2 = $10,150; balance of $10,150 due August 1.\n\nTravel: included within 60 miles; beyond that, [TO FILL IN] per mile.\nSales tax on services: [VERIFY WITH YOUR STATE].\n\nNot included: seed, fertilizer and chemical purchases, custom application, and responsibility for how and when an application is carried out. You make the final decision on every recommendation.\n\nOffer valid until: [TO FILL IN].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "4.02", "nazwa": "Consulting Services Agreement", "tag": "SERVICES AGREEMENT", "co_robi": "Drafts a plain-English consulting services agreement between you and the grower: scope, fees, term, liability, data ownership and the key line that the grower makes the final decision. It is a working draft for an attorney to review, not a finished legal document.", "kiedy": "When a grower has said yes to the proposal and you want the deal on paper before the season starts — not after the first disagreement.", "brief": [{"pole": "Parties", "opis": "Who signs, e.g. “Prairie Ag Consulting LLC (Jake Thompson, CCA) and Miller Farms, Story County, IA”."}, {"pole": "Scope of work", "opis": "What is included and what isn't, e.g. “weekly scouting May–Aug on 1,450 ac, N plan, record support; no custom application, no input sales”."}, {"pole": "Fees and payment", "opis": "Your fee and schedule, e.g. “$___ per acre, half at signing, balance Aug 1, late fee ___” — your own numbers."}, {"pole": "Term and termination", "opis": "Length and how to end it, e.g. “one crop year, either side can end it with 30 days written notice”."}, {"pole": "Liability and risk", "opis": "How you limit your exposure, e.g. “grower makes final decisions, I don't apply products, I carry professional liability insurance”."}, {"pole": "Data and confidentiality", "opis": "Who owns field data, e.g. “yield maps and soil data belong to the grower, I can use anonymized data for trials”."}], "prompt": "You are an experienced independent agronomist and CCA who has run a consulting business for years and knows where advisor-grower deals go wrong. Help me draft a consulting services agreement in plain English that I will have reviewed by an attorney.\n\nINPUT:\nParties: [PARTIES]\nScope of work: [SCOPE OF WORK]\nFees and payment: [FEES AND PAYMENT]\nTerm and termination: [TERM AND TERMINATION]\nLiability and risk: [LIABILITY AND RISK]\nData and confidentiality: [DATA AND CONFIDENTIALITY]\n\nRULES:\n1. First check my inputs. If something important is missing, ask me up to 5–7 short questions and wait for my answers.\n2. Use only my fees, dates and terms. Do not invent late fees, interest rates, notice periods or dollar caps — write [TO FILL IN].\n3. Include a clear clause that recommendations are advisory, the grower makes the final decision, and the grower and applicator are responsible for following the product label.\n4. Do not cite specific state statutes or legal section numbers. Where state law may matter (liability limits, governing law, sales tax) write [VERIFY] and flag it for the attorney.\n5. Separate what is included from what is excluded (input sales, custom application, crop insurance decisions, legal or tax advice).\n6. Cover data: who owns soil, yield and imagery data, and how I may use it.\n7. Keep sentences short and readable for a grower, without legalese where it is not needed.\n8. Never invent prices, rates, fees, product rates, dates, legal terms or regulation numbers. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n\nOUTPUT FORMAT:\nA) Agreement draft with numbered sections and signature block.\nB) Schedule A: scope of services and fees as a table | service | frequency | fee |.\nC) List of points to review with an attorney, each marked [VERIFY].\nD) A short cover email to the grower.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Add a section on what happens if I can't make a visit because of weather or illness.", "Write a shorter one-page letter-of-engagement version.", "Add a clause that I don't sell inputs and have no financial interest in any product I recommend.", "Add a data-sharing clause for on-farm trials.", "Rewrite the liability section in even simpler language.", "Add a renewal clause for the next crop year.", "List the questions I should ask my attorney about this draft.", "Add a section on communication: how and when the grower can reach me.", "Write a version for a landlord who hires me to oversee rented ground.", "Check the draft for any promise of results I should remove."], "checklista": ["Fees, dates and notice periods match what we agreed and contain no AI-made numbers.", "The “grower makes the final decision” and label-compliance clause is in the agreement.", "Exclusions are explicit (inputs, application, insurance, legal and tax advice).", "Data ownership and confidentiality are covered.", "Every [VERIFY] item is on the list for the attorney.", "My professional liability insurance details are correct [VERIFY].", "An attorney licensed in my state has reviewed it before signing."], "uwaga": "This is not legal advice. Contract law, liability limits and governing-law rules vary by state and province. Have an attorney review the agreement before anyone signs it.", "przyklad": {"wejscie": "Need a contract for Miller Farms, Dave Miller, Story County. It's me, Prairie Ag Consulting LLC. Full Service on 1,450 acres, fourteen bucks an acre, half when he signs, half August first. One crop year, either one of us can walk with 30 days written notice. I don't sell product and I don't spray anything, he makes the calls, I just recommend. I've got professional liability coverage. His yield data and soil tests are his, but I'd like to use the numbers without his name for my plot comparisons. Keep it readable, my lawyer will go over it.", "wynik": "CONSULTING SERVICES AGREEMENT — DRAFT FOR ATTORNEY REVIEW\n\n1. Parties. Prairie Ag Consulting LLC (“Consultant”) and Miller Farms, Dave Miller, Story County, Iowa (“Grower”).\n\n2. Services. Consultant provides the Full Service package on approximately 1,450 acres as listed in Schedule A.\n\n3. Fees. $14.00 per acre per year. 1,450 ac × $14.00 = $20,300. Half ($10,150) due at signing, balance ($10,150) due August 1. Late payment terms: [TO FILL IN].\n\n4. Term. One crop year starting [TO FILL IN]. Either party may end this Agreement with 30 days' written notice. Fees for services already provided remain due [VERIFY].\n\n5. Advisory role. All recommendations are advisory. The Grower makes the final decision on every input, rate and timing. The Grower and any applicator are responsible for reading and following the product label. Consultant does not sell inputs or apply products.\n\n6. Liability. Consultant carries professional liability insurance: [TO FILL IN: carrier and limits]. Limitation of liability clause: [VERIFY with attorney — state law].\n\n7. Data. Soil, yield and field data belong to the Grower. Consultant may use the data without the Grower's name for trial comparisons.\n\n8. Governing law: [VERIFY].\n\nSignatures: ____________ / ____________ Date: [TO FILL IN]\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "4.03", "nazwa": "Seasonal Messages to Your Client List", "tag": "SEASONAL MESSAGES", "co_robi": "Writes short seasonal texts and emails to your whole client list — pre-plant, in-season, harvest, winter planning — in your own voice. Keeps them useful and specific so growers read them instead of ignoring them.", "kiedy": "When something changes in the field (cold snap, pest flight, wet harvest) and you want every client to hear it from you today, not from the retailer next week.", "brief": [{"pole": "Point in the season", "opis": "Where the season is, e.g. “two weeks before planting, soils still cold, anhydrous going on”."}, {"pole": "Audience", "opis": "Who gets it, e.g. “all 38 corn and soybean clients in central Iowa”."}, {"pole": "Channel", "opis": "How it goes out, e.g. “group text, short; plus an email with a bit more detail”."}, {"pole": "Main message", "opis": "The one thing they need to know, e.g. “check planter setup and don't plant into wet soil just because the neighbor started”."}, {"pole": "Call to action", "opis": "What you want them to do, e.g. “text me which fields go first so I can schedule stand counts”."}, {"pole": "My voice", "opis": "How you sound, e.g. “plain, friendly, a little dry humor, no emojis”."}], "prompt": "You are an experienced independent agronomist and CCA who keeps in touch with 30–60 grower clients by text and email and knows that a message nobody reads is wasted. Help me write a seasonal message to my client list.\n\nINPUT:\nPoint in the season: [POINT IN THE SEASON]\nAudience: [AUDIENCE]\nChannel: [CHANNEL]\nMain message: [MAIN MESSAGE]\nCall to action: [CALL TO ACTION]\nMy voice: [MY VOICE]\n\nRULES:\n1. First check my inputs. If something important is missing, ask me up to 5–7 short questions and wait for my answers.\n2. One main message per text. A text is 320 characters max; an email is 150–250 words with a clear subject line.\n3. Do not include product rates, REI, PHI, thresholds or dates from memory. If the message needs them, write [CHECK LABEL] or [TO FILL IN] and tell me where to get them (label, extension).\n4. Write in my voice. No hype, no sales language, no emojis unless I ask.\n5. Make the call to action specific and easy (reply with a field name, a date, yes or no).\n6. Do not mention any specific grower or field by name in a group message.\n7. If the message is about a pest or disease risk, say what to look for and to call me before acting, not what to spray.\n8. Never invent prices, rates, fees, product rates, dates, legal terms or regulation numbers. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n\nOUTPUT FORMAT:\nA) Text message version, 320 characters max.\nB) Email version with subject line.\nC) Two alternative subject lines or opening lines.\nD) Gaps to fill before sending.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Write a harvest-wrap-up version thanking clients for the season.", "Make the text shorter, under 200 characters.", "Write a version for new clients who don't know me well yet.", "Write a winter-planning message inviting clients to book a review.", "Turn this into a short voice-memo script under 45 seconds.", "Write a follow-up for clients who didn't reply after three days.", "Write the same message for a Canadian client list using hectares.", "Add a P.S. reminding them about the soil sampling window.", "Write three subject lines that don't sound like a sales email.", "Check the message for anything that sounds like a product recommendation."], "checklista": ["The message has one main point and a clear call to action.", "No product rates, REI, PHI or thresholds without a label or extension source.", "No individual grower or field is named in a group message.", "The send list is current and uses BCC or a proper group tool for email.", "Clients have agreed to get texts from me [VERIFY].", "Tone matches how I actually talk."], "uwaga": "Bulk texting and email marketing have consent and opt-out rules (in the US, TCPA and CAN-SPAM; in Canada, CASL). Only message clients who agreed to it, and include a way to opt out.", "przyklad": {"wejscie": "Quick one for the whole list, all 38 of my guys in central Iowa. We're maybe two weeks out from planting, soils still cold, a bunch of anhydrous going on right now. I want to say: don't jump just because the neighbor's rolling, check soil temp and moisture, and get the planter set up right — closing wheels, down pressure, seed depth. And text me which fields go first so I can line up stand counts. Text plus a slightly longer email. Plain, a little dry humor, no emojis.", "wynik": "A) TEXT (278 characters)\nPlanting's close. Before you roll: check soil temp and moisture in the field, not the neighbor's. Walk behind the planter the first round — seed depth, down pressure, closing wheels. Then text me which fields go in first so I can schedule stand counts. — [TO FILL IN: your name]\n\nB) EMAIL\nSubject: Two weeks out — what to check before the planter rolls\n\nHi everyone,\n\nWe're about two weeks from planting, and the soils are still cold in most of what I've walked. The neighbor starting isn't a soil temperature reading.\n\nBefore you go:\n• Check soil temperature and moisture at seed depth in each field. For local guidance, use your state extension planting recommendations [VERIFY].\n• Run the first pass and dig behind the planter: seed depth, down pressure, closing wheels.\n• If you're still putting on anhydrous, give it the waiting period your retailer and the label call for [CHECK LABEL].\n\nOne ask: reply with which fields are going in first. I'll line up stand counts so we catch problems while there's still time to make a call.\n\nTalk soon,\n[TO FILL IN: name, phone]\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "4.04", "nazwa": "Onboarding a New Grower", "tag": "CLIENT ONBOARDING", "co_robi": "Builds a complete onboarding package for a new grower: what to collect (field boundaries, FSA maps, soil tests, yield and application records), the first-visit agenda and a 30-day plan. Nothing slips through and the grower sees you are organized from day one.", "kiedy": "When a new grower signs on and you want the first visit to be productive, not a two-hour hunt for maps and passwords.", "brief": [{"pole": "Operation", "opis": "Who and where, e.g. “Hoffman Brothers, McLean County, IL — 2,200 ac, two brothers and a hired man”."}, {"pole": "Crops and acres", "opis": "What they grow, e.g. “corn 1,200 ac, soybeans 900 ac, 100 ac wheat for double-crop beans”."}, {"pole": "What they already have", "opis": "Existing records, e.g. “FSA maps, 2-year-old soil tests on half the farm, yield maps in the combine display, paper spray records”."}, {"pole": "Grower expectations", "opis": "What they want from you, e.g. “cut fertilizer spend without losing yield, get records audit-ready”."}, {"pole": "Service scope", "opis": "What you agreed to, e.g. “Full Service package, weekly scouting, grid sampling, N plan”."}, {"pole": "First visit date", "opis": "When you start, e.g. “March 14, at the shop, then drive the fields”."}], "prompt": "You are an experienced independent agronomist and CCA who onboards new grower clients every winter and knows that a clean start saves a messy season. Help me onboard a new grower.\n\nINPUT:\nOperation: [OPERATION]\nCrops and acres: [CROPS AND ACRES]\nWhat they already have: [WHAT THEY ALREADY HAVE]\nGrower expectations: [GROWER EXPECTATIONS]\nService scope: [SERVICE SCOPE]\nFirst visit date: [FIRST VISIT DATE]\n\nRULES:\n1. First check my inputs. If something important is missing, ask me up to 5–7 short questions and wait for my answers.\n2. Build a document request list: field boundaries, FSA aerial maps and FSA-578 acreage report, farm and tract numbers, soil test reports, yield data, as-applied and pesticide application records, seed and fertilizer history, crop insurance unit structure, landlord list. Mark anything uncertain [VERIFY].\n3. Do not suggest rates, fertility recommendations or product choices at this stage. Onboarding is about collecting facts.\n4. Give the field list a consistent naming system (farm, field name, legal description or FSA field number, acres) and mark missing acres [TO FILL IN].\n5. Note which data needs the grower's permission to access (precision platform, retailer portal, crop insurance agent).\n6. Keep the grower's workload light: what they must do vs. what I can do myself.\n7. Show the timeline with dates only where I gave them.\n8. Never invent prices, rates, fees, product rates, dates, legal terms or regulation numbers. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n\nOUTPUT FORMAT:\nA) Welcome email to the grower with a short request list.\nB) Full data checklist as a table: | item | source | who gets it | status |.\nC) First-visit agenda (60–90 minutes).\nD) 30-day plan and open questions.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Write a one-page “what I need from you” sheet to print and leave at the shop.", "Create a field naming template I can reuse for every client.", "Write a text reminding the grower to bring FSA maps to the first visit.", "Add a section for landlords who need copies of reports.", "Make a list of questions to understand the grower's goals and risk tolerance.", "Write a data-access permission note for the retailer or precision platform.", "Build the first-visit agenda for a 45-minute kitchen-table meeting.", "Add a checklist for collecting old pesticide application records.", "Write the version for a Canadian grower with quarter sections and hectares.", "List the red flags I should watch for in the first month."], "checklista": ["Every field has a name, location reference and acres, or is marked [TO FILL IN].", "FSA maps and acreage reports match the field list [VERIFY].", "Soil test dates and labs are recorded, old tests are flagged.", "Data-access permissions are in writing.", "The grower knows exactly what to bring to the first visit.", "The signed agreement and scope are filed before work starts."], "uwaga": "Treat grower data as confidential. Get written permission before you access retailer, precision-ag or crop insurance accounts, and never share one client's data with another.", "przyklad": {"wejscie": "New client, Hoffman Brothers out in McLean County, Illinois. Mark and Steve plus a hired man, about 2,200 acres — 1,200 corn, 900 beans, 100 wheat with double-crop beans behind. They've got FSA maps, soil tests on maybe half the ground from two years ago, yield maps sitting in the combine display, spray records on paper in a binder. They want to cut fertilizer spend without losing yield and get the records cleaned up. They signed Full Service. First visit March 14 at the shop and then we'll drive around.", "wynik": "A) WELCOME EMAIL\nSubject: Getting started — what to have ready for March 14\n\nMark and Steve,\n\nThanks for signing on. To make the March 14 visit count, please have these at the shop:\n1. FSA aerial maps and your latest FSA-578 acreage report\n2. The soil test reports you have (lab name and date on each)\n3. The spray records binder\n4. Access to the yield data on the combine display, or a USB export\n\nI'll handle the rest.\n\nB) DATA CHECKLIST\n| item | source | who gets it | status |\n| FSA maps, 578 | grower, FSA office | Hoffmans | [TO FILL IN] |\n| Soil tests (~50% of acres, 2 yrs old) | grower | me | partial — rest to sample [ASSUMPTION] |\n| Yield maps | combine display | me with grower | [TO FILL IN] |\n| Pesticide records | paper binder | me to digitize | [TO FILL IN] |\n| Crop insurance units | insurance agent | grower permission | [VERIFY] |\n| Landlord list | grower | Hoffmans | [TO FILL IN] |\n\nC) FIRST VISIT (90 min)\n1. Goals: what “cut fertilizer spend” means to you\n2. Walk the field list and acres, name every field\n3. Review soil tests and records\n4. Drive the fields\n\nD) OPEN QUESTIONS: how many landlords? Is the wheat ground fixed? Who keeps the records now?\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "4.05", "nazwa": "Monthly Client Report", "tag": "MONTHLY REPORT", "co_robi": "Turns your scouting notes and data into a clear monthly report for the grower: what you did, what you saw, what was decided and what's next. It shows the value of your work in a format the grower — and their landlord or lender — can actually read.", "kiedy": "At the end of each month in season, when you have a pile of notes and photos and want the grower to see the work behind your fee.", "brief": [{"pole": "Client and period", "opis": "Who and when, e.g. “Miller Farms, July 2026, 1,450 ac corn and soybeans”."}, {"pole": "Visits and actions", "opis": "What you did, e.g. “4 scouting visits, 2 tissue samples, 1 fungicide decision call on the Creek field”."}, {"pole": "Field observations", "opis": "What you saw, e.g. “gray leaf spot low in canopy on North 80, Japanese beetles on beans, some N deficiency on the sandy knob”."}, {"pole": "Results and numbers", "opis": "Data you have, e.g. “stand counts, tissue test results, rainfall 2.1 in for the month” — only real numbers."}, {"pole": "Plan for next month", "opis": "What's coming, e.g. “R3 fungicide decision in beans, yield estimates late August”."}, {"pole": "Open items", "opis": "Pending things, e.g. “waiting on tissue results, grower to confirm custom applicator date”."}], "prompt": "You are an experienced independent agronomist and CCA who sends growers a monthly report they actually read and keep. Help me write a monthly client report.\n\nINPUT:\nClient and period: [CLIENT AND PERIOD]\nVisits and actions: [VISITS AND ACTIONS]\nField observations: [FIELD OBSERVATIONS]\nResults and numbers: [RESULTS AND NUMBERS]\nPlan for next month: [PLAN FOR NEXT MONTH]\nOpen items: [OPEN ITEMS]\n\nRULES:\n1. First check my inputs. If something important is missing, ask me up to 5–7 short questions and wait for my answers.\n2. Use only the visits, observations and numbers I give you. Do not add yields, losses, savings or pest counts I didn't report.\n3. For any product applied or recommended, list the product as I named it and mark the rate, REI and PHI [CHECK LABEL] unless I gave them from the label.\n4. Show any calculation (stand averages, rainfall totals, acres affected) step by step.\n5. Separate facts (what I saw and measured) from recommendations and from decisions the grower made.\n6. Record clearly that the grower made the final decision on each recommendation.\n7. Keep it to one or two pages. Use field names consistently.\n8. Never invent prices, rates, fees, product rates, dates, legal terms or regulation numbers. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n\nOUTPUT FORMAT:\nA) Report: summary in 3–5 lines, visits table | date | field | what I did | finding |, observations by field, decisions, numbers.\nB) Plan for next month and open items with who owns each.\nC) Short cover email or text to the grower.\nD) Gaps to fill before sending.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Shorten the summary to three bullet points.", "Add a table of decisions made this month and who made them.", "Write a version for the landlord without operating details.", "Turn the observations into a field-by-field table.", "Add a section showing where my scouting changed a decision.", "Write a version suitable for the grower's ag lender.", "Rewrite in simpler language for a grower who doesn't like reports.", "Add photo captions for the three photos I will attach.", "Write the season-to-date summary combining this report with the last two.", "Check the report for anything stated as fact that I didn't actually measure."], "checklista": ["Every number comes from my notes, lab reports or field measurements.", "Product names are correct and rates, REI and PHI come from the label.", "Recommendations and grower decisions are clearly separated.", "Field names match the client's field list.", "Open items have an owner and a date or [TO FILL IN].", "Lab results still pending are marked as pending."], "uwaga": "A report is part of your professional record. Keep it factual: if a decision later goes wrong, this is the document that shows what you saw, what you recommended and what the grower decided.", "przyklad": {"wejscie": "Monthly for Miller Farms, July. 1,450 acres corn and beans. Four scouting visits, the 3rd, 10th, 17th and 24th. Pulled two tissue samples in the North 80 corn. Gray leaf spot showing low in the canopy on North 80, not up to the ear leaf yet. Japanese beetles on the Home Quarter beans, defoliation maybe 10 percent, I'd say. Sandy knob on Creek field showing yellowing, probably N. Rainfall 2.1 inches total for the month from his gauge. Dave decided to hold on fungicide in corn for now. Next month R3 decision in beans and yield checks late August. Waiting on tissue results.", "wynik": "MONTHLY REPORT — MILLER FARMS — JULY 2026\n\nSummary\n• 4 scouting visits, 2 tissue samples pulled.\n• Gray leaf spot present low in the canopy on North 80; not at the ear leaf.\n• Japanese beetle feeding on Home Quarter beans, about 10% defoliation (my estimate).\n• Possible N deficiency on the sandy knob, Creek field — tissue results pending.\n\n| date | field | what I did | finding |\n| Jul 3 | all corn | scouting | GLS lower leaves, North 80 |\n| Jul 10 | North 80 | tissue sample ×2 | results pending |\n| Jul 17 | Home Quarter | scouting | beetle defoliation ~10% |\n| Jul 24 | Creek field | scouting | yellowing on sandy knob |\n\nRainfall (grower gauge): 2.1 in for July.\n\nDecisions\n• Corn fungicide: recommendation was to keep monitoring against the extension threshold [TO FILL IN: threshold source]. Dave decided to hold for now.\n\nNext month\n• R3 soybean fungicide decision — product and rate from the label [CHECK LABEL].\n• Yield estimates, late August.\n\nOpen items\n| item | owner | due |\n| Tissue results | lab, then me | [TO FILL IN] |\n| Beetle re-check, Home Quarter | me | [TO FILL IN] |\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "4.06", "nazwa": "Field Day and Plot Tour", "tag": "FIELD DAY", "co_robi": "Plans a field day or plot tour from start to finish: invitation, program by stop, talking points for each plot, logistics checklist and follow-up. Makes the day look professional and turns attendees into conversations and new clients.", "kiedy": "When you have trial strips or demo plots worth showing and want growers, landlords and prospects to see them before harvest.", "brief": [{"pole": "Goal and host", "opis": "Why and who hosts it, e.g. “show my clients and prospects our N rate and cover crop strips; hosted by Jensen Farms”."}, {"pole": "Location and date", "opis": "Where and when, e.g. “Jensen home farm, south-central Nebraska, August 20, 9 a.m.–noon”."}, {"pole": "Plots and treatments", "opis": "What's in the field, e.g. “4 N rate strips replicated 3 times, cereal rye vs. no cover, 2 hybrids”."}, {"pole": "Attendees", "opis": "Who's coming, e.g. “about 40 growers, 5 landlords, county extension educator, 2 seed reps”."}, {"pole": "Logistics and budget", "opis": "What you have, e.g. “hay rack, PA system, lunch from local café, budget $___”."}, {"pole": "Speakers and program", "opis": "Who talks, e.g. “me on N strips, extension educator on cover crops, Q&A at each stop”."}], "prompt": "You are an experienced independent agronomist and CCA who has run dozens of field days and plot tours for growers and knows that a good field day is short, practical and well organized. Help me plan a field day.\n\nINPUT:\nGoal and host: [GOAL AND HOST]\nLocation and date: [LOCATION AND DATE]\nPlots and treatments: [PLOTS AND TREATMENTS]\nAttendees: [ATTENDEES]\nLogistics and budget: [LOGISTICS AND BUDGET]\nSpeakers and program: [SPEAKERS AND PROGRAM]\n\nRULES:\n1. First check my inputs. If something important is missing, ask me up to 5–7 short questions and wait for my answers.\n2. Talking points for each plot must use only the treatments and data I give. Do not invent yields, rates or results; mark missing ones [TO FILL IN].\n3. If results are early season or from one location, say so clearly. Don't let one strip trial sound like proof.\n4. Build a realistic timeline with travel between stops, weather backup and a hard stop time.\n5. Include safety: traffic, heat, hay rack rules, recent pesticide applications and REI on any field we walk [CHECK LABEL].\n6. If I mention continuing-education credits or sponsor rules, mark them [VERIFY] — I will confirm with the program.\n7. Plan follow-up: how to capture contacts and what to send after.\n8. Never invent prices, rates, fees, product rates, dates, legal terms or regulation numbers. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n\nOUTPUT FORMAT:\nA) Invitation (email and short text version).\nB) Program: | time | stop | topic | speaker |.\nC) Talking points per plot (3–5 bullets each) and likely questions.\nD) Logistics checklist, budget lines with my numbers or [TO FILL IN], and the follow-up plan.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Write a press release for the local ag paper and radio.", "Make a one-page handout with plot maps and treatments.", "Write a sign-in sheet layout with contact consent.", "Add a rain-day backup plan for the shop.", "Write the thank-you email with a link to the results.", "Create a list of questions to ask attendees at each stop.", "Shorten the program to two hours.", "Write a thank-you note to the host farm.", "Draft a sponsor request letter to a seed company.", "Check the talking points for any claim the plots can't support."], "checklista": ["Host has approved date, parking and which fields we walk.", "Plot data shown is real and marked as preliminary where needed.", "No field we walk is under an active REI [CHECK LABEL].", "Shade, water, restrooms and first aid are arranged.", "Sign-in sheet collects contacts with permission to follow up.", "Budget lines are filled in with real quotes.", "Follow-up email is drafted bef
