ore the day."], "uwaga": "Check pesticide application records and REIs for every field and strip people will walk into. Sponsor and continuing-education rules vary — confirm them with the program before you advertise credits.", "przyklad": {"wejscie": "Field day at Jensen Farms, south-central Nebraska, August 20, nine to noon. Dave Jensen's hosting. We've got four N rate strips replicated three times, cereal rye cover versus no cover on the same field, and two hybrids side by side. Expecting around 40 growers, a few landlords, the county extension educator, couple seed reps. I'll talk N strips, extension educator does the cover crop stop. Hay rack, PA, lunch from the café in town, budget I'll fill in. Want invitations, a program and talking points.", "wynik": "A) INVITATION — TEXT\nField day Aug 20, 9–noon, Jensen Farms. N rate strips, cereal rye vs. no cover, hybrid side-by-side. Lunch provided. Reply YES to save a seat. — [TO FILL IN: name]\n\nB) PROGRAM\n| time | stop | topic | speaker |\n| 9:00 | shop | welcome, safety, plot map | me |\n| 9:20 | Stop 1 | N rate strips (4 rates × 3 reps) | me |\n| 10:10 | Stop 2 | cereal rye vs. no cover | county extension educator |\n| 10:50 | Stop 3 | hybrid side-by-side | me, Q&A |\n| 11:30 | shop | lunch, questions | all |\n| 12:00 | end | | |\n\nC) TALKING POINTS — STOP 1, N STRIPS\n• Four rates, replicated three times: [TO FILL IN: rates and source].\n• What you see today: color and stand differences only — no yield yet.\n• How we'll read it: yield by strip at harvest, compared with state N rate guidance [VERIFY].\n• One farm, one year: a data point, not a recommendation.\n• Likely question: “What rate should I use?” Answer: depends on your soil, previous crop and price ratio — let's look at your fields.\n\nD) LOGISTICS\n• Check spray records and REI on all three fields [CHECK LABEL].\n• Hay rack, PA, water, shade, first aid.\n• Lunch for ~50: [TO FILL IN] $.\n• Sign-in with permission to follow up.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "4.07", "nazwa": "Tough Conversation: Complaint, Failed Application, Late Payment", "tag": "TOUGH CONVERSATION", "co_robi": "Prepares you for a hard conversation with a grower — a complaint, an application that didn't work, a late invoice. It separates facts from opinions, scripts the opening, anticipates objections and writes the follow-up in writing, without admitting fault you don't have or blaming the grower.", "kiedy": "When you'd rather avoid the call but know it has to happen this week — waterhemp escapes after your recommendation, a grower who stopped answering about the invoice, or a dispute about what was agreed.", "brief": [{"pole": "Situation type", "opis": "What happened, e.g. “complaint about a herbicide application that didn't control waterhemp” or “invoice 60 days late”."}, {"pole": "Facts and dates", "opis": "What you know, e.g. “recommended pre-emerge May 2, applied by custom applicator May 16 after 2 in. of rain, escapes found June 10”."}, {"pole": "Client position", "opis": "What the grower says, e.g. “thinks my recommendation was wrong and doesn't want to pay the August invoice”."}, {"pole": "My position", "opis": "Your view, e.g. “recommendation was on label; timing slipped two weeks; I want to keep the client”."}, {"pole": "Relationship and stakes", "opis": "What's at risk, e.g. “third-year client, 1,800 ac, refers neighbors, invoice $___ outstanding”."}, {"pole": "Goal of the conversation", "opis": "What a good outcome is, e.g. “agree on facts, a plan for the escapes and a payment date”."}], "prompt": "You are an experienced independent agronomist and CCA who has handled many difficult conversations with growers and knows how to keep the relationship while protecting yourself professionally. Help me prepare for a tough conversation.\n\nINPUT:\nSituation type: [SITUATION TYPE]\nFacts and dates: [FACTS AND DATES]\nClient position: [CLIENT POSITION]\nMy position: [MY POSITION]\nRelationship and stakes: [RELATIONSHIP AND STAKES]\nGoal of the conversation: [GOAL OF THE CONVERSATION]\n\nRULES:\n1. First check my inputs. If something important is missing, ask me up to 5–7 short questions and wait for my answers.\n2. Separate facts (dates, records, label, weather) from interpretations and feelings. Mark any fact I haven't confirmed [VERIFY].\n3. Do not admit legal fault or make promises about compensation. If the situation could involve an insurance claim or legal dispute, tell me to contact my professional liability insurer before the conversation.\n4. Do not judge whether the application failed because of product, rate, timing, weather or resistance without evidence. List the possible causes and what evidence would confirm each.\n5. Keep the tone calm, respectful and direct. No blaming the grower, no defensive language.\n6. For late payment, use only the amounts, dates and terms from my agreement. Do not invent late fees or interest.\n7. Plan the follow-up in writing so the agreement is documented.\n8. Never invent prices, rates, fees, product rates, dates, legal terms or regulation numbers. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n\nOUTPUT FORMAT:\nA) One-paragraph summary: facts vs. disputed points.\nB) Conversation plan: opening (word for word), 3–5 key points, likely objections with answers, the ask, what I won't agree to.\nC) Follow-up email summarizing what was agreed.\nD) Documents to gather before the call and open questions.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Write a shorter version for a phone call instead of a meeting.", "Give me three ways the grower might react and how to answer each.", "Write a payment-plan offer using my invoice amount.", "Rewrite the opening to sound less formal.", "List the records I should pull before the conversation.", "Write a text asking for a meeting without sounding alarming.", "Write the follow-up if the grower refuses to talk.", "Prepare questions to find out what really happened during application.", "Write a note to my insurer describing the situation factually.", "Check my script for any sentence that admits fault I don't have."], "checklista": ["I have the records: recommendation, application record, weather, label, invoice.", "Facts and opinions are clearly separated.", "Nothing in the script admits legal fault or promises compensation.", "My insurer has been contacted if there could be a claim.", "I know what I'm willing to offer and what I won't agree to.", "The follow-up email is ready to send the same day."], "uwaga": "If a complaint might turn into a claim for crop loss, contact your professional liability insurer before you discuss fault or compensation, and keep all communication factual and in writing.", "przyklad": {"wejscie": "Rough one. Tom Brandt, 1,800 acres, third year with me, sends me neighbors. I recommended a pre-emerge for waterhemp on his beans May 2. His custom guy didn't get it on till May 16, after we got two inches of rain. June 10 we found escapes all over the Creek field. Now Tom says my recommendation was garbage and he's not paying the August invoice. I think the product was on label, timing slipped two weeks, could be resistance too. I want to keep him. Goal is to agree on what happened, make a plan for the escapes and get a payment date.", "wynik": "A) SUMMARY\nFacts: recommendation dated May 2; application May 16 by custom applicator [VERIFY: application record]; about 2 in. of rain between them [VERIFY: weather source]; waterhemp escapes found June 10, Creek field.\nDisputed: why control failed — timing, rainfall, rate, or resistance. No evidence yet points to one cause.\n\nB) CONVERSATION PLAN\nOpening: “Tom, I've been thinking about the Creek field a lot. I want to look at what happened with you, figure out the next step for those escapes, and get us squared away. Can we go through the timeline together?”\nKey points:\n1. Walk the timeline from records, not memory.\n2. Possible causes: application timing, rainfall before activation, rate applied [CHECK LABEL], herbicide resistance. Suggest a resistance test [VERIFY: extension lab].\n3. Plan for current escapes: options from the label for this stage [CHECK LABEL] — Tom decides.\n4. Invoice: the agreement says [TO FILL IN: payment terms]; propose a date.\nLikely objection: “Your product didn't work.” Answer: “It might not have — that's why I want to test. Here's what the records show so far.”\nWon't agree to: accepting fault before the facts are in.\n\nC) FOLLOW-UP EMAIL\nTom, thanks for meeting. We agreed: [TO FILL IN]. Next steps: [TO FILL IN]. Invoice of [TO FILL IN] $ to be paid by [TO FILL IN].\n\nD) Before the call: contact your liability insurer [VERIFY].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "4.08", "nazwa": "Grower Meeting and Training Presentation", "tag": "GROWER TRAINING", "co_robi": "Builds a grower meeting or training presentation: slide outline, speaker notes, stories from the field, Q&A prep and a soft call to action. Keeps it practical, based on your sources, and short enough that growers stay awake after lunch.", "kiedy": "When the co-op, county extension, a seed company or a grower group asks you to speak at a winter meeting, and you want a talk that also brings you new clients.", "brief": [{"pole": "Topic", "opis": "What it's about, e.g. “managing herbicide-resistant waterhemp in soybeans”."}, {"pole": "Audience", "opis": "Who's in the room, e.g. “60 growers at the co-op winter meeting, mixed ages, some skeptical”."}, {"pole": "Time and format", "opis": "How long and how, e.g. “40 minutes plus 15 minutes Q&A, projector, no handouts”."}, {"pole": "Key message", "opis": "The one takeaway, e.g. “layer residuals and rotate sites of action — one pass won't do it anymore”."}, {"pole": "Source materials", "opis": "What you base it on, e.g. “state extension weed control guide, my own field photos, local resistance test results”."}, {"pole": "Business goal", "opis": "What you want after, e.g. “book 5 winter planning meetings with new growers”."}], "prompt": "You are an experienced independent agronomist and CCA who gives practical winter-meeting talks to growers and knows that farmers remember stories and photos, not slides full of text. Help me build a grower presentation.\n\nINPUT:\nTopic: [TOPIC]\nAudience: [AUDIENCE]\nTime and format: [TIME AND FORMAT]\nKey message: [KEY MESSAGE]\nSource materials: [SOURCE MATERIALS]\nBusiness goal: [BUSINESS GOAL]\n\nRULES:\n1. First check my inputs. If something important is missing, ask me up to 5–7 short questions and wait for my answers.\n2. Base every technical point on my source materials. Do not add rates, thresholds, efficacy ratings or research numbers I didn't provide; mark them [TO FILL IN] or [VERIFY] with the source to check.\n3. Any product mention must refer to the label: rates, timing, restrictions [CHECK LABEL]. No brand comparisons unless I provide the data.\n4. Max 12 slides. Each slide: a short title, one idea, a photo or chart suggestion, 3 bullets max.\n5. Speaker notes in my voice, with one field story per section.\n6. Keep the business goal soft: offer value first, mention my service once at the end.\n7. If I ask about continuing-education credits for the session, mark [VERIFY] — the program sponsor confirms them.\n8. Never invent prices, rates, fees, product rates, dates, legal terms or regulation numbers. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n\nOUTPUT FORMAT:\nA) Title and three alternatives.\nB) Slide outline: | slide | title | content | visual |.\nC) Speaker notes per slide.\nD) Ten likely questions with short answers, the closing call to action and a one-page handout.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Cut the presentation to 20 minutes.", "Add a hands-on part where growers look at weed seedlings.", "Write the event description for the co-op newsletter.", "Make a 6-question quiz for the end of the session.", "Add a slide on how to read a herbicide label.", "Write a version for landlords instead of operators.", "Prepare answers to the toughest skeptical questions.", "Write the follow-up email for attendees with a meeting link.", "Turn the talk into a 5-post social media series.", "Check the slides for any number that has no source."], "checklista": ["Every number has a source from my materials.", "Product information points to the label.", "Slides are readable from the back of the room.", "Photos are mine or I have permission to use them.", "The call to action is short and appears once.", "Credits or sponsor rules are confirmed with the organizer [VERIFY]."], "uwaga": "When a talk is sponsored by a company, say so up front and keep product claims to what the label and independent data support. Your credibility is the business.", "przyklad": {"wejscie": "Co-op asked me to do the winter meeting, waterhemp in beans. About 60 guys, all ages, some pretty skeptical of anything new. Forty minutes and fifteen for questions, projector, no handouts. Main thing I want them to leave with: layer residuals and rotate sites of action, one pass isn't cutting it anymore. I'll use the state extension weed guide, my own photos from last summer and the resistance test results from three fields around here. Goal is to book maybe five winter planning meetings with new guys.", "wynik": "A) TITLE\n“Waterhemp Won't Wait: Layering Residuals in Soybeans”\nAlternatives: “One Pass Isn't Enough Anymore” · “What Last Summer's Escapes Taught Us” · “Sites of Action, Explained in a Bean Field”\n\nB) SLIDE OUTLINE\n| slide | title | content | visual |\n| 1 | The field in August | escapes after a one-pass program | my photo, July |\n| 2 | Why it got through | resistance, timing, rain | simple diagram |\n| 3 | What our local tests found | results from 3 area fields [TO FILL IN: results] | map |\n| 4 | Sites of action in plain words | group numbers on the label | label close-up |\n| 5 | Layering residuals | pre + overlapping residual | timeline |\n| 6 | Timing matters | activation, application window [CHECK LABEL] | calendar |\n| 7 | Programs, not products | sample program structure from the extension guide [VERIFY] | table |\n| 8 | What it costs vs. what it saves | your numbers [TO FILL IN] | bar chart |\n| 9 | Q&A | | |\n\nC) SPEAKER NOTE — SLIDE 1\n“This is a field four miles from here, last August. The grower did what worked for ten years. It stopped working…”\n\nD) CALL TO ACTION\n“If you want to go through your fields one by one this winter, I've got a sign-up sheet at the back. 45 minutes, kitchen table.”\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "4.09", "nazwa": "Setting Your Advisory Rate", "tag": "ADVISORY RATE", "co_robi": "Works out the per-acre fee, retainer or hourly rate you need from your own costs, hours and income goal. Shows the math step by step and compares it with the market numbers you provide — it never invents a market rate.", "kiedy": "Before you send proposals for the next season, or when you suspect you've been undercharging for years and want to see the numbers.", "brief": [{"pole": "Fixed costs", "opis": "Your yearly overhead, e.g. “insurance $___, software $___, phone $___, accountant $___, CCA dues and CEUs $___”."}, {"pole": "Vehicle and travel", "opis": "Truck and miles, e.g. “about 30,000 business miles a year, truck payment $___, fuel $___”."}, {"pole": "Working time", "opis": "How much you can sell, e.g. “about 1,600 billable hours, 70% in season”."}, {"pole": "Service to price", "opis": "What you're pricing, e.g. “Full Service package per acre on 1,000–3,000 ac farms”."}, {"pole": "Income goal", "opis": "What you need to earn, e.g. “$___ take-home before taxes plus $___ for retirement”."}, {"pole": "Market and competition", "opis": "What others charge, e.g. “independent consultants nearby charge $___–$___ per acre, co-op agronomy is bundled with inputs”."}], "prompt": "You are an experienced independent agronomist and CCA who has built a profitable consulting practice and helps other advisors price their work honestly. Help me calculate my advisory rate.\n\nINPUT:\nFixed costs: [FIXED COSTS]\nVehicle and travel: [VEHICLE AND TRAVEL]\nWorking time: [WORKING TIME]\nService to price: [SERVICE TO PRICE]\nIncome goal: [INCOME GOAL]\nMarket and competition: [MARKET AND COMPETITION]\n\nRULES:\n1. First check my inputs. If something important is missing, ask me up to 5–7 short questions and wait for my answers.\n2. Use only my numbers. Do not suggest market rates, mileage rates or salary benchmarks from memory; if a number is missing, write [TO FILL IN] and continue with the structure.\n3. Show every calculation step by step: total yearly costs, required revenue, cost per billable hour, then per acre and per visit.\n4. Convert to per-acre fees using the acres and visit frequency I give. Mark any assumption about hours per acre or visits per season as [ASSUMPTION].\n5. Build three scenarios: break-even, my goal, and goal plus a cushion for a bad year (cushion size from me or [TO FILL IN]).\n6. If I provide competitor prices, compare them; if not, say what data I need and where to get it (state consultant associations, peers) [VERIFY].\n7. Taxes and self-employment costs: tell me to confirm with my accountant or tax preparer; do not calculate tax rates yourself.\n8. Never invent prices, rates, fees, product rates, dates, legal terms or regulation numbers. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n\nOUTPUT FORMAT:\nA) Cost table: | cost | per year |.\nB) Step-by-step calculation to hourly, per-acre and per-visit rates.\nC) Three scenarios: | scenario | revenue needed | per acre | per hour |.\nD) Short pricing recommendation, what to check, and questions for my accountant.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Recalculate if I add 500 acres of new clients.", "Show what happens if I lose my biggest client.", "Compare per-acre pricing against a flat yearly retainer.", "Calculate a price for a one-time field visit using my hourly rate.", "Add a minimum fee for small farms.", "Build a price increase letter for existing clients.", "Calculate how many acres I need to hit my income goal.", "Show my rate if I hire a seasonal scout.", "Write the explanation of my fee in two sentences for growers.", "List the costs I might be forgetting."], "checklista": ["All costs come from my real records, not estimates I can't defend.", "Billable hours are realistic, not every hour I'm awake.", "The math is shown step by step and adds up.", "Assumptions are marked and I agree with them.", "Tax and self-employment questions are on the list for my accountant.", "The final rate makes sense next to what growers are used to paying in my area [VERIFY]."], "uwaga": "This is business math, not tax advice. Self-employment taxes, retirement contributions and deductible expenses depend on your situation — confirm them with your accountant or tax preparer.", "przyklad": {"wejscie": "I want to figure out what I should charge per acre. My fixed stuff: insurance 4,200, software and subscriptions 2,400, phone 1,500, accountant 1,800, CCA dues and CEU stuff 900. Truck: about 30,000 business miles, truck payment is 9,600 a year, fuel around 7,500. I figure 1,600 billable hours. Want 85,000 before taxes and another 10,000 for retirement. My Full Service runs about one hour per 100 acres per visit, 16 visits a season. Don't know what the other guys charge exactly.", "wynik": "A) COSTS\n| cost | per year |\n| insurance | $4,200 |\n| software | $2,400 |\n| phone | $1,500 |\n| accountant | $1,800 |\n| CCA dues, CEUs | $900 |\n| truck payment | $9,600 |\n| fuel | $7,500 |\n| maintenance, tires | [TO FILL IN] |\n| Total known | $27,900 |\n\nB) CALCULATION\n1. Revenue needed = costs + income + retirement = $27,900 + $85,000 + $10,000 = $122,900.\n2. Per billable hour = $122,900 ÷ 1,600 h = $76.81/h.\n3. Hours per acre per season = (1 h ÷ 100 ac) × 16 visits = 0.16 h/ac [ASSUMPTION: includes driving and reports].\n4. Per acre = 0.16 h × $76.81 = $12.29/ac per year.\n5. Acres you can serve = 1,600 h ÷ 0.16 h/ac = 10,000 ac [ASSUMPTION: all hours go to Full Service].\n\nC) SCENARIOS\n| scenario | revenue needed | per acre | per hour |\n| break-even (costs only) | $27,900 | $2.79 | $17.44 |\n| goal | $122,900 | $12.29 | $76.81 |\n| goal + cushion | [TO FILL IN] | [TO FILL IN] | [TO FILL IN] |\n\nD) NEXT STEPS\n• Get local consultant prices from peers or your state association [VERIFY].\n• Ask your accountant: self-employment tax, health insurance, retirement account options.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "4.10", "nazwa": "Proposal Follow-Up and Growing Your Client Base", "tag": "FOLLOW-UP AND GROWTH", "co_robi": "Writes the follow-up sequence for a proposal that went quiet, gives you honest answers to common objections — including “the co-op agronomist does it for free” — and builds a simple plan to grow and balance your client base.", "kiedy": "When a proposal has sat unanswered for a week or two, or in winter when you plan how many acres and clients you want next season.", "brief": [{"pole": "My role and offer", "opis": "Who you are and what you sell, e.g. “independent CCA, per-acre advisory, no input sales, central Illinois”."}, {"pole": "Proposal sent", "opis": "What went out, e.g. “Full Service proposal sent Feb 3 to Jensen Farms, 1,900 ac, no reply yet”."}, {"pole": "Client and history", "opis": "What you know, e.g. “met at the winter meeting, buys inputs from the co-op, son coming back to the farm”."}, {"pole": "Client base", "opis": "Your current book, e.g. “22 clients, about 31,000 ac, 3 big ones are 40% of revenue”."}, {"pole": "Growth goals", "opis": "Where you want to be, e.g. “add 6,000 ac and 4 clients by planting”."}, {"pole": "Obstacles", "opis": "What stands in the way, e.g. “the co-op agronomist does it for free, growers don't like paying for advice”."}], "prompt": "You are an experienced independent agronomist and CCA who grew a consulting practice from zero by follow-up, referrals and trust, never by pressure. Help me follow up a proposal and plan how to grow my client base.\n\nINPUT:\nMy role and offer: [MY ROLE AND OFFER]\nProposal sent: [PROPOSAL SENT]\nClient and history: [CLIENT AND HISTORY]\nClient base: [CLIENT BASE]\nGrowth goals: [GROWTH GOALS]\nObstacles: [OBSTACLES]\n\nRULES:\n1. First check my inputs. If something important is missing, ask me up to 5–7 short questions and wait for my answers.\n2. Follow-ups must be short, polite and useful: each one gives the grower something (an observation, a reminder, a question), not just “checking in”.\n3. Handle the objection “the co-op agronomist does it for free” honestly: respect the retail agronomist, explain the difference in role (independent advice, no input sales, time on the farm) without bashing anyone and without claiming savings I can't prove.\n4. Do not invent conversion rates, savings or market data. Use my numbers for acres, clients and revenue; mark missing ones [TO FILL IN].\n5. Show client concentration risk with my numbers step by step (share of acres or revenue from the top clients).\n6. Growth actions must be concrete and fit one person's calendar: referrals, landlord outreach, field days, extension and co-op meetings.\n7. No pressure tactics, fake deadlines or discounts I didn't approve.\n8. Never invent prices, rates, fees, product rates, dates, legal terms or regulation numbers. Mark missing data [TO FILL IN], assumptions [ASSUMPTION] and anything uncertain [VERIFY].\n\nOUTPUT FORMAT:\nA) Follow-up sequence: 3 messages with timing (text, email, phone script).\nB) Objections and answers: | objection | answer in my words |.\nC) Client base analysis with my numbers, step by step.\nD) 90-day growth plan: | week | action | goal | and the gaps to fill.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Write a final follow-up that closes the loop politely.", "Write a referral request for my three best clients.", "Write a letter to landowners who cash-rent ground to my clients' neighbors.", "Answer the objection “I can't afford another per-acre cost this year.”", "Answer the objection “my seed dealer already walks my fields.”", "Build a simple tracker for prospects and follow-up dates.", "Write a short case story about one client, without names.", "Calculate how many new acres I need to replace my biggest client.", "Write a LinkedIn or Facebook post about what an independent agronomist does.", "Check my follow-ups for anything pushy."], "checklista": ["Each follow-up adds value and is spaced at least a week apart.", "Answers to objections are respectful to retail and co-op agronomists.", "No savings or yield claims without my own data.", "Client concentration math uses my real numbers.", "The growth plan fits my in-season workload.", "Prospects agreed to be contacted [VERIFY]."], "uwaga": "Retail and co-op agronomists are often your growers' neighbors and sometimes your referral source. Compete on the value of independent advice, never by running anyone down.", "przyklad": {"wejscie": "Sent Jensen Farms a Full Service proposal Feb 3, 1,900 acres, heard nothing. Met Pete at the winter meeting, he buys everything from the co-op, his son is coming back to farm this year and seemed more into it. I'm independent, per-acre, no input sales, central Illinois. I've got 22 clients, about 31,000 acres, and my top three are about 12,500 acres. Want to add 6,000 acres and four clients before planting. Biggest pushback I hear: the co-op agronomist does it for free.", "wynik": "A) FOLLOW-UP SEQUENCE\n1. Day 10 — text to Pete: “Pete, saw a lot of standing water on the south side of the county this week. If you want to talk drainage and planting order before spring, I've got time Thursday. — [TO FILL IN: name]”\n2. Day 17 — email to Pete and his son: short note on what the first 30 days would look like for them, link to the proposal.\n3. Day 24 — phone call: “Did the proposal answer your questions, or is there something I should change?”\n\nB) OBJECTIONS\n| objection | answer |\n| “The co-op agronomist does it for free.” | “Your co-op agronomist can be a real asset. The difference is the role: I don't sell inputs, so my only job is your field decisions. The cost is in the proposal, and you can judge if it's worth it.” |\n\nC) CLIENT BASE\nTop 3 share = 12,500 ac ÷ 31,000 ac = 40.3% of acres.\nAfter adding 6,000 ac: 12,500 ÷ 37,000 = 33.8%.\nRevenue share: [TO FILL IN: revenue by client].\n\nD) 90-DAY PLAN\n| week | action | goal |\n| 1–2 | referral asks to top clients | 3 introductions |\n| 3–6 | 2 kitchen-table meetings a week | [TO FILL IN] |\n| 7–10 | landlord letters | 2 new contacts |\n| 11–12 | follow-ups, close before planting | 4 clients, 6,000 ac |\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}]}, {"dzial_nr": 5, "dzial": "Programs, Compliance & Paperwork", "opis": "Paperwork eats half an advisor's season: FSA acreage reports, NRCS contracts, grant and loan packages, crop loss claims, records requests and deadlines. This department builds those documents from your data and the program rules you paste — without guessing payments or dates — and flags every gap to verify before anyone signs.", "skills": [{"id": "5.01", "nazwa": "FSA Acreage Reporting & Program Checklist", "tag": "ACREAGE REPORT", "co_robi": "Turns the grower's field list and the FSA rules you paste into a clean acreage reporting checklist: fields, crops, planting dates, intended use, program elections and supporting documents. It never quotes payment amounts or deadlines — only order, completeness and items to confirm with the county office.", "kiedy": "Before the grower's appointment at the FSA county office to certify acres (FSA-578), or when you're cleaning up a client's ARC/PLC and acreage paperwork after a messy planting season.", "brief": [{"pole": "Farm operation", "opis": "Who, where, how many acres, e.g. “Dave Jensen, Story County, IA — about 1,240 ac, 3 FSA farm numbers, 410 ac cash-rented”."}, {"pole": "Fields and crops", "opis": "Fields with planted crop and acres, e.g. “North 80 – corn 78 ac, Home quarter – soybeans 152 ac, Creek field – corn 96 ac”."}, {"pole": "Planting dates", "opis": "Planting dates and any prevented-planted or failed acres, e.g. “corn planted May 2–9, soybeans May 14–20, 12 ac prevented planted on Creek field”."}, {"pole": "Programs elected", "opis": "What the grower is enrolled in or plans to sign up for, e.g. “ARC-CO on corn and soybeans, CSP contract, crop insurance through local agent”."}, {"pole": "Program rules", "opis": "Paste the current FSA fact sheets or notices you have — the AI works only from that text, e.g. “FSA acreage reporting fact sheet, current year (pasted below)”."}, {"pole": "Changes from last year", "opis": "New ground, lost leases, reconstitutions, entity changes, e.g. “picked up 160 ac from the Hoffman Brothers, dropped the 40 by the highway”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who helps farm clients with USDA program paperwork, lenders and compliance every season. Build an acreage reporting and FSA program checklist for this operation.\n\nINPUT:\n- Farm operation: [FARM OPERATION]\n- Fields and crops: [FIELDS AND CROPS]\n- Planting dates: [PLANTING DATES]\n- Programs elected: [PROGRAMS ELECTED]\n- Current program rules (pasted): [PROGRAM RULES]\n- Changes from last year: [CHANGES FROM LAST YEAR]\n\nRULES:\n1. If important data is missing, ask me up to 5–7 short questions first and wait for my answers before you write the document.\n2. Do not invent payment rates, dollar amounts, program deadlines, form numbers, eligibility rules or regulation citations. Work only from the program rules and documents I paste; anything not covered there, mark [VERIFY].\n3. Mark missing data [TO FILL IN] and anything you assume [ASSUMPTION]. If you calculate anything (acres, totals, percentages), show the math step by step.\n4. Never state reporting deadlines, final planting dates or ARC/PLC payment figures. Every date or program condition not in my pasted text gets [VERIFY WITH YOUR FSA OFFICE].\n5. Flag every field where acres, crop, intended use or planting date could create a mismatch between FSA, crop insurance and the grower's own maps.\n\nOUTPUT FORMAT:\nA) Field table: | farm/tract/field | crop | acres | planting date | intended use | notes |.\nB) Acre reconciliation: total by crop and by FSA farm number, with the arithmetic shown.\nC) Step-by-step checklist for the county office visit, in the order it usually happens.\nD) Documents and maps to bring (leases, landlord info, prevented-planting records, insurance info).\nE) Risks and mismatches to resolve, plus questions for the grower before signing.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Add a column with FSA farm and tract numbers I'll give you.", "Check that the acres by crop add up to the total cropland on each farm number.", "List separately every decision the grower has to make himself.", "Write a short note telling the grower what to bring to the FSA appointment.", "Make a one-page printable version of the checklist.", "Compare this year's report with last year's acreage report I'll paste.", "List every item I need to confirm with the county office before the visit.", "Add a section reconciling FSA acres with crop insurance acres.", "Draft a list of what to report if the grower replants or switches crops.", "Write a text message to the grower about the missing documents."], "checklista": ["Acres by field match the grower's maps, leases and FSA aerial imagery.", "Every program condition and date is confirmed with the current FSA rules or county office.", "No payment amounts or rates appear that didn't come from an official source.", "New leases, dropped ground and landlord information are up to date.", "Prevented-planted and failed acres are documented and flagged for the agent.", "All [VERIFY] markers were checked before the appointment.", "The grower has read the report and signs it himself."], "uwaga": "FSA reporting dates, program rules and ARC/PLC parameters change and vary by county and crop. The AI doesn't know current deadlines or payments — it works only from what you paste. Confirm everything with your FSA county office. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Doing acreage for Dave Jensen out of Story County, about 1,240 acres across three FSA farm numbers, 410 of it cash-rented. Corn on the North 80, that's 78 acres, Creek field corn 96, Home quarter beans 152, rest I'll send later. Corn went in May 2 through 9, beans the 14th to the 20th. About 12 acres on the Creek field never got planted, too wet, he called his agent already. He's ARC-CO on corn and beans and has a CSP contract. New this year he picked up 160 acres from the Hoffman Brothers and dropped the 40 by the highway. I don't have this year's FSA fact sheet in front of me, just build me the skeleton and tell me what's missing.", "wynik": "A) Field table\n| farm/tract/field | crop | acres | planting date | intended use | notes |\n| [TO FILL IN] / North 80 | corn | 78 | May 2–9 | grain [ASSUMPTION] | — |\n| [TO FILL IN] / Creek field | corn | 96 | May 2–9 | grain [ASSUMPTION] | 12 ac prevented planted — included in the 96 or extra? [VERIFY] |\n| [TO FILL IN] / Home quarter | soybeans | 152 | May 14–20 | grain [ASSUMPTION] | — |\n| Hoffman ground | [TO FILL IN] | 160 | [TO FILL IN] | [TO FILL IN] | new lease — farm/tract numbers needed |\n\nB) Reconciliation so far\n78 + 96 + 152 + 160 = 486 ac listed of about 1,240 ac → 754 ac still [TO FILL IN].\n\nC) Office visit steps\n1. Update operating plan: add the Hoffman 160, remove the highway 40 [VERIFY WITH YOUR FSA OFFICE whether a reconstitution is needed].\n2. Certify planted acres by crop and field.\n3. Report the 12 ac prevented planted — timing and documentation per current FSA and insurance rules [VERIFY].\n4. Confirm ARC-CO election on file for this crop year [VERIFY].\n\nD) Documents to bring\n- Hoffman lease and landlord contact [TO FILL IN].\n- Agent's notice for the prevented-planted acres.\n- CSP contract number [TO FILL IN].\n\nE) Questions for Dave\n1. Are the 12 PP acres part of the 96 or on top of them?\n2. Any cover crops or double-crop planned?\n\nPaste the current FSA acreage reporting fact sheet and I'll add the program conditions.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "5.02", "nazwa": "NRCS Conservation Practices (EQIP/CSP) — Selection & Documentation", "tag": "NRCS PRACTICES", "co_robi": "Matches NRCS conservation practices (like 340 Cover Crop, 590 Nutrient Management, 595 Integrated Pest Management, 328 Conservation Crop Rotation) to the grower's fields, equipment and goals, and lists the records each practice will need. It never estimates payments — it helps you choose realistic practices and keep the paperwork clean.", "kiedy": "When a grower asks “should I sign up for EQIP or CSP?” and you want to walk into the NRCS field office with a realistic practice list and a record-keeping plan.", "brief": [{"pole": "Farm and crops", "opis": "Operation, rotation and acres, e.g. “Miller Farms, McLean County, IL — 1,800 ac corn-soybean, 300 ac strip-till”."}, {"pole": "Soils and resource concerns", "opis": "Soil types, slopes, erosion, water quality issues, e.g. “Drummer and Flanagan silty clay loams, some 2–5 % slopes along the creek, tile outlets to a county ditch”."}, {"pole": "Equipment and labor", "opis": "What the grower can realistically run, e.g. “12-row strip-till bar, no drill of his own, custom seeder available for cover crops”."}, {"pole": "Program rules", "opis": "Paste the NRCS ranking info, practice standards or job sheets you have — the AI uses only that, e.g. “state EQIP ranking question summary and 340 job sheet (pasted below)”."}, {"pole": "Grower goals", "opis": "What the grower actually wants, e.g. “cut erosion on the creek fields, try cereal rye ahead of beans, don't hurt yields”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who helps farm clients with USDA program paperwork, lenders and compliance every season. Help me select NRCS conservation practices for EQIP or CSP and plan the documentation for each one.\n\nINPUT:\n- Farm and crops: [FARM AND CROPS]\n- Soils and resource concerns: [SOILS AND RESOURCE CONCERNS]\n- Equipment and labor: [EQUIPMENT AND LABOR]\n- Program rules and practice standards (pasted): [PROGRAM RULES]\n- Grower goals: [GROWER GOALS]\n\nRULES:\n1. If important data is missing, ask me up to 5–7 short questions first and wait for my answers before you write the document.\n2. Do not invent payment rates, dollar amounts, program deadlines, form numbers, eligibility rules or regulation citations. Work only from the program rules and documents I paste; anything not covered there, mark [VERIFY].\n3. Mark missing data [TO FILL IN] and anything you assume [ASSUMPTION]. If you calculate anything (acres, totals, percentages), show the math step by step.\n4. Never give payment rates, payment caps, ranking scores or sign-up dates. Practice codes are fine to name; any requirement not in my pasted standards gets [VERIFY WITH NRCS].\n5. Be honest about fit: if a practice doesn't match the grower's equipment, labor or rotation, say so and explain why.\n6. Do not recommend seeding rates, termination timing or herbicide programs unless they come from the pasted job sheet or the product label — otherwise [CHECK LABEL] or [VERIFY].\n\nOUTPUT FORMAT:\nA) Resource concerns by field, in plain language.\nB) Practice shortlist table: | practice (code) | fields | why it fits | risk or workload | fit: good, possible, poor |.\nC) For each practice: records to keep through the season (dates, receipts, maps, photos, soil tests).\nD) Questions to ask at the NRCS field office.\nE) A short plain-English summary for the grower.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Rank the practices from easiest to hardest for this grower to carry out.", "Build a season-long record sheet for the 340 cover crop practice.", "Explain the difference between EQIP and CSP for this grower in five sentences.", "List what the 590 nutrient management practice will require from my soil sampling.", "Write the questions I should ask the district conservationist.", "Add a column showing which fields each practice applies to and the acres.", "Flag every requirement that still needs confirming with NRCS.", "Make a photo-documentation plan for cover crop seeding and termination.", "Draft a one-page summary the grower can share with his landlord.", "List the risks if the grower can't complete a practice as contracted."], "checklista": ["Every practice and its requirements were checked against the current NRCS standard or job sheet.", "No payment rates, ranking points or deadlines appear without an official source.", "The grower has the equipment, labor and timing to actually carry out each practice.", "Landlord consent is addressed for rented fields.", "Record-keeping responsibilities are clear (who records what, and when).", "All [VERIFY] markers were cleared with the NRCS field office."], "uwaga": "Practice standards, ranking criteria and payment schedules vary by state and change each year. The AI never knows current payment rates — confirm everything with your local NRCS field office before the grower signs a contract. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Miller Farms, McLean County, about 1,800 acres corn-beans, 300 of it strip-till. Mostly Drummer and Flanagan, but the creek fields have some 2 to 5 percent slopes and he's losing soil every spring, tile outlets go to a county ditch. He's got a 12-row strip-till bar, no drill of his own, but there's a guy who flies or drills on cover crops custom. He wants to cut erosion on the creek fields and try cereal rye ahead of beans, but he's scared of yield drag. Talking about EQIP or maybe CSP. I don't have the ranking sheet yet, so give me a shortlist and what records he'll need.", "wynik": "A) Resource concerns\n- Creek fields: sheet and rill erosion on 2–5 % slopes [VERIFY acres and slope with soil survey].\n- Tile outlets to county ditch: nutrient loss / water quality.\n\nB) Practice shortlist\n| practice (code) | fields | why it fits | risk or workload | fit |\n| Cover Crop (340) | creek fields first | protects soil in spring, rye ahead of beans | custom seeding timing, termination | good |\n| Nutrient Management (590) | all | tile drainage, documents what he already does | soil sampling + plan by a qualified planner [VERIFY] | good |\n| Residue and Tillage Management (329/345) | strip-till acres | he's already strip-tilling | which code applies [VERIFY WITH NRCS] | possible |\n| Conservation Crop Rotation (328) | all | corn-soy may or may not qualify | [VERIFY] | possible |\n| Integrated Pest Management (595) | all | scouting records exist? [TO FILL IN] | record discipline | possible |\n\nC) Records for 340\n- Seeding date, method, species and seeding rate per job sheet [VERIFY].\n- Custom seeding invoice, field map, photos at establishment and before termination.\n- Termination date and method; herbicide per label [CHECK LABEL].\n\nD) Questions for NRCS\n1. Which practices rank in this year's county pool?\n2. Can rye ahead of beans be started on part of the creek fields only?\n\nE) For the grower\nStart small: rye on the creek fields, keep good records, and we'll judge the yield effect field by field.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "5.03", "nazwa": "Business Plan for a Grant or Cost-Share Application", "tag": "GRANT BUSINESS PLAN", "co_robi": "Drafts the business plan or project narrative a grant or cost-share program asks for: the operation, the project, the need, the expected results and the budget logic — built only from the grower's numbers and the program notice you paste. It never invents program rules, scoring points or dollar figures.", "kiedy": "When a client wants to apply for a USDA Rural Development, state or other ag grant or cost-share program and the application asks for a business plan or project narrative.", "brief": [{"pole": "Operation and production", "opis": "What the farm produces and how, e.g. “Hoffman Brothers, south-central Nebraska — 2,600 ac irrigated corn and soybeans, 400 ac dryland wheat”."}, {"pole": "Planned project", "opis": "What they want to build or buy, e.g. “grain dryer upgrade and 60,000 bu bin to dry and store on farm instead of hauling wet corn to town”."}, {"pole": "Financial results", "opis": "Recent numbers from the grower's records, e.g. “last 3 years gross revenue, net farm income and yields — from the tax preparer's summary”."}, {"pole": "Program announcement", "opis": "Paste the grant or cost-share notice: eligibility, scoring criteria, required sections, e.g. “state value-added / energy grant notice (pasted below)”."}, {"pole": "Goals and justification", "opis": "Why the project matters, e.g. “cut drying cost, capture harvest basis, reduce trucking during harvest”."}, {"pole": "Funding sources", "opis": "How the project will be paid for, e.g. “grant request + own cash + operating line at Farm Credit”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who helps farm clients with USDA program paperwork, lenders and compliance every season. Write the business plan or project narrative for a grant or cost-share application.\n\nINPUT:\n- Operation and production: [OPERATION AND PRODUCTION]\n- Planned project: [PLANNED PROJECT]\n- Financial results: [FINANCIAL RESULTS]\n- Program announcement (pasted): [PROGRAM ANNOUNCEMENT]\n- Goals and justification: [GOALS AND JUSTIFICATION]\n- Funding sources: [FUNDING SOURCES]\n\nRULES:\n1. If important data is missing, ask me up to 5–7 short questions first and wait for my answers before you write the document.\n2. Do not invent payment rates, dollar amounts, program deadlines, form numbers, eligibility rules or regulation citations. Work only from the program rules and documents I paste; anything not covered there, mark [VERIFY].\n3. Mark missing data [TO FILL IN] and anything you assume [ASSUMPTION]. If you calculate anything (acres, totals, percentages), show the math step by step.\n4. Follow the section order and wording of the program announcement I paste. If I didn't paste one, ask for it and use a generic structure marked [VERIFY].\n5. Never invent grant amounts, cost-share percentages, scoring points, quotes or price assumptions. Every number must come from my input; projections must show the formula and be marked [ASSUMPTION].\n\nOUTPUT FORMAT:\nA) Executive summary (half a page).\nB) Operation description: land, crops, equipment, people, markets.\nC) Project description and need, tied to the program's stated goals.\nD) Budget table: | item | quote or source | cost | funding source | — with [TO FILL IN] wherever a quote is missing.\nE) Expected results with step-by-step calculations, and a risk section.\nF) List of attachments the notice requires and what is still missing.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Rewrite the executive summary to fit in 150 words.", "Map each section to the scoring criteria in the notice.", "Add a sensitivity table with a low, base and high price scenario I'll give you.", "List every number that still needs a quote or a document behind it.", "Make the language less salesy and more factual.", "Add a section on how the project fits the program's stated goals.", "Write a cover letter for the application.", "Build a timeline from purchase to project completion.", "Create a checklist of required attachments.", "Summarize the plan in plain English for the grower to review."], "checklista": ["Section order and headings match the current program notice.", "Every cost has a quote, invoice or clear source.", "Projections show the formula and are labeled as assumptions.", "No grant amount or cost-share percentage was taken from anywhere but the official notice.", "Financial history matches the grower's records or tax preparer's summary.", "All required attachments are listed and accounted for.", "The grower has read and agrees with every statement in the plan."], "uwaga": "Grant and cost-share rules, scoring and deadlines are set in each program notice and change from round to round. Have the grower's accountant or tax preparer check the financial figures. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Hoffman Brothers down in south-central Nebraska, 2,600 irrigated corn and beans, 400 dryland wheat. They want a new dryer and a 60,000 bushel bin so they can dry and hold corn at home instead of hauling wet corn to town and eating the shrink and the drying charges. Yields run about 230 bushel irrigated corn the last 3 years, they'll send me the tax guy's summary for revenue and net income. Paying with a grant if they get one, their own cash and the operating line at Farm Credit. I'll paste the grant notice tonight. Give me a first draft I can work with.", "wynik": "A) Executive summary\nHoffman Brothers operate 3,000 acres in south-central Nebraska (2,600 ac irrigated corn and soybeans, 400 ac dryland wheat). The project adds on-farm drying and a 60,000 bu storage bin so corn can be dried and held on the farm instead of delivered wet at harvest. [VERIFY against the program's stated purpose once the notice is pasted.]\n\nB) Operation\n- Land: 2,600 + 400 = 3,000 ac.\n- Irrigated corn yield, 3-year average: about 230 bu/ac (grower records) [VERIFY with APH or yield records].\n- Revenue and net farm income: [TO FILL IN from tax preparer's summary].\n\nC) Project and need\nCurrently all wet corn is hauled to the elevator at harvest, paying drying and shrink charges [TO FILL IN: elevator schedule].\n\nD) Budget\n| item | quote or source | cost | funding source |\n| grain dryer | [TO FILL IN: dealer quote] | [TO FILL IN] | grant + cash [ASSUMPTION] |\n| 60,000 bu bin | [TO FILL IN] | [TO FILL IN] | Farm Credit line |\n| electrical, site work | [TO FILL IN] | [TO FILL IN] | cash |\n\nE) Expected results\nSavings per bushel = elevator drying + shrink charge − on-farm drying cost [ASSUMPTION — numbers needed].\n\nF) Missing attachments\nProgram notice, quotes, financial statements, any required environmental review [VERIFY].\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "5.04", "nazwa": "Ag Loan Package — Farm & Project Description", "tag": "AG LOAN", "co_robi": "Drafts the farm description and project narrative for a loan package to Farm Credit, an FSA farm loan or a local ag lender: who the grower is, how the operation runs, what the money is for and how it will be repaid — using only the grower's own figures. It doesn't invent interest rates, loan terms or ratios.", "kiedy": "When a client is going to the lender for land, equipment or an operating line and the loan officer wants a written description of the operation and the project.", "brief": [{"pole": "Operation", "opis": "Who, where, acres, owned vs. rented, e.g. “Dave Jensen, Story County, IA — 1,240 ac, 320 owned, rest cash-rented on 1-year leases”."}, {"pole": "Project and amount requested", "opis": "What the loan is for and the amount the grower wants, e.g. “buy the 80 next door at the asking price the realtor gave, plus a used planter”."}, {"pole": "Financial results", "opis": "Balance sheet, income and cash flow figures the grower provides, e.g. “3 years of Schedule F summaries and this spring's balance sheet from the accountant”."}, {"pole": "Debts and collateral", "opis": "Existing loans and what can secure the new one, e.g. “machinery note with the local bank, operating line, owned 320 ac free and clear”."}, {"pole": "Lender requirements", "opis": "Paste the lender's checklist or what the loan officer asked for, e.g. “Farm Credit asked for a farm description and a project narrative”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who helps farm clients with USDA program paperwork, lenders and compliance every season. Draft the farm description and project narrative for this grower's loan package.\n\nINPUT:\n- Operation: [OPERATION]\n- Project and amount requested: [PROJECT AND AMOUNT REQUESTED]\n- Financial results: [FINANCIAL RESULTS]\n- Existing debts and collateral: [DEBTS AND COLLATERAL]\n- Lender requirements (pasted): [LENDER REQUIREMENTS]\n\nRULES:\n1. If important data is missing, ask me up to 5–7 short questions first and wait for my answers before you write the document.\n2. Do not invent payment rates, dollar amounts, program deadlines, form numbers, eligibility rules or regulation citations. Work only from the program rules and documents I paste; anything not covered there, mark [VERIFY].\n3. Mark missing data [TO FILL IN] and anything you assume [ASSUMPTION]. If you calculate anything (acres, totals, percentages), show the math step by step.\n4. Never invent interest rates, loan terms, appraised values, cash rents or financial ratios. If I give figures, calculate ratios step by step and label them from the grower's own data.\n5. Do not state FSA loan eligibility or limits; anything about program loans gets [VERIFY WITH YOUR LENDER].\n6. Write factually, in the tone a loan officer trusts — no sales talk.\n\nOUTPUT FORMAT:\nA) Farm description: people, land (owned and rented), crops, equipment, markets, history.\nB) Project description: what, why, cost source, timing.\nC) Repayment logic with the math shown, based only on my numbers.\nD) Debts and collateral summary table: | creditor | purpose | balance | collateral |.\nE) Risks and how the grower manages them (insurance, marketing, diversification).\nF) Checklist of documents the lender asked for, with what's still missing.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Shorten the farm description to one page.", "Calculate the working capital and current ratio from the balance sheet I'll paste.", "Add a section on the grower's marketing and crop insurance plan.", "List every figure the loan officer is likely to question.", "Rewrite it in the format of the lender checklist I'll paste.", "Add a short history of the operation and the next generation's role.", "Make a table of owned and rented land with lease terms.", "Write a cover email to the loan officer.", "List the documents still missing for the loan file.", "Summarize the package in five bullet points for the grower."], "checklista": ["All financial figures match the grower's statements or tax returns.", "No interest rates, terms or values were invented.", "Debts and collateral are complete and current.", "Rented land and lease terms are described accurately.", "Every item on the lender's checklist is covered or marked missing.", "The grower and their accountant have reviewed the numbers."], "uwaga": "The lender decides on terms and eligibility; FSA farm loan rules change and are set by the agency. Have the grower's accountant or tax preparer review every financial figure before it goes to the lender. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Dave Jensen again, Story County, 1,240 acres, 320 owned, rest cash-rented on year-to-year leases. The 80 next door is for sale and he wants to buy it, plus a used 16-row planter he found. He's going to Farm Credit, the loan officer asked for a write-up on the farm and the project. His accountant sent three years of Schedule F summaries, I'll paste those. He's got a machinery note with the local bank and an operating line, and the 320 owned is free and clear. Write the farm description and the project part, I'll fill in the numbers.", "wynik": "A) Farm description\nDave Jensen operates 1,240 acres of corn and soybeans in Story County, Iowa. He owns 320 acres and cash-rents 920 acres (1,240 − 320 = 920) on year-to-year leases [VERIFY lease terms with Dave]. [TO FILL IN: years farming, family involvement, main grain buyers.]\n\nB) Project\n- Purchase of the adjoining 80 acres, price [TO FILL IN: purchase agreement].\n- Used 16-row planter, price [TO FILL IN: dealer quote].\n- Reason: the 80 borders his owned ground; it can be farmed with the current line of equipment and adds owned acres to a mostly rented operation.\n\nC) Repayment logic\nAnnual payment capacity = average net farm income + depreciation − family living − existing principal payments [ASSUMPTION — formula to confirm with the lender; figures TO FILL IN from Schedule F summaries].\n\nD) Debts and collateral\n| creditor | purpose | balance | collateral |\n| local bank | machinery note | [TO FILL IN] | equipment |\n| [TO FILL IN] | operating line | [TO FILL IN] | crops/inventory [VERIFY] |\n| — | 320 ac owned | free and clear | available |\n\nE) Risks\nRented-land dependence, price risk; crop insurance coverage [TO FILL IN].\n\nF) Missing documents\nBalance sheet, purchase agreement, planter quote, insurance summary.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "5.05", "nazwa": "Conservation Plan & CSP Activity Plan", "tag": "CONSERVATION PLAN", "co_robi": "Organizes a conservation plan or CSP activity plan into a year-by-year schedule: which practice or enhancement goes on which field, when it happens, who does it and what record proves it. It works only from the contract or requirements you paste and never adds payment figures.", "kiedy": "After the NRCS contract or plan is drafted, when you and the grower need a practical field schedule and record system so nothing is missed at status review.", "brief": [{"pole": "Farm and operator", "opis": "Operator, location and acres in the plan, e.g. “Miller Farms, McLean County, IL — 1,800 ac cropland, 45 ac pasture along the creek”."}, {"pole": "Fields and practices", "opis": "Fields with the practices or enhancements planned, e.g. “creek fields 210 ac – cover crop 340; all cropland – nutrient management 590; pasture – prescribed grazing”."}, {"pole": "Resource inventory", "opis": "What the NRCS planner or you found on the ground, e.g. “two gullies on Creek East, wet spot by the tile outlet, field borders mowed”."}, {"pole": "Program requirements", "opis": "Paste the contract or practice requirements you have, e.g. “CSP enhancement list and schedule from the draft contract (pasted below)”."}, {"pole": "Advisor details", "opis": "Your name and role in the plan, e.g. “Sarah Klein, CCA, independent crop consultant, does soil sampling and the 590 plan”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who helps farm clients with USDA program paperwork, lenders and compliance every season. Turn this conservation contract into a practical activity plan and record system.\n\nINPUT:\n- Farm and operator: [FARM AND OPERATOR]\n- Fields and practices: [FIELDS AND PRACTICES]\n- Resource inventory: [RESOURCE INVENTORY]\n- Program requirements (pasted): [PROGRAM REQUIREMENTS]\n- Advisor details: [ADVISOR DETAILS]\n\nRULES:\n1. If important data is missing, ask me up to 5–7 short questions first and wait for my answers before you write the document.\n2. Do not invent payment rates, dollar amounts, program deadlines, form numbers, eligibility rules or regulation citations. Work only from the program rules and documents I paste; anything not covered there, mark [VERIFY].\n3. Mark missing data [TO FILL IN] and anything you assume [ASSUMPTION]. If you calculate anything (acres, totals, percentages), show the math step by step.\n4. Use only the practices, scheduled years and requirements from the contract or plan I paste. Anything else gets [VERIFY WITH NRCS].\n5. Never add payment amounts, contract values or deadlines that are not in my text.\n6. Do not give rates for seed, fertilizer or pesticides; point to the plan, soil test or label: [CHECK LABEL] or [TO FILL IN].\n\nOUTPUT FORMAT:\nA) Plan summary: operator, acres, practices, contract years.\nB) Schedule table: | year | field | practice or enhancement (code) | timing | who | proof record |.\nC) Record system: forms, photos, maps and receipts to keep for each practice.\nD) Seasonal reminders for the grower, by month.\nE) Open questions for the NRCS planner.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Split the schedule into one table per contract year.", "Make a field-by-field record sheet the grower can keep in the truck.", "List the photos to take for each practice and when.", "Flag any practice that conflicts with the grower's current rotation.", "Add a column for completion date and initials.", "Write a reminder text for each key field activity.", "Prepare a summary for the annual status review with NRCS.", "List everything still unclear in the contract.", "Make a simple map legend for practices by field.", "Explain the plan to the grower in plain English, one paragraph per practice."], "checklista": ["Every practice, field and year matches the signed contract or plan.", "Each practice has a responsible person and a proof record.", "No payment figures were added from outside the contract.", "Rates come from the 590 plan, soil tests or labels — not from the AI.", "Timing conflicts with planting, harvest or rotation are resolved.", "Open questions were sent to the NRCS planner."], "uwaga": "The signed NRCS contract and practice standards are the only authority on requirements and schedules. If anything changes (land, rotation, operator), talk to NRCS before the practice year starts. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Miller Farms again, their CSP contract is drafted. 1,800 acres cropland plus 45 acres pasture by the creek. Creek fields are about 210 acres and those get cover crops, 340. All the cropland gets nutrient management, I'm the one doing the 590 plan and the soil sampling, Sarah Klein, CCA. The pasture has some grazing practice, I don't remember the exact name. NRCS walked it and noted two gullies on Creek East and a wet spot by the tile outlet. I'll paste the enhancement list later. Build me the schedule and what records we keep.", "wynik": "A) Plan summary\nMiller Farms, McLean County, IL — 1,800 ac cropland + 45 ac pasture. Advisor: Sarah Klein, CCA (590 plan, soil sampling). Contract years: [TO FILL IN].\n\nB) Schedule\n| year | field | practice (code) | timing | who | proof record |\n| 1 | creek fields, 210 ac | Cover Crop (340) | after harvest [VERIFY per job sheet] | grower + custom seeder | invoice, seed tag, photos, map |\n| 1 | all cropland, 1,800 ac | Nutrient Management (590) | plan before first application | Sarah Klein | soil tests, plan, application records |\n| 1 | pasture, 45 ac | grazing practice [TO FILL IN: name and code] | [VERIFY] | grower | grazing log |\n| [VERIFY] | Creek East | gully treatment [VERIFY WITH NRCS — not in my list yet] | — | — | — |\n\nC) Record system\n- 340: seeding date, species, rate per job sheet [TO FILL IN], termination date and method [CHECK LABEL for herbicide].\n- 590: soil test reports, nutrient plan, every application: date, field, source, rate, method.\n\nD) Reminders\n- Fall: confirm seeding window and book the custom seeder.\n- Spring: photos before termination.\n\nE) Questions for NRCS\n1. Are the Creek East gullies in this contract or a separate EQIP practice?\n2. Exact pasture practice and grazing records required?\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "5.06", "nazwa": "Wildlife Damage Documentation", "tag": "WILDLIFE DAMAGE", "co_robi": "Builds a clean wildlife damage file — deer, feral hogs, geese and others — with a field description, dated evidence log, damaged-area estimate with the math shown and a letter to the state wildlife agency or the crop insurance agent. It never assumes compensation exists or states agency rules you didn't paste.", "kiedy": "When a client calls about deer eating a whole soybean edge, hogs rooting the corn after planting or geese grazing wheat, and you need documentation that holds up with the agency, the landlord or the insurance agent.", "brief": [{"pole": "Grower and field", "opis": "Who, which field, crop and acres, e.g. “Hoffman Brothers, Creek field SW¼ Sec. 14 — soybeans, 96 ac, timber on two sides”."}, {"pole": "Damage description", "opis": "What happened and when, e.g. “deer browsing on the timber edge since V3, feral hog rooting in the low end after planting”."}, {"pole": "Evidence", "opis": "What you have, e.g. “dated phone photos, GPS pins, trail cam clips, stand counts in damaged vs. undamaged strips”."}, {"pole": "Species and agency", "opis": "Which animal and who handles it in your state or province, e.g. “white-tailed deer and feral hogs — state wildlife agency and USDA Wildlife Services”."}, {"pole": "Rules and procedures", "opis": "Paste what the agency or your insurance agent told you, e.g. “state depredation permit info and agency contact (pasted below)”."}, {"pole": "Field assessment", "opis": "Your own measurements, e.g. “stand counts 1/1000 ac, damaged area mapped at about 14 ac”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who helps farm clients with USDA program paperwork, lenders and compliance every season. Document wildlife damage on this field and prepare the paperwork.\n\nINPUT:\n- Grower and field: [GROWER AND FIELD]\n- Damage description: [DAMAGE DESCRIPTION]\n- Evidence: [EVIDENCE]\n- Species and responsible agency: [SPECIES AND AGENCY]\n- Agency rules and procedures (pasted): [RULES AND PROCEDURES]\n- Field assessment: [FIELD ASSESSMENT]\n\nRULES:\n1. If important data is missing, ask me up to 5–7 short questions first and wait for my answers before you write the document.\n2. Do not invent payment rates, dollar amounts, program deadlines, form numbers, eligibility rules or regulation citations. Work only from the program rules and documents I paste; anything not covered there, mark [VERIFY].\n3. Mark missing data [TO FILL IN] and anything you assume [ASSUMPTION]. If you calculate anything (acres, totals, percentages), show the math step by step.\n4. Never state that compensation, permits or insurance coverage exist unless my pasted text says so. Agency programs, permits and deadlines get [VERIFY WITH YOUR STATE].\n5. Calculate damaged area and estimated yield loss step by step only from my measurements; label every estimate [ASSUMPTION].\n6. Do not recommend lethal control, baits or repellents; refer to the agency and the product label [CHECK LABEL].\n\nOUTPUT FORMAT:\nA) Field and damage summary.\nB) Evidence log: | date | what | who | file or GPS pin |.\nC) Damaged area and loss estimate with the math shown.\nD) Letter or email to the agency or insurance agent, factual and dated.\nE) Next steps and what to keep doing (photos, counts, contacts).\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Make the evidence log printable for the grower to keep filling in.", "Write a short email to the state wildlife agency requesting a site visit.", "Recalculate the loss with the yield check strips I'll give you.", "Add a map description of where the damage is concentrated.", "Draft a note to the landlord explaining the damage.", "List what the crop insurance adjuster will likely want to see.", "Make a photo plan for the next 4 weeks.", "Separate deer damage from hog damage in the report.", "List questions to ask USDA Wildlife Services.", "Summarize the file in five lines for the grower."], "checklista": ["Every photo and observation is dated and located.", "Damaged acres and loss estimates show the calculation.", "Nothing claims compensation or coverage without a source.", "The correct agency and contact were confirmed for this state or province.", "The insurance agent was told if a claim could be involved.", "The grower has reviewed and agrees with the description."], "uwaga": "Wildlife damage programs, depredation permits and hunting rules vary by state, province and species — some damage is not compensated at all. Confirm with your state wildlife agency, and talk to the crop insurance agent before you destroy or replant anything. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Hoffman Brothers' Creek field, SW quarter Section 14, soybeans, 96 acres, timber on the north and west. Deer have been hammering the edge since about V3, and hogs got into the low end right after planting and rooted it up. I've got phone photos with dates, a few GPS pins, and their trail cam has hogs on it at night. I did stand counts: damaged strip about 62,000 plants per acre against 118,000 in the good part. Damage maybe 14 acres total. Need something to send the state wildlife people and maybe the insurance agent.", "wynik": "A) Summary\nHoffman Brothers, Creek field (SW¼ Sec. 14), soybeans, 96 ac. Deer browsing along the north and west timber edges since about V3; feral hog rooting in the low end after planting. Estimated damaged area: about 14 ac [VERIFY with mapped boundary].\n\nB) Evidence log\n| date | what | who | file or GPS pin |\n| [TO FILL IN] | rooting in low end, photos | [TO FILL IN] | pins 1–3 |\n| [TO FILL IN] | trail cam: hogs at night | grower | cam files |\n| [TO FILL IN] | stand counts | agronomist | field notes |\n\nC) Stand loss\nStand reduction = (118,000 − 62,000) ÷ 118,000 = 56,000 ÷ 118,000 = 47 % on the damaged area.\nAffected share of field = 14 ÷ 96 = 14.6 %.\nYield impact: [TO FILL IN — needs expected yield and harvest check strips] [ASSUMPTION: stand loss ≠ equal yield loss in soybeans].\n\nD) Email to the agency\n“Hoffman Brothers report ongoing deer and feral hog damage on a 96-acre soybean field in SW¼ Sec. 14. About 14 acres are affected; dated photos, GPS points, trail camera footage and stand counts are available. We request a site visit and information on assistance options. [VERIFY WITH YOUR STATE the right office and contact.]”\n\nE) Next steps\nTell the crop insurance agent before replanting; keep weekly photos.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "5.07", "nazwa": "Crop Insurance Claim & Disaster Documentation", "tag": "CROP LOSS", "co_robi": "Organizes a crop loss file for a crop insurance claim or a disaster program: event timeline, field-by-field damage, evidence log and a notice of loss summary for the agent. It prepares you for the adjuster's appraisal and never states coverage levels, indemnities or claim deadlines.", "kiedy": "Right after hail, drought, flood or a freeze, when the grower has to give notice of loss to the crop insurance agent and you want a clean record before the adjuster comes out.", "brief": [{"pole": "Operation", "opis": "Who, where, insurance details you know, e.g. “Jensen Farms, Red River Valley, ND — 2,100 ac, revenue protection on wheat and soybeans through a local agent”."}, {"pole": "Event and date", "opis": "What happened and when, e.g. “hail July 9 around 4 pm, then 3 weeks without rain”."}, {"pole": "Crops and losses", "opis": "Fields, crop, stage and what you see, e.g. “Home quarter HRS wheat at Feekes 11.1, heads snapped; soybeans at R2 defoliated”."}, {"pole": "Evidence", "opis": "What's documented, e.g. “dated photos, hail size photo, rain gauge log, stand and head counts”."}, {"pole": "Rules and claim procedure", "opis": "Paste what the agent, policy or FSA told you, e.g. “agent's email on notice of loss and the policy's loss provisions (pasted below)”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who helps farm clients with USDA program paperwork, lenders and compliance every season. Build the crop loss documentation for an insurance claim or disaster program.\n\nINPUT:\n- Operation and insurance: [OPERATION]\n- Event and date: [EVENT AND DATE]\n- Crops and losses: [CROPS AND LOSSES]\n- Evidence: [EVIDENCE]\n- Rules and claim procedure (pasted): [RULES AND CLAIM PROCEDURE]\n\nRULES:\n1. If important data is missing, ask me up to 5–7 short questions first and wait for my answers before you write the document.\n2. Do not invent payment rates, dollar amounts, program deadlines, form numbers, eligibility rules or regulation citations. Work only from the program rules and documents I paste; anything not covered there, mark [VERIFY].\n3. Mark missing data [TO FILL IN] and anything you assume [ASSUMPTION]. If you calculate anything (acres, totals, percentages), show the math step by step.\n4. Never state coverage levels, guarantees, indemnity amounts, notice deadlines or program eligibility. The policy, the agent, the adjuster and FSA decide; anything not in my text gets [VERIFY WITH YOUR AGENT].\n5. Always remind me that the grower should not destroy, replant or harvest damaged acres before the adjuster releases them, unless the agent confirms otherwise.\n6. Estimate damage only from my counts, with the math shown, and label it [ASSUMPTION] — the adjuster's appraisal is what counts.\n\nOUTPUT FORMAT:\nA) Event timeline with dates and weather records.\nB) Damage table: | field | crop | acres | stage | damage observed | evidence |.\nC) Preliminary loss estimate with the math, clearly labeled as the agronomist's estimate.\nD) Notice of loss summary for the agent.\nE) Adjuster visit prep: what to show, what to ask; possible FSA disaster programs to ask about [VERIFY].\nF) Do-not-do list until the claim is settled.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Write the notice of loss email to the crop insurance agent.", "Make an adjuster visit checklist for the grower.", "Add a table of check strips to leave unharvested if the adjuster asks.", "Rebuild the timeline with the weather station data I'll paste.", "List questions to ask the FSA office about disaster programs for uninsured crops.", "Separate hail damage from drought damage in the report.", "Make a photo plan for the next two weeks.", "Summarize the losses by field in five lines.", "Write a note to the landlord about the crop loss.", "List what records to pull from last year to support the yield history."], "checklista": ["The agent got notice of loss and the date is recorded.", "No damaged acres were destroyed, replanted or harvested before release.", "Every photo and count has a date, field and location.", "Loss estimates are labeled as the agronomist's estimate, not the appraisal.", "No coverage levels or indemnities were stated without the policy.", "Disaster program questions were taken to the FSA office.", "The grower has reviewed everything before it goes to the agent."], "uwaga": "Notice requirements, deadlines and loss rules come from the crop insurance policy and the agent — they are not something the AI knows. Give notice to the agent promptly and follow the adjuster's instructions. In Canada, follow your provincial crop insurance program; in Australia, your private policy. This is a draft for your review — the final call, signature and liability stay with you.", "przyklad": {"wejscie": "Jensen Farms, Red River Valley, 2,100 acres, revenue protection on wheat and beans with the local agent. Hail went through July 9 around 4 in the afternoon, golf ball size in spots, then basically no rain for three weeks. Home quarter is hard red spring wheat, was at about Feekes 11.1, a lot of heads snapped or broken. Beans on the east half were R2 and look shredded. I've got dated photos, a hail photo with a quarter for scale, rain gauge log. I counted heads: 40 broken out of 100 in my sample on the wheat. Need a file for the agent and the adjuster.", "wynik": "A) Timeline\n- July 9, about 4 pm: hailstorm, stones up to golf ball size in spots (photo with coin for scale).\n- July 10–30: little or no rain [TO FILL IN: rain gauge totals by date].\n\nB) Damage table\n| field | crop | acres | stage | damage observed | evidence |\n| Home quarter | HRS wheat | [TO FILL IN] | Feekes 11.1 | snapped and broken heads | photos, head counts |\n| East half | soybeans | [TO FILL IN] | R2 | heavy defoliation | photos [TO FILL IN: defoliation estimate] |\n\nC) Preliminary estimate (agronomist's, not the appraisal)\nBroken heads = 40 ÷ 100 = 40 % in the sample [ASSUMPTION: one sample site — more sites needed before drawing conclusions].\nSoybean loss at R2: depends on defoliation and recovery — [TO FILL IN].\n\nD) Notice of loss summary for the agent\nInsured: Jensen Farms. Cause: hail July 9, followed by drought. Crops: HRS wheat and soybeans. Fields and acres: [TO FILL IN]. Notice given on [TO FILL IN: date and how]. [VERIFY WITH YOUR AGENT the notice requirements.]\n\nE) Adjuster prep\nHave field maps, photos, rain log ready; ask whether check strips are needed. Ask FSA about any disaster assistance for uninsured acres [VERIFY].\n\nF) Do not\nDestroy, replant or harvest damaged acres before the adjuster releases them.\n\nThis is a draft for your review — the final call, signature and liability stay with you."}}, {"id": "5.08", "nazwa": "Farm Description for Applications, Lenders & Programs", "tag": "FARM PROFILE", "co_robi": "Writes a reusable farm description — operation, land, people, production, markets and goals — and tailors it to the audience: lender, grant reviewer, NRCS, landlord or buyer. Every fact comes from your input; anything missing is marked instead of filled in.", "kiedy": "When the same client needs a farm description for the third time this year and you want one solid master version you can trim for each application.", "brief": [{"pole": "Basic facts", "opis": "Name, location, structure, e.g. “Hoffman Brothers LLC, Clay County, NE — two brothers and a son, started 1987”."}, {"pole": "Production", "opis": "Crops, acres, livestock, yields, e.g. “2,600 ac irrigated corn and soybeans, 400 ac dryland wheat, 150 cow-calf pairs”."}, {"pole": "Resources", "opis": "Land, buildings, equipment, storage, people, e.g. “1,100 ac owned, 1,900 rented; 180,000 bu storage; 2 full-time employees”."}, {"pole": "History and qualifications", "opis": "Experience, training, certifications, e.g. “30 years farming, son has an ag business degree, private applicator license”."}, {"pole": "Markets", "opis": "Who they sell to, e.g. “local co-op elevator, ethanol plant 25 miles away, calves at the sale barn”."}, {"pole": "Purpose of the description", "opis": "Where it will be used, e.g. “Farm Credit loan file, keep it to one page”."}], "prompt": "You are an experienced independent agronomist and Certified Crop Adviser (CCA) who helps farm clients with USDA program paperwork, lenders and compliance every season. Write a farm description from the facts below and tailor it to where it will be used.\n\nINPUT:\n- Basic facts: [BASIC FACTS]\n- Production: [PRODUCTION]\n- Resources: [RESOURCES]\n- History and qualifications: [HISTORY AND QUALIFICATIONS]\n- Markets: [MARKETS]\n- Purpose of the description: [PURPOSE OF THE DESCRIPTION]\n\nRULES:\n1. If important data is missing, ask me up to 5–7 short questions first and wait for my answers before you write the document.\n2. Do not invent payment rates, dollar amounts, program deadlines, form numbers, eligibility rules or regulation citations. Work only from the program rules and documents I paste; anything not covered there, mark [VERIFY].\n3. Mark missing data [TO FILL IN] and anything you assume [ASSUMPTION]. If you calculate anything (acres, totals, percentages), show the math step by step.\n4. Use only facts I give you. Don't round up acres, yields or experience, and don't add certifications or awards that I didn't mention.\n5. Adjust tone and length to the purpose: lenders want risk and repayment, grant reviewers want need and impact, NRCS wants resource concerns. If a length limit is given, respect it.\n\nOUTPUT FORMAT:\nA) Master farm description (about one page).\nB) Short version (150 words) for forms.\nC) Key facts table: | item | value | source |.\nD) Missing facts and items to verify.\nE) Suggestions for what to emphasize for this purpose.\n\nEnd with this note: \"This is a draft for your review — the final call, signature and liability stay with you.\"", "polecenia": ["Make a version for a grant reviewer focused on need and impact.", "Make a version for a lender focused on risk and repayment.", "Shorten it to fit a 1,000-character form field.", "Add a paragraph on the next generation and successi
