zmianie", "opis": "Co będzie rosło i kiedy można wapnować, np. „po żniwach pszenicy, potem rzepak; »Przy lesie« – kukurydza wiosną”."}], "prompt": "Jesteś doświadczonym polskim agronomem i doradcą rolniczym (ODR i doradztwo prywatne), który od lat przygotowuje dla gospodarstw plany wapnowania na podstawie wyników OSChR. Przygotuj plan wapnowania na podstawie moich danych.\n\nDANE:\nGospodarstwo i pola: [GOSPODARSTWO I POLA]\nWyniki OSChR: [WYNIKI OSCHR]\nKategoria agronomiczna gleby: [KATEGORIA AGRONOMICZNA GLEBY]\nZalecenia z laboratorium: [ZALECENIA Z LABORATORIUM]\nDostępny nawóz wapniowy: [DOSTĘPNY NAWÓZ WAPNIOWY]\nUprawy w płodozmianie: [UPRAWY W PŁODOZMIANIE]\n\nZASADY:\n1. Najpierw sprawdź, czy dane są kompletne. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Potrzeby wapnowania i dawki CaO bierz wyłącznie z zaleceń OSChR lub laboratorium, które podałem. Jeśli dla któregoś pola nie mam zalecenia, nie licz dawki — oznacz [DO UZUPEŁNIENIA] i napisz, o co dopytać w OSChR.\n3. Przelicz dawkę czystego CaO na dawkę nawozu wapniowego, korzystając z zawartości CaO z deklaracji, którą podałem.\n4. Zaproponuj termin wapnowania w płodozmianie i opisz ograniczenia (np. łączenie z nawozami azotowymi i naturalnymi) jako [DO WERYFIKACJI] u doradcy lub w instrukcji nawozu.\n5. Nie wymyślaj dawek, limitów prawnych, norm, terminów, współczynników ani kwot — używaj wyłącznie liczb, które podałem. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a wszystko, co trzeba sprawdzić w aktualnych przepisach, etykiecie lub u doradcy — [DO WERYFIKACJI].\n6. Każde obliczenie pokaż krok po kroku, z jednostkami, tak żebym mógł je sprawdzić na kalkulatorze.\n\nFORMAT WYNIKU:\nA) Tabela pól: pH, kategoria, zalecenie OSChR, dawka CaO/ha.\nB) Przeliczenie CaO na nawóz wapniowy krok po kroku i ilość na każde pole.\nC) Kolejność i terminy wapnowania w płodozmianie.\nD) Zestawienie do zamówienia (tony nawozu razem).\nE) Lista luk i rzeczy do weryfikacji.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przelicz plan dla wapna tlenkowego, którego deklarację ci podam.", "Rozłóż dawkę na dwa lata, jeśli jednorazowa jest za duża według zaleceń.", "Dodaj kolumnę z kosztem nawozu przy cenie, którą ci podam.", "Zrób krótkie zestawienie dla przewoźnika: ile ton na które pole.", "Uwzględnij magnez z wyników OSChR i oceń, czy wybrane wapno pasuje.", "Napisz rolnikowi prosto, dlaczego wapnowanie jest pierwsze przed nawożeniem P i K.", "Ułóż kolejność pól od najpilniejszego do najmniej pilnego.", "Dopisz terminy kolejnego badania gleby do kontroli efektu.", "Przygotuj wersję planu do teczki gospodarstwa z miejscem na podpis.", "Wypisz pytania do OSChR dla pól bez zalecenia."], "checklista": ["Wyniki OSChR są aktualne i przypisane do właściwych pól.", "Kategoria agronomiczna zgadza się z formularzem z laboratorium.", "Dawka CaO pochodzi z zalecenia, a nie z pamięci.", "Zawartość CaO w nawozie sprawdzona w deklaracji producenta.", "Termin wapnowania pasuje do płodozmianu i nie koliduje z nawożeniem azotem i nawozami naturalnymi.", "Ilość do zamówienia przeliczona na całą powierzchnię pól."], "uwaga": "Dawki CaO i zasady łączenia z innymi nawozami bierz wyłącznie z zaleceń OSChR, deklaracji nawozu i od doradcy. Plan jest szkicem do weryfikacji.", "przyklad": {"wejscie": "Gmina Łapy. Działka 112/3, 12 hektarów, pH w KCl 5,1, gleba średnia, OSChR napisała wapnowanie konieczne, 3 tony CaO na hektar. Pole przy lesie, 7,5 hektara, pH 5,8, też średnia, wapnowanie wskazane, 1,5 tony CaO. Kupuję wapno węglanowe magnezowe, w deklaracji 50% CaO. Na 112/3 po żniwach pszenicy idzie rzepak, na przy lesie wiosną kukurydza. Badanie z marca. Magnezu w wyniku nie mam, bo nie zlecałem. Wapno przywiozą luzem wywrotką, rozsiewa usługowo sąsiad. Ile wapna zamówić w sumie, na które pole najpierw i kiedy najlepiej sypać, żeby nie kolidowało z siewem rzepaku?", "wynik": "PLAN WAPNOWANIA – gm. Łapy, wyniki OSChR z marca\n\nA) Pola i zalecenia\n| Pole | ha | pH KCl | Kategoria | Zalecenie OSChR | CaO t/ha |\n| Działka 112/3 | 12 | 5,1 | średnia | konieczne | 3,0 |\n| »Przy lesie« | 7,5 | 5,8 | średnia | wskazane | 1,5 |\n\nB) Przeliczenie na nawóz (50% CaO wg deklaracji)\n1. Działka 112/3: 3,0 t CaO/ha / 0,50 = 6,0 t nawozu/ha; 6,0 × 12 ha = 72,0 t\n2. »Przy lesie«: 1,5 t CaO/ha / 0,50 = 3,0 t nawozu/ha; 3,0 × 7,5 ha = 22,5 t\n\nC) Terminy\n- Działka 112/3: po zbiorze pszenicy, na ściernisko przed uprawą pod rzepak – pole pilniejsze (wapnowanie konieczne). Czy jednorazowa dawka 6 t nawozu/ha jest dopuszczalna w jednym zabiegu [DO WERYFIKACJI] u doradcy lub w zaleceniu OSChR.\n- »Przy lesie«: jesienią po zbiorze przedplonu lub wczesną wiosną przed siewem kukurydzy [ZAŁOŻENIE: rolnik nie planuje w tym czasie nawozów naturalnych]. Odstęp od nawożenia azotem i obornikiem [DO WERYFIKACJI].\n\nD) Zamówienie\nRazem: 72,0 + 22,5 = 94,5 t wapna węglanowego magnezowego.\nZawartość MgO i ocena, czy pokrywa potrzeby magnezu [DO UZUPEŁNIENIA – brak wyniku Mg].\n\nE) Kontrola: ponowne badanie pH po wapnowaniu – termin [DO UZUPEŁNIENIA].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "2.03", "nazwa": "Interpretacja wyników analizy gleby dla rolnika", "tag": "ANALIZA GLEBY", "co_robi": "Tłumaczy suchy formularz z OSChR lub laboratorium na zrozumiałe opracowanie: co wyszło, co z tego wynika dla upraw i co robić w pierwszej kolejności. Opiera się na klasach zasobności z wyniku, a nie na własnych progach.", "kiedy": "Gdy rolnik dostał wyniki badań gleby, nie bardzo wie, co z nimi zrobić, i dzwoni z pytaniem „czy jest źle”.", "brief": [{"pole": "Gospodarstwo i pola", "opis": "Gospodarstwo i pola objęte badaniem, np. „gospodarstwo 38 ha, gm. Sieradz; 4 pola, w tym »Za stodołą« 9 ha”."}, {"pole": "Wyniki analizy", "opis": "Wartości z formularza OSChR/laboratorium, np. „»Za stodołą«: pH 6,2, P2O5 8,2, K2O 11,5, Mg 4,1 mg/100 g gleby”."}, {"pole": "Klasy zasobności z laboratorium", "opis": "Ocena z wyniku, np. „P – niska, K – średnia, Mg – średnia, kategoria gleby lekka”."}, {"pole": "Uprawy planowane", "opis": "Co będzie na polach, np. „pszenica ozima, potem kukurydza na ziarno”."}, {"pole": "Odbiorca opracowania", "opis": "Dla kogo piszesz, np. „rolnik 60+, bez żargonu” albo „właściciel spółki, krótko z tabelą”."}, {"pole": "Pytania rolnika", "opis": "Co go niepokoi, np. „czy to dlatego plony spadają i czy musi kupić fosfor”."}], "prompt": "Jesteś doświadczonym polskim agronomem i doradcą rolniczym (ODR i doradztwo prywatne), który od lat przygotowuje dla gospodarstw opracowania wyników analiz gleby z OSChR i laboratoriów, tłumacząc je rolnikom zrozumiałym językiem. Przygotuj interpretację moich wyników.\n\nDANE:\nGospodarstwo i pola: [GOSPODARSTWO I POLA]\nWyniki analizy: [WYNIKI ANALIZY]\nKlasy zasobności z laboratorium: [KLASY ZASOBNOŚCI Z LABORATORIUM]\nUprawy planowane: [UPRAWY PLANOWANE]\nOdbiorca opracowania: [ODBIORCA OPRACOWANIA]\nPytania rolnika: [PYTANIA ROLNIKA]\n\nZASADY:\n1. Najpierw sprawdź, czy dane są kompletne. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Ocen zasobności (bardzo niska… bardzo wysoka) i kategorii gleby nie ustalaj sam — bierz je z formularza, który podałem. Jeśli klasy nie ma, oznacz [DO UZUPEŁNIENIA], zamiast przypisywać ją z pamięci.\n3. Kolejność działań uzasadniaj agronomicznie (najpierw odczyn, potem P, K, Mg), ale bez podawania dawek — dawki to osobny plan nawożenia.\n4. Pisz językiem dostosowanym do odbiorcy, krótko, bez straszenia; odpowiedz wprost na pytania rolnika.\n5. Nie wymyślaj dawek, limitów prawnych, norm, terminów, współczynników ani kwot — używaj wyłącznie liczb, które podałem. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a wszystko, co trzeba sprawdzić w aktualnych przepisach, etykiecie lub u doradcy — [DO WERYFIKACJI].\n6. Każde obliczenie pokaż krok po kroku, z jednostkami, tak żebym mógł je sprawdzić na kalkulatorze.\n\nFORMAT WYNIKU:\nA) Tabela wyników: parametr, wartość, jednostka, klasa z laboratorium, krótki komentarz.\nB) Co z tego wynika dla planowanych upraw (3–5 zdań na pole).\nC) Priorytety: co zrobić najpierw, co może poczekać.\nD) Odpowiedzi na pytania rolnika.\nE) Dane do uzupełnienia i kiedy powtórzyć badanie.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Zrób z tego jednostronicową notatkę do wręczenia rolnikowi.", "Porównaj te wyniki z badaniem sprzed 4 lat, które ci wkleję.", "Ułóż ranking pól od najgorzej do najlepiej zaopatrzonych.", "Napisz SMS do rolnika z trzema najważniejszymi wnioskami.", "Wypisz, jakie dodatkowe analizy warto zlecić i dlaczego.", "Przygotuj na tej podstawie dane wejściowe do planu wapnowania.", "Wyjaśnij prostym językiem, co znaczy kategoria agronomiczna gleby.", "Dodaj krótkie wyjaśnienie, dlaczego przy niskim pH fosfor jest gorzej dostępny.", "Zrób wersję po angielsku dla właściciela spółki.", "Przygotuj listę pytań do laboratorium o niejasne wyniki."], "checklista": ["Wartości i jednostki przepisane zgodnie z formularzem.", "Klasy zasobności pochodzą z wyniku laboratorium, nie z pamięci AI.", "Każde pole ma przypisane właściwe wyniki.", "W opracowaniu nie ma dawek nawozów – te idą do osobnego planu.", "Język pasuje do odbiorcy, wnioski są jednoznaczne.", "Podana data badania i zalecany termin kolejnego."], "uwaga": "", "przyklad": {"wejscie": "Gospodarstwo 38 ha koło Sieradza, rolnik pan Zdzisław, ma ponad 60 lat, nie lubi mądrych słów. Pole Za stodołą 9 hektarów: pH 6,2, fosfor 8,2, potas 11,5, magnez 4,1, wszystko w miligramach na 100 gram gleby. Laboratorium napisało: fosfor niska, potas średnia, magnez średnia, gleba lekka. W tym roku pszenica ozima, potem kukurydza. Pyta, czy to przez to pszenica słabo sypie i czy musi kupić fosfor. Odczynu laboratorium nie oceniło na formularzu, nie wiem czemu. Napisz mu to tak, żeby zrozumiał, krótko, najlepiej na jedną kartkę, bo mu to wydrukuję i zawiozę w czwartek.", "wynik": "WYNIKI BADANIA GLEBY – pole »Za stodołą«, 9 ha (dla p. Zdzisława)\n\nA) Co wyszło\n| Składnik | Wynik (mg/100 g) | Ocena laboratorium | Krótko |\n| Odczyn pH | 6,2 | [DO UZUPEŁNIENIA – brak oceny na formularzu] | do potwierdzenia z laboratorium |\n| Fosfor (P2O5) | 8,2 | niska | to najsłabszy punkt pola |\n| Potas (K2O) | 11,5 | średnia | w porządku, pilnować |\n| Magnez (Mg) | 4,1 | średnia | w porządku |\nGleba: lekka.\n\nB) Co to znaczy dla upraw\nPole ma za mało fosforu. Fosfor odpowiada za korzenie i dobry start roślin – przy jego niedoborze pszenica gorzej się krzewi i słabiej ziarni. Potas i magnez są na średnim poziomie, więc nie są teraz głównym problemem. Na glebie lekkiej składniki łatwiej uciekają, dlatego trzeba je regularnie uzupełniać.\n\nC) Co robić najpierw\n1. Potwierdzić ocenę odczynu w laboratorium – od niego zależy, czy fosfor w ogóle będzie dostępny [DO WERYFIKACJI].\n2. Uwzględnić fosfor w planie nawożenia pod pszenicę i kukurydzę – dawkę policzymy osobno z zaleceń.\n3. Potas i magnez – utrzymać poziom.\n\nD) Odpowiedzi\n„Czy to przez to pszenica słabo sypie?” – Niski fosfor może być jedną z przyczyn, ale nie jedyną; warto sprawdzić też odmianę, przedplon i nawożenie azotem [ZAŁOŻENIE: brak innych danych o polu].\n„Czy musi kupić fosfor?” – Tak, to składnik do uzupełnienia w pierwszej kolejności.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "2.04", "nazwa": "Bilans azotu i składników NPK gospodarstwa", "tag": "BILANS NPK", "co_robi": "Liczy bilans składników „na bramie gospodarstwa” lub „na powierzchni pola”: dopływ, odpływ, saldo w kg i w kg/ha. Pokazuje każde mnożenie, a zawartości składników bierze tylko z Twoich analiz i tabel.", "kiedy": "Po sezonie, gdy trzeba sprawdzić, czy gospodarstwo nie przenawozi azotem, przygotować dane do dokumentacji albo uzasadnić rolnikowi mniejsze zakupy nawozów.", "brief": [{"pole": "Gospodarstwo i powierzchnia", "opis": "Powierzchnia UR i typ produkcji, np. „gospodarstwo 85 ha UR, gm. Środa Wlkp., produkcja roślinna + tuczniki”."}, {"pole": "Okres bilansu", "opis": "Za jaki okres liczysz, np. „rok gospodarczy 2025/2026”."}, {"pole": "Dopływ składników", "opis": "Nawozy mineralne, naturalne, inne źródła, np. „saletra 34% N – 20 t; obornik 400 t; gnojowica 1 200 m³”."}, {"pole": "Zawartości składników", "opis": "Zawartości N, P, K – z analiz, deklaracji lub tabel, które masz, np. „obornik 5 kg N/t z analizy; gnojowica 4 kg N/m³”."}, {"pole": "Odpływ z plonami", "opis": "Sprzedane i zebrane plony ze współczynnikami wyniesienia, które masz, np. „pszenica 300 t, 18 kg N/t wg tabel ODR”."}, {"pole": "Cel bilansu", "opis": "Po co liczysz, np. „kontrola nadwyżki azotu i optymalizacja zakupów” albo „dokumentacja do kontroli”."}], "prompt": "Jesteś doświadczonym polskim agronomem i doradcą rolniczym (ODR i doradztwo prywatne), który od lat przygotowuje dla gospodarstw bilanse azotu, fosforu i potasu oraz dokumentację nawozową. Policz bilans składników mojego gospodarstwa.\n\nDANE:\nGospodarstwo i powierzchnia: [GOSPODARSTWO I POWIERZCHNIA]\nOkres bilansu: [OKRES BILANSU]\nDopływ składników: [DOPŁYW SKŁADNIKÓW]\nZawartości składników: [ZAWARTOŚCI SKŁADNIKÓW]\nOdpływ z plonami: [ODPŁYW Z PLONAMI]\nCel bilansu: [CEL BILANSU]\n\nZASADY:\n1. Najpierw sprawdź, czy dane są kompletne. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Zawartości składników w nawozach naturalnych, współczynniki wyniesienia z plonem i ewentualne równoważniki bierz wyłącznie z moich danych. Brak współczynnika = [DO UZUPEŁNIENIA], nie wartość z pamięci.\n3. Nawozy mineralne przeliczaj na czysty składnik według zawartości z deklaracji, którą podałem.\n4. Interpretację salda (czy nadwyżka jest duża) opisz ostrożnie; dopuszczalne wartości salda, jeśli mają znaczenie prawne, oznacz [DO WERYFIKACJI].\n5. Nie wymyślaj dawek, limitów prawnych, norm, terminów, współczynników ani kwot — używaj wyłącznie liczb, które podałem. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a wszystko, co trzeba sprawdzić w aktualnych przepisach, etykiecie lub u doradcy — [DO WERYFIKACJI].\n6. Każde obliczenie pokaż krok po kroku, z jednostkami, tak żebym mógł je sprawdzić na kalkulatorze.\n\nFORMAT WYNIKU:\nA) Tabela dopływu: źródło, ilość, zawartość, kg N, P2O5, K2O.\nB) Tabela odpływu: plon, ilość, współczynnik, kg składnika.\nC) Saldo w kg i kg/ha dla N, P2O5, K2O z obliczeniem.\nD) Wnioski i 3–5 rekomendacji dla gospodarstwa.\nE) Lista brakujących danych i założeń.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Policz osobno bilans dla każdego pola zamiast całego gospodarstwa.", "Dodaj azot z nawozów naturalnych w kg N/ha i porównaj z limitem 170 kg N/ha.", "Porównaj saldo z bilansem z poprzedniego roku, który ci podam.", "Zrób wykres słupkowy dopływ–odpływ w formie tabeli do Excela.", "Wypisz, które pozycje mają największy wpływ na nadwyżkę azotu.", "Przygotuj wersję dla rolnika na jedną stronę.", "Przelicz bilans przy założeniu, że słoma zostaje na polu.", "Dodaj kolumnę z wartością nawozów przy cenach, które podam.", "Zaproponuj, jak zmniejszyć zakup fosforu bez ryzyka dla plonu.", "Wypisz, jakie analizy obornika i gnojowicy warto zlecić."], "checklista": ["Ilości nawozów zgadzają się z fakturami i ewidencją.", "Zawartości składników mają źródło: analiza, deklaracja albo tabela ODR.", "Plony pochodzą z rzeczywistego zbioru lub sprzedaży.", "Saldo podzielone przez właściwą powierzchnię UR.", "Azot z nawozów naturalnych w średniej gospodarstwa sprawdzony względem 170 kg N/ha.", "Wnioski nie zawierają limitów, których nie potwierdzono w przepisach."], "uwaga": "Współczynniki i ewentualne wymagania prawne dotyczące bilansu sprawdź w aktualnym Programie azotanowym lub u doradcy ODR. Aplikacja liczy tylko na Twoich danych.", "przyklad": {"wejscie": "Gospodarstwo 85 hektarów UR koło Środy Wielkopolskiej, rośliny plus tuczniki. Rok 2025/2026. Kupiłem 20 ton saletry amonowej 34%. Obornika wyjechało 400 ton, gnojowicy 1200 kubików. Z analizy mam obornik 5 kg N na tonę, gnojowica 4 kg N na kubik. Zebrałem 300 ton pszenicy i 100 ton rzepaku. Współczynniki z tabeli ODR, którą mam: pszenica 18 kg N na tonę, rzepak 33 kg N na tonę. Na razie sam azot, fosfor i potas dorobimy później. Chcę wiedzieć, czy nie sypię za dużo. Słoma została na polu, paszy z zewnątrz trochę kupowałem, ale ilości jeszcze nie zebrałem.", "wynik": "BILANS AZOTU – gospodarstwo 85 ha UR, rok 2025/2026\n\nA) Dopływ N\n| Źródło | Ilość | Zawartość | kg N |\n| Saletra amonowa | 20 000 kg | 34% N | 20 000 × 0,34 = 6 800 |\n| Obornik | 400 t | 5 kg N/t | 400 × 5 = 2 000 |\n| Gnojowica | 1 200 m³ | 4 kg N/m³ | 1 200 × 4 = 4 800 |\n| Razem | | | 13 600 |\n\nB) Odpływ N z plonem\n| Plon | Ilość | Współczynnik | kg N |\n| Pszenica | 300 t | 18 kg N/t | 5 400 |\n| Rzepak | 100 t | 33 kg N/t | 3 300 |\n| Razem | | | 8 700 |\n\nC) Saldo\n13 600 − 8 700 = 4 900 kg N\n4 900 / 85 ha = 57,6 kg N/ha nadwyżki\n\nAzot z nawozów naturalnych: (2 000 + 4 800) / 85 ha = 80,0 kg N/ha – poniżej 170 kg N/ha w średniej gospodarstwa.\n\nD) Wnioski\n1. Gospodarstwo ma dodatnie saldo azotu; czy jego poziom jest akceptowalny w świetle obowiązujących wymagań [DO WERYFIKACJI].\n2. Nawozy naturalne dają 6 800 kg N, czyli połowę dopływu – warto lepiej uwzględniać je w planie nawożenia i ograniczyć zakup saletry.\n3. Brak danych o innych uprawach i paszach z zewnątrz [DO UZUPEŁNIENIA] – bilans może być niepełny.\n4. Słoma: [ZAŁOŻENIE] pozostała na polu i nie jest liczona w odpływie.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "2.05", "nazwa": "Płodozmian na 3–5 lat", "tag": "PŁODOZMIAN", "co_robi": "Układa płodozmian dla każdego pola na 3–5 lat z uzasadnieniem: przedplony, przerwy dla rzepaku i buraków, rozbijanie problemów chwastowych i chorobowych, równomierne obciążenie pracą. Wymogi ARiMR traktuje jako dane od Ciebie do weryfikacji.", "kiedy": "Gdy gospodarstwo jedzie „pszenica po pszenicy”, rosną problemy z chorobami i miotłą albo rolnik chce wejść w ekoschemat i potrzebuje planu na kilka lat.", "brief": [{"pole": "Gospodarstwo i pola", "opis": "Pola, powierzchnie, gleby, np. „62 ha, gm. Hrubieszów; 5 pól, gleby II–IIIa, »Działka 112/3« 14 ha”."}, {"pole": "Dotychczasowe zasiewy", "opis": "Co rosło na każdym polu w ostatnich 2–3 latach, np. „112/3: rzepak – pszenica – pszenica”."}, {"pole": "Kierunek produkcji", "opis": "Co i dla kogo produkujesz, np. „towarowe: pszenica jakościowa, rzepak, buraki na kontrakt 12 ha”."}, {"pole": "Ograniczenia i problemy", "opis": "Choroby, chwasty, sprzęt, np. „kiła kapusty na polu »Przy stawie«, miotła zbożowa odporna, brak siewnika do kukurydzy”."}, {"pole": "Wymogi zewnętrzne", "opis": "Ekoschematy, warunkowość, umowy – to, co sam sprawdziłeś, np. „chcę ekoschemat z płodozmianem – zasady sprawdzę w ARiMR”."}, {"pole": "Horyzont planu", "opis": "Na ile lat, np. „4 lata, od jesieni 2026”."}], "prompt": "Jesteś doświadczonym polskim agronomem i doradcą rolniczym (ODR i doradztwo prywatne), który od lat przygotowuje dla gospodarstw płodozmiany i plany struktury zasiewów. Ułóż płodozmian dla moich pól.\n\nDANE:\nGospodarstwo i pola: [GOSPODARSTWO I POLA]\nDotychczasowe zasiewy: [DOTYCHCZASOWE ZASIEWY]\nKierunek produkcji: [KIERUNEK PRODUKCJI]\nOgraniczenia i problemy: [OGRANICZENIA I PROBLEMY]\nWymogi zewnętrzne: [WYMOGI ZEWNĘTRZNE]\nHoryzont planu: [HORYZONT PLANU]\n\nZASADY:\n1. Najpierw sprawdź, czy dane są kompletne. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Uzasadniaj każde następstwo agronomicznie: wartość przedplonu, przerwy w uprawie roślin z tej samej rodziny, presja chorób i chwastów, terminy zbioru i siewu.\n3. Wymogi ekoschematów, warunkowości i umów kontraktacyjnych uwzględniaj tylko w zakresie, który podałem; każdy wymóg prawny oznacz [DO WERYFIKACJI] z odesłaniem do aktualnych zasad ARiMR.\n4. Zadbaj o realne obciążenie sprzętu i ludzi w szczytach prac; jeśli plan wymaga maszyny, której nie mam, napisz to wprost.\n5. Nie wymyślaj dawek, limitów prawnych, norm, terminów, współczynników ani kwot — używaj wyłącznie liczb, które podałem. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a wszystko, co trzeba sprawdzić w aktualnych przepisach, etykiecie lub u doradcy — [DO WERYFIKACJI].\n6. Każde obliczenie pokaż krok po kroku, z jednostkami, tak żebym mógł je sprawdzić na kalkulatorze.\n\nFORMAT WYNIKU:\nA) Tabela płodozmianu: pole, ha, lata kolejno z uprawą.\nB) Uzasadnienie następstw dla każdego pola (2–3 zdania).\nC) Struktura zasiewów w każdym roku (ha i %, z obliczeniem).\nD) Ryzyka i wymagania do sprawdzenia.\nE) Wariant alternatywny, jeśli jedno założenie nie wypali.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dodaj międzyplony tam, gdzie pasują w płodozmianie.", "Zrób wariant bez buraków, gdyby kontrakt nie został przedłużony.", "Policz udział zbóż w strukturze w każdym roku.", "Wydłuż plan do 5 lat i wyrównaj powierzchnię rzepaku między latami.", "Wskaż pola, na których trzeba przerwać zboża z powodu miotły.", "Przygotuj wersję na jedną stronę do powieszenia w biurze.", "Dodaj kolumnę z planowanym nawożeniem organicznym.", "Sprawdź, czy plan nie kumuluje siewów ozimych w jednym tygodniu.", "Opisz, jakie dane z ARiMR muszę potwierdzić dla ekoschematu.", "Zaproponuj miejsce na roślinę bobowatą i uzasadnij wybór pola."], "checklista": ["Każde pole ma pełną historię zasiewów z ostatnich lat.", "Przerwy w uprawie rzepaku, buraków i roślin bobowatych są agronomicznie uzasadnione.", "Pola z chorobami glebowymi (np. kiła) mają odpowiednio długą przerwę.", "Struktura w każdym roku sumuje się do powierzchni gospodarstwa.", "Wymogi ekoschematów i warunkowości sprawdzone w aktualnych zasadach ARiMR.", "Plan da się wykonać posiadanym sprzętem i ludźmi."], "uwaga": "Zasady ekoschematów i warunkowości (np. dotyczące zmianowania i dywersyfikacji) zmieniają się co kampanię. Sprawdź je w aktualnych materiałach ARiMR lub u doradcy ODR przed złożeniem wniosku.", "przyklad": {"wejscie": "Gospodarstwo 62 hektary pod Hrubieszowem, ziemia dobra. Pola: Działka 112/3 – 14 ha, ostatnio rzepak, pszenica, pszenica. Przy stawie – 12 ha, buraki, pszenica, rzepak, ale wyszła kiła kapusty. Za stodołą – 16 ha, pszenica, kukurydza, pszenica. Długie – 20 ha, pszenica, rzepak, pszenica. Buraki mam na kontrakt 12 ha co roku. Miotła w zbożach coraz gorsza. Kukurydzę sieje usługowo sąsiad. Chcę płodozmian na 4 lata od jesieni 2026 i może ekoschemat z płodozmianem, zasady sprawdzę w ARiMR. Rzepak chciałbym mieć co roku, bo mam dobrego odbiorcę.", "wynik": "PŁODOZMIAN 2026/27–2029/30 – gospodarstwo 62 ha, pow. hrubieszowski\n\nA) Plan\n| Pole | ha | 2027 | 2028 | 2029 | 2030 |\n| Działka 112/3 | 14 | buraki | pszenica oz. | kukurydza | pszenica oz. |\n| Przy stawie | 12 | pszenica oz. | buraki | pszenica oz. | kukurydza |\n| Za stodołą | 16 | rzepak oz. | pszenica oz. | buraki | pszenica oz. |\n| Długie | 20 | kukurydza | rzepak oz. | pszenica oz. | buraki |\n\nB) Uzasadnienie (wybór)\n- Przy stawie: po wykryciu kiły kapusty bez rzepaku w całym horyzoncie planu – długość przerwy po kile [DO WERYFIKACJI] u doradcy.\n- Działka 112/3: po dwóch latach pszenicy wchodzą buraki – przerwa w zbożach ogranicza miotłę i daje dobre stanowisko pod pszenicę.\n- Długie: kukurydza (siew wiosenny) przerywa cykl miotły, potem rzepak.\n\nC) Struktura (rok 2027)\nBuraki 14 ha = 14 / 62 = 22,6%; pszenica 12 ha = 19,4%; rzepak 16 ha = 25,8%; kukurydza 20 ha = 32,3%.\nBuraki co roku na jednym polu: 14 / 12 / 16 / 20 ha, a kontrakt to 12 ha [DO UZUPEŁNIENIA – czy cukrownia przyjmie nadwyżkę, czy podzielić pole].\n\nD) Ryzyka\n- Rzepak tylko w 2027 i 2028 – w latach 2029–2030 brak rzepaku; wariant: rzepak na Działce 112/3 zamiast pszenicy w 2030 [ZAŁOŻENIE].\n- Kukurydza zależy od usługi sąsiada.\n- Wymogi ekoschematu (liczba upraw, udział grup roślin) [DO WERYFIKACJI] w aktualnych zasadach ARiMR.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "2.06", "nazwa": "Plan siewu: odmiana, termin i norma wysiewu", "tag": "PLAN SIEWU", "co_robi": "Przygotowuje plan siewu dla pola: termin, obsadę, normę wysiewu w kg/ha z obliczeniem z MTZ i zdolności kiełkowania oraz zapotrzebowanie na materiał siewny. Zalecenia odmianowe bierze z Twojej karty odmiany lub COBORU.", "kiedy": "Przed siewem, gdy trzeba szybko policzyć, ile materiału siewnego zamówić i jak ustawić siewnik dla konkretnej partii nasion.", "brief": [{"pole": "Pole i stanowisko", "opis": "Pole, ha, przedplon, gleba, np. „»Długie« 18,5 ha, po rzepaku, gleba kompleks pszenny dobry”."}, {"pole": "Gatunek i odmiana", "opis": "Co siejesz, np. „pszenica ozima, odmiana jakościowa z listy PDO na nasze województwo”."}, {"pole": "Dane z karty odmiany", "opis": "Zalecenia z karty odmiany, COBORU lub od hodowcy, np. „obsada 350 roślin/m², optymalny termin siewu wg hodowcy – wpiszę”."}, {"pole": "Materiał siewny", "opis": "MTZ i zdolność kiełkowania z etykiety, np. „MTZ 45 g, zdolność kiełkowania 92%, materiał kwalifikowany”."}, {"pole": "Sprzęt i termin", "opis": "Siewnik, planowana data, np. „siewnik 4 m, siew 25–30 września”."}, {"pole": "Warunki na polu", "opis": "Wilgotność, uprawa, struktura, np. „gleba wilgotna, po orce, trochę brył; polowa wschodów u nas ok. 85%”."}], "prompt": "Jesteś doświadczonym polskim agronomem i doradcą rolniczym (ODR i doradztwo prywatne), który od lat przygotowuje dla gospodarstw plany siewu i ustawienia norm wysiewu. Przygotuj plan siewu dla mojego pola.\n\nDANE:\nPole i stanowisko: [POLE I STANOWISKO]\nGatunek i odmiana: [GATUNEK I ODMIANA]\nDane z karty odmiany: [DANE Z KARTY ODMIANY]\nMateriał siewny: [MATERIAŁ SIEWNY]\nSprzęt i termin: [SPRZĘT I TERMIN]\nWarunki na polu: [WARUNKI NA POLU]\n\nZASADY:\n1. Najpierw sprawdź, czy dane są kompletne. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Obsadę docelową i termin siewu bierz wyłącznie z karty odmiany, danych COBORU lub zaleceń hodowcy, które podałem. Jeśli ich brak, oznacz [DO UZUPEŁNIENIA] — nie podawaj obsady z pamięci.\n3. Normę wysiewu licz ze wzoru: obsada × MTZ / zdolność kiełkowania, a następnie skoryguj o polową wschodów, którą podałem; pokaż każdy krok.\n4. Korekty obsady przy opóźnionym siewie lub złych warunkach proponuj tylko jako pytanie do hodowcy/doradcy i oznacz [DO WERYFIKACJI].\n5. Nie wymyślaj dawek, limitów prawnych, norm, terminów, współczynników ani kwot — używaj wyłącznie liczb, które podałem. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a wszystko, co trzeba sprawdzić w aktualnych przepisach, etykiecie lub u doradcy — [DO WERYFIKACJI].\n6. Każde obliczenie pokaż krok po kroku, z jednostkami, tak żebym mógł je sprawdzić na kalkulatorze.\n\nFORMAT WYNIKU:\nA) Karta pola i odmiany (dane wejściowe ze źródłem).\nB) Obliczenie normy wysiewu w kg/ha krok po kroku.\nC) Zapotrzebowanie na materiał siewny na pole (kg, worki/big bagi).\nD) Plan prac: termin, głębokość i ustawienia do sprawdzenia próbą kręconą.\nE) Ryzyka i luki do uzupełnienia.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przelicz normę dla drugiej partii nasion z innym MTZ.", "Policz zapotrzebowanie na wszystkie pola z tą odmianą.", "Zrób instrukcję próby kręconej dla operatora siewnika.", "Przelicz normę przy polowej wschodów niższej o 10 punktów.", "Dodaj tabelę z ilością nasion w workach po 25 kg.", "Przygotuj krótką kartkę dla traktorzysty: pole, odmiana, norma, głębokość.", "Porównaj normę wysiewu dla dwóch odmian z listy, które rozważam.", "Wypisz, o co dopytać hodowcę przy siewie opóźnionym.", "Dodaj rubrykę na zaprawę nasienną z etykiety, którą podam.", "Zapisz plan jako tabelę do ewidencji prac polowych."], "checklista": ["MTZ i zdolność kiełkowania przepisane z etykiety danej partii.", "Obsada docelowa pochodzi z karty odmiany, COBORU lub od hodowcy.", "Polowa wschodów realna dla warunków pola.", "Norma wysiewu sprawdzona próbą kręconą na siewniku.", "Ilość materiału siewnego wystarcza na całą powierzchnię z zapasem.", "Termin siewu zgodny z zaleceniami dla odmiany i regionu."], "uwaga": "", "przyklad": {"wejscie": "Pole Długie, 18 i pół hektara, po rzepaku, ziemia dobra. Siejemy pszenicę ozimą, odmianę jakościową z listy PDO na nasze województwo. Hodowca w karcie daje obsadę 350 roślin na metr przy terminie optymalnym, termin optymalny dla nas wpiszę, bo nie mam kartki przy sobie. Nasiona kwalifikowane, na etykiecie MTZ 45 gram, zdolność kiełkowania 92%. Siewnik 4 metry, chcemy siać 25–30 września. Po orce, gleba wilgotna, trochę brył, u nas zwykle wschodzi około 85%. Ile kilo na hektar i ile worków po 25 kilo zamówić? I czy przy siewie pod koniec września coś zmieniać?", "wynik": "PLAN SIEWU – pole »Długie«, 18,5 ha, pszenica ozima\n\nA) Dane wejściowe\n| Parametr | Wartość | Źródło |\n| Obsada docelowa | 350 roślin/m² | karta hodowcy |\n| MTZ | 45 g | etykieta partii |\n| Zdolność kiełkowania | 92% | etykieta partii |\n| Polowa wschodów | 85% | doświadczenie gospodarstwa [ZAŁOŻENIE] |\n| Optymalny termin siewu | [DO UZUPEŁNIENIA – z karty odmiany] | hodowca |\n\nB) Norma wysiewu\n1. Masa nasion na m²: 350 × 45 g / 1000 = 15,75 g/m² = 157,5 kg/ha\n2. Korekta o zdolność kiełkowania: 157,5 / 0,92 = 171,2 kg/ha\n3. Korekta o polową wschodów: 171,2 / 0,85 = 201,4 kg/ha\nNorma do ustawienia: ok. 201 kg/ha\n\nC) Materiał siewny\n201,4 kg/ha × 18,5 ha = 3 725,9 kg ≈ 3,73 t\nW workach po 25 kg: 3 725,9 / 25 = 149,0 → 150 worków [ZAŁOŻENIE: worki 25 kg – sprawdzić u dostawcy]\n\nD) Plan prac\n- Termin: 25–30 września – zgodność z optymalnym terminem dla odmiany [DO WERYFIKACJI].\n- Przed siewem próba kręcona na siewniku 4 m dla 201 kg/ha.\n- Bryły po orce: rozważyć dodatkowy przejazd agregatem, bo mogą obniżyć polową wschodów poniżej 85%.\n\nE) Do sprawdzenia: czy przy siewie po 30 września hodowca zaleca korektę obsady [DO WERYFIKACJI].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "2.07", "nazwa": "Plan zagospodarowania nawozów naturalnych", "tag": "NAWOZY NATURALNE", "co_robi": "Rozdziela obornik i gnojowicę na pola, sprawdza limit 170 kg N/ha z nawozów naturalnych w średniej gospodarstwa i pokazuje, czy pojemność przechowalników wystarcza. Okresy zakazu i odległości bierze tylko od Ciebie i oznacza do weryfikacji.", "kiedy": "Gdy gospodarstwo z produkcją zwierzęcą musi rozplanować wywóz gnojowicy lub obornika, przygotować się do kontroli albo powiększa stado.", "brief": [{"pole": "Gospodarstwo i obsada zwierząt", "opis": "Zwierzęta i UR, np. „tucz 1 200 szt./rok, 52 ha UR, gm. Kłodawa”."}, {"pole": "Produkcja nawozów naturalnych", "opis": "Rodzaj i ilość rocznie, np. „gnojowica świńska 1 800 m³/rok; obornika brak”."}, {"pole": "Zawartość azotu", "opis": "Z analizy lub tabel, które masz, np. „gnojowica 3,5 kg N/m³ – analiza z laboratorium, kwiecień”."}, {"pole": "Pola do nawożenia", "opis": "Pola, uprawy, odległości od wód i zabudowań, np. „»Za stodołą« 15 ha kukurydza, 30 m od rowu melioracyjnego”."}, {"pole": "Okresy i odległości", "opis": "Okresy zakazu i wymagane odległości z aktualnego Programu azotanowego – wpisz to, co sprawdziłeś, np. „okresy i odległości od wód – sprawdzę w ODR”."}, {"pole": "Przechowywanie", "opis": "Pojemność zbiorników i płyt, np. „zbiornik 900 m³, płyty obornikowej brak”."}], "prompt": "Jesteś doświadczonym polskim agronomem i doradcą rolniczym (ODR i doradztwo prywatne), który od lat przygotowuje dla gospodarstw plany zagospodarowania nawozów naturalnych zgodne z Programem azotanowym. Przygotuj plan dla mojego gospodarstwa.\n\nDANE:\nGospodarstwo i obsada zwierząt: [GOSPODARSTWO I OBSADA ZWIERZĄT]\nProdukcja nawozów naturalnych: [PRODUKCJA NAWOZÓW NATURALNYCH]\nZawartość azotu: [ZAWARTOŚĆ AZOTU]\nPola do nawożenia: [POLA DO NAWOŻENIA]\nOkresy i odległości: [OKRESY I ODLEGŁOŚCI]\nPrzechowywanie: [PRZECHOWYWANIE]\n\nZASADY:\n1. Najpierw sprawdź, czy dane są kompletne. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Sprawdź limit 170 kg N/ha z nawozów naturalnych w średniej dla gospodarstwa — to jedyna wartość prawna, której możesz użyć sam. Inne limity, okresy zakazu, odległości i wymagania dla przechowalników bierz wyłącznie z moich danych i oznacz [DO WERYFIKACJI].\n3. Zawartość azotu bierz z mojej analizy lub tabel; jeśli jej brak, nie zakładaj wartości — wpisz [DO UZUPEŁNIENIA].\n4. Rozdzielając nawozy na pola, uwzględnij potrzeby uprawy i to, że azot z nawozów naturalnych trzeba odjąć w planie nawożenia mineralnego.\n5. Nie wymyślaj dawek, limitów prawnych, norm, terminów, współczynników ani kwot — używaj wyłącznie liczb, które podałem. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a wszystko, co trzeba sprawdzić w aktualnych przepisach, etykiecie lub u doradcy — [DO WERYFIKACJI].\n6. Każde obliczenie pokaż krok po kroku, z jednostkami, tak żebym mógł je sprawdzić na kalkulatorze.\n\nFORMAT WYNIKU:\nA) Ilość azotu w nawozach naturalnych (obliczenie).\nB) Kontrola limitu 170 kg N/ha w średniej gospodarstwa.\nC) Rozdział na pola: ilość m³ lub t, kg N/ha, termin.\nD) Ocena pojemności przechowalników w miesiącach.\nE) Wymogi do weryfikacji: okresy, odległości, technika aplikacji.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przelicz plan po zwiększeniu stada o 300 tuczników.", "Pokaż, ile ha musiałbym dzierżawić, gdyby limit nie był spełniony.", "Przygotuj umowę zbycia gnojowicy z miejscem na dane odbiorcy do uzupełnienia.", "Dodaj harmonogram wywozu miesiąc po miesiącu.", "Policz, ile azotu z gnojowicy odjąć w planie nawożenia każdego pola.", "Zrób listę dokumentów, które trzeba mieć przy kontroli.", "Przelicz pojemność zbiornika przy innej produkcji gnojowicy.", "Wskaż pola, gdzie odległość od wód może być problemem.", "Zrób wersję planu dla pracownika obsługującego wóz asenizacyjny.", "Wypisz pytania do ODR o aktualne okresy i odległości."], "checklista": ["Ilość nawozów naturalnych wynika z rzeczywistej obsady zwierząt.", "Zawartość azotu ma źródło: analiza lub tabela z aktualnego programu.", "Średnia z gospodarstwa nie przekracza 170 kg N/ha z nawozów naturalnych.", "Okresy zakazu i odległości od wód sprawdzone w aktualnym Programie azotanowym.", "Pojemność przechowalników zweryfikowana z wymaganiami.", "Azot z nawozów naturalnych odjęty w planie nawożenia mineralnego.", "Umowy zbycia nawozów naturalnych są podpisane, jeśli dotyczy."], "uwaga": "Okresy stosowania, odległości od wód i zabudowań oraz wymagania dla zbiorników sprawdź w obowiązującym Programie azotanowym lub w ODR. Jedyna stała, której używa aplikacja, to limit 170 kg N/ha z nawozów naturalnych.", "przyklad": {"wejscie": "Tucz około 1200 sztuk rocznie, 52 hektary UR, gmina Kłodawa. Gnojowicy wychodzi 1800 kubików na rok, obornika nie mam. Analiza z kwietnia: 3,5 kg azotu na kubik. Pola: Za stodołą 15 ha pod kukurydzę, Działka 112/3 – 20 ha pszenica, Długie 17 ha rzepak. Za stodołą jest 30 metrów od rowu. Zbiornik 900 kubików. Okresy i odległości jeszcze sprawdzę w ODR. Czy mieszczę się w limicie i jak to rozłożyć na pola? I czy zbiornik mi wystarczy na zimę? Kukurydza ma dostać najwięcej, bo dobrze reaguje.", "wynik": "PLAN ZAGOSPODAROWANIA GNOJOWICY – gm. Kłodawa, 52 ha UR\n\nA) Azot w gnojowicy\n1 800 m³ × 3,5 kg N/m³ = 6 300 kg N/rok\n\nB) Limit\n6 300 kg N / 52 ha = 121,2 kg N/ha – średnia gospodarstwa poniżej 170 kg N/ha. Limit spełniony.\n\nC) Rozdział na pola [ZAŁOŻENIE: podział wg potrzeb upraw, do korekty w planie nawożenia]\n| Pole | ha | Uprawa | m³ | kg N | kg N/ha |\n| Za stodołą | 15 | kukurydza | 750 | 750 × 3,5 = 2 625 | 175,0 |\n| Działka 112/3 | 20 | pszenica | 600 | 2 100 | 105,0 |\n| Długie | 17 | rzepak | 450 | 1 575 | 92,6 |\n| Razem | 52 | | 1 800 | 6 300 | 121,2 |\nUwaga: na polu Za stodołą wychodzi 175 kg N/ha – średnia gospodarstwa jest w limicie, ale czy dopuszczalna jest taka dawka na jednym polu [DO WERYFIKACJI] w aktualnym programie.\n\nD) Przechowywanie\nProdukcja miesięczna: 1 800 / 12 = 150 m³. Zbiornik 900 m³ / 150 = 6 miesięcy. Wymagana pojemność w miesiącach [DO WERYFIKACJI].\n\nE) Do sprawdzenia w ODR\n- Okresy zakazu stosowania gnojowicy [DO UZUPEŁNIENIA]\n- Wymagana odległość od rowu przy polu Za stodołą (obecnie 30 m) [DO WERYFIKACJI]\n- Technika aplikacji i czas wymieszania z glebą [DO WERYFIKACJI]\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "2.08", "nazwa": "Plan nawożenia dolistnego i mikroelementów", "tag": "NAWOŻENIE DOLISTNE", "co_robi": "Na podstawie analiz gleby lub roślin i obserwacji z pola układa plan dolistnego dokarmiania: który składnik, w jakiej fazie BBCH, z jakim zabiegiem połączyć i ile nawozu potrzeba. Dawki bierze z etykiet, które podajesz.", "kiedy": "Gdy analiza liści lub gleby pokazała niedobór mikroelementu, w polu widać objawy, a rolnik chce dołożyć nawóz do najbliższego zabiegu fungicydowego.", "brief": [{"pole": "Pole i uprawa", "opis": "Pole, ha, roślina, faza BBCH, np. „»Przy lesie« 24 ha, rzepak ozimy, BBCH 30–32”."}, {"pole": "Wyniki analiz", "opis": "Analiza gleby lub roślin z oceną laboratorium, np. „analiza liści: bor – niska zawartość, siarka – optymalna wg laboratorium”."}, {"pole": "Objawy w polu", "opis": "Co widać, np. „pojedyncze rośliny z pustą szyjką korzeniową, jaśniejsze liście na pagórkach”."}, {"pole": "Planowane zabiegi ochrony", "opis": "Zabiegi, z którymi można łączyć, np. „fungicyd w rzepaku w BBCH 31–33, środek z etykiety”."}, {"pole": "Dostępne nawozy", "opis": "Nawozy dolistne i dawki z ich etykiet, np. „nawóz borowy, dawka z etykiety, którą wybrałem: 1,5 l/ha”."}, {"pole": "Termin i faza BBCH", "opis": "Kiedy planujesz, np. „następny tydzień, przy BBCH 31”."}], "prompt": "Jesteś doświadczonym polskim agronomem i doradcą rolniczym (ODR i doradztwo prywatne), który od lat przygotowuje dla gospodarstw plany nawożenia dolistnego i dokarmiania mikroelementami na podstawie analiz. Przygotuj plan dla mojego pola.\n\nDANE:\nPole i uprawa: [POLE I UPRAWA]\nWyniki analiz: [WYNIKI ANALIZ]\nObjawy w polu: [OBJAWY W POLU]\nPlanowane zabiegi ochrony: [PLANOWANE ZABIEGI OCHRONY]\nDostępne nawozy: [DOSTĘPNE NAWOZY]\nTermin i faza BBCH: [TERMIN I FAZA BBCH]\n\nZASADY:\n1. Najpierw sprawdź, czy dane są kompletne. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Rekomenduj składnik tylko wtedy, gdy uzasadnia go analiza lub obserwacja, którą podałem; objawy wizualne opisz jako hipotezę do potwierdzenia [DO WERYFIKACJI].\n3. Dawki i fazy stosowania bierz wyłącznie z etykiet nawozów, które podałem. Nie podawaj dawek z pamięci.\n4. Mieszanie z środkami ochrony roślin dopuszczaj tylko wtedy, gdy pozwala na to etykieta obu produktów — oznacz [DO WERYFIKACJI] i przypomnij o próbie mieszania oraz wpisie do ewidencji zabiegów.\n5. Nie wymyślaj dawek, limitów prawnych, norm, terminów, współczynników ani kwot — używaj wyłącznie liczb, które podałem. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a wszystko, co trzeba sprawdzić w aktualnych przepisach, etykiecie lub u doradcy — [DO WERYFIKACJI].\n6. Każde obliczenie pokaż krok po kroku, z jednostkami, tak żebym mógł je sprawdzić na kalkulatorze.\n\nFORMAT WYNIKU:\nA) Diagnoza: składnik, dowód (analiza/objaw), pewność.\nB) Plan zabiegów: termin, BBCH, nawóz, dawka z etykiety, łączenie.\nC) Obliczenie ilości nawozu na pole i ilości cieczy roboczej.\nD) Ryzyka (mieszalność, warunki pogodowe, fitotoksyczność).\nE) Lista do uzupełnienia i sprawdzenia.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dodaj drugi zabieg w późniejszej fazie, jeśli etykieta na to pozwala.", "Policz plan dla wszystkich pól rzepaku w gospodarstwie.", "Zrób kartkę dla operatora opryskiwacza z kolejnością wlewania.", "Przygotuj wpis do ewidencji zabiegów z miejscem na dane z etykiety.", "Zaproponuj, jaką analizę roślin zrobić w kolejnym sezonie.", "Wypisz objawy niedoboru, na które warto zwracać uwagę przy lustracji.", "Przelicz ilość nawozu przy innej dawce z etykiety.", "Porównaj koszt dwóch nawozów przy cenach, które podam.", "Napisz rolnikowi prosto, po co ten zabieg i czego się spodziewać.", "Wypisz pytania do producenta nawozu o mieszalność."], "checklista": ["Niedobór potwierdzony analizą, a nie tylko objawem.", "Dawka i faza stosowania zgodne z etykietą nawozu.", "Mieszalność z środkiem ochrony roślin sprawdzona na obu etykietach.", "Próba mieszania wykonana przed napełnieniem opryskiwacza.", "Warunki pogodowe w dniu zabiegu odpowiednie.", "Zabieg wpisany do ewidencji, jeśli łączony ze środkiem ochrony roślin."], "uwaga": "Dawki nawozów i zasady mieszania ze środkami ochrony roślin bierz wyłącznie z etykiet. Łączenie nawozu ze środkiem ochrony roślin wymaga zgodności obu etykiet i wpisu zabiegu do ewidencji.", "przyklad": {"wejscie": "Pole Przy lesie, 24 hektary, rzepak ozimy, teraz BBCH 30–32. Zrobiliśmy analizę liści, laboratorium napisało: bor niska zawartość, siarka optymalna. Na pagórkach jaśniejsze liście, gdzieniegdzie rośliny z pustą szyjką korzeniową. W przyszłym tygodniu, przy BBCH 31, jedzie fungicyd zarejestrowany w rzepaku. Mam nawóz borowy, na etykiecie jest zakres, wybrałem 1,5 litra na hektar. Wody leję 200 litrów na hektar. Czy dać bor razem z fungicydem i ile kupić? Opryskiwacz ma zbiornik, ale nie pamiętam ile, sprawdzę. Pryskać chcę rano, bez wiatru.", "wynik": "PLAN NAWOŻENIA DOLISTNEGO – pole »Przy lesie«, 24 ha, rzepak ozimy\n\nA) Diagnoza\n| Składnik | Dowód | Ocena |\n| Bor | analiza liści: niska zawartość | potwierdzony analizą |\n| Siarka | analiza liści: optymalna | bez zabiegu |\nObjawy (pusta szyjka korzeniowa, jaśniejsze liście na pagórkach) mogą wiązać się z niedoborem boru, ale też z innymi przyczynami [DO WERYFIKACJI] przy lustracji.\n\nB) Plan zabiegu\n| Termin | BBCH | Nawóz | Dawka | Łączenie |\n| przyszły tydzień | 31 | nawóz borowy | 1,5 l/ha (wybrana przez rolnika z zakresu na etykiecie) | z fungicydem – mieszalność [DO WERYFIKACJI] na obu etykietach |\n\nC) Ilości\n- Nawóz: 1,5 l/ha × 24 ha = 36 l\n- Ciecz robocza: 200 l/ha × 24 ha = 4 800 l\n- Liczba napełnień: [DO UZUPEŁNIENIA – pojemność zbiornika opryskiwacza]\n\nD) Ryzyka\n- Brak zgody w etykiecie na mieszanie = zabiegi osobno.\n- Przed napełnieniem próba mieszania w małym naczyniu.\n- Zabieg łączony wpisać do ewidencji zabiegów ochrony roślin [DO UZUPEŁNIENIA – nazwa i dawka fungicydu z etykiety].\n- Czy etykieta dopuszcza drugi zabieg borem w późniejszej fazie [DO WERYFIKACJI].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "2.09", "nazwa": "Struktura zasiewów i plan produkcji na sezon", "tag": "PLAN PRODUKCJI", "co_robi": "Zbiera plan sezonu w jednym dokumencie: struktura zasiewów w ha i %, spodziewana produkcja w tonach, przychód przy Twoich cenach, obciążenie magazynu i sprzętu. Wszystkie liczby liczy z Twoich danych.", "kiedy": "Przed sezonem, gdy trzeba zdecydować, ile czego siać, rozmawiać z bankiem o kredycie obrotowym albo przygotować plan dla wspólników.", "brief": [{"pole": "Gospodarstwo i zasoby", "opis": "UR, sprzęt, ludzie, magazyn, np. „120 ha UR, gm. Kutno; kombajn własny, siewnik 4 m, 2 osoby; magazyn 400 t”."}, {"pole": "Pola i grunty", "opis": "Pola, klasy, własność/dzierżawa, np. „8 pól, IIIa–IVb, 40 ha w dzierżawie do 2028”."}, {"pole": "Planowane uprawy", "opis": "Wstępna struktura, np. „pszenica 50 ha, rzepak 30 ha, kukurydza 25 ha, jęczmień jary 15 ha”."}, {"pole": "Spodziewane plony i ceny", "opis": "Twoje plony i ceny, np. „pszenica 7,5 t/ha po 850 zł/t; rzepak 3,5 t/ha po 1 900 zł/t”."}, {"pole": "Rynek i umowy", "opis": "Kontrakty i odbiorcy, np. „rzepak – umowa z zakładem na 60 t, kukurydza – suszarnia w 15 km”."}, {"pole": "Ograniczenia", "opis": "Płodozmian, ekoschematy, terminy, finanse, np. „rzepak nie częściej niż co 4 lata; kredyt obrotowy do marca”."}], "prompt": "Jesteś doświadczonym polskim agronomem i doradcą rolniczym (ODR i doradztwo prywatne), który od lat przygotowuje dla gospodarstw plany produkcji roślinnej i struktury zasiewów dla gospodarstw towarowych. Przygotuj plan produkcji na sezon.\n\nDANE:\nGospodarstwo i zasoby: [GOSPODARSTWO I ZASOBY]\nPola i grunty: [POLA I GRUNTY]\nPlanowane uprawy: [PLANOWANE UPRAWY]\nSpodziewane plony i ceny: [SPODZIEWANE PLONY I CENY]\nRynek i umowy: [RYNEK I UMOWY]\nOgraniczenia: [OGRANICZENIA]\n\nZASADY:\n1. Najpierw sprawdź, czy dane są kompletne. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Plony i ceny bierz wyłącznie z moich danych; nie podawaj cen rynkowych z pamięci. Brakującą cenę oznacz [DO UZUPEŁNIENIA].\n3. Sprawdź spójność planu: suma upraw = powierzchnia UR, produkcja vs. umowy, magazyn i suszarnia, szczyty prac. Każdą niezgodność wskaż wprost.\n4. Wymogi płodozmianu, ekoschematów i warunkowości uwzględniaj tylko w zakresie, który podałem; oznacz je [DO WERYFIKACJI] w aktualnych zasadach ARiMR.\n5. Nie wymyślaj dawek, limitów prawnych, norm, terminów, współczynników ani kwot — używaj wyłącznie liczb, które podałem. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a wszystko, co trzeba sprawdzić w aktualnych przepisach, etykiecie lub u doradcy — [DO WERYFIKACJI].\n6. Każde obliczenie pokaż krok po kroku, z jednostkami, tak żebym mógł je sprawdzić na kalkulatorze.\n\nFORMAT WYNIKU:\nA) Struktura zasiewów: uprawa, ha, % UR (z obliczeniem).\nB) Produkcja: ha × plon = tony, przychód przy podanej cenie.\nC) Bilans zbytu i magazynu: umowy, wolne tony, pojemność.\nD) Ryzyka i wąskie gardła sezonu.\nE) Decyzje do podjęcia i dane do uzupełnienia.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Zrób wariant z 10 ha rzepaku mniej i 10 ha pszenicy więcej.", "Policz przychód przy cenach niższych o 10%.", "Dodaj koszty bezpośrednie na hektar, które ci podam, i policz nadwyżkę.", "Przygotuj wersję planu dla banku na jedną stronę.", "Zrób harmonogram prac na sezon miesiąc po miesiącu.", "Sprawdź, czy magazyn wystarczy, jeśli sprzedam pszenicę dopiero w marcu.", "Policz, ile ton rzepaku zostaje poza umową.", "Dopisz plan zakupów nawozów i materiału siewnego w tonach.", "Porównaj tę strukturę z zeszłorocznym planem, który wkleję.", "Wypisz, co trzeba sprawdzić w zasadach ekoschematów przed wnioskiem."], "checklista": ["Suma powierzchni upraw równa się powierzchni UR.", "Plony oczekiwane oparte na średniej z gospodarstwa.", "Ceny pochodzą z aktualnych ofert lub umów, nie z pamięci.", "Ilości w umowach pokryte planowaną produkcją z zapasem.", "Pojemność magazynu i dostęp do suszarni sprawdzone.", "Plan zgodny z płodozmianem i wymogami ARiMR, które dotyczą gospodarstwa."], "uwaga": "Ceny, stawki dopłat i wymogi ekoschematów zmieniają się co sezon. Plan opiera się na Twoich liczbach — zweryfikuj je przed rozmową z bankiem lub złożeniem wniosku.", "przyklad": {"wejscie": "Gospodarstwo 120 hektarów pod Kutnem. Planuję: pszenica 50 ha, liczę 7,5 tony, cena 850 zł; rzepak 30 ha, 3,5 tony po 1900 zł; kukurydza 25 ha, 9 ton, cena jeszcze nie wiem; jęczmień jary 15 ha, 6 ton po 750 zł. Rzepak mam umowę z zakładem na 60 ton. Magazyn 400 ton, kukurydzę wożę na suszarnię 15 km. Kredyt obrotowy do marca, więc część zboża muszę sprzedać od razu. Bank pyta o plan, więc potrzebuję czegoś porządnego. Zrób mi plan na sezon.", "wynik": "PLAN PRODUKCJI – sezon 2027, gospodarstwo 120 ha UR, pow. kutnowski\n\nA) Struktura zasiewów\n| Uprawa | ha | % UR |\n| Pszenica | 50 | 50 / 120 = 41,7% |\n| Rzepak | 30 | 25,0% |\n| Kukurydza | 25 | 20,8% |\n| Jęczmień jary | 15 | 12,5% |\n| Razem | 120 | 100% |\n\nB) Produkcja i przychód\n| Uprawa | Obliczenie | t | Cena zł/t | Przychód zł |\n| Pszenica | 50 × 7,5 | 375 | 850 | 318 750 |\n| Rzepak | 30 × 3,5 | 105 | 1 900 | 199 500 |\n| Kukurydza | 25 × 9 | 225 | [DO UZUPEŁNIENIA] | [DO UZUPEŁNIENIA] |\n| Jęczmień | 15 × 6 | 90 | 750 | 67 500 |\nRazem bez kukurydzy: 585 750 zł.\n\nC) Zbyt i magazyn\n- Rzepak: 105 t − 60 t umowy = 45 t do sprzedaży poza umową.\n- Zboża do magazynu: 375 + 90 = 465 t > 400 t pojemności → min. 65 t trzeba sprzedać ze żniw lub przechować poza gospodarstwem.\n- Kukurydza 225 t – suszarnia 15 km, terminy przyjęć [DO UZUPEŁNIENIA].\n\nD) Ryzyka\n- Spłata kredytu do marca – sprzedaż części pszenicy ze żniw [ZAŁOŻENIE].\n- Brak ceny kukurydzy – przychód niepełny.\n- Zgodność struktury z wymogami ekoschematów [DO WERYFIKACJI].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "2.10", "nazwa": "Dobór odmian na podstawie wyników PDO/COBORU", "tag": "DOBÓR ODMIAN", "co_robi": "Porównuje odmiany na podstawie wyników Porejestrowego Doświadczalnictwa Odmianowego (PDO) i danych COBORU, które przepisujesz, oraz Twoich kryteriów i doświadczeń. Daje ranking z uzasadnieniem i ryzykami, bez dopisywania wyników z pamięci.", "kiedy": "Przed zakupem materiału siewnego, gdy rolnik waha się między kilkoma odmianami albo pyta, czy zostać przy tej, którą zna.", "brief": [{"pole": "Gospodarstwo i warunki", "opis": "Region, gleby, poziom agrotechniki, np. „gm. Kietrz, woj. opolskie; gleby kompleksu pszennego bardzo dobrego; intensywna agrotechnika”."}, {"pole": "Gatunek i kierunek", "opis": "Co i na jaki rynek, np. „pszenica ozima, ziarno na młyn – klasa A”."}, {"pole": "Wyniki PDO", "opis": "Wyniki PDO/COBORU dla Twojego województwa, przepisane z publikacji, np. „plon % wzorca: odmiana A 104, B 101, C 98 (2 lata)”."}, {"pole": "Odmiany brane pod uwagę", "opis": "Lista kandydatów i ich cechy z kart, np. „A – jakościowa, odporność na rdzę 7; B – A, zimotrwałość 5”."}, {"pole": "Kryteria wyboru", "opis": "Co jest najważniejsze, np. „plon, klasa jakości, zimotrwałość, odporność na choroby liści”."}, {"pole": "Doświadczenia własne", "opis": "Co siałeś i jak wyszło, np. „B siałem 2 lata, dobrze plonowała, ale wymarzła na »Długim«”."}], "prompt": "Jesteś doświadczonym polskim agronomem i doradcą rolniczym (ODR i doradztwo prywatne), który od lat przygotowuje dla gospodarstw rekomendacje doboru odmian na podstawie wyników PDO i COBORU. Pomóż mi wybrać odmiany do mojego gospodarstwa.\n\nDANE:\nGospodarstwo i warunki: [GOSPODARSTWO I WARUNKI]\nGatunek i kierunek: [GATUNEK I KIERUNEK]\nWyniki PDO: [WYNIKI PDO]\nOdmiany brane pod uwagę: [ODMIANY BRANE POD UWAGĘ]\nKryteria wyboru: [KRYTERIA WYBORU]\nDoświadczenia własne: [DOŚWIADCZENIA WŁASNE]\n\nZASADY:\n1. Najpierw sprawdź, czy dane są kompletne. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Porównuj wyłącznie wyniki PDO/COBORU i cechy odmian, które przepisałem. Nie uzupełniaj plonów, ocen odporności ani zimotrwałości z pamięci — brakujące oznacz [DO UZUPEŁNIENIA].\n3. Zwracaj uwagę na liczbę lat badań i to, czy wyniki pochodzą z mojego województwa lub rejonu; wyniki z jednego roku oznacz jako mniej pewne.\n4. Ułóż ranking według moich kryteriów i ich wag; jeśli wagi nie podałem, przyjmij je jawnie jako [ZAŁOŻENIE].\n5. Nie wymyślaj dawek, limitów prawnych, norm, terminów, współczynników ani kwot — używaj wyłącznie liczb, które podałem. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a wszystko, co trzeba sprawdzić w aktualnych przepisach, etykiecie lub u doradcy — [DO WERYFIKACJI].\n6. Każde obliczenie pokaż krok po kroku, z jednostkami, tak żebym mógł je sprawdzić na kalkulatorze.\n\nFORMAT WYNIKU:\nA) Tabela porównawcza odmian: plon względny, lata badań, kluczowe cechy, źródło.\nB) Ocena według kryteriów (punktacja z obliczeniem).\nC) Ranking z uzasadnieniem i wskazaniem, na które pole która odmiana.\nD) Ryzyka i co sprawdzić (lista odmian zalecanych, dostępność materiału).\nE) Dane brakujące do pełnej oceny.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Zmień wagi: zimotrwałość ważniejsza niż plon.", "Dodaj czwartą odmianę, której dane ci przepiszę.", "Rozdziel odmiany na pola według ich warunków.", "Przygotuj krótkie uzasadnienie wyboru dla rolnika.", "Porównaj odmiany tylko w kategorii jakościowej.", "Wypisz, czego szukać w publikacji PDO dla mojego województwa.", "Zaproponuj wariant z dwiema odmianami dla rozłożenia ryzyka.", "Dodaj kolumnę z ceną materiału siewnego, którą podam.", "Zrób tabelę do porównania z wynikami z poprzedniego roku.", "Wypisz pytania do hodowcy o wybraną odmianę."], "checklista": ["Wyniki PDO przepisane z aktualnej publikacji dla właściwego województwa.", "Liczba lat badań odnotowana przy każdej odmianie.", "Cechy odmian (odporności, zimotrwałość, jakość) z karty odmiany lub COBORU.", "Kryteria i wagi odpowiadają celom gospodarstwa.", "Sprawdzona dostępność kwalifikowanego materiału siewnego.", "Doświadczenia własne uwzględnione, ale nie ważniejsze niż wieloletnie dane."], "uwaga": "", "przyklad": {"wejscie": "Gmina Kietrz, gleby bardzo dobre, intensywnie. Szukam pszenicy ozimej na młyn, klasa A. Z PDO dla opolskiego przepisałem plon w procentach wzorca: odmiana A 104 (2 lata), B 101 (3 lata), C 98 (1 rok). Z kart COBORU: A odporność na rdzę brunatną 7, zimotrwałość 4,5; B rdza 6, zimotrwałość 5; C rdza 8, zimotrwałość nie mam. B siałem dwa lata, plonowała dobrze, ale na Długim w zeszłą zimę trochę wymarzła. Najważniejsze dla mnie: plon i zimotrwałość, potem rdza. Czy zostać przy B, czy zmienić?", "wynik": "DOBÓR ODMIAN – pszenica ozima jakościowa (A), gm. Kietrz\n\nA) Porównanie\n| Odmiana | Plon % wzorca | Lata PDO | Rdza brunatna | Zimotrwałość |\n| A | 104 | 2 | 7 | 4,5 |\n| B | 101 | 3 | 6 | 5 |\n| C | 98 | 1 | 8 | [DO UZUPEŁNIENIA] |\n\nB) Ocena [ZAŁOŻENIE: wagi plon 40%, zimotrwałość 40%, rdza 20%; punktacja = wynik odmiany / najlepszy wynik × 100]\n- A: plon 104/104 × 100 = 100; zimotrwałość 4,5/5 × 100 = 90; rdza 7/8 × 100 = 87,5\n  Suma: 0,4 × 100 + 0,4 × 90 + 0,2 × 87,5 = 40 + 36 + 17,5 = 93,5\n- B: plon 101/104 × 100 = 97,1; zimotrwałość 100; rdza 6/8 × 100 = 75\n  Suma: 0,4 × 97,1 + 0,4 × 100 + 0,2 × 75 = 38,8 + 40 + 15 = 93,8\n- C: brak zimotrwałości – nie da się policzyć [DO UZUPEŁNIENIA]; tylko 1 rok PDO – wynik mało pewny.\n\nC) Ranking\n1. B (93,8) – najlepsza zimotrwałość w zestawieniu i 3 lata wyników; znana w gospodarstwie.\n2. A (93,5) – wyższy plon, ale słabsza zimotrwałość; lepiej na pola osłonięte niż na »Długie«.\nRóżnica jest minimalna – rozsądny wariant to obie odmiany na różnych polach.\n\nD) Do sprawdzenia\n- Czy odmiany są na liście zalecanych do uprawy w woj. opolskim [DO WERYFIKACJI].\n- Przyczyna wymarznięcia B na »Długim« (termin siewu, stanowisko) [DO WERYFIKACJI].\n- Dostępność kwalifikowanego materiału siewnego [DO UZUPEŁNIENIA].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}]}, {"dzial_nr": 3, "dzial": "Koszty, kalkulacje i marża", "opis": "Agronomia kończy się na polu, ale decyzja zapada przy kalkulatorze: ile kosztuje tona, czy ta cena się zwraca, czy brać dzierżawę, kupić maszynę albo trzymać zboże. Wpisujesz swoje faktury, ceny i plony, a dostajesz policzoną krok po kroku kalkulację do sprawdzenia – bez ani jednej wymyślonej kwoty.", "skills": [{"id": "3.01", "nazwa": "Koszt produkcji na hektar (uprawa)", "tag": "KOSZT NA HA", "co_robi": "Porządkuje wszystkie koszty uprawy w jedną tabelę na hektar, na całe pole i na tonę plonu. Rozdziela koszty bezpośrednie od mechanizacji i pozostałych, żeby było widać, gdzie uciekają pieniądze.", "kiedy": "Przed sezonem przy planowaniu albo zimą, gdy rolnik pyta, ile go naprawdę kosztuje tona pszenicy, a faktury leżą w segregatorze.", "brief": [{"pole": "Gospodarstwo i uprawa", "opis": "Gatunek, odmiana, pole, areał, np. „pszenica ozima Hondia, pole Za stodołą, 42 ha, gm. Kłodawa, pow. kolski”."}, {"pole": "Koszty materiałowe", "opis": "Twoje faktury lub plan na ha: materiał siewny, nawozy, środki ochrony, np. „nasiona 520 zł/ha, nawozy 1450 zł/ha, ochrona 980 zł/ha”."}, {"pole": "Mechanizacja i usługi", "opis": "Paliwo, usługi obce, np. „ON 380 zł/ha wg moich tankowań, kombajn z usługi 450 zł/ha”."}, {"pole": "Pozostałe koszty", "opis": "Ubezpieczenie, suszenie, transport, czynsz, praca najemna, np. „ubezpieczenie 60 zł/ha, ziemia własna”."}, {"pole": "Plon oczekiwany", "opis": "Twój plon z ostatnich lat albo plan, np. „7,5 t/ha, średnia z 3 lat na tym polu”."}, {"pole": "Cel kalkulacji", "opis": "Po co liczysz, np. „do rozmowy z bankiem” albo „żeby wiedzieć, od jakiej ceny zarabiam”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym (ekonomika gospodarstw, rachunek kosztów w produkcji roślinnej), który na co dzień liczy z rolnikami opłacalność upraw. Przygotuj kalkulację kosztu produkcji jednej uprawy.\n\nDANE:\nGospodarstwo i uprawa: [GOSPODARSTWO I UPRAWA]\nKoszty materiałowe: [KOSZTY MATERIAŁOWE]\nMechanizacja i usługi: [MECHANIZACJA I USŁUGI]\nPozostałe koszty: [POZOSTAŁE KOSZTY]\nPlon oczekiwany: [PLON OCZEKIWANY]\nCel kalkulacji: [CEL KALKULACJI]\n\nZASADY:\n1. Najpierw sprawdź dane. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 6 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj cen, plonów, stawek, dopłat ani kosztów i nie podawaj „średnich rynkowych”. Liczysz wyłącznie na moich liczbach. Brak danej oznacz [DO UZUPEŁNIENIA], wartość przyjętą przez ciebie [ZAŁOŻENIE], rzecz niepewną [DO WERYFIKACJI].\n3. Pokazuj obliczenia krok po kroku, z jednostkami (zł/ha, zł/t, t/ha), zaokrąglaj dopiero wynik końcowy.\n4. Grupuj koszty: materiałowe, mechanizacja i usługi, pozostałe. Każdą pozycję pokaż w zł/ha i zł na całe pole.\n5. Koszt jednostkowy licz jako sumę kosztów na ha podzieloną przez plon. Jeśli nie podałem plonu, nie zgaduj go.\n6. Wyraźnie zaznacz, czego w kalkulacji nie ma (np. amortyzacja, praca własna, czynsz), żeby nikt nie porównywał jej z pełnym kosztem.\n\nFORMAT WYNIKU:\nA) Tabela kosztów | pozycja | zł/ha | zł/pole | udział % |.\nB) Suma zł/ha, zł/pole i koszt na tonę, z obliczeniami.\nC) Trzy największe pozycje i pytania, które warto zadać przy każdej.\nD) Lista luk i założeń do uzupełnienia przed użyciem kalkulacji.\n\nNa końcu dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dodaj do kalkulacji amortyzację maszyn według wartości, które ci podam.", "Policz koszt na tonę dla plonu niższego i wyższego o 1 t/ha.", "Rozbij nawozy na poszczególne dawki i terminy z mojego planu nawożenia.", "Zrób z tego wersję do wniosku kredytowego dla banku.", "Porównaj ten koszt z kalkulacją z zeszłego roku, którą wkleję.", "Dopisz koszt pracy własnej według stawki godzinowej, którą podam.", "Przelicz wszystko dla całego areału tej uprawy w gospodarstwie.", "Wskaż pozycje, w których koszt na ha wydaje się nietypowy i wymaga sprawdzenia faktur.", "Przygotuj tabelę w formacie do wklejenia w Excel.", "Napisz krótkie podsumowanie dla rolnika w trzech zdaniach."], "checklista": ["Wszystkie kwoty pochodzą z faktur, cenników lub planu rolnika, a nie z pamięci AI.", "Jednostki się zgadzają: zł/ha, zł/pole, zł/t – bez mieszania netto i brutto.", "Areał pola zgadza się z wnioskiem lub ewidencją gruntów.", "Plon przyjęty do kosztu jednostkowego jest realny dla tego pola.", "Jasno opisano, czego kalkulacja nie obejmuje (amortyzacja, praca własna, czynsz).", "Luki oznaczone [DO UZUPEŁNIENIA] zostały uzupełnione przed wysłaniem."], "uwaga": "Kalkulacja opiera się wyłącznie na danych rolnika. Sprawdź, czy kwoty są netto czy brutto (VAT, rolnik ryczałtowy) – AI nie zna statusu podatkowego gospodarstwa.", "przyklad": {"wejscie": "Pszenica ozima Hondia, pole Za stodołą, 42 ha, gmina Kłodawa. Ziemia własna. Z faktur wychodzi mi na hektar: nasiona 520 zł, nawozy razem 1450, ochrona 980. Paliwo liczę 380 zł na hektar z tankowań, kombajn biorę z usługi za 450 zł/ha. Ubezpieczenie 60 zł/ha. Plon zakładam 7,5 tony, tyle mam średnio z trzech lat. Chcę wiedzieć, ile mnie kosztuje tona, bo skupy już dzwonią z ofertami. Wszystko netto. Amortyzacji na razie nie liczę, bo nie mam spisanych wartości maszyn, ciągnik ma już swoje lata. Pracy swojej też nie wliczaj. Pole jest równe, gleba klasy IIIa, przedplon rzepak. Zrób mi to w tabelce, żebym mógł pokazać synowi i w banku, jak przyjdzie do kredytu.", "wynik": "KOSZT PRODUKCJI – pszenica ozima, pole Za stodołą, 42 ha (kwoty netto)\n\n| pozycja | zł/ha | zł/pole | udział % |\n| nasiona | 520 | 21 840 | 13,5 |\n| nawozy | 1 450 | 60 900 | 37,8 |\n| ochrona | 980 | 41 160 | 25,5 |\n| paliwo | 380 | 15 960 | 9,9 |\n| usługa kombajnowa | 450 | 18 900 | 11,7 |\n| ubezpieczenie | 60 | 2 520 | 1,6 |\n| RAZEM | 3 840 | 161 280 | 100 |\n\nObliczenia:\n1. Materiałowe: 520 + 1 450 + 980 = 2 950 zł/ha\n2. Mechanizacja i usługi: 380 + 450 = 830 zł/ha\n3. Pozostałe: 60 zł/ha\n4. Razem: 2 950 + 830 + 60 = 3 840 zł/ha; × 42 ha = 161 280 zł\n5. Koszt tony: 3 840 zł/ha ÷ 7,5 t/ha = 512 zł/t\n\nNajwiększe pozycje: nawozy (37,8%) – sprawdź, czy dawki wynikają z planu nawożenia i analiz gleby; ochrona (25,5%) – ile zabiegów było faktycznie potrzebnych wg progów; usługa kombajnowa – czy cena obejmuje transport ziarna.\n\nCzego tu nie ma: amortyzacja ciągnika i maszyn [DO UZUPEŁNIENIA], koszt pracy własnej [DO UZUPEŁNIENIA], naprawy i serwis [DO UZUPEŁNIENIA]. To koszt bez tych pozycji – pełny koszt tony będzie wyższy niż 512 zł/t.\n\n[ZAŁOŻENIE] plon 7,5 t/ha jak średnia z 3 lat.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "3.02", "nazwa": "Kalkulacja nadwyżki bezpośredniej", "tag": "NADWYŻKA BEZPOŚREDNIA", "co_robi": "Liczy nadwyżkę bezpośrednią działalności: wartość produkcji minus koszty bezpośrednie, osobno bez dopłat i z dopłatami. Pozwala porównać uprawy na tym samym polu jedną miarą.", "kiedy": "Przy układaniu struktury zasiewów, gdy rolnik waha się między rzepakiem a pszenicą albo pyta, która uprawa „ciągnie” gospodarstwo.", "brief": [{"pole": "Działalność i areał", "opis": "Uprawa, pole, ha, np. „rzepak ozimy, Działka 112/3 i Pod lasem, razem 30 ha”."}, {"pole": "Plon i cena", "opis": "Twój plon i cena z umowy lub oferty, np. „3,6 t/ha, 1900 zł/t netto z kontraktu”."}, {"pole": "Koszty bezpośrednie", "opis": "Nasiona, nawozy, ochrona, inne zmienne na ha, np. „nasiona 450, nawozy 1700, ochrona 1250 zł/ha”."}, {"pole": "Dopłaty", "opis": "Kwoty, które sam wpisujesz do kalkulacji (np. z decyzji ARiMR z zeszłego roku), albo „nie wliczaj”."}, {"pole": "Produkty uboczne", "opis": "Słoma, poplon, inne przychody, np. „słoma zostaje na polu” albo „słoma sprzedana po … zł/ha”."}, {"pole": "Porównanie", "opis": "Z czym zestawić, np. „pszenica na tym samym polu: 7,5 t/ha, 850 zł/t, koszty 2950 zł/ha”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym (ekonomika gospodarstw, rachunek kosztów w produkcji roślinnej), który na co dzień liczy z rolnikami opłacalność upraw. Policz nadwyżkę bezpośrednią dla wskazanej działalności.\n\nDANE:\nDziałalność i areał: [DZIAŁALNOŚĆ I AREAŁ]\nPlon i cena: [PLON I CENA]\nKoszty bezpośrednie: [KOSZTY BEZPOŚREDNIE]\nDopłaty: [DOPŁATY]\nProdukty uboczne: [PRODUKTY UBOCZNE]\nPorównanie: [PORÓWNANIE]\n\nZASADY:\n1. Najpierw sprawdź dane. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 6 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj cen, plonów, stawek, dopłat ani kosztów i nie podawaj „średnich rynkowych”. Liczysz wyłącznie na moich liczbach. Brak danej oznacz [DO UZUPEŁNIENIA], wartość przyjętą przez ciebie [ZAŁOŻENIE], rzecz niepewną [DO WERYFIKACJI].\n3. Pokazuj obliczenia krok po kroku, z jednostkami (zł/ha, zł/t, t/ha), zaokrąglaj dopiero wynik końcowy.\n4. Nadwyżkę licz jako: wartość produkcji (plon × cena + produkty uboczne) minus koszty bezpośrednie. Pokaż wariant bez dopłat i z dopłatami.\n5. Dopłat nie szacuj sam. Jeśli je podałem, oznacz [DO WERYFIKACJI], bo zależą od aktualnych zasad kampanii ARiMR.\n6. Nie wliczaj do kosztów bezpośrednich amortyzacji ani kosztów ogólnych – napisz, że to nie jest dochód gospodarstwa.\n\nFORMAT WYNIKU:\nA) Tabela | pozycja | zł/ha | zł na areał |.\nB) Nadwyżka bezpośrednia bez dopłat i z dopłatami, z obliczeniami.\nC) Porównanie z drugą uprawą, jeśli podałem dane.\nD) Wnioski w 3 punktach i lista luk.\n\nNa końcu dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Policz nadwyżkę dla ceny niższej o 10% i wyższej o 10%.", "Dodaj trzecią uprawę do porównania na podstawie danych, które podam.", "Pokaż nadwyżkę w przeliczeniu na tonę plonu.", "Usuń dopłaty i pokaż, która uprawa broni się sama.", "Przelicz nadwyżkę dla całego gospodarstwa przy mojej strukturze zasiewów.", "Dodaj wartość słomy według ceny, którą ci podam.", "Zrób wykres słupkowy w formie tekstowej, który zrozumie rolnik.", "Policz, o ile musiałby wzrosnąć plon, żeby nadwyżka zrównała się z drugą uprawą.", "Napisz krótką notatkę dla rolnika z rekomendacją do decyzji.", "Przygotuj tabelę do wklejenia w arkusz kalkulacyjny."], "checklista": ["Plon i cena pochodzą od rolnika (umowa, oferta, wyniki z lat ubiegłych).", "Dopłaty wpisał rolnik i są oznaczone do weryfikacji z aktualnymi zasadami ARiMR.", "Koszty bezpośrednie nie zawierają amortyzacji ani kosztów ogólnych.", "Porównywane uprawy liczone są na tych samych zasadach (netto/brutto, ten sam areał).", "Produkty uboczne ujęte albo świadomie pominięte.", "Wyraźnie napisano, że nadwyżka bezpośrednia to nie dochód gospodarstwa."], "uwaga": "Dopłaty zmieniają się co kampanię – w kalkulacji używaj tylko kwot podanych przez rolnika i sprawdź je z aktualnymi zasadami ARiMR.", "przyklad": {"wejscie": "Rzepak na dwóch działkach, 112/3 i Pod lasem, razem 30 ha. Liczę plon 3,6 tony, mam kontrakt po 1900 zł netto za tonę. Koszty na hektar: nasiona 450, nawozy 1700, ochrona 1250. Dopłaty wpisz mi 900 zł/ha, tyle mniej więcej wyszło z zeszłorocznej decyzji. Słoma zostaje na polu. Porównaj z pszenicą: 7,5 t/ha po 850, koszty bezpośrednie 2950 zł/ha. Rzepak siany po jęczmieniu, pszenica byłaby po rzepaku na innym polu, więc porównanie jest trochę na oko. Chcę wiedzieć, czy dalej trzymać 30 ha rzepaku w strukturze, czy przejść na więcej pszenicy, bo z rzepakiem ostatnio same nerwy. Wszystko netto, bez VAT.", "wynik": "NADWYŻKA BEZPOŚREDNIA – rzepak ozimy, 30 ha\n\n| pozycja | zł/ha | zł / 30 ha |\n| wartość produkcji (3,6 t × 1 900 zł) | 6 840 | 205 200 |\n| koszty bezpośrednie | 3 400 | 102 000 |\n| nadwyżka bez dopłat | 3 440 | 103 200 |\n| dopłaty [DO WERYFIKACJI] | 900 | 27 000 |\n| nadwyżka z dopłatami | 4 340 | 130 200 |\n\nObliczenia:\n1. Wartość produkcji: 3,6 × 1 900 = 6 840 zł/ha\n2. Koszty: 450 + 1 700 + 1 250 = 3 400 zł/ha\n3. Nadwyżka bez dopłat: 6 840 − 3 400 = 3 440 zł/ha\n4. Z dopłatami: 3 440 + 900 = 4 340 zł/ha\n\nPorównanie z pszenicą (te same zasady, bez dopłat):\n| uprawa | wartość zł/ha | koszty zł/ha | nadwyżka zł/ha |\n| rzepak | 6 840 | 3 400 | 3 440 |\n| pszenica (7,5 × 850) | 6 375 | 2 950 | 3 425 |\n\nWnioski:\n- Na Twoich liczbach obie uprawy są praktycznie równe (różnica 15 zł/ha).\n- Rzepak jest droższy w prowadzeniu (+450 zł/ha), więc bardziej wrażliwy na słabszy plon.\n- Decyzję warto oprzeć o płodozmian i ryzyko plonu, nie o samą nadwyżkę.\n\nDopłaty 900 zł/ha [DO WERYFIKACJI] – kwota z zeszłej kampanii. Nadwyżka bezpośrednia nie obejmuje amortyzacji i kosztów ogólnych, to nie jest dochód gospodarstwa.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "3.03", "nazwa": "Próg opłacalności (cena i plon)", "tag": "PRÓG OPŁACALNOŚCI", "co_robi": "Wylicza minimalną cenę, przy której uprawa się zwraca, i minimalny plon przy danej cenie. Dorzuca tabelę wrażliwości cena × plon, żeby było widać, gdzie zaczyna się strata.", "kiedy": "Gdy przychodzi oferta ze skupu albo kontrakt do podpisania i trzeba szybko ocenić, czy ta cena w ogóle pokrywa koszty.", "brief": [{"pole": "Uprawa i pole", "opis": "Gatunek, pole, ha, np. „kukurydza na ziarno, pole Pod lasem, 12 ha”."}, {"pole": "Koszty na hektar", "opis": "Łączny koszt na ha z Twojej kalkulacji i co obejmuje, np. „6200 zł/ha z suszeniem, bez amortyzacji”."}, {"pole": "Plon oczekiwany", "opis": "Twój plan, np. „9 t/ha suchego ziarna”."}, {"pole": "Cena oferowana", "opis": "Cena z oferty skupu lub kontraktu, np. „780 zł/t netto franco skup”."}, {"pole": "Zakres wrażliwości", "opis": "Jakie ceny i plony sprawdzić, np. „ceny 700, 780, 860; plony 8, 9, 10 t/ha”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym (ekonomika gospodarstw, rachunek kosztów w produkcji roślinnej), który na co dzień liczy z rolnikami opłacalność upraw. Policz próg opłacalności uprawy.\n\nDANE:\nUprawa i pole: [UPRAWA I POLE]\nKoszty na hektar: [KOSZTY NA HEKTAR]\nPlon oczekiwany: [PLON OCZEKIWANY]\nCena oferowana: [CENA OFEROWANA]\nZakres wrażliwości: [ZAKRES WRAŻLIWOŚCI]\n\nZASADY:\n1. Najpierw sprawdź dane. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 6 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj cen, plonów, stawek, dopłat ani kosztów i nie podawaj „średnich rynkowych”. Liczysz wyłącznie na moich liczbach. Brak danej oznacz [DO UZUPEŁNIENIA], wartość przyjętą przez ciebie [ZAŁOŻENIE], rzecz niepewną [DO WERYFIKACJI].\n3. Pokazuj obliczenia krok po kroku, z jednostkami (zł/ha, zł/t, t/ha), zaokrąglaj dopiero wynik końcowy.\n4. Próg cenowy = koszty na ha ÷ plon. Próg plonu = koszty na ha ÷ cena. Pokaż margines bezpieczeństwa w procentach.\n5. Napisz wprost, co obejmują koszty, na których liczysz (np. bez amortyzacji), bo od tego zależy, co znaczy „próg”.\n6. Jeśli cena dotyczy innej wilgotności lub parametrów niż plon, zaznacz to [DO WERYFIKACJI] i nie przeliczaj sam.\n\nFORMAT WYNIKU:\nA) Próg cenowy i próg plonu z obliczeniami.\nB) Margines bezpieczeństwa dla ceny i plonu.\nC) Tabela wrażliwości: wynik zł/ha dla podanych cen i plonów.\nD) Interpretacja w 3 zdaniach i lista luk.\n\nNa końcu dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dodaj do tabeli wariant z kosztami wyższymi o 10%.", "Policz próg opłacalności z dopłatami, które ci podam.", "Przelicz próg dla pełnego kosztu z amortyzacją, którą podam.", "Pokaż, ile ton muszę sprzedać po tej cenie, żeby pokryć koszty całego pola.", "Zrób tę samą kalkulację dla pszenicy z danymi, które wkleję.", "Sprawdź, jaka cena daje mi zysk 1000 zł/ha.", "Rozszerz tabelę wrażliwości o pięć poziomów ceny.", "Napisz rolnikowi SMS z progiem cenowym i rekomendacją.", "Pokaż, jak zmieni się próg, jeśli zrezygnuję z jednego zabiegu za kwotę, którą podam.", "Przygotuj tabelę do wydruku na spotkanie z kupcem."], "checklista": ["Koszty na ha pochodzą z kalkulacji rolnika i wiadomo, co obejmują.", "Plon i cena dotyczą tego samego towaru (wilgotność, zanieczyszczenia, parametry).", "Cena jest netto i z jasnym miejscem dostawy (loco gospodarstwo / franco skup).", "Tabela wrażliwości obejmuje realny zakres plonów dla tego pola.", "Margines bezpieczeństwa został omówiony z rolnikiem."], "uwaga": "", "przyklad": {"wejscie": "Kukurydza na ziarno, pole Pod lasem, 12 hektarów. Koszty policzyłem na 6200 zł na hektar razem z suszeniem, bez amortyzacji. Zakładam 9 ton suchego ziarna z hektara. Skup daje 780 zł netto za tonę, franco skup. Sprawdź mi ceny 700, 780 i 860 i plony 8, 9, 10 ton. Chcę wiedzieć, czy podpisywać. Suszarnię mam swoją, ale suszenie wliczyłem po kosztach gazu i prądu z zeszłego roku. Pole lekkie, klasa IVa, w zeszłym roku wyszło 8,2 tony, rok wcześniej prawie 10. Kupiec chce odpowiedzi do piątku, a ja nie chcę się wiązać na całość, jak ceny pójdą w górę.", "wynik": "PRÓG OPŁACALNOŚCI – kukurydza na ziarno, Pod lasem, 12 ha\nKoszty: 6 200 zł/ha (z suszeniem, BEZ amortyzacji)\n\n1. Próg cenowy: 6 200 ÷ 9 t/ha = 688,89 zł/t\n2. Próg plonu przy 780 zł/t: 6 200 ÷ 780 = 7,95 t/ha\n3. Margines ceny: (780 − 688,89) ÷ 780 = 11,7%\n4. Margines plonu: (9 − 7,95) ÷ 9 = 11,7%\n\nTabela wrażliwości – wynik zł/ha (cena × plon − 6 200):\n| cena \\ plon | 8 t | 9 t | 10 t |\n| 700 zł/t | −600 | 100 | 800 |\n| 780 zł/t | 40 | 820 | 1 600 |\n| 860 zł/t | 680 | 1 540 | 2 400 |\n\nInterpretacja:\nPrzy 780 zł/t i 9 t/ha zostaje 820 zł/ha (9 840 zł na 12 ha) ponad koszty bez amortyzacji. Spadek plonu poniżej ok. 8 t/ha zjada prawie cały wynik. Margines 11,7% jest wąski – warto zabezpieczyć kontraktem tylko część plonu.\n\n[DO WERYFIKACJI] czy cena 780 zł/t dotyczy ziarna o wilgotności, jaką przyjąłeś przy plonie 9 t/ha.\n[DO UZUPEŁNIENIA] koszt transportu do skupu, jeśli nie jest w 6 200 zł/ha.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "3.04", "nazwa": "Budżet sezonu i przepływy pieniężne gospodarstwa", "tag": "PRZEPŁYWY PIENIĘŻNE", "co_robi": "Układa miesięczny plan wpływów i wydatków gospodarstwa i pokazuje saldo na koniec każdego miesiąca. Wskazuje miesiące z dziurą finansową i pozycje, które da się przesunąć.", "kiedy": "Po żniwach lub przed sezonem, gdy rolnik musi zdecydować, czy sprzedawać zboże od razu, brać kredyt obrotowy, czy przesunąć zakupy.", "brief": [{"pole": "Gospodarstwo", "opis": "Areał i struktura, np. „85 ha: 40 ha pszenicy, 30 ha rzepaku, 15 ha kukurydzy, pow. kutnowski”."}, {"pole": "Saldo na start", "opis": "Ile masz na koncie na początek okresu, np. „40 000 zł na 1 sierpnia”."}, {"pole": "Planowane wydatki", "opis": "Miesiąc po miesiącu, np. „sierpień nawozy i nasiona rzepaku 48 000, wrzesień siew 30 000…”."}, {"pole": "Planowane wpływy", "opis": "Sprzedaż, kontrakty, inne, np. „sierpień rzepak z kontraktu 60 000”."}, {"pole": "Zobowiązania stałe", "opis": "Raty kredytów, leasing, KRUS, czynsze, np. „leasing 15 000 w listopadzie”."}, {"pole": "Okres i cel", "opis": "Na jaki okres i po co, np. „sierpień–grudzień, sprawdzić, czy wystarczy bez kredytu obrotowego”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym (ekonomika gospodarstw, rachunek kosztów w produkcji roślinnej), który na co dzień liczy z rolnikami opłacalność upraw. Przygotuj budżet i plan przepływów pieniężnych gospodarstwa.\n\nDANE:\nGospodarstwo: [GOSPODARSTWO]\nSaldo na start: [SALDO NA START]\nPlanowane wydatki: [PLANOWANE WYDATKI]\nPlanowane wpływy: [PLANOWANE WPŁYWY]\nZobowiązania stałe: [ZOBOWIĄZANIA STAŁE]\nOkres i cel: [OKRES I CEL]\n\nZASADY:\n1. Najpierw sprawdź dane. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 6 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj cen, plonów, stawek, dopłat ani kosztów i nie podawaj „średnich rynkowych”. Liczysz wyłącznie na moich liczbach. Brak danej oznacz [DO UZUPEŁNIENIA], wartość przyjętą przez ciebie [ZAŁOŻENIE], rzecz niepewną [DO WERYFIKACJI].\n3. Pokazuj obliczenia krok po kroku, z jednostkami (zł/ha, zł/t, t/ha), zaokrąglaj dopiero wynik końcowy.\n4. Licz saldo narastająco: saldo na początek + wpływy − wydatki = saldo na koniec miesiąca.\n5. Wpływy o niepewnym terminie lub kwocie (dopłaty, sprzedaż bez umowy) pokaż osobno i oznacz [DO WERYFIKACJI]; policz wariant bez nich.\n6. Nie podawaj oprocentowania kredytów ani terminów wypłat dopłat z głowy – pytaj albo zostaw lukę.\n\nFORMAT WYNIKU:\nA) Tabela | miesiąc | wpływy | wydatki | saldo |.\nB) Miesiące z ujemnym saldem i wielkość luki.\nC) Wariant bez niepewnych wpływów.\nD) Trzy możliwe działania (przesunięcie zakupu, sprzedaż części plonu, kredyt) i lista luk.\n\nNa końcu dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dodaj wariant, w którym sprzedaję część zboża we wrześniu za kwotę, którą podam.", "Przesuń zakup nawozów na późniejszy miesiąc i pokaż nowe salda.", "Rozszerz budżet na cały rok gospodarczy.", "Dopisz ratę KRUS w miesiącach, które podam.", "Pokaż, jaki kredyt obrotowy wystarczy na pokrycie luki, bez wymyślania oprocentowania.", "Zrób wersję tabeli do wklejenia w arkusz kalkulacyjny.", "Oznacz wydatki, których nie da się przesunąć.", "Napisz krótką notatkę do doradcy bankowego z podsumowaniem przepływów.", "Dodaj rezerwę na nieprzewidziane naprawy w kwocie, którą ustalę.", "Porównaj plan z faktycznymi wpływami i wydatkami, które wkleję po miesiącu."], "checklista": ["Saldo początkowe zgadza się z wyciągiem z konta.", "Wszystkie raty, leasing i KRUS są ujęte w prawidłowych miesiącach.", "Wpływy bez umowy i dopłaty są oznaczone jako niepewne.", "Istnieje wariant bez niepewnych wpływów.", "Kwoty są netto albo brutto konsekwentnie w całym planie.", "Luka finansowa ma przypisane konkretne działanie.", "Plan ma datę sporządzenia i założenia na piśmie."], "uwaga": "Terminy i kwoty wypłat dopłat zależą od ARiMR – w planie traktuj je jako niepewne i nie opieraj na nich spłaty zobowiązań bez weryfikacji.", "przyklad": {"wejscie": "Gospodarstwo 85 ha koło Kutna. Na 1 sierpnia mam na koncie 40 tysięcy. W sierpniu wpływa 60 tysięcy za rzepak z kontraktu, a wydaję 48 tysięcy na nawozy jesienne i nasiona rzepaku. Wrzesień siew pszenicy, 30 tysięcy. Październik ochrona jesienna 22 tysiące. Listopad rata leasingu 15 tysięcy. Grudzień drobne 8 tysięcy, a w grudniu może przyjdzie zaliczka dopłat, coś koło 45 tysięcy, ale nie wiem kiedy. Chcę wiedzieć, czy dam radę bez kredytu. Paliwo, KRUS i drobne opłaty jeszcze tu nie wpisałem, bo nie wiem dokładnie, ile wyjdzie. Zboże z magazynu, około 150 ton pszenicy, mogę sprzedać w każdej chwili, tylko cena teraz słaba. Leasing jest na ciągnik, rata stała. Wolałbym nie brać kredytu obrotowego, chyba że naprawdę trzeba.", "wynik": "PLAN PRZEPŁYWÓW – gospodarstwo 85 ha, sierpień–grudzień\nSaldo na 1.08: 40 000 zł\n\n| miesiąc | wpływy | wydatki | saldo na koniec |\n| sierpień | 60 000 | 48 000 | 52 000 |\n| wrzesień | 0 | 30 000 | 22 000 |\n| październik | 0 | 22 000 | 0 |\n| listopad | 0 | 15 000 | −15 000 |\n| grudzień (bez dopłat) | 0 | 8 000 | −23 000 |\n| grudzień (z zaliczką) | 45 000 [DO WERYFIKACJI] | 8 000 | 22 000 |\n\nObliczenia: sierpień 40 000 + 60 000 − 48 000 = 52 000; wrzesień 52 000 − 30 000 = 22 000; październik 22 000 − 22 000 = 0; listopad 0 − 15 000 = −15 000; grudzień −15 000 − 8 000 = −23 000 (z zaliczką: −23 000 + 45 000 = 22 000).\n\nWniosek: luka pojawia się w listopadzie (−15 000 zł) i bez dopłat rośnie do −23 000 zł w grudniu. Zaliczka dopłat ma niepewny termin, więc nie zamyka listopada.\n\nMożliwe działania:\n1. Sprzedać część zboża z magazynu we wrześniu–październiku [DO UZUPEŁNIENIA ilość i cena].\n2. Przesunąć część zakupów ochrony jesiennej, jeśli lustracja pozwoli.\n3. Uzgodnić z bankiem kredyt obrotowy na ok. 23 000 zł [DO UZUPEŁNIENIA warunki].\n\n[DO UZUPEŁNIENIA] KRUS, paliwo i bieżące opłaty – nie ma ich w danych.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "3.05", "nazwa": "Porównanie ofert środków ochrony i nawozów (cena za ha)", "tag": "PORÓWNANIE OFERT", "co_robi": "Przelicza oferty środków ochrony roślin i nawozów na koszt na hektar i na całe pole, a nie na litr, worek czy tonę. Pokazuje, ile opakowań trzeba kupić i co z ofert jest naprawdę tańsze.", "kiedy": "Gdy przedstawiciele przysyłają cenniki w różnych opakowaniach i dawkach, a rolnik patrzy tylko na cenę za litr.", "brief": [{"pole": "Cel zabiegu i uprawa", "opis": "Uprawa, faza, problem, areał, np. „pszenica ozima, T2 w BBCH 37–39, septorioza, 60 ha”."}, {"pole": "Oferty", "opis": "Dla każdej: cena i wielkość opakowania, np. „oferta A: 5 l za 780 zł netto; ofe
