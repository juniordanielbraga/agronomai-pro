idencji.\nPytanie do Pana: jaka odmiana i jaka podatność na mączniaka?\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "3. Ocena przezimowania pszenicy (Skill 1.05)", "tekst": "CO WPISUJESZ:\n„Pszenica ozima, Stara Wieś pole za lasem 24 ha. Jesienią liczyłem około 380 roślin na metr, teraz w 5 ramkach wyszło 300, 280, 310, 260, 290. Część pola była pod wodą w lutym. Czy zostawiać?”\n\nCO DOSTAJESZ:\nObliczenie obsady wiosną: (300+280+310+260+290)/5 = 1440/5 = 288 roślin/m².\nUbytki: (380 − 288)/380 × 100 = 92/380 × 100 ≈ 24,2%.\n| Wskaźnik | Wartość |\n| Obsada jesienią | 380 szt./m² (dane użytkownika) |\n| Obsada wiosną | 288 szt./m² |\n| Ubytki | ok. 24% |\nMinimalna obsada akceptowalna dla odmiany: [DO WERYFIKACJI — dane hodowcy / ODR].\nMiejsca po zalaniu policz osobno [DO UZUPEŁNIENIA] — średnia z pola może ukrywać place do przesiewu.\nDecyzja: przed porównaniem z minimum nie przesądzam; zalecam dodatkowe 5 ramek w zalanej części.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "4. Protokół szkód po gradzie (Skill 1.07)", "tekst": "CO WPISUJESZ:\n„Grad w nocy, rzepak BBCH 65, Lubomierz, działka 45/2, 12 ha. Z rana byłem: połamane pędy, kwiaty obite, na ok. jednej trzeciej pola mocno. Rolnik ma ubezpieczenie. Zrób mi protokół roboczy.”\n\nCO DOSTAJESZ:\nPROTOKÓŁ OGLĘDZIN — dokument roboczy\nDziałka 45/2, Lubomierz, rzepak ozimy, BBCH 65, pow. 12 ha\nZdarzenie: grad, data [DO UZUPEŁNIENIA]\nOpis: połamane pędy, obite kwiatostany.\nPowierzchnia mocno uszkodzona: ok. 1/3 pola ≈ 4 ha [ZAŁOŻENIE: szacunek wzrokowy, do pomiaru GPS].\nStopień uszkodzenia: [DO WERYFIKACJI — ocena rzeczoznawcy].\nZdjęcia: [DO UZUPEŁNIENIA — min. 10 z 4 stron pola + współrzędne].\nDalej: zgłoszenie szkody do ubezpieczyciela w terminie z polisy [DO WERYFIKACJI]; nie wykonywać zabiegów zmieniających obraz szkody przed oględzinami, chyba że ubezpieczyciel pozwoli.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "5. Bilans azotu dla pszenicy (Skill 2.04)", "tekst": "CO WPISUJESZ:\n„Pszenica ozima po rzepaku, 30 ha, plon oczekiwany 8 t/ha. Pobranie N na tonę wpisuję z tabel ODR: [moja wartość]. Obornik nie był. Nmin z wiosny jeszcze nie mam. Rozpisz mi bilans.”\n\nCO DOSTAJESZ:\nBILANS AZOTU — pszenica ozima po rzepaku, 30 ha\nKrok 1. Potrzeby N = plon × pobranie na 1 t = 8 t/ha × [DO UZUPEŁNIENIA: kg N/t z Pana tabel] = [WYNIK] kg N/ha.\nKrok 2. N z gleby (Nmin) = [DO UZUPEŁNIENIA — wynik analizy wiosennej].\nKrok 3. N z przedplonu (rzepak) = [DO WERYFIKACJI — wartość ze źródła ODR/IUNG].\nKrok 4. N z nawozów naturalnych = 0 (brak obornika).\nKrok 5. N mineralny = krok 1 − krok 2 − krok 3 − krok 4.\n| Dawka | Termin (faza) | kg N/ha |\n| I | start wegetacji | [DO UZUPEŁNIENIA] |\n| II | BBCH 30–32 | [DO UZUPEŁNIENIA] |\n| III | BBCH 37–49 | [DO UZUPEŁNIENIA] |\nPodział dawek dopasuję po uzyskaniu Nmin.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "6. Kontrola limitu 170 kg N/ha z nawozów naturalnych (Skill 2.07)", "tekst": "CO WPISUJESZ:\n„Gospodarstwo z bydłem, 85 ha UR. W ciągu roku rozwozimy gnojowicę i obornik — ilości wpisuję w tonach i m³, zawartość N mam z analizy nawozu. Sprawdź, czy mieszczę się w 170.”\n\nCO DOSTAJESZ:\nKONTROLA LIMITU N Z NAWOZÓW NATURALNYCH\n| Nawóz | Ilość | N w jednostce (analiza) | N razem (kg) |\n| Obornik | [t] | [kg N/t] | ilość × zawartość |\n| Gnojowica | [m³] | [kg N/m³] | ilość × zawartość |\nKrok 1. Suma N z nawozów naturalnych = obornik + gnojowica = [WYNIK] kg.\nKrok 2. N na ha = suma / 85 ha = [WYNIK] kg N/ha.\nKrok 3. Porównanie z limitem 170 kg N/ha z Programu azotanowego.\nJeśli wynik przekracza 170 → opcje: zbyt nawozu naturalnego z umową, dzierżawa gruntów [DO WERYFIKACJI — aktualne wymogi dokumentowania].\nUwaga: sposób liczenia powierzchni i terminy stosowania sprawdź w aktualnym Programie azotanowym [DO WERYFIKACJI].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "7. Plan wapnowania z analiz OSChR (Skill 2.02)", "tekst": "CO WPISUJESZ:\n„Mam wyniki z OSChR dla 6 pól: pH od 4,9 do 6,2, kategorie gleby od lekkiej do średniej. Chcę ustalić kolejność wapnowania na 2 lata, bo w tym roku stać nas na połowę.”\n\nCO DOSTAJESZ:\nPLAN WAPNOWANIA — priorytety\n| Pole | pH | Kategoria | Potrzeba wapnowania (wg zaleceń OSChR) | Priorytet |\n| [POLE 1] | 4,9 | lekka | [z wyniku OSChR] | 1 — rok 1 |\n| [POLE 2] | 5,3 | średnia | [z wyniku OSChR] | 2 — rok 1 |\n| [POLE 3] | 6,2 | średnia | [z wyniku OSChR] | rok 2 / kontrola |\nKryterium kolejności: najpierw pola z najniższym pH i najcenniejszą uprawą w płodozmianie [ZAŁOŻENIE].\nDawka CaO i rodzaj wapna: wg zaleceń dołączonych do analiz OSChR [DO UZUPEŁNIENIA].\nBudżet roku 1: suma ton × cena z Pana oferty [DO UZUPEŁNIENIA].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "8. Nadwyżka bezpośrednia rzepaku (Skill 3.02)", "tekst": "CO WPISUJESZ:\n„Rzepak 40 ha, plon 3,6 t/ha, cena z kontraktu [moja cena] zł/t. Koszty na ha z faktur: nasiona X, nawozy Y, środki ochrony Z, usługi i paliwo W. Policz nadwyżkę i koszt tony.”\n\nCO DOSTAJESZ:\nNADWYŻKA BEZPOŚREDNIA — rzepak ozimy, 40 ha\nKrok 1. Przychód/ha = 3,6 t × [CENA] zł/t.\nKrok 2. Koszty bezpośrednie/ha = X + Y + Z + W.\nKrok 3. Nadwyżka/ha = krok 1 − krok 2.\nKrok 4. Nadwyżka na pole = krok 3 × 40 ha.\nKrok 5. Koszt wyprodukowania 1 t = koszty/ha ÷ 3,6 t.\n| Pozycja | zł/ha |\n| Przychód | [WYLICZ] |\n| Koszty bezpośrednie | [WYLICZ] |\n| Nadwyżka | [WYLICZ] |\nNie doliczyłem dopłat — wpisz je tylko, jeśli znasz kwotę z decyzji [DO UZUPEŁNIENIA]. Koszty ogólne (amortyzacja, KRUS) w tej kalkulacji pominięte [ZAŁOŻENIE].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "9. Porównanie: siew własny czy usługa (Skill 3.07)", "tekst": "CO WPISUJESZ:\n„Rolnik ma 60 ha, siewnik stary, myśli o usłudze siewu. Podaję: koszt naprawy siewnika, paliwo, godziny pracy, cena usługi od sąsiada na ha. Co się bardziej opłaca?”\n\nCO DOSTAJESZ:\nPORÓWNANIE WARIANTÓW\n| Pozycja | Siew własny | Usługa |\n| Naprawa / utrzymanie | [KWOTA] | 0 |\n| Paliwo | [KWOTA] | 0 |\n| Praca własna (godziny × Pana stawka) | [WYLICZ] | 0 |\n| Usługa (cena/ha × 60 ha) | 0 | [WYLICZ] |\n| RAZEM | [SUMA] | [SUMA] |\nKrok po kroku: każdą kwotę liczę na 60 ha i dzielę przez 60 → koszt na ha.\nCzynniki pozakosztowe: terminowość siewu (usługodawca może przyjechać później) [DO WERYFIKACJI], jakość siewu, ryzyko awarii.\nPróg opłacalności: powierzchnia, przy której oba warianty kosztują tyle samo = koszty stałe własne ÷ (cena usługi/ha − koszty zmienne własne/ha).\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "10. Budżet sezonu na kukurydzę (Skill 3.04)", "tekst": "CO WPISUJESZ:\n„Kukurydza na ziarno 25 ha, chcę budżet miesiąc po miesiącu od marca do listopada. Ceny mam z ofert: nasiona, nawozy, herbicyd, suszenie za tonę. Plon zakładam 9 t/ha.”\n\nCO DOSTAJESZ:\nBUDŻET SEZONU — kukurydza na ziarno, 25 ha\n| Miesiąc | Pozycja | Kwota (zł) |\n| marzec | nawozy przedsiewne | [ilość × cena z oferty] |\n| kwiecień | nasiona | [jednostki × cena] |\n| maj | herbicyd | [ilość wg etykiety × cena] |\n| czerwiec | nawożenie pogłówne | [WYLICZ] |\n| październik | zbiór (usługa) | [WYLICZ] |\n| październik | suszenie | 25 ha × 9 t × [cena/t] |\nSuszenie: koszt zależy od wilgotności ziarna przy zbiorze [ZAŁOŻENIE: wilgotność do potwierdzenia].\nMiesiące z największym wydatkiem: [WYNIK] — warto zaplanować kredyt obrotowy lub odroczone płatności.\nDawki nawozów i herbicydu wpisz z planu nawożenia i etykiety [DO UZUPEŁNIENIA].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "11. Oferta dla nowego klienta (Skill 4.01)", "tekst": "CO WPISUJESZ:\n„Pan Zieliński, Kalisz, 120 ha: pszenica, rzepak, kukurydza. Narzeka, że agronom z firmy mu tylko sprzedaje. Chcę mu dać pakiet Standard. Stawka moja [STAWKA]. Zrób ofertę.”\n\nCO DOSTAJESZ:\nOFERTA DORADZTWA — Gospodarstwo Zieliński, okolice Kalisza\nPanie Zieliński, z naszej rozmowy wynika, że potrzebuje Pan niezależnego doradztwa — kogoś, kto patrzy na pole, a nie na sprzedaż środków.\nProponuję pakiet STANDARD:\n• lustracje pszenicy, rzepaku i kukurydzy w kluczowych fazach\n• plan nawożenia na podstawie analiz gleby\n• program ochrony dopasowany do pól (środki i dawki wg etykiet)\n• pomoc w ewidencji zabiegów, raport miesięczny i podsumowanie sezonu\nCena: [STAWKA] zł netto / ha / sezon → 120 ha × [STAWKA] = [WYLICZ] zł netto.\nPotrzebuję od Pana: analiz gleby [DO UZUPEŁNIENIA: z którego roku?], historii pól z 2 lat.\nOferta ważna do: [DATA].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "12. Odpowiedź na „ODR robi to za darmo” (Skill 4.10)", "tekst": "CO WPISUJESZ:\n„Klient napisał SMS: ‘Panie, ODR mi to zrobi za darmo, po co mam płacić?’ Odpisz mu krótko, grzecznie, bez krytykowania ODR.”\n\nCO DOSTAJESZ:\nPropozycja SMS-a (do 3 zdań):\n„Panie Marku, to prawda — ODR ma dobre wsparcie i warto z niego korzystać. Ja daję coś dodatkowego: przyjeżdżam na Pana pola w terminach ważnych dla Pana upraw, mam telefon włączony w sezonie i prowadzę całą dokumentację za Pana. Mogę przyjechać raz na próbę — po wizycie sam Pan oceni, czy warto.”\nWersja krótsza:\n„Rozumiem. ODR to dobra opcja. Ja oferuję stałą opiekę i dyspozycyjność w sezonie — zapraszam na jedną wizytę próbną.”\nDo sprawdzenia przed wysłaniem: czy wizyta próbna jest płatna i ile kosztuje [DO UZUPEŁNIENIA].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "13. Raport miesięczny dla klienta (Skill 4.05)", "tekst": "CO WPISUJESZ:\n„Klient Wiśniewski, maj. Byłem 3 razy: 6, 15 i 27 maja. Rzepak kwitnienie i po kwitnieniu, pszenica BBCH 37–51. Zrobione 2 fungicydy i insektycyd (z ewidencji). Problem: susza od połowy miesiąca. Zrób raport miesięczny.”\n\nCO DOSTAJESZ:\nRAPORT MIESIĘCZNY — MAJ — Gosp. Wiśniewski\nPodsumowanie: Maj przebiegł pod znakiem kwitnienia rzepaku i strzelania w źdźbło pszenicy. Od połowy miesiąca brak opadów ogranicza wzrost. Zabiegi wykonano zgodnie z planem.\n| Data | Pola | Ustalenia |\n| 6.05 | rzepak | kwitnienie, [DO UZUPEŁNIENIA] |\n| 15.05 | pszenica | BBCH 37, [DO UZUPEŁNIENIA] |\n| 27.05 | wszystkie | objawy niedoboru wody |\nZabiegi (z ewidencji): 2 × fungicyd, 1 × insektycyd — nazwy i dawki zgodne z wpisami w ewidencji [DO WERYFIKACJI].\nPlan na czerwiec: lustracje pszenicy pod kątem chorób kłosa, ocena łuszczynowania rzepaku, przygotowanie do żniw.\nRyzyko: susza — plon oczekiwany do korekty [ZAŁOŻENIE].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "14. Lista dokumentów do wniosku ARiMR (Skill 5.01)", "tekst": "CO WPISUJESZ:\n„Klient pierwszy raz składa wniosek sam przez aplikację, gospodarstwo 45 ha, dzierżawi 12 ha. Chce ekoschematy. Zrób listę, co ma przygotować.”\n\nCO DOSTAJESZ:\nLISTA PRZYGOTOWAŃ DO WNIOSKU — 45 ha (w tym 12 ha dzierżawy)\n☐ Dostęp do aplikacji ARiMR i numer identyfikacyjny producenta [DO WERYFIKACJI — aktualna ścieżka logowania]\n☐ Lista działek ewidencyjnych z powierzchniami (własne + dzierżawione)\n☐ Umowy dzierżawy na 12 ha — sprawdzić, czy wydzierżawiający nie zgłasza tych gruntów [DO UZUPEŁNIENIA]\n☐ Plan upraw na sezon (co na której działce)\n☐ Wybrane ekoschematy i warunki ich realizacji na polach — wg aktualnych zasad kampanii [DO WERYFIKACJI]\n☐ Analizy gleby, plan nawożenia, ewidencje — jeśli wymagają ich wybrane praktyki\n☐ Termin składania wniosku: sprawdź w aktualnym ogłoszeniu ARiMR\nStawek ekoschematów nie podaję — kwoty publikuje ARiMR dla danej kampanii.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "15. Odpowiedź na wezwanie z ARiMR (Skill 5.09)", "tekst": "CO WPISUJESZ:\n„Klient dostał pismo z ARiMR — wezwanie do wyjaśnień, różnica powierzchni na działce 213/1 (zadeklarował 4,20 ha, wyszło im mniej). Wkleiłem treść pisma. Pomóż przygotować odpowiedź.”\n\nCO DOSTAJESZ:\nSZKIC ODPOWIEDZI NA WEZWANIE\n1. Sygnatura i data pisma: [DO UZUPEŁNIENIA z wezwania].\n2. Termin odpowiedzi: wg pisma [DO WERYFIKACJI — liczony od dnia doręczenia].\n3. Treść:\n„W odpowiedzi na wezwanie z dnia [DATA] dotyczące działki 213/1 wyjaśniam, że zadeklarowana powierzchnia 4,20 ha wynikała z [PRZYCZYNA — np. pomiaru GPS / danych z ewidencji gruntów]. Załączam [DOKUMENTY]. [Jeśli błąd: Korygujemy powierzchnię do [WARTOŚĆ] ha.]”\n4. Załączniki do zebrania: wypis z ewidencji gruntów, pomiar, zdjęcia, mapa.\nUwaga: konsekwencje korekty zależą od aktualnych zasad — przy większych kwotach skonsultuj z ODR lub prawnikiem.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "16. Przygotowanie do kontroli (Skill 5.09)", "tekst": "CO WPISUJESZ:\n„Do klienta ma przyjść kontrola — ewidencje zabiegów, przechowywanie środków, opryskiwacz. Gospodarstwo 70 ha, sadownicze nie. Zrób checklistę na 2 dni przed.”\n\nCO DOSTAJESZ:\nCHECKLISTA PRZED KONTROLĄ — 70 ha\nEwidencja zabiegów ochrony roślin:\n☐ wpisy kompletne: data, pole, uprawa, powierzchnia, środek, dawka, przyczyna\n☐ okres przechowywania ewidencji zgodny z przepisami [DO WERYFIKACJI]\nMagazyn środków:\n☐ środki w oryginalnych opakowaniach, zamknięte pomieszczenie / szafa\n☐ brak środków przeterminowanych lub niedopuszczonych [sprawdź w wyszukiwarce MRiRW]\n☐ puste opakowania oddzielone, gotowe do zwrotu\nOpryskiwacz:\n☐ aktualne badanie sprawności [DO UZUPEŁNIENIA: data]\nOsoba wykonująca zabiegi:\n☐ aktualne szkolenie z ochrony roślin [DO UZUPEŁNIENIA: data zaświadczenia]\nDo przygotowania na stół: teczka z ewidencją, faktury zakupu środków, dokumenty opryskiwacza.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "17. Wpis do ewidencji zabiegów z notatki (Skill 6.01)", "tekst": "CO WPISUJESZ:\n„Wczoraj 14:00, pole Pod Gajem 22 ha, pszenica BBCH 39, fungicyd na septoriozę, środek [nazwa z etykiety], dawka z etykiety, 200 l wody, wiatr słaby. Pryskał syn. Zrób wpis.”\n\nCO DOSTAJESZ:\nWPIS DO EWIDENCJI ZABIEGÓW\n| Pole | Wartość |\n| Data / godzina | [DO UZUPEŁNIENIA: wczorajsza data], 14:00 |\n| Pole | Pod Gajem |\n| Powierzchnia | 22 ha |\n| Uprawa / BBCH | pszenica ozima / 39 |\n| Przyczyna | septorioza |\n| Środek | [nazwa z etykiety] |\n| Dawka | [z etykiety] /ha [DO WERYFIKACJI] |\n| Woda | 200 l/ha [ZAŁOŻENIE: na ha] |\n| Zużycie środka | 22 ha × dawka = [WYLICZ] |\n| Karencja | [dni z etykiety] → zbiór najwcześniej: [WYLICZ] |\n| Wykonawca | [imię i nazwisko syna] |\nUzasadnienie wg integrowanej ochrony: [DO UZUPEŁNIENIA — wynik lustracji / prognoza].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "18. Program ochrony rzepaku na sezon (Skill 6.03)", "tekst": "CO WPISUJESZ:\n„Rzepak 50 ha, Wielkopolska, w zeszłym roku problem ze słodyszkiem i suchą zgnilizną. Zrób szkielet programu ochrony od jesieni do żniw, bez dawek — dawki dopiszę z etykiet.”\n\nCO DOSTAJESZ:\nSZKIELET PROGRAMU OCHRONY — rzepak ozimy, 50 ha\n| Okres / BBCH | Zagrożenie | Monitoring | Decyzja |\n| jesień, BBCH 12–18 | chwasty, szkodniki jesienne | żółte naczynia, lustracja | wg progu [DO WERYFIKACJI] |\n| jesień | choroby, regulacja pokroju | ocena porażenia, wzrost | środek wg etykiety |\n| wiosna, BBCH 30–50 | chowacze, słodyszek | żółte naczynia, strząsanie | wg progu |\n| kwitnienie, BBCH 61–65 | zgnilizna twardzikowa | historia pola, prognoza | fungicyd zarejestrowany [DO UZUPEŁNIENIA] |\n| BBCH 70–80 | szkodniki łuszczyn | lustracja | wg progu |\nRotacja substancji czynnych przeciwko słodyszkowi — sprawdź grupy działania w etykietach [DO WERYFIKACJI].\nOchrona pszczół: zabiegi w kwitnieniu wyłącznie środkami dopuszczonymi i poza lotem pszczół.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "19. Sprawdzenie środka przed zaleceniem (Skill 6.04)", "tekst": "CO WPISUJESZ:\n„Rolnik chce użyć środka, który mu został z zeszłego roku, na kukurydzę. Wkleiłem treść etykiety. Sprawdź, czy mogę mu to zalecić i na co uważać.”\n\nCO DOSTAJESZ:\nWERYFIKACJA ŚRODKA — kukurydza\n1. Czy kukurydza jest na etykiecie w zakresie stosowania? [odpowiedź z wklejonej etykiety]\n2. Czy środek jest nadal dopuszczony i etykieta aktualna? [DO WERYFIKACJI — wyszukiwarka środków ochrony roślin MRiRW]\n3. Termin ważności opakowania: [DO UZUPEŁNIENIA z opakowania].\n4. Dawka i faza BBCH stosowania: [z etykiety].\n5. Ograniczenia: strefy buforowe, następstwo roślin, liczba zabiegów w sezonie — [z etykiety].\n6. Karencja: [z etykiety] → kolidować może z terminem zbioru na kiszonkę [DO WERYFIKACJI].\nWniosek: zalecenie możliwe tylko, jeśli punkty 1–3 są potwierdzone. W przeciwnym razie środek do zwrotu / utylizacji.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}, {"tytul": "20. Raport z sezonu dla grupy producentów (Skill 3.09)", "tekst": "CO WPISUJESZ:\n„Grupa 8 gospodarstw, razem 1100 ha, pszenica i rzepak. Mam tabelę plonów, liczbę zabiegów i koszty ochrony na ha od każdego. Zrób podsumowanie sezonu na zebranie.”\n\nCO DOSTAJESZ:\nPODSUMOWANIE SEZONU — grupa producentów, 8 gospodarstw, 1100 ha\n| Gospodarstwo | Uprawa | Plon (t/ha) | Liczba zabiegów | Koszt ochrony (zł/ha) | Koszt ochrony na 1 t |\n| [A] | pszenica | [z tabeli] | [z tabeli] | [z tabeli] | koszt/ha ÷ plon |\nŚrednia ważona plonu grupy = Σ(plon × ha) ÷ Σ ha [WYLICZ].\nWnioski do omówienia:\n1. Czy więcej zabiegów dało wyższy plon? — porównanie gospodarstw [WYLICZ].\n2. Rozrzut kosztów ochrony na tonę między gospodarstwami.\n3. Wspólne zakupy środków i nawozów — potencjał oszczędności [DO UZUPEŁNIENIA: oferty].\nUwaga: jeden sezon to za mało, by przesądzać o technologii [ZAŁOŻENIE]. Dane anonimizować przed pokazaniem na zebraniu.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "kopiuj": false}]}, {"id": "B6", "ikona": "📅", "tytul": "Kalendarz agronoma na sezon", "podtytul": "12 miesięcy: co w polu, co w biurze, jakie dokumenty i które Skille.", "opis": "Rok pracy agronoma i doradcy rozpisany miesiąc po miesiącu: zadania w polu, praca biurowa, dokumenty i terminy oraz Skille, które w danym okresie oszczędzają najwięcej czasu. Terminy ARiMR i okresy z Programu azotanowego zmieniają się — zawsze sprawdzaj je w aktualnych ogłoszeniach. Kalendarz jest ogólny dla upraw polowych; dopasuj go do swojego regionu i przebiegu pogody.", "sekcje": [{"tytul": "Styczeń", "tekst": "W POLU:\n• Kontrola ozimin przy odwilżach: wyprzenie, zastoiska wody, szkody od zwierzyny\n• Kontrola magazynu środków ochrony i nawozów\n\nW BIURZE:\n• Raport z sezonu dla klientów i wnioski\n• Plany nawożenia na nowy sezon na podstawie analiz OSChR\n• Budżet sezonu i aktualizacja cennika usług\n• Odnowienie umów doradczych\n\nDOKUMENTY I TERMINY:\n• Uzupełnienie i zamknięcie ewidencji zabiegów z poprzedniego sezonu\n• Sprawdzenie terminów badań opryskiwaczy i szkoleń z ochrony roślin u klientów\n• Ogłoszenia ARiMR na nowy rok — śledzić komunikaty. Terminy sprawdź w aktualnym ogłoszeniu ARiMR.\n\nSKILLE DO UŻYCIA:\n• 2.01 Plan nawożenia azotem zgodny z Programem azotanowym\n• 2.02 Plan wapnowania na podstawie wyników OSChR\n• 2.03 Interpretacja wyników analizy gleby dla rolnika\n• 3.04 Budżet sezonu i przepływy pieniężne gospodarstwa\n• 4.01 Oferta doradztwa z cennikiem\n• 4.02 Umowa o świadczenie usług doradczych\n• 3.09 Analiza wyników sezonu po żniwach (rentowność pól)", "kopiuj": false}, {"tytul": "Luty", "tekst": "W POLU:\n• Pierwsze oceny przezimowania (gdy warunki pozwalają)\n• Pobór prób na Nmin, jeśli klient to zleca\n\nW BIURZE:\n• Plany nawożenia azotem — finalizacja\n• Zamówienia nawozów i środków na podstawie programów ochrony\n• Kalkulacje kosztów bezpośrednich na nowy sezon\n\nDOKUMENTY I TERMINY:\n• Kontrola limitu 170 kg N/ha z nawozów naturalnych i dokumentów zbytu\n• Okresy zakazu nawożenia wg Programu azotanowego [DO WERYFIKACJI]. Terminy sprawdź w aktualnym ogłoszeniu ARiMR.\n\nSKILLE DO UŻYCIA:\n• 1.05 Ocena przezimowania rzepaku i zbóż ozimych\n• 2.04 Bilans azotu i składników NPK gospodarstwa\n• 2.07 Plan zagospodarowania nawozów naturalnych\n• 3.05 Porównanie ofert środków ochrony i nawozów (cena za ha)\n• 6.10 Opryskiwacz, magazyn środków i BHP — checklista", "kopiuj": false}, {"tytul": "Marzec", "tekst": "W POLU:\n• Ocena przezimowania i decyzje o przesiewach\n• Start wegetacji: pierwsza dawka N\n• Lustracje rzepaku: pierwsze naloty szkodników łodygowych (żółte naczynia)\n\nW BIURZE:\n• Zalecenia startowe dla klientów\n• Aktualizacja budżetu po zakupach\n• Przypomnienia o wnioskach dla klientów\n\nDOKUMENTY I TERMINY:\n• Przygotowanie do wniosku o płatności (plan upraw, działki, dzierżawy). Terminy sprawdź w aktualnym ogłoszeniu ARiMR.\n• Ewidencja zabiegów — start nowego sezonu\n\nSKILLE DO UŻYCIA:\n• 1.05 Ocena przezimowania rzepaku i zbóż ozimych\n• 1.06 Ocena obsady roślin i wschodów\n• 2.01 Plan nawożenia azotem zgodny z Programem azotanowym\n• 5.01 Checklista wniosku o płatności bezpośrednie\n• 5.02 Ekoschematy — dobór praktyk i dokumentacja", "kopiuj": false}, {"tytul": "Kwiecień", "tekst": "W POLU:\n• Lustracje zbóż: choroby podstawy źdźbła, mączniak, chwasty\n• Rzepak: chowacze, słodyszek — monitoring i decyzje wg progów ze źródła\n• Siewy jare i kukurydzy — kontrola warunków\n\nW BIURZE:\n• Zalecenia po wizytach, raporty z lustracji\n• Programy ochrony — korekty\n• Kontrola wykonania budżetu\n\nDOKUMENTY I TERMINY:\n• Wniosek ARiMR i ekoschematy — praca z klientami. Terminy sprawdź w aktualnym ogłoszeniu ARiMR.\n• Bieżące wpisy do ewidencji zabiegów\n\nSKILLE DO UŻYCIA:\n• 1.02 Raport z lustracji pola\n• 1.03 Notatka głosowa → raport\n• 1.08 Zalecenia dla rolnika po wizycie\n• 5.01 Checklista wniosku o płatności bezpośrednie\n• 6.01 Ewidencja zabiegów ochrony roślin\n• 6.03 Program ochrony uprawy na sezon", "kopiuj": false}, {"tytul": "Maj", "tekst": "W POLU:\n• Kwitnienie rzepaku: ochrona przed chorobami, ochrona pszczół\n• Zboża: liść flagowy, choroby liści\n• Kukurydza: herbicydy, ocena wschodów\n\nW BIURZE:\n• Raport miesięczny dla klientów\n• Weryfikacja środków przed zaleceniami (rejestr, etykieta)\n\nDOKUMENTY I TERMINY:\n• Korekty wniosków, jeśli potrzebne. Terminy sprawdź w aktualnym ogłoszeniu ARiMR.\n• Ewidencja zabiegów — kompletność wpisów po każdym zabiegu\n\nSKILLE DO UŻYCIA:\n• 1.02 Raport z lustracji pola\n• 6.02 Decyzja o zabiegu wg progu szkodliwości\n• 6.04 Kontrola etykiety i rejestracji środka\n• 6.01 Ewidencja zabiegów ochrony roślin\n• 4.05 Raport miesięczny dla klienta", "kopiuj": false}, {"tytul": "Czerwiec", "tekst": "W POLU:\n• Zboża: choroby kłosa, szkodniki\n• Rzepak: łuszczyny, ocena stanu przed zbiorem\n• Ocena szkód po gradzie / suszy\n\nW BIURZE:\n• Szacunek plonów i aktualizacja kalkulacji\n• Planowanie zbioru i logistyki z klientami\n• Dni pola — notatki i wnioski\n\nDOKUMENTY I TERMINY:\n• Protokoły szkód i zgłoszenia do ubezpieczyciela (wg polisy)\n• Ewidencja zabiegów — kontrola karencji przed zbiorem\n• Terminy sprawdź w aktualnym ogłoszeniu ARiMR.\n\nSKILLE DO UŻYCIA:\n• 1.07 Protokół szkód w uprawie z wizji terenowej\n• 4.06 Organizacja dnia pola / pokazu poletek\n• 3.03 Próg opłacalności (cena i plon)\n• 6.06 Zlecenie dla operatora opryskiwacza lub drona\n• 6.09 Monitoring ag
