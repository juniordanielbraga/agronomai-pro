<title>AgronomAI PRO — biuro agronoma</title>

<style>
:root{--g9:#1E4620;--g8:#2C5E2E;--leaf:#7CB342;--cta:#2E7D32;--gold:#D9A82B;--red:#C62828;
--bg:#F5F0E3;--grid:rgba(30,70,32,.055);--card:#fff;--ink:#1d1f1b;--mut:#6b6a5f;--line:#e7e0cc;--soft:#f3eedf;--pre:#17351a;--pretx:#e9f1e3;
--c1:#4E8A3E;--c2:#1E4620;--c3:#D9A82B;--c4:#7A5232;--c5:#3FA34D;--c6:#C62828}
[data-theme=dark]{--bg:#121711;--grid:rgba(165,212,106,.05);--card:#1b2219;--ink:#eef2e8;--mut:#a3ab98;--line:#2c3628;--soft:#222b1f;--pre:#0d130c;--g9:#a5d46a;--g8:#a5d46a}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.55;
background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.mono,.k,.lab,.pill,.cnt,.chip{font-family:'Space Mono',monospace}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.sidetop{padding:22px 20px 0;flex:none}.sidemid{flex:1;overflow:auto;padding:0 12px 10px}.sidebot{flex:none;border-top:1px solid var(--line);padding:14px 20px 18px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px;cursor:pointer}
.brand svg{width:44px;height:44px;flex:none;border-radius:11px}
.brand b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.3px}.brand small{font-family:'Space Mono';font-size:10.5px;letter-spacing:1.6px;color:var(--mut);text-transform:uppercase}
.sbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--soft);margin-bottom:6px}
.sbox input{border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);flex:1;min-width:0;outline:0}
.sbox kbd{font-family:'Space Mono';font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--mut);background:var(--card)}
.lab{font-size:10.5px;letter-spacing:2px;color:var(--mut);margin:18px 10px 8px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:14px;white-space:nowrap}
.nav a span.t{overflow:hidden;text-overflow:ellipsis;flex:1}
.nav a:hover{background:var(--soft)}.nav a.on{background:var(--soft);font-weight:600}
.num{width:27px;height:27px;border-radius:7px;color:#fff;font-family:'Space Mono';font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.ico{width:27px;height:27px;border-radius:7px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.cnt{margin-left:auto;font-size:11px;color:var(--mut);background:var(--soft);border-radius:99px;padding:1px 8px;flex:none}
.nav a.on .cnt{background:var(--card);color:var(--ink);font-weight:700}
.prog{display:flex;justify-content:space-between;font-family:'Space Mono';font-size:10.5px;letter-spacing:1.8px;color:var(--mut)}
.bar{height:6px;background:var(--soft);border-radius:9px;margin:8px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--leaf);border-radius:9px}
.night{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:11px;padding:9px;font:inherit;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
main{padding:34px 48px 60px;max-width:1120px;width:100%;min-width:0}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:1.8px;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;margin-bottom:18px;text-transform:uppercase}
.pill:before{content:'';width:7px;height:7px;border-radius:50%;background:#3FA34D;box-shadow:0 0 0 3px rgba(63,163,77,.18)}
.pill.np:before{display:none}
h1{font-size:64px;line-height:1.02;font-weight:800;letter-spacing:-2.2px}
h1 em{font-style:normal;color:var(--g8);display:block}
h2{font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
h3{font-size:17px;font-weight:700;letter-spacing:-.2px}
.lead{color:var(--ink);opacity:.86;max-width:720px;margin:18px 0 26px;font-size:16.5px;line-height:1.7}.lead b{font-weight:700;opacity:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 34px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.stat b{font-size:32px;font-weight:800;display:block;letter-spacing:-1px;line-height:1.1}.stat small{font-family:'Space Mono';font-size:10.5px;letter-spacing:1.8px;color:var(--mut);text-transform:uppercase;display:block;margin-top:6px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 14px;gap:12px}.sech .k{margin:0}
.k{font-size:10.5px;letter-spacing:1.9px;color:var(--mut);display:block;margin-bottom:6px;text-transform:uppercase}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.step i{font-style:normal;display:inline-flex;width:30px;height:30px;border-radius:8px;background:var(--g9);color:#fff;align-items:center;justify-content:center;font-weight:700;margin-bottom:10px;font-family:'Space Mono'}
[data-theme=dark] .step i{color:#121711}
.step b{display:block;font-weight:700}.step p{font-size:13.5px;color:var(--mut);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:.15s}
.card:hover{border-color:#cfc39f;box-shadow:0 6px 18px rgba(30,70,32,.07)}
.card .top{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.card p{font-size:13.5px;color:var(--mut)}
.list{display:grid;gap:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;gap:16px;align-items:center;cursor:pointer;transition:.15s}
.row:hover{border-color:#cfc39f;box-shadow:0 6px 18px rgba(30,70,32,.07)}
.row .id{font-family:'Space Mono';font-weight:700;font-size:12.5px;color:#fff;border-radius:7px;padding:5px 9px;flex:none}
.row .tx{flex:1;min-width:0}.row b{font-weight:700;font-size:16px;display:block}
.row p{font-size:13.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex:none}
.chip{font-size:10.5px;letter-spacing:1.3px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:4px 10px;color:var(--mut);text-transform:uppercase;white-space:nowrap}
.star{border:0;background:none;font-size:19px;cursor:pointer;color:#c9bd98;flex:none;line-height:1;padding:4px}.star.on{color:var(--gold)}
.dzico{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--soft);border:1px solid var(--line);margin-bottom:18px}
.dh h1{font-size:48px;letter-spacing:-1.6px}
.skh{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.skh .bandx{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--soft)}
.skh .nm{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.skh .nm h1{font-size:34px;letter-spacing:-1px;line-height:1.1;flex:1}
.meta{display:grid;grid-template-columns:repeat(4,1fr)}.meta>div{padding:12px 20px;font-family:'Space Mono';font-size:13.5px;font-weight:700}.meta>div+div{border-left:1px solid var(--line)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.box.acc{border-left:4px solid var(--leaf)}
.field{margin-bottom:14px}.field label{display:block;font-weight:600;font-size:14px}
.field small{display:block;color:var(--mut);font-size:12.5px;margin:1px 0 6px}
.field textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical;background:var(--soft);color:var(--ink)}
.field textarea:focus{outline:2px solid var(--leaf);background:var(--card)}
pre{white-space:pre-wrap;word-wrap:break-word;font-family:'Space Mono',monospace;font-size:12.5px;line-height:1.6;background:var(--pre);color:var(--pretx);border-radius:12px;padding:18px;max-height:420px;overflow:auto}
pre mark,.ex mark{background:none;color:#ffb4a9;font-weight:700}.ex mark{color:var(--red)}
pre .ph{color:#ffd54a}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 15px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:#cfc39f}
.btn.g{background:var(--cta);border-color:var(--cta);color:#fff}.btn.d{background:#1E4620;border-color:#1E4620;color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.cmd{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 16px;margin-bottom:8px;font-size:14.5px}
.cmd .n{font-family:'Space Mono';font-size:12px;color:var(--mut);flex:none}.cmd .t{flex:1}.cmd .b{display:flex;gap:6px;flex:none}
.chk label{display:flex;gap:11px;padding:7px 0;font-size:14.5px;cursor:pointer;border-bottom:1px dashed var(--line)}.chk label:last-child{border:0}
.chk input{accent-color:var(--cta);width:18px;height:18px;flex:none;margin-top:3px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.ex .hd{font-family:'Space Mono';font-size:11.5px;letter-spacing:2px;padding:12px 20px;background:var(--soft);border-bottom:1px solid var(--line);text-transform:uppercase}
.ex .hd:before{content:'● ';color:var(--cta)}
.ex .bd{padding:18px 20px;font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.ex .bd.out{font-family:'Space Mono',monospace;font-size:12.8px;line-height:1.7;border-top:1px solid var(--line)}
.warn{background:#fbf3dc;border:1px solid #ecd9a0;border-radius:13px;padding:13px 16px;font-size:14px;color:#5d4a14;margin-top:14px}
[data-theme=dark] .warn{background:#2a2715;border-color:#4a4320;color:#eadca8}
.agc{display:flex;flex-direction:column}.agc .em{font-size:26px;width:46px;height:46px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.agc .cat{font-family:'Space Mono';font-size:10px;letter-spacing:1.6px;color:var(--mut);text-transform:uppercase}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#1E4620;color:#fff;padding:11px 20px;border-radius:99px;font-weight:600;opacity:0;transition:.2s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.mtop{display:none}
.back{display:none}
.empty{color:var(--mut);padding:20px 0}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 body{overflow-x:hidden}
 aside{position:fixed;inset:0 auto 0 0;width:86%;max-width:330px;z-index:30;transform:translateX(-105%);transition:.22s;box-shadow:0 0 40px rgba(0,0,0,.2)}
 body.menu aside{transform:none}
 .shade{display:none}body.menu .shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
 .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
 .mtop svg{width:34px;height:34px;border-radius:9px}.mtop b{font-weight:700;flex:1;font-size:15.5px}.mtop b span{color:var(--g8)}
 .mtop button{border:1px solid var(--line);background:var(--soft);border-radius:10px;width:40px;height:40px;font-size:18px;color:var(--ink);cursor:pointer}
 main{padding:22px 16px 50px}
 h1{font-size:44px;letter-spacing:-1.4px}.dh h1{font-size:34px}
 .lead{font-size:15px;margin:14px 0 20px}
 .stats{grid-template-columns:1fr 1fr;gap:10px}.stat b{font-size:27px}
 .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
 .steps{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.step{padding:13px}.step p{font-size:12.5px}
 .pill{font-size:10px;letter-spacing:1.2px;padding:6px 11px}
 .sech{flex-wrap:wrap}
 .chips{display:none}.row{padding:14px}
 .skh .nm h1{font-size:25px}.meta{grid-template-columns:1fr 1fr}.meta>div:nth-child(3){border-left:0}.meta>div:nth-child(n+3){border-top:1px solid var(--line)}
 .cmd{flex-wrap:wrap}.cmd .b{width:100%;justify-content:flex-end}
 .back{display:inline-flex;margin-bottom:14px}
 .btn{flex:1 1 auto;justify-content:center}
}
@media print{aside,.mtop{display:none}.app{display:block}}
</style></head><body>

<script>
const D={"dzialy": [{"dzial_nr": 1, "dzial": "Lustracje i wizyty w polu", "opis": "Wizyta kończy się na polu, ale praca trwa w biurze: raporty, zdjęcia, protokoły i zalecenia dla rolnika. Dyktujesz w aucie albo wklejasz notatki, a dostajesz gotowy dokument — z obliczeniami krok po kroku i jasno oznaczonymi lukami do sprawdzenia przed podpisem.", "skills": [{"id": "1.01", "nazwa": "Przygotowanie lustracji i wizyty", "tag": "PRZED WIZYTĄ", "co_robi": "Przed wyjazdem układa plan wizyty: co sprawdzić na każdym polu, o co zapytać rolnika i co zabrać do auta. Dzięki temu nie wracasz drugi raz po zapomnianą próbkę albo brakującą informację.", "kiedy": "Wieczorem przed objazdem albo rano przy kawie, gdy masz zgłoszenie od rolnika i chcesz przyjechać przygotowany, a nie „na oko”.", "brief": [{"pole": "Cel wizyty", "opis": "Po co jedziesz, np. „pierwsza wiosenna lustracja rzepaku po zimie” albo „rolnik zgłasza żółknięcie pszenicy na jednym polu”."}, {"pole": "Gospodarstwo i pola", "opis": "Kto, gdzie, ile ha, np. „Gosp. Nowak, Gniewkowo, pow. inowrocławski, 4 pola, razem ok. 120 ha”."}, {"pole": "Uprawy i fazy", "opis": "Uprawa, odmiana, termin siewu, faza BBCH, np. „rzepak ozimy, siew 25.08, BBCH ok. 30; pszenica ozima, BBCH 25”."}, {"pole": "Historia i sygnały", "opis": "Co już wiesz: zabiegi, wcześniejsze problemy, telefon od rolnika, np. „jesienią mocny nalot śmietki, rolnik mówi o plackach na Działce 112/3”."}, {"pole": "Warunki i pogoda", "opis": "Ostatnie tygodnie i prognoza, np. „długi mróz bez okrywy śnieżnej, teraz odwilż, w weekend opady”."}, {"pole": "Czas i logistyka", "opis": "Ile masz czasu i czym dysponujesz, np. „1,5 h na gospodarstwo, w aucie mam łopatkę, lupę, ramkę, żółte naczynia”."}], "prompt": "Jesteś doświadczonym polskim agronomem i doradcą rolniczym, który od lat prowadzi lustracje pól w gospodarstwach towarowych. Pomóż mi przygotować się do wizyty w gospodarstwie.\n\nDANE:\nCel wizyty: [CEL WIZYTY]\nGospodarstwo i pola: [GOSPODARSTWO I POLA]\nUprawy i fazy rozwojowe: [UPRAWY I FAZY]\nHistoria pól i sygnały od rolnika: [HISTORIA I SYGNAŁY]\nWarunki i pogoda: [WARUNKI I POGODA]\nCzas i logistyka: [CZAS I LOGISTYKA]\n\nZASADY:\n1. Zanim zaczniesz, sprawdź kompletność danych. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj dawek, norm, progów, cen, kwot ani przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a rzeczy niepewne [DO WERYFIKACJI].\n3. Myśl jak w integrowanej ochronie roślin: najpierw obserwacja i rozpoznanie, potem decyzja. Wskaż, co na danym etapie rozwoju zwykle warto sprawdzić, ale bez podawania progów szkodliwości z liczbami — jeśli są potrzebne, poproś, żebym podał źródło (zalecenia IOR-PIB, etykieta, metodyka).\n4. Pytania do rolnika formułuj prosto, tak jak zadaje się je na podwórku, i pogrupuj według tematu.\n5. Dopasuj plan do czasu, który mam. Jeśli nie zdążę wszystkiego, oznacz, co jest priorytetem, a co można odłożyć.\n\nFORMAT WYNIKU:\nA) Plan wizyty krok po kroku, z kolejnością pól i orientacyjnym czasem na każde.\nB) Co sprawdzić na każdym polu: lista obserwacji, metoda (przejście po przekątnej, ramka, wykopanie roślin, naczynia) i co zanotować.\nC) Pytania do rolnika pogrupowane: zabiegi i nawożenie, pogoda i stanowisko, obserwacje rolnika, plany.\nD) Lista rzeczy do zabrania do auta.\nE) Lista luk w danych z oznaczeniami.\n\nNa końcu zawsze dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Skróć plan do 45 minut i zostaw tylko najważniejsze obserwacje.", "Dodaj pytania o ewidencję zabiegów ochrony roślin z tego sezonu.", "Zrób z listy rzeczy do zabrania checklistę do odhaczenia w telefonie.", "Przygotuj osobny plan na pole z największym problemem.", "Dopisz, jakie próbki warto pobrać i jak je opisać.", "Ułóż pytania tak, żeby rolnik nie poczuł się przesłuchiwany.", "Dodaj kolumnę na notatki do wypełnienia na miejscu.", "Przygotuj krótką wiadomość SMS do rolnika z potwierdzeniem wizyty.", "Wskaż, które obserwacje warto udokumentować zdjęciami.", "Zrób wersję planu dla młodszego agronoma, który jedzie sam pierwszy raz."], "checklista": ["Plan obejmuje wszystkie pola, które rolnik zgłosił.", "Kolejność pól ma sens logistyczny i czasowy.", "Pytania do rolnika dotyczą faktów, a nie sugerują odpowiedzi.", "Żaden próg ani dawka nie pochodzi od AI — źródła masz własne.", "W aucie jest sprzęt do próbek i do dokumentacji zdjęciowej.", "Luki w danych są uzupełnione albo świadomie zostawione na wizytę."], "uwaga": "", "przyklad": {"wejscie": "Jutro jadę do Nowaka pod Gniewkowo, pow. inowrocławski. Cztery pola, razem gdzieś 120 hektarów. Rzepak ozimy na dwóch polach, siany koło 25 sierpnia, odmiana mieszańcowa, i pszenica ozima na dwóch. Jesienią był mocny nalot śmietki na Działce 112/3, robiliśmy zabieg. Zima była dziwna, dużo mrozu bez śniegu, teraz odwilż. Nowak dzwonił, że na rzepaku „Za stodołą” widzi jakieś placki, rośliny jakby zgniłe. Mam półtorej godziny, potem lecę do następnego. Co mam sprawdzić, o co go zapytać i co wziąć do auta?", "wynik": "A) PLAN WIZYTY — Gosp. Nowak, Gniewkowo (ok. 90 min)\n| Kolejność | Pole | Czas | Dlaczego |\n| 1 | Rzepak „Za stodołą” | 30 min | zgłoszone placki — priorytet |\n| 2 | Rzepak Działka 112/3 | 25 min | historia śmietki, ocena po zimie |\n| 3–4 | Pszenica ozima (2 pola) | 25 min | przezimowanie, krzewienie |\n| — | Rozmowa z rolnikiem | 10 min | uzupełnienie danych |\n\nB) CO SPRAWDZIĆ — Rzepak „Za stodołą”\n- Wielkość i rozmieszczenie placków (zagłębienia, uwrocia, cały łan?).\n- Wykopać kilka roślin z placka i z części zdrowej: szyjka korzeniowa, korzeń, stożek wzrostu.\n- Objawy mechaniczne (wysadzanie, pękanie korzeni) vs. chorobowe — [DO WERYFIKACJI] na miejscu.\n- Zdjęcia: placek z daleka, roślina z bliska, przekrój szyjki.\n\nC) PYTANIA DO ROLNIKA\n- Kiedy pierwszy raz zauważył placki? Czy się powiększają?\n- Jakie zabiegi i kiedy były jesienią na tym polu? (ewidencja zabiegów)\n- Czy w tym miejscu stoi woda po roztopach?\n\nD) DO AUTA: łopatka, nóż, lupa, ramka do liczenia, worki i marker na próbki, telefon naładowany.\n\nE) LUKI: termin i rodzaj jesiennego zabiegu na śmietkę [DO UZUPEŁNIENIA]; odmiany pszenicy [DO UZUPEŁNIENIA].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "1.02", "nazwa": "Raport z lustracji pola", "tag": "RAPORT Z LUSTRACJI", "co_robi": "Zamienia Twoje notatki z pola w uporządkowany raport z lustracji: stan łanu, choroby, szkodniki, chwasty, odżywienie i wnioski. Rozdziela fakty od interpretacji i jasno pokazuje, czego jeszcze nie wiadomo.", "kiedy": "Po obejściu pola, gdy masz kartkę albo notatki w telefonie, a rolnik czeka na raport jeszcze dziś.", "brief": [{"pole": "Gospodarstwo i pole", "opis": "Kto, gdzie, nazwa pola, ha, np. „Gosp. Kowalscy, Dobrzyca, pow. pleszewski, pole „Przy lesie”, 18 ha”."}, {"pole": "Uprawa i faza", "opis": "Uprawa, odmiana, faza BBCH, np. „pszenica ozima, odmiana z kategorii jakościowych, BBCH 31–32”."}, {"pole": "Data i warunki", "opis": "Data lustracji i pogoda, np. „12.04, pochmurno, ok. 10°C, po deszczu”."}, {"pole": "Obserwacje", "opis": "Wszystko, co widziałeś, w dowolnej kolejności, np. „mączniak na dolnych liściach, pojedynczo, chwasty po herbicydzie zostały w uwrociach, łan wyrównany”."}, {"pole": "Dotychczasowe zabiegi", "opis": "Co już zrobiono, np. „herbicyd jesienią, azot I dawka w marcu, regulator jeszcze nie”."}, {"pole": "Odbiorca raportu", "opis": "Dla kogo, np. „właściciel gospodarstwa” albo „kierownik produkcji w grupie producentów”."}], "prompt": "Jesteś doświadczonym polskim agronomem, który pisze raporty z lustracji pól dla gospodarstw i grup producentów. Zrób raport z moich notatek z lustracji.\n\nDANE:\nGospodarstwo i pole: [GOSPODARSTWO I POLE]\nUprawa i faza rozwojowa: [UPRAWA I FAZA]\nData i warunki: [DATA I WARUNKI]\nObserwacje z pola: [OBSERWACJE]\nDotychczasowe zabiegi: [DOTYCHCZASOWE ZABIEGI]\nOdbiorca raportu: [ODBIORCA RAPORTU]\n\nZASADY:\n1. Zanim zaczniesz, sprawdź kompletność danych. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj dawek, norm, progów, cen, kwot ani przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a rzeczy niepewne [DO WERYFIKACJI].\n3. Oddziel fakty (co widziałem) od interpretacji (co to może oznaczać). Interpretacje oznacz jako hipotezy do potwierdzenia.\n4. Nie wpisuj nazw handlowych środków ani dawek. Jeśli zabieg jest potrzebny, napisz rodzaj zabiegu i dopisz, że środek i dawkę dobiera się według etykiety z wyszukiwarki środków ochrony roślin MRiRW.\n5. Nie oceniaj przekroczenia progów szkodliwości bez danych liczbowych ode mnie i źródła progu.\n6. Pisz językiem zrozumiałym dla odbiorcy raportu, bez lania wody.\n\nFORMAT WYNIKU:\nA) Nagłówek raportu: gospodarstwo, pole, uprawa, faza BBCH, data, warunki.\nB) Tabela obserwacji: obszar (stan łanu, choroby, szkodniki, chwasty, odżywienie, inne) | co stwierdzono | nasilenie lub opis | uwagi.\nC) Wnioski i rekomendacje w punktach, z priorytetem i terminem.\nD) Co sprawdzić przy następnej lustracji.\nE) Lista luk i założeń.\n\nNa końcu zawsze dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Skróć raport do jednej strony dla rolnika.", "Dodaj kolumnę z miejscem na zdjęcie przy każdej obserwacji.", "Przepisz wnioski prostszym językiem, bez skrótów fachowych.", "Zrób wersję raportu do wysłania mailem z krótkim wstępem.", "Oddziel wyraźniej obserwacje pewne od tych do potwierdzenia.", "Dodaj sekcję o ryzykach na najbliższe 2 tygodnie przy podanej prognozie.", "Zestaw ten raport z poprzednim z tego pola i pokaż zmiany.", "Przygotuj z wniosków listę zadań dla rolnika.", "Zamień tabelę na listę punktów do czytania w telefonie.", "Sprawdź, czy w raporcie nie ma sformułowań brzmiących jak gwarancja efektu."], "checklista": ["Nazwa pola, data i faza BBCH są poprawne.", "Każda obserwacja ma miejsce na polu i nasilenie opisane słowami lub Twoimi liczbami.", "Hipotezy są oznaczone i nie udają pewnej diagnozy.", "Brak nazw handlowych środków i dawek wymyślonych przez AI.", "Rekomendacje mają priorytet i termin.", "Luki [DO UZUPEŁNIENIA] są uzupełnione albo świadomie zostawione."], "uwaga": "Raport nie zastępuje etykiety środka ochrony roślin ani zaleceń IOR-PIB. Dobór środka i dawki zawsze według aktualnej etykiety z wyszukiwarki MRiRW, a zabieg wpisz do ewidencji zabiegów.", "przyklad": {"wejscie": "Kowalscy, Dobrzyca, pole „Przy lesie”, 18 hektarów, pszenica ozima, BBCH 31, może 32 miejscami. Byłem dwunastego, pochmurno, koło dziesięciu stopni, po deszczu. Łan ogólnie wyrównany, ładnie się zwarł. Mączniak na dolnych liściach, pojedyncze plamy, nie wszędzie. Septorii nie widziałem, ale dolne liście trochę brudne, nie wiem. W uwrociach przy lesie zostały chwasty po jesiennym herbicydzie, chyba przytulia. Azot pierwsza dawka w marcu, regulatora jeszcze nie było. Raport dla pana Kowalskiego, on lubi krótko, ale niech będzie wszystko, co ważne. Napisz też, kiedy mam przyjechać znowu i na co wtedy patrzeć.", "wynik": "RAPORT Z LUSTRACJI POLA\nGospodarstwo: Kowalscy, Dobrzyca (pow. pleszewski) | Pole: „Przy lesie”, 18 ha\nUprawa: pszenica ozima | Faza: BBCH 31–32 | Data: 12.04 | Warunki: pochmurno, ok. 10°C, po opadach\n\n| Obszar | Co stwierdzono | Nasilenie | Uwagi |\n| Stan łanu | łan wyrównany, zwarty | dobry | — |\n| Choroby | mączniak prawdziwy na dolnych liściach | pojedyncze plamy, nierównomiernie | ocena porażenia liczbowo [DO UZUPEŁNIENIA] |\n| Choroby | przebarwienia dolnych liści | niejasne | septorioza? [DO WERYFIKACJI] — obejrzeć pod lupą przy kolejnej wizycie |\n| Chwasty | zachwaszczenie w uwrociach przy lesie | lokalne | gatunek: przytulia? [DO WERYFIKACJI] |\n\nWNIOSKI\n1. Pilne (do kilku dni): decyzja o regulatorze wzrostu — środek i dawka wyłącznie według etykiety [DO UZUPEŁNIENIA].\n2. Obserwować: mączniak i dolne liście; decyzję o fungicydzie podjąć po ocenie porażenia względem progu z zaleceń IOR-PIB [DO UZUPEŁNIENIA].\n3. Uwrocia: potwierdzić gatunek chwastu i ocenić, czy zabieg punktowy ma sens [ZAŁOŻENIE: problem tylko przy lesie].\n\nNastępna lustracja: ok. tydzień, liście 3 i 4 od góry.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "1.03", "nazwa": "Notatka głosowa → raport", "tag": "GŁOSÓWKA", "co_robi": "Bierze surową transkrypcję tego, co nagadałeś w aucie, i robi z niej porządny dokument: raport, notatkę do karty pola albo krótką wiadomość do rolnika. Poprawia przekręcone przez dyktowanie słowa i pyta, gdy czegoś nie da się odczytać.", "kiedy": "Między jednym gospodarstwem a drugim, gdy dyktujesz w aucie, a wieczorem nie chcesz już siedzieć nad pisaniem.", "brief": [{"pole": "Transkrypcja notatki", "opis": "Wklej tekst z dyktowania w telefonie, nawet z błędami, np. „no to tak pole za stodołą rzepak wygląda średnio placki przy rowie…”."}, {"pole": "Gospodarstwo i pole", "opis": "Jeśli nie ma w notatce, np. „Gosp. Wiśniewski, Kcynia, pole „Za stodołą”, 22 ha”."}, {"pole": "Data wizyty", "opis": "Np. „18.03” albo „dzisiaj rano”."}, {"pole": "Rodzaj dokumentu", "opis": "Co chcesz dostać, np. „raport z lustracji”, „notatka do karty pola”, „SMS z zaleceniami dla rolnika”."}, {"pole": "Odbiorca", "opis": "Np. „rolnik”, „szef w firmie handlowej”, „własne archiwum”."}], "prompt": "Jesteś doświadczonym polskim agronomem i redaktorem dokumentacji doradczej. Dostaniesz transkrypcję mojej notatki głosowej nagranej w aucie po lustracji. Zrób z niej porządny dokument.\n\nDANE:\nTranskrypcja: [TRANSKRYPCJA NOTATKI]\nGospodarstwo i pole: [GOSPODARSTWO I POLE]\nData wizyty: [DATA WIZYTY]\nRodzaj dokumentu: [RODZAJ DOKUMENTU]\nOdbiorca: [ODBIORCA]\n\nZASADY:\n1. Zanim zaczniesz, sprawdź kompletność danych. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj dawek, norm, progów, cen, kwot ani przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a rzeczy niepewne [DO WERYFIKACJI].\n3. Transkrypcja może zawierać błędy rozpoznawania mowy. Popraw oczywiste przekręcenia fachowych słów (np. nazwy chorób, szkodników, faz BBCH), ale każdą poprawkę, której nie jesteś pewien, pokaż na liście i oznacz [DO WERYFIKACJI].\n4. Nie dodawaj obserwacji, których nie powiedziałem. Wtrącenia i powtórzenia usuń, sens zostaw.\n5. Jeśli w notatce padają liczby (ha, liczba roślin, daty), przenieś je dokładnie. Nie zaokrąglaj i nie dopowiadaj.\n6. Jeśli padają nazwy środków lub dawki, przepisz je tylko jako cytat z mojej notatki i oznacz do sprawdzenia z etykietą.\n\nFORMAT WYNIKU:\nA) Gotowy dokument w wybranym rodzaju, dopasowany do odbiorcy.\nB) Lista poprawek z transkrypcji: było → jest.\nC) Fragmenty niezrozumiałe lub sprzeczne.\nD) Pytania uzupełniające, jeśli są potrzebne.\n\nNa końcu zawsze dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Zrób z tej samej notatki krótkiego SMS-a do rolnika.", "Wyciągnij z notatki listę zadań z terminami.", "Podziel notatkę na osobne raporty dla każdego pola.", "Dopisz do karty pola tylko nowe obserwacje.", "Pokaż wszystkie miejsca, gdzie poprawiłeś słowa z dyktowania.", "Zrób wersję bardziej formalną dla firmy.", "Wypisz liczby z notatki w tabeli, żebym je sprawdził.", "Zamień raport na listę punktów do szybkiego przeczytania.", "Przygotuj z notatki maila do kierownika z podsumowaniem dnia.", "Oznacz, które obserwacje wymagają ponownej wizyty."], "checklista": ["Nazwy pól, gospodarstw i miejscowości są zapisane poprawnie.", "Każda poprawka z dyktowania została przez Ciebie potwierdzona.", "Liczby w dokumencie zgadzają się z tym, co mówiłeś.", "Nie pojawiły się obserwacje, których nie było w notatce.", "Nazwy środków i dawki (jeśli są) sprawdzone z etykietą.", "Ton pasuje do odbiorcy."], "uwaga": "", "przyklad": {"wejscie": "no to tak Wiśniewski Kcynia pole za stodołą rzepak dwadzieścia dwa hektary wygląda średnio przy rowie placki takie wymarznięte albo wymoknięte nie wiem woda tam stała reszta pola dobra rośliny ruszyły widać nowe liście sucha masa jesienią była dobra słodyszka jeszcze nie ma w żółtych naczyniach chowacz łodygowy pojedyncze sztuki trzy chyba w jednym naczyniu powiedziałem mu żeby nawóz drugą dawkę jak przyschnie i żeby w czwartek jeszcze zajrzał do naczyń wysłać mu to esemesem tylko krótko bo on długich nie czyta i podpisz mnie na dole", "wynik": "A) SMS DO ROLNIKA\nDzień dobry, po dzisiejszej lustracji rzepaku „Za stodołą” (22 ha): rzepak ruszył z wegetacją, większość pola w dobrym stanie. Przy rowie są placki uszkodzonych roślin — prawdopodobnie po stojącej wodzie lub mrozie, obejrzymy je jeszcze raz. W żółtych naczyniach pojedyncze chowacze łodygowe (do 3 szt. w jednym naczyniu), słodyszka brak. Proszę: 1) II dawka nawozu, gdy pole przeschnie — dawka wg planu nawożenia azotem [DO UZUPEŁNIENIA]; 2) w czwartek zajrzeć do naczyń i dać znać, ile owadów. Pozdrawiam, [DO UZUPEŁNIENIA: podpis]\n\nB) POPRAWKI Z DYKTOWANIA\n| było | jest |\n| „trzy chyba” | do 3 szt. [DO WERYFIKACJI] |\n| „wymarznięte albo wymoknięte” | przyczyna niepewna [DO WERYFIKACJI] |\n\nC) NIEJASNE\n- Data wizyty nie padła w notatce [DO UZUPEŁNIENIA].\n- Nie wiadomo, w ilu naczyniach był chowacz i od kiedy stoją.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "1.04", "nazwa": "Dokumentacja zdjęciowa pola", "tag": "ZDJĘCIA", "co_robi": "Porządkuje zdjęcia z lustracji: nadaje im spójne podpisy, numerację i opisy, a na końcu robi zestawienie do raportu, protokołu albo archiwum. Zdjęcie bez opisu po miesiącu jest bezużyteczne — tu każde ma kontekst.", "kiedy": "Po wizycie, gdy masz w telefonie kilkadziesiąt zdjęć i trzeba je dołączyć do raportu albo protokołu szkód.", "brief": [{"pole": "Lista zdjęć", "opis": "Nazwy plików lub numery i krótki opis od Ciebie, np. „IMG_2231 – placek przy rowie; IMG_2232 – szyjka korzeniowa z bliska”."}, {"pole": "Gospodarstwo i pole", "opis": "Np. „Gosp. Zielińscy, Środa Wlkp., pole „Duże”, 35 ha”."}, {"pole": "Uprawa i faza", "opis": "Np. „kukurydza na ziarno, BBCH 14–15”."}, {"pole": "Data i godzina", "opis": "Np. „03.06, 9:00–10:30”."}, {"pole": "Lokalizacja na polu", "opis": "Jak opisać miejsca, np. „współrzędne z telefonu” albo „od wjazdu od drogi gminnej, ok. 50 m w głąb”."}, {"pole": "Cel dokumentacji", "opis": "Do czego, np. „raport dla rolnika”, „dowód do protokołu szkód”, „porównanie z poprzednią wizytą”."}], "prompt": "Jesteś doświadczonym polskim agronomem, który dokumentuje lustracje i szkody zdjęciami tak, żeby były czytelne dla rolnika, ubezpieczyciela i komisji. Pomóż mi opisać i uporządkować zdjęcia z wizyty.\n\nDANE:\nLista zdjęć z moimi krótkimi opisami: [LISTA ZDJĘĆ]\nGospodarstwo i pole: [GOSPODARSTWO I POLE]\nUprawa i faza: [UPRAWA I FAZA]\nData i godzina: [DATA I GODZINA]\nLokalizacja na polu: [LOKALIZACJA NA POLU]\nCel dokumentacji: [CEL DOKUMENTACJI]\n\nZASADY:\n1. Zanim zaczniesz, sprawdź kompletność danych. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj dawek, norm, progów, cen, kwot ani przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a rzeczy niepewne [DO WERYFIKACJI].\n3. Podpis każdego zdjęcia ma zawierać: numer, co przedstawia, gdzie na polu, plan (ogólny, średni, zbliżenie) i co ma pokazać odbiorcy.\n4. Opisuj tylko to, co wynika z mojego opisu. Nie diagnozuj ze zdjęcia, którego nie widzisz — jeśli opis jest niejasny, oznacz [DO WERYFIKACJI].\n5. Zaproponuj logiczną kolejność zdjęć: od widoku ogólnego do szczegółu.\n6. Jeśli cel to dowód szkody, wskaż, jakich ujęć brakuje, np. punktu odniesienia, skali, widoku całego pola.\n\nFORMAT WYNIKU:\nA) Tabela: nr | plik | podpis | lokalizacja | plan ujęcia | do czego służy.\nB) Proponowana kolejność zdjęć w raporcie.\nC) Brakujące ujęcia do dorobienia przy następnej wizycie.\nD) Krótki akapit wprowadzający do dokumentacji zdjęciowej.\n\nNa końcu zawsze dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Skróć podpisy do jednego zdania.", "Zaproponuj schemat nazewnictwa plików na cały sezon.", "Wybierz 6 najważniejszych zdjęć do raportu dla rolnika.", "Przygotuj podpisy w wersji do protokołu szkód.", "Dodaj kolumnę z porównaniem do zdjęć z poprzedniej wizyty.", "Napisz instrukcję robienia zdjęć dla rolnika, który sam będzie dokumentował.", "Zrób listę ujęć do powtórzenia w tym samym miejscu za 2 tygodnie.", "Pogrupuj zdjęcia według problemu, a nie według kolejności robienia.", "Dopisz do każdego podpisu fazę BBCH.", "Przygotuj krótki opis do wysłania zdjęć rolnikowi przez komunikator."], "checklista": ["Każde zdjęcie ma numer, datę i miejsce na polu.", "Opis nie zawiera diagnozy, której nie potwierdziłeś na miejscu.", "Są ujęcia ogólne i zbliżenia, a przy szkodach — punkt odniesienia i skala.", "Nazwy plików zgadzają się z tabelą.", "Zdjęcia nie pokazują danych osobowych osób postronnych.", "Kopia zdjęć jest zapisana poza telefonem."], "uwaga": "", "przyklad": {"wejscie": "Zieliński, Środa, pole Duże, kukurydza, jakieś 4-5 liści. Trzeci czerwca rano. Zdjęcia: 2231 placek przy rowie z daleka, 2232 to samo bliżej, 2233 roślina wyrwana korzeń, 2234 liść z takimi jasnymi pasami, 2235 wjazd na pole od drogi gminnej, 2236 rząd ze szczerbami, brak roślin. Chcę to do raportu dla Zielińskiego i do porównania za dwa tygodnie. Lokalizację opisuję od wjazdu od drogi gminnej, współrzędnych nie mam, bo GPS w telefonie wariował. Pas przy rowie to jakieś pierwsze sto metrów wzdłuż drogi, dalej pole wygląda normalnie.", "wynik": "A) ZESTAWIENIE ZDJĘĆ — Gosp. Zielińscy, pole „Duże”, kukurydza BBCH 14–15, 03.06 (rano)\n| Nr | Plik | Podpis | Lokalizacja | Plan | Do czego |\n| 1 | IMG_2235 | Wjazd na pole od drogi gminnej — punkt odniesienia | wjazd | ogólny | orientacja |\n| 2 | IMG_2231 | Placek słabszych roślin przy rowie | przy rowie [DO UZUPEŁNIENIA: odległość od wjazdu] | ogólny | zasięg problemu |\n| 3 | IMG_2232 | Ten sam placek z bliska | jw. | średni | stan roślin |\n| 4 | IMG_2236 | Rząd z brakami roślin (szczerby) | [DO UZUPEŁNIENIA] | średni | obsada |\n| 5 | IMG_2233 | Roślina z placka — system korzeniowy | z placka przy rowie | zbliżenie | przyczyna? [DO WERYFIKACJI] |\n| 6 | IMG_2234 | Liść z jasnymi pasami | [DO UZUPEŁNIENIA] | zbliżenie | objaw do rozpoznania [DO WERYFIKACJI] |\n\nB) BRAKUJĄCE UJĘCIA\n- Skala przy zbliżeniu liścia (np. dłoń, linijka).\n- Widok całego pola z jednego, stałego punktu — do powtórzenia za 2 tygodnie.\n\nC) WSTĘP\nDokumentacja zdjęciowa z lustracji 03.06. Zdjęcia ułożone od widoku ogólnego do szczegółu; opisy objawów są wstępne i wymagają potwierdzenia.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "1.05", "nazwa": "Ocena przezimowania rzepaku i zbóż ozimych", "tag": "PRZEZIMOWANIE", "co_robi": "Prowadzi Cię przez ocenę przezimowania: jak liczyć, co oglądać na roślinie i jak zapisać wynik. Liczy procent przezimowania krok po kroku z Twoich danych i porównuje go z kryteriami, które podasz — bez wymyślania norm.", "kiedy": "Na przedwiośniu, gdy rolnik pyta „przesiewać czy zostawić?”, a Ty potrzebujesz rzetelnej oceny z liczbami na papierze.", "brief": [{"pole": "Gospodarstwo i pole", "opis": "Np. „Gosp. Majewski, Chełmża, pow. toruński, pole „Za szkołą”, 28 ha”."}, {"pole": "Uprawa i odmiana", "opis": "Np. „rzepak ozimy, odmiana mieszańcowa, siew 22.08” albo „pszenżyto ozime, siew 05.10”."}, {"pole": "Stan jesienią", "opis": "Jak rośliny wchodziły w zimę, np. „8–10 liści, szyjka ok. 1 cm, obsada wyrównana”."}, {"pole": "Przebieg zimy", "opis": "Mrozy, okrywa śnieżna, zastoiska, np. „dwa tygodnie mrozu bez śniegu, potem woda w obniżeniach”."}, {"pole": "Wyniki oceny", "opis": "Co policzyłeś i zobaczyłeś, np. „ramka w 6 miejscach: żywe i martwe rośliny, stożki zielone/brązowe”."}, {"pole": "Kryteria decyzji", "opis": "Twoje źródło minimalnej obsady i kryteriów przesiewu, np. „wg zaleceń hodowcy odmiany” albo „wg metodyki IUNG/IOR-PIB — podam liczby”."}], "prompt": "Jesteś doświadczonym polskim agronomem, który co wiosnę ocenia przezimowanie rzepaku ozimego i zbóż ozimych. Pomóż mi opracować ocenę przezimowania na podstawie moich pomiarów.\n\nDANE:\nGospodarstwo i pole: [GOSPODARSTWO I POLE]\nUprawa i odmiana: [UPRAWA I ODMIANA]\nStan roślin jesienią: [STAN JESIENIĄ]\nPrzebieg zimy: [PRZEBIEG ZIMY]\nWyniki oceny: [WYNIKI OCENY]\nKryteria decyzji: [KRYTERIA DECYZJI]\n\nZASADY:\n1. Zanim zaczniesz, sprawdź kompletność danych. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj dawek, norm, progów, cen, kwot ani przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a rzeczy niepewne [DO WERYFIKACJI].\n3. Pokaż obliczenia krok po kroku: średnia liczba roślin żywych na metr kwadratowy, udział roślin martwych, procent przezimowania, rozrzut między punktami pomiaru.\n4. Opisz, na co patrzeć na roślinie (stożek wzrostu, szyjka korzeniowa, węzeł krzewienia, korzeń), ale ocenę, czy roślina przeżyła, opieraj na moich obserwacjach.\n5. Do porównania używaj wyłącznie kryteriów, które podałem. Jeśli ich nie podałem, nie podawaj własnych liczb — oznacz [DO UZUPEŁNIENIA] i wskaż, skąd je wziąć.\n6. Jeśli pole jest nierówne, oceń osobno części pola, a nie tylko średnią.\n\nFORMAT WYNIKU:\nA) Tabela pomiarów: punkt | żywe | martwe | uwagi.\nB) Obliczenia krok po kroku.\nC) Ocena opisowa stanu plantacji i jej części.\nD) Porównanie z moimi kryteriami i warianty decyzji: zostawić, podsiać, przesiać, z argumentami za i przeciw.\nE) Co sprawdzić ponownie i kiedy.\n\nNa końcu zawsze dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Policz osobno część pola w obniżeniu i resztę.", "Przygotuj krótką notatkę dla rolnika z decyzją do podjęcia.", "Dodaj test odrastania roślin w doniczkach jako metodę potwierdzenia.", "Zrób tabelę do wydruku na kolejne pomiary w terenie.", "Wypisz pytania do rolnika o przebieg zimy na tym polu.", "Porównaj wyniki z oceną z jesieni.", "Przygotuj wariant, gdy przesiew dotyczy tylko części pola.", "Dopisz, jakie informacje będą potrzebne do zgłoszenia szkody ubezpieczycielowi.", "Przelicz wyniki, jeśli ramka miała inną powierzchnię, którą podam.", "Zrób z oceny wpis do karty pola."], "checklista": ["Powierzchnia ramki i liczba punktów pomiaru są wpisane poprawnie.", "Obliczenia zgadzają się z Twoimi danymi z terenu.", "Kryteria decyzji pochodzą z Twojego źródła, nie od AI.", "Ocena żywotności roślin jest potwierdzona na roślinie, nie tylko „na oko” z drogi.", "Nierówne części pola są opisane osobno.", "Decyzja o przesiewie uwzględnia ubezpieczenie i warunki umowy, jeśli dotyczą."], "uwaga": "Kryteria minimalnej obsady i decyzji o przesiewie zależą od uprawy, odmiany i źródła zaleceń — podaj je sam. Przy szkodach objętych ubezpieczeniem zgłoś szkodę przed przesiewem.", "przyklad": {"wejscie": "Majewski, Chełmża, pole Za szkołą, 28 ha, rzepak mieszaniec, siew 22 sierpnia. Jesienią wchodził ładnie, 8–10 liści. Zima: dwa tygodnie mrozu bez śniegu, potem woda w obniżeniu przy drodze. Liczyłem ramką pół na pół metra, sześć punktów. Żywe i martwe: punkt 1 – 9 żywych, 1 martwa; 2 – 8 i 2; 3 – 10 i 0; 4 – 7 i 2; w obniżeniu 5 – 2 i 6; 6 – 3 i 5. Kryterium przesiewu dam z zaleceń hodowcy, nie mam teraz przy sobie.", "wynik": "A) POMIARY (ramka 0,25 m²)\n| Punkt | Żywe | Martwe | Uwagi |\n| 1 | 9 | 1 | część główna |\n| 2 | 8 | 2 | część główna |\n| 3 | 10 | 0 | część główna |\n| 4 | 7 | 2 | część główna |\n| 5 | 2 | 6 | obniżenie przy drodze |\n| 6 | 3 | 5 | obniżenie przy drodze |\n\nB) OBLICZENIA\nCzęść główna (pkt 1–4): żywe 9+8+10+7 = 34 w 4 ramkach → 34 / 4 = 8,5 szt./ramkę → 8,5 × 4 = 34 szt./m². Martwe: 5 z 39 roślin → 12,8% → przezimowanie ok. 87%.\nObniżenie (pkt 5–6): żywe 5 w 2 ramkach → 2,5 × 4 = 10 szt./m². Martwe 11 z 16 → przezimowanie ok. 31%.\n\nC) OCENA\nCzęść główna przezimowała dobrze i równomiernie. W obniżeniu przy drodze silne wypadanie roślin, najpewniej po zastoisku wody [DO WERYFIKACJI: stan stożków i szyjek].\n\nD) DECYZJA\nKryterium minimalnej obsady wg zaleceń hodowcy: [DO UZUPEŁNIENIA]. Do decyzji: powierzchnia obniżenia [DO UZUPEŁNIENIA: ha] — możliwy przesiew lub podsiew tylko tej części [ZAŁOŻENIE: reszta pola zostaje].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "1.06", "nazwa": "Ocena obsady roślin i wschodów", "tag": "OBSADA", "co_robi": "Przelicza Twoje liczenia z pola na obsadę roślin na metr kwadratowy lub hektar, pokazuje rozrzut i wyrównanie wschodów, a następnie porównuje wynik z normami, które sam podasz. Pomaga uczciwie rozważyć decyzję o przesiewie.", "kiedy": "Po wschodach albo po szkodzie, gdy trzeba szybko odpowiedzieć rolnikowi, czy obsada jest wystarczająca i co robić dalej.", "brief": [{"pole": "Gospodarstwo i pole", "opis": "Np. „Gosp. Pawlak, Łowicz, pole „Działka 112/3”, 14 ha”."}, {"pole": "Uprawa i siew", "opis": "Uprawa, odmiana, termin i norma wysiewu podana przez rolnika, np. „kukurydza, siew 25.04, punktowo, norma wg rolnika — podam”."}, {"pole": "Metoda liczenia", "opis": "Jak liczyłeś, np. „ramka 0,25 m² w 8 miejscach” albo „rośliny na 10 m rzędu, rozstawa 75 cm”."}, {"pole": "Wyniki liczenia", "opis": "Liczby z każdego punktu, np. „8, 9, 7, 10, 6, 8, 9, 7”."}, {"pole": "Docelowa obsada", "opis": "Twoja wartość docelowa i minimalna z zaleceń hodowcy lub doradcy, np. „docelowa i minimalna — wg hodowcy, podam liczby”."}, {"pole": "Uwagi o wschodach", "opis": "Co widziałeś, np. „nierówne wschody, skorupa po ulewie, szkody od ptaków przy lesie”."}], "prompt": "Jesteś doświadczonym polskim agronomem, który ocenia obsadę roślin i wyrównanie wschodów w uprawach polowych. Przelicz moje liczenia z pola i pomóż mi przygotować decyzję.\n\nDANE:\nGospodarstwo i pole: [GOSPODARSTWO I POLE]\nUprawa i siew: [UPRAWA I SIEW]\nMetoda liczenia: [METODA LICZENIA]\nWyniki liczenia: [WYNIKI LICZENIA]\nDocelowa i minimalna obsada: [DOCELOWA OBSADA]\nUwagi o wschodach: [UWAGI O WSCHODACH]\n\nZASADY:\n1. Zanim zaczniesz, sprawdź kompletność danych. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj dawek, norm, progów, cen, kwot ani przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a rzeczy niepewne [DO WERYFIKACJI].\n3. Pokaż obliczenia krok po kroku: przeliczenie na metr kwadratowy i na hektar, średnia, wartość minimalna i maksymalna, rozrzut. Przy liczeniu w rzędzie pokaż, jak użyłeś rozstawy.\n4. Jeśli mam normę wysiewu, policz polową wschodowość jako stosunek obsady do liczby wysianych nasion i pokaż wzór.\n5. Normy docelowe i minimalne bierz wyłącznie z moich danych. Bez nich nie oceniaj, czy obsada jest za niska — oznacz [DO UZUPEŁNIENIA].\n6. Przy decyzji o przesiewie wypisz czynniki poza liczbami: termin, koszt, dostępność nasion, ryzyko, wyrównanie łanu — bez podawania cen.\n\nFORMAT WYNIKU:\nA) Tabela wyników z pomiarów.\nB) Obliczenia krok po kroku.\nC) Ocena wyrównania wschodów i prawdopodobnych przyczyn problemów, jako hipotezy.\nD) Porównanie z moimi normami i warianty decyzji.\nE) Krótki komunikat dla rolnika.\n\nNa końcu zawsze dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przelicz wynik dla innej rozstawy rzędów, którą podam.", "Policz osobno część pola przy lesie i resztę.", "Dodaj wyliczenie polowej wschodowości z normy wysiewu.", "Przygotuj tabelę do wpisywania liczeń w terenie.", "Napisz rolnikowi wprost, czy obsada wystarcza według podanych norm.", "Wypisz możliwe przyczyny nierównych wschodów do sprawdzenia.", "Zrób wariant decyzji z częściowym przesiewem.", "Porównaj tegoroczną obsadę z wynikami z poprzedniego sezonu.", "Dopisz, ile punktów pomiaru warto zrobić na polu tej wielkości i dlaczego.", "Zrób z wyniku wpis do karty pola."], "checklista": ["Metoda liczenia i powierzchnia ramki lub rozstawa są wpisane poprawnie.", "Przeliczenia na m² i ha zgadzają się z Twoimi liczbami.", "Normy docelowe i minimalne pochodzą z Twojego źródła.", "Liczba punktów pomiaru jest reprezentatywna dla całego pola.", "Przyczyny problemów są opisane jako hipotezy.", "Decyzja uwzględnia termin agrotechniczny i dostępność nasion."], "uwaga": "Normy obsady zależą od uprawy, odmiany, stanowiska i terminu — podaje je użytkownik z zaleceń hodowcy lub doradcy. AI tylko przelicza i porządkuje.", "przyklad": {"wejscie": "Pawlak, Łowicz, Działka 112/3, 14 hektarów, kukurydza siana 25 kwietnia punktowo, rozstawa 75 cm. Liczyłem rośliny na 10 metrach rzędu w ośmiu miejscach: 68, 72, 70, 65, 71, 52, 48, 69. Te dwa niskie to przy lesie, ptaki wyciągały. Ile siał na hektar, muszę zapytać Pawlaka. Normy obsady wezmę z katalogu hodowcy. Wschody nierówne, po ulewie była skorupa. Część roślin ma dwa liście, część już pięć. Pawlak pyta, czy dosiewać przy lesie, czy dać spokój. Policz mi to porządnie, żebym mógł mu pokazać.", "wynik": "A) WYNIKI (10 m rzędu, rozstawa 0,75 m → 7,5 m² na pomiar)\n| Punkt | Rośliny | Szt./m² |\n| 1 | 68 | 9,07 |\n| 2 | 72 | 9,60 |\n| 3 | 70 | 9,33 |\n| 4 | 65 | 8,67 |\n| 5 | 71 | 9,47 |\n| 6 (przy lesie) | 52 | 6,93 |\n| 7 (przy lesie) | 48 | 6,40 |\n| 8 | 69 | 9,20 |\n\nB) OBLICZENIA\nPowierzchnia pomiaru: 10 m × 0,75 m = 7,5 m².\nCzęść główna (pkt 1–5, 8): 415 roślin / 45 m² = 9,22 szt./m² → ok. 92 200 szt./ha.\nPrzy lesie (pkt 6–7): 100 roślin / 15 m² = 6,67 szt./m² → ok. 66 700 szt./ha.\nPolowa wschodowość: norma wysiewu [DO UZUPEŁNIENIA] — wzór: obsada / liczba wysianych nasion × 100%.\n\nC) OCENA\nCzęść główna wyrównana (rozrzut 8,67–9,60 szt./m²). Przy lesie wyraźnie niższa obsada — przyczyna: żerowanie ptaków [ZAŁOŻENIE na podstawie obserwacji], skorupa mogła pogłębić nierówne wschody [DO WERYFIKACJI].\n\nD) DECYZJA\nObsada docelowa i minimalna wg hodowcy: [DO UZUPEŁNIENIA]. Do ustalenia powierzchnia pasa przy lesie [DO UZUPEŁNIENIA: ha] — od tego zależy sens częściowego dosiewu.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "1.07", "nazwa": "Protokół szkód w uprawie z wizji terenowej", "tag": "PROTOKÓŁ SZKÓD", "co_robi": "Przygotowuje szkic protokołu z oględzin szkody w uprawie: opis zdarzenia, metody oceny, wyniki pomiarów i wyliczenia udziału uszkodzeń. Porządkuje dowody tak, żeby wytrzymały rozmowę z ubezpieczycielem, kołem łowieckim albo komisją.", "kiedy": "Po gradzie, przymrozku, wymarznięciu, zalaniu albo wizycie dzików, gdy rolnik potrzebuje rzetelnej dokumentacji szkody, zanim cokolwiek zmieni na polu.", "brief": [{"pole": "Rodzaj szkody", "opis": "Np. „grad”, „przymrozek wiosenny”, „wymarznięcie”, „szkody łowieckie — dziki”, „zalanie po ulewie”."}, {"pole": "Gospodarstwo i pole", "opis": "Np. „Gosp. Kaczmarek, Wąsosz, pow. górowski, pole „Nad stawem”, 16 ha, dz. ewid. 245/1”."}, {"pole": "Uprawa i faza", "opis": "Np. „pszenica ozima, BBCH 69” albo „kukurydza, BBCH 16”."}, {"pole": "Data zdarzenia i oględzin", "opis": "Np. „grad 14.06 ok. 17:00, oględziny 16.06”."}, {"pole": "Ustalenia z oględzin", "opis": "Co widziałeś i zmierzyłeś, np. „uszkodzone liście flagowe, złamane źdźbła, w 5 punktach liczyłem kłosy całe i złamane”."}, {"pole": "Obecni i cel protokołu", "opis": "Kto był i po co protokół, np. „rolnik, przedstawiciel koła łowieckiego; do zgłoszenia szkody łowieckiej” albo „do ubezpieczyciela”."}], "prompt": "Jesteś doświadczonym polskim agronomem, który uczestniczy w oględzinach szkód w uprawach (grad, przymrozek, wymarznięcie, zalanie, szkody łowieckie) i przygotowuje dokumentację. Przygotuj szkic protokołu z wizji terenowej.\n\nDANE:\nRodzaj szkody: [RODZAJ SZKODY]\nGospodarstwo i pole: [GOSPODARSTWO I POLE]\nUprawa i faza: [UPRAWA I FAZA]\nData zdarzenia i oględzin: [DATA ZDARZENIA I OGLĘDZIN]\nUstalenia z oględzin: [USTALENIA Z OGLĘDZIN]\nObecni i cel protokołu: [OBECNI I CEL PROTOKOŁU]\n\nZASADY:\n1. Zanim zaczniesz, sprawdź kompletność danych. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj dawek, norm, progów, cen, kwot ani przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a rzeczy niepewne [DO WERYFIKACJI].\n3. Pisz rzeczowo, w czasie przeszłym, tylko fakty. Bez ocen winy i bez obietnic odszkodowania.\n4. Udział uszkodzeń licz tylko z moich pomiarów, krok po kroku, osobno dla części pola, jeśli szkoda była nierówna. Nie szacuj strat w złotówkach ani w tonach bez moich danych o plonie i cenie.\n5. Nie powołuj się na konkretne przepisy, paragrafy ani procedury ubezpieczyciela czy koła łowieckiego. Jeśli są potrzebne, wskaż, że trzeba je sprawdzić w warunkach umowy lub u właściwego podmiotu.\n6. Zostaw miejsca na podpisy wszystkich obecnych i na ich uwagi.\n\nFORMAT WYNIKU:\nA) Szkic protokołu: dane, zdarzenie, uprawa, przebieg oględzin, metoda oceny, wyniki, ustalenia, uwagi stron, podpisy.\nB) Obliczenia udziału uszkodzeń krok po kroku.\nC) Lista dowodów do dołączenia: zdjęcia, mapa, dane meteo.\nD) Lista luk do uzupełnienia przed podpisem.\n\nNa końcu zawsze dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dostosuj protokół do szkody łowieckiej z miejscem na stanowisko koła.", "Przygotuj wersję do zgłoszenia ubezpieczycielowi z listą załączników.", "Policz osobno część pola mocno i słabo uszkodzoną.", "Dodaj tabelę do wpisywania pomiarów w terenie.", "Napisz krótką notatkę dla rolnika, czego nie robić na polu przed oględzinami komisji.", "Dopisz opis metody pomiaru prostym językiem.", "Sprawdź, czy w protokole nie ma ocen i przypuszczeń.", "Przygotuj szablon na kolejne oględziny po kilku dniach.", "Zestaw zdjęcia z punktami pomiaru.", "Przygotuj listę pytań do ubezpieczyciela o wymagane dokumenty."], "checklista": ["Daty zdarzenia i oględzin oraz numery działek są poprawne.", "Metoda pomiaru i liczba punktów są opisane tak, że da się je powtórzyć.", "Obliczenia udziału uszkodzeń zgadzają się z danymi z terenu.", "Protokół nie zawiera ocen winy ani obietnic odszkodowania.", "Wymogi ubezpieczyciela lub koła łowieckiego sprawdzone u źródła.", "Zdjęcia z datą i lokalizacją są dołączone.", "Wszyscy obecni mają miejsce na podpis i uwagi."], "uwaga": "Procedury zgłaszania i szacowania szkód zależą od ubezpieczyciela, warunków umowy i rodzaju szkody. AI nie zna aktualnych wymogów — sprawdź je u źródła przed złożeniem dokumentów.", "przyklad": {"wejscie": "Kaczmarek, Wąsosz, pole Nad stawem, 16 hektarów, działka 245/1. Pszenica ozima, koniec kwitnienia. Grad był czternastego koło piątej po południu, oglądaliśmy szesnastego, byłem ja i pan Kaczmarek. Połamane źdźbła, liście flagowe poszarpane. Liczyłem kłosy w ramce w pięciu miejscach, całe i złamane: 1 – 120 całych, 40 złamanych; 2 – 110 i 55; 3 – 130 i 20; 4 – 95 i 70; 5 – 125 i 30. Od strony stawu gorzej. To do ubezpieczyciela. Rolnik niczego jeszcze nie ruszał na polu, zdjęcia mam w telefonie.", "wynik": "PROTOKÓŁ Z WIZJI TERENOWEJ — SZKODA GRADOWA (szkic)\n1. Gospodarstwo: Kaczmarek, Wąsosz (pow. górowski). Pole „Nad stawem”, 16 ha, dz. ewid. 245/1.\n2. Zdarzenie: opad gradu 14.06, ok. godz. 17:00.\n3. Uprawa: pszenica ozima, faza BBCH ok. 69 (koniec kwitnienia).\n4. Oględziny: 16.06, obecni: [DO UZUPEŁNIENIA: imię i nazwisko agronoma], właściciel gospodarstwa.\n5. Metoda: liczenie kłosów całych i złamanych w ramce [DO UZUPEŁNIENIA: powierzchnia ramki] w 5 punktach.\n\n| Punkt | Całe | Złamane | Razem | Udział złamanych |\n| 1 | 120 | 40 | 160 | 25,0% |\n| 2 | 110 | 55 | 165 | 33,3% |\n| 3 | 130 | 20 | 150 | 13,3% |\n| 4 | 95 | 70 | 165 | 42,4% |\n| 5 | 125 | 30 | 155 | 19,4% |\n\nObliczenia: złamane 40+55+20+70+30 = 215; razem 795 → 215 / 795 × 100 = 27,0% kłosów złamanych średnio.\n6. Ustalenia: uszkodzenia źdźbeł i liści flagowych; nasilenie większe od strony stawu [DO WERYFIKACJI: przypisanie punktów do części pola].\n7. Szacunek strat w plonie: nie wykonano — wymaga danych i metody ubezpieczyciela [DO UZUPEŁNIENIA].\n8. Uwagi stron: …\nPodpisy: …\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "1.08", "nazwa": "Zalecenia dla rolnika po wizycie", "tag": "ZALECENIA", "co_robi": "Z ustaleń z pola robi jasne zalecenia dla rolnika: co zrobić, na którym polu, w jakiej kolejności i do kiedy. Bez fachowego żargonu i bez wymyślonych dawek — środki i dawki zawsze według etykiety lub planu nawożenia.", "kiedy": "Zaraz po wizycie, gdy rolnik ma dostać konkretną listę „co, gdzie, kiedy”, a nie trzy strony raportu.", "brief": [{"pole": "Ustalenia z wizyty", "opis": "Co stwierdziłeś na polach, np. „rzepak: chowacz łodygowy w naczyniach; pszenica: mączniak na dolnych liściach; jęczmień: niedobory, jasne liście”."}, {"pole": "Gospodarstwo i pola", "opis": "Np. „Gosp. Wójcik, Kłodawa, pow. kolski, 3 pola, ok. 80 ha”."}, {"pole": "Uzgodnienia z rolnikiem", "opis": "Co już ustaliliście na miejscu, np. „rolnik sam zrobi zabieg w weekend, nawozi po deszczu”."}, {"pole": "Możliwości gospodarstwa", "opis": "Sprzęt, ludzie, ograniczenia, np. „jeden opryskiwacz, syn pracuje na etacie, w tygodniu tylko po 16:00”."}, {"pole": "Prognoza pogody", "opis": "Np. „do środy sucho i ciepło, od czwartku opady”."}, {"pole": "Forma przekazania", "opis": "Np. „SMS”, „mail z PDF”, „kartka na wydruk do kabiny ciągnika”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który po wizycie przekazuje rolnikom jasne, wykonalne zalecenia. Przygotuj zalecenia na podstawie moich ustaleń.\n\nDANE:\nUstalenia z wizyty: [USTALENIA Z WIZYTY]\nGospodarstwo i pola: [GOSPODARSTWO I POLA]\nUzgodnienia z rolnikiem: [UZGODNIENIA Z ROLNIKIEM]\nMożliwości gospodarstwa: [MOŻLIWOŚCI GOSPODARSTWA]\nPrognoza pogody: [PROGNOZA POGODY]\nForma przekazania: [FORMA PRZEKAZANIA]\n\nZASADY:\n1. Zanim zaczniesz, sprawdź kompletność danych. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj dawek, norm, progów, cen, kwot ani przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a rzeczy niepewne [DO WERYFIKACJI].\n3. Każde zalecenie ma: pole, co zrobić, priorytet (pilne, w tym tygodniu, do obserwacji), termin lub warunek (np. po przeschnięciu gleby) i kto wykonuje.\n4. Nie podawaj nazw handlowych środków ani dawek. Przy zabiegu ochrony napisz rodzaj zabiegu i „środek i dawka według etykiety”, przy nawożeniu „dawka według planu nawożenia azotem”. Przypomnij o wpisie do ewidencji zabiegów.\n5. Ułóż kolejność realnie do możliwości gospodarstwa i prognozy.\n6. Pisz prosto, w drugiej osobie, krótkimi zdaniami.\n\nFORMAT WYNIKU:\nA) Zalecenia w tabeli: priorytet | pole | co zrobić | termin lub warunek | kto.\nB) Wersja w wybranej formie przekazania.\nC) Co rolnik ma obserwować i kiedy dać znać.\nD) Luki i rzeczy do potwierdzenia przed wysłaniem.\n\nNa końcu zawsze dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Skróć zalecenia do SMS-a do 300 znaków.", "Zrób wersję do wydruku i powieszenia w kabinie ciągnika.", "Ułóż zalecenia w kalendarz dzień po dniu na ten tydzień.", "Dodaj wariant na wypadek opadów wcześniej niż w prognozie.", "Napisz zalecenia tak, żeby zrozumiał je pracownik, nie tylko właściciel.", "Dopisz przypomnienie o ewidencji zabiegów ochrony roślin.", "Oddziel zalecenia pilne od tych do obserwacji.", "Przygotuj wiadomość przypominającą na za 3 dni.", "Przetłumacz fachowe skróty na zwykły język.", "Sprawdź, czy żadne zalecenie nie brzmi jak gwarancja efektu."], "checklista": ["Każde zalecenie ma pole, priorytet i termin.", "Brak dawek i nazw środków wymyślonych przez AI.", "Zabiegi ochrony odsyłają do etykiety, nawożenie do planu nawożenia.", "Kolejność prac jest wykonalna dla tego gospodarstwa.", "Rolnik wie, co obserwować i kiedy się odezwać.", "Zalecenia zgadzają się z tym, co uzgodniłeś na miejscu."], "uwaga": "Dobór środka ochrony roślin i dawki zawsze według aktualnej etykiety (wyszukiwarka środków ochrony roślin MRiRW), a nawożenie azotem według planu nawożenia i Programu azotanowego. Zalecenie podpisuje doradca.", "przyklad": {"wejscie": "Wójcik, Kłodawa, trzy pola, jakieś 80 ha. Rzepak przy drodze: chowacz łodygowy w naczyniach, do decyzji o zabiegu. Pszenica za domem: mączniak na dolnych liściach, na razie obserwować. Jęczmień jary: jasne liście, chyba niedobór, trzeba sprawdzić. Uzgodniliśmy, że syn zrobi zabieg na rzepaku, ale on tylko po szesnastej w tygodniu. Do środy sucho, od czwartku deszcz. Wyślij mu SMS-a i zrób kartkę do kabiny. Pamiętaj, że Wójcik ma jeden opryskiwacz i w tygodniu robi tylko syn. Ojciec woli kartkę, syn SMS-a.", "wynik": "A) ZALECENIA — Gosp. Wójcik, Kłodawa\n| Priorytet | Pole | Co zrobić | Termin / warunek | Kto |\n| PILNE | Rzepak przy drodze | Decyzja o zabiegu na chowacza łodygowego — po potwierdzeniu liczby owadów w naczyniach; środek i dawka wg etykiety [DO UZUPEŁNIENIA] | pon.–śr. po 16:00, przed deszczem | syn |\n| W TYM TYGODNIU | Jęczmień jary | Sprawdzić przyczynę jasnych liści (próbka roślin / gleby) [DO WERYFIKACJI] | do piątku | doradca + rolnik |\n| OBSERWACJA | Pszenica za domem | Oglądać dolne i środkowe liście na mączniaka | regularnie, do kolejnej wizyty | rolnik |\n\nB) SMS\nDzień dobry, po wizycie: 1) rzepak przy drodze — w pon.–śr. po 16:00 zabieg na chowacza, jeśli w naczyniach nadal są owady; środek i dawka wg etykiety, zabieg wpisać do ewidencji; 2) jęczmień — sprawdzimy przyczynę jasnych liści do piątku; 3) pszenicę obserwować. Od czwartku deszcz. Pozdrawiam, [DO UZUPEŁNIENIA: podpis]\n\nC) OBSERWUJ\nNaczynia w rzepaku — codziennie do zabiegu; dać znać, jeśli owadów przybywa.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "1.09", "nazwa": "Plan wizyt na tydzień i trasa objazdu", "tag": "PLAN TYGODNIA", "co_robi": "Układa tydzień wizyt: kogo, kiedy i w jakiej kolejności odwiedzić, żeby pilne sprawy nie czekały, a kilometry się nie mnożyły. Uwzględnia pogodę, godziny rolników i Twoje inne obowiązki.", "kiedy": "W niedzielę wieczorem albo w poniedziałek rano, gdy masz kilkanaście telefonów i zgłoszeń i trzeba z tego zrobić realny plan.", "brief": [{"pole": "Lista gospodarstw", "opis": "Kto, gdzie i co trzeba zrobić, np. „Nowak – Gniewkowo – rzepak po zimie; Kowalscy – Dobrzyca – pszenica, regulator; Pawlak – Łowicz – obsada kukurydzy”."}, {"pole": "Pilność i terminy", "opis": "Co nie może czekać, np. „Kaczmarek – szkoda gradowa, oględziny najpóźniej w środę”."}, {"pole": "Baza i dostępność", "opis": "Skąd wyjeżdżasz i kiedy możesz, np. „biuro w Inowrocławiu, pon.–pt. 7:00–16:00, w czwartek szkolenie do 12:00”."}, {"pole": "Czasy dojazdu", "opis": "Twoje szacunki lub dane z mapy, np. „Inowrocław–Gniewkowo 25 min, Gniewkowo–Kcynia 50 min”."}, {"pole": "Prognoza pogody", "opis": "Np. „wtorek ulewy, reszta tygodnia sucho”."}, {"pole": "Ograniczenia rolników", "opis": "Np. „Wójcik tylko po 16:00, Majewski w piątek na targu”."}], "prompt": "Jesteś doświadczonym polskim agronomem terenowym, który co tydzień planuje objazd kilkunastu gospodarstw. Ułóż mi plan wizyt na tydzień i kolejność objazdu.\n\nDANE:\nLista gospodarstw i cel wizyt: [LISTA GOSPODARSTW]\nPilność i terminy: [PILNOŚĆ I TERMINY]\nBaza i moja dostępność: [BAZA I DOSTĘPNOŚĆ]\nCzasy dojazdu: [CZASY DOJAZDU]\nPrognoza pogody: [PROGNOZA POGODY]\nOgraniczenia rolników: [OGRANICZENIA ROLNIKÓW]\n\nZASADY:\n1. Zanim zaczniesz, sprawdź kompletność danych. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj dawek, norm, progów, cen, kwot ani przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a rzeczy niepewne [DO WERYFIKACJI].\n3. Nie zgaduj odległości ani czasów dojazdu. Używaj tylko moich danych; jeśli brakuje czasu dojazdu między dwoma punktami, oznacz [DO UZUPEŁNIENIA] i zaplanuj z rezerwą jako [ZAŁOŻENIE].\n4. Najpierw sprawy pilne i z terminem (szkody, decyzje o zabiegu), potem rutynowe lustracje. Grupuj gospodarstwa leżące blisko siebie w jednym dniu.\n5. Uwzględnij pogodę: w deszcz lepiej zaplanować pracę biurową, rozmowy telefoniczne lub wizyty niewymagające wejścia w łan.\n6. Pokaż sumę czasu na dzień: wizyty plus dojazdy, i zostaw bufor na nieprzewidziane telefony.\n\nFORMAT WYNIKU:\nA) Plan dzień po dniu w tabeli: godzina | gospodarstwo | cel | czas wizyty | dojazd.\nB) Uzasadnienie kolejności w 3–5 zdaniach.\nC) Lista wizyt, które się nie zmieściły, i propozycja, co z nimi zrobić.\nD) SMS-y z potwierdzeniem terminu do rolników.\n\nNa końcu zawsze dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przesuń wszystko z wtorku, bo będzie ulewa.", "Dodaj pilną wizytę w środę rano i przebuduj resztę.", "Zrób wersję planu do kalendarza w telefonie.", "Pogrupuj gospodarstwa według kierunków wyjazdu z biura.", "Policz łączny czas jazdy w tygodniu z moich danych.", "Przygotuj SMS-y do rolników z propozycją godziny.", "Zostaw piątek po południu na raporty i ustaw plan pod to.", "Pokaż, które wizyty można zamienić na rozmowę telefoniczną.", "Zrób plan awaryjny, gdy jeden dzień wypadnie.", "Przygotuj listę rzeczy do zabrania na każdy dzień."], "checklista": ["Pilne sprawy i terminy są na początku tygodnia.", "Czasy dojazdu pochodzą z Twoich danych lub mapy, nie od AI.", "Godziny pasują do ograniczeń rolników.", "W każdym dniu jest bufor czasu.", "Pogoda jest uwzględniona przy wizytach wymagających wejścia w pole.", "Rolnicy dostali potwierdzenie terminu."], "uwaga": "", "przyklad": {"wejscie": "Plan na ten tydzień. Biuro Inowrocław, robię 7 do 16, w czwartek szkolenie do dwunastej. Pilne: Kaczmarek Wąsosz szkoda po gradzie, oględziny najpóźniej w środę, to daleko, ze trzy godziny w jedną stronę. Do tego Nowak Gniewkowo rzepak po zimie, Wiśniewski Kcynia rzepak, Wójcik Kłodawa tylko po szesnastej, Majewski Chełmża, w piątek go nie ma. Dojazdy: do Gniewkowa 25 minut, Gniewkowo–Kcynia 50, do Chełmży 45. We wtorek mają być ulewy. Kłodawy i Wąsosza czasów dojazdu z głowy nie pamiętam, sprawdzę na mapie.", "wynik": "A) PLAN TYGODNIA\n| Dzień | Godzina | Gospodarstwo | Cel | Wizyta | Dojazd |\n| Pon | 7:30 | Nowak, Gniewkowo | rzepak po zimie | 1,5 h | 25 min |\n| Pon | 9:50 | Wiśniewski, Kcynia | rzepak | 1,5 h | 50 min |\n| Pon | po 12:00 | biuro / raporty | — | — | [DO UZUPEŁNIENIA: Kcynia–Inowrocław] |\n| Wt | — | praca biurowa, telefony (ulewy) | — | — | — |\n| Śr | 7:00 | Kaczmarek, Wąsosz | oględziny szkody gradowej | 2 h | ok. 3 h [ZAŁOŻENIE wg Twojego szacunku] |\n| Czw | 12:30 | Majewski, Chełmża | lustracja | 1,5 h | 45 min |\n| Czw | po 16:00 | Wójcik, Kłodawa | wizyta | 1 h | [DO UZUPEŁNIENIA] — poza Twoimi godzinami pracy [DO WERYFIKACJI] |\n\nB) UZASADNIENIE\nSzkoda gradowa ma termin, a we wtorek ulewa — dlatego środa cały dzień na Wąsosz. Gniewkowo i Kcynia leżą w jednym kierunku, więc razem w poniedziałek. Majewski po szkoleniu w czwartek, bo w piątek go nie ma.\n\nC) NIE ZMIEŚCIŁO SIĘ\nPiątek wolny jako bufor; Wójcik — potwierdzić, czy wizyta po 16:00 jest możliwa, albo zamienić na rozmowę i zdjęcia od rolnika.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "1.10", "nazwa": "Karta pola — historia sezonu", "tag": "KARTA POLA", "co_robi": "Zbiera wszystkie lustracje, obserwacje, zabiegi i analizy z sezonu w jedną kartę pola, ułożoną chronologicznie. Pokazuje, co działało, co się powtarza i o czym pamiętać w przyszłym sezonie.", "kiedy": "W trakcie sezonu, gdy chcesz mieć porządek w historii pola, albo po żniwach, gdy podsumowujesz sezon i planujesz następny.", "brief": [{"pole": "Dane pola", "opis": "Np. „Gosp. Zielińscy, Środa Wlkp., pole „Duże”, 35 ha, dz. ewid. 312/2, gleba kl. IIIa, kompleks pszenny dobry”."}, {"pole": "Uprawa i przedplon", "opis": "Np. „pszenica ozima po rzepaku, odmiana jakościowa, siew 28.09”."}, {"pole": "Analizy gleby", "opis": "Wyniki z OSChR, jeśli są, np. „pH, P, K, Mg — wyniki z [rok], podam z wydruku”."}, {"pole": "Wpisy z lustracji", "opis": "Wszystkie wizyty i obserwacje w sezonie, w dowolnej kolejności, np. „10.10 wschody równe; 15.03 przezimowanie dobre; 12.04 mączniak pojedynczo”."}, {"pole": "Zabiegi i nawożenie", "opis": "Co zrobiono, z datami, tak jak w ewidencji, np. „herbicyd jesienią, azot w dwóch dawkach wg planu, fungicyd T1”."}, {"pole": "Plon i uwagi końcowe", "opis": "Jeśli po żniwach, np. „plon wg rolnika, białko z punktu skupu, wyleganie przy rowie”."}], "prompt": "Jesteś doświadczonym polskim agronomem, który prowadzi karty pól dla gospodarstw przez cały sezon. Zrób z moich wpisów uporządkowaną kartę pola.\n\nDANE:\nDane pola: [DANE POLA]\nUprawa i przedplon: [UPRAWA I PRZEDPLON]\nAnalizy gleby: [ANALIZY GLEBY]\nWpisy z lustracji: [WPISY Z LUSTRACJI]\nZabiegi i nawożenie: [ZABIEGI I NAWOŻENIE]\nPlon i uwagi końcowe: [PLON I UWAGI KOŃCOWE]\n\nZASADY:\n1. Zanim zaczniesz, sprawdź kompletność danych. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj dawek, norm, progów, cen, kwot ani przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a rzeczy niepewne [DO WERYFIKACJI].\n3. Ułóż wszystko chronologicznie z datami i fazami BBCH. Jeśli data lub faza nie padła, oznacz [DO UZUPEŁNIENIA].\n4. Zabiegi przepisz tak, jak je podałem. Nie dopisuj środków ani dawek. Karta nie zastępuje obowiązkowej ewidencji zabiegów ochrony roślin — zaznacz to.\n5. Wyników analiz gleby nie interpretuj według własnych progów. Jeśli chcę oceny zasobności, poproś o klasy lub interpretację z wydruku OSChR.\n6. W podsumowaniu oddziel fakty od wniosków i zaznacz, które wnioski wymagają potwierdzenia.\n\nFORMAT WYNIKU:\nA) Metryczka pola.\nB) Oś czasu sezonu w tabeli: data | BBCH | obserwacja lub zabieg | źródło (lustracja, rolnik, analiza).\nC) Problemy powtarzające się w sezonie.\nD) Wnioski i uwagi na następny sezon.\nE) Lista luk w dokumentacji.\n\nNa końcu zawsze dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dopisz nowy wpis z dzisiejszej lustracji we właściwe miejsce osi czasu.", "Zestaw kartę tego pola z kartą z poprzedniego sezonu.", "Zrób z karty jednostronicowe podsumowanie dla rolnika.", "Wypisz tylko zabiegi, żebym porównał je z ewidencją.", "Przygotuj listę uwag do planu nawożenia na kolejny sezon.", "Pokaż, w których okresach brakuje obserwacji.", "Zrób tabelę zbiorczą wszystkich pól gospodarstwa.", "Dopisz miejsca na zdjęcia przy kluczowych wpisach.", "Przygotuj kartę w formie do wydruku w segregatorze.", "Wypisz pytania do rolnika, które uzupełnią luki."], "checklista": ["Daty i fazy BBCH są uzupełnione i zgodne z notatkami.", "Zabiegi zgadzają się z ewidencją zabiegów ochrony roślin.", "Wyniki analiz gleby przepisane dokładnie z wydruku.", "Wnioski są oddzielone od faktów.", "Luki w dokumentacji są oznaczone.", "Karta jest zapisana tam, gdzie znajdziesz ją za rok."], "uwaga": "Karta pola to Twoja dokumentacja robocza. Nie zastępuje obowiązkowej ewidencji zabiegów ochrony roślin ani planu nawożenia azotem wymaganego przez Program azotanowy.", "przyklad": {"wejscie": "Zielińscy, Środa, pole Duże, 35 hektarów, pszenica ozima po rzepaku, siana 28 września. Analizy gleby mam z OSChR, pH i fosfor, potas, magnez, wydruk mam w aucie, wpiszę potem. Wizyty: 10 października wschody równe; 15 marca przezimowanie dobre, trochę wypadów przy rowie; 12 kwietnia mączniak pojedynczo, BBCH 31; 20 maja T2 zrobiony, liść flagowy czysty. Zabiegi jak w ewidencji: herbicyd jesienią, azot dwie dawki, T1 i T2. Plon jeszcze nie wiem, żniwa za miesiąc. Zrób mi z tego porządną kartę pola, dopiszę resztę później.", "wynik": "A) METRYCZKA\nGospodarstwo: Zielińscy, Środa Wlkp. | Pole: „Duże”, 35 ha | Uprawa: pszenica ozima | Przedplon: rzepak ozimy | Siew: 28.09\nAnalizy gleby (OSChR): pH, P, K, Mg — [DO UZUPEŁNIENIA z wydruku]\n\nB) OŚ CZASU SEZONU\n| Data | BBCH | Obserwacja / zabieg | Źródło |\n| jesień | [DO UZUPEŁNIENIA] | herbicyd | ewidencja |\n| 10.10 | [DO UZUPEŁNIENIA] | wschody równe | lustracja |\n| 15.03 | [DO UZUPEŁNIENIA] | przezimowanie dobre, wypady przy rowie | lustracja |\n| [DO UZUPEŁNIENIA] | — | azot, I i II dawka wg planu nawożenia | ewidencja / rolnik |\n| 12.04 | 31 | mączniak, pojedyncze objawy | lustracja |\n| [DO UZUPEŁNIENIA] | — | fungicyd T1 | ewidencja |\n| 20.05 | [DO UZUPEŁNIENIA] | po T2, liść flagowy czysty | lustracja |\n\nC) POWTARZAJĄCE SIĘ PROBLEMY\nMiejsce przy rowie — słabsze przezimowanie [DO WERYFIKACJI: czy problem występował w poprzednich sezonach].\n\nD) NA NASTĘPNY SEZON\n- Obserwować strefę przy rowie (zastoiska wody?) [ZAŁOŻENIE].\n- Uzupełnić plon i parametry jakości po żniwach.\n\nKarta nie zastępuje ewidencji zabiegów ochrony roślin.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}]}, {"dzial_nr": 2, "dzial": "Planowanie produkcji i nawożenie", "opis": "Plan nawożenia, wapnowanie, bilans, płodozmian, siew — każdy sezon zaczyna się od liczenia i papierów. Wpisujesz swoje wyniki OSChR, współczynniki z Programu azotanowego i dane z kart odmian, a dostajesz gotowy plan z obliczeniami krok po kroku, w którym nic nie jest zmyślone, a wszystko do sprawdzenia jest wyraźnie oznaczone.", "skills": [{"id": "2.01", "nazwa": "Plan nawożenia azotem zgodny z Programem azotanowym", "tag": "PLAN NAWOŻENIA N", "co_robi": "Układa plan nawożenia azotem dla pola lub całego gospodarstwa w strukturze wymaganej przez Program azotanowy. Liczy dawkę krok po kroku wyłącznie na współczynnikach i limitach, które podajesz, i dzieli ją na terminy.", "kiedy": "Zimą lub przed ruszeniem wegetacji, gdy trzeba przygotować plan nawożenia azotem do dokumentacji gospodarstwa albo rolnik pyta „ile saletry mam kupić”.", "brief": [{"pole": "Gospodarstwo i pola", "opis": "Lokalizacja, pola i powierzchnie, np. „Gospodarstwo w gm. Kietrz, pow. głubczycki; pole »Za stodołą« 6,4 ha, Działka 112/3 – 9,1 ha”."}, {"pole": "Uprawa i plon", "opis": "Roślina i realny plon oczekiwany, np. „pszenica ozima, plon oczekiwany 8 t/ha (średnia z 3 lat: 7,6 t/ha)”."}, {"pole": "Przedplon i nawożenie organiczne", "opis": "Co rosło wcześniej i czy był obornik/gnojowica, np. „przedplon rzepak, słoma przyorana; obornika nie było od 3 lat”."}, {"pole": "Wyniki analiz gleby", "opis": "Nmin, pH, zasobność z OSChR lub laboratorium, np. „Nmin wiosną 0–90 cm: 40 kg N/ha (OSChR, luty)”."}, {"pole": "Wymagania Programu azotanowego", "opis": "Współczynniki i limity, które masz z aktualnego Programu azotanowego lub od doradcy, np. „pobranie jednostkowe 25 kg N/t, efekt przedplonu rzepaku 20 kg N/ha – z tabel, które dostałem w ODR”."}, {"pole": "Nawozy i terminy", "opis": "Jakie nawozy masz i jak chcesz dzielić dawkę, np. „saletra amonowa 34% N, RSM 32% N; 3 dawki: ruszenie wegetacji, BBCH 30–31, BBCH 37–39”."}], "prompt": "Jesteś doświadczonym polskim agronomem i doradcą rolniczym (ODR i doradztwo prywatne), który od lat przygotowuje dla gospodarstw plany nawożenia azotem zgodne z Programem azotanowym. Przygotuj plan nawożenia azotem na podstawie moich danych.\n\nDANE:\nGospodarstwo i pola: [GOSPODARSTWO I POLA]\nUprawa i plon: [UPRAWA I PLON]\nPrzedplon i nawożenie organiczne: [PRZEDPLON I NAWOŻENIE ORGANICZNE]\nWyniki analiz gleby: [WYNIKI ANALIZ GLEBY]\nWymagania Programu azotanowego: [WYMAGANIA PROGRAMU AZOTANOWEGO]\nNawozy i terminy: [NAWOZY I TERMINY]\n\nZASADY:\n1. Najpierw sprawdź, czy dane są kompletne. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Używaj wyłącznie współczynników (pobranie jednostkowe, efekt przedplonu, Nmin) i limitów, które podałem z aktualnego Programu azotanowego; brakujące oznacz [DO UZUPEŁNIENIA].\n3. Pamiętaj o limicie 170 kg N/ha z nawozów naturalnych (średnia gospodarstwa); inne limity i okresy zakazu bierz tylko z moich danych i oznacz [DO WERYFIKACJI].\n4. Przelicz kg N/ha na kg nawozu/ha i na całe pole, osobno dla każdej dawki.\n5. Nie wymyślaj dawek, limitów prawnych, norm, terminów, współczynników ani kwot — używaj wyłącznie liczb, które podałem. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], a wszystko, co trzeba sprawdzić w aktualnych przepisach, etykiecie lub u doradcy — [DO WERYFIKACJI].\n6. Każde obliczenie pokaż krok po kroku, z jednostkami, tak żebym mógł je sprawdzić na kalkulatorze.\n\nFORMAT WYNIKU:\nA) Tabela danych wejściowych pola (uprawa, powierzchnia, plon, przedplon, Nmin, współczynniki ze źródłem).\nB) Obliczenie zapotrzebowania i dawki N krok po kroku.\nC) Podział dawki na terminy z fazą BBCH, kg N/ha, kg nawozu/ha i ilością na pole.\nD) Zapotrzebowanie na nawozy do zakupu dla całego gospodarstwa.\nE) Lista [DO UZUPEŁNIENIA] i [DO WERYFIKACJI] do sprawdzenia przed podpisem.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Policz plan dla wszystkich pól gospodarstwa i zrób z tego jedną tabelę.", "Przelicz dawki dla RSM zamiast saletry amonowej.", "Dodaj kolumnę z ilością nawozu do zakupu w workach big bag.", "Uwzględnij obornik jesienny, którego zawartość azotu ci podam z analizy.", "Zrób wersję planu dla rolnika, prostym językiem, na jedną stronę.", "Sprawdź, czy suma azotu z nawozów naturalnych mieści się w 170 kg N/ha.", "Przelicz plan przy plonie oczekiwanym niższym o 1 t/ha.", "Dopisz miejsce na podpis rolnika i datę sporządzenia planu.", "Wypisz, jakie dane muszę jeszcze zebrać, żeby plan był kompletny.", "Zamień podział na dwie dawki zamiast trzech i pokaż różnicę."], "checklista": ["Każdy współczynnik ma źródło: aktualny Program azotanowy, tabela z ODR albo wynik analizy.", "Nmin i wyniki OSChR są z bieżącego sezonu i dotyczą właściwego pola.", "Plon oczekiwany jest realny, oparty na średniej z gospodarstwa, a nie na rekordzie.", "Azot z nawozów naturalnych w średniej gospodarstwa nie przekracza 170 kg N/ha.", "Terminy nawożenia nie wypadają w okresach zakazu z aktualnego programu.", "Przeliczenie kg N na kg nawozu sprawdzone dla zawartości N z worka lub deklaracji.", "Wszystkie znaczniki [DO WERYFIKACJI] zostały sprawdzone przed podpisem."], "uwaga": "Współczynniki, limity i okresy nawożenia zmieniają się wraz z Programem azotanowym. Aplikacja ich nie podaje — wpisz je z aktualnego programu lub od doradcy ODR i sprawdź przed podpisaniem planu.", "przyklad": {"wejscie": "Pole »Za stodołą«, 6,4 ha, gmina Kietrz. Pszenica ozima, liczymy plon 8 ton z hektara, średnio mamy 7,6. Przedplon rzepak, słoma przyorana, obornika nie było. Nmin z OSChR z lutego: 40 kg N na hektar w warstwie do 90 cm. Z tabel, które dostałem w ODR do Programu azotanowego, mam pobranie jednostkowe 25 kg N na tonę ziarna i efekt przedplonu po rzepaku 20 kg N na hektar. Nawóz: saletra amonowa 34%. Chcę dzielić na trzy dawki: na ruszenie wegetacji 50%, w strzelanie w źdźbło 30%, a resztę na liść flagowy. Potrzebuję planu do teczki i ile saletry kupić.", "wynik": "PLAN NAWOŻENIA AZOTEM – pole »Za stodołą«, 6,4 ha, pszenica ozima\n\nA) Dane wejściowe\n| Parametr | Wartość | Źródło |\n| Plon oczekiwany | 8 t/ha | rolnik (średnia 7,6 t/ha) |\n| Pobranie jednostkowe | 25 kg N/t | tabela ODR [DO WERYFIKACJI] |\n| Nmin 0–90 cm | 40 kg N/ha | OSChR, luty |\n| Efekt przedplonu (rzepak) | 20 kg N/ha | tabela ODR [DO WERYFIKACJI] |\n\nB) Obliczenie\n1. Zapotrzebowanie: 8 t/ha × 25 kg N/t = 200 kg N/ha\n2. Minus Nmin: 200 − 40 = 160 kg N/ha\n3. Minus efekt przedplonu: 160 − 20 = 140 kg N/ha\nDawka N do zastosowania: 140 kg N/ha [ZAŁOŻENIE: brak azotu z nawozów naturalnych, zgodnie z informacją rolnika]\n\nC) Podział dawki (saletra amonowa 34% N)\n| Termin | % | kg N/ha | kg nawozu/ha | na 6,4 ha |\n| Ruszenie wegetacji | 50 | 70 | 70 / 0,34 = 205,9 | 1 318 kg |\n| BBCH 30–31 | 30 | 42 | 42 / 0,34 = 123,5 | 791 kg |\n| BBCH 37–39 | 20 | 28 | 28 / 0,34 = 82,4 | 527 kg |\n| Razem | 100 | 140 | 411,8 | 2 636 kg |\n\nD) Zakup: ok. 2,64 t saletry amonowej na to pole.\n\nE) Do sprawdzenia: aktualność współczynników z tabel ODR [DO WERYFIKACJI]; okresy zakazu nawożenia z obowiązującego programu [DO UZUPEŁNIENIA]; podpis i data sporządzenia planu [DO UZUPEŁNIENIA].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "2.02", "nazwa": "Plan wapnowania na podstawie wyników OSChR", "tag": "PLAN WAPNOWANIA", "co_robi": "Zamienia wyniki i zalecenia z OSChR w konkretny plan wapnowania: ile nawozu wapniowego na hektar i na pole, w jakim terminie i w jakiej kolejności. Liczy na Twoich danych z formularza, a dawek CaO nie wymyśla.", "kiedy": "Gdy przyszły wyniki z OSChR, rolnik ma kwaśne pola i trzeba zamówić wapno oraz zaplanować, kiedy je wysiać w płodozmianie.", "brief": [{"pole": "Gospodarstwo i pola", "opis": "Pola, powierzchnie, numery działek, np. „Działka 112/3 – 12 ha, pole »Przy lesie« – 7,5 ha, gm. Łapy”."}, {"pole": "Wyniki OSChR", "opis": "pH i ewentualnie Mg, data badania, np. „pH w KCl 5,1 (Działka 112/3), 5,8 (»Przy lesie«), badanie z marca”."}, {"pole": "Kategoria agronomiczna gleby", "opis": "Kategoria z wyniku OSChR, np. „gleba średnia na obu polach”."}, {"pole": "Zalecenia z laboratorium", "opis": "Potrzeby wapnowania i dawki CaO z formularza OSChR, np. „112/3: wapnowanie konieczne, 3 t CaO/ha; »Przy lesie«: wskazane, 1,5 t CaO/ha”."}, {"pole": "Dostępny nawóz wapniowy", "opis": "Rodzaj i zawartość CaO/MgO z deklaracji, np. „wapno węglanowe magnezowe, 50% CaO wg deklaracji producenta”."}, {"pole": "Uprawy w płodo
