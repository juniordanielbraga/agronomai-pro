 IOR-PIB, etykiety lub ODR.\n4. Co 15–20 minut zaplanuj interakcję: pytanie do sali, zdjęcie do rozpoznania, krótkie ćwiczenie.\n5. Wplecenie oferty ma być dyskretne: na końcu, jako zaproszenie do rozmowy, bez sprzedażowego nacisku.\n6. Czas poszczególnych części musi się sumować do podanego czasu — pokaż sumę.\n7. Nie wymyślaj cen, stawek, kwot, dawek, terminów ani numerów przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], rzeczy niepewne [DO WERYFIKACJI].\n\nFORMAT WYNIKU:\nA) Scenariusz w tabeli | minuty | część | co mówię | co robi sala |.\nB) Treść slajdów: numer, tytuł, punkty, propozycja zdjęcia lub schematu.\nC) Notatki prelegenta do 3 najważniejszych slajdów.\nD) Ulotka lub kartka do zabrania przez uczestników (pół A4).\nE) Lista luk i rzeczy do sprawdzenia w źródłach.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Skróć szkolenie do 45 minut.", "Dodaj quiz na 5 pytań na koniec spotkania.", "Przygotuj zaproszenie na szkolenie do rozwieszenia w sklepie i na Facebooku.", "Napisz wstęp, który od razu złapie uwagę sali.", "Dodaj ćwiczenie: rozpoznawanie szkodników ze zdjęć.", "Przygotuj odpowiedzi na 5 trudnych pytań, które mogą paść z sali.", "Zrób wersję slajdów bez tekstu, tylko ze zdjęciami i hasłami.", "Przygotuj formularz zapisu na bezpłatną lustrację po szkoleniu.", "Napisz e-mail z podziękowaniem i materiałami dla uczestników.", "Dostosuj szkolenie do młodych rolników przejmujących gospodarstwo."], "checklista": ["Wszystkie liczby (progi, dawki, terminy) sprawdzone w metodyce, etykiecie lub przepisie.", "Zdjęcia są moje albo mam prawo je pokazać.", "Czas części sumuje się do czasu spotkania, z zapasem na pytania.", "Sprzęt na miejscu sprawdzony (rzutnik, przedłużacz, prezentacja offline).", "Oferta jest wspomniana dyskretnie, na końcu.", "Mam listę obecności lub formularz kontaktowy ze zgodą na kontakt."], "uwaga": "Na szkoleniu łatwo powiedzieć liczbę z pamięci. Każdy próg, dawkę i wymóg prawny sprawdź w aktualnej metodyce IOR-PIB, etykiecie środka lub komunikacie ODR przed prezentacją.", "przyklad": {"wejscie": "Kółko rolnicze w Lipnie zaprosiło mnie na zimowe szkolenie, 90 minut w remizie, rzutnik jest, internetu nie ma. Temat: integrowana ochrona w praktyce — jak robić lustrację, kiedy pryskać, jak prowadzić ewidencję zabiegów. Przyjdzie ze 30 osób, gospodarstwa 20–80 ha. Mam swoje zdjęcia z lustracji rzepaku i pszenicy, przykład dobrze prowadzonej ewidencji. Chcę, żeby zapamiętali: najpierw lustracja, potem decyzja. I fajnie by było, jakby 3–5 osób zapisało się na lustracje u mnie.", "wynik": "SCENARIUSZ — „Najpierw lustracja, potem oprysk” (90 min)\n\n| minuty | część | co mówię | co robi sala |\n| 0–5 | wstęp | „Kto w zeszłym roku pryskał, bo sąsiad pryskał?” | podnosi ręce |\n| 5–25 | jak robić lustrację | trasa po polu, naczynia, co liczyć | ogląda zdjęcia |\n| 25–35 | ćwiczenie | rozpoznaj szkodnika ze zdjęcia | odpowiada w parach |\n| 35–55 | kiedy decyzja o zabiegu | progi z metodyk IOR-PIB, faza BBCH, pogoda | pytania |\n| 55–75 | ewidencja zabiegów | co musi się w niej znaleźć, typowe błędy | ogląda przykład |\n| 75–85 | pytania | — | pyta |\n| 85–90 | zamknięcie | zaproszenie na lustrację | zapisuje się |\nSuma: 90 minut.\n\nSLAJD 6 — „Kiedy pryskać chowacza?”\n• Najpierw naczynie, potem decyzja\n• Próg szkodliwości: [DO UZUPEŁNIENIA z metodyki IOR-PIB]\n• Faza rzepaku: BBCH [DO WERYFIKACJI]\n• Zabieg tylko środkiem zarejestrowanym, zgodnie z etykietą\nZdjęcie: żółte naczynie z chowaczami (moje, marzec).\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "4.09", "nazwa": "Wycena stawki doradczej", "tag": "WYCENA STAWKI", "co_robi": "Liczy krok po kroku, ile musi kosztować Twoja godzina, wizyta i hektar, żeby pokryć koszty, dojazdy i cel dochodowy. Wszystkie liczby bierze od Ciebie i pokazuje, gdzie wynik jest wrażliwy na założenia.", "kiedy": "Przed sezonem, gdy układasz cennik, albo gdy masz wrażenie, że dużo jeździsz, a na koncie tego nie widać.", "brief": [{"pole": "Koszty stałe", "opis": "Twoje miesięczne/roczne koszty, np. „ZUS, księgowa, telefon, laptop, oprogramowanie, ubezpieczenie OC — kwoty wpiszę”."}, {"pole": "Samochód i dojazdy", "opis": "Auto i kilometry, np. „własne auto, ok. … km rocznie, koszt paliwa i eksploatacji … zł/km, średni dojazd do klienta 35 km”."}, {"pole": "Czas pracy", "opis": "Ile realnie pracujesz, np. „sezon III–X, 5 dni w tygodniu, z tego ok. 60% w polu, reszta biuro i telefon”."}, {"pole": "Usługa do wyceny", "opis": "Co wyceniasz, np. „lustracja z pisemnym zaleceniem: 1,5 h w polu + 0,5 h raport + dojazd”."}, {"pole": "Cel dochodowy", "opis": "Ile chcesz zarabiać, np. „… zł miesięcznie na rękę” — liczba od Ciebie."}, {"pole": "Rynek i konkurencja", "opis": "Co wiesz o cenach w okolicy, np. „ODR bierze …, inny prywatny doradca …, dystrybutor daje doradztwo »gratis« do środków”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który prowadzi własną działalność i umie policzyć rentowność usług doradczych. Pomóż mi wyliczyć stawkę doradczą na podstawie moich danych.\n\nDANE:\nKoszty stałe: [KOSZTY STAŁE]\nSamochód i dojazdy: [SAMOCHÓD I DOJAZDY]\nCzas pracy: [CZAS PRACY]\nUsługa do wyceny: [USŁUGA DO WYCENY]\nCel dochodowy: [CEL DOCHODOWY]\nRynek i konkurencja: [RYNEK I KONKURENCJA]\n\nZASADY:\n1. Najpierw sprawdź kompletność danych. Jeśli czegoś istotnego brakuje, zadaj maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Licz wyłącznie na moich liczbach. Nie zakładaj stawek ZUS, podatku ani VAT z pamięci — jeśli są potrzebne, poproś mnie o nie albo wstaw lukę.\n3. Pokazuj każde obliczenie krok po kroku: koszty roczne, godziny fakturowalne, koszt godziny, koszt dojazdu, cena wizyty, cena za hektar.\n4. Oddziel godziny fakturowalne od niefakturowalnych (dojazdy, telefon, administracja, szkolenia).\n5. Pokaż wrażliwość: jak zmieni się stawka, jeśli godzin fakturowalnych będzie mniej o 20% albo kilometrów więcej o 20%.\n6. Porównanie z rynkiem przedstaw tylko na danych, które podałem; nie podawaj cen konkurencji z pamięci.\n7. Nie wymyślaj cen, stawek, kwot, dawek, terminów ani numerów przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], rzeczy niepewne [DO WERYFIKACJI].\n\nFORMAT WYNIKU:\nA) Tabela kosztów rocznych | pozycja | kwota |.\nB) Obliczenia krok po kroku do stawki godzinowej, za wizytę i za hektar.\nC) Tabela wrażliwości (3 scenariusze).\nD) Wnioski: minimalna stawka, stawka docelowa, uwagi do cennika.\nE) Lista luk i założeń.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przelicz wszystko w wariancie z leasingiem samochodu, koszt podam.", "Policz stawkę za hektar dla gospodarstwa 400 ha przy 12 wizytach w sezonie.", "Pokaż, ile klientów potrzebuję, żeby osiągnąć cel dochodowy.", "Dodaj osobną stawkę za dojazd powyżej 40 km.", "Zrób arkusz do wklejenia do Excela z formułami.", "Policz próg rentowności dla pakietu z telefonem bez limitu.", "Porównaj rozliczenie od wizyty i od hektara na moich danych.", "Przygotuj argumenty, jak wytłumaczyć rolnikowi moją stawkę.", "Policz, ile kosztuje mnie klient oddalony o 70 km w porównaniu z klientem o 15 km.", "Zrób wersję obliczeń na sezon poza okresem wegetacji (zima)."], "checklista": ["Wszystkie kwoty kosztów pochodzą z moich faktur i umów.", "Stawki ZUS, podatku i VAT sprawdzone z księgową.", "Godziny fakturowalne są realne, a nie optymistyczne.", "Koszt kilometra uwzględnia paliwo, eksploatację i amortyzację.", "Obliczenia zweryfikowane ręcznie lub w arkuszu.", "Stawka mieści się w tym, co klienci są w stanie zaakceptować."], "uwaga": "Podatki, ZUS i VAT ustal z księgową — AI nie zna Twojej formy opodatkowania. Wynik to kalkulacja na Twoich danych, nie porada podatkowa.", "przyklad": {"wejscie": "Koszty roczne: ZUS i księgowa razem 24 000 zł, telefon i internet 2 400, laptop i programy 3 000, OC 1 200, szkolenia 2 000. Auto własne, robię 40 000 km rocznie, liczę 1,20 zł za km wszystko razem. Sezon od marca do października, ale pracuję cały rok, realnie 1 600 godzin, z tego fakturowalnych może 900. Wyceniam lustrację: 1,5 h w polu plus pół godziny raport, średni dojazd 35 km w jedną stronę. Chcę mieć 9 000 zł miesięcznie przed podatkiem. VAT doliczam osobno.", "wynik": "KROK 1 — Koszty stałe roczne\n| pozycja | kwota |\n| ZUS + księgowa | 24 000 zł |\n| telefon i internet | 2 400 zł |\n| laptop i programy | 3 000 zł |\n| OC | 1 200 zł |\n| szkolenia | 2 000 zł |\n| RAZEM | 32 600 zł |\n\nKROK 2 — Samochód: 40 000 km × 1,20 zł = 48 000 zł / rok.\n\nKROK 3 — Cel dochodowy: 9 000 zł × 12 = 108 000 zł / rok [ZAŁOŻENIE: kwota przed podatkiem dochodowym; DO WERYFIKACJI z księgową].\n\nKROK 4 — Potrzebny przychód: 32 600 + 108 000 = 140 600 zł (bez samochodu, bo dojazd liczę osobno).\n\nKROK 5 — Stawka godzinowa: 140 600 zł ÷ 900 h fakturowalnych = 156,22 zł / h netto.\n\nKROK 6 — Lustracja:\n• praca: 2 h × 156,22 zł = 312,44 zł\n• dojazd: 2 × 35 km × 1,20 zł = 84,00 zł\n• RAZEM: 396,44 zł netto, ok. 400 zł netto + VAT [DO WERYFIKACJI: stawka VAT].\n\nWrażliwość: przy 720 h fakturowalnych (−20%) stawka rośnie do 140 600 ÷ 720 = 195,28 zł / h, a lustracja do 2 × 195,28 + 84 = 474,56 zł.\n\nUwaga: koszt samochodu w kroku 2 (48 000 zł) jest pokryty tylko wtedy, gdy wszystkie kilometry są refakturowane — [DO WERYFIKACJI] ile km to dojazdy do klientów.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "4.10", "nazwa": "Follow-up oferty i plan rozwoju portfela", "tag": "FOLLOW-UP I PORTFEL", "co_robi": "Pisze sekwencję follow-upów po wysłanej ofercie (telefon, SMS, wizyta) i układa plan pracy z portfelem: segmentację klientów, priorytety wizyt i działania na najbliższe tygodnie. Dla agronoma handlowego, który chce sprzedawać przez doradztwo, a nie przez nachalność.", "kiedy": "Gdy oferta wisi bez odpowiedzi od dwóch tygodni, a w CRM-ie albo zeszycie masz kilkudziesięciu rolników i nie wiesz, do kogo jechać najpierw.", "brief": [{"pole": "Moja rola i oferta", "opis": "Kim jesteś i co sprzedajesz, np. „agronom handlowy u dystrybutora, środki ochrony, nawozy, nasiona + doradztwo w cenie”."}, {"pole": "Wysłana oferta", "opis": "Co i kiedy poszło, np. „oferta na wiosenny program nawożenia i ochrony rzepaku, wysłana 3 tygodnie temu, bez odpowiedzi”."}, {"pole": "Klient i historia", "opis": "Kto i co wiadomo, np. „p. Mazur, Radziejów, 260 ha, kupuje głównie u konkurencji, rok temu wziął ode mnie tylko nasiona”."}, {"pole": "Portfel klientów", "opis": "Twoja baza w liczbach, np. „48 gospodarstw, 12 kupuje regularnie, 20 sporadycznie, 16 nieaktywnych od roku”."}, {"pole": "Cele sprzedażowe", "opis": "Twoje cele i możliwości, np. „cel na sezon od szefa …, chcę zwiększyć liczbę stałych klientów, max 25 wizyt tygodniowo” — liczby od Ciebie."}, {"pole": "Przeszkody", "opis": "Co blokuje, np. „rolnicy porównują ceny w internecie, konkurencja daje dłuższy termin płatności, mało czasu na nowe gospodarstwa”."}], "prompt": "Jesteś doświadczonym polskim agronomem handlowym, który od lat pracuje u dystrybutora środków produkcji i buduje stały portfel klientów przez rzetelne doradztwo. Pomóż mi zaplanować follow-up oferty i rozwój portfela.\n\nDANE:\nMoja rola i oferta: [MOJA ROLA I OFERTA]\nWysłana oferta: [WYSŁANA OFERTA]\nKlient i historia: [KLIENT I HISTORIA]\nPortfel klientów: [PORTFEL KLIENTÓW]\nCele sprzedażowe: [CELE SPRZEDAŻOWE]\nPrzeszkody: [PRZESZKODY]\n\nZASADY:\n1. Najpierw sprawdź kompletność danych. Jeśli czegoś istotnego brakuje, zadaj maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Follow-up ma wnosić wartość (obserwacja z pola, przypomnienie o fazie rozwojowej, zaproszenie na dzień pola), a nie tylko pytać „i jak, decyzja?”.\n3. Nie podawaj cen, rabatów ani warunków płatności, których nie wskazałem. Nie obiecuj skuteczności produktów ponad etykietę.\n4. Segmentację portfela zrób na moich danych (np. aktywni, sporadyczni, uśpieni, potencjalni) i przypisz każdej grupie działanie i częstotliwość kontaktu.\n5. Plan wizyt musi zmieścić się w moim limicie czasu; pokaż obliczenie, ile kontaktów tygodniowo wymaga plan.\n6. Uwzględnij argumenty na porównywanie cen w internecie: serwis, obecność w polu, odpowiedzialność za zalecenie.\n7. Nie wymyślaj cen, stawek, kwot, dawek, terminów ani numerów przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], rzeczy niepewne [DO WERYFIKACJI].\n\nFORMAT WYNIKU:\nA) Sekwencja follow-upu dla wskazanego klienta: dzień, kanał, gotowa treść.\nB) Tabela segmentacji | segment | liczba | działanie | częstotliwość |.\nC) Plan na 4 tygodnie z obliczeniem obciążenia.\nD) 3 odpowiedzi na najczęstsze obiekcje.\nE) Lista luk i założeń.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Napisz SMS na trzeci follow-up, gdy klient nadal milczy.", "Przygotuj scenariusz telefonu do klienta uśpionego od roku.", "Zrób listę 10 pytań do rozmowy o potrzebach na sezon.", "Odpowiedz na obiekcję „w internecie mam taniej”.", "Przygotuj plan wizyt na przyszły tydzień z podziałem na trasy.", "Napisz wiadomość z zaproszeniem na dzień pola dla klientów sporadycznych.", "Zrób szablon notatki po wizycie handlowej do CRM.", "Przygotuj plan pozyskania 5 nowych gospodarstw w moim rejonie.", "Napisz uprzejme zamknięcie oferty, gdy klient wybrał konkurencję.", "Wypisz sygnały, że klient jest gotowy na rozmowę o całym programie."], "checklista": ["Ceny, rabaty i terminy płatności zgadzają się z aktualnym cennikiem i zgodą przełożonego.", "Treść follow-upu nie obiecuje skuteczności ponad etykietę.", "Zalecenia w ofercie są zgodne z rejestracją środków i stanem pola klienta.", "Plan wizyt mieści się w moim realnym czasie pracy.", "Mam zgodę klientów na kontakt SMS lub e-mail.", "Każdy follow-up ma datę w kalendarzu."], "uwaga": "Rekomendacja środka ochrony roślin musi być zgodna z etykietą i rejestracją (wyszukiwarka środków ochrony roślin MRiRW), niezależnie od celu sprzedażowego. Ceny i warunki handlowe ustala Twoja firma.", "przyklad": {"wejscie": "Jestem agronomem handlowym u dystrybutora w kujawsko-pomorskim. Trzy tygodnie temu wysłałem panu Mazurowi z Radziejowa ofertę na wiosenny program nawożenia i ochrony rzepaku, 260 ha, cisza. Rok temu wziął ode mnie tylko nasiona, resztę kupuje u konkurencji. W bazie mam 48 gospodarstw: 12 regularnych, 20 sporadycznych, 16 nie kupowało od roku. Mogę zrobić max 25 wizyt w tygodniu. Problem: porównują ceny w internecie, a konkurencja daje dłuższy termin płatności.", "wynik": "SEKWENCJA FOLLOW-UPU — p. Mazur, Radziejów\n\nDzień 1 — SMS:\n„Dzień dobry, tu [DO UZUPEŁNIENIA: imię], agronom. Byłem dziś na rzepakach koło Radziejowa — ruszają nierówno. Mogę w tym tygodniu zajrzeć na Pana pola i przy okazji omówić program na wiosnę? Bez zobowiązań.”\n\nDzień 3 — telefon (jeśli brak odpowiedzi):\nCel: umówić wizytę w polu, nie dopytywać o ofertę. „Nie dzwonię z cennikiem, tylko z tym, co widzę w polu.”\n\nDzień 7–10 — wizyta w polu + krótka notatka z lustracji wysłana tego samego dnia.\n\nSEGMENTACJA PORTFELA\n| segment | liczba | działanie | częstotliwość |\n| regularni | 12 | lustracje, utrzymanie | co 1–2 tygodnie w sezonie |\n| sporadyczni | 20 | wizyta w polu + propozycja programu | co 2–3 tygodnie |\n| uśpieni | 16 | telefon + zaproszenie na dzień pola | raz w miesiącu |\n\nObciążenie tygodniowe [ZAŁOŻENIE: średnie częstotliwości]: regularni 12 ÷ 1,5 = 8, sporadyczni 20 ÷ 2,5 = 8, uśpieni 16 ÷ 4,3 ≈ 4 kontakty (telefon) → razem ok. 16 wizyt + 4 telefony, mieści się w limicie 25 wizyt.\n\nObiekcja „w internecie taniej”: „Cena środka to jedno. Ja jestem na Pana polu, kiedy trzeba zdecydować o terminie — i podpisuję się pod zaleceniem.” Termin płatności: [DO WERYFIKACJI z działem handlowym].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}]}, {"dzial_nr": 5, "dzial": "Dokumentacja, ARiMR i dopłaty", "opis": "Papierologia zjada doradcy pół sezonu: wnioski, ekoschematy, biznesplany, szkody, wezwania i terminy. Ten dział układa dokumenty z Twoich danych i wklejonych zasad kampanii — bez zgadywania kwot i terminów — a każdą lukę oznacza do weryfikacji przed podpisem.", "skills": [{"id": "5.01", "nazwa": "Checklista wniosku o płatności bezpośrednie", "tag": "WNIOSEK OBSZAROWY", "co_robi": "Na podstawie danych gospodarstwa i wklejonych przez Ciebie zasad bieżącej kampanii układa checklistę wniosku o płatności bezpośrednie i obszarowe: działki, uprawy, interwencje do zaznaczenia, załączniki i rzeczy do sprawdzenia. Nie podaje kwot — tylko porządek i kontrolę kompletności.", "kiedy": "Przed złożeniem wniosku w aplikacji eWniosekPlus, gdy siadasz z rolnikiem nad mapą działek i chcesz niczego nie pominąć.", "brief": [{"pole": "Gospodarstwo", "opis": "Kto, gdzie, ile ha, np. „Jan Nowak, gm. Kłodawa, pow. kolski, 64 ha GO, w tym 8 ha dzierżawy ustnej”."}, {"pole": "Działki i uprawy", "opis": "Lista działek rolnych z uprawami, np. „A – pszenica ozima 22 ha, B – rzepak 14 ha, C – kukurydza 18 ha, D – TUZ 10 ha”."}, {"pole": "Zwierzęta", "opis": "Stado, jeśli dotyczy, np. „bydło mięsne 35 szt., numery w IRZplus”, albo „brak”."}, {"pole": "Planowane interwencje", "opis": "Co rolnik chce zadeklarować, np. „płatność podstawowa, redystrybucyjna, młody rolnik?, ekoschematy na rzepaku”."}, {"pole": "Zasady kampanii", "opis": "Wklej fragmenty instrukcji wypełniania wniosku i komunikatów ARiMR na bieżący rok — AI opiera się tylko na nich."}, {"pole": "Zmiany od zeszłego roku", "opis": "Np. „nowa dzierżawa 6 ha od sąsiada, sprzedaż działki 213/4, nowy sad 1,2 ha”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który co roku pomaga rolnikom składać wniosek o płatności bezpośrednie i obszarowe w ARiMR. Przygotuj checklistę wniosku dla gospodarstwa.\n\nDANE:\nGospodarstwo: [GOSPODARSTWO]\nDziałki rolne i uprawy: [DZIAŁKI I UPRAWY]\nZwierzęta: [ZWIERZĘTA]\nInterwencje, które rolnik chce zadeklarować: [PLANOWANE INTERWENCJE]\nZasady bieżącej kampanii (wklejone z ARiMR): [ZASADY KAMPANII]\nZmiany od poprzedniego roku: [ZMIANY OD ZESZŁEGO ROKU]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź, zanim napiszesz dokument.\n2. Nie wymyślaj kwot dopłat, stawek, punktów, terminów naboru, numerów przepisów ani zasad kampanii. Opieraj się wyłącznie na tekście zasad, który wkleiłem; czego w nim nie ma, oznacz [DO WERYFIKACJI].\n3. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE]. Jeśli coś liczysz, pokaż obliczenia krok po kroku.\n4. Nie podawaj żadnych kwot ani stawek płatności. Wskazuj tylko, co trzeba zaznaczyć, sprawdzić i załączyć.\n5. Przy każdej interwencji napisz, jakie warunki wynikają z wklejonych zasad; jeśli zasad nie wkleiłem, poproś o nie.\n\nFORMAT WYNIKU:\nA) Tabela działek: | działka | uprawa | pow. ha | interwencje | uwagi |.\nB) Checklista kroków w aplikacji, w kolejności wypełniania.\nC) Lista załączników i dokumentów do przygotowania (dzierżawy, zgody, oświadczenia).\nD) Ryzyka: miejsca, gdzie najczęściej pojawiają się błędy w takim gospodarstwie.\nE) Lista pytań do rolnika przed wysłaniem wniosku.\n\nNa końcu dopisz notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dodaj kolumnę z numerami działek ewidencyjnych, które ci podam.", "Sprawdź, czy suma powierzchni działek rolnych zgadza się z powierzchnią gospodarstwa.", "Wypisz osobno rzeczy, które wymagają decyzji rolnika.", "Przygotuj krótką instrukcję dla rolnika, co ma mi przynieść na spotkanie.", "Zrób wersję checklisty do wydruku na jedną stronę A4.", "Porównaj deklarację z zeszłorocznym wnioskiem, który wkleję.", "Wypisz, które informacje trzeba potwierdzić w aktualnej instrukcji ARiMR.", "Dodaj sekcję o zwierzętach i zgodności z rejestrem IRZplus.", "Przygotuj listę zmian do zgłoszenia, jeśli rolnik zmieni uprawę po złożeniu wniosku.", "Napisz SMS do rolnika z przypomnieniem o brakujących dokumentach."], "checklista": ["Powierzchnie działek rolnych zgadzają się z mapą i dokumentami tytułu do gruntu.", "Każda interwencja ma potwierdzone warunki w aktualnej instrukcji ARiMR.", "W checkliście nie ma kwot ani stawek wziętych spoza oficjalnych komunikatów.", "Dzierżawy i zgody właścicieli są aktualne i dostępne.", "Zmiany od zeszłego roku zostały uwzględnione.", "Wszystkie znaczniki [DO WERYFIKACJI] zostały sprawdzone przed wysłaniem.", "Rolnik zna treść deklaracji i sam ją zatwierdza."], "uwaga": "Zasady płatności, ekoschematów i naborów zmieniają się co kampanię. AI nie zna aktualnych stawek ani terminów — opiera się tylko na tym, co wkleisz z ARiMR. Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "przyklad": {"wejscie": "Robię wniosek dla pana Nowaka z Kłodawy, 64 hektary, z tego 8 dzierżawy ustnej od szwagra. Pszenica ozima 22, rzepak 14, kukurydza 18, łąka 10. Ma 35 sztuk mięsnych, wszystko w IRZ. Chce płatność podstawową, redystrybucyjną i coś z ekoschematów na rzepaku i kukurydzy. W tym roku doszła działka po sąsiedzie, ponad 6 ha, a sprzedał 213/4. Instrukcję ARiMR wkleję później, na razie zrób mi szkielet.", "wynik": "A) Tabela działek\n| działka | uprawa | pow. ha | interwencje | uwagi |\n| A | pszenica ozima | 22 | płatność podstawowa, redystrybucyjna | — |\n| B | rzepak | 14 | j.w. + ekoschemat [DO WERYFIKACJI] | praktyka do wyboru wg zasad kampanii |\n| C | kukurydza | 18 | j.w. + ekoschemat [DO WERYFIKACJI] | |\n| D | TUZ | 10 | płatność podstawowa | sprawdzić wymogi dla TUZ [DO WERYFIKACJI] |\nSuma: 22 + 14 + 18 + 10 = 64 ha — zgodne z deklarowaną powierzchnią.\n\nB) Kroki\n1. Aktualizacja działek ewidencyjnych: dopisać nową działkę po sąsiedzie [DO UZUPEŁNIENIA: nr działki], usunąć 213/4.\n2. Wrysowanie działek rolnych na ortofotomapie.\n3. Zaznaczenie interwencji — wyłącznie wg instrukcji bieżącej kampanii [DO WERYFIKACJI].\n\nC) Dokumenty\n- Dzierżawa 8 ha ustna — [ZAŁOŻENIE] wystarczy oświadczenie; potwierdzić wymogi w instrukcji [DO WERYFIKACJI].\n- Umowa/akt dla nowej działki [DO UZUPEŁNIENIA].\n\nD) Ryzyka\n- Działka 213/4 zostawiona w wniosku po sprzedaży.\n\nE) Pytania do rolnika\n1. Jaki numer ma nowa działka i od kiedy jest w użytkowaniu?\n\nWklej instrukcję ARiMR — uzupełnię warunki interwencji.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "5.02", "nazwa": "Ekoschematy — dobór praktyk i dokumentacja", "tag": "EKOSCHEMATY", "co_robi": "Zestawia uprawy i możliwości gospodarstwa z praktykami ekoschematów, które wkleisz z aktualnych zasad ARiMR. Pokazuje, które praktyki pasują, czego wymagają w polu i jaką dokumentację trzeba prowadzić — bez wymyślania punktów i stawek.", "kiedy": "Zimą, przy planowaniu zasiewów, albo wiosną przed wnioskiem, gdy rolnik pyta: „co z tych ekoschematów mi się opłaca i co muszę za to robić?”.", "brief": [{"pole": "Gospodarstwo i uprawy", "opis": "Np. „92 ha, gm. Sońsk, pow. ciechanowski: pszenica 30, rzepak 20, kukurydza 25, groch 7, TUZ 10”."}, {"pole": "Gleby i analizy", "opis": "Np. „gleby klasy IVa–V, OSChR z ubiegłego roku: pH niskie na 3 polach, P średni”."}, {"pole": "Sprzęt i organizacja", "opis": "Np. „siewnik do uproszczeń, opryskiwacz 18 m, rozsiewacz bez sekcji, brak wozu asenizacyjnego”."}, {"pole": "Wklejone zasady ekoschematów", "opis": "Pełny opis praktyk, warunków i punktów z aktualnych materiałów ARiMR — AI nie korzysta z innych źródeł."}, {"pole": "Cele rolnika", "opis": "Np. „chce maksymalnie wykorzystać ekoschematy, ale bez zmiany płodozmianu i bez kupowania sprzętu”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który pomaga gospodarstwom dobrać praktyki ekoschematów i prowadzić do nich dokumentację. Przeanalizuj gospodarstwo pod kątem wklejonych zasad.\n\nDANE:\nGospodarstwo i uprawy: [GOSPODARSTWO I UPRAWY]\nGleby i wyniki analiz: [GLEBY I ANALIZY]\nSprzęt i organizacja pracy: [SPRZĘT I ORGANIZACJA]\nZasady ekoschematów na bieżącą kampanię (wklejone): [WKLEJONE ZASADY EKOSCHEMATÓW]\nCele i ograniczenia rolnika: [CELE ROLNIKA]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź, zanim napiszesz dokument.\n2. Nie wymyślaj kwot dopłat, stawek, punktów, terminów naboru, numerów przepisów ani zasad kampanii. Opieraj się wyłącznie na tekście zasad, który wkleiłem; czego w nim nie ma, oznacz [DO WERYFIKACJI].\n3. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE]. Jeśli coś liczysz, pokaż obliczenia krok po kroku.\n4. Rozważaj tylko praktyki opisane we wklejonych zasadach. Punktów i stawek nie przeliczaj na pieniądze, chyba że podam przelicznik z oficjalnego komunikatu.\n5. Przy każdej praktyce napisz, jakie dowody i zapisy trzeba mieć na wypadek kontroli.\n\nFORMAT WYNIKU:\nA) Tabela: | praktyka | pole/uprawa | czy pasuje | co trzeba zrobić w polu | ryzyko niespełnienia |.\nB) Rekomendowany zestaw praktyk z uzasadnieniem.\nC) Dokumentacja do prowadzenia: zapisy, zdjęcia, faktury, analizy, terminy z zasad.\nD) Konflikty z płodozmianem, sprzętem lub innymi zobowiązaniami.\nE) Pytania do doradcy ODR lub ARiMR, jeśli zasady są niejasne.\n\nNa końcu dopisz notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Pokaż, co się zmieni, jeśli rolnik dosieje międzyplon na polach po zbożach.", "Rozpisz kalendarz czynności w polu dla wybranych praktyk.", "Przygotuj szablon zapisów do prowadzenia przez cały sezon.", "Sprawdź, czy wybrane praktyki nie wykluczają się wzajemnie wg wklejonych zasad.", "Wypisz praktyki, które wymagają analizy gleby, i jakie analizy zamówić w OSChR.", "Przygotuj krótkie wyjaśnienie dla rolnika bez urzędowego języka.", "Zrób listę zdjęć z geolokalizacją, które warto robić w sezonie.", "Porównaj dwa warianty: minimum pracy i maksimum praktyk.", "Wypisz, co trzeba zrobić przed złożeniem wniosku, a co po.", "Przygotuj tabelę do wpisywania dat wykonania praktyk."], "checklista": ["Każda praktyka pochodzi z aktualnych, oficjalnych zasad kampanii.", "Warunki i terminy praktyk zostały sprawdzone w materiałach ARiMR.", "Rolnik ma sprzęt i możliwości, żeby wykonać wybrane praktyki.", "Dla każdej praktyki jest ustalony sposób dokumentowania.", "Nie ma konfliktu z płodozmianem i innymi zobowiązaniami.", "Znaczniki [DO WERYFIKACJI] zostały wyjaśnione."], "uwaga": "Zasady płatności, ekoschematów i naborów zmieniają się co kampanię. AI nie zna aktualnych stawek ani terminów — opiera się tylko na tym, co wkleisz z ARiMR. Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "przyklad": {"wejscie": "Gospodarstwo pod Sońskiem, 92 hektary. Pszenica 30, rzepak 20, kukurydza 25, groch 7, łąki 10. Gleby słabe, czwórki i piątki, w zeszłym roku robili OSChR i trzy pola wyszły kwaśne. Siewnik do uproszczeń jest, opryskiwacz 18 metrów, rozsiewacz zwykły bez sekcji. Wozu na gnojowicę nie ma. Rolnik chce brać, co się da z ekoschematów, ale płodozmianu nie ruszy i sprzętu nie kupi. Zasady wklejam niżej.", "wynik": "A) Dopasowanie praktyk\n| praktyka | pole/uprawa | czy pasuje | co w polu | ryzyko |\n| uproszczone systemy uprawy | pszenica, rzepak | tak | siew siewnikiem do uproszczeń | brak zapisów o zabiegach |\n| wapnowanie wg analiz | 3 pola kwaśne | tak, jeśli zasady obejmują | wapnowanie wg zaleceń OSChR | brak analizy lub faktury [DO WERYFIKACJI] |\n| aplikacja nawozów naturalnych płynnych | — | nie | brak wozu | — |\n| międzyplony | po zbożach | warunkowo | wysiew po żniwach | termin wysiewu [DO WERYFIKACJI] |\n\nB) Rekomendacja\nZestaw: uproszczona uprawa + wapnowanie na polach kwaśnych + międzyplon po pszenicy [ZAŁOŻENIE: rolnik zgodzi się na wysiew po żniwach]. Punktów nie przeliczam na złotówki — przelicznik tylko z oficjalnego komunikatu [DO WERYFIKACJI].\n\nC) Dokumentacja\n- Ewidencja zabiegów agrotechnicznych z datami.\n- Wyniki OSChR i zalecenie wapnowania.\n- Faktura za wapno [DO UZUPEŁNIENIA].\n- Zdjęcia z geolokalizacją po siewie międzyplonu.\n\nD) Konflikty\n- Groch 7 ha — sprawdzić, czy w zasadach jest praktyka dla bobowatych [DO WERYFIKACJI].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "5.03", "nazwa": "Biznesplan do wniosku inwestycyjnego (Modernizacja gospodarstw)", "tag": "BIZNESPLAN", "co_robi": "Pomaga zbudować biznesplan i opis operacji do wniosku inwestycyjnego, np. „Modernizacja gospodarstw rolnych”, według kryteriów z ogłoszenia o naborze, które wkleisz. Liczy wskaźniki tylko z Twoich danych i pokazuje, gdzie brakuje uzasadnienia.", "kiedy": "Gdy rolnik chce kupić sprzęt lub postawić budynek z dofinansowaniem, nabór jest ogłoszony, a Ty musisz poukładać liczby, opis i kryteria wyboru.", "brief": [{"pole": "Gospodarstwo i produkcja", "opis": "Np. „Wiesław Kowalczyk, gm. Bieliny, 48 ha, sady jabłoniowe 22 ha, zboża 26 ha, 2 osoby pracujące”."}, {"pole": "Planowana inwestycja", "opis": "Co, za ile wg ofert, np. „opryskiwacz sadowniczy z recyrkulacją + przechowalnia KA, kwoty wg ofert”."}, {"pole": "Wyniki ekonomiczne", "opis": "Przychody, koszty, produkcja z ostatnich lat — z rachunkowości, FADN lub faktur."}, {"pole": "Ogłoszenie o naborze", "opis": "Wklej kryteria, koszty kwalifikowalne, warunki i punktację z aktualnego ogłoszenia i regulaminu."}, {"pole": "Cel i uzasadnienie", "opis": "Np. „mniejsze straty w przechowywaniu, dłuższa sprzedaż, ograniczenie znoszenia cieczy”."}, {"pole": "Finansowanie", "opis": "Wkład własny, kredyt, prefinansowanie, np. „30% gotówki, reszta kredyt w banku spółdzielczym”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który przygotowuje biznesplany do wniosków o pomoc inwestycyjną dla gospodarstw. Pomóż mi przygotować biznesplan i opis operacji.\n\nDANE:\nGospodarstwo i produkcja: [GOSPODARSTWO I PRODUKCJA]\nPlanowana inwestycja i oferty: [PLANOWANA INWESTYCJA]\nWyniki ekonomiczne: [WYNIKI EKONOMICZNE]\nOgłoszenie o naborze, kryteria i regulamin (wklejone): [OGŁOSZENIE O NABORZE]\nCel i uzasadnienie inwestycji: [CEL I UZASADNIENIE]\nŹródła finansowania: [FINANSOWANIE]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź, zanim napiszesz dokument.\n2. Nie wymyślaj kwot dopłat, stawek, punktów, terminów naboru, numerów przepisów ani zasad kampanii. Opieraj się wyłącznie na tekście zasad, który wkleiłem; czego w nim nie ma, oznacz [DO WERYFIKACJI].\n3. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE]. Jeśli coś liczysz, pokaż obliczenia krok po kroku.\n4. Wysokość pomocy, intensywność, limity i punktację bierz tylko z wklejonego ogłoszenia. Kwoty inwestycji tylko z ofert, które podałem.\n5. Prognozy opisuj ostrożnie i pokazuj założenia, z których wynikają.\n\nFORMAT WYNIKU:\nA) Opis gospodarstwa i stanu obecnego.\nB) Opis operacji: co, gdzie, dlaczego, harmonogram.\nC) Tabela kosztów: | pozycja | koszt wg oferty | kwalifikowalny wg ogłoszenia | uwagi |.\nD) Prognoza ekonomiczna przed i po inwestycji z obliczeniami.\nE) Kryteria wyboru z ogłoszenia i jak gospodarstwo je spełnia.\nF) Lista załączników i luk do uzupełnienia.\n\nNa końcu dopisz notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Policz wariant bez kredytu, tylko z wkładem własnym.", "Przepisz uzasadnienie tak, żeby odnosiło się do każdego kryterium z ogłoszenia.", "Przygotuj harmonogram realizacji z etapami i płatnościami.", "Sprawdź, które pozycje mogą być niekwalifikowalne wg wklejonego regulaminu.", "Dodaj analizę ryzyka: ceny, pogoda, opóźnienia dostaw.", "Zrób krótkie streszczenie biznesplanu na jedną stronę.", "Porównaj trzy oferty sprzętu w tabeli.", "Wypisz dane, które muszę jeszcze dostać od rolnika.", "Przygotuj opis wpływu inwestycji na środowisko i klimat.", "Sprawdź spójność liczb między tabelami."], "checklista": ["Kwoty inwestycji pochodzą z aktualnych ofert.", "Koszty kwalifikowalne i poziom pomocy sprawdzone w ogłoszeniu i regulaminie naboru.", "Prognozy mają opisane założenia i są realne dla gospodarstwa.", "Każde kryterium wyboru ma odniesienie w treści biznesplanu.", "Liczby są spójne we wszystkich tabelach.", "Lista załączników zgadza się z ogłoszeniem.", "Rolnik zna i akceptuje zobowiązania wynikające z umowy."], "uwaga": "Zasady płatności, ekoschematów i naborów zmieniają się co kampanię. AI nie zna aktualnych stawek ani terminów — opiera się tylko na tym, co wkleisz z ARiMR. Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "przyklad": {"wejscie": "Sadownik z Bielin, Kowalczyk, 48 ha, 22 sadu jabłoni i 26 zbóż, pracuje z synem. Chce opryskiwacz sadowniczy z recyrkulacją i komorę KA na jakieś 400 ton. Oferty ma dwie na opryskiwacz i jedną na komorę, kwoty przepiszę z PDF-ów. Sprzedaje jabłka na jesieni, bo nie ma gdzie trzymać, a w marcu cena lepsza. Wkład własny z oszczędności, reszta kredyt w BS. Ogłoszenie o naborze wkleję.", "wynik": "A) Stan obecny\nGospodarstwo sadownicze w gm. Bieliny, 48 ha UR, w tym 22 ha sadów jabłoniowych i 26 ha zbóż. Praca: właściciel i syn. Owoce sprzedawane bezpośrednio po zbiorze z powodu braku przechowalni.\n\nB) Operacja\nZakup opryskiwacza sadowniczego z recyrkulacją cieczy oraz budowa komory KA o pojemności ok. 400 t [ZAŁOŻENIE wg rolnika]. Cel: wydłużenie sprzedaży i ograniczenie znoszenia cieczy.\n\nC) Koszty\n| pozycja | koszt wg oferty | kwalifikowalny | uwagi |\n| opryskiwacz — oferta 1 | [DO UZUPEŁNIENIA] | [DO WERYFIKACJI] | |\n| opryskiwacz — oferta 2 | [DO UZUPEŁNIENIA] | [DO WERYFIKACJI] | |\n| komora KA | [DO UZUPEŁNIENIA] | [DO WERYFIKACJI] | sprawdzić, czy budowa wymaga pozwolenia |\n\nD) Prognoza\nPrzychód po inwestycji = wolumen przechowany × (cena wiosenna − cena jesienna) − koszt przechowania. Wszystkie składniki [DO UZUPEŁNIENIA] — potrzebuję cen z ostatnich sezonów.\n\nE) Kryteria\nCzekam na ogłoszenie — punktacji nie zakładam [DO WERYFIKACJI].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "5.04", "nazwa": "Wniosek o kredyt — opis gospodarstwa i przedsięwzięcia", "tag": "KREDYT ROLNICZY", "co_robi": "Przygotowuje dla banku czytelny opis gospodarstwa, przedsięwzięcia i zdolności do spłaty, na podstawie Twoich liczb. Układa argumenty tak, jak czyta je analityk kredytowy, i pokazuje, czego bank może jeszcze zażądać.", "kiedy": "Gdy rolnik idzie do banku po kredyt obrotowy lub inwestycyjny, a bank prosi o „opis działalności i planowanego przedsięwzięcia”.", "brief": [{"pole": "Gospodarstwo", "opis": "Np. „Marek i Anna Zielińscy, gm. Sompolno, 120 ha, w tym 40 ha dzierżawy, tuczarnia 600 stanowisk”."}, {"pole": "Przedsięwzięcie i kwota", "opis": "Np. „zakup ciągnika 180 KM, kredyt wg oferty banku [kwota], okres wg oferty”."}, {"pole": "Wyniki finansowe", "opis": "Przychody, koszty, dochód z ostatnich 2–3 lat, z rachunkowości, PIT/KRUS lub zestawień."}, {"pole": "Zobowiązania i zabezpieczenia", "opis": "Inne kredyty, leasingi, raty, proponowane zabezpieczenia."}, {"pole": "Wymagania banku", "opis": "Wklej listę dokumentów i wzór opisu z banku, jeśli jest."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który pomaga gospodarstwom przygotować dokumenty do banku. Napisz opis gospodarstwa i przedsięwzięcia do wniosku kredytowego.\n\nDANE:\nGospodarstwo i właściciele: [GOSPODARSTWO]\nPrzedsięwzięcie i wnioskowana kwota: [PRZEDSIĘWZIĘCIE I KWOTA]\nWyniki finansowe: [WYNIKI FINANSOWE]\nZobowiązania i proponowane zabezpieczenia: [ZOBOWIĄZANIA I ZABEZPIECZENIA]\nWymagania i wzory banku (wklejone): [WYMAGANIA BANKU]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź, zanim napiszesz dokument.\n2. Nie wymyślaj kwot dopłat, stawek, punktów, terminów naboru, numerów przepisów ani zasad kampanii. Opieraj się wyłącznie na tekście zasad, który wkleiłem; czego w nim nie ma, oznacz [DO WERYFIKACJI].\n3. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE]. Jeśli coś liczysz, pokaż obliczenia krok po kroku.\n4. Oprocentowanie, prowizje i warunki kredytu bierz tylko z oferty banku, którą wkleję; nie zakładaj ich sam.\n5. Pisz rzeczowo, bez przesadnego optymizmu; analityk ma zobaczyć ryzyka i sposób ich ograniczenia.\n\nFORMAT WYNIKU:\nA) Opis gospodarstwa: produkcja, ziemia, budynki, sprzęt, rynki zbytu.\nB) Opis przedsięwzięcia i jego wpływ na wyniki.\nC) Zdolność do spłaty: tabela przepływów z obliczeniami krok po kroku.\nD) Ryzyka i sposoby ich ograniczenia.\nE) Lista dokumentów do dołączenia i brakujących danych.\n\nNa końcu dopisz notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Policz wariant z niższą ceną tuczników o tyle procent, ile podam.", "Skróć opis do jednej strony dla doradcy bankowego.", "Dodaj sekcję o umowach kontraktacyjnych i odbiorcach.", "Przygotuj zestawienie majątku gospodarstwa w tabeli.", "Wypisz pytania, które bank może zadać, i propozycje odpowiedzi.", "Porównaj dwie oferty kredytowe, które wkleję.", "Przeredaguj tekst na bardziej formalny.", "Dodaj opis doświadczenia i kwalifikacji rolnika.", "Pokaż harmonogram spłat obok sezonowości wpływów.", "Sprawdź spójność liczb z dokumentami, które wkleję."], "checklista": ["Wszystkie liczby pochodzą z dokumentów rolnika, nie z szacunków AI.", "Warunki kredytu są przepisane z oferty banku.", "Zobowiązania są kompletne, łącznie z leasingami i ratami.", "Ryzyka zostały opisane uczciwie.", "Opis zgadza się z wymaganiami i wzorem banku.", "Rolnik przeczytał i zaakceptował treść."], "uwaga": "Opis do banku to szkic. Dane finansowe muszą zgadzać się z dokumentami źródłowymi — podpis i odpowiedzialność zostają po Twojej stronie.", "przyklad": {"wejscie": "Zielińscy z Sompolna, 120 ha, 40 z tego dzierżawy, tuczarnia na 600 sztuk w cyklu zamkniętym nie, kupują warchlaka. Chcą kredyt na ciągnik 180 koni, oferta z banku jest, wkleję. Mają jeszcze leasing na kombajn i kredyt na paszownię. Przychody z ostatnich dwóch lat mam z zestawienia, wyślę. Bank chce opis gospodarstwa i przedsięwzięcia, jakąś stronę, dwie.", "wynik": "A) Gospodarstwo\nGospodarstwo rodzinne Marka i Anny Zielińskich w gm. Sompolno prowadzi produkcję roślinną na 120 ha (w tym 40 ha dzierżawy) oraz tucz w systemie otwartym — tuczarnia na 600 stanowisk, zakup warchlaka. Pasze w części z własnych zbóż, przygotowywane w paszowni.\n\nB) Przedsięwzięcie\nZakup ciągnika ok. 180 KM zastąpi wyeksploatowany sprzęt [DO UZUPEŁNIENIA: model i rok obecnego ciągnika], skróci terminy prac polowych i ograniczy koszty napraw.\n\nC) Zdolność do spłaty\n| pozycja | rok 1 | rok 2 |\n| przychody | [DO UZUPEŁNIENIA] | [DO UZUPEŁNIENIA] |\n| koszty operacyjne | [DO UZUPEŁNIENIA] | [DO UZUPEŁNIENIA] |\n| raty leasingu kombajnu | [DO UZUPEŁNIENIA] | |\n| raty kredytu na paszownię | [DO UZUPEŁNIENIA] | |\n| rata nowego kredytu | wg oferty [DO WERYFIKACJI] | |\nNadwyżka = przychody − koszty − raty. Policzę po otrzymaniu danych.\n\nD) Ryzyka\n- Zmienność cen tuczników i warchlaka — [DO UZUPEŁNIENIA: czy jest umowa z odbiorcą?].\n- Dzierżawa 40 ha — okres umów [DO WERYFIKACJI].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "5.05", "nazwa": "Plan działalności rolnośrodowiskowo-klimatycznej", "tag": "PLAN ROLNOŚRODOWISKOWY", "co_robi": "Układa strukturę planu działalności rolnośrodowiskowo-klimatycznej z danych doradcy: opis gospodarstwa, działki objęte zobowiązaniem, wymogi pakietów i harmonogram działań. Wymogi pakietów bierze tylko z wklejonych materiałów.", "kiedy": "Gdy jako doradca przygotowujesz plan dla nowego zobowiązania albo zmieniasz plan po zmianie powierzchni czy pakietu.", "brief": [{"pole": "Gospodarstwo i rolnik", "opis": "Np. „Teresa Mazur, gm. Biebrza, pow. moniecki, 56 ha, w tym 30 ha TUZ na terenie Natura 2000”."}, {"pole": "Działki i pakiety", "opis": "Np. „działki 45/1, 45/2 — trwałe użytki zielone, wariant do ustalenia; działka 112/3 — ochrona gleb”."}, {"pole": "Ekspertyza przyrodnicza", "opis": "Wnioski z ekspertyzy, jeśli wymagana, np. „siedliska ptaków, termin pierwszego pokosu wg ekspertyzy”."}, {"pole": "Wymogi pakietów", "opis": "Wklej opis pakietów, wariantów i wymogów z aktualnych materiałów ARiMR/ODR."}, {"pole": "Dane doradcy", "opis": "Imię, nazwisko, numer na liście doradców, data sporządzenia planu."}], "prompt": "Jesteś doświadczonym polskim doradcą rolnośrodowiskowym, który sporządza plany działalności rolnośrodowiskowo-klimatycznej. Przygotuj strukturę i treść planu.\n\nDANE:\nGospodarstwo i rolnik: [GOSPODARSTWO I ROLNIK]\nDziałki i planowane pakiety/warianty: [DZIAŁKI I PAKIETY]\nWnioski z ekspertyzy przyrodniczej: [EKSPERTYZA PRZYRODNICZA]\nWymogi pakietów (wklejone z aktualnych materiałów): [WYMOGI PAKIETÓW]\nDane doradcy sporządzającego plan: [DANE DORADCY]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź, zanim napiszesz dokument.\n2. Nie wymyślaj kwot dopłat, stawek, punktów, terminów naboru, numerów przepisów ani zasad kampanii. Opieraj się wyłącznie na tekście zasad, który wkleiłem; czego w nim nie ma, oznacz [DO WERYFIKACJI].\n3. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE]. Jeśli coś liczysz, pokaż obliczenia krok po kroku.\n4. Wymogi, terminy koszenia, zakazy i okres zobowiązania bierz tylko z wklejonych materiałów i ekspertyzy; nie uzupełniaj ich z pamięci.\n5. Pisz językiem, który rolnik zrozumie, ale zachowaj urzędową strukturę planu.\n\nFORMAT WYNIKU:\nA) Część opisowa gospodarstwa.\nB) Tabela: | działka | pow. ha | pakiet/wariant | wymogi | uwagi z ekspertyzy |.\nC) Harmonogram działań na każdy rok zobowiązania.\nD) Wymogi dokumentacyjne: rejestr działalności, zdjęcia, faktury, analizy.\nE) Lista luk i rzeczy do potwierdzenia przed podpisem.\n\nNa końcu dopisz notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przygotuj wersję harmonogramu do powieszenia na ścianie w gospodarstwie.", "Dodaj wzór rejestru działalności rolnośrodowiskowej.", "Sprawdź, czy działki nie mają sprzecznych zobowiązań.", "Przepisz wymogi na proste polecenia dla rolnika.", "Zaktualizuj plan po zmianie powierzchni działki, którą podam.", "Wypisz terminy z ekspertyzy w jednej tabeli.", "Dodaj sekcję o zdjęciach i dowodach wykonania koszenia.", "Przygotuj listę pytań do eksperta przyrodniczego.", "Porównaj dwa warianty pakietu dla tej samej działki.", "Przygotuj notatkę z rozmowy z rolnikiem o zobowiązaniach."], "checklista": ["Wymogi pakietów zgadzają się z aktualnymi materiałami.", "Terminy i zalecenia z ekspertyzy przyrodniczej zostały przepisane wiernie.", "Powierzchnie działek zgadzają się z wnioskiem.", "Rolnik rozumie zakazy i obowiązki na cały okres zobowiązania.", "Plan zawiera dane i podpis uprawnionego doradcy.", "Wszystkie [DO WERYFIKACJI] zostały sprawdzone."], "uwaga": "Zasady płatności, ekoschematów i naborów zmieniają się co kampanię. AI nie zna aktualnych stawek ani terminów — opiera się tylko na tym, co wkleisz z ARiMR. Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "przyklad": {"wejscie": "Pani Mazur, gmina Biebrza, 56 ha, z tego 30 łąk w Naturze. Ekspertyzę ornitologiczną robił pan z Białegostoku, wyszły siedliska ptaków na 45/1 i 45/2, koszenie nie wcześniej niż on tam napisał. 112/3 to orne na stoku, chcemy ochronę gleb. Ja jestem doradcą, numer z listy mam w papierach. Materiały z pakietami wkleję, zrób mi na razie układ planu.", "wynik": "A) Gospodarstwo\nGospodarstwo Teresy Mazur, gm. Biebrza, pow. moniecki, 56 ha UR, w tym ok. 30 ha TUZ na obszarze Natura 2000. Kierunek produkcji: [DO UZUPEŁNIENIA].\n\nB) Działki\n| działka | pow. ha | pakiet/wariant | wymogi | ekspertyza |\n| 45/1 | [DO UZUPEŁNIENIA] | ochrona siedlisk ptaków [DO WERYFIKACJI] | wg materiałów | termin koszenia wg ekspertyzy [DO UZUPEŁNIENIA] |\n| 45/2 | [DO UZUPEŁNIENIA] | j.w. | wg materiałów | j.w. |\n| 112/3 | [DO UZUPEŁNIENIA] | ochrona gleb [DO WERYFIKACJI] | wg materiałów | — |\n\nC) Harmonogram — rok 1\n- Koszenie 45/1 i 45/2: nie wcześniej niż data z ekspertyzy [DO UZUPEŁNIENIA].\n- 112/3: działania wg wymogów pakietu [DO WERYFIKACJI].\n\nD) Dokumentacja\n- Rejestr działalności rolnośrodowiskowej z datami prac.\n- Zdjęcia z datą przed i po koszeniu.\n\nE) Luki\n- Numer doradcy na liście [DO UZUPEŁNIENIA].\n- Pełne wymogi pakietów — czekam na wklejone materiały.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "5.06", "nazwa": "Dokumentacja szkód łowieckich", "tag": "SZKODY ŁOWIECKIE", "co_robi": "Przygotowuje zgłoszenie szkody łowieckiej, notatkę do oględzin i kontrolę protokołu z szacowania. Pomaga zebrać dowody (zdjęcia, powierzchnie, fazy) tak, żeby rolnik nie stracił argumentów przy odbiorze szkody.", "kiedy": "Gdy dziki zryły kukurydzę lub łąkę, a rolnik dzwoni: „co mam napisać i do kogo, żeby mi to oszacowali?”.", "brief": [{"pole": "Rolnik i pole", "opis": "Np. „Paweł Wróbel, gm. Lubniewice, działka 87/2 „Pod lasem”, kukurydza na ziarno 9 ha”."}, {"pole": "Opis szkody", "opis": "Co, kiedy zauważone, jaki gatunek zwierząt, np. „dziki, ryje od tygodnia, ok. 1,5 ha zniszczone, faza BBCH 15”."}, {"pole": "Dowody", "opis": "Zdjęcia, nagrania, ślady, świadkowie, np. „zdjęcia z telefonu z datą, ślady racic przy rowie”."}, {"pole": "Koło łowieckie i obwód", "opis": "Nazwa koła/zarządcy obwodu, jeśli znana, albo „nie wiem” — AI wskaże, jak ustalić."}, {"pole": "Zasady i terminy", "opis": "Wklej aktualne przepisy lub informację z gminy/izby rolniczej o terminach zgłoszenia i trybie szacowania."}, {"pole": "Protokół z oględzin", "opis": "Jeśli już był — wklej treść, AI sprawdzi zgodność z faktami."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który pomaga rolnikom dokumentować szkody łowieckie i przygotować się do szacowania. Przygotuj dokumentację szkody.\n\nDANE:\nRolnik i pole: [ROLNIK I POLE]\nOpis szkody: [OPIS SZKODY]\nZebrane dowody: [DOWODY]\nKoło łowieckie lub zarządca obwodu: [KOŁO ŁOWIECKIE I OBWÓD]\nZasady i terminy (wklejone): [ZASADY I TERMINY]\nProtokół z oględzin, jeśli był: [PROTOKÓŁ Z OGLĘDZIN]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź, zanim napiszesz dokument.\n2. Nie wymyślaj kwot dopłat, stawek, punktów, terminów naboru, numerów przepisów ani zasad kampanii. Opieraj się wyłącznie na tekście zasad, który wkleiłem; czego w nim nie ma, oznacz [DO WERYFIKACJI].\n3. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE]. Jeśli coś liczysz, pokaż obliczenia krok po kroku.\n4. Terminy zgłoszenia, tryb oględzin i szacowania podawaj tylko z wklejonych zasad; jeśli ich nie wkleiłem, oznacz [DO WERYFIKACJI] i napisz, gdzie to sprawdzić.\n5. Opis szkody ma być faktograficzny: powierzchnia, faza rozwojowa, rodzaj uszkodzeń, data — bez wyceny, której AI nie może znać.\n\nFORMAT WYNIKU:\nA) Treść zgłoszenia szkody do zarządcy obwodu.\nB) Lista dowodów do zebrania przed oględzinami.\nC) Notatka na oględziny: co pokazać, o co zapytać, czego pilnować.\nD) Analiza protokołu, jeśli go wkleiłem: rozbieżności i uwagi do wpisania.\nE) Kalendarz dalszych kroków z terminami z zasad.\n\nNa końcu dopisz notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przygotuj wersję zgłoszenia do wysłania e-mailem i listem poleconym.", "Dopisz uwagi rolnika do protokołu w rzeczowej formie.", "Policz powierzchnię szkody z pomiarów, które podam.", "Przygotuj listę zdjęć do zrobienia na polu.", "Napisz odwołanie od szacowania na podstawie rozbieżności.", "Zrób notatkę do szacowania ostatecznego przed zbiorem.", "Przygotuj pismo do gminy lub izby rolniczej o udział przedstawiciela.", "Wypisz informacje, które muszą być w protokole.", "Przygotuj krótką instrukcję dla rolnika na kolejne szkody.", "Zestaw wszystkie szkody z sezonu w jednej tabeli."], "checklista": ["Zgłoszenie zostało wysłane w terminie wynikającym z aktualnych przepisów.", "Rolnik ma dowód wysłania zgłoszenia.", "Zdjęcia mają datę i pozwalają zlokalizować szkodę.", "Powierzchnia i faza rozwojowa uprawy są opisane faktograficznie.", "Protokół zawiera uwagi rolnika, jeśli się z nim nie zgadza.", "Terminy odwołania zostały sprawdzone."], "uwaga": "Terminy zgłoszeń i tryb szacowania szkód łowieckich wynikają z przepisów, które mogą się zmieniać — AI ich nie zgaduje. Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "przyklad": {"wejscie": "Pan Wróbel z Lubniewic dzwoni, dziki ryją kukurydzę na 87/2 pod lasem, 9 hektarów, od tygodnia. Kukurydza ma 5 liści, BBCH 15. Zniszczone tak na oko półtora hektara, w kilku placach. Zdjęcia robił telefonem, są z datą. Nie wie, które koło ma ten obwód. Zrób zgłoszenie i powiedz, co ma przygotować na oględziny.", "wynik": "A) Zgłoszenie szkody\nDo: zarządca obwodu łowieckiego [DO UZUPEŁNIENIA: nazwa koła — ustalić w urzędzie gminy lub na mapie obwodów]\nZgłaszający: Paweł Wróbel, [DO UZUPEŁNIENIA: adres, telefon]\nZgłaszam szkodę wyrządzoną przez dziki w uprawie kukurydzy na ziarno na działce 87/2 (obręb [DO UZUPEŁNIENIA]), gm. Lubniewice. Uszkodzenia zauważono ok. [DO UZUPEŁNIENIA: data], w fazie BBCH 15. Szacunkowa powierzchnia uszkodzeń ok. 1,5 ha [ZAŁOŻENIE: ocena wzrokowa rolnika], w kilku miejscach. Proszę o oględziny w terminie wynikającym z przepisów [DO WERYFIKACJI].\n\nB) Dowody\n- Zdjęcia z datą i, jeśli się da, z lokalizacją GPS.\n- Pomiar placów: długość × szerokość lub obrys w aplikacji GPS.\n- Dowód wysłania zgłoszenia (potwierdzenie nadania lub e-mail).\n\nC) Na oględziny\n- Pokazać wszystkie place, nie tylko największe.\n- Dopilnować, żeby w protokole była faza rozwojowa i powierzchnia.\n- Jeśli rolnik się nie zgadza — wpisać uwagi do protokołu.\n\nD) Terminy\nZgłoszenie, oględziny, szacowanie ostateczne, odwołanie — wszystkie [DO WERYFIKACJI] w aktualnych przepisach.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "5.07", "nazwa": "Dokumentacja szkód suszowych i klęskowych", "tag": "SZKODY KLĘSKOWE", "co_robi": "Pomaga przygotować wniosek o oszacowanie szkód (susza, grad, przymrozek, ulewa, powódź), opis strat na polach i zestaw dowodów. Porządkuje dane pod protokół komisji lub zgłoszenie w aplikacji, zgodnie z zasadami, które wkleisz.", "kiedy": "Po suszy, gradobiciu lub przymrozku, gdy rolnik musi szybko zgłosić straty, a Ty chcesz, żeby opis był pełny i spójny z rzeczywistością.", "brief": [{"pole": "Gospodarstwo", "opis": "Np. „Krzysztof Lis, gm. Kościan, 78 ha, gleby lekkie, ubezpieczenie upraw: tak, rzepak i pszenica”."}, {"pole": "Zjawisko i data", "opis": "Np. „susza od połowy kwietnia, brak opadów, w maju przymrozek 3 dni”."}, {"pole": "Uprawy i straty", "opis": "Pole, uprawa, pow., faza, objawy, szacunek rolnika, np. „Za stodołą — jęczmień jary 12 ha, BBCH 31, żółknięcie, ubytek wg rolnika duży”."}, {"pole": "Dowody", "opis": "Zdjęcia, pomiary, dane z najbliższej stacji, notatki z lustracji."}, {"pole": "Zasady i tryb zgłoszenia", "opis": "Wklej aktualne zasady: komisja gminna, aplikacja suszowa, wniosek o pomoc — co obowiązuje w tym roku."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który pomaga rolnikom dokumentować szkody spowodowane niekorzystnymi zjawiskami atmosferycznymi. Przygotuj dokumentację strat.\n\nDANE:\nGospodarstwo i ubezpieczenia: [GOSPODARSTWO]\nZjawisko i daty wystąpienia: [ZJAWISKO I DATA]\nUprawy i opis strat: [UPRAWY I STRATY]\nZebrane dowody: [DOWODY]\nZasady i tryb zgłoszenia na ten rok (wklejone): [ZASADY I TRYB ZGŁOSZENIA]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź, zanim napiszesz dokument.\n2. Nie wymyślaj kwot dopłat, stawek, punktów, terminów naboru, numerów przepisów ani zasad kampanii. Opieraj się wyłącznie na tekście zasad, który wkleiłem; czego w nim nie ma, oznacz [DO WERYFIKACJI].\n3. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE]. Jeśli coś liczysz, pokaż obliczenia krok po kroku.\n4. Progi strat, terminy i tryb zgłoszenia bierz tylko z wklejonych zasad. Procentów strat nie wymyślaj — opisuj objawy i dane, a szacunek oznacz jako rolnika lub [DO UZUPEŁNIENIA].\n5. Nie łącz zjawisk w jedno, jeśli zasady wymagają ich osobnego zgłoszenia.\n\nFORMAT WYNIKU:\nA) Treść wniosku o oszacowanie lub zgłoszenia.\nB) Tabela strat: | pole | uprawa | pow. ha | faza BBCH | objawy | szacunek rolnika |.\nC) Lista dowodów i jak je uporządkować.\nD) Notatka na wizytę komisji lub do zgłoszenia w aplikacji.\nE) Kroki dalej: ubezpieczyciel, ARiMR, bank — według wklejonych zasad.\n\nNa końcu dopisz notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przygotuj osobne zgłoszenie do ubezpieczyciela.", "Dopisz opis przebiegu zjawiska dzień po dniu.", "Zrób listę zdjęć do zrobienia na każdym polu.", "Sprawdź protokół komisji, który wkleję, i wypisz rozbieżności.", "Przygotuj odwołanie od protokołu.", "Policz udział powierzchni z uszkodzeniami w gospodarstwie.", "Przygotuj tabelę do porównania plonu przed i po zjawisku.", "Napisz notatkę z lustracji do załączenia.", "Wypisz, jakich danych meteorologicznych szukać i gdzie.", "Przygotuj wiadomość do rolnika z listą rzeczy do zrobienia."], "checklista": ["Daty zjawiska są zgodne z dowodami.", "Powierzchnie i uprawy zgadzają się z wnioskiem obszarowym.", "Szacunki strat są oznaczone jako szacunki, nie fakty.", "Tryb i termin zgłoszenia sprawdzone w aktualnych zasadach.", "Zgłoszenie do ubezpieczyciela poszło osobno, jeśli uprawa była ubezpieczona.", "Rolnik zachował zdjęcia i dowód wysłania."], "uwaga": "Zasady płatności, ekoschematów i naborów zmieniają się co kampanię. AI nie zna aktualnych stawek ani terminów — opiera się tylko na tym, co wkleisz z ARiMR. Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "przyklad": {"wejscie": "Lis z Kościana, 78 hektarów na piaskach. Susza od połowy kwietnia, praktycznie nic nie spadło, a w maju jeszcze trzy noce przymrozku. Najgorzej jęczmień jary za stodołą, 12 ha, w strzelaniu w źdźbło, żółty i niski. Rzepak 20 ha po przymrozku ma popękane łodygi. Pszenica 25 ha jako tako. Rzepak i pszenicę ma ubezpieczone. Zdjęcia robił. Zasady na ten rok wkleję.", "wynik": "A) Zgłoszenie\nWnoszę o oszacowanie szkód w gospodarstwie Krzysztofa Lisa, gm. Kościan, powstałych w wyniku suszy (od ok. połowy kwietnia) oraz przymrozków w maju [DO UZUPEŁNIENIA: daty]. Tryb zgłoszenia — komisja gminna lub aplikacja [DO WERYFIKACJI wg zasad na ten rok].\n\nB) Straty\n| pole | uprawa | pow. ha | BBCH | objawy | szacunek rolnika |\n| Za stodołą | jęczmień jary | 12 | 31 | żółknięcie, niski łan | [DO UZUPEŁNIENIA] |\n| [DO UZUPEŁNIENIA] | rzepak ozimy | 20 | [DO UZUPEŁNIENIA] | pęknięcia łodyg po przymrozku | [DO UZUPEŁNIENIA] |\n| [DO UZUPEŁNIENIA] | pszenica ozima | 25 | [DO UZUPEŁNIENIA] | objawy słabe | [DO UZUPEŁNIENIA] |\nUdział uszkodzonych upraw: (12 + 20 + 25) / 78 = 57 / 78 ≈ 73% powierzchni gospodarstwa [ZAŁOŻENIE: wszystkie trzy uprawy do zgłoszenia].\n\nC) Dowody\n- Zdjęcia z datą, osobno dla każdego pola.\n- Dane opadowe z najbliższej stacji [DO UZUPEŁNIENIA].\n\nD) Dalej\n- Rzepak i pszenica: osobne zgłoszenie do ubezpieczyciela w terminie z polisy [DO WERYFIKACJI].\n- Przymrozek i susza — sprawdzić, czy zgłaszać osobno [DO WERYFIKACJI].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "5.08", "nazwa": "Opis gospodarstwa do wniosków, banku i programów", "tag": "OPIS GOSPODARSTWA", "co_robi": "Tworzy uporządkowany opis gospodarstwa, który da się wykorzystać w wielu dokumentach: wnioskach, kredytach, programach, ofertach dla odbiorców. Robi wersję pełną i skrócone, z tabelą podstawowych danych.", "kiedy": "Gdy co chwilę ktoś prosi o „krótki opis gospodarstwa”, a Ty chcesz mieć jeden porządny tekst do przerabiania pod konkretny cel.", "brief": [{"pole": "Dane podstawowe", "opis": "Np. „Rafał Kaczmarek, gm. Gniewkowo, pow. inowrocławski, 145 ha własne i dzierżawione, nr producenta w ARiMR”."}, {"pole": "Produkcja", "opis": "Uprawy i zwierzęta, np. „buraki cukrowe 30 ha, pszenica 60, rzepak 35, kukurydza 20; bydło mleczne 80 krów”."}, {"pole": "Zasoby", "opis": "Budynki, sprzęt, magazyny, nawadnianie, pracownicy."}, {"pole": "Historia i kwalifikacje", "opis": "Od kiedy, wykształcenie, szkolenia, wcześniejsze inwestycje z dofinansowaniem."}, {"pole": "Rynki zbytu", "opis": "Odbiorcy, umowy, grupy producentów, np. „cukrownia — kontraktacja, mleczarnia spółdzielcza”."}, {"pole": "Cel opisu", "opis": "Do czego, np. „do wniosku inwestycyjnego”, „dla banku”, „do programu odbiorcy”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który pisze opisy gospodarstw do wniosków, banków i programów. Przygotuj opis gospodarstwa.\n\nDANE:\nDane podstawowe: [DANE PODSTAWOWE]\nProdukcja roślinna i zwierzęca: [PRODUKCJA]\nZasoby: budynki, sprzęt, ludzie: [ZASOBY]\nHistoria i kwalifikacje rolnika: [HISTORIA I KWALIFIKACJE]\nRynki zbytu i umowy: [RYNKI ZBYTU]\nCel opisu: [CEL OPISU]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź, zanim napiszesz dokument.\n2. Nie wymyślaj kwot dopłat, stawek, punktów, terminów naboru, numerów przepisów ani zasad kampanii. Opieraj się wyłącznie na tekście zasad, który wkleiłem; czego w nim nie ma, oznacz [DO WERYFIKACJI].\n3. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE]. Jeśli coś liczysz, pokaż obliczenia krok po kroku.\n4. Nie dodawaj osiągnięć, certyfikatów ani wyników, których nie podałem.\n5. Dopasuj ton i akcenty do celu opisu, ale fakty pozostaw te same w każdej wersji.\n\nFORMAT WYNIKU:\nA) Tabela danych: | parametr | wartość |.\nB) Opis pełny (ok. 1 strona).\nC) Wersja skrócona (5–7 zdań).\nD) Wersja na jedno zdanie do formularza.\nE) Lista danych do potwierdzenia dokumentami.\n\nNa końcu dopisz notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dopasuj opis do wniosku inwestycyjnego, akcentując potrzebę inwestycji.", "Zrób wersję dla odbiorcy, który pyta o jakość i powtarzalność dostaw.", "Dodaj akapit o działaniach na rzecz środowiska.", "Przetłumacz opis na angielski dla zagranicznego kontrahenta.", "Skróć opis do limitu znaków, który podam.", "Dodaj sekcję o planach rozwoju na kolejne lata.", "Przygotuj wersję do prezentacji podczas spotkania grupy producentów.", "Zaktualizuj opis po zmianie struktury upraw.", "Wypisz dokumenty potwierdzające każdy parametr.", "Zrób wersję punktową do slajdu."], "checklista": ["Powierzchnie, pogłowie i sprzęt zgadzają się z aktualnymi dokumentami.", "Nie ma informacji, których rolnik nie potwierdził.", "Wersja jest dopasowana do celu i odbiorcy.", "Dane osobowe i numery są podane tylko tam, gdzie są potrzebne.", "Rolnik zaakceptował treść."], "uwaga": "", "przyklad": {"wejscie": "Kaczmarek z Gniewkowa, 145 ha razem z dzierżawą. Buraki 30, pszenica 60, rzepak 35, kukurydza 20 na kiszonkę. 80 krów mlecznych, obora wolnostanowiskowa z 2018, robot nie ma. Mleko do spółdzielni, buraki kontraktowane w cukrowni. Rafał jest po technikum rolniczym, przejął gospodarstwo po ojcu w 2012. Miał już dofinansowanie na oborę. Potrzebuję opis do wniosku inwestycyjnego, ale chcę go potem używać też do banku.", "wynik": "A) Dane\n| parametr | wartość |\n| prowadzący | Rafał Kaczmarek |\n| lokalizacja | gm. Gniewkowo, pow. inowrocławski |\n| powierzchnia UR | 145 ha (w tym dzierżawa [DO UZUPEŁNIENIA] ha) |\n| struktura | pszenica 60, rzepak 35, buraki cukrowe 30, kukurydza na kiszonkę 20 ha |\n| stado | 80 krów mlecznych |\n| obora | wolnostanowiskowa, 2018 |\nSuma upraw: 60 + 35 + 30 + 20 = 145 ha — zgodne.\n\nB) Opis pełny\nGospodarstwo Rafała Kaczmarka prowadzi produkcję mleka i roślinną na 145 ha UR w gminie Gniewkowo. Prowadzący ukończył technikum rolnicze i od 2012 r. samodzielnie kieruje gospodarstwem przejętym po ojcu. W 2018 r. wybudowano oborę wolnostanowiskową, przy wsparciu ze środków publicznych [DO UZUPEŁNIENIA: program]. Mleko trafia do spółdzielni mleczarskiej, buraki cukrowe są kontraktowane. Kukurydza na kiszonkę stanowi bazę paszową stada.\n\nC) Wersja skrócona\nRodzinne gospodarstwo mleczno-roślinne, 145 ha, 80 krów, stały zbyt mleka i buraków w ramach umów.\n\nD) Do potwierdzenia\n- Umowy dzierżawy i ich okres [DO WERYFIKACJI].\n- Program, z którego dofinansowano oborę, i czy trwa okres zobowiązań [DO WERYFIKACJI].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "5.09", "nazwa": "Odpowiedź na wezwanie ARiMR i przygotowanie do kontroli", "tag": "WEZWANIE I KONTROLA", "co_robi": "Analizuje treść wezwania lub zawiadomienia o kontroli z ARiMR, pomaga przygotować rzeczowe wyjaśnienia i listę dokumentów do okazania. Dla kontroli na miejscu robi plan przygotowania gospodarstwa.", "kiedy": "Gdy rolnik przynosi pismo z ARiMR z wezwaniem do usunięcia braków albo zawiadomienie o kontroli i pyta, co teraz.", "brief": [{"pole": "Treść pisma", "opis": "Wklej całe wezwanie lub zawiadomienie, z datą doręczenia i terminem odpowiedzi."}, {"pole": "Gospodarstwo i wniosek", "opis": "Np. „Józef Pawlak, gm. Strzelce Krajeńskie, wniosek obszarowy, 52 ha, ekoschematy na 2 polach”."}, {"pole": "Stan faktyczny", "opis": "Co rzeczywiście było w polu i dlaczego mogła powstać rozbieżność, np. „na 34/1 groch zamiast pszenicy, bo przesiewali po wymarznięciu”."}, {"pole": "Dostępne dokumenty", "opis": "Np. „ewidencja zabiegów, faktury za nasiona, zdjęcia z kwietnia, umowa dzierżawy”."}, {"pole": "Zasady i procedury", "opis": "Wklej fragmenty instrukcji ARiMR lub przepisów, na które powołuje się pismo, jeśli je masz."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który pomaga rolnikom odpowiadać na wezwania ARiMR i przygotować się do kontroli na miejscu. Przeanalizuj pismo i przygotuj odpowiedź.\n\nDANE:\nTreść pisma z ARiMR: [TREŚĆ PISMA]\nGospodarstwo i złożony wniosek: [GOSPODARSTWO I WNIOSEK]\nStan faktyczny według rolnika: [STAN FAKTYCZNY]\nDokumenty, którymi rolnik dysponuje: [DOSTĘPNE DOKUMENTY]\nZasady i procedury (wklejone): [ZASADY I PROCEDURY]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź, zanim napiszesz dokument.\n2. Nie wymyślaj kwot dopłat, stawek, punktów, terminów naboru, numerów przepisów ani zasad kampanii. Opieraj się wyłącznie na tekście zasad, który wkleiłem; czego w nim nie ma, oznacz [DO WERYFIKACJI].\n3. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE]. Jeśli coś liczysz, pokaż obliczenia krok po kroku.\n4. Termin odpowiedzi i podstawy prawne bierz tylko z treści pisma i wklejonych zasad. Nie cytuj artykułów, których tam nie ma.\n5. Wyjaśnienia mają być prawdziwe i oparte na dowodach; nie pomagaj ukrywać rozbieżności. Jeśli sprawa jest poważna, zalec konsultację z prawnikiem lub doradcą ODR.\n\nFORMAT WYNIKU:\nA) Streszczenie pisma: czego ARiMR chce, do kiedy, jakie są skutki braku odpowiedzi.\nB) Projekt odpowiedzi lub wyjaśnień.\nC) Lista dokumentów do załączenia lub okazania.\nD) Plan przygotowania do kontroli: dokumenty, pola, zwierzęta, ewidencje.\nE) Ryzyka i pytania do wyjaśnienia z rolnikiem.\n\nNa końcu dopisz notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Skróć odpowiedź do najważniejszych faktów.", "Przygotuj listę rzeczy do sprawdzenia w polu przed przyjazdem kontrolerów.", "Napisz wniosek o przedłużenie terminu, jeśli jest uzasadniony.", "Przygotuj zestawienie zdjęć z opisami do załączenia.", "Sprawdź, czy ewidencja zabiegów jest kompletna dla wskazanych pól.", "Przygotuj notatkę dla rolnika: jak rozmawiać z kontrolerem.", "Wypisz, co powinno znaleźć się w protokole z kontroli.", "Przygotuj uwagi do protokołu, który wkleję.", "Zrób oś czasu zdarzeń na spornym polu.", "Przygotuj wersję pisma do wysłania przez ePUAP lub pocztą."], "checklista": ["Termin odpowiedzi został policzony od daty doręczenia i sprawdzony w piśmie.", "Wyjaśnienia są zgodne z faktami i dowodami.", "Każdy załącznik jest wymieniony w piśmie.", "Ewidencje (zabiegi, nawożenie, zwierzęta) są aktualne i kompletne.", "Rolnik zachował kopię odpowiedzi i dowód nadania.", "W poważnych sprawach była konsultacja z prawnikiem lub ODR."], "uwaga": "Odpowiedź na pismo urzędowe ma skutki prawne i finansowe. AI nie zna treści Twojej sprawy poza tym, co wkleisz. Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "przyklad": {"wejscie": "Pawlak spod Strzelec dostał wezwanie z ARiMR, że na działce 34/1 zadeklarował pszenicę ozimą, a z monitoringu satelitarnego wychodzi coś innego. Prawda jest taka, że pszenica wymarzła i w kwietniu przesiali groch, wniosek już był złożony. Mają faktury za nasiona grochu, zdjęcia z kwietnia z telefonu i ewidencję zabiegów. Doręczone było w poniedziałek. Pismo wklejam.", "wynik": "A) Streszczenie\nARiMR wskazuje rozbieżność między deklarowaną uprawą (pszenica ozima) a wynikiem monitoringu na działce 34/1 i wzywa do wyjaśnień w terminie [DO WERYFIKACJI: wg treści pisma, liczony od doręczenia — poniedziałek, data [DO UZUPEŁNIENIA]].\n\nB) Projekt wyjaśnień\nW odpowiedzi na wezwanie z dnia [DO UZUPEŁNIENIA], znak [DO UZUPEŁNIENIA], wyjaśniam, że na działce rolnej położonej na działce ewidencyjnej 34/1 wysiano jesienią pszenicę ozimą. Na skutek wymarznięcia plantacja została zlikwidowana, a w kwietniu [DO UZUPEŁNIENIA: data] wysiano groch. Zmiana nastąpiła po złożeniu wniosku. W załączeniu przedstawiam dokumenty potwierdzające przebieg zdarzeń. Proszę o uwzględnienie faktycznej uprawy zgodnie z obowiązującymi zasadami [DO WERYFIKACJI: czy i w jakim trybie była możliwa zmiana wniosku].\n\nC) Załączniki\n1. Faktura za nasiona grochu.\n2. Zdjęcia z kwietnia z datą.\n3. Ewidencja zabiegów dla 34/1.\n\nD) Ryzyka\n- Czy zmianę należało zgłosić wcześniej i w jakim terminie [DO WERYFIKACJI].\n- Wpływ na ekoschematy zadeklarowane na tej działce [DO WERYFIKACJI].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "5.10", "nazwa": "Kalendarz obowiązków i terminów gospodarstwa", "tag": "KALENDARZ TERMINÓW", "co_robi": "Buduje roczny kalendarz obowiązków gospodarstwa: ARiMR, KRUS, ewidencje, zgłoszenia zwierząt, przeglądy sprzętu, ubezpieczenia, plan nawożenia. Daty wstawia tylko z wklejonych źródeł, resztę oznacza do sprawdzenia.", "kiedy": "Na początku roku albo po objęciu nowego klienta doradczego, żeby nic nie umknęło: od wniosku obszarowego po przegląd opryskiwacza.", "brief": [{"pole": "Gospodarstwo", "opis": "Np. „Andrzej Sowa, gm. Opatów, 70 ha, zboża i rzepak, 40 tuczników w cyklu, opryskiwacz polowy”."}, {"pole": "Zobowiązania", "opis": "Np. „ekoschematy, zobowiązanie rolnośrodowiskowe do roku wg umowy, inwestycja z okresem trwałości, kredyt”."}, {"pole": "Obowiązkowe ewidencje", "opis": "Np. „ewidencja zabiegów ochrony roślin, plan nawożenia azotem, IRZplus, nawozy naturalne”."}, {"pole": "Wklejone terminy", "opis": "Wklej terminy z komunikatów ARiMR, KRUS, umów, polis — AI użyje tylko ich."}, {"pole": "Forma kalendarza", "opis": "Np. „tabela miesiąc po miesiącu” albo „lista do Kalendarza Google z przypomnieniami tydzień wcześniej”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który prowadzi gospodarstwom kalendarz obowiązków administracyjnych i polowych. Przygotuj roczny kalendarz dla gospodarstwa.\n\nDANE:\nGospodarstwo: [GOSPODARSTWO]\nZobowiązania i programy: [ZOBOWIĄZANIA]\nObowiązkowe ewidencje i rejestry: [OBOWIĄZKOWE EWIDENCJE]\nTerminy z komunikatów, umów i polis (wklejone): [WKLEJONE TERMINY]\nPreferowana forma kalendarza: [FORMA KALENDARZA]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź, zanim napiszesz dokument.\n2. Nie wymyślaj kwot dopłat, stawek, punktów, terminów naboru, numerów przepisów ani zasad kampanii. Opieraj się wyłącznie na tekście zasad, który wkleiłem; czego w nim nie ma, oznacz [DO WERYFIKACJI].\n3. Luki oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE]. Jeśli coś liczysz, pokaż obliczenia krok po kroku.\n4. Każda data musi pochodzić z wklejonego źródła; jeśli wiesz tylko, że obowiązek istnieje, wpisz go bez daty i oznacz [DO WERYFIKACJI].\n5. Przy każdym obowiązku podaj, gdzie sprawdzić termin: ARiMR, KRUS, umowa, polisa, PIORiN, ODR.\n\nFORMAT WYNIKU:\nA) Tabela: | miesiąc | obowiązek | instytucja | termin | źródło terminu | status |.\nB) Lista obowiązków stałych (ciągłe ewidencje).\nC) Przypomnienia z wyprzedzeniem dla terminów krytycznych.\nD) Lista terminów do sprawdzenia przed startem roku.\nE) Krótka instrukcja, jak aktualizować kalendarz.\n\nNa końcu dopisz notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Zrób wersję do importu do Kalendarza Google w formacie CSV.", "Dodaj przypomnienia na dwa tygodnie przed każdym terminem.", "Wypisz tylko obowiązki na najbliższe trzy miesiące.", "Dodaj kolumnę z osobą odpowiedzialną: rolnik albo doradca.", "Zaktualizuj kalendarz o terminy z komunikatu, który wkleję.", "Zrób wersję na jedną stronę do powieszenia w biurze.", "Dodaj terminy przeglądów sprzętu i badań opryskiwacza z dokumentów, które podam.", "Przygotuj listę obowiązków związanych ze zwierzętami.", "Zestaw kalendarze kilku gospodarstw, które prowadzę, w jednej tabeli.", "Napisz SMS-y z przypomnieniami dla rolnika."], "checklista": ["Każdy termin ma źródło i został sprawdzony w aktualnym komunikacie lub dokumencie.", "Obowiązki bez daty są oznaczone do weryfikacji.", "Uwzględniono ewidencje ciągłe: zabiegi ochrony roślin, nawożenie, zwierzęta.", "Okresy trwałości inwestycji i zobowiązań są w kalendarzu.", "Przypomnienia są ustawione z wyprzedzeniem.", "Kalendarz ma osobę odpowiedzialną za aktualizację."], "uwaga": "Zasady płatności, ekoschematów i naborów zmieniają się co kampanię. AI nie zna aktualnych stawek ani terminów — opiera się tylko na tym, co wkleisz z ARiMR. Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "przyklad": {"wejscie": "Nowy klient, Sowa z Opatowa. 70 ha, pszenica, jęczmień, rzepak, trzyma 40 tuczników. Ma ekoschematy, rolnośrodowiskowy do któregoś roku, sprawdzę, i opryskiwacz, który chyba niedługo ma badanie. KRUS płaci kwartalnie. Ubezpieczenie upraw w PZU czy innym, polisę zdobędę. Chcę kalendarz miesiąc po miesiącu, terminów ARiMR jeszcze nie mam na ten rok, wkleję jak wyjdą.", "wynik": "A) Kalendarz\n| miesiąc | obowiązek | instytucja | termin | źródło | status |\n| styczeń | składka KRUS za kwartał | KRUS | [DO WERYFIKACJI] | komunikat KRUS | |\n| marzec–maj | wniosek o płatności i ekoschematy | ARiMR | [DO WERYFIKACJI] | komunikat ARiMR na ten rok | |\n| [DO UZUPEŁNIENIA] | badanie opryskiwacza | stacja kontroli | [DO UZUPEŁNIENIA] | ostatnie zaświadczenie | |\n| wg zobowiązania | działania rolnośrodowiskowe | ARiMR | [DO WERYFIKACJI] | plan działalności | |\n| [DO UZUPEŁNIENIA] | odnowienie polisy upraw | ubezpieczyciel | [DO UZUPEŁNIENIA] | polisa | |\n\nB) Obowiązki ciągłe\n- Ewidencja zabiegów ochrony roślin — na bieżąco po każdym zabiegu.\n- Plan nawożenia azotem i ewidencja nawożenia — wg Programu azotanowego [DO WERYFIKACJI: czy gospodarstwo jest zobowiązane do planu].\n- Zgłoszenia zdarzeń dla tuczników w IRZplus — terminy [DO WERYFIKACJI].\n\nC) Przypomnienia\n- Wniosek ARiMR: 3 tygodnie przed końcem naboru.\n- Badanie opryskiwacza: 1 miesiąc przed upływem ważności.\n\nD) Do sprawdzenia\n- Rok końca zobowiązania rolnośrodowiskowego [DO UZUPEŁNIENIA].\n- Komunikat ARiMR na bieżącą kampanię — wkleić po publikacji.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}]}, {"dzial_nr": 6, "dzial": "Ochrona roślin i ewidencja zabiegów", "opis": "Zabieg trwa godzinę, ale papiery wokół niego — ewidencja, uzasadnienie, zlecenie, kontrola etykiety — zabierają wieczory. Ten dział zamienia notatki z pola i wklejone etykiety w gotowe tabele, programy i zlecenia, nie wymyślając żadnej dawki ani karencji: wszystko pochodzi z etykiety i Twoich danych.", "skills": [{"id": "6.01", "nazwa": "Ewidencja zabiegów ochrony roślin", "tag": "EWIDENCJA ZABIEGÓW", "co_robi": "Zamienia notatkę z opryskiwacza, SMS albo głosówkę w kompletny wpis do ewidencji zabiegów ochrony roślin. Układa dane w tabelę z wszystkimi rubrykami, które trzeba wypełnić, i wskazuje, czego brakuje do pełnego wpisu.", "kiedy": "Wieczorem po opryskach albo przed kontrolą PIORiN lub ARiMR, gdy zabiegi są „w głowie i na kartce”, a ewidencja musi być kompletna i czytelna.", "brief": [{"pole": "Gospodarstwo i pole", "opis": "Gospodarstwo, nazwa lub numer działki, powierzchnia, uprawa i odmiana, np. „Gospodarstwo Kowalczyk, Działka 112/3 «Za stodołą», 14,2 ha, pszenica ozima”."}, {"pole": "Data i termin zabiegu", "opis": "Data, godziny i faza rozwojowa, np. „23.04, 6:30–9:10, BBCH 31”."}, {"pole": "Środek i dawka z etykiety", "opis": "Nazwa środka i dawka przepisana z etykiety, np. „[środek A z etykiety], dawka wg etykiety, ciecz 200 l/ha”."}, {"pole": "Agrofag i przyczyna", "opis": "Przeciw czemu i dlaczego, np. „łamliwość źdźbła, objawy na 2. międzywęźlu, lustracja 20.04”."}, {"pole": "Warunki i sprzęt", "opis": "Pogoda i opryskiwacz, np. „+11°C, wiatr ok. 2 m/s, sucho; opryskiwacz zawieszany 1000 l, dysze eżektorowe”."}, {"pole": "Wykonawca", "opis": "Kto wykonał zabieg, np. „Marek Kowalczyk, zaświadczenie o szkoleniu ważne do [data]”."}], "prompt": "Jesteś doświadczonym polskim agronomem i doradcą rolniczym, który pomaga gospodarstwom prowadzić ewidencję zabiegów ochrony roślin tak, żeby wytrzymała kontrolę PIORiN i ARiMR. Zamień moje notatki na kompletny wpis do ewidencji.\n\nDANE:\nGospodarstwo, pole, uprawa: [GOSPODARSTWO I POLE]\nData, godziny, BBCH: [DATA I TERMIN ZABIEGU]\nŚrodek i dawka przepisana z etykiety: [ŚRODEK I DAWKA Z ETYKIETY]\nAgrofag i przyczyna zabiegu: [AGROFAG I PRZYCZYNA]\nWarunki pogodowe i sprzęt: [WARUNKI I SPRZĘT]\nWykonawca zabiegu: [WYKONAWCA]\n\nZASADY:\n1. Jeśli brakuje istotnych danych, zadaj mi maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj dawek, okresów karencji i prewencji, stref buforowych, progów szkodliwości, nazw handlowych ani dopuszczalnej liczby zabiegów. Korzystaj wyłącznie z etykiety, rejestru i danych, które podam. Luki oznacz [DO UZUPEŁNIENIA], założenia [ZAŁOŻENIE], rzeczy niepewne [DO WERYFIKACJI].\n3. Obliczenia (ilość środka i cieczy, terminy, daty) pokazuj krok po kroku.\n4. Ewidencja musi zawierać co najmniej: nazwę środka, datę zabiegu, uprawę i jej powierzchnię, dawkę oraz przyczynę zastosowania. Dodaj rubryki pomocnicze: BBCH, agrofag, ilość zużytego środka, wykonawca, uzasadnienie wg integrowanej ochrony.\n5. Ilość zużytego środka policz jako dawka razy powierzchnia, tylko jeśli podam dawkę z etykiety.\n6. Termin zakończenia okresu karencji wylicz jako data zabiegu plus okres z etykiety; bez etykiety zostaw lukę.\n\nFORMAT WYNIKU:\nA) Tabela ewidencji: | data | pole/uprawa | pow. ha | środek | dawka/ha | zużyto | agrofag | BBCH | wykonawca | przyczyna |.\nB) Obliczenia zużycia i daty końca karencji krok po kroku.\nC) Lista rubryk do uzupełnienia lub weryfikacji.\nD) Jedno zdanie: co warto dołączyć do ewidencji (zdjęcie etykiety, notatka z lustracji).\n\nNa końcu dodaj notę: „Stosuj wyłącznie zgodnie z etykietą. Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Zrób z moich notatek z całego tygodnia osobne wiersze ewidencji.", "Dodaj kolumnę z datą końca okresu karencji dla każdego zabiegu.", "Przygotuj wersję ewidencji do wydruku na jedną stronę A4 poziomo.", "Sprawdź, które wiersze są niekompletne i czego brakuje.", "Policz łączne zużycie każdego środka w sezonie na podstawie tabeli.", "Dopisz uzasadnienie zabiegu zgodne z zasadami integrowanej ochrony.", "Przeformatuj tabelę do wklejenia w Excel z separatorem średnik.", "Zrób zestawienie zabiegów na jednym polu w kolejności dat.", "Wypisz środki, dla których nie podałem dawki z etykiety.", "Przygotuj krótką notatkę dla właściciela gospodarstwa z podsumowaniem zabiegów."], "checklista": ["Nazwa środka zgadza się z etykietą, a środek jest zarejestrowany w danej uprawie.", "Dawka i ilość zużyta są przepisane z etykiety i karty opryskiwacza, nie z pamięci.", "Powierzchnia pola zgadza się z wnioskiem lub mapą gospodarstwa.", "Przyczyna zabiegu (agrofag) jest podana w każdym wierszu.", "Data końca karencji jest policzona na podstawie etykiety.", "Wykonawca ma ważne zaświadczenie o szkoleniu w zakresie stosowania środków ochrony roślin.", "Ewidencja jest przechowywana przez wymagany okres [DO WERYFIKACJI w aktualnych przepisach]."], "uwaga": "Stosuj wyłącznie zgodnie z etykietą-instrukcją stosowania środka ochrony roślin i aktualnym statusem jego rejestracji (wyszukiwarka środków ochrony roślin MRiRW). Dawki, okresy karencji i prewencji, strefy buforowe i progi szkodliwości bierz z etykiety i źródeł urzędowych, nigdy z AI. Ewidencję prowadzi i za nią odpowiada posiadacz gruntu lub wykonawca zabiegu. Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.", "przyklad": {"wejscie": "Wczoraj 23 kwietnia od wpół do siódmej do dziesięć po dziewiątej pryskałem pszenicę na Działce 112/3 za stodołą, czternaście dwadzieścia hektara, odmiana Arkadia, faza mniej więcej BBCH 31. Na łamliwość źdźbła, w poniedziałek na lustracji było sporo plam na dolnych międzywęźlach. Dałem [środek A z etykiety], dawka taka jak na etykiecie, nie mam jej przy sobie. Wody 200 litrów na hektar. Pogoda dobra, rano jedenaście stopni, prawie bezwietrznie, sucho. Opryskiwacz zawieszany tysiąc litrów, dysze eżektorowe. Pryskał Marek, szkolenie ma, ale nie pamiętam do kiedy ważne. Zrób mi z tego wpis do ewidencji.", "wynik": "A) Tabela ewidencji\n| data | pole/uprawa | pow. ha | środek | dawka/ha | zużyto | agrofag | BBCH | wykonawca | przyczyna |\n| 23.04, 6:30–9:10 | Działka 112/3 «Za stodołą» / pszenica ozima Arkadia | 14,20 | [środek A z etykiety] | [DO UZUPEŁNIENIA — z etykiety] | [DO UZUPEŁNIENIA] | łamliwość źdźbła zbóż | 31 | Marek Kowalczyk | objawy na dolnych międzywęźlach, lustracja 20.04 |\n\nB) Obliczenia\nZużycie = dawka z etykiety × 14,20 ha → do policzenia po wpisaniu dawki.\nCiecz: 200 l/ha × 14,20 ha = 2840 l, czyli ok. 3 pełne zbiorniki 1000 l [ZAŁOŻENIE: bez resztek technicznych].\nKoniec karencji: 23.04 + okres karencji z etykiety = [DO UZUPEŁNIENIA].\n\nC) Do uzupełnienia / weryfikacji\n- dawka środka na ha z etykiety,\n- okres karencji z etykiety,\n- ważność zaświadczenia o szkoleniu wykonawcy [DO WERYFIKACJI],\n- czy środek jest zarejestrowany w pszenicy ozimej na łamliwość źdźbła w fazie BBCH 31 [DO WERYFIKACJI w wyszukiwarce MRiRW].\n\nD) Dołącz zdjęcie etykiety i notatkę z lustracji z 20.04 — to najlepsze uzasadnienie zabiegu przy kontroli.\n\nStosuj wyłącznie zgodnie z etykietą. Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "6.02", "nazwa": "Decyzja o zabiegu wg progu szkodliwości", "tag": "PRÓG SZKODLIWOŚCI", "co_robi": "Porównuje wyniki Twojej lustracji z progiem szkodliwości, który podajesz z metodyki IOR-PIB lub zaleceń doradcy, i układa uzasadnioną decyzję: zabieg, obserwacja albo brak zabiegu. Daje gotową notatkę do dokumentacji integrowanej ochrony.", "kiedy": "Po lustracji, gdy szkodnik lub choroba „coś jest, ale czy już pryskać?”, a decyzję trzeba podjąć i uzasadnić na piśmie.", "brief": [{"pole": "Uprawa i faza",
