rta B: 5 l za 520 zł”."}, {"pole": "Dawki z etykiet", "opis": "Dawka na ha z etykiety każdego środka dla tej uprawy, np. „A 1,0 l/ha, B 1,5 l/ha”."}, {"pole": "Zakres rejestracji", "opis": "Co mówi etykieta: uprawa, agrofagi, liczba zabiegów, np. „obie zarejestrowane w pszenicy na septoriozę, max 1 zabieg”."}, {"pole": "Warunki zakupu", "opis": "Rabaty, termin płatności, dostawa, np. „B płatne do 30 dni, A gotówka −3%”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym (ekonomika gospodarstw, rachunek kosztów w produkcji roślinnej), który na co dzień liczy z rolnikami opłacalność upraw. Porównaj oferty środków ochrony roślin lub nawozów w przeliczeniu na hektar.\n\nDANE:\nCel zabiegu i uprawa: [CEL ZABIEGU I UPRAWA]\nOferty: [OFERTY]\nDawki z etykiet: [DAWKI Z ETYKIET]\nZakres rejestracji: [ZAKRES REJESTRACJI]\nWarunki zakupu: [WARUNKI ZAKUPU]\n\nZASADY:\n1. Najpierw sprawdź dane. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 6 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj cen, plonów, stawek, dopłat ani kosztów i nie podawaj „średnich rynkowych”. Liczysz wyłącznie na moich liczbach. Brak danej oznacz [DO UZUPEŁNIENIA], wartość przyjętą przez ciebie [ZAŁOŻENIE], rzecz niepewną [DO WERYFIKACJI].\n3. Pokazuj obliczenia krok po kroku, z jednostkami (zł/ha, zł/t, t/ha), zaokrąglaj dopiero wynik końcowy.\n4. Dawki bierz wyłącznie z etykiet, które podałem. Nie podawaj dawek z pamięci. Gdy brakuje dawki, zostaw [DO UZUPEŁNIENIA].\n5. Koszt na ha = cena za litr lub kg × dawka. Policz też ilość produktu i liczbę opakowań na cały areał.\n6. Porównuj tylko środki zarejestrowane w tej uprawie na ten agrofag; różnice w substancjach czynnych, skuteczności i warunkach płatności opisz, ale ich nie wyceniaj sam.\n7. Przypomnij o sprawdzeniu etykiety w wyszukiwarce środków ochrony roślin MRiRW i o ewidencji zabiegu.\n\nFORMAT WYNIKU:\nA) Tabela | oferta | cena za l/kg | dawka | zł/ha | zł na areał | opakowania |.\nB) Obliczenia dla każdej oferty.\nC) Różnice poza ceną (rejestracja, warunki zakupu, odporność) do omówienia.\nD) Lista luk i rzeczy do sprawdzenia.\n\nNa końcu dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dodaj czwartą ofertę, którą wkleję.", "Uwzględnij rabat gotówkowy i pokaż koszt na ha po rabacie.", "Porównaj w ten sam sposób oferty nawozów azotowych na kg czystego składnika.", "Policz, ile zostanie środka po zabiegu przy zakupie pełnych opakowań.", "Przygotuj zestawienie do wysłania przedstawicielowi z prośbą o lepszą cenę.", "Dodaj koszt adiuwanta, jeśli etykieta go wymaga, według ceny, którą podam.", "Przelicz porównanie dla dawki dzielonej z etykiety.", "Pokaż, jak zmienia się wynik, gdy płacę w terminie 30 dni zamiast gotówką.", "Napisz rolnikowi krótką rekomendację w trzech zdaniach.", "Zrób tabelę w formacie do arkusza kalkulacyjnego."], "checklista": ["Każda dawka pochodzi z aktualnej etykiety, sprawdzonej w wyszukiwarce MRiRW.", "Wszystkie porównywane środki są zarejestrowane w tej uprawie na ten agrofag.", "Ceny są w tej samej formie (netto/brutto, z dostawą lub bez).", "Liczba opakowań pokrywa cały areał.", "Uwzględniono strategię antyodpornościową, a nie tylko cenę.", "Zabieg zostanie wpisany do ewidencji zabiegów ochrony roślin."], "uwaga": "Dawki i zakres stosowania zawsze z aktualnej etykiety środka (wyszukiwarka środków ochrony roślin MRiRW). AI nie zna obowiązującej etykiety – porównanie cenowe nie zastępuje decyzji o doborze środka.", "przyklad": {"wejscie": "Pszenica ozima, zabieg T2 na septoriozę, liść flagowy, 60 hektarów. Mam trzy oferty fungicydów, wszystkie wg etykiet zarejestrowane w pszenicy na septoriozę. Oferta A: kanister 5 litrów za 780 zł netto, dawka z etykiety 1,0 l/ha. Oferta B: 5 litrów za 520 zł, dawka 1,5 l/ha. Oferta C: butelka 1 litr za 210 zł, dawka 0,6 l/ha. Przedstawiciel od B mówi, że jego najtańszy, bo za litr najmniej. Wszystko netto, płatność gotówką. T1 robiłem triazolem z dodatkiem SDHI, więc nie chcę drugi raz tej samej grupy. Zabieg w BBCH 37–39, opryskiwacz 18 metrów, woda 200 litrów na hektar. Zostanie mi środka czy nie, to też ważne, bo nie lubię resztek w magazynie środków.", "wynik": "PORÓWNANIE OFERT – pszenica ozima, T2, 60 ha (ceny netto)\n\n| oferta | cena za l | dawka | zł/ha | zł / 60 ha | ilość | opakowania |\n| A | 156 zł | 1,0 l/ha | 156 | 9 360 | 60 l | 12 × 5 l |\n| B | 104 zł | 1,5 l/ha | 156 | 9 360 | 90 l | 18 × 5 l |\n| C | 210 zł | 0,6 l/ha | 126 | 7 560 | 36 l | 36 × 1 l |\n\nObliczenia:\nA: 780 ÷ 5 = 156 zł/l × 1,0 = 156 zł/ha; × 60 = 9 360 zł\nB: 520 ÷ 5 = 104 zł/l × 1,5 = 156 zł/ha; × 60 = 9 360 zł\nC: 210 zł/l × 0,6 = 126 zł/ha; × 60 = 7 560 zł\n\nWniosek: najniższa cena za litr (B) nie daje najniższego kosztu na hektar – A i B kosztują tyle samo, 156 zł/ha. Najtańsza na hektar jest C: 30 zł/ha mniej, czyli 1 800 zł na 60 ha.\n\nDo omówienia poza ceną:\n- substancje czynne i grupa FRAC – rotacja względem T1 [DO WERYFIKACJI],\n- warunki płatności i dostawy [DO UZUPEŁNIENIA],\n- czy etykieta wymaga adiuwanta (dodatkowy koszt) [DO WERYFIKACJI].\n\nPrzed zakupem sprawdź etykiety w wyszukiwarce środków ochrony roślin MRiRW; zabieg wpisz do ewidencji.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "3.06", "nazwa": "Opłacalność dzierżawy ziemi", "tag": "DZIERŻAWA", "co_robi": "Liczy, ile hektar dzierżawiony zostawia po zapłaceniu czynszu, i jaki czynsz jest jeszcze do przyjęcia przy danej produkcji. Rozdziela wariant bez dopłat i z dopłatami.", "kiedy": "Gdy sąsiad proponuje dzierżawę albo zbliża się przetarg na grunty i trzeba wiedzieć, ile maksymalnie można zaoferować.", "brief": [{"pole": "Działka i umowa", "opis": "Lokalizacja, ha, okres, kto pobiera dopłaty, np. „12 ha klasy IIIb, 5 lat, 9 km od gospodarstwa”."}, {"pole": "Czynsz", "opis": "Proponowany czynsz i forma, np. „1500 zł/ha rocznie” albo „równowartość 8 dt pszenicy”."}, {"pole": "Planowana produkcja", "opis": "Co posiejesz, plon i cena, np. „pszenica 7 t/ha, 850 zł/t”."}, {"pole": "Koszty uprawy", "opis": "Koszty bezpośrednie i zmienne mechanizacji na ha, np. „bezpośrednie 3100, mechanizacja 700 zł/ha”."}, {"pole": "Dopłaty i inne", "opis": "Kwoty, które sam wpisujesz, plus dodatkowe koszty, np. „dopłaty 800 zł/ha wg mnie, wapnowanie na start”."}, {"pole": "Cel decyzji", "opis": "Np. „czy brać i jaki maksymalny czynsz mogę zaproponować”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym (ekonomika gospodarstw, rachunek kosztów w produkcji roślinnej), który na co dzień liczy z rolnikami opłacalność upraw. Oceń opłacalność dzierżawy działki.\n\nDANE:\nDziałka i umowa: [DZIAŁKA I UMOWA]\nCzynsz: [CZYNSZ]\nPlanowana produkcja: [PLANOWANA PRODUKCJA]\nKoszty uprawy: [KOSZTY UPRAWY]\nDopłaty i inne: [DOPŁATY I INNE]\nCel decyzji: [CEL DECYZJI]\n\nZASADY:\n1. Najpierw sprawdź dane. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 6 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj cen, plonów, stawek, dopłat ani kosztów i nie podawaj „średnich rynkowych”. Liczysz wyłącznie na moich liczbach. Brak danej oznacz [DO UZUPEŁNIENIA], wartość przyjętą przez ciebie [ZAŁOŻENIE], rzecz niepewną [DO WERYFIKACJI].\n3. Pokazuj obliczenia krok po kroku, z jednostkami (zł/ha, zł/t, t/ha), zaokrąglaj dopiero wynik końcowy.\n4. Policz wynik na ha przed czynszem, po czynszu i maksymalny czynsz przy wyniku zerowym – osobno bez dopłat i z dopłatami.\n5. Jeśli czynsz jest w zbożu, przelicz go po cenie, którą podałem, i pokaż wrażliwość na cenę.\n6. Kto pobiera dopłaty i czy przysługują, zależy od umowy i zasad ARiMR – nie rozstrzygaj tego, oznacz [DO WERYFIKACJI].\n7. Uwzględnij koszty dojazdu i jednorazowe (np. wapnowanie) tylko z moimi kwotami.\n\nFORMAT WYNIKU:\nA) Tabela wyniku na ha i na całą działkę.\nB) Maksymalny czynsz bez dopłat i z dopłatami.\nC) Ryzyka umowy do sprawdzenia (okres, dopłaty, waloryzacja).\nD) Rekomendacja w 3 zdaniach i lista luk.\n\nNa końcu dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przelicz czynsz w decytonach pszenicy przy trzech cenach, które podam.", "Dodaj koszt dojazdu według moich kilometrów i stawki za km.", "Policz opłacalność dla płodozmianu rzepak–pszenica–pszenica.", "Pokaż, jak wynik zmienia się przy plonie niższym o 1 t/ha.", "Rozłóż koszt wapnowania na cały okres umowy.", "Przygotuj listę pytań do wydzierżawiającego przed podpisaniem umowy.", "Porównaj dwie oferty dzierżawy, które wkleję.", "Policz, ile wynosi czynsz jako procent wartości produkcji.", "Napisz rolnikowi krótkie podsumowanie, czy brać tę ziemię.", "Zrób tabelę do arkusza kalkulacyjnego z miejscem na moje zmiany."], "checklista": ["Plon i cena są realne dla tej klasy gleby i tej lokalizacji.", "Wiadomo, kto pobiera dopłaty i na jakiej podstawie.", "Uwzględniono dojazd i koszty jednorazowe.", "Okres umowy i waloryzacja czynszu są znane.", "Umowa dzierżawy została sprawdzona przez prawnika lub doradcę ODR.", "Wariant bez dopłat został omówiony."], "uwaga": "Kwestie umowy dzierżawy (dopłaty, okres, zgłoszenia) wymagają weryfikacji z aktualnymi przepisami i zasadami ARiMR – kalkulacja nie zastępuje porady prawnej.", "przyklad": {"wejscie": "Sąsiad daje 12 hektarów w dzierżawę na 5 lat, klasa IIIb, 9 km od domu. Chce 1500 zł za hektar rocznie. Posiałbym pszenicę, liczę 7 ton z hektara, cena 850 zł. Koszty bezpośrednie 3100 zł/ha, mechanizacja zmienna, paliwo i naprawy, 700 zł/ha. Dopłaty liczę dla siebie 800 zł/ha, ale nie wiem, czy sąsiad nie będzie chciał sam brać. Dojazd jeszcze nie policzony. Ile maksymalnie mogę dać? Ziemia była obsiewana przez syna sąsiada, plony słabsze, chyba nie wapnowane od lat, nie mam analiz. Umowa ma być na piśmie, ale jeszcze jej nie widziałem. Do tego pole ma kształt klina, trochę uwrocia. Wolę policzyć na spokojnie, zanim mu dam odpowiedź.", "wynik": "OPŁACALNOŚĆ DZIERŻAWY – 12 ha, kl. IIIb, 5 lat\n\n| pozycja | zł/ha | zł / 12 ha |\n| wartość produkcji (7 t × 850 zł) | 5 950 | 71 400 |\n| koszty bezpośrednie | 3 100 | 37 200 |\n| mechanizacja zmienna | 700 | 8 400 |\n| wynik przed czynszem | 2 150 | 25 800 |\n| czynsz | 1 500 | 18 000 |\n| wynik po czynszu, bez dopłat | 650 | 7 800 |\n| dopłaty [DO WERYFIKACJI] | 800 | 9 600 |\n| wynik po czynszu, z dopłatami | 1 450 | 17 400 |\n\nObliczenia:\n1. 7 × 850 = 5 950 zł/ha\n2. 5 950 − 3 100 − 700 = 2 150 zł/ha\n3. 2 150 − 1 500 = 650 zł/ha; z dopłatami 650 + 800 = 1 450 zł/ha\n\nMaksymalny czynsz (wynik = 0):\n- bez dopłat: 2 150 zł/ha\n- z dopłatami: 2 950 zł/ha\nTo granice, nie rekomendacja – nie zostawiają nic na ryzyko plonu i Twoją pracę.\n\nDo sprawdzenia:\n- kto pobiera dopłaty – zapis w umowie i zasady ARiMR [DO WERYFIKACJI],\n- koszt dojazdu 9 km przy każdym przejeździe [DO UZUPEŁNIENIA],\n- waloryzacja czynszu przez 5 lat [DO UZUPEŁNIENIA],\n- pH i zasobność gleby – ewentualne wapnowanie [DO UZUPEŁNIENIA].\n\nRekomendacja: przy 1 500 zł/ha dzierżawa broni się nawet bez dopłat, ale margines 650 zł/ha zje słabszy rok lub dojazd. Negocjuj zapis o dopłatach przed podpisaniem.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "3.07", "nazwa": "Usługa czy własna maszyna – koszty mechanizacji", "tag": "MASZYNA CZY USŁUGA", "co_robi": "Porównuje koszt zabiegu własną maszyną (amortyzacja, kapitał, utrzymanie, praca) z ceną usługi. Wylicza areał, od którego zakup zaczyna się opłacać.", "kiedy": "Gdy rolnik chce kupić siewnik, opryskiwacz czy prasę, a sąsiad lub firma usługowa robią to samo na zlecenie.", "brief": [{"pole": "Maszyna i zabieg", "opis": "Co liczysz, np. „siewnik pneumatyczny 4 m do zbóż i rzepaku”."}, {"pole": "Cena i okres użytkowania", "opis": "Cena zakupu, wartość końcowa, lata, np. „180 000 zł, po 10 latach 40 000 zł”."}, {"pole": "Koszty utrzymania", "opis": "Ubezpieczenie, garażowanie, naprawy, koszt kapitału – Twoje wartości, np. „2000 zł/rok, naprawy 1,5% ceny rocznie, kapitał 6%”."}, {"pole": "Areał roczny", "opis": "Ile ha rocznie maszyna zrobi, np. „120 ha u siebie”."}, {"pole": "Koszty pracy na ha", "opis": "Paliwo, ciągnik, praca własna na ha, np. „60 zł/ha wg moich wyliczeń”."}, {"pole": "Stawka usługi", "opis": "Cena usługi z oferty, np. „250 zł/ha netto u usługodawcy z Lubnia”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym (ekonomika gospodarstw, rachunek kosztów w produkcji roślinnej), który na co dzień liczy z rolnikami opłacalność upraw. Porównaj koszt własnej maszyny z usługą.\n\nDANE:\nMaszyna i zabieg: [MASZYNA I ZABIEG]\nCena i okres użytkowania: [CENA I OKRES UŻYTKOWANIA]\nKoszty utrzymania: [KOSZTY UTRZYMANIA]\nAreał roczny: [AREAŁ ROCZNY]\nKoszty pracy na ha: [KOSZTY PRACY NA HA]\nStawka usługi: [STAWKA USŁUGI]\n\nZASADY:\n1. Najpierw sprawdź dane. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 6 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj cen, plonów, stawek, dopłat ani kosztów i nie podawaj „średnich rynkowych”. Liczysz wyłącznie na moich liczbach. Brak danej oznacz [DO UZUPEŁNIENIA], wartość przyjętą przez ciebie [ZAŁOŻENIE], rzecz niepewną [DO WERYFIKACJI].\n3. Pokazuj obliczenia krok po kroku, z jednostkami (zł/ha, zł/t, t/ha), zaokrąglaj dopiero wynik końcowy.\n4. Koszty stałe roczne: amortyzacja (cena − wartość końcowa) ÷ lata, koszt kapitału od średniej wartości, ubezpieczenie i garażowanie. Koszty zmienne: naprawy i praca na ha.\n5. Stopę kapitału, % napraw i wartość końcową bierz ode mnie; jeśli ich brak, oznacz [DO UZUPEŁNIENIA], nie przyjmuj sam.\n6. Policz próg areału: koszty stałe ÷ (stawka usługi − koszt zmienny na ha).\n7. Opisz też czynniki niepieniężne: terminowość zabiegu, dostępność usługi, ryzyko awarii.\n\nFORMAT WYNIKU:\nA) Tabela kosztów stałych i zmiennych z obliczeniami.\nB) Koszt własny na ha a stawka usługi.\nC) Próg areału opłacalności zakupu.\nD) Czynniki poza ceną i lista luk.\n\nNa końcu dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Policz wariant, w którym robię usługi dla sąsiadów na dodatkowe hektary, które podam.", "Pokaż wynik przy zakupie maszyny używanej za cenę, którą podam.", "Dodaj dotację na zakup jako kwotę, którą wpiszę, i przelicz próg.", "Porównaj zakup, leasing i usługę według warunków leasingu, które wkleję.", "Pokaż, jak zmienia się koszt na ha przy areale od 60 do 200 ha.", "Dopisz koszt mojej pracy według stawki godzinowej i wydajności, które podam.", "Zrób to samo dla opryskiwacza z danymi, które wkleję.", "Napisz krótkie uzasadnienie decyzji dla wspólnika.", "Przygotuj tabelę do arkusza kalkulacyjnego.", "Wypisz pytania, które warto zadać usługodawcy przed podpisaniem umowy."], "checklista": ["Cena zakupu i wartość końcowa pochodzą z ofert, a nie z pamięci.", "Stopa kosztu kapitału i % napraw ustalił rolnik.", "Areał roczny jest realny przy tej szerokości roboczej i oknie agrotechnicznym.", "Stawka usługi jest netto i obejmuje to samo co praca własna.", "Omówiono terminowość i ryzyko braku usługi w szczycie.", "Próg areału został zestawiony z rzeczywistym areałem gospodarstwa."], "uwaga": "", "przyklad": {"wejscie": "Myślę o siewniku pneumatycznym 4 metry. Oferta 180 tysięcy netto, po 10 latach sprzedam za jakieś 40 tysięcy. Ubezpieczenie i garaż liczę 2000 zł rocznie, naprawy 1,5% ceny rocznie, koszt pieniądza przyjmij 6%. Sieję u siebie 120 hektarów. Paliwo i ciągnik wychodzi mi 60 zł na hektar. Usługodawca z Lubnia bierze 250 zł/ha netto. Opłaca się kupować? Obecny siewnik ma 15 lat i coraz więcej przy nim roboty. Sąsiad też by chciał, żebym mu siał, ale nic nie obiecuje. Usługodawca czasem przyjeżdża tydzień po terminie, bo ma dużo klientów, i to mnie najbardziej wkurza przy rzepaku.", "wynik": "SIEWNIK WŁASNY CZY USŁUGA – 120 ha/rok\n\nKoszty stałe roczne:\n1. Amortyzacja: (180 000 − 40 000) ÷ 10 = 14 000 zł\n2. Koszt kapitału: średnia wartość (180 000 + 40 000) ÷ 2 = 110 000 × 6% = 6 600 zł\n3. Ubezpieczenie i garaż: 2 000 zł\nRazem stałe: 22 600 zł/rok\n\nKoszty zmienne na ha:\n4. Naprawy: 180 000 × 1,5% = 2 700 zł/rok ÷ 120 ha = 22,50 zł/ha\n5. Paliwo i ciągnik: 60 zł/ha\nRazem zmienne: 82,50 zł/ha\n\n| pozycja | zł/ha |\n| koszty stałe (22 600 ÷ 120) | 188,33 |\n| koszty zmienne | 82,50 |\n| koszt własny | 270,83 |\n| usługa | 250,00 |\n| różnica | +20,83 na korzyść usługi |\n\nNa 120 ha usługa wychodzi taniej o ok. 2 500 zł rocznie (20,83 × 120).\n\nPróg areału: 22 600 ÷ (250 − 82,50) = 22 600 ÷ 167,50 = 134,9 ha. Zakup zaczyna się opłacać powyżej ok. 135 ha siewu rocznie.\n\nPoza ceną:\n- terminowość siewu rzepaku i pszenicy – czy usługodawca przyjedzie w optymalnym oknie [DO WERYFIKACJI],\n- możliwość siewu usługowo u sąsiadów, co podniesie areał [DO UZUPEŁNIENIA],\n- praca własna nie jest wliczona [DO UZUPEŁNIENIA].\n\n[ZAŁOŻENIE] naprawy liczone jako stały % ceny niezależnie od wieku maszyny.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "3.08", "nazwa": "Strategia sprzedaży plonów", "tag": "SPRZEDAŻ PLONÓW", "co_robi": "Porównuje sprzedaż w żniwa z przechowaniem i kontraktem terminowym, licząc koszt magazynowania i koszt pieniądza. Wylicza cenę, którą musi dać sprzedaż odroczona, i proponuje podział partii.", "kiedy": "W żniwa, gdy skupy dzwonią z ofertami, magazyn się zapełnia, a rolnik nie wie, czy sprzedawać od razu, czy czekać.", "brief": [{"pole": "Towar i ilość", "opis": "Co i ile, z parametrami, np. „pszenica konsumpcyjna 300 t, białko wg analizy skupu”."}, {"pole": "Oferty i kontrakty", "opis": "Ceny teraz i na termin, np. „żniwa 800 zł/t netto; kontrakt marzec 880 zł/t”."}, {"pole": "Koszty przechowania", "opis": "Twoje koszty na tonę miesięcznie, ubytki, np. „12 zł/t/mies. z wentylacją i ubytkami”."}, {"pole": "Koszt pieniądza", "opis": "Oprocentowanie Twojego kredytu lub lokaty, np. „kredyt obrotowy 8% rocznie”."}, {"pole": "Potrzeby gotówki", "opis": "Kiedy i ile musisz mieć, np. „100 000 zł do końca września na nawozy i leasing”."}, {"pole": "Magazyn i logistyka", "opis": "Pojemność, transport, np. „silosy na 250 t, transport własny do 30 km”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym (ekonomika gospodarstw, rachunek kosztów w produkcji roślinnej), który na co dzień liczy z rolnikami opłacalność upraw. Przygotuj strategię sprzedaży plonu.\n\nDANE:\nTowar i ilość: [TOWAR I ILOŚĆ]\nOferty i kontrakty: [OFERTY I KONTRAKTY]\nKoszty przechowania: [KOSZTY PRZECHOWANIA]\nKoszt pieniądza: [KOSZT PIENIĄDZA]\nPotrzeby gotówki: [POTRZEBY GOTÓWKI]\nMagazyn i logistyka: [MAGAZYN I LOGISTYKA]\n\nZASADY:\n1. Najpierw sprawdź dane. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 6 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj cen, plonów, stawek, dopłat ani kosztów i nie podawaj „średnich rynkowych”. Liczysz wyłącznie na moich liczbach. Brak danej oznacz [DO UZUPEŁNIENIA], wartość przyjętą przez ciebie [ZAŁOŻENIE], rzecz niepewną [DO WERYFIKACJI].\n3. Pokazuj obliczenia krok po kroku, z jednostkami (zł/ha, zł/t, t/ha), zaokrąglaj dopiero wynik końcowy.\n4. Dla każdej opcji policz cenę netto po kosztach: cena − przechowanie za liczbę miesięcy − koszt pieniądza (cena żniwna × stopa × miesiące ÷ 12).\n5. Policz cenę progową sprzedaży odroczonej, przy której czekanie się zwraca.\n6. Nie prognozuj cen i nie podawaj notowań rynkowych. Liczysz tylko na ofertach, które podałem.\n7. Najpierw zabezpiecz potrzeby gotówki, potem rozdziel resztę partii.\n\nFORMAT WYNIKU:\nA) Tabela opcji | opcja | cena | koszty | cena netto zł/t | wartość partii |.\nB) Cena progowa dla sprzedaży odroczonej.\nC) Proponowany podział partii na terminy, z uzasadnieniem.\nD) Ryzyka (jakość w magazynie, kontrakt, płatność) i lista luk.\n\nNa końcu dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dodaj opcję sprzedaży w styczniu po cenie, którą podam.", "Rozdziel koszt przechowania na stały i zmienny i przelicz próg.", "Pokaż wynik, jeśli sprzedam połowę teraz, a połowę z kontraktu.", "Przelicz wszystko przy stopie procentowej, którą podam.", "Dodaj koszt transportu do każdego punktu skupu według moich stawek.", "Przygotuj listę pytań do kupca przed podpisaniem kontraktu.", "Sprawdź, czy moje potrzeby gotówki są pokryte w każdym wariancie.", "Napisz krótką notatkę dla rolnika z rekomendacją podziału.", "Zrób tabelę porównawczą do arkusza kalkulacyjnego.", "Uwzględnij ubytki masy w magazynie według procentu, który podam."], "checklista": ["Wszystkie ceny pochodzą z aktualnych ofert lub umów, z datą.", "Parametry jakościowe i potrącenia są znane dla każdej oferty.", "Koszt przechowania obejmuje wentylację, ubytki i ewentualne zabiegi magazynowe.", "Potrzeby gotówki są pokryte w terminie.", "Warunki kontraktu (kary, tolerancje, płatność) zostały przeczytane.", "Rekomendacja nie opiera się na prognozie cen."], "uwaga": "Kontrakt terminowy to umowa z konsekwencjami – przed podpisaniem sprawdź zapisy o jakości, tolerancjach ilości, karach i terminie płatności.", "przyklad": {"wejscie": "Mam 300 ton pszenicy konsumpcyjnej. Skup daje teraz w żniwa 800 zł netto. Inny kupiec proponuje kontrakt na marzec po 880. Przechowanie u siebie liczę 12 zł za tonę miesięcznie z wentylacją i ubytkami. Mam kredyt obrotowy na 8% rocznie. Do końca września potrzebuję 100 tysięcy na nawozy i leasing. Silosy mieszczą 250 ton. Co robić? Białko wyszło dobre, na granicy pierwszej klasy, wilgotność 13,5%. Kontrakt marcowy na piśmie jeszcze nie przyszedł, tylko rozmowa przez telefon. Transport do obu skupów robię sam, odległość podobna. Nie chcę zgadywać, co będzie z cenami, chcę policzyć na tym, co mam w ręku.", "wynik": "STRATEGIA SPRZEDAŻY – pszenica konsumpcyjna, 300 t\n\nOkres przechowania sierpień → marzec: 7 miesięcy\n\n1. Przechowanie: 12 zł/t × 7 = 84 zł/t\n2. Koszt pieniądza: 800 × 8% × 7 ÷ 12 = 37,33 zł/t\n3. Kontrakt marzec netto po kosztach: 880 − 84 − 37,33 = 758,67 zł/t\n\n| opcja | cena | koszty | netto zł/t | wartość 300 t |\n| sprzedaż w żniwa | 800 | 0 | 800,00 | 240 000 |\n| kontrakt marzec | 880 | 121,33 | 758,67 | 227 601 |\n\nCena progowa: 800 + 84 + 37,33 = 921,33 zł/t. Kontrakt marcowy musiałby dać co najmniej ok. 921 zł/t, żeby czekanie się zwróciło przy Twoich kosztach.\n\nPotrzeby gotówki: 100 000 zł ÷ 800 zł/t = 125 t do sprzedaży w żniwa – to minimum.\n\nPropozycja:\n- Na Twoich liczbach sprzedaż w żniwa daje więcej niż kontrakt marcowy (41,33 zł/t różnicy, 12 400 zł na 300 t).\n- Silosy mieszczą 250 t, więc 50 t i tak trzeba sprzedać od razu.\n- Przed decyzją sprawdź, ile z 12 zł/t to koszty stałe silosów, które ponosisz i tak [DO WERYFIKACJI] – jeśli większość, próg spada.\n\nRyzyka: jakość ziarna w magazynie, wiarygodność kupca i termin płatności z kontraktu [DO UZUPEŁNIENIA].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "3.09", "nazwa": "Analiza wyników sezonu po żniwach (rentowność pól)", "tag": "ANALIZA SEZONU", "co_robi": "Zestawia plony, przychody i koszty pole po polu i układa ranking rentowności. Wskazuje pola i uprawy, które ciągną wynik w dół, oraz pytania do planu na kolejny sezon.", "kiedy": "Jesienią, po sprzedaży plonów, gdy rolnik siada z doradcą, żeby podsumować rok i zaplanować zmiany.", "brief": [{"pole": "Gospodarstwo i sezon", "opis": "Np. „gospodarstwo 55 ha, gm. Krośniewice, sezon 2025/2026”."}, {"pole": "Pola i uprawy", "opis": "Lista pól z uprawą i ha, np. „Za stodołą 18 ha pszenica; Działka 112/3 25 ha rzepak; Pod lasem 12 ha kukurydza”."}, {"pole": "Plony i ceny uzyskane", "opis": "Rzeczywiste z wag i faktur, np. „pszenica 8,1 t/ha po 820 zł/t”."}, {"pole": "Koszty na pole", "opis": "Koszty bezpośrednie na ha dla każdego pola z ewidencji, np. „Za stodołą 3300 zł/ha”."}, {"pole": "Uwagi z sezonu", "opis": "Co się działo, np. „Pod lasem susza w lipcu, rzepak wymarzanie na części”."}, {"pole": "Cel analizy", "opis": "Np. „decyzje o płodozmianie i nawożeniu na kolejny sezon”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym (ekonomika gospodarstw, rachunek kosztów w produkcji roślinnej), który na co dzień liczy z rolnikami opłacalność upraw. Przeanalizuj wyniki sezonu w podziale na pola.\n\nDANE:\nGospodarstwo i sezon: [GOSPODARSTWO I SEZON]\nPola i uprawy: [POLA I UPRAWY]\nPlony i ceny uzyskane: [PLONY I CENY UZYSKANE]\nKoszty na pole: [KOSZTY NA POLE]\nUwagi z sezonu: [UWAGI Z SEZONU]\nCel analizy: [CEL ANALIZY]\n\nZASADY:\n1. Najpierw sprawdź dane. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 6 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj cen, plonów, stawek, dopłat ani kosztów i nie podawaj „średnich rynkowych”. Liczysz wyłącznie na moich liczbach. Brak danej oznacz [DO UZUPEŁNIENIA], wartość przyjętą przez ciebie [ZAŁOŻENIE], rzecz niepewną [DO WERYFIKACJI].\n3. Pokazuj obliczenia krok po kroku, z jednostkami (zł/ha, zł/t, t/ha), zaokrąglaj dopiero wynik końcowy.\n4. Dla każdego pola policz: przychód zł/ha, koszty zł/ha, nadwyżkę zł/ha i na całe pole. Ułóż ranking od najlepszego.\n5. Podaj średnią ważoną areałem dla gospodarstwa.\n6. Przyczyny słabszych wyników opisz jako hipotezy do sprawdzenia w polu i w ewidencji, oznacz [DO WERYFIKACJI]; nie przesądzaj.\n7. Nie porównuj z „normami regionalnymi” – nie znasz ich. Porównuj pola ze sobą i z danymi z lat, które podam.\n\nFORMAT WYNIKU:\nA) Tabela | pole | uprawa | ha | plon | przychód zł/ha | koszty zł/ha | nadwyżka zł/ha | nadwyżka pole |.\nB) Ranking i średnia gospodarstwa z obliczeniami.\nC) Hipotezy przyczyn i co sprawdzić.\nD) Pytania do planu na kolejny sezon i lista luk.\n\nNa końcu dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dodaj kolumnę z wynikami tych samych pól z zeszłego roku, które wkleję.", "Policz koszt na tonę dla każdego pola.", "Uwzględnij dopłaty, które podam, w osobnej kolumnie.", "Przygotuj wersję raportu do wydruku dla rolnika.", "Wskaż pola, na których warto zlecić analizę gleby w OSChR.", "Zrób wykres tekstowy nadwyżki na ha dla każdego pola.", "Rozbij koszty pola z najgorszym wynikiem na pozycje.", "Zaproponuj pytania do planu płodozmianu na podstawie wyników.", "Przygotuj tabelę do arkusza kalkulacyjnego.", "Napisz podsumowanie sezonu w pięciu zdaniach."], "checklista": ["Plony pochodzą z wag lub dokumentów sprzedaży, a nie z szacunku.", "Ceny są faktycznie uzyskane, netto, dla każdego pola.", "Koszty na pole zgadzają się z ewidencją zabiegów i fakturami.", "Areały pól zgadzają się z wnioskiem.", "Przyczyny słabych wyników są hipotezami do sprawdzenia, nie wnioskami.", "Średnia gospodarstwa jest ważona areałem."], "uwaga": "", "przyklad": {"wejscie": "Podsumujmy sezon, gospodarstwo 55 ha koło Krośniewic. Za stodołą 18 ha pszenica, wyszło 8,1 tony, sprzedana po 820, koszty bezpośrednie 3300 na hektar. Działka 112/3, 25 ha rzepak, 2,9 tony po 1850, koszty 3500. Pod lasem 12 ha kukurydza na ziarno, 8,5 tony suchego po 700, koszty z suszeniem 4900. Pod lasem była susza w lipcu, a rzepak częściowo wymarzł. Chcę wiedzieć, co zmienić na przyszły rok. Kukurydzę suszyłem w swojej suszarni, gaz drogi. Rzepak miał dwa zabiegi fungicydowe więcej niż zwykle, bo wiosna była mokra. Pszenica po rzepaku, siana w terminie. Dopłat w tej analizie nie licz, wpiszę je osobno, jak przyjdzie decyzja.", "wynik": "ANALIZA SEZONU – gospodarstwo 55 ha (kwoty netto, bez dopłat)\n\n| pole | uprawa | ha | plon t/ha | przychód zł/ha | koszty zł/ha | nadwyżka zł/ha | nadwyżka pole |\n| Za stodołą | pszenica | 18 | 8,1 | 6 642 | 3 300 | 3 342 | 60 156 |\n| Działka 112/3 | rzepak | 25 | 2,9 | 5 365 | 3 500 | 1 865 | 46 625 |\n| Pod lasem | kukurydza | 12 | 8,5 | 5 950 | 4 900 | 1 050 | 12 600 |\n\nObliczenia:\nZa stodołą: 8,1 × 820 = 6 642; 6 642 − 3 300 = 3 342 zł/ha × 18 = 60 156 zł\n112/3: 2,9 × 1 850 = 5 365; 5 365 − 3 500 = 1 865 zł/ha × 25 = 46 625 zł\nPod lasem: 8,5 × 700 = 5 950; 5 950 − 4 900 = 1 050 zł/ha × 12 = 12 600 zł\n\nGospodarstwo: 60 156 + 46 625 + 12 600 = 119 381 zł ÷ 55 ha = 2 170,56 zł/ha\n\nRanking: 1. Za stodołą, 2. Działka 112/3, 3. Pod lasem.\n\nHipotezy [DO WERYFIKACJI]:\n- Pod lasem: susza w lipcu przy wysokim koszcie suszenia – sprawdzić pojemność wodną gleby i czy kukurydza to dobry wybór na to pole.\n- 112/3: wymarzanie części plantacji – sprawdzić termin siewu, odmianę i stan roślin przed zimą.\n\nPytania na kolejny sezon:\n- Czy Pod lasem nie zastąpić uprawą mniej wrażliwą na suszę?\n- Jaki plon z 112/3 był w latach bez wymarzania [DO UZUPEŁNIENIA]?\n- Kiedy ostatnio badana zasobność gleby w OSChR [DO UZUPEŁNIENIA]?\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "3.10", "nazwa": "Kalkulacja inwestycji i okres zwrotu", "tag": "INWESTYCJA", "co_robi": "Liczy prosty okres zwrotu i wartość bieżącą netto (NPV) inwestycji na podstawie nakładów i korzyści, które podaje rolnik. Dodaje wariant pesymistyczny, żeby było widać ryzyko.", "kiedy": "Przed zakupem magazynu, suszarni czy opryskiwacza, albo przy składaniu wniosku o kredyt lub dofinansowanie.", "brief": [{"pole": "Inwestycja", "opis": "Co i po co, np. „silosy zbożowe 800 t z wentylacją, żeby nie sprzedawać w żniwa”."}, {"pole": "Nakłady", "opis": "Koszt całkowity z ofert i ewentualne dofinansowanie, np. „420 000 zł netto, dotacja – nie wiem”."}, {"pole": "Korzyści roczne", "opis": "Twoje szacunki wpływu na wynik, np. „lepsza cena 60 zł/t na 800 t, mniej transportu w żniwa 6000 zł”."}, {"pole": "Koszty eksploatacji", "opis": "Prąd, serwis, ubezpieczenie, np. „10 zł/t rocznie”."}, {"pole": "Okres i stopa", "opis": "Żywotność i stopa dyskontowa, np. „20 lat, stopa 6% jak oprocentowanie kredytu”."}, {"pole": "Finansowanie", "opis": "Własne, kredyt, leasing, np. „kredyt inwestycyjny na 8 lat”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym (ekonomika gospodarstw, rachunek kosztów w produkcji roślinnej), który na co dzień liczy z rolnikami opłacalność upraw. Oceń opłacalność inwestycji w gospodarstwie.\n\nDANE:\nInwestycja: [INWESTYCJA]\nNakłady: [NAKŁADY]\nKorzyści roczne: [KORZYŚCI ROCZNE]\nKoszty eksploatacji: [KOSZTY EKSPLOATACJI]\nOkres i stopa: [OKRES I STOPA]\nFinansowanie: [FINANSOWANIE]\n\nZASADY:\n1. Najpierw sprawdź dane. Jeśli brakuje czegoś istotnego, zadaj mi maksymalnie 6 krótkich pytań i poczekaj na odpowiedź.\n2. Nie wymyślaj cen, plonów, stawek, dopłat ani kosztów i nie podawaj „średnich rynkowych”. Liczysz wyłącznie na moich liczbach. Brak danej oznacz [DO UZUPEŁNIENIA], wartość przyjętą przez ciebie [ZAŁOŻENIE], rzecz niepewną [DO WERYFIKACJI].\n3. Pokazuj obliczenia krok po kroku, z jednostkami (zł/ha, zł/t, t/ha), zaokrąglaj dopiero wynik końcowy.\n4. Policz roczną korzyść netto (korzyści − koszty eksploatacji), prosty okres zwrotu (nakład ÷ korzyść roczna) i NPV przy stopie, którą podałem.\n5. Dofinansowania, stawek i warunków programów nie podawaj sam. Jeśli go nie znam, licz bez niego i oznacz [DO UZUPEŁNIENIA].\n6. Dodaj wariant pesymistyczny ze słabszymi korzyściami, które podam lub które oznaczysz jako [ZAŁOŻENIE].\n7. Oddziel decyzję inwestycyjną od sposobu finansowania – rat kredytu nie licz bez moich warunków.\n\nFORMAT WYNIKU:\nA) Roczna korzyść netto z obliczeniami.\nB) Prosty okres zwrotu i NPV.\nC) Wariant pesymistyczny w tabeli obok bazowego.\nD) Ryzyka, warunki opłacalności i lista luk.\n\nNa końcu dopisz: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przelicz wszystko z dotacją w kwocie, którą podam.", "Dodaj wariant optymistyczny według moich danych.", "Policz harmonogram rat kredytu według warunków, które wkleję.", "Pokaż przepływy rok po roku w tabeli.", "Policz wewnętrzną stopę zwrotu IRR.", "Sprawdź, przy jakiej korzyści rocznej NPV spada do zera.", "Porównaj tę inwestycję z drugą, którą opiszę.", "Przygotuj opis ekonomiczny do biznesplanu wniosku.", "Napisz rolnikowi podsumowanie w trzech zdaniach.", "Zrób tabelę do arkusza kalkulacyjnego."], "checklista": ["Nakłady pochodzą z ofert, z jasnym netto/brutto.", "Korzyści roczne są oszacowane przez rolnika i zapisane jako założenia.", "Dofinansowanie jest potwierdzone w aktualnym naborze albo pominięte.", "Stopę dyskontową i okres użytkowania ustalił rolnik.", "Policzony został wariant pesymistyczny.", "Finansowanie i raty nie zostały pomylone z opłacalnością inwestycji.", "Wnioski sprawdził doradca przed złożeniem wniosku lub kredytu."], "uwaga": "Warunki dofinansowania i terminy naborów zmieniają się – sprawdzaj je w aktualnych ogłoszeniach ARiMR lub w ODR; AI ich nie zna.", "przyklad": {"wejscie": "Chcę postawić silosy na 800 ton z wentylacją. Oferta 420 tysięcy netto z montażem. Może będzie dotacja, ale nie wiem ile. Liczę, że jak nie sprzedam w żniwa, wezmę średnio o 60 zł na tonie więcej, czyli na 800 ton. Do tego oszczędzę na transporcie w żniwa jakieś 6 tysięcy rocznie. Prąd i serwis to około 10 zł na tonę rocznie. Silosy na 20 lat, stopę przyjmij 6%. Gorszy wariant: różnica ceny tylko 40 zł/t. Sprzedaję rocznie mniej więcej tyle zboża, więc silosy będą pełne. Kredyt mi bank da, ale chcę najpierw wiedzieć, czy to się w ogóle spina. Na raty i dotację przyjdzie czas.", "wynik": "INWESTYCJA – silosy 800 t z wentylacją (netto, bez dotacji)\n\nKorzyść roczna – wariant bazowy:\n1. Lepsza cena: 60 zł/t × 800 t = 48 000 zł\n2. Transport: + 6 000 zł\n3. Eksploatacja: 10 zł/t × 800 t = − 8 000 zł\nKorzyść netto: 48 000 + 6 000 − 8 000 = 46 000 zł/rok\n\nWariant pesymistyczny:\n40 × 800 = 32 000 + 6 000 − 8 000 = 30 000 zł/rok\n\nCzynnik dyskontujący 20 lat, 6%: (1 − 1,06^−20) ÷ 0,06 = 11,4699\n\n| wskaźnik | bazowy | pesymistyczny |\n| korzyść roczna | 46 000 zł | 30 000 zł |\n| prosty okres zwrotu | 420 000 ÷ 46 000 = 9,1 roku | 420 000 ÷ 30 000 = 14,0 roku |\n| wartość bieżąca korzyści | 527 616 zł | 344 098 zł |\n| NPV | +107 616 zł | −75 902 zł |\n\nWniosek: w wariancie bazowym silosy się zwracają (NPV dodatnie), w pesymistycznym nie. Opłacalność zależy głównie od tego, czy różnica ceny między żniwami a sprzedażą odroczoną utrzyma się na poziomie bliższym 60 zł/t – to Twoje założenie, nie prognoza.\n\nNPV = 0 przy korzyści rocznej ok. 36 618 zł (420 000 ÷ 11,4699).\n\nDo uzupełnienia:\n- dotacja i jej warunki [DO UZUPEŁNIENIA],\n- ubezpieczenie silosów [DO UZUPEŁNIENIA],\n- [ZAŁOŻENIE] pełne wykorzystanie 800 t co roku.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}]}, {"dzial_nr": 4, "dzial": "Rolnicy, oferty i doradztwo płatne", "opis": "Dobra wiedza z pola nie zarabia sama — trzeba ją wycenić, opisać w ofercie, zamknąć w umowie i regularnie pokazywać klientowi. Ten dział zajmuje się stroną biznesową doradztwa: od cennika i onboardingu, przez raporty i dni pola, po trudne rozmowy i rozwój portfela klientów.", "skills": [{"id": "4.01", "nazwa": "Oferta doradztwa z cennikiem", "tag": "OFERTA DORADZTWA", "co_robi": "Układa z Twoich danych przejrzystą ofertę doradztwa agronomicznego z pakietami, zakresem i warunkami. Ceny bierze wyłącznie od Ciebie — AI nie podsuwa stawek, tylko porządkuje to, co oferujesz, i pokazuje rolnikowi, za co płaci.", "kiedy": "Gdy rolnik po rozmowie na polu albo na dniu pola mówi „to podeślij mi coś na piśmie” i chcesz wysłać ofertę jeszcze tego samego wieczoru.", "brief": [{"pole": "Profil doradcy", "opis": "Kim jesteś i co umiesz, np. „prywatny doradca, 12 lat w ODR, specjalizacja: rzepak, zboża, nawożenie precyzyjne, działam w powiatach kutnowskim i łęczyckim”."}, {"pole": "Klient docelowy", "opis": "Dla kogo jest oferta, np. „gospodarstwa 100–400 ha, uprawy polowe, właściciel sam prowadzi, brak własnego agronoma”."}, {"pole": "Zakres usług", "opis": "Co realnie robisz, np. „lustracje co 10–14 dni w sezonie, plan nawożenia azotem, pomoc w ewidencji zabiegów, analiza OSChR, wsparcie przy wniosku ARiMR”."}, {"pole": "Pakiety i stawki", "opis": "Twoje własne ceny i warianty, np. „Pakiet Podstawowy … zł/ha/rok, Pakiet Pełny … zł/ha/rok, wizyta jednorazowa … zł” — wpisz swoje liczby."}, {"pole": "Warunki współpracy", "opis": "Płatności, minimalny okres, dojazdy, np. „płatność kwartalna z góry, umowa na sezon, dojazd do 50 km w cenie”."}, {"pole": "Ton i forma", "opis": "Jak ma brzmieć, np. „konkretnie, bez lania wody, 2 strony A4 + krótka wersja do maila”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który prowadzi własną praktykę doradczą i pisze oferty dla gospodarstw towarowych. Pomóż mi przygotować ofertę doradztwa z cennikiem.\n\nDANE:\nProfil doradcy: [PROFIL DORADCY]\nKlient docelowy: [KLIENT DOCELOWY]\nZakres usług: [ZAKRES USŁUG]\nPakiety i stawki (moje ceny): [PAKIETY I STAWKI]\nWarunki współpracy: [WARUNKI WSPÓŁPRACY]\nTon i forma: [TON I FORMA]\n\nZASADY:\n1. Najpierw sprawdź kompletność danych. Jeśli czegoś istotnego brakuje, zadaj maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Używaj wyłącznie moich stawek. Jeśli pakiet nie ma ceny, wstaw [DO UZUPEŁNIENIA] i nie proponuj kwoty.\n3. Każdy pakiet opisz konkretnie: liczba wizyt, co dostaje rolnik na piśmie, czas reakcji, czego pakiet NIE obejmuje.\n4. Pisz językiem rolnika i agronoma, bez marketingowych frazesów. Korzyść pokazuj przez decyzje w polu (termin zabiegu, plan nawożenia, mniej błędów w ewidencji), nie przez obiecywanie plonu.\n5. Nie obiecuj wzrostu plonu ani oszczędności w liczbach, chyba że podam własne dane z gospodarstw.\n6. Jeśli liczysz koszt dla przykładowego gospodarstwa, pokaż obliczenie krok po kroku na moich stawkach.\n7. Nie wymyślaj cen, stawek, kwot, dawek, terminów ani numerów przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], rzeczy niepewne [DO WERYFIKACJI].\n\nFORMAT WYNIKU:\nA) Oferta gotowa do wysłania: nagłówek, krótko o mnie, problem klienta, pakiety, warunki, kontakt.\nB) Tabela porównania pakietów w formacie | pakiet | co zawiera | cena |.\nC) Wersja skrócona do e-maila lub WhatsAppa (maks. 8 zdań).\nD) Lista luk i założeń do uzupełnienia przed wysłaniem.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dodaj trzeci pakiet „Start” dla gospodarstw do 50 ha.", "Przelicz koszt pakietu dla gospodarstwa 230 ha na moich stawkach, krok po kroku.", "Skróć ofertę do jednej strony A4.", "Dopisz sekcję „Czego nie obejmuje pakiet”, żeby uniknąć nieporozumień.", "Przygotuj wersję oferty dla grupy producentów rolnych.", "Napisz akapit o mnie w trzeciej osobie, do stopki oferty.", "Dodaj krótkie FAQ z 5 pytaniami, które rolnicy zadają najczęściej.", "Zamień ton na bardziej bezpośredni, jak rozmowa przy ciągniku.", "Przygotuj SMS z linkiem do oferty i zaproszeniem na rozmowę.", "Sprawdź, czy w ofercie nie ma obietnic, których nie mogę udowodnić."], "checklista": ["Wszystkie ceny pochodzą z mojego cennika i są aktualne na ten sezon.", "Jasno opisano, czy ceny są netto czy brutto i jak liczone są dojazdy.", "Każdy pakiet ma liczbę wizyt i listę dokumentów, które dostaje rolnik.", "Jest sekcja „czego nie obejmuje” (np. zakup środków, odpowiedzialność za wykonanie zabiegu).", "Brak obietnic plonu lub oszczędności bez pokrycia w danych.", "Dane kontaktowe i termin ważności oferty są uzupełnione."], "uwaga": "Ceny i warunki ustalasz Ty. Jeśli oferta ma stać się podstawą umowy, zakres usług przenieś do umowy i skonsultuj ją z prawnikiem lub księgowym.", "przyklad": {"wejscie": "Jestem prywatnym doradcą, wcześniej 9 lat w ODR w Łodzi. Robię głównie rzepak, pszenicę, kukurydzę, powiat kutnowski i łowicki. Chcę dwa pakiety: Podstawowy — wizyty co dwa tygodnie od marca do lipca, plan nawożenia azotem, pomoc w ewidencji zabiegów, 380 zł za wizytę. Pełny — to samo plus jesienne lustracje rzepaku, interpretacja OSChR i telefon w sezonie bez limitu, 45 zł za hektar na rok. Dojazd do 40 km w cenie, dalej osobno, stawkę dopiszę. Płatność kwartalnie. Klient: gospodarstwa 150–400 ha, sam właściciel. Krótko i konkretnie, bez lania wody.", "wynik": "OFERTA DORADZTWA AGRONOMICZNEGO — SEZON [DO UZUPEŁNIENIA]\n\nDla kogo: gospodarstwa 150–400 ha w powiatach kutnowskim i łowickim, prowadzone przez właściciela bez własnego agronoma.\n\nCo zyskujesz: decyzje o zabiegach i nawożeniu podejmowane na podstawie lustracji, a nie „na oko”, porządek w ewidencji zabiegów i jeden numer telefonu, pod którym ktoś zna Twoje pola.\n\n| pakiet | co zawiera | cena |\n| Podstawowy | wizyty co 2 tygodnie III–VII, plan nawożenia azotem, pomoc w ewidencji zabiegów | 380 zł / wizyta [DO WERYFIKACJI: netto czy brutto] |\n| Pełny | jak Podstawowy + jesienne lustracje rzepaku, interpretacja wyników OSChR, telefon w sezonie bez limitu | 45 zł / ha / rok [DO WERYFIKACJI: netto czy brutto] |\n\nPrzykład wyliczenia (Pełny, 230 ha): 230 ha × 45 zł = 10 350 zł / rok; płatność kwartalna: 10 350 zł ÷ 4 = 2 587,50 zł [ZAŁOŻENIE: cztery równe raty].\n\nDojazd: do 40 km w cenie, powyżej — [DO UZUPEŁNIENIA] zł/km.\n\nPakiety nie obejmują: zakupu środków i nawozów, wykonania zabiegów, odpowiedzialności za termin i jakość oprysku wykonanego przez gospodarstwo.\n\nOferta ważna do: [DO UZUPEŁNIENIA].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "4.02", "nazwa": "Umowa o świadczenie usług doradczych", "tag": "UMOWA DORADCZA", "co_robi": "Przygotowuje roboczy szkic umowy o doradztwo agronomiczne: zakres, obowiązki stron, rozliczenie, odpowiedzialność i poufność danych. To materiał do rozmowy z prawnikiem, a nie gotowy dokument prawny — AI nie cytuje artykułów ani nie wymyśla kar umownych.", "kiedy": "Gdy rolnik zgodził się na współpracę na cały sezon i chcesz mieć coś na piśmie, zanim pojedziesz na pierwszą lustrację.", "brief": [{"pole": "Strony umowy", "opis": "Kto z kim, forma działalności, np. „ja — jednoosobowa działalność, VAT czynny; klient — gospodarstwo rolne, rolnik ryczałtowy, Jan Kowalski, Krośniewice”."}, {"pole": "Przedmiot i zakres", "opis": "Co dokładnie świadczysz, np. „doradztwo w uprawie rzepaku i pszenicy na 210 ha: lustracje, zalecenia pisemne, plan nawożenia azotem”."}, {"pole": "Wynagrodzenie i płatności", "opis": "Twoja stawka i sposób rozliczenia, np. „… zł/ha/rok, faktura kwartalna, termin płatności 14 dni” — liczby wpisujesz Ty."}, {"pole": "Okres i wypowiedzenie", "opis": "Na jak długo i jak się rozstać, np. „od 1 marca do 31 października, wypowiedzenie miesięczne”."}, {"pole": "Odpowiedzialność i ryzyka", "opis": "Czego się obawiasz, np. „rolnik sam decyduje i wykonuje zabieg; nie odpowiadam za pogodę, opóźniony oprysk, środek kupiony gdzie indziej”."}, {"pole": "Dane i poufność", "opis": "Jakie dane dostajesz i co z nimi, np. „mapy pól, wyniki OSChR, ewidencja zabiegów, wnioski ARiMR — tylko do celów doradztwa”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który od lat zawiera umowy z gospodarstwami i wie, o co się później kłócą strony. Pomóż mi przygotować roboczy szkic umowy o świadczenie usług doradczych, który przekażę prawnikowi do sprawdzenia.\n\nDANE:\nStrony umowy: [STRONY UMOWY]\nPrzedmiot i zakres usług: [PRZEDMIOT I ZAKRES]\nWynagrodzenie i płatności: [WYNAGRODZENIE I PŁATNOŚCI]\nOkres umowy i wypowiedzenie: [OKRES I WYPOWIEDZENIE]\nOdpowiedzialność i ryzyka: [ODPOWIEDZIALNOŚĆ I RYZYKA]\nDane i poufność: [DANE I POUFNOŚĆ]\n\nZASADY:\n1. Najpierw sprawdź kompletność danych. Jeśli czegoś istotnego brakuje, zadaj maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. To szkic do konsultacji z prawnikiem. Nie powołuj się na numery artykułów ani paragrafów ustaw, nie wymyślaj wysokości kar umownych, odsetek ani terminów ustawowych.\n3. Zakres usług opisz mierzalnie: liczba wizyt, forma zaleceń (pisemna), czas reakcji, co jest poza umową.\n4. Wyraźnie rozdziel role: doradca zaleca, rolnik decyduje, kupuje środki i wykonuje zabiegi zgodnie z etykietą oraz prowadzi ewidencję zabiegów.\n5. Wynagrodzenie wpisz tylko z moich danych; jeśli brakuje, zostaw lukę.\n6. Przy każdym zapisie, który wymaga oceny prawnej (VAT, RODO, ograniczenie odpowiedzialności), dodaj [DO WERYFIKACJI].\n7. Nie wymyślaj cen, stawek, kwot, dawek, terminów ani numerów przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], rzeczy niepewne [DO WERYFIKACJI].\n\nFORMAT WYNIKU:\nA) Szkic umowy w paragrafach numerowanych w obrębie dokumentu (strony, przedmiot, obowiązki, wynagrodzenie, odpowiedzialność, poufność, okres, postanowienia końcowe).\nB) Załącznik nr 1: zakres usług w tabeli | usługa | częstotliwość | forma |.\nC) Lista pytań do prawnika (5–8 punktów).\nD) Lista luk i założeń.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Dopisz załącznik z harmonogramem wizyt na sezon.", "Przygotuj prostszą wersję umowy na jednorazową wizytę.", "Rozbuduj zapis o tym, że rolnik sam odpowiada za wykonanie zabiegu zgodnie z etykietą.", "Dodaj zapis o przekazywaniu zaleceń e-mailem lub przez komunikator jako formie pisemnej.", "Przygotuj wersję dla grupy producentów z kilkoma gospodarstwami.", "Wypisz zapisy, które najczęściej powodują spory, i zaproponuj jaśniejsze brzmienie.", "Dodaj klauzulę o poufności danych z map pól i wyników analiz.", "Napisz krótki e-mail do prawnika z prośbą o przejrzenie szkicu.", "Zrób listę dokumentów, które rolnik powinien podpisać razem z umową.", "Przeredaguj umowę prostszym językiem, zrozumiałym dla rolnika."], "checklista": ["Szkic przejrzał prawnik przed podpisaniem.", "Dane stron, NIP lub PESEL i adresy są poprawne.", "Stawki i terminy płatności pochodzą z mojej oferty.", "Jasno opisano, że decyzja i wykonanie zabiegu należą do rolnika.", "Zakres usług jest mierzalny i ma listę wyłączeń.", "Zapisy o danych osobowych i poufności zweryfikowano pod kątem RODO.", "Brak wymyślonych kar umownych i numerów przepisów."], "uwaga": "To nie jest porada prawna. Umowę przed podpisaniem musi sprawdzić prawnik — zwłaszcza zapisy o odpowiedzialności, VAT i danych osobowych.", "przyklad": {"wejscie": "Umowa z panem Andrzejem Wiśniewskim z Żychlina, 210 ha, rzepak, pszenica, burak. Ja mam działalność, VAT czynny, on jest ryczałtowcem. Sezon od marca do końca października, wypowiedzenie miesiąc. Rozliczenie od hektara, stawkę wpiszę sam, faktura co kwartał. Chcę mieć napisane, że ja zalecam, a on decyduje i pryska, i że nie odpowiadam za środki kupione u innego dystrybutora ani za oprysk zrobiony dzień przed deszczem. Dostaję od niego mapy pól i wyniki OSChR, nikomu tego nie daję.", "wynik": "SZKIC UMOWY O ŚWIADCZENIE USŁUG DORADCZYCH — do konsultacji z prawnikiem\n\n§ 1. Strony\nZleceniobiorca: [DO UZUPEŁNIENIA: imię, nazwisko, firma, NIP], czynny podatnik VAT.\nZleceniodawca: Andrzej Wiśniewski, gospodarstwo rolne w Żychlinie, [DO UZUPEŁNIENIA: adres, NIP/PESEL].\n\n§ 2. Przedmiot umowy\nZleceniobiorca świadczy doradztwo agronomiczne w uprawie rzepaku, pszenicy i buraka cukrowego na powierzchni ok. 210 ha, w zakresie określonym w Załączniku nr 1.\n\n§ 3. Podział ról\n1. Zleceniobiorca przekazuje zalecenia w formie pisemnej (e-mail lub komunikator).\n2. Zleceniodawca samodzielnie podejmuje decyzję o wykonaniu zabiegu, zakupie środków i nawozów oraz wykonuje zabiegi zgodnie z etykietą środka i prowadzi ewidencję zabiegów.\n3. Zleceniobiorca nie odpowiada za skutki zabiegów wykonanych niezgodnie z zaleceniem, z etykietą, w niekorzystnych warunkach pogodowych ani środkami nabytymi poza jego zaleceniem. [DO WERYFIKACJI: dopuszczalny zakres ograniczenia odpowiedzialności]\n\n§ 4. Wynagrodzenie\n[DO UZUPEŁNIENIA] zł netto za 1 ha, płatne kwartalnie na podstawie faktury VAT, w terminie [DO UZUPEŁNIENIA] dni. [DO WERYFIKACJI: rozliczenie VAT z rolnikiem ryczałtowym]\n\nPytania do prawnika:\n— Czy zapis z § 3 ust. 3 jest skuteczny w tej formie?\n— Jak sformułować zgodę na przetwarzanie danych z map pól?\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "4.03", "nazwa": "Wiadomości sezonowe do portfela klientów", "tag": "WIADOMOŚCI SEZONOWE", "co_robi": "Pisze krótkie, konkretne wiadomości do całej bazy klientów na dany moment sezonu: SMS, e-mail i WhatsApp w kilku wariantach. Przypomina o obserwacjach i terminach, nie podaje dawek ani nazw środków z głowy.", "kiedy": "Gdy ruszyła wegetacja, przyszedł przymrozek albo nalot szkodników i chcesz w 10 minut dać znać wszystkim klientom, zanim zaczną dzwonić.", "brief": [{"pole": "Moment sezonu", "opis": "Kiedy i co się dzieje, np. „druga połowa marca, ruszyła wegetacja, rzepak BBCH 30–32, pora na pierwszą dawkę azotu na pszenicę”."}, {"pole": "Grupa odbiorców", "opis": "Do kogo idzie wiadomość, np. „34 gospodarstwa z pakietem Pełnym, głównie rzepak i pszenica, powiaty płocki i gostyniński”."}, {"pole": "Kanał", "opis": "SMS, e-mail czy WhatsApp, np. „SMS do wszystkich + dłuższy e-mail dla tych, którzy czytają”."}, {"pole": "Główna informacja", "opis": "Co mają wiedzieć lub zrobić, np. „sprawdzić żółte naczynia w rzepaku, nie startować z azotem na podmokłych polach, umówić lustrację”."}, {"pole": "Wezwanie do działania", "opis": "Czego od nich oczekujesz, np. „odpisać TAK, jeśli chcą wizytę w tym tygodniu” albo „zadzwonić do czwartku”."}, {"pole": "Mój styl", "opis": "Jak piszesz do klientów, np. „na Pan/Pani, krótko, bez emotek” albo „na ty, luźno, jak sąsiad”."}], "prompt": "Jesteś doświadczonym polskim agronomem, który prowadzi portfel kilkudziesięciu gospodarstw i regularnie wysyła im sezonowe komunikaty. Pomóż mi napisać wiadomości do klientów.\n\nDANE:\nMoment sezonu i stan upraw: [MOMENT SEZONU]\nGrupa odbiorców: [GRUPA ODBIORCÓW]\nKanał: [KANAŁ]\nGłówna informacja: [GŁÓWNA INFORMACJA]\nWezwanie do działania: [WEZWANIE DO DZIAŁANIA]\nMój styl: [MÓJ STYL]\n\nZASADY:\n1. Najpierw sprawdź kompletność danych. Jeśli czegoś istotnego brakuje, zadaj maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Wiadomość ma być ostrzeżeniem i zaproszeniem do obserwacji lub kontaktu, a nie zaleceniem zabiegu na odległość. Nie podawaj dawek, nazw handlowych środków ani terminów zabiegów, których nie podałem.\n3. Progi szkodliwości i sygnalizację odsyłaj do obserwacji na polu, komunikatów IOR-PIB lub do mojej wizyty, bez liczb z pamięci.\n4. SMS do 160 znaków (lub dwa SMS-y, jeśli zaznaczę), bez polskich znaków, jeśli o to poproszę.\n5. Każda wiadomość kończy się jednym jasnym wezwaniem do działania.\n6. Zachowaj mój styl zwracania się do klientów.\n7. Nie wymyślaj cen, stawek, kwot, dawek, terminów ani numerów przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], rzeczy niepewne [DO WERYFIKACJI].\n\nFORMAT WYNIKU:\nA) SMS: 3 warianty.\nB) WhatsApp: 2 warianty, nieco dłuższe, z listą 2–3 punktów.\nC) E-mail: temat + treść do 150 słów.\nD) Lista rzeczy do sprawdzenia przed wysyłką (informacje oznaczone [DO WERYFIKACJI]).\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przerób SMS tak, żeby zmieścił się w 160 znakach bez polskich liter.", "Napisz wersję dla klientów, którzy uprawiają tylko kukurydzę.", "Przygotuj wiadomość po przymrozku z prośbą o zdjęcia uszkodzeń.", "Napisz przypomnienie o uzupełnieniu ewidencji zabiegów ochrony roślin.", "Zrób kalendarz 6 wiadomości na cały sezon wiosenny.", "Napisz wiadomość o terminie składania wniosku do ARiMR z miejscem na datę, którą podam.", "Przygotuj wersję na grupę WhatsApp klientów, a nie wiadomość prywatną.", "Dodaj zaproszenie na dzień pola na końcu e-maila.", "Zmień ton na bardziej formalny, na Pan/Pani.", "Napisz wiadomość z podziękowaniem za sezon i zaproszeniem do rozmowy o kolejnym."], "checklista": ["Wiadomość nie zawiera dawek ani nazw środków podanych bez etykiety.", "Informacja o zagrożeniu zgadza się z moimi obserwacjami lub komunikatem IOR-PIB.", "Lista odbiorców jest właściwa (nie wysyłam o rzepaku do tych, którzy go nie mają).", "Daty i godziny w wiadomości są poprawne.", "Klienci wyrazili zgodę na kontakt SMS/e-mail/WhatsApp.", "Jest jedno jasne wezwanie do działania."], "uwaga": "Wiadomość masowa nie zastępuje lustracji. Nie wysyłaj zaleceń zabiegowych z dawkami do całej bazy — każdy zabieg musi być zgodny z etykietą środka i stanem konkretnego pola.", "przyklad": {"wejscie": "Koniec marca, Mazowsze, płocki i gostyniński. Rzepak ruszył, BBCH 30–31, w kilku miejscach w żółtych naczyniach już chowacz łodygowy, ale to moje dwa pola, nie wszędzie. Pszenice różnie, na lżejszych glebach słabo rozkrzewione. Chcę napisać do 34 klientów z pakietem Pełnym: niech wystawią naczynia albo sprawdzą, a jak chcą wizytę w tym tygodniu, to niech odpiszą TAK. SMS do wszystkich, na ty, krótko, a e-mail dłuższy.", "wynik": "SMS — wariant 1:\n„Rzepak ruszyl. Na moich polach w naczyniach pierwszy chowacz lodygowy. Wystaw naczynia i sprawdzaj co 2 dni. Chcesz wizyte w tym tygodniu? Odpisz TAK.”\n\nSMS — wariant 2:\n„Start wegetacji w rzepaku. Sprawdz zolte naczynia, u mnie juz chowacz. Lustracja w tym tyg.? Odpisz TAK - ustalimy termin.”\n\nWhatsApp — wariant 1:\nCześć, rzepak ruszył (BBCH 30–31). Na dwóch moich polach w żółtych naczyniach pojawił się chowacz łodygowy — to jeszcze nie znaczy, że u Ciebie też, ale warto sprawdzić:\n• wystaw naczynia na brzegu pola od strony zeszłorocznego rzepaku,\n• zaglądaj co 1–2 dni,\n• nie decyduj o zabiegu bez sprawdzenia, co faktycznie siedzi w naczyniu.\nChcesz lustrację w tym tygodniu? Odpisz TAK.\n\nE-mail — temat: Rzepak ruszył — sprawdź naczynia\n[…]\n\nDo sprawdzenia: obecność chowacza potwierdzona tylko na 2 polach [DO WERYFIKACJI: aktualny komunikat sygnalizacyjny IOR-PIB dla regionu].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "4.04", "nazwa": "Onboarding nowego gospodarstwa", "tag": "ONBOARDING KLIENTA", "co_robi": "Przygotowuje komplet na start współpracy: ankietę wstępną dla rolnika, listę dokumentów do zebrania i plan pierwszej wizyty z kolejnością pól i pytań. Dzięki temu pierwsza wizyta to praca, a nie szukanie papierów.", "kiedy": "Zaraz po podpisaniu umowy z nowym gospodarstwem, kilka dni przed pierwszym przyjazdem.", "brief": [{"pole": "Gospodarstwo", "opis": "Kto, gdzie, ile ha, np. „Państwo Nowakowie, gm. Kłodawa, 145 ha GO, w tym 30 ha dzierżawy, klasy IIIb–V”."}, {"pole": "Struktura upraw", "opis": "Co rośnie i w jakim płodozmianie, np. „rzepak 40 ha, pszenica 60 ha, kukurydza na ziarno 45 ha, bez obornika, gnojowica od sąsiada”."}, {"pole": "Co już mają", "opis": "Dokumenty i dane, np. „wyniki OSChR sprzed 3 lat, ewidencja zabiegów w zeszycie, brak planu nawożenia azotem”."}, {"pole": "Oczekiwania klienta", "opis": "Po co przyszli, np. „chcą ograniczyć koszty nawożenia, uporządkować papiery przed kontrolą, zacząć ekoschematy”."}, {"pole": "Zakres usługi", "opis": "Który pakiet kupili, np. „pakiet Pełny na sezon wiosna–jesień”."}, {"pole": "Termin pierwszej wizyty", "opis": "Kiedy i ile czasu, np. „wtorek 8:00, ok. 3 godziny, objazd pól + biuro”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który co sezon przyjmuje nowe gospodarstwa i ma sprawdzony proces wdrożenia. Pomóż mi przygotować onboarding nowego klienta.\n\nDANE:\nGospodarstwo: [GOSPODARSTWO]\nStruktura upraw: [STRUKTURA UPRAW]\nCo już mają: [CO JUŻ MAJĄ]\nOczekiwania klienta: [OCZEKIWANIA KLIENTA]\nZakres usługi: [ZAKRES USŁUGI]\nTermin pierwszej wizyty: [TERMIN PIERWSZEJ WIZYTY]\n\nZASADY:\n1. Najpierw sprawdź kompletność danych. Jeśli czegoś istotnego brakuje, zadaj maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Ankieta ma być krótka (do 20 pytań), w języku rolnika, z odpowiedziami do zaznaczenia tam, gdzie się da.\n3. Lista dokumentów obejmuje typowe źródła: wyniki OSChR, plan nawożenia azotem, ewidencja zabiegów ochrony roślin, mapy i numery działek, wniosek ARiMR z ostatniej kampanii, umowy dzierżawy, informacje o nawozach naturalnych. Nie oceniaj z góry, czego gospodarstwu brakuje — zapytaj.\n4. Nie wypowiadaj się o obowiązkach prawnych w liczbach (terminy, progi) — tam, gdzie to ważne, wstaw [DO WERYFIKACJI].\n5. Plan wizyty ułóż godzinowo, z kolejnością pól i rzeczami do zabrania (sonda, łopatka, naczynia, aparat).\n6. Wypisz ryzyka, które widzisz w danych, jako pytania, a nie diagnozy.\n7. Nie wymyślaj cen, stawek, kwot, dawek, terminów ani numerów przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], rzeczy niepewne [DO WERYFIKACJI].\n\nFORMAT WYNIKU:\nA) Ankieta wstępna do wysłania rolnikowi.\nB) Lista dokumentów w tabeli | dokument | czy jest | uwagi |.\nC) Plan pierwszej wizyty godzina po godzinie.\nD) Wiadomość powitalna do klienta (SMS lub e-mail) z prośbą o dokumenty.\nE) Lista luk i założeń.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Skróć ankietę do 10 najważniejszych pytań.", "Przygotuj ankietę w formie do wydrukowania z polami do zaznaczenia.", "Dopisz pytania o produkcję zwierzęcą i nawozy naturalne.", "Zrób listę rzeczy do zabrania na pierwszą wizytę.", "Napisz przypomnienie dla klienta dzień przed wizytą.", "Przygotuj szablon notatki z pierwszej wizyty do uzupełnienia na miejscu.", "Dodaj pytania o ekoschematy, które gospodarstwo realizowało w poprzednim roku.", "Ułóż plan pierwszych 30 dni współpracy.", "Przerób wiadomość powitalną na WhatsApp.", "Wypisz pytania, które warto zadać właścicielowi bez obecności pracowników."], "checklista": ["Ankieta nie zawiera pytań zbędnych dla wybranego zakresu usługi.", "Lista dokumentów zgadza się z tym, co realnie będzie mi potrzebne.", "Termin i godzina wizyty są potwierdzone przez klienta.", "Mam zgodę klienta na przetwarzanie danych z wniosku ARiMR i map pól.", "Plan wizyty uwzględnia dojazd i czas na rozmowę w biurze.", "Ryzyka zapisane są jako pytania, nie wnioski."], "uwaga": "", "przyklad": {"wejscie": "Nowi klienci, Nowakowie z gminy Kłodawa, 145 hektarów, z tego 30 dzierżawy. Rzepak 40, pszenica 60, kukurydza 45 na ziarno. Obornika nie mają, biorą gnojowicę od sąsiada, ilości nie znam. Badania gleby sprzed trzech lat z OSChR, ewidencja w zeszycie, planu nawożenia azotem nie mają. Chcą ograniczyć koszty nawozów i uporządkować papiery. Kupili pakiet Pełny. Pierwsza wizyta wtorek 8:00, mam z 3 godziny.", "wynik": "LISTA DOKUMENTÓW — gospodarstwo Nowaków, gm. Kłodawa\n\n| dokument | czy jest | uwagi |\n| Wyniki analiz gleby OSChR | tak, sprzed 3 lat | sprawdzić, które pola objęte; [DO WERYFIKACJI] czy potrzebna nowa analiza |\n| Plan nawożenia azotem | nie | zapytać, czy gospodarstwo jest objęte obowiązkiem [DO WERYFIKACJI] |\n| Ewidencja zabiegów ochrony roślin | tak, w zeszycie | przejrzeć kompletność wpisów |\n| Wniosek ARiMR z ostatniej kampanii | [DO UZUPEŁNIENIA] | numery działek, ekoschematy |\n| Umowy dzierżawy (30 ha) | [DO UZUPEŁNIENIA] | okres dzierżawy |\n| Dokumenty odbioru gnojowicy od sąsiada | [DO UZUPEŁNIENIA] | ilość, terminy — ważne dla bilansu azotu i limitu 170 kg N/ha |\n\nPLAN PIERWSZEJ WIZYTY (wtorek)\n8:00–8:40 — biuro: przegląd dokumentów, rozmowa o celach (koszty nawożenia, porządek w papierach).\n8:40–10:15 — objazd pól: najpierw rzepak (40 ha), potem pszenica na najsłabszych klasach [ZAŁOŻENIE: kolejność według stanu wegetacji].\n10:15–11:00 — podsumowanie przy stole, ustalenie terminu kolejnej lustracji i listy brakujących dokumentów.\n\nZabrać: sondę glebową, łopatkę, żółte naczynia, aparat, mapę działek.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "4.05", "nazwa": "Raport miesięczny dla klienta", "tag": "RAPORT MIESIĘCZNY", "co_robi": "Składa z Twoich notatek czytelny raport miesięczny: co zrobiliśmy, co zobaczyliśmy, jakie decyzje zapadły i co nas czeka. Rolnik widzi, za co płaci, a Ty masz dokumentację współpracy.", "kiedy": "Na koniec miesiąca, gdy masz kilka lustracji w notatkach i chcesz klientowi wysłać jedno podsumowanie, a nie 15 wiadomości z WhatsAppa.", "brief": [{"pole": "Klient i okres", "opis": "Kto i za jaki miesiąc, np. „Gospodarstwo Kaczmarek, Brodnica, maj”."}, {"pole": "Wizyty i działania", "opis": "Co zrobiłeś, np. „3 lustracje (5, 14, 27 maja), zalecenie fungicydowe w pszenicy BBCH 37–39, korekta planu nawożenia kukurydzy”."}, {"pole": "Obserwacje z pól", "opis": "Najważniejsze spostrzeżenia, np. „septorioza na dolnych liściach pszenicy na polu Za stodołą, rzepak po kwitnieniu bez większych problemów”."}, {"pole": "Wyniki i liczby", "opis": "Mierzalne efekty i dane od klienta, np. „zabieg wykonany 16 maja, 2 dni po zaleceniu; wynik analizy Nmin na kukurydzy …”."}, {"pole": "Plan na kolejny miesiąc", "opis": "Co dalej, np. „ocena przed zbiorem rzepaku, decyzja o desykacji, lustracja kukurydzy na omacnicę”."}, {"pole": "Sprawy otwarte", "opis": "Co czeka na klienta, np. „uzupełnić ewidencję za kwiecień, przesłać faktury za nawozy”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym, który co miesiąc wysyła klientom krótkie raporty z prowadzonego doradztwa. Pomóż mi przygotować raport miesięczny.\n\nDANE:\nKlient i okres: [KLIENT I OKRES]\nWizyty i działania: [WIZYTY I DZIAŁANIA]\nObserwacje z pól: [OBSERWACJE Z PÓL]\nWyniki i liczby: [WYNIKI I LICZBY]\nPlan na kolejny miesiąc: [PLAN NA KOLEJNY MIESIĄC]\nSprawy otwarte: [SPRAWY OTWARTE]\n\nZASADY:\n1. Najpierw sprawdź kompletność danych. Jeśli czegoś istotnego brakuje, zadaj maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Opisuj fakty z moich notatek: daty, pola, fazy BBCH, decyzje. Nie dopisuj obserwacji ani wyników, których nie podałem.\n3. Zabiegi opisuj ogólnie (rodzaj zabiegu, termin, uzasadnienie); nazwy środków i dawki tylko wtedy, gdy je podałem z etykiety.\n4. Nie przypisuj zysków ani wzrostu plonu doradztwu bez danych; jeśli liczysz coś z moich liczb, pokaż obliczenie krok po kroku.\n5. Raport ma być do przeczytania w 3 minuty: krótkie akapity, tabela, jasna lista „co dalej”.\n6. Sprawy po stronie klienta formułuj uprzejmie, ale konkretnie, z terminem.\n7. Nie wymyślaj cen, stawek, kwot, dawek, terminów ani numerów przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], rzeczy niepewne [DO WERYFIKACJI].\n\nFORMAT WYNIKU:\nA) Podsumowanie miesiąca w 3–4 zdaniach.\nB) Tabela wizyt | data | pole | faza BBCH | obserwacja | decyzja |.\nC) Plan na kolejny miesiąc i lista spraw otwartych z terminami.\nD) Krótka wiadomość do wysłania razem z raportem.\nE) Lista luk i założeń.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Skróć raport do jednej strony.", "Dodaj sekcję z najważniejszymi zdjęciami z opisami, które ci podam.", "Przygotuj wersję raportu dla właściciela, który nie lubi tabel.", "Zrób zestawienie wszystkich zaleceń z miesiąca i czy zostały wykonane.", "Dopisz porównanie z tym samym miesiącem poprzedniego sezonu na podstawie moich notatek.", "Przygotuj raport kwartalny z trzech raportów miesięcznych.", "Wypisz rzeczy, które klient powinien dopisać do ewidencji zabiegów.", "Zamień raport na krótką notatkę głosową do odczytania klientowi.", "Dodaj sekcję z ryzykami na kolejny miesiąc.", "Przygotuj szablon raportu, który będę wypełniał co miesiąc."], "checklista": ["Daty wizyt i fazy BBCH zgadzają się z notatkami z pola.", "Każde zalecenie ma informację, czy zostało wykonane i kiedy.", "Nazwy środków i dawki (jeśli są) zgadzają się z etykietą i moim zaleceniem.", "Brak obietnic plonu i niepotwierdzonych wyników.", "Sprawy otwarte mają terminy i wiadomo, kto je robi.", "Raport nie zawiera danych innych klientów."], "uwaga": "Raport z zaleceniami zabiegowymi to dokument współpracy. Dawki i środki podawaj tylko z etykiety; decyzję o zabiegu i jego wykonanie dokumentuje gospodarstwo w ewidencji zabiegów.", "przyklad": {"wejscie": "Kaczmarek, Brodnica, maj. Byłem 5, 14 i 27 maja. 14 maja pszenica na polu Za stodołą w BBCH 37–39, septorioza na dolnych liściach, zaleciłem fungicyd na liść flagowy, zrobili 16 maja. Rzepak 5 maja koniec kwitnienia, potem bez większych problemów. Kukurydza wschody nierówne na Działce 112/3, pewnie zaskorupienie. Korekta planu nawożenia kukurydzy po wyniku Nmin, wynik mam w mailu. W czerwcu ocena rzepaku przed zbiorem, decyzja o desykacji, kukurydza na omacnicę. On ma uzupełnić ewidencję za kwiecień.", "wynik": "RAPORT MIESIĘCZNY — Gospodarstwo Kaczmarek, Brodnica — maj [DO UZUPEŁNIENIA: rok]\n\nPodsumowanie: w maju odbyły się 3 lustracje. Najważniejsza decyzja dotyczyła ochrony liścia flagowego pszenicy na polu Za stodołą — zabieg wykonano 16 maja, dwa dni po zaleceniu. Rzepak przeszedł przez koniec kwitnienia bez większych problemów. W kukurydzy na Działce 112/3 zanotowano nierówne wschody.\n\n| data | pole | faza BBCH | obserwacja | decyzja |\n| 5.05 | rzepak | koniec kwitnienia [DO WERYFIKACJI: dokładna faza] | bez istotnych problemów | obserwacja |\n| 14.05 | Za stodołą, pszenica | 37–39 | septorioza na dolnych liściach | zabieg fungicydowy na liść flagowy, środek zgodnie z etykietą; wykonano 16.05 |\n| 27.05 | Działka 112/3, kukurydza | [DO UZUPEŁNIENIA] | nierówne wschody, prawdopodobnie zaskorupienie [ZAŁOŻENIE] | korekta planu nawożenia po wyniku Nmin |\n\nCo dalej w czerwcu:\n— ocena rzepaku przed zbiorem i decyzja o desykacji,\n— lustracja kukurydzy pod kątem omacnicy prosowianki.\n\nSprawy po Pana stronie:\n— uzupełnienie ewidencji zabiegów za kwiecień — do [DO UZUPEŁNIENIA].\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "4.06", "nazwa": "Organizacja dnia pola / pokazu poletek", "tag": "DZIEŃ POLA", "co_robi": "Planuje dzień pola od A do Z: harmonogram, trasa po poletkach, tabliczki, zaproszenia, lista zadań z terminami i plan na deszcz. Na koniec podsuwa, jak zebrać kontakty i zamienić wydarzenie w nowych klientów.", "kiedy": "Na 4–6 tygodni przed pokazem poletek, gdy trzeba ogarnąć gospodarza, firmy, catering i zaproszenia, a sezon już w pełni.", "brief": [{"pole": "Cel i organizator", "opis": "Po co i kto, np. „dzień pola dla moich klientów i potencjalnych, współorganizuje dystrybutor nawozów”."}, {"pole": "Miejsce i termin", "opis": "Gdzie i kiedy, np. „poletka u pana Zielińskiego w Sompolnie, czerwiec, ok. 10:00–14:00, dojazd z drogi powiatowej”."}, {"pole": "Poletka i warianty", "opis": "Co pokazujecie, np. „6 odmian pszenicy ozimej, 3 warianty nawożenia azotem, poletko kontrolne bez fungicydu”."}, {"pole": "Uczestnicy", "opis": "Ilu i kto, np. „ok. 60 rolników, 3 przedstawicieli firm, ktoś z ODR”."}, {"pole": "Logistyka i budżet", "opis": "Co już masz i ile możesz wydać, np. „namiot, catering, nagłośnienie, toalety — budżet … zł, wpiszę sam”."}, {"pole": "Prowadzący i program", "opis": "Kto mówi i o czym, np. „ja o odmianach, przedstawiciel o nawożeniu, Q&A na końcu”."}], "prompt": "Jesteś doświadczonym polskim agronomem, który wielokrotnie organizował dni pola i pokazy poletek doświadczalnych dla rolników. Pomóż mi zaplanować takie wydarzenie.\n\nDANE:\nCel i organizator: [CEL I ORGANIZATOR]\nMiejsce i termin: [MIEJSCE I TERMIN]\nPoletka i warianty: [POLETKA I WARIANTY]\nUczestnicy: [UCZESTNICY]\nLogistyka i budżet: [LOGISTYKA I BUDŻET]\nProwadzący i program: [PROWADZĄCY I PROGRAM]\n\nZASADY:\n1. Najpierw sprawdź kompletność danych. Jeśli czegoś istotnego brakuje, zadaj maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Harmonogram ułóż realnie: rejestracja, przejście po poletkach w grupach, przerwy, część przy namiocie, czas na rozmowy.\n3. Budżet licz tylko z moich kwot; jeśli pozycja nie ma ceny, wstaw lukę. Sumy pokazuj krok po kroku.\n4. Opisy na tabliczkach poletek mają zawierać tylko dane, które podałem (odmiana, termin siewu, wariant nawożenia). Nie wpisuj dawek ani środków bez potwierdzenia z etykiety.\n5. Uwzględnij bezpieczeństwo: parking, przejścia, wejście na poletka, plan na deszcz i upał.\n6. Zaproponuj sposób zbierania kontaktów uczestników zgodnie z RODO i plan follow-upu.\n7. Nie wymyślaj cen, stawek, kwot, dawek, terminów ani numerów przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], rzeczy niepewne [DO WERYFIKACJI].\n\nFORMAT WYNIKU:\nA) Harmonogram dnia w tabeli | godzina | punkt | kto |.\nB) Lista zadań przygotowawczych z terminami (T-6 tygodni … dzień po).\nC) Szablon tabliczki poletka i tekst zaproszenia (SMS + plakat).\nD) Budżet w tabeli i plan B na złą pogodę.\nE) Lista luk i założeń.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przygotuj tekst zaproszenia na Facebooka i do lokalnej gazety.", "Zrób trasę po poletkach dla trzech grup po 20 osób.", "Napisz krótkie przemówienie powitalne na 2 minuty.", "Przygotuj formularz rejestracji z polem zgody na kontakt.", "Dopisz listę rzeczy do sprawdzenia dzień przed pokazem.", "Zrób ankietę dla uczestników na koniec dnia (5 pytań).", "Przygotuj wiadomość z podziękowaniem i zdjęciami po wydarzeniu.", "Rozpisz podział kosztów między mnie a firmy partnerskie na moich kwotach.", "Przygotuj wersję programu na pół dnia, bez cateringu.", "Napisz e-mail do gospodarza poletek z prośbą o przygotowanie terenu."], "checklista": ["Gospodarz poletek potwierdził termin i dostęp do pola.", "Tabliczki zawierają tylko sprawdzone dane z założenia doświadczenia.", "Jest plan na deszcz i miejsce na parking poza uprawami.", "Budżet opiera się na realnych ofertach, nie na szacunkach.", "Formularz rejestracji ma zgodę na kontakt i informację RODO.", "Każde zadanie ma osobę odpowiedzialną i termin.", "Zaplanowano follow-up do uczestników w ciągu tygodnia."], "uwaga": "Jeśli na pokazie mówi się o środkach ochrony roślin, podawaj tylko informacje zgodne z etykietą i rejestracją. Wynik poletek z jednego sezonu i jednego miejsca to obserwacja, nie rekomendacja dla wszystkich.", "przyklad": {"wejscie": "Robię dzień pola w czerwcu u pana Zielińskiego w Sompolnie, poletka przy drodze powiatowej na Kleczew. Sześć odmian pszenicy ozimej, siane 28 września, trzy warianty nawożenia azotem i jedno poletko bez fungicydu jako kontrola. Spodziewam się 60 rolników, dwie firmy, ktoś z ODR. Współorganizuje dystrybutor nawozów, on daje namiot i catering. Ja mówię o odmianach, ich przedstawiciel o nawożeniu, pytania na końcu. Start koło 10, koniec 14. Budżet na moją część podam później.", "wynik": "HARMONOGRAM DNIA POLA — Sompolno, czerwiec [DO UZUPEŁNIENIA: data]\n\n| godzina | punkt | kto |\n| 9:30–10:00 | rejestracja, kawa, identyfikatory | [DO UZUPEŁNIENIA] |\n| 10:00–10:10 | powitanie, plan dnia, zasady wejścia na poletka | ja + gospodarz |\n| 10:10–11:10 | grupa A: odmiany pszenicy (6 poletek) | ja |\n| 10:10–11:10 | grupa B: warianty nawożenia azotem | przedstawiciel dystrybutora |\n| 11:10–12:10 | zmiana grup | — |\n| 12:10–12:30 | poletko kontrolne bez fungicydu — porównanie | ja |\n| 12:30–13:30 | obiad, rozmowy przy namiocie | dystrybutor |\n| 13:30–14:00 | pytania i odpowiedzi, zaproszenie na rozmowy indywidualne | wszyscy |\n\nTABLICZKA POLETKA — wzór\nOdmiana: [DO UZUPEŁNIENIA] · Siew: 28 września · Wariant nawożenia N: [DO UZUPEŁNIENIA] · Ochrona fungicydowa: tak/nie\n\nPlan B — deszcz: część przy namiocie przedłużona, przejście po poletkach skrócone do 3 reprezentatywnych [ZAŁOŻENIE: namiot mieści 60 osób — DO WERYFIKACJI z dystrybutorem].\n\nT-4 tygodnie: potwierdzić z gospodarzem koszenie poboczy i miejsce na parking poza uprawą.\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "4.07", "nazwa": "Trudna rozmowa: reklamacja, nieudany zabieg, zaległa płatność", "tag": "TRUDNA ROZMOWA", "co_robi": "Przygotowuje Cię do trudnej rozmowy z rolnikiem: scenariusz, gotowe zdania na najostrzejsze momenty, propozycje rozwiązań i pisemne podsumowanie po rozmowie. Pomaga trzymać się faktów i nie przyznawać do winy, zanim sprawa zostanie wyjaśniona.", "kiedy": "Gdy rolnik dzwoni wściekły, że „po Pana zaleceniu nic nie zadziałało”, albo trzecia faktura wisi niezapłacona, a trzeba z nim dalej pracować.", "brief": [{"pole": "Rodzaj sytuacji", "opis": "Reklamacja, nieudany zabieg czy zaległa płatność, np. „rolnik twierdzi, że po moim zaleceniu herbicyd nie zadziałał na miotłę w pszenicy”."}, {"pole": "Fakty i daty", "opis": "Co się wydarzyło po kolei, np. „zalecenie 12.10 e-mailem, oprysk 19.10, potem przymrozek; lustracja 6.11 — miotła przeżyła na 2 polach z 5”."}, {"pole": "Stanowisko klienta", "opis": "Co mówi i jak, np. „jest zdenerwowany, chce, żebym pokrył koszt poprawki, grozi, że odejdzie”."}, {"pole": "Moje stanowisko", "opis": "Co uważasz i na co masz dowody, np. „termin oprysku inny niż zalecony, wiadomość z zaleceniem mam; poprawka możliwa wiosną”."}, {"pole": "Relacja i stawka", "opis": "Ile znaczy klient, np. „klient od 4 lat, 300 ha, polecił mi dwóch sąsiadów”."}, {"pole": "Cel rozmowy", "opis": "Co chcesz osiągnąć, np. „zachować klienta, nie przyznawać się do winy bez dowodu, ustalić plan naprawy”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym i agronomem handlowym, który przeprowadził wiele trudnych rozmów z rolnikami i potrafi zachować klienta bez brania na siebie cudzej winy. Pomóż mi przygotować się do rozmowy.\n\nDANE:\nRodzaj sytuacji: [RODZAJ SYTUACJI]\nFakty i daty: [FAKTY I DATY]\nStanowisko klienta: [STANOWISKO KLIENTA]\nMoje stanowisko i dowody: [MOJE STANOWISKO]\nRelacja i stawka: [RELACJA I STAWKA]\nCel rozmowy: [CEL ROZMOWY]\n\nZASADY:\n1. Najpierw sprawdź kompletność danych. Jeśli czegoś istotnego brakuje, zadaj maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Oddziel fakty od przypuszczeń. Przy przyczynach nieudanego zabiegu (pogoda, termin, faza, odporność, jakość wody, technika oprysku) wypisz hipotezy do sprawdzenia, a nie wyroki.\n3. Nie przyznawaj się w moim imieniu do winy i nie obiecuj rekompensaty, której nie zaproponowałem.\n4. Nie wypowiadaj się o skuteczności konkretnego środka ani o możliwości reklamacji u producenta bez etykiety i dokumentów; oznacz to [DO WERYFIKACJI].\n5. Przy zaległej płatności używaj kwot i terminów tylko z moich danych; nie strasz konsekwencjami prawnymi.\n6. Ton: spokojny, z szacunkiem, konkretny. Daj mi zdania, które mogę powiedzieć dosłownie.\n7. Nie wymyślaj cen, stawek, kwot, dawek, terminów ani numerów przepisów. Brakujące dane oznacz [DO UZUPEŁNIENIA], przyjęte założenia [ZAŁOŻENIE], rzeczy niepewne [DO WERYFIKACJI].\n\nFORMAT WYNIKU:\nA) Scenariusz rozmowy: otwarcie, wysłuchanie, fakty, propozycja, zamknięcie.\nB) 5–7 gotowych odpowiedzi na najtrudniejsze zdania klienta.\nC) 2–3 warianty rozwiązania z plusami i minusami.\nD) Pisemne podsumowanie rozmowy do wysłania po spotkaniu.\nE) Lista luk i rzeczy do sprawdzenia.\n\nNa końcu dodaj notę: „Wynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie.”", "polecenia": ["Przygotuj wersję tej rozmowy przez telefon, w 5 minut.", "Napisz uprzejme przypomnienie o zaległej płatności z kwotą, którą podam.", "Zrób listę dokumentów, które powinienem zebrać przed rozmową.", "Napisz drugie przypomnienie o płatności, stanowcze, ale bez gróźb.", "Przygotuj odpowiedź na zdanie „inny doradca by to przewidział”.", "Napisz e-mail podsumowujący ustalenia z rozmowy.", "Wypisz możliwe przyczyny nieskuteczności zabiegu jako listę do sprawdzenia w polu.", "Przygotuj propozycję planu naprawczego na wiosnę bez podawania dawek.", "Zrób wersję rozmowy, gdy jednak to ja popełniłem błąd w zaleceniu.", "Przygotuj wiadomość kończącą współpracę z klientem, który nie płaci, z zachowaniem dobrej relacji."], "checklista": ["Mam przed sobą zalecenie na piśmie, daty i ewidencję zabiegu klienta.", "Hipotezy przyczyn są opisane jako do sprawdzenia, nie jako fakty.", "Nie obiecuję rekompensaty bez przemyślenia jej kosztu.", "Kwoty i terminy płatności zgadzają się z fakturami.", "Ustalenia z rozmowy zostaną potwierdzone na piśmie.", "Przy poważnym sporze rozważę konsultację z prawnikiem lub ubezpieczycielem OC."], "uwaga": "Przy sporze o skutki zabiegu ochrony roślin nie przesądzaj przyczyny bez dokumentów (zalecenie, ewidencja zabiegów, etykieta, warunki pogodowe). Przy dużej szkodzie skontaktuj się z prawnikiem lub ubezpieczycielem, zanim cokolwiek obiecasz na piśmie.", "przyklad": {"wejscie": "Pan Stefan z Gniewkowa, 300 ha, klient od 4 lat. Jesienią zaleciłem herbicyd na miotłę w pszenicy, e-mail 12 października, zalecałem zrobić do 15. On pryskał 19, potem przyszedł przymrozek. Na lustracji 6 listopada na dwóch polach z pięciu miotła przeżyła. Dzwonił wkurzony, że płaci mi za zalecenia, które nie działają, i chce, żebym pokrył wiosenną poprawkę. Polecił mnie dwóm sąsiadom. Chcę go zatrzymać, ale nie brać winy, bo termin był inny.", "wynik": "SCENARIUSZ ROZMOWY — p. Stefan, Gniewkowo\n\n1. Otwarcie\n„Panie Stefanie, dobrze, że Pan zadzwonił. Rozumiem, że to zdenerwowało — ja też nie lubię widzieć miotły po zabiegu. Chcę to razem rozebrać i ustalić, co robimy wiosną.”\n\n2. Fakty (spokojnie, bez oskarżeń)\n„Zalecenie wysłałem 12 października z terminem do 15. Z tego, co Pan mówił, oprysk poszedł 19, a potem złapał przymrozek. Na trzech polach zabieg zadziałał, na dwóch nie. Chcę sprawdzić, czym te dwa pola się różnią.”\n\nHipotezy do sprawdzenia [DO WERYFIKACJI]: faza miotły w dniu oprysku, temperatura przed i po zabiegu, warunki z etykiety środka, możliwa odporność populacji, jakość wody i technika oprysku.\n\n3. Najtrudniejsze zdania\nKlient: „Płacę Panu za zalecenia, które nie działają.”\nTy: „Płaci Pan za to, żebym był przy Pana polach — i jestem. Na trzech polach zadziałało. Na dwóch muszę zrozumieć, co się stało, zanim powiem cokolwiek więcej.”\n\nKlient: „To Pan pokryje poprawkę.”\nTy: „Nie chcę teraz obiecywać czegoś na gorąco. Proponuję: przygotuję plan wiosenny dla tych dwóch pól w ramach umowy, bez dodatkowej opłaty za wizyty [ZAŁOŻENIE: to moja propozycja — do decyzji].”\n\nWynik to szkic do weryfikacji — podpis i odpowiedzialność zostają po Twojej stronie."}}, {"id": "4.08", "nazwa": "Szkolenie / prezentacja dla rolników", "tag": "SZKOLENIE", "co_robi": "Układa scenariusz szkolenia minuta po minucie i treść slajdów (tytuł, 3–4 punkty, co pokazać na zdjęciu), z ćwiczeniami i pytaniami do sali. Merytorykę opiera na Twoich źródłach, a liczby zostawia do uzupełnienia z metodyk i etykiet.", "kiedy": "Gdy ODR, kółko rolnicze albo dystrybutor zaprasza Cię na szkolenie zimowe, a do terminu został tydzień.", "brief": [{"pole": "Temat szkolenia", "opis": "O czym, np. „integrowana ochrona roślin w praktyce: lustracja, progi, ewidencja zabiegów”."}, {"pole": "Odbiorcy", "opis": "Kto słucha, np. „30 rolników z koła gospodyń i kółka rolniczego, gospodarstwa 20–80 ha, różne doświadczenie”."}, {"pole": "Czas i forma", "opis": "Ile i gdzie, np. „90 minut w remizie OSP, rzutnik, bez internetu”."}, {"pole": "Kluczowe przesłanie", "opis": "Co mają zapamiętać, np. „decyzja o zabiegu po lustracji, nie z kalendarza; ewidencja to obowiązek, nie formalność”."}, {"pole": "Materiały źródłowe", "opis": "Na czym się opierasz, np. „moje zdjęcia z lustracji, metodyki IOR-PIB, etykiety środków, przykład ewidencji”."}, {"pole": "Cel biznesowy", "opis": "Co chcesz osiągnąć, np. „pozyskać 3–5 nowych klientów na pakiet lustracji”."}], "prompt": "Jesteś doświadczonym polskim doradcą rolniczym i szkoleniowcem, który prowadzi spotkania dla rolników w ODR, kółkach rolniczych i u dystrybutorów. Pomóż mi przygotować szkolenie.\n\nDANE:\nTemat szkolenia: [TEMAT SZKOLENIA]\nOdbiorcy: [ODBIORCY]\nCzas i forma: [CZAS I FORMA]\nKluczowe przesłanie: [KLUCZOWE PRZESŁANIE]\nMateriały źródłowe: [MATERIAŁY ŹRÓDŁOWE]\nCel biznesowy: [CEL BIZNESOWY]\n\nZASADY:\n1. Najpierw sprawdź kompletność danych. Jeśli czegoś istotnego brakuje, zadaj maksymalnie 5–7 krótkich pytań i poczekaj na odpowiedź.\n2. Mów językiem praktyka z pola, z przykładami z gospodarstw. Jeden slajd = jedna myśl, maks. 4 punkty po kilka słów.\n3. Progi szkodliwości, dawki, terminy i wymogi prawne podawaj tylko z materiałów, które wskażę. W pozostałych miejscach wstaw lukę z odesłaniem do metodyki
