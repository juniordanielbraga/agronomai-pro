is lotes.", "Agrega una sección con lo que haría distinto la próxima campaña.", "Convierte la ficha en una tabla para pegar en una planilla de cálculo.", "Resume la historia del lote en cinco líneas para el plan de campaña."], "checklista": ["Las campañas y fechas están en orden.", "Los valores del análisis de suelo coinciden con el informe del laboratorio.", "Los rindes coinciden con los datos del productor o del monitor.", "Las aplicaciones tienen fecha y lote, y la dosis viene del registro o de la etiqueta.", "Los aprendizajes están marcados como interpretación.", "Los huecos están marcados [A COMPLETAR]."], "uwaga": "La ficha es tan buena como los registros que cargues. Guarda el registro de aplicaciones y los análisis originales; la ficha los resume, no los reemplaza.", "przyklad": {"wejscie": "Ficha del Potrero del Molino, de Martín Ortiz, General Villegas, setenta hectáreas, franco arenoso con bajos. Esta campaña 2025/26 maíz tardío. La anterior soja de primera, y antes trigo con soja de segunda. Análisis de agosto: materia orgánica 2,1 por ciento, pH 6,3, fósforo Bray 11 ppm, nitratos de 0 a 60 centímetros 48 kilos por hectárea. En las recorridas vi cogollero en V6 y un manchón de sorgo de Alepo cerca del molino; en diciembre los bajos estuvieron encharcados. Barbecho químico en agosto, fertilizaron a la siembra y en V6, tengo las dosis en el cuaderno de Martín. El monitor dio 92 quintales por hectárea, el bajo rindió menos.", "wynik": "A) DATOS DEL LOTE\nPotrero del Molino | Martín Ortiz | General Villegas | 70 ha | Franco arenoso con bajos\n\nB) ROTACIÓN\n| Campaña | Cultivo | Antecesor | Rinde |\n| 2025/26 | maíz tardío | soja de primera | 92 qq/ha (monitor) |\n| [A COMPLETAR] | soja de primera | trigo y soja de segunda | [A COMPLETAR] |\n| [A COMPLETAR] | trigo y soja de segunda | [A COMPLETAR] | [A COMPLETAR] |\n\nC) ANÁLISIS DE SUELO\n| Fecha | MO | pH | P Bray | N-nitratos 0–60 cm |\n| agosto 2025 [VERIFICAR año] | 2,1 % | 6,3 | 11 ppm | 48 kg/ha |\n\nD) REGISTROS 2025/26\n| Fecha | Tipo | Detalle |\n| agosto | barbecho químico | producto y dosis [A COMPLETAR: cuaderno del productor] |\n| siembra | fertilización | fuente y dosis [A COMPLETAR] |\n| V6 | fertilización | fuente y dosis [A COMPLETAR] |\n| V6 | recorrida | cogollero; decisión tomada [A COMPLETAR] |\n| — | recorrida | manchón de sorgo de Alepo cerca del molino |\n| diciembre | recorrida | bajos encharcados |\n\nE) APRENDIZAJES (interpretación)\n- El bajo rinde menos: conviene medirlo aparte con el mapa de rinde [VERIFICAR].\n- El sorgo de Alepo es un foco fijo: planificar su control en la próxima campaña.\n- P Bray de 11 ppm: revisar con tu tabla de interpretación local [A COMPLETAR: rango de referencia].\nPreguntas abiertas: rinde del bajo frente a la loma; fecha de siembra del maíz [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}]}, {"dzial_nr": 2, "dzial": "Planificación productiva y nutrición", "opis": "Planes de nitrógeno, encalado, análisis de suelo, balances de nutrientes, rotaciones, siembra y elección de semilla: cada campaña arranca con números y papeles. Cargas tus análisis, las recomendaciones de tu centro de investigación local y los datos de ensayos, y recibes un plan listo con las cuentas paso a paso, sin nada inventado y con todo lo que hay que revisar bien marcado.", "skills": [{"id": "2.01", "nazwa": "Plan de nitrógeno por lote (4C)", "tag": "PLAN DE NITRÓGENO", "co_robi": "Arma el plan de nitrógeno de cada lote con las 4C (fuente, dosis, momento y lugar correctos), usando tu análisis de suelo, tu rinde objetivo y el modelo de recomendación local que tú eliges. Las cuentas quedan a la vista y nada sale inventado.", "kiedy": "Antes de la siembra de maíz, trigo o sorgo, cuando hay que cerrar la compra de fertilizante y el productor quiere saber cuánto y cuándo.", "brief": [{"pole": "Productor y lotes", "opis": "Productor, lotes y hectáreas, por ejemplo “Agropecuaria Don Ernesto, Pergamino — Lote 4 (120 ha) y Lote 9 (80 ha)”."}, {"pole": "Cultivo y rinde objetivo", "opis": "Cultivo, fecha de siembra y rinde objetivo, por ejemplo “maíz temprano, rinde objetivo 100 qq/ha en Lote 4 y 85 qq/ha en Lote 9”."}, {"pole": "Recomendación local de N", "opis": "El modelo o guía que usas, con su fuente, por ejemplo “umbral de N disponible a la siembra de la guía regional del INTA que uso”."}, {"pole": "Aportes y análisis de suelo", "opis": "Análisis y aportes, por ejemplo “N-nitratos 0–60 cm: 52 kg/ha en Lote 4 y 38 kg/ha en Lote 9; antecesor soja”."}, {"pole": "Fuentes y momentos de N", "opis": "Fuentes disponibles y momentos posibles, por ejemplo “urea y UAN, a la siembra y en V6 con la pulverizadora”."}, {"pole": "Requisitos del plan", "opis": "Qué debe cumplir, por ejemplo “presupuesto acotado, presentar al productor en una página”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que arma planes de fertilización nitrogenada con el criterio de las 4C (fuente, dosis, momento y lugar correctos). Prepara el plan de nitrógeno por lote con mis datos.\n\nDATOS:\nProductor y lotes: [PRODUCTOR Y LOTES]\nCultivo y rinde objetivo: [CULTIVO Y RINDE OBJETIVO]\nRecomendación local de N: [RECOMENDACIÓN LOCAL DE N]\nAportes y análisis de suelo: [APORTES Y ANÁLISIS DE SUELO]\nFuentes y momentos de N: [FUENTES Y MOMENTOS DE N]\nRequisitos del plan: [REQUISITOS DEL PLAN]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo el modelo de recomendación que yo te dé (umbral de N a la siembra, balance, curva de respuesta) y cita su fuente. Si no lo di, escribe [A COMPLETAR: modelo de recomendación y fuente]. Nunca pongas un umbral, un coeficiente ni una dosis propia.\n4. Descuenta los aportes que yo informe (N del suelo, antecesor, efluentes) solo con los valores que te di; si falta alguno, márcalo [A COMPLETAR].\n5. Convierte kg de N/ha a kg de producto/ha usando la concentración de cada fuente que yo te confirme [VERIFICAR].\n6. Propón momento y lugar según los equipos y las fuentes disponibles, y señala los riesgos de pérdidas (volatilización, lavado) sin cuantificarlos si no tengo el dato.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Resumen por lote: cultivo, rinde objetivo, N necesario, N disponible y N a aplicar.\nB) Cálculos paso a paso con la fuente de cada número.\nC) Plan 4C: fuente | dosis de producto | momento | forma de aplicación, por lote.\nD) Cantidades totales de cada fertilizante para la compra.\nE) Supuestos, riesgos y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Calcula la cantidad total de urea y UAN para comprar.", "Arma un escenario con el rinde objetivo 10 % más bajo.", "Haz la versión de una página para el productor.", "Agrega el costo por hectárea con los precios que te paso.", "Divide la dosis entre siembra y V6 y muestra cuánto va en cada momento.", "Prepara la orden de trabajo para el aplicador de UAN.", "Compara el plan con el que se hizo en este lote la campaña pasada.", "Agrega una tabla de seguimiento para registrar lo aplicado.", "Explícame en lenguaje simple por qué cada lote lleva distinta dosis.", "Arma la lista de análisis que convendría hacer antes de la refertilización."], "checklista": ["El modelo de recomendación y su fuente son los tuyos.", "El N del análisis de suelo es el del informe del laboratorio.", "Las concentraciones de cada fertilizante son las del proveedor.", "Las conversiones de kg de N a kg de producto están bien hechas.", "Los momentos son posibles con los equipos del campo.", "Los totales para la compra coinciden con la suma por lote."], "uwaga": "Este plan no reemplaza la recomendación de tu centro de investigación local (INTA, INIFAP, INIA u otro) ni tu criterio. El modelo, los umbrales y las dosis finales los defines tú.", "przyklad": {"wejscie": "Plan de nitrógeno para Don Ernesto, Pergamino. Lote 4, 120 hectáreas, y Lote 9, 80 hectáreas, maíz temprano, los dos con antecesor soja. Rinde objetivo: 100 quintales en el 4 y 85 en el 9. Nitratos de 0 a 60 centímetros: 52 kilos de N por hectárea en el 4 y 38 en el 9. Uso el modelo de umbral de N a la siembra: el umbral que tomo de la guía regional es 150 kilos de N por hectárea para 100 quintales y 130 para 85. Tenemos urea al 46 por ciento y UAN al 32. Quiero aplicar parte a la siembra y parte en V6 con la pulverizadora. Presupuesto acotado, presentarlo en una página.", "wynik": "A) RESUMEN POR LOTE\n| Lote | ha | Rinde obj. | Umbral N (tu guía) | N suelo | N a aplicar |\n| 4 | 120 | 100 qq/ha | 150 kg/ha | 52 kg/ha | 98 kg/ha |\n| 9 | 80 | 85 qq/ha | 130 kg/ha | 38 kg/ha | 92 kg/ha |\n\nB) CÁLCULOS\nLote 4: 150 − 52 = 98 kg N/ha. Lote 9: 130 − 38 = 92 kg N/ha.\nFuente del umbral: guía regional que indicaste [VERIFICAR: nombre y año de la publicación].\nAporte extra del antecesor soja: no descontado [SUPUESTO]; si tu guía lo contempla, ajústalo.\n\nC) PLAN 4C (reparto propuesto 50/50 [SUPUESTO])\n| Lote | Siembra | V6 |\n| 4 | 49 kg N = 49 ÷ 0,46 = 106,5 kg urea/ha | 49 kg N = 49 ÷ 0,32 = 153,1 kg UAN/ha |\n| 9 | 46 kg N = 100,0 kg urea/ha | 46 kg N = 143,8 kg UAN/ha |\nLugar: urea incorporada o al costado de la línea; UAN chorreado entre hileras para reducir volatilización [VERIFICAR con tus equipos].\n\nD) COMPRA\nUrea: 106,5 × 120 + 100,0 × 80 = 12.780 + 8.000 = 20.780 kg.\nUAN: 153,1 × 120 + 143,8 × 80 = 18.372 + 11.504 = 29.876 kg (densidad para pasar a litros [A COMPLETAR]).\n\nE) PENDIENTES: precios para el costo por hectárea [A COMPLETAR]; confirmar concentraciones con el proveedor [VERIFICAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "2.02", "nazwa": "Recomendación de encalado según análisis", "tag": "ENCALADO", "co_robi": "Calcula la necesidad de enmienda calcárea de cada lote con tu análisis y el criterio de tu laboratorio o guía local, y la convierte en toneladas de producto según su calidad. Ordena también el momento y la logística.", "kiedy": "Cuando llegan los análisis con pH bajo o aluminio alto y hay que decidir si encalar, cuánto y cuándo antes de la siembra.", "brief": [{"pole": "Productor y lotes", "opis": "Productor, lotes y hectáreas, por ejemplo “Hnos. Benítez, Alto Paraná — Lote 3 (90 ha) y Lote 5 (60 ha)”."}, {"pole": "Resultados del análisis", "opis": "Lo del laboratorio, por ejemplo “Lote 3: pH 4,9, Al 0,8 cmol/kg, Ca 3,1 cmol/kg, CIC 9; Lote 5: pH 5,4, Al 0,2”."}, {"pole": "Criterio de necesidad de cal", "opis": "El método que usas y su fuente, por ejemplo “necesidad de cal por saturación de bases según la recomendación del laboratorio”."}, {"pole": "Fuente y calidad de la enmienda", "opis": "Producto y calidad, por ejemplo “calcáreo dolomítico, PRNT 85 % según el proveedor”."}, {"pole": "Cultivos y momentos", "opis": "Lo que se siembra y cuándo, por ejemplo “soja en octubre, se puede aplicar en junio y julio”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que corrige acidez de suelos con enmiendas calcáreas. Calcula la recomendación de encalado por lote con mis datos.\n\nDATOS:\nProductor y lotes: [PRODUCTOR Y LOTES]\nResultados del análisis: [RESULTADOS DEL ANÁLISIS]\nCriterio de necesidad de cal: [CRITERIO DE NECESIDAD DE CAL]\nFuente y calidad de la enmienda: [FUENTE Y CALIDAD DE LA ENMIENDA]\nCultivos y momentos: [CULTIVOS Y MOMENTOS]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo el criterio de necesidad de cal que yo te dé (saturación de bases, neutralización de aluminio, pH objetivo, tabla del laboratorio) y cita su fuente. Si no lo di, escribe [A COMPLETAR: criterio y fuente].\n4. Ajusta la dosis por la calidad del producto (PRNT o poder neutralizante) que yo informe; si falta, márcalo [A COMPLETAR].\n5. Señala si conviene repartir la dosis en más de un año, como opción a discutir y no como regla.\n6. Recuerda el tiempo de reacción de la enmienda y la profundidad de incorporación como puntos a confirmar con tu guía local [VERIFICAR].\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Resumen por lote: pH, aluminio, criterio usado y necesidad de enmienda.\nB) Cálculos paso a paso de t/ha de producto.\nC) Toneladas totales, momento de aplicación y logística.\nD) Opciones (dosis completa o repartida) con pros y contras.\nE) Supuestos y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Calcula cuántos camiones de enmienda necesito.", "Compara calcáreo dolomítico y calcítico con los precios que te paso.", "Haz un plan de encalado repartido en dos años.", "Prepara la explicación para el productor en lenguaje simple.", "Agrega cuándo repetir el análisis para ver el efecto.", "Arma la orden de trabajo para el contratista de la encaladora.", "Calcula el costo por hectárea con flete incluido.", "Agrega qué mirar en el cultivo para ver la respuesta al encalado.", "Prioriza los lotes si el presupuesto alcanza solo para uno.", "Resume la recomendación para la ficha histórica de cada lote."], "checklista": ["El criterio de cálculo viene de tu laboratorio o guía.", "Los valores de pH, aluminio y CIC son los del informe.", "La calidad (PRNT) del producto es la del proveedor.", "Las toneladas totales coinciden con la suma por lote.", "El momento deja tiempo de reacción antes de la siembra.", "Los supuestos están marcados."], "uwaga": "La necesidad de cal depende del método de cálculo y del suelo. Usa el criterio de tu laboratorio o de tu centro de investigación local y confirma la calidad del producto con el proveedor antes de comprar.", "przyklad": {"wejscie": "Hermanos Benítez, Alto Paraná. Lote 3, noventa hectáreas: pH 4,9, aluminio 0,8 cmol por kilo, calcio 3,1, CIC 9. Lote 5, sesenta hectáreas: pH 5,4, aluminio 0,2. El laboratorio calcula la necesidad de cal por saturación de bases y en el informe dice 2,4 toneladas por hectárea de calcáreo con PRNT 100 para el Lote 3 y 1,1 para el Lote 5. El proveedor tiene dolomítico con PRNT 85 por ciento. Van a sembrar soja en octubre y se puede aplicar en junio o julio. Calcúlame cuánto comprar.", "wynik": "A) RESUMEN\n| Lote | ha | pH | Al | Criterio | Necesidad (PRNT 100) |\n| 3 | 90 | 4,9 | 0,8 cmol/kg | saturación de bases (laboratorio) | 2,4 t/ha |\n| 5 | 60 | 5,4 | 0,2 cmol/kg | saturación de bases (laboratorio) | 1,1 t/ha |\n\nB) CÁLCULOS (ajuste por PRNT 85 %)\nLote 3: 2,4 ÷ 0,85 = 2,82 t/ha de dolomítico.\nLote 5: 1,1 ÷ 0,85 = 1,29 t/ha de dolomítico.\n\nC) TOTALES Y LOGÍSTICA\nLote 3: 2,82 × 90 = 253,8 t. Lote 5: 1,29 × 60 = 77,4 t. Total: 331,2 t.\nCamiones: según capacidad [A COMPLETAR: t por camión].\nMomento: junio, para dejar el mayor tiempo de reacción antes de la siembra de octubre; tiempo de reacción del producto [VERIFICAR con tu guía local].\nIncorporación: según el sistema (siembra directa o labranza) [A COMPLETAR].\n\nD) OPCIONES\n- Dosis completa en el Lote 3 este año: corrige antes, más gasto inicial.\n- Repartir el Lote 3 en dos años: menos gasto ahora, corrección más lenta [SUPUESTO]; discutirlo con el productor.\n\nE) PENDIENTES: precio por tonelada y flete [A COMPLETAR]; confirmar PRNT con análisis del producto [VERIFICAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "2.03", "nazwa": "Interpretación del análisis de suelo para el productor", "tag": "ANÁLISIS DE SUELO", "co_robi": "Traduce el informe del laboratorio a algo que el productor entiende: qué está bien, qué está bajo, qué significa para los cultivos que vienen y qué decisiones abre. Usa tus rangos de interpretación, no unos genéricos.", "kiedy": "Cuando llegan los análisis y el productor te pregunta «¿y esto qué quiere decir?» antes de planificar la fertilización.", "brief": [{"pole": "Productor y lotes", "opis": "Productor y lotes, por ejemplo “Lucía Ramírez, Paysandú — Lote 2 y La Loma”."}, {"pole": "Resultados del laboratorio", "opis": "Los valores, por ejemplo “Lote 2: MO 3,4 %, pH 5,8, P Bray 9 ppm, K 0,6 cmol/kg, S-sulfatos 7 ppm, CIC 18”."}, {"pole": "Rangos de interpretación", "opis": "La tabla que usas y su fuente, por ejemplo “rangos de suficiencia del laboratorio para P y K; para S uso la guía del INIA”."}, {"pole": "Cultivos previstos", "opis": "Lo que viene, por ejemplo “soja de primera en Lote 2, trigo y soja de segunda en La Loma”."}, {"pole": "Público", "opis": "Quién lo lee, por ejemplo “la productora, que no es agrónoma, y su hijo que maneja la planilla de costos”."}, {"pole": "Preguntas del productor", "opis": "Lo que preguntó, por ejemplo “¿hace falta fósforo este año o puedo saltearlo?”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que explica análisis de suelo a productores sin perder rigor. Interpreta este análisis para el productor.\n\nDATOS:\nProductor y lotes: [PRODUCTOR Y LOTES]\nResultados del laboratorio: [RESULTADOS DEL LABORATORIO]\nRangos de interpretación: [RANGOS DE INTERPRETACIÓN]\nCultivos previstos: [CULTIVOS PREVISTOS]\nPúblico: [PÚBLICO]\nPreguntas del productor: [PREGUNTAS DEL PRODUCTOR]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Interpreta cada valor solo con los rangos que yo te dé y cita su fuente. Si un nutriente no tiene rango, escribe [A COMPLETAR: rango y fuente] y no lo califiques.\n4. Explica qué significa cada valor para los cultivos previstos en lenguaje simple, sin recomendar dosis: las dosis van en el plan de fertilización.\n5. Señala valores que parecen raros o inconsistentes (por ejemplo, saltos grandes frente a análisis anteriores) y márcalos [VERIFICAR].\n6. Responde las preguntas del productor con lo que permiten los datos y di qué falta para contestarlas del todo.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Tabla: parámetro | valor | rango de referencia (fuente) | lectura (bajo, medio, alto).\nB) Qué significa para cada cultivo previsto.\nC) Respuestas a las preguntas del productor.\nD) Decisiones que abre el análisis y próximos pasos.\nE) Valores dudosos y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Haz una versión de media página para el productor.", "Agrega una comparación con el análisis anterior del mismo lote.", "Prepara un gráfico simple en texto de semáforo por nutriente.", "Explica qué es la CIC y por qué importa, en tres líneas.", "Arma la lista de preguntas que le haría al laboratorio.", "Redacta un audio de WhatsApp de un minuto explicando el resultado.", "Indica qué análisis convendría agregar la próxima vez.", "Separa lo que hay que decidir este año y lo que puede esperar.", "Prepara la base para el plan de fertilización de cada lote.", "Resume el análisis para la ficha histórica del lote."], "checklista": ["Los valores coinciden con el informe del laboratorio.", "Cada rango de referencia tiene su fuente.", "Las unidades son las del laboratorio (ppm, cmol/kg, %).", "No aparecen dosis de fertilización en la interpretación.", "Los valores raros están marcados para revisar.", "El lenguaje es claro para quien lo va a leer."], "uwaga": "Los rangos de interpretación cambian según el método del laboratorio y la región. Usa la tabla de tu laboratorio o de tu centro de investigación local; la IA no debe calificar un valor sin esa referencia.", "przyklad": {"wejscie": "Necesito explicarle a Lucía Ramírez, de Paysandú, los análisis. Lote 2: materia orgánica 3,4 por ciento, pH 5,8, fósforo Bray 9 ppm, potasio 0,6 cmol por kilo, sulfatos 7 ppm, CIC 18. Para fósforo y potasio uso los rangos de suficiencia del laboratorio, que dicen que para soja el fósforo es bajo por debajo de 12 ppm y el potasio es suficiente arriba de 0,4. Para azufre no tengo rango a mano. Viene soja de primera. Lucía no es agrónoma, el hijo maneja los costos. Ella me preguntó si hace falta fósforo este año o lo puede saltear.", "wynik": "A) LOTE 2\n| Parámetro | Valor | Referencia (fuente) | Lectura |\n| MO | 3,4 % | [A COMPLETAR: rango y fuente] | sin calificar |\n| pH | 5,8 | [A COMPLETAR: rango y fuente] | sin calificar |\n| P Bray | 9 ppm | bajo si <12 ppm para soja (laboratorio) | bajo |\n| K | 0,6 cmol/kg | suficiente si >0,4 (laboratorio) | suficiente |\n| S-sulfatos | 7 ppm | [A COMPLETAR: rango y fuente] | sin calificar |\n| CIC | 18 | — | dato de contexto |\n\nB) QUÉ SIGNIFICA PARA LA SOJA\n- Fósforo: está por debajo del nivel que el laboratorio considera suficiente (9 frente a 12 ppm). Es el nutriente que más probablemente limite el rinde este año.\n- Potasio: alcanza según la referencia del laboratorio; no es prioridad.\n- Azufre: no se puede opinar sin rango de referencia.\n\nC) ¿HACE FALTA FÓSFORO ESTE AÑO?\nCon un P Bray bajo según tu propio laboratorio, saltearlo tiene riesgo de perder rinde [SUPUESTO]. Cuánto aplicar va en el plan de fertilización, con la recomendación local [A COMPLETAR: criterio de dosis y fuente].\n\nD) DECISIONES\n- Incluir fósforo en el plan de la soja; dosis a definir.\n- Conseguir el rango de azufre para decidir si se agrega.\n\nE) PENDIENTES: análisis anterior para comparar [A COMPLETAR]; La Loma sin datos [A COMPLETAR].\n\nPARA LUCÍA: “El análisis muestra poco fósforo para la soja; conviene ponerlo este año. El resto está bien o falta información para decirlo.”\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "2.04", "nazwa": "Balance de nutrientes y extracción", "tag": "BALANCE DE NUTRIENTES", "co_robi": "Calcula cuánto nitrógeno, fósforo, potasio y azufre entró y salió de cada lote con tus rindes, tus aplicaciones y los coeficientes de extracción que tú eliges. Muestra qué lotes se están empobreciendo.", "kiedy": "Al cierre de la campaña o antes de planificar la siguiente, cuando el productor quiere saber si está «sacando más de lo que pone».", "brief": [{"pole": "Productor y hectáreas", "opis": "Productor, lotes y superficie, por ejemplo “Jorge Ferreyra, Venado Tuerto — 4 lotes, 380 ha”."}, {"pole": "Período del balance", "opis": "Campañas que cubre, por ejemplo “últimas tres campañas, de 2023/24 a 2025/26”."}, {"pole": "Aportes de nutrientes", "opis": "Lo aplicado, por ejemplo “fosfato monoamónico a la siembra de maíz y trigo, urea en maíz, nada en soja”."}, {"pole": "Coeficientes de extracción", "opis": "Los valores que usas y su fuente, por ejemplo “kg de nutriente por tonelada de grano según la tabla de extracción del INTA que uso”."}, {"pole": "Rindes cosechados", "opis": "Rinde por lote y campaña, por ejemplo “Lote 1: maíz 95 qq/ha, soja 38 qq/ha, trigo 42 qq/ha”."}, {"pole": "Objetivo del balance", "opis": "Para qué lo quieres, por ejemplo “mostrarle al productor por qué el P Bray viene bajando”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que calcula balances de nutrientes por lote. Arma el balance de entradas y salidas con mis datos.\n\nDATOS:\nProductor y hectáreas: [PRODUCTOR Y HECTÁREAS]\nPeríodo del balance: [PERÍODO DEL BALANCE]\nAportes de nutrientes: [APORTES DE NUTRIENTES]\nCoeficientes de extracción: [COEFICIENTES DE EXTRACCIÓN]\nRindes cosechados: [RINDES COSECHADOS]\nObjetivo del balance: [OBJETIVO DEL BALANCE]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo los coeficientes de extracción que yo te dé, con su fuente. Si falta uno, escribe [A COMPLETAR: coeficiente y fuente]; nunca uses uno propio.\n4. Calcula los aportes a partir de las dosis y las concentraciones de cada fertilizante que yo informe; si falta la concentración, márcala [VERIFICAR].\n5. Calcula la extracción con rindes en t/ha (convierte qq/ha a t/ha dividiendo por 10) y muestra cada paso.\n6. Interpreta el saldo con cuidado: un balance negativo indica tendencia, no una dosis a reponer. No conviertas el saldo en recomendación de fertilización.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Tabla de aportes por lote y campaña.\nB) Tabla de extracción por lote y campaña, con los cálculos.\nC) Saldo por nutriente y por lote (aportes − extracción).\nD) Lectura del resultado para el objetivo planteado.\nE) Supuestos y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Haz el balance solo para fósforo, con más detalle.", "Agrega el saldo acumulado de las tres campañas.", "Prepara un gráfico en texto de saldo por lote.", "Explica el resultado al productor en cinco líneas.", "Agrega cuánto costaría reponer lo extraído con los precios que te paso.", "Compara los lotes propios con los arrendados.", "Arma la tabla para pegar en una planilla de cálculo.", "Señala qué lotes conviene volver a analizar primero.", "Agrega el aporte de rastrojos si te paso el dato.", "Resume el balance para el plan de la próxima campaña."], "checklista": ["Los coeficientes de extracción tienen su fuente.", "Los rindes están en t/ha y coinciden con los registros.", "Las concentraciones de los fertilizantes son las correctas.", "Los saldos están bien sumados.", "El saldo no se presenta como dosis a aplicar.", "Los supuestos están marcados."], "uwaga": "Un balance de nutrientes muestra la tendencia del lote, no la dosis de la próxima campaña. Para recomendar, usa el análisis de suelo y la recomendación de tu centro de investigación local.", "przyklad": {"wejscie": "Balance de fósforo para Jorge Ferreyra, Venado Tuerto, Lote 1, 100 hectáreas, últimas dos campañas. 2024/25 maíz, 95 quintales, se aplicaron 100 kilos de fosfato monoamónico por hectárea. 2025/26 soja de primera, 38 quintales, sin fertilizar. Los coeficientes de extracción que uso de la tabla del INTA son 2,8 kilos de P por tonelada de maíz y 5,4 de P por tonelada de soja. El fosfato monoamónico lo tomo con 22,7 por ciento de P. Quiero mostrarle a Jorge por qué el fósforo Bray viene bajando.", "wynik": "A) APORTES DE P (Lote 1, 100 ha)\n| Campaña | Fertilizante | Cálculo | P aportado |\n| 2024/25 | MAP 100 kg/ha | 100 × 0,227 | 22,7 kg P/ha |\n| 2025/26 | sin fertilizar | — | 0 kg P/ha |\nConcentración del MAP: dato tuyo [VERIFICAR con la ficha del proveedor].\n\nB) EXTRACCIÓN DE P\n| Campaña | Cultivo | Rinde | Cálculo | P extraído |\n| 2024/25 | maíz | 95 qq/ha = 9,5 t/ha | 9,5 × 2,8 | 26,6 kg P/ha |\n| 2025/26 | soja | 38 qq/ha = 3,8 t/ha | 3,8 × 5,4 | 20,5 kg P/ha |\nCoeficientes: tabla del INTA que indicaste [VERIFICAR: publicación y año].\n\nC) SALDO\n2024/25: 22,7 − 26,6 = −3,9 kg P/ha\n2025/26: 0 − 20,5 = −20,5 kg P/ha\nAcumulado: −24,4 kg P/ha → en 100 ha: −2.440 kg de P.\n\nD) LECTURA\nEn dos campañas el lote extrajo más fósforo del que recibió, sobre todo en la soja sin fertilizar. Eso es coherente con un P Bray que baja [SUPUESTO: falta comparar análisis]. El saldo no es la dosis a aplicar: la dosis sale del análisis y de la recomendación local.\n\nE) PENDIENTES: análisis de P Bray de cada año [A COMPLETAR]; campañas anteriores para ver la tendencia larga [A COMPLETAR].\n\nPARA JORGE: “En dos años sacamos del lote unos 24 kilos de fósforo por hectárea más de lo que pusimos. Por eso el análisis viene bajando.”\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "2.05", "nazwa": "Plan de rotación a 3–5 años", "tag": "ROTACIÓN", "co_robi": "Diseña la rotación de cada lote para los próximos 3 a 5 años según su historia, los objetivos del productor y los problemas que arrastra (malezas resistentes, enfermedades, compactación). Explica el porqué de cada secuencia.", "kiedy": "En la planificación de invierno o cuando un productor quiere salir del monocultivo y no sabe por dónde empezar.", "brief": [{"pole": "Productor y lotes", "opis": "Productor, lotes y superficie, por ejemplo “Agropecuaria Don Ernesto, Pergamino — 5 lotes, 600 ha, 400 propias y 200 arrendadas”."}, {"pole": "Historial de cultivos", "opis": "Qué se hizo, por ejemplo “últimos 4 años: soja de primera en 3 lotes, maíz y soja en los otros 2”."}, {"pole": "Objetivos productivos", "opis": "Lo que busca el productor, por ejemplo “bajar el riesgo, mejorar la materia orgánica, seguir con soja como principal”."}, {"pole": "Problemas y límites", "opis": "Lo que condiciona, por ejemplo “rama negra y yuyo colorado resistentes, bajos con napa alta, poca capacidad de cosecha propia”."}, {"pole": "Compromisos asumidos", "opis": "Contratos o programas, por ejemplo “contrato de arrendamiento a 3 años en 2 lotes, compromiso de cultivos de servicio con la cooperativa”."}, {"pole": "Horizonte del plan", "opis": "Cuántos años, por ejemplo “4 campañas”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que diseña rotaciones de cultivos que funcionan en el campo y en los números. Arma el plan de rotación por lote con mis datos.\n\nDATOS:\nProductor y lotes: [PRODUCTOR Y LOTES]\nHistorial de cultivos: [HISTORIAL DE CULTIVOS]\nObjetivos productivos: [OBJETIVOS PRODUCTIVOS]\nProblemas y límites: [PROBLEMAS Y LÍMITES]\nCompromisos asumidos: [COMPROMISOS ASUMIDOS]\nHorizonte del plan: [HORIZONTE DEL PLAN]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Propón secuencias concretas por lote y campaña, y explica en una línea el motivo agronómico de cada cambio (malezas, enfermedades, cobertura, nutrición, riesgo).\n4. Respeta los compromisos y límites que informé (contratos, tenencia, equipos, cultivos de servicio). Si un compromiso tiene condiciones que no conozco, márcalas [VERIFICAR].\n5. No estimes rindes, márgenes ni efectos sobre la materia orgánica con números propios. Si hacen falta, pídemelos o márcalos [A COMPLETAR].\n6. Señala los riesgos de cada secuencia (por ejemplo, ventana de siembra, disponibilidad de agua o de equipos) y la opción alternativa.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Tabla de rotación: lote | campaña 1 | campaña 2 | campaña 3 | campaña 4.\nB) Motivo agronómico de cada secuencia.\nC) Cómo ataca cada problema informado.\nD) Riesgos y alternativas.\nE) Supuestos y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega cultivos de servicio entre cosecha y siembra donde tenga sentido.", "Haz una versión con más maíz para un productor que tiene engorde a corral.", "Calcula la superficie por cultivo en cada campaña.", "Arma la presentación para el productor en una página.", "Separa el plan de los lotes propios y los arrendados.", "Agrega qué controlar en malezas en cada etapa de la rotación.", "Haz un escenario con un año seco en la segunda campaña.", "Prepara las preguntas para el dueño de los lotes arrendados.", "Agrega qué datos medir cada año para evaluar la rotación.", "Resume el plan para la ficha histórica de cada lote."], "checklista": ["Cada lote tiene una secuencia para todo el horizonte.", "Cada cambio tiene un motivo agronómico explicado.", "Los contratos y compromisos se respetan.", "No hay rindes ni márgenes inventados.", "Los problemas informados tienen una respuesta en el plan.", "Hay alternativa para los riesgos principales."], "uwaga": "La rotación debe cerrar en el campo y en los números. Valida los márgenes con tus costos y precios, y las condiciones de contratos y programas con quien corresponda.", "przyklad": {"wejscie": "Plan de rotación para Don Ernesto, Pergamino. Cinco lotes, seiscientas hectáreas: los lotes 1, 2 y 3 son propios, 400 hectáreas; el 4 y el 5 son arrendados, 200 hectáreas, con contrato a 3 años. Los últimos cuatro años en el 1, 2 y 3 fue soja de primera; en el 4 y el 5, maíz y soja. Tiene rama negra y yuyo colorado resistentes, el 3 tiene bajos con napa alta. Quiere bajar el riesgo, mejorar la materia orgánica y seguir con la soja como principal. Se comprometió con la cooperativa a hacer cultivos de servicio en 100 hectáreas. Planifica 4 campañas.", "wynik": "A) ROTACIÓN PROPUESTA\n| Lote | Campaña 1 | Campaña 2 | Campaña 3 | Campaña 4 |\n| 1 (propio) | cultivo de servicio + maíz | soja de primera | trigo + soja de segunda | maíz |\n| 2 (propio) | trigo + soja de segunda | maíz | soja de primera | cultivo de servicio + maíz |\n| 3 (propio, bajos) | cultivo de servicio + soja de primera | maíz tardío | trigo + soja de segunda | soja de primera |\n| 4 (arrendado) | soja de primera | maíz | trigo + soja de segunda | [VERIFICAR: renovación del contrato] |\n| 5 (arrendado) | maíz | trigo + soja de segunda | soja de primera | [VERIFICAR: renovación del contrato] |\n\nB) MOTIVOS\n- Gramínea al menos cada dos años en los lotes propios: más rastrojo y materia orgánica.\n- Trigo y cultivos de servicio cubren el suelo en invierno y compiten con rama negra.\n- Maíz tardío en el Lote 3: aprovecha la napa alta [SUPUESTO].\n\nC) PROBLEMAS\n- Rama negra y yuyo colorado: cobertura invernal y cambio de cultivo permiten rotar modos de acción; programa de control [A COMPLETAR].\n- Cultivos de servicio: Lote 1 y Lote 3 en la campaña 1 → superficie [A COMPLETAR: ha por lote] para llegar a las 100 ha comprometidas; condiciones del compromiso [VERIFICAR].\n\nD) RIESGOS\n- Trigo + soja de segunda en año seco: alternativa, soja de primera.\n- Capacidad de cosecha: más trigo suma una cosecha más [A COMPLETAR: contratista].\n\nE) PENDIENTES: márgenes por cultivo [A COMPLETAR]; superficie de cada lote [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "2.06", "nazwa": "Plan de siembra: híbrido, fecha y densidad", "tag": "PLAN DE SIEMBRA", "co_robi": "Arma el plan de siembra de cada lote: qué híbrido o variedad va en cada ambiente, en qué fecha y a qué densidad, con los datos del semillero y del lote de semilla. Calcula los kilos o bolsas de semilla y la regulación de la sembradora.", "kiedy": "Antes de arrancar la siembra, cuando hay que cerrar el pedido de semilla y dejarle al sembrador todo por escrito.", "brief": [{"pole": "Lote y suelos", "opis": "Lote, superficie y ambientes, por ejemplo “Lote 7, Río Cuarto, 85 ha: 50 ha de loma y 35 ha de bajo”."}, {"pole": "Cultivo e híbrido", "opis": "Cultivo e híbrido o variedad elegidos, por ejemplo “maíz tardío, híbrido de ciclo intermedio elegido por el productor”."}, {"pole": "Datos del semillero", "opis": "Lo que recomienda el semillero por ambiente, por ejemplo “densidad sugerida por el semillero para loma y para bajo según su ficha técnica”."}, {"pole": "Lote de semilla", "opis": "Datos de la bolsa, por ejemplo “poder germinativo 95 %, 80.000 semillas por bolsa, peso de mil semillas 330 g”."}, {"pole": "Sembradora y fecha", "opis": "Equipo y ventana, por ejemplo “sembradora de 16 surcos a 52,5 cm con dosificación variable; ventana del 10 al 25 de diciembre”."}, {"pole": "Condiciones del lote", "opis": "Cómo está, por ejemplo “buena humedad en la loma, bajo con encharcamiento en noviembre”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que planifica siembras por ambiente. Arma el plan de siembra con mis datos y los del semillero.\n\nDATOS:\nLote y suelos: [LOTE Y SUELOS]\nCultivo e híbrido: [CULTIVO E HÍBRIDO]\nDatos del semillero: [DATOS DEL SEMILLERO]\nLote de semilla: [LOTE DE SEMILLA]\nSembradora y fecha: [SEMBRADORA Y FECHA]\nCondiciones del lote: [CONDICIONES DEL LOTE]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo las densidades y fechas que recomiende el semillero o mi fuente, y cítalas. Si falta alguna, escribe [A COMPLETAR: densidad y fuente]; nunca pongas una propia.\n4. Corrige la densidad por poder germinativo y por la pérdida de implantación que yo informe; si no la di, márcala [SUPUESTO] y pídemela.\n5. Calcula semillas por metro lineal según mi distancia entre hileras, kilos o bolsas por hectárea y el total por lote.\n6. Si hay tratamiento de semilla, producto y dosis van [VER ETIQUETA].\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Plan por ambiente: ambiente | ha | híbrido | fecha | densidad objetivo (fuente).\nB) Cálculos paso a paso: semillas a sembrar por ha, semillas por metro, bolsas por ha.\nC) Total de semilla por lote y pedido al semillero.\nD) Instrucciones para el sembrador.\nE) Supuestos y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Haz la planilla para el sembrador con semillas por metro de cada ambiente.", "Arma la prescripción para dosificación variable por ambiente.", "Calcula cuántas bolsas pedir con un 5 % de reserva.", "Agrega el costo de semilla por hectárea con el precio que te paso.", "Haz un plan B si la siembra se atrasa al final de la ventana.", "Prepara la lista de chequeo de la sembradora antes de salir.", "Agrega cuándo y cómo controlar la siembra en las primeras pasadas.", "Compara este plan con el de la campaña pasada en este lote.", "Explica el plan al productor en un WhatsApp.", "Resume el plan para la ficha histórica del lote."], "checklista": ["Las densidades vienen del semillero o de tu fuente.", "El poder germinativo y el peso de mil semillas son los de la bolsa.", "Las semillas por metro corresponden a tu distancia entre hileras.", "El total de bolsas coincide con la superficie de cada ambiente.", "El tratamiento de semilla respeta la etiqueta.", "La fecha entra en la ventana recomendada."], "uwaga": "Densidades y fechas dependen del híbrido, la zona y el ambiente. Usa la ficha técnica del semillero y la recomendación de tu centro de investigación local; la IA solo hace las cuentas.", "przyklad": {"wejscie": "Plan de siembra del Lote 7 en Río Cuarto, ochenta y cinco hectáreas: cincuenta de loma y treinta y cinco de bajo. Maíz tardío con un híbrido intermedio que eligió el productor. El semillero recomienda 72.000 plantas por hectárea en loma y 62.000 en bajo, eso está en su ficha. La bolsa dice 95 por ciento de poder germinativo y 80.000 semillas por bolsa. Calculo un 5 por ciento de pérdida de implantación. La sembradora es de 16 surcos a 52,5 centímetros con dosificación variable. Ventana del 10 al 25 de diciembre. La loma tiene buena humedad, el bajo se encharcó en noviembre.", "wynik": "A) PLAN POR AMBIENTE\n| Ambiente | ha | Densidad objetivo (semillero) | Fecha |\n| Loma | 50 | 72.000 plantas/ha | 10–20/12 [SUPUESTO] |\n| Bajo | 35 | 62.000 plantas/ha | 15–25/12, cuando sea transitable [VERIFICAR] |\n\nB) CÁLCULOS\nCorrección: plantas ÷ (PG 0,95 × implantación 0,95) = plantas ÷ 0,9025.\nLoma: 72.000 ÷ 0,9025 = 79.778 semillas/ha.\nBajo: 62.000 ÷ 0,9025 = 68.698 semillas/ha.\nMetros lineales por ha a 52,5 cm: 10.000 ÷ 0,525 = 19.048 m.\nLoma: 79.778 ÷ 19.048 = 4,19 semillas/m. Bajo: 68.698 ÷ 19.048 = 3,61 semillas/m.\n\nC) SEMILLA\nLoma: 79.778 × 50 = 3.988.900 semillas → ÷ 80.000 = 49,9 bolsas.\nBajo: 68.698 × 35 = 2.404.430 semillas → 30,1 bolsas.\nTotal: 80 bolsas; con reserva, a definir [A COMPLETAR].\n\nD) PARA EL SEMBRADOR\n- Prescripción variable: 4,19 semillas/m en loma y 3,61 en bajo.\n- Controlar profundidad y distribución en las primeras pasadas.\n- Tratamiento de semilla, si lo hay: producto y dosis [VER ETIQUETA].\n\nE) PENDIENTES: mapa de ambientes cargado en la sembradora [VERIFICAR]; precio de la bolsa [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "2.07", "nazwa": "Plan de manejo de efluentes y estiércol", "tag": "EFLUENTES", "co_robi": "Ordena el uso de efluentes y estiércol del tambo, el establo, el engorde a corral o la granja: cuánto se produce, qué nutrientes aporta según tu análisis, en qué lotes se aplica, con qué distancias y en qué momentos. Respeta la norma de tu provincia o estado, que pides tú.", "kiedy": "Cuando el establecimiento tiene la laguna llena o el corral con estiércol acumulado y hay que planificar la aplicación sin problemas con la norma ni con los vecinos.", "brief": [{"pole": "Establecimiento y hacienda", "opis": "Tipo de operación y animales, por ejemplo “establo lechero de 400 vacas en ordeña, Rancho Los Álamos, Jalisco”."}, {"pole": "Volumen de efluente", "opis": "Cuánto hay, por ejemplo “laguna con unos 6.000 m³ de efluente líquido, más estiércol de corral”."}, {"pole": "Análisis del efluente", "opis": "Resultados del laboratorio, por ejemplo “N total 0,9 kg/m³, P 0,2 kg/m³, K 1,1 kg/m³”."}, {"pole": "Lotes receptores", "opis": "Dónde se puede aplicar, por ejemplo “Lote Norte 30 ha y La Loma 25 ha, para maíz forrajero”."}, {"pole": "Distancias y normas", "opis": "Lo que exige la norma que te aplica, por ejemplo “distancias a pozos, arroyos y viviendas según la norma estatal que me pase el productor”."}, {"pole": "Equipos y momentos", "opis": "Equipo y ventanas, por ejemplo “estercolera de 10 m³, aplicar antes de la siembra de abril”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que planifica el uso agronómico de efluentes y estiércol. Arma el plan de aplicación con mis datos y la norma que me aplica.\n\nDATOS:\nEstablecimiento y hacienda: [ESTABLECIMIENTO Y HACIENDA]\nVolumen de efluente: [VOLUMEN DE EFLUENTE]\nAnálisis del efluente: [ANÁLISIS DEL EFLUENTE]\nLotes receptores: [LOTES RECEPTORES]\nDistancias y normas: [DISTANCIAS Y NORMAS]\nEquipos y momentos: [EQUIPOS Y MOMENTOS]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Calcula los nutrientes aportados solo con el análisis que yo te dé. Si no hay análisis, no uses valores de tabla: escribe [A COMPLETAR: análisis del efluente].\n4. Limita la dosis por el criterio que yo indique (N o P, necesidad del cultivo según mi plan de fertilización). Si no lo di, márcalo [A COMPLETAR: criterio y fuente].\n5. No inventes distancias, épocas prohibidas ni requisitos legales. Usa solo la norma que yo te pase y marca lo que falte [VERIFICAR CON EL ORGANISMO DE TU PAÍS].\n6. Incluye cuidados con vecinos, cursos de agua y pendientes, y el registro de cada aplicación.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Resumen: volumen disponible y nutrientes totales.\nB) Cálculos paso a paso de nutrientes por m³ y por ha.\nC) Plan por lote: lote | ha | m³/ha | N, P y K aportados | momento.\nD) Distancias, restricciones y registro.\nE) Supuestos y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Calcula cuántos viajes de estercolera necesito por lote.", "Haz una versión limitada por fósforo en lugar de nitrógeno.", "Agrega cuánto fertilizante químico se ahorra con los precios que te paso.", "Arma la planilla de registro de cada aplicación.", "Prepara el croquis en texto con las zonas de exclusión.", "Explica el plan al encargado del establo en lenguaje simple.", "Agrega qué análisis repetir y cada cuánto.", "Haz el plan para el estiércol sólido por separado.", "Prepara la lista de documentos que puede pedir la autoridad ambiental.", "Resume el plan para la ficha de cada lote receptor."], "checklista": ["Los nutrientes salen del análisis del efluente, no de una tabla genérica.", "El criterio que limita la dosis está definido.", "Las distancias y épocas vienen de la norma vigente.", "El volumen total cubre lo planificado.", "Hay registro de cada aplicación.", "Los vecinos y cursos de agua están considerados."], "uwaga": "Las normas sobre efluentes cambian según el país, la provincia o el estado. Pide la norma vigente al organismo ambiental o agropecuario que corresponda; la IA no la conoce y no debe suponerla.", "przyklad": {"wejscie": "Plan de efluentes para Rancho Los Álamos, en Jalisco. Establo lechero con 400 vacas en ordeña. La laguna tiene unos 6.000 metros cúbicos de efluente líquido. El análisis dio nitrógeno total 0,9 kilos por metro cúbico, fósforo 0,2 y potasio 1,1. Se puede aplicar en el Lote Norte, 30 hectáreas, y La Loma, 25 hectáreas, que van a maíz forrajero en abril. Según mi plan de fertilización el maíz necesita 120 kilos de N por hectárea y quiero cubrir hasta la mitad con efluente. Estercolera de 10 metros cúbicos. Las distancias a pozos y arroyos me las tiene que pasar el productor de la norma estatal.", "wynik": "A) RESUMEN\nVolumen: 6.000 m³. Nutrientes totales: N 6.000 × 0,9 = 5.400 kg; P 1.200 kg; K 6.600 kg.\n\nB) CÁLCULOS (criterio: cubrir 50 % del N del plan)\nN a cubrir con efluente: 120 × 0,5 = 60 kg N/ha.\nDosis: 60 ÷ 0,9 = 66,7 m³/ha.\nAporte a esa dosis: P 66,7 × 0,2 = 13,3 kg/ha; K 66,7 × 1,1 = 73,4 kg/ha.\nDisponibilidad del N total para el cultivo: no considerada [SUPUESTO: 100 %]; ajusta con el coeficiente de tu guía [A COMPLETAR: coeficiente y fuente].\n\nC) PLAN POR LOTE\n| Lote | ha | m³/ha | m³ total | Viajes (10 m³) | Momento |\n| Norte | 30 | 66,7 | 2.001 | 200 | antes de la siembra de abril |\n| La Loma | 25 | 66,7 | 1.668 | 167 | antes de la siembra de abril |\nTotal: 3.669 m³; quedan 2.331 m³ sin destino [A COMPLETAR: otros lotes].\n\nD) RESTRICCIONES Y REGISTRO\n- Distancias a pozos, arroyos y viviendas [VERIFICAR CON EL ORGANISMO DE TU PAÍS].\n- Épocas o condiciones no permitidas [VERIFICAR].\n- Registrar fecha, lote, m³ y condiciones de cada aplicación.\n\nE) PENDIENTES: norma estatal [A COMPLETAR]; análisis del estiércol de corral [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "2.08", "nazwa": "Plan foliar y de micronutrientes", "tag": "PLAN FOLIAR", "co_robi": "Ordena la decisión de aplicar foliares o micronutrientes: qué dicen el análisis foliar, el de suelo y los síntomas, si la deficiencia está confirmada y en qué momento tendría sentido. Evita aplicar «por las dudas» sin datos.", "kiedy": "Cuando un vendedor ofrece un foliar o aparecen síntomas en el cultivo y el productor pregunta si vale la pena aplicar.", "brief": [{"pole": "Lote y cultivo", "opis": "Lote, cultivo y superficie, por ejemplo “Lote 5, Canindeyú, 120 ha de soja”."}, {"pole": "Análisis foliar y de suelo", "opis": "Resultados, por ejemplo “foliar en R1: boro y zinc en rango bajo según el laboratorio; suelo: pH 5,6, Zn 0,8 ppm”."}, {"pole": "Síntomas a campo", "opis": "Lo que viste, por ejemplo “clorosis entre nervaduras en hojas nuevas en manchones de la loma”."}, {"pole": "Aplicaciones previstas", "opis": "Lo que ya se va a aplicar, por ejemplo “fungicida en R3 con la pulverizadora propia”."}, {"pole": "Productos disponibles", "opis": "Lo que ofrecen o tienen, por ejemplo “un foliar con boro y zinc que ofrece la agronomía, con su etiqueta”."}, {"pole": "Momento y estadio", "opis": "Cuándo se podría aplicar, por ejemplo “entre R1 y R3”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que decide aplicaciones foliares con datos y no por costumbre. Evalúa si este plan foliar se justifica y arma la propuesta.\n\nDATOS:\nLote y cultivo: [LOTE Y CULTIVO]\nAnálisis foliar y de suelo: [ANÁLISIS FOLIAR Y DE SUELO]\nSíntomas a campo: [SÍNTOMAS A CAMPO]\nAplicaciones previstas: [APLICACIONES PREVISTAS]\nProductos disponibles: [PRODUCTOS DISPONIBLES]\nMomento y estadio: [MOMENTO Y ESTADIO]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Confirma o descarta la deficiencia solo con los análisis y rangos que yo te dé, citando su fuente. Si no hay análisis o rango, marca la deficiencia como sospecha [VERIFICAR].\n4. Considera otras causas posibles de los síntomas (enfermedades, herbicidas, compactación, anegamiento) y di cómo descartarlas.\n5. Producto, dosis, compatibilidad en mezcla de tanque y momento salen de la etiqueta: márcalos [VER ETIQUETA]. Nunca pongas una dosis propia.\n6. Propón una franja testigo sin aplicar para medir si hubo respuesta.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Diagnóstico: deficiencia confirmada, probable o descartada, con evidencias.\nB) Otras causas posibles y cómo descartarlas.\nC) Propuesta: aplicar o no, en qué momento y si conviene sumarla a otra aplicación.\nD) Diseño de franja testigo y qué medir.\nE) Supuestos y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Arma el diseño de la franja testigo con medidas y ubicación.", "Haz una tabla de costo por hectárea contra rinde necesario para pagar la aplicación.", "Prepara las preguntas para el vendedor del foliar.", "Explica al productor en lenguaje simple por qué aplicar o no.", "Agrega qué muestras foliares tomar y cómo enviarlas al laboratorio.", "Revisa la compatibilidad con el fungicida según las etiquetas.", "Haz el registro de aplicación para este foliar.", "Agrega qué mirar a campo una semana después de aplicar.", "Compara con lo que pasó en otros lotes del mismo productor.", "Resume la decisión para la ficha histórica del lote."], "checklista": ["La deficiencia está apoyada en análisis con su rango de referencia.", "Se consideraron otras causas de los síntomas.", "Producto, dosis y mezcla salen de la etiqueta.", "Hay franja testigo para medir respuesta.", "El momento coincide con el estadio indicado.", "La decisión está explicada al productor."], "uwaga": "Un foliar no corrige un problema de suelo ni reemplaza el diagnóstico. Dosis, mezclas y momentos salen de la etiqueta; los rangos de suficiencia, de tu laboratorio o centro de investigación local.", "przyklad": {"wejscie": "Lote 5 en Canindeyú, ciento veinte hectáreas de soja. El análisis foliar en R1 dio boro y zinc en rango bajo según la tabla del laboratorio. En el suelo pH 5,6 y zinc 0,8 ppm, para el zinc de suelo no tengo rango. En la loma hay manchones con clorosis entre las nervaduras en las hojas nuevas. Se va a aplicar fungicida en R3 con la pulverizadora propia. La agronomía ofrece un foliar con boro y zinc, tengo la etiqueta. El productor quiere saber si lo pone junto con el fungicida. Se podría aplicar entre R1 y R3.", "wynik": "A) DIAGNÓSTICO\n| Nutriente | Evidencia | Lectura |\n| Boro | foliar bajo según laboratorio | deficiencia probable |\n| Zinc | foliar bajo según laboratorio; suelo 0,8 ppm sin rango [A COMPLETAR: rango y fuente] | deficiencia probable |\nLos manchones en la loma coinciden con el síntoma descrito, pero la muestra foliar ¿se tomó de esos manchones o del lote en general? [VERIFICAR]\n\nB) OTRAS CAUSAS A DESCARTAR\n- Daño por herbicida: revisar qué se aplicó y cuándo [A COMPLETAR].\n- Compactación o falta de nodulación en la loma: sacar plantas y mirar raíces.\n- Enfermedad: revisar patrón en el lote y en la hoja.\n\nC) PROPUESTA\nAplicar en R3 junto con el fungicida tiene sentido operativo si las etiquetas permiten la mezcla [VER ETIQUETA]. Dosis del foliar [VER ETIQUETA]. Si la deficiencia se confirma, aplicar en R3 está dentro de la ventana que indicaste.\n\nD) FRANJA TESTIGO\nDejar una franja sin foliar del ancho de la pulverizadora y largo completo del lote, cruzando loma y bajo [SUPUESTO]. Medir: síntomas a los 7–14 días y rinde con monitor en la franja y al lado.\n\nE) PENDIENTES: costo del foliar por ha [A COMPLETAR]; precio de la soja para calcular cuánto rinde paga la aplicación [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "2.09", "nazwa": "Plan de cultivos y producción de la campaña", "tag": "PLAN DE CAMPAÑA", "co_robi": "Arma el plan de la campaña: qué cultivo va en cada lote, cuántas hectáreas de cada uno, rindes y precios esperados, contratos y restricciones. Te deja el margen por cultivo y por lote calculado con los números del productor.", "kiedy": "En la planificación de invierno o antes de cerrar arrendamientos, cuando el productor tiene que decidir cuánto maíz, cuánta soja y cuánto trigo hace.", "brief": [{"pole": "Empresa y recursos", "opis": "Productor y recursos, por ejemplo “Hnos. Benítez, Santa Cruz de la Sierra: sembradora y pulverizadora propias, cosecha con contratista”."}, {"pole": "Lotes y tenencia", "opis": "Lotes, superficie y tenencia, por ejemplo “800 ha: 500 propias y 300 arrendadas a pagar en quintales de soja”."}, {"pole": "Cultivos previstos", "opis": "Lo que se piensa sembrar, por ejemplo “soja de verano, maíz y sorgo de invierno”."}, {"pole": "Rindes y precios", "opis": "Rindes esperados y precios, por ejemplo “soja 2,8 t/ha, maíz 6 t/ha; precios del acopio de esta semana”."}, {"pole": "Mercados y contratos", "opis": "Ventas comprometidas, por ejemplo “contrato de 1.000 t de soja con la aceitera a precio a fijar”."}, {"pole": "Restricciones", "opis": "Lo que limita, por ejemplo “capital de trabajo limitado, lotes con malezas resistentes, ventana de siembra corta”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que arma planes de campaña que cierran en el campo y en los números. Prepara el plan de cultivos y producción de la campaña.\n\nDATOS:\nEmpresa y recursos: [EMPRESA Y RECURSOS]\nLotes y tenencia: [LOTES Y TENENCIA]\nCultivos previstos: [CULTIVOS PREVISTOS]\nRindes y precios: [RINDES Y PRECIOS]\nMercados y contratos: [MERCADOS Y CONTRATOS]\nRestricciones: [RESTRICCIONES]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo los rindes, precios y costos que yo te dé. Si falta alguno, escribe [A COMPLETAR] y no lo estimes.\n4. Calcula ingreso, costos directos y margen bruto por cultivo y por lote, con cada paso a la vista y en la moneda que yo indique (USD o moneda local [A COMPLETAR]).\n5. Respeta los contratos, la tenencia y las restricciones; si un plan las viola, avísame.\n6. Presenta al menos dos escenarios de mezcla de cultivos y muestra cuál usa mejor los recursos según mis datos, sin prometer resultados.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Tabla de asignación: lote | ha | tenencia | cultivo.\nB) Superficie total por cultivo.\nC) Margen bruto por cultivo y por lote, con los cálculos.\nD) Escenarios comparados y riesgos.\nE) Supuestos y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega un escenario con precios 15 % más bajos.", "Calcula el rinde de indiferencia de cada cultivo.", "Haz el flujo de fondos mensual de la campaña.", "Separa los márgenes de lotes propios y arrendados.", "Arma la presentación para el banco con el plan y los números.", "Calcula cuánta soja tengo que entregar por el arrendamiento.", "Agrega el calendario de siembra y cosecha por lote.", "Haz una versión con más maíz para comparar el riesgo.", "Prepara la lista de insumos a comprar con fechas.", "Resume el plan en una página para el productor."], "checklista": ["Los rindes y precios son los del productor o del mercado, con fecha.", "Los costos directos incluyen todo lo importante.", "Los márgenes están bien calculados.", "Los contratos y la tenencia se respetan.", "Hay al menos dos escenarios comparados.", "Los supuestos están marcados."], "uwaga": "Los márgenes dependen de precios y costos que cambian. Actualízalos antes de decidir y usa tus fuentes (acopio, bolsa, cámara de contratistas); la IA no tiene precios actuales.", "przyklad": {"wejscie": "Plan de campaña para los Hermanos Benítez, Santa Cruz de la Sierra. Ochocientas hectáreas: quinientas propias y trescientas arrendadas que pagan 4 quintales de soja por hectárea. Sembradora y pulverizadora propias, cosecha con contratista. Quieren soja de verano en todo y después maíz o sorgo de invierno. Rinde esperado de soja 2,8 toneladas, maíz de invierno 4 toneladas. El acopio paga esta semana 340 dólares la tonelada de soja y 170 la de maíz. Costo directo de soja 420 dólares por hectárea y maíz de invierno 480, sin cosecha. Tienen contrato de 1.000 toneladas de soja con la aceitera.", "wynik": "A) ASIGNACIÓN (verano)\n| Tenencia | ha | Cultivo |\n| Propia | 500 | soja |\n| Arrendada | 300 | soja |\n\nB) SOJA DE VERANO, 800 ha\nProducción: 800 × 2,8 = 2.240 t. Contrato: 1.000 t → libres 1.240 t.\nArrendamiento: 300 × 0,4 t = 120 t de soja.\n\nC) MARGEN BRUTO POR HECTÁREA (USD)\n| Cultivo | Ingreso | Costo directo | Cosecha | Margen |\n| Soja propia | 2,8 × 340 = 952 | 420 | [A COMPLETAR] | 532 − cosecha |\n| Soja arrendada | 952 − (0,4 × 340 = 136) = 816 | 420 | [A COMPLETAR] | 396 − cosecha |\n| Maíz de invierno | 4 × 170 = 680 | 480 | [A COMPLETAR] | 200 − cosecha |\nGastos de comercialización y flete: [A COMPLETAR].\n\nD) ESCENARIOS DE INVIERNO\n1. Maíz en las 500 ha propias: 500 × 200 = 100.000 USD antes de cosecha y flete.\n2. Maíz en las 800 ha: suma 300 ha × 200 = 60.000 USD más, pero el arrendamiento puede no incluir el invierno [VERIFICAR contrato].\n3. Sorgo: faltan rinde, precio y costo [A COMPLETAR].\nRiesgo: ventana de siembra corta y lluvias de invierno [SUPUESTO].\n\nE) PENDIENTES: tarifa de cosecha del contratista (referencia de tu zona) [A COMPLETAR]; condiciones de precio del contrato con la aceitera [VERIFICAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "2.10", "nazwa": "Elección de híbridos y variedades por ensayos", "tag": "ELECCIÓN DE VARIEDAD", "co_robi": "Compara híbridos o variedades con los datos de ensayos de la red, de los semilleros y de tus propias parcelas, y arma una elección por ambiente con criterios claros. No le cree a un solo ensayo ni al folleto.", "kiedy": "Antes de cerrar el pedido de semilla, cuando cada semillero trae su ensayo ganador y el productor no sabe a quién creerle.", "brief": [{"pole": "Campo y condiciones", "opis": "Zona, suelos y ambientes, por ejemplo “Tolima, arroz bajo riego, suelos francos, 200 ha”."}, {"pole": "Cultivo y mercado", "opis": "Cultivo y destino, por ejemplo “arroz para molino con exigencia de calidad de grano”."}, {"pole": "Resultados de ensayos", "opis": "Datos de ensayos con su fuente, por ejemplo “red de ensayos de AGROSAVIA y de dos semilleros: rinde, ciclo, vuelco y sanidad de 6 variedades, últimas 3 campañas”."}, {"pole": "Candidatos", "opis": "Variedades que se consideran, por ejemplo “variedades A, B y C”."}, {"pole": "Criterios de elección", "opis": "Qué importa, por ejemplo “estabilidad de rinde, sanidad, calidad molinera, ciclo para dos siembras”."}, {"pole": "Datos de parcelas propias", "opis": "Tus franjas o parcelas, por ejemplo “franjas de 2 ha de A y B en la campaña pasada, con rinde de monitor”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que elige híbridos y variedades con datos de ensayos. Compara los candidatos y arma la elección por ambiente.\n\nDATOS:\nCampo y condiciones: [CAMPO Y CONDICIONES]\nCultivo y mercado: [CULTIVO Y MERCADO]\nResultados de ensayos: [RESULTADOS DE ENSAYOS]\nCandidatos: [CANDIDATOS]\nCriterios de elección: [CRITERIOS DE ELECCIÓN]\nDatos de parcelas propias: [DATOS DE PARCELAS PROPIAS]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo los datos de ensayos que yo te dé, citando la fuente de cada uno (red pública, semillero, parcela propia). No completes rindes ni calificaciones que faltan: [A COMPLETAR].\n4. Prioriza la estabilidad: cuántos sitios y campañas tiene cada candidato y cómo rinde frente al promedio de cada ensayo. Advierte cuando un dato viene de un solo ensayo o solo del semillero que vende.\n5. Aplica los criterios en el orden que yo indique y explica la elección por ambiente.\n6. Recomienda cómo seguir probando: franjas propias, testigo y qué medir.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Tabla comparativa: candidato | n.º de ensayos | rinde relativo al promedio | sanidad | ciclo | otros criterios | fuente.\nB) Cálculos paso a paso de rinde relativo y promedios.\nC) Elección por ambiente con su justificación.\nD) Plan de franjas para la próxima campaña.\nE) Supuestos y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Calcula el rinde relativo de cada candidato en cada ensayo.", "Haz la tabla solo con ensayos de la red pública.", "Agrega el costo de semilla por hectárea con los precios que te paso.", "Prepara las preguntas para cada semillero sobre sus ensayos.", "Diseña las franjas comparativas para el campo del productor.", "Explica la elección al productor en cinco líneas.", "Agrega qué variedad usar si se atrasa la siembra.", "Marca qué datos de ensayos son poco confiables y por qué.", "Haz la planilla para cargar los resultados de las franjas a cosecha.", "Resume la elección para el plan de siembra de cada lote."], "checklista": ["Cada dato de ensayo tiene su fuente.", "Se compara por rinde relativo, no solo por rinde absoluto.", "Se considera el número de ensayos y campañas de cada candidato.", "Los criterios del productor se aplicaron en orden.", "Hay franjas propias planificadas para seguir probando.", "Los datos que faltan están marcados."], "uwaga": "Un ensayo es un dato, no una verdad. Combina la red pública (INTA, INIFAP, AGROSAVIA, INIA u otra) con tus franjas y desconfía de los ensayos que solo muestra quien vende la semilla.", "przyklad": {"wejscie": "Estoy en Tolima con un productor de arroz bajo riego, doscientas hectáreas, suelos francos. Vende al molino que exige calidad de grano. Tengo ensayos de la red de AGROSAVIA y de dos semilleros, tres campañas. Candidatos A, B y C. En la red, A rindió 102, 98 y 105 por ciento del promedio del ensayo; B rindió 110, 92 y 96; C solo tiene un ensayo del semillero que la vende, con 112 por ciento. Sanidad: A buena, B regular a piricularia, C sin dato. En la campaña pasada hicimos franjas de 2 hectáreas: A dio 7,1 toneladas y B 7,3. Criterios en orden: estabilidad, sanidad, calidad molinera, ciclo.", "wynik": "A) COMPARACIÓN\n| Candidato | Ensayos | Rinde relativo | Sanidad | Fuente |\n| A | 3 (red) | 102 / 98 / 105 % | buena | AGROSAVIA |\n| B | 3 (red) | 110 / 92 / 96 % | regular a piricularia | AGROSAVIA |\n| C | 1 | 112 % | [A COMPLETAR] | semillero que la vende |\nCalidad molinera y ciclo: [A COMPLETAR para los tres].\n\nB) CÁLCULOS\nA: (102 + 98 + 105) ÷ 3 = 101,7 %; rango 98–105 (7 puntos).\nB: (110 + 92 + 96) ÷ 3 = 99,3 %; rango 92–110 (18 puntos).\nC: un solo dato; no se puede medir estabilidad.\nFranjas propias: B − A = 7,3 − 7,1 = 0,2 t/ha a favor de B (una campaña, sin repetición) [VERIFICAR].\n\nC) ELECCIÓN (criterios en tu orden)\n1. Estabilidad: A es más estable que B; C sin datos suficientes.\n2. Sanidad: A buena frente a B regular.\n→ Elección principal: A. B como segunda, en menor superficie, si la presión de piricularia es baja [SUPUESTO]. C solo en franja de prueba.\nCalidad molinera: confirmar con el molino antes de cerrar [VERIFICAR].\n\nD) FRANJAS PRÓXIMA CAMPAÑA\nA y B repetidas en dos lotes, más C en una franja, con la misma fecha y manejo. Medir rinde de monitor, piricularia y calidad de grano.\n\nE) PENDIENTES: datos de ciclo y calidad de cada variedad [A COMPLETAR]; precio de semilla [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}]}, {"dzial_nr": 3, "dzial": "Costos, presupuestos y márgenes", "opis": "La agronomía termina en el lote, pero la decisión se toma en la mesa de la cocina: cuánto cuesta la tonelada, si el precio que ofrecen cubre los costos, si conviene tomar el campo, comprar la máquina o guardar el grano. Cargas tus propias facturas, cotizaciones y rindes, y recibes una cuenta paso a paso para revisar, sin un solo número inventado.", "skills": [{"id": "3.01", "nazwa": "Costo de producción por hectárea", "tag": "COSTO POR HA", "co_robi": "Arma el presupuesto de un cultivo con las facturas y el plan del productor: cada renglón en USD/ha, USD por lote y USD por tonelada. Separa insumos, labores y otros gastos para que veas exactamente adónde se va la plata.", "kiedy": "Antes de la siembra, cuando planificas la campaña, o cuando el productor te pregunta cuánto le cuesta de verdad cada tonelada y las facturas están en una carpeta en la guantera de la camioneta.", "brief": [{"pole": "Productor y cultivo", "opis": "Productor, cultivo, lote, hectáreas y zona, por ejemplo “Agropecuaria Don Ernesto, maíz en el Lote 7, 120 ha, Pergamino, campo propio”."}, {"pole": "Insumos directos", "opis": "Semilla, fertilizantes y fitosanitarios en USD/ha, de facturas o del plan, por ejemplo “semilla 210 USD/ha, fertilizantes 230 USD/ha, fitosanitarios 85 USD/ha”."}, {"pole": "Labores y contratistas", "opis": "Siembra, pulverizaciones, cosecha, propias o contratadas, por ejemplo “siembra 60 USD/ha, 3 pulverizaciones de 12 USD/ha, cosecha 95 USD/ha, todo con contratista”."}, {"pole": "Otros costos", "opis": "Seguro, interés, alquiler, mano de obra, por ejemplo “seguro de granizo 18 USD/ha, interés del crédito 15 USD/ha, el campo es propio”."}, {"pole": "Rinde esperado", "opis": "Tu historial o el objetivo del lote, por ejemplo “95 qq/ha, promedio de las últimas tres campañas en ese lote”."}, {"pole": "Para qué", "opis": "Para qué haces la cuenta, por ejemplo “saber cuánto cuesta la tonelada antes de vender y mostrárselo al banco”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que arma presupuestos de cultivo con productores todos los años antes de la siembra. Prepara el costo de producción de un cultivo.\n\nDATOS:\nProductor y cultivo: [PRODUCTOR Y CULTIVO]\nInsumos directos: [INSUMOS DIRECTOS]\nLabores y contratistas: [LABORES Y CONTRATISTAS]\nOtros costos: [OTROS COSTOS]\nRinde esperado: [RINDE ESPERADO]\nPara qué: [PARA QUÉ]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes precios, rindes, dosis, tasas, montos de programas ni valores «típicos». Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Muestra cada cálculo paso a paso con unidades (USD/ha, USD/lote, USD/t, t/ha, qq/ha) y redondea solo el resultado final.\n4. Agrupa los costos en insumos directos, labores y contratistas, y otros costos. Muestra cada renglón en USD/ha, en USD para todo el lote y su participación en el total.\n5. Costo por tonelada = total USD/ha dividido por el rinde esperado en t/ha (1 t = 10 qq). Si no te di rinde, no lo adivines.\n6. Si te doy un precio, calcula también los quintales por hectárea que hacen falta para cubrir el costo; si no, márcalo [A COMPLETAR].\n7. Aclara qué deja afuera el presupuesto (amortizaciones, mano de obra familiar, renta de la tierra propia, gastos de estructura) para que nadie lo compare con un costo completo del banco o del INTA.\n\nFORMATO DE SALIDA:\nA) Tabla de costos | renglón | USD/ha | USD/lote | % del total |.\nB) Totales en USD/ha, USD/lote y USD/t, con la cuenta a la vista.\nC) Los tres renglones más pesados y una pregunta que vale la pena hacerse sobre cada uno.\nD) Lista de huecos y supuestos a cerrar antes de usar el presupuesto.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega la amortización de maquinaria con los valores que te paso.", "Recalcula el costo por tonelada con 10 qq/ha menos y 10 qq/ha más.", "Abre los fertilizantes por producto, dosis y momento según el plan de fertilización.", "Conviértelo en un presupuesto de una página para el banco.", "Compáralo con el presupuesto de la campaña pasada, que te pego ahora.", "Agrega la renta de la tierra propia con el valor que te doy.", "Escálalo a todas las hectáreas de maíz de la empresa.", "Marca cualquier renglón raro que convenga revisar contra las facturas.", "Arma la tabla para pegarla en una planilla de cálculo.", "Escribe un resumen de tres oraciones para el productor."], "checklista": ["Cada número en dólares sale de facturas, cotizaciones de la agronomía o del plan del productor, no de la memoria de la IA.", "Las unidades son coherentes: USD/ha, USD/lote y USD/t, sin mezclar precio por envase con precio por hectárea.", "Las hectáreas del lote coinciden con los mapas o el registro del productor.", "El rinde usado para el costo por tonelada es realista para el historial de ese lote.", "El presupuesto dice qué no incluye (amortizaciones, mano de obra propia, renta de la tierra).", "Todos los [A COMPLETAR] están cerrados antes de mandarlo al banco."], "uwaga": "El presupuesto vale lo que valen los números del productor. Revisa si las facturas incluyen descuentos por pago anticipado, intereses de financiación o impuestos: la IA no conoce la situación impositiva de la empresa; eso se consulta con el contador.", "przyklad": {"wejscie": "Bueno, Agropecuaria Don Ernesto, maíz en el Lote 7, 120 hectáreas, Pergamino. El campo es de ellos, así que no hay alquiler. De las facturas por hectárea tengo semilla 210, fertilizante 230 todo junto, fitosanitarios 85. Labores con contratista: siembra 60 la hectárea, tres pasadas de pulverizadora a 12 cada una, y la cosecha 95 la hectárea. Seguro de granizo 18 por hectárea y el interés del crédito para insumos sale unos 15. Rinde ponle 95 quintales, es el promedio de tres campañas en ese lote. No metas amortizaciones que no tengo los valores de las máquinas, y la mano de obra de Ernesto tampoco. Quiero saber cuánto le cuesta la tonelada antes de que salga a vender y algo para mostrarle al banco.", "wynik": "COSTO DE PRODUCCIÓN: maíz, Lote 7, 120 ha, Pergamino\n\n| renglón | USD/ha | USD/lote | % |\n| semilla | 210 | 25.200 | 28,0 |\n| fertilizantes | 230 | 27.600 | 30,7 |\n| fitosanitarios | 85 | 10.200 | 11,3 |\n| siembra | 60 | 7.200 | 8,0 |\n| pulverizaciones (3 × 12) | 36 | 4.320 | 4,8 |\n| cosecha | 95 | 11.400 | 12,7 |\n| seguro de granizo | 18 | 2.160 | 2,4 |\n| interés | 15 | 1.800 | 2,0 |\n| TOTAL | 749 | 89.880 | 100 |\n\nCuentas:\n1. Insumos directos: 210 + 230 + 85 = 525 USD/ha\n2. Labores: 60 + 36 + 95 = 191 USD/ha\n3. Otros: 18 + 15 = 33 USD/ha\n4. Total: 525 + 191 + 33 = 749 USD/ha; × 120 ha = 89.880 USD\n5. Rinde: 95 qq/ha = 9,5 t/ha\n6. Costo por tonelada: 749 ÷ 9,5 = 78,84 USD/t\n7. Quintales para cubrir el costo: [A COMPLETAR: precio neto esperado en USD/t]\n\nRenglones más pesados: fertilizantes (30,7 %): ¿la dosis sale del último análisis de suelo del lote?; semilla (28,0 %): ¿la densidad acompaña el ambiente de ese lote?; cosecha (12,7 %): ¿la tarifa es fija o porcentaje del rinde? [VERIFICAR]\n\nNo incluye: amortizaciones [A COMPLETAR], mano de obra propia [A COMPLETAR], renta de la tierra propia [A COMPLETAR]. El costo completo por tonelada será mayor a 78,84 USD/t.\n\n[SUPUESTO] 95 qq/ha = promedio de tres campañas en el Lote 7.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "3.02", "nazwa": "Margen bruto por actividad", "tag": "MARGEN BRUTO", "co_robi": "Calcula el margen bruto de un cultivo o actividad con los rindes, precios y costos reales del productor: ingreso bruto, gastos de comercialización, costos directos y margen antes y después del alquiler. Ideal para comparar lotes, cultivos o campañas.", "kiedy": "Cuando el productor duda entre soja y maíz para la próxima campaña, cuando cierra la cosecha y quiere saber cuánto dejó cada actividad, o cuando el banco pide números.", "brief": [{"pole": "Actividad y hectáreas", "opis": "Cultivo, lote y superficie, por ejemplo “Hnos. Benítez, soja de primera, 300 ha en Venado Tuerto, campo alquilado”."}, {"pole": "Rinde y precio", "opis": "Rinde obtenido o esperado y precio de referencia, por ejemplo “35 qq/ha, precio 300 USD/t que me pasó el corredor”."}, {"pole": "Costos directos", "opis": "Insumos, labores y seguro en USD/ha, por ejemplo “semilla 70, fertilizante 45, fitosanitarios 95, labores 150, seguro 12 USD/ha”."}, {"pole": "Gastos de comercialización", "opis": "Flete, comisiones, secado, acondicionamiento, por ejemplo “flete 22 USD/t y 3 % de comisión y otros gastos sobre el bruto”."}, {"pole": "Seguro e indemnizaciones", "opis": "Indemnizaciones cobradas o pendientes, por ejemplo “no hubo siniestro, no se cobró nada”."}, {"pole": "Comparación", "opis": "Con qué lo quieres comparar, por ejemplo “con la campaña pasada, que dio 480 USD/ha antes de alquiler; alquiler 12 qq/ha”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia en gestión de empresas agropecuarias que calcula márgenes brutos con productores al cierre de cada campaña. Calcula el margen bruto de esta actividad.\n\nDATOS:\nActividad y hectáreas: [ACTIVIDAD Y HECTÁREAS]\nRinde y precio: [RINDE Y PRECIO]\nCostos directos: [COSTOS DIRECTOS]\nGastos de comercialización: [GASTOS DE COMERCIALIZACIÓN]\nSeguro e indemnizaciones: [SEGURO E INDEMNIZACIONES]\nComparación: [COMPARACIÓN]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes precios, rindes, dosis, tasas, montos de programas ni valores «típicos». Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Muestra cada cálculo paso a paso con unidades (USD/ha, USD/t, qq/ha, t/ha) y redondea solo el resultado final.\n4. Orden del cálculo: ingreso bruto = rinde × precio; menos gastos de comercialización = ingreso neto; menos costos directos = margen bruto; después, si te lo doy, margen después del alquiler.\n5. Si el alquiler está en quintales, valúalo al precio neto por tonelada que surge de mis datos y muestra la cuenta.\n6. Las indemnizaciones del seguro van en una línea aparte, nunca mezcladas con el ingreso por venta.\n7. Si te doy otra campaña u otro cultivo, compara en USD/ha y explica de dónde viene la diferencia (rinde, precio o costo).\n\nFORMATO DE SALIDA:\nA) Tabla del margen | concepto | USD/ha | USD total |.\nB) Cuentas paso a paso, con el precio neto por tonelada.\nC) Margen después del alquiler y comparación pedida.\nD) Tres conclusiones para el productor y la lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Calcula el margen bruto de maíz en el mismo campo para comparar.", "Arma una tabla de sensibilidad con tres rindes y tres precios.", "Agrega gastos de estructura con el monto que te paso.", "Muestra el margen en quintales por hectárea además de en dólares.", "Compara lotes propios con lotes alquilados.", "Prepara una versión de una página para la reunión con el productor.", "Calcula cuántos quintales hacen falta para pagar el alquiler y los costos.", "Separa el margen de soja de primera y de segunda.", "Escribe la explicación en lenguaje simple para el socio que no es del campo.", "Arma la tabla para pegarla en una planilla de cálculo."], "checklista": ["El rinde es el real de balanza o de monitor calibrado, no una estimación vieja.", "El precio es el neto que efectivamente le queda al productor, no la pizarra sin descuentos.", "Los gastos de comercialización están todos: flete, comisión, secado, acondicionamiento.", "El alquiler se muestra aparte y valuado al mismo precio que la producción.", "Las indemnizaciones del seguro están separadas del ingreso por venta.", "Los [A COMPLETAR] se cierran antes de comparar con otras campañas."], "uwaga": "El margen bruto no es la ganancia de la empresa: no incluye estructura, impuestos ni amortizaciones. Si el productor lo va a usar para pedir crédito, que el contador revise los números antes.", "przyklad": {"wejscie": "Hnos. Benítez, soja de primera, 300 hectáreas en Venado Tuerto, el campo es alquilado a 12 quintales por hectárea. Dio 35 quintales promedio. El corredor me pasó 300 dólares la tonelada. Flete 22 dólares la tonelada y ponle un 3 por ciento de comisión y gastos varios sobre el bruto. Costos por hectárea: semilla 70, fertilizante 45, fitosanitarios 95, labores 150 todo con contratista, seguro de granizo 12. No hubo siniestro. La campaña pasada en el mismo campo el margen antes de alquiler dio 480 por hectárea. Quiero ver cuánto queda después del alquiler y por qué cambió contra el año pasado.", "wynik": "MARGEN BRUTO: soja de primera, 300 ha, Venado Tuerto\n\n| concepto | USD/ha | USD total |\n| ingreso bruto | 1.050,0
