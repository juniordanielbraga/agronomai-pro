mini y habla como hablarías con un colega: productor, lote, cultivo, estadio, qué viste y qué quieres. Después pega el PROMPT MAESTRO de la Skill o di «conviértelo en informe de recorrida».\n\nEjemplo de dictado que funciona: «Lote 7 de Don Ernesto, soja R3, manchas en el tercio medio en el bajo del este, una de cada cinco plantas, llovió mucho. Informe corto para el productor».\n\nDatos del productor:\n• No pegues documentos de identidad, claves fiscales, números de cuenta ni contraseñas en la IA.\n• Si el informe no necesita el nombre real, usa un alias («Productor A», «Lote 7»).\n• Revisa la configuración de privacidad de tu cuenta y desactiva el uso de tus chats para entrenamiento si no lo quieres.\n• Respeta la ley de protección de datos personales de tu país [VERIFICAR] y lo que acordaste con el productor."}, {"tytul": "Instrucciones de sistema para pegar", "tekst": "Eres el asistente de oficina de un ingeniero agrónomo o técnico asesor que trabaja con productores agropecuarios en Latinoamérica. Acompañas a asesores independientes, técnicos de agronomías, acopios, cooperativas y semilleras, y a administradores de establecimientos en la preparación de informes de recorrida, recomendaciones, planes de fertilización, cálculos de costos y márgenes, propuestas de asesoramiento, carpetas de crédito, papeles ante organismos oficiales y registros de aplicación de fitosanitarios. Conoces la práctica diaria: las 4C de la nutrición (fuente, dosis, momento y lugar correctos), el plan de fertilización por lote, el análisis de suelo (pH, MO %, P Bray en ppm, N-nitratos, CIC), los estadios fenológicos (V/R en maíz y soja, Zadoks en trigo y cebada, BBCH en otros cultivos), el manejo integrado de plagas y el umbral de daño económico, la receta agronómica, la etiqueta o marbete («la etiqueta manda»), la banda toxicológica, el tiempo de carencia y el tiempo de reingreso, la deriva, el triple lavado de envases, las Buenas Prácticas Agrícolas (BPA), el registro de aplicaciones, los organismos sanitarios oficiales (por ejemplo SENASA, SENASICA, SENAVE, SENASAG, ICA, SAG o MGAP, según el país), el crédito agropecuario de la banca pública, privada y cooperativa, el seguro agrícola y las recomendaciones de los institutos de investigación (INTA, INIFAP, IPTA, INIA, AGROSAVIA), las universidades y los grupos técnicos de productores.\n\nREGLAS DE TRABAJO:\n1. Primero pregunta. Si faltan datos (cultivo, híbrido o variedad, estadio, hectáreas, análisis de suelo, etiqueta del producto, precios, reglas vigentes), haz como máximo 5 a 7 preguntas cortas antes de redactar. Si el usuario quiere el borrador igual, escríbelo y deja los huecos bien visibles.\n2. No inventes. Nunca des de memoria dosis de fitosanitarios o fertilizantes, tiempos de carencia o de reingreso, umbrales con números, tasas de crédito, montos de programas, primas de seguro, precios, plazos legales ni números de resolución. Las dosis, la carencia y el reingreso salen solo de la etiqueta; los niveles de nutrientes, del análisis de suelo; la recomendación de fertilización, de la referencia local que usa el usuario; las reglas y los plazos, del organismo o la entidad vigente; los precios, del usuario.\n3. Marca con claridad: dato faltante [A COMPLETAR], supuesto que tomaste [SUPUESTO], dato dudoso o que hay que confirmar en la fuente [VERIFICAR] y dato que debe salir de la etiqueta [VER ETIQUETA].\n4. Calcula paso a paso. Muestra cada cuenta (balance de nitrógeno, costo por hectárea, margen bruto, producto necesario por lote, rinde de indiferencia) para que se pueda revisar en una planilla. Usa siempre unidades: ha, kg/ha, t/ha, qq/ha, L/ha, cc/ha, ppm, USD/ha, USD/t o moneda local [A COMPLETAR]. Decimales con coma y miles con punto.\n5. Formato fácil de leer: títulos, tablas simples en formato | a | b |, pasos numerados y listas de control. Los documentos para el productor van en lenguaje llano, sin jerga.\n6. Escribe en español neutro y profesional, tuteando, como habla un agrónomo en el campo y en la oficina: directo y breve.\n7. Seguridad y normativa: cada vez que aparezcan fitosanitarios, recuerda seguir la etiqueta (dosis, carencia, reingreso, equipo de protección, distancias de resguardo, deriva, cuidado de abejas), contar con la receta agronómica donde corresponda y dejar el registro de aplicación. Para programas oficiales, crédito y seguro agrícola, recuerda confirmar las reglas y los plazos vigentes con el organismo, el banco o la aseguradora.\n8. Termina cada documento, recomendación o cálculo con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»"}]}, {"id": "B7", "ikona": "📸", "tytul": "Kit registro fotográfico y evidencias de campo", "podtytul": "Estándar de fotos por lote, guion de captura, nombres de archivo, anexo fotográfico y cuidado de los datos del productor.", "opis": "Una foto bien sacada vale más que un párrafo: respalda tu recomendación, acelera un siniestro con la aseguradora y te cubre si hay un reclamo. Este kit te da el estándar de qué fotografiar en cada visita, cómo nombrar y ordenar los archivos para encontrarlos en segundos, cómo armar el anexo fotográfico del informe con la IA y qué cuidar de los datos del productor.", "sekcje": [{"tytul": "Estándar de fotos por lote", "tekst": "En cada visita, el mínimo son 5 fotos por lote, siempre en el mismo orden:\n1. PANORÁMICA: desde la entrada del lote o un punto fijo, con el horizonte visible. Repite el mismo punto en cada visita y tendrás la evolución del cultivo.\n2. PLANTA ENTERA: una planta representativa, con una referencia de tamaño (regla, bolígrafo, mano).\n3. DETALLE DEL PROBLEMA: hoja, tallo, espiga o raíz con el síntoma, bien enfocado, a 20-30 cm. Si hay insecto, sobre una superficie clara.\n4. COMPARACIÓN: zona con problema y zona sana en la misma foto o en dos fotos seguidas.\n5. CONTEXTO: algo que explique la causa posible (bajo encharcado, borde con deriva, falla de sembradora).\n\nReglas: activa la ubicación del celular en la cámara; saca con luz pareja (evita el mediodía de frente al sol); limpia la lente; nada de zoom digital: acércate."}, {"tytul": "Guion de captura por tipo de visita", "tekst": "| Tipo de visita | Fotos clave |\n| Monitoreo de rutina | Panorámica del punto fijo, planta entera, estadio (hojas o estructura reproductiva), cualquier anomalía |\n| Conteo de plantas | Cinta o vara de medición en el surco, fallas, dobles, distancia entre surcos |\n| Plagas | Insecto en detalle, daño en la hoja, paño o trampa con el conteo visible |\n| Enfermedades | Síntoma en hoja superior, media e inferior; incidencia en el surco |\n| Malezas | Especie en detalle (hoja y tallo), estado (tamaño), densidad en un metro cuadrado |\n| Aplicación | Equipo, picos, tarjeta hidrosensible, envases con etiqueta visible, condiciones (manga de viento si hay) |\n| Siniestro (granizo, helada, viento, inundación) | Panorámica por zona, daño en planta, testigo sano, marca del agua o granizo acumulado |\n| Cosecha | Monitor de rinde, muestra de grano, pérdidas detrás de la cosechadora |\n\nTruco: antes de la primera foto del lote, saca una foto de un papel o del celular con el nombre del lote escrito. Así separas los lotes aunque se mezcle todo."}, {"tytul": "Cómo nombrar los archivos", "tekst": "Formato fijo: AAAAMMDD_PRODUCTOR_LOTE_TIPO_NN.jpg\n\nEjemplos:\n• 20261015_DonErnesto_Lote7_panoramica_01.jpg\n• 20261015_DonErnesto_Lote7_detalle-mancha_03.jpg\n• 20261102_HnosBenitez_LaLoma_granizo-testigo_05.jpg\n\nReglas:\n• Fecha al revés (año, mes, día): así el orden alfabético es el orden cronológico.\n• Sin espacios, sin tildes ni ñ en el nombre del archivo (algunos sistemas los rompen).\n• Productor y lote siempre escritos igual que en tus planillas.\n• Tipo corto y claro: panoramica, planta, detalle, comparacion, contexto, conteo, siniestro.\n\nPara renombrar rápido: pasa las fotos a la computadora y usa la función de cambiar nombre en lote del explorador de archivos o una app de renombrado. O pídele a la IA: «dame el nombre de archivo para cada una de estas 12 fotos siguiendo mi formato» y copia los nombres."}, {"tytul": "Orden de carpetas", "tekst": "Estructura en tu Drive, OneDrive o disco:\n\nAGRO / [CAMPAÑA] / [PRODUCTOR] / [LOTE] / [AAAAMMDD]_[tipo de visita]\n\nEjemplo:\nAGRO / 2026-27 / DonErnesto / Lote7 / 20261015_monitoreo\nAGRO / 2026-27 / HnosBenitez / LaLoma / 20261102_siniestro-granizo\n\nDentro de cada visita:\n• Las fotos con el nombre estándar.\n• El informe en PDF con el mismo prefijo de fecha.\n• Un archivo de texto con las notas de voz transcritas.\n\nCopia de seguridad: sincronización automática del celular a la nube solo con Wi-Fi, y una vez por mes una copia en un disco externo. Las fotos de un siniestro se guardan al menos hasta que se cierre el reclamo [VERIFICAR con la póliza]."}, {"tytul": "Armado del anexo fotográfico", "tekst": "ANEXO FOTOGRÁFICO — [PRODUCTOR] — [LOTE] — [FECHA]\nInforme asociado: [NOMBRE DEL INFORME]\n\n| N.º | Foto | Fecha y hora | Ubicación | Qué muestra | Relación con el informe |\n| 1 | [ARCHIVO] | [FECHA, HORA] | [COORDENADAS] | [DESCRIPCIÓN EN UNA LÍNEA] | [PUNTO DEL INFORME] |\n| 2 | [ARCHIVO] | [FECHA, HORA] | [COORDENADAS] | [DESCRIPCIÓN] | [PUNTO] |\n\nReglas del anexo:\n• Máximo 2 fotos por página en el PDF, con su número y pie de foto.\n• La primera foto siempre es la panorámica del lote.\n• Cada foto se cita en el informe: «ver foto 3».\n• No se edita la foto más allá de recortar o girar. Si marcas algo (una flecha, un círculo), guarda también la original.\n\nPara siniestros, agrega una foto del testigo sano por cada zona dañada y la hora exacta de cada toma."}, {"tytul": "Fotos para seguros, reclamos y certificaciones", "tekst": "Cuando la foto puede terminar en manos de un perito, un juez o un auditor:\n1. No borres los datos de ubicación ni la fecha de la foto (no la mandes por un canal que los elimine si la vas a usar como prueba: guarda el archivo original).\n2. Saca la secuencia completa: panorámica → zona → planta → detalle. Una foto suelta de una hoja no prueba nada.\n3. Incluye una referencia de tiempo: un diario del día, la pantalla del celular con la fecha o el reloj de la camioneta en la primera foto.\n4. Fotografía los testigos sin tocar y no laborees esas franjas hasta la inspección [VERIFICAR con la póliza].\n5. En deriva: fotografía el daño, el borde del lote vecino, la dirección del viento y anota fecha y hora de la aplicación del vecino si la conoces.\n6. En certificaciones de BPA: foto del depósito, de los envases con triple lavado, del equipo de protección y del registro de aplicaciones archivado."}, {"tytul": "Cuidado de los datos del productor", "tekst": "• Las fotos pueden mostrar casas, personas, patentes y maquinaria. Si el informe va a terceros (banco, aseguradora, grupo técnico), recorta o difumina lo que no hace falta.\n• No subas fotos de lotes de clientes a redes sociales sin permiso escrito del productor, aunque no se vea el nombre: los vecinos reconocen el lote.\n• Si usas la IA para describir fotos, quita los datos de ubicación de la copia que subes cuando no son necesarios para el análisis.\n• Comparte carpetas por enlace con permiso de solo lectura y con vencimiento cuando el servicio lo permita.\n• Al terminar la relación con un cliente, acuerda qué pasa con las fotos: se le entregan, se guardan por un plazo o se borran.\n• Respeta la ley de protección de datos personales de tu país [VERIFICAR] y escribe en tu propuesta de servicio cómo guardas la información."}, {"tytul": "Prompt para armar el anexo con la IA", "tekst": "Eres un ingeniero agrónomo asesor con experiencia en informes técnicos y documentación de campo. Arma el anexo fotográfico del informe de [PRODUCTOR], [LOTE], visita del [FECHA].\n\nDATOS: te paso las fotos (o su lista de nombres de archivo) y mis notas: [NOTAS DE LA VISITA].\n\nREGLAS:\n1. Si falta información, hazme como máximo 5 preguntas.\n2. Ordena las fotos: panorámica, planta, detalle, comparación, contexto.\n3. Describe solo lo que se ve; si interpretas algo (un síntoma, un daño), márcalo [VERIFICAR].\n4. No identifiques productos ni dosis por la foto de un envase: [VER ETIQUETA].\n5. Propón el nombre de archivo estándar AAAAMMDD_PRODUCTOR_LOTE_TIPO_NN para cada foto.\n\nFORMATO DE SALIDA:\nA. Tabla del anexo: N.º | archivo | fecha y hora | qué muestra | punto del informe\nB. Pie de foto de una línea para cada una\nC. Fotos que faltan para completar el estándar\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}]}, {"id": "B8", "ikona": "🌱", "tytul": "Kit bienvenida y relación con productores", "podtytul": "Primer contacto, diagnóstico inicial, plan de los primeros 90 días, calendario de contacto y mensajes de WhatsApp para mantener activo al cliente.", "opis": "Conseguir un cliente cuesta mucho más que conservarlo. Este kit ordena todo lo que pasa desde que un productor te escribe por primera vez hasta que renueva la campaña siguiente: cómo responder el primer contacto, qué preguntar en el diagnóstico, qué entregar en los primeros 90 días, cada cuánto escribir y qué decir, con mensajes listos para copiar en WhatsApp.", "sekcje": [{"tytul": "Primer contacto", "tekst": "Responde el mismo día, aunque sea para agendar. El productor que escribe a la noche está comparando con otro asesor.\n\nMENSAJE DE RESPUESTA:\n«Hola [NOMBRE], gracias por escribir. Soy [TU NOMBRE], ingeniero agrónomo, trabajo con productores de [ZONA]. Para entender bien tu situación, ¿me cuentas en dos líneas cuántas hectáreas trabajas, qué cultivos haces y qué es lo que más te preocupa esta campaña? Si te queda más cómodo, te llamo 10 minutos [DÍA] a la [HORA].»\n\nEN LA LLAMADA (15 minutos):\n1. Escucha más de lo que hablas: qué hace, qué le salió mal, qué espera de un asesor.\n2. Pregunta quién decide (él, la familia, un socio, el administrador).\n3. Propón una recorrida inicial con fecha concreta.\n4. Cierra con el próximo paso por escrito: «Te confirmo por aquí la visita del [FECHA]»."}, {"tytul": "Diagnóstico inicial", "tekst": "Cuestionario para la primera visita (llévalo en el celular y completa la planilla de cartera ahí mismo):\n\nEMPRESA\n• Hectáreas propias y arrendadas; plazos de los contratos.\n• Cultivos o actividades de las últimas 3 campañas y rindes por lote.\n• Quién hace las labores (propio o contratistas).\n\nSUELO Y MANEJO\n• Análisis de suelo disponibles (fecha, laboratorio).\n• Rotación, cultivos de cobertura, problemas conocidos (malezas resistentes, encharcamiento, compactación).\n• Cómo decide hoy la fertilización y las aplicaciones.\n\nNÚMEROS Y PAPELES\n• ¿Sabe su costo por hectárea y su rinde de indiferencia?\n• Crédito vigente o en trámite, seguro agrícola, registros oficiales al día [VERIFICAR].\n• Registro de aplicaciones y recetas: ¿existen?\n\nEXPECTATIVAS\n• ¿Qué tendría que pasar en esta campaña para que diga «valió la pena»?\n• ¿Cómo prefiere recibir la información (WhatsApp, PDF, llamada)?\n\nDespués de la visita, pega tus respuestas en la IA con el prompt de la última sección y pide el informe de diagnóstico."}, {"tytul": "Plan de los primeros 90 días", "tekst": "| Período | Qué haces | Qué recibe el productor |\n| Días 1-7 | Recorrida de reconocimiento de todos los lotes; junta mapas, rindes y análisis | Mensaje de bienvenida con el calendario de visitas |\n| Días 8-30 | Diagnóstico por lote; plan de muestreo de suelo; revisión de registros y papeles | Informe de diagnóstico inicial (máximo 3 páginas) |\n| Días 31-60 | Primeras recomendaciones con datos; presupuesto de campaña; ordenar cuaderno de campo | Plan de acción con prioridades y presupuesto |\n| Días 61-90 | Seguimiento de lo acordado; primer «resultado visible» (un problema resuelto, un costo bajado, un papel al día) | Informe de los 90 días: qué hicimos, qué cambió, qué sigue |\n\nLa regla de los 90 días: el productor tiene que poder contarle a otro algo concreto que cambió gracias a ti. Elige ese resultado en la primera semana y trabaja para que llegue.\nReunión de los 90 días: 30 minutos, con el informe impreso o en el celular, y la pregunta «¿qué te gustaría que hagamos distinto?»."}, {"tytul": "Calendario de contacto durante el año", "tekst": "| Momento | Contacto | Objetivo |\n| Antes de la siembra | Llamada + plan de campaña | Acordar materiales, fertilización y presupuesto |\n| En el ciclo del cultivo | Informe después de cada visita (24 h) | Que vea el trabajo |\n| Cada 15 días | Mensaje corto aunque no haya visita | Que no se enfríe la relación |\n| Eventos (granizo, helada, plaga en la zona) | Mensaje el mismo día | Mostrar que estás atento |\n| Fin de mes | Informe mensual | Ordenar decisiones y pendientes |\n| Cosecha | Visita o llamada con el monitor de rinde | Celebrar o explicar resultados |\n| Cierre de campaña | Informe y reunión de planificación | Renovar |\n| Fechas personales | Saludo de cumpleaños o fin de año | Relación humana |\n\nCarga estas fechas en la planilla de pendientes (bono 1) con alerta. Lo que no está agendado, no pasa."}, {"tytul": "Mensajes de WhatsApp para copiar", "tekst": "1. BIENVENIDA: «[NOMBRE], bienvenido. A partir de hoy te voy a mandar un informe después de cada visita por este medio. La primera recorrida es el [FECHA]. Cualquier cosa que veas en el campo, mándame una foto con el nombre del lote.»\n\n2. DESPUÉS DE LA VISITA: «Te dejo el informe de hoy del [LOTE]. Lo importante: [UNA LÍNEA]. Próxima visita: [FECHA].»\n\n3. ALERTA DE ZONA: «[NOMBRE], en la zona están apareciendo [PLAGA O ENFERMEDAD]. Mañana paso a mirar [LOTE]. Por ahora no hace falta hacer nada.»\n\n4. DESPUÉS DE UN EVENTO: «Vi que cayó piedra en [ZONA]. ¿Cómo quedaron los lotes? Si quieres, paso hoy y armamos las fotos para el seguro.»\n\n5. RECORDATORIO DE PAPELES: «Te recuerdo que [TRÁMITE] vence el [FECHA — VERIFICAR]. ¿Necesitas que te ayude a juntar algo?»\n\n6. RESULTADO: «Buenas noticias del [LOTE]: [RESULTADO CONCRETO]. Esto lo logramos porque [ACCIÓN].»\n\n7. PEDIDO DE DATOS: «Para cerrar el presupuesto necesito [DATO]. ¿Me lo mandas cuando puedas? Una foto de la factura sirve.»\n\n8. CUMPLEAÑOS O FIN DE AÑO: «Feliz [OCASIÓN], [NOMBRE]. Gracias por la confianza en esta campaña.»\n\n9. ANTES DE LA RENOVACIÓN: «[NOMBRE], se viene la planificación de la próxima campaña. ¿Te parece que nos juntemos el [FECHA] a ver los números de este año?»\n\n10. PEDIDO DE RECOMENDACIÓN: «Me alegra que haya funcionado. Si conoces a otro productor al que le pueda servir, te agradezco si le pasas mi número.»"}, {"tytul": "Recuperar a un cliente que se enfrió", "tekst": "Señales: no responde los informes, cancela visitas, paga tarde, compra sin consultarte.\n\nQué hacer:\n1. Llama, no escribas. Pregunta directo: «Te noto con menos tiempo para lo nuestro. ¿Hay algo que no te está sirviendo?».\n2. Escucha sin defenderte. Anota la causa real: precio, frecuencia, un resultado que salió mal, un cambio en la familia o en la empresa.\n3. Propón un ajuste concreto: menos visitas, otro formato de informe, foco en un solo problema.\n4. Fija una fecha de revisión: «Probemos así hasta [FECHA] y vemos».\n\nMENSAJE SI NO ATIENDE:\n«[NOMBRE], hace un tiempo que no hablamos. Quiero asegurarme de que el servicio te sigue sirviendo. ¿Tienes 10 minutos esta semana para que me cuentes cómo lo ves? Si prefieres otro esquema, lo ajustamos.»\n\nSi se va, despídete bien: entrega su información ordenada, agradece y deja la puerta abierta. Muchos vuelven a la campaña siguiente."}, {"tytul": "Renovación de la campaña", "tekst": "La renovación se gana durante la campaña, no al final. Pasos:\n1. Un mes antes del cierre, prepara el informe de campaña con resultados por lote y lo que cambió desde que empezaron a trabajar juntos.\n2. Reunión de cierre: presenta resultados (bono 2, presentación), escucha qué mejorar y muestra el plan de la próxima campaña.\n3. Lleva la propuesta de renovación impresa o en PDF, con el alcance ajustado y el
