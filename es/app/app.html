ensidad de siembra | monitoreo de chinches |\n| La Loma | [A COMPLETAR] | [A COMPLETAR] | receta de herbicida | [A COMPLETAR] |\n| El Bajo | [A COMPLETAR] | escapes de rama negra | — | evaluar control [VERIFICAR] |\n| maíz [A COMPLETAR: lote] | maíz | V6, cogollero bajo umbral | monitoreo | decidir fertilización |\n\nPLAN DE DICIEMBRE\n1. Monitoreo de chinches en soja.\n2. Decisión de fertilización del maíz, con el análisis de suelo disponible.\n3. Definir qué hacer con la rama negra en El Bajo.\n\nPENDIENTES\n| pendiente | responsable |\n| análisis de suelo del Lote 9 | laboratorio; lo sigo yo |\n| factura del contratista | Ernesto |\n\nLas aplicaciones del mes se hicieron con receta; dosis según receta y etiqueta [VER ETIQUETA].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "4.06", "nazwa": "Jornada a campo y recorrida de ensayos", "tag": "JORNADA A CAMPO", "co_robi": "Planifica una jornada a campo de principio a fin: invitación, programa por estación, puntos a explicar en cada parcela, lista de logística y seguimiento posterior. Hace que la jornada se vea profesional y que los asistentes terminen siendo clientes.", "kiedy": "Unas semanas antes de mostrar un ensayo, cuando una semillera o una cooperativa te propone hacer una jornada o cuando quieres presentarte ante productores nuevos.", "brief": [{"pole": "Objetivo y anfitrión", "opis": "Para qué y quién organiza, por ejemplo “mostrar el ensayo de híbridos de maíz y conseguir clientes nuevos; anfitrión Rancho Los Álamos con apoyo de una semillera”."}, {"pole": "Lugar y fecha", "opis": "Dónde y cuándo, por ejemplo “Espinal, Tolima, finca del productor, sábado 8 de marzo, de 8 a 12”."}, {"pole": "Parcelas y tratamientos", "opis": "Qué se va a mostrar, por ejemplo “6 híbridos en franjas, 2 densidades, una franja sin fertilizar”."}, {"pole": "Asistentes", "opis": "Quiénes y cuántos, por ejemplo “unos 50 productores de maíz y arroz de la zona, más técnicos de la cooperativa”."}, {"pole": "Logística y presupuesto", "opis": "Recursos y monto, por ejemplo “carpa, sonido y refrigerio; presupuesto 1.500 USD que pone la semillera”."}, {"pole": "Disertantes y programa", "opis": "Quién habla y de qué, por ejemplo “yo con los resultados del ensayo; el técnico de la semillera con sanidad”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia en extensión que organiza jornadas a campo para productores. Planifica esta jornada.\n\nDATOS:\nObjetivo y anfitrión: [OBJETIVO Y ANFITRIÓN]\nLugar y fecha: [LUGAR Y FECHA]\nParcelas y tratamientos: [PARCELAS Y TRATAMIENTOS]\nAsistentes: [ASISTENTES]\nLogística y presupuesto: [LOGÍSTICA Y PRESUPUESTO]\nDisertantes y programa: [DISERTANTES Y PROGRAMA]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes honorarios, tarifas, precios, plazos legales, normas, datos del productor ni resultados. Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo los datos del ensayo que te doy; no adelantes resultados ni rindes que todavía no tengo.\n4. Arma un programa con horarios realistas: llegada, bienvenida, estaciones, cierre y refrigerio.\n5. Para cada estación, escribe tres puntos para explicar y una pregunta para hacerle al público.\n6. Incluye una lista de logística completa: acceso, estacionamiento, sombra, agua, baños, cartelería de parcelas, seguridad y plan con lluvia.\n7. Si se habla de productos, recuerda la etiqueta y la receta; nada de recomendar dosis en la jornada.\n8. Propón cómo registrar asistentes y el seguimiento posterior.\n\nFORMATO DE SALIDA:\nA) Invitación para WhatsApp y para imprimir.\nB) Programa | hora | estación | quién | contenido |.\nC) Lista de logística y presupuesto.\nD) Plan de seguimiento a los asistentes y lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Escribe los carteles de cada parcela.", "Arma la planilla de registro de asistentes.", "Prepara un folleto de una página con el ensayo.", "Escribe el mensaje de agradecimiento para mandar al día siguiente.", "Agrega un plan alternativo por si llueve.", "Prepara las respuestas a preguntas difíciles sobre los resultados.", "Arma una encuesta corta para el final.", "Escribe la nota para la radio local o la revista de la zona.", "Arma el informe para la semillera después de la jornada.", "Reduce el programa a dos horas."], "checklista": ["El ensayo tiene un diseño que se puede explicar en dos minutos.", "Los carteles de parcelas están listos y son legibles.", "La logística cubre agua, sombra, baños y plan con lluvia.", "Hay registro de asistentes con permiso para contactarlos.", "No se muestran resultados que todavía no tienes.", "El seguimiento está agendado."], "uwaga": "Una jornada se mide por los productores que te llaman después, no por la cantidad de gente. Mostrar un ensayo sin datos de rinde es válido si se dice claramente en qué etapa está.", "przyklad": {"wejscie": "Quiero armar una jornada en Espinal, Tolima, en la finca de Rancho Los Álamos, el sábado 8 de marzo de 8 a 12. Mostramos el ensayo de híbridos de maíz: 6 híbridos en franjas, dos densidades y una franja sin fertilizar. El rinde todavía no lo tenemos, se cosecha en un mes. Esperamos unos 50 productores de maíz y arroz y técnicos de la cooperativa. La semillera pone 1.500 dólares para carpa, sonido y refrigerio. Hablo yo del ensayo y el técnico de la semillera de sanidad. Lo que quiero es conseguir clientes nuevos.", "wynik": "JORNADA A CAMPO: ensayo de híbridos de maíz, Espinal, Tolima\n\nA) INVITACIÓN\n«Jornada a campo: ensayo de híbridos de maíz. Sábado 8 de marzo, 8 a 12 h, finca Rancho Los Álamos, Espinal. Seis híbridos, dos densidades y una franja sin fertilizar. Confirma tu asistencia a este número. Hay refrigerio.»\n\nB) PROGRAMA\n| hora | estación | quién | contenido |\n| 8:00 | llegada | equipo | registro y café |\n| 8:30 | bienvenida | anfitrión y yo | objetivo del ensayo y diseño |\n| 9:00 | estación 1 | yo | los 6 híbridos: qué mirar en cada franja |\n| 9:45 | estación 2 | yo | densidades: qué se busca medir |\n| 10:30 | estación 3 | técnico de la semillera | sanidad del cultivo |\n| 11:15 | franja sin fertilizar | yo | cuánto aporta el fertilizante (se mide a cosecha) |\n| 11:45 | cierre | todos | preguntas y refrigerio |\n\nEstación 1, puntos: diseño en franjas; qué características comparar; cuándo habrá rinde. Pregunta al público: ¿qué miran ustedes al elegir un híbrido?\n\nC) LOGÍSTICA\nCarpa, sonido, refrigerio (1.500 USD) [A COMPLETAR: reparto]; cartelería de franjas; agua y sombra; baños [A COMPLETAR]; estacionamiento; plan con lluvia: charla bajo carpa.\n\nD) SEGUIMIENTO\nRegistro con nombre, teléfono y hectáreas. A la semana: agradecimiento. Al mes: resultados de cosecha a los inscriptos y oferta de una visita.\n\n[VERIFICAR] fecha de cosecha para comprometer el envío de resultados.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "4.07", "nazwa": "Conversación difícil: reclamo, aplicación fallida, pago atrasado", "tag": "CONVERSACIÓN DIFÍCIL", "co_robi": "Te prepara para una charla difícil con un productor: un reclamo, una aplicación que no funcionó, un pago atrasado. Separa hechos de opiniones, te arma la apertura, anticipa objeciones y redacta el mensaje que deja todo por escrito.", "kiedy": "Cuando el productor te llama enojado porque «el herbicida no hizo nada», cuando una factura lleva dos meses sin pagarse o antes de una reunión que preferirías no tener.", "brief": [{"pole": "Tipo de situación", "opis": "Qué pasó, por ejemplo “reclamo por un herbicida que no controló bien el yuyo colorado”."}, {"pole": "Hechos y fechas", "opis": "Lo comprobable, por ejemplo “receta del 8/11; aplicó el contratista el 10/11 con viento; a los 20 días hay rebrote en el Lote 3”."}, {"pole": "Postura del cliente", "opis": "Lo que dice el productor, por ejemplo “Jorge Ferreyra dice que la receta estaba mal y quiere que no le cobre el mes”."}, {"pole": "Mi postura", "opis": "Lo que piensas tú, por ejemplo “la receta era correcta; creo que fue el momento de aplicación y el tamaño de las malezas”."}, {"pole": "Relación y lo que está en juego", "opis": "Qué vale la relación, por ejemplo “cliente de 5 años, 900 ha en Paysandú, me recomendó a otros dos”."}, {"pole": "Objetivo de la conversación", "opis": "Qué quieres lograr, por ejemplo “aclarar las causas sin pelear, acordar un plan de control y cobrar el mes”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que sabe manejar reclamos de productores con calma y con hechos. Prepárame para esta conversación.\n\nDATOS:\nTipo de situación: [TIPO DE SITUACIÓN]\nHechos y fechas: [HECHOS Y FECHAS]\nPostura del cliente: [POSTURA DEL CLIENTE]\nMi postura: [MI POSTURA]\nRelación y lo que está en juego: [RELACIÓN Y LO QUE ESTÁ EN JUEGO]\nObjetivo de la conversación: [OBJETIVO DE LA CONVERSACIÓN]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes honorarios, tarifas, precios, plazos legales, normas, datos del productor ni resultados. Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Separa con claridad hechos comprobables, opiniones del cliente y mis opiniones.\n4. No des por probada ninguna causa técnica: plantea hipótesis y qué dato las confirmaría [VERIFICAR] (registro de la aplicación, condiciones del día, estado de las malezas, etiqueta del producto).\n5. No admitas ni atribuyas responsabilidad legal; si hay riesgo de reclamo formal, sugiere consultar con un abogado o con el seguro profesional.\n6. Escribe una apertura de tres frases, en tono respetuoso y firme.\n7. Anticipa tres objeciones con su respuesta y propone dos salidas posibles.\n8. Redacta el mensaje escrito posterior que resume lo acordado.\n\nFORMATO DE SALIDA:\nA) Mapa de la situación: hechos, opiniones del cliente, mis opiniones, datos que faltan.\nB) Apertura y guion de la conversación.\nC) Objeciones | lo que puede decir | cómo responder |.\nD) Mensaje escrito posterior y lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Prepárame para la versión por teléfono.", "Escribe la conversación para un pago atrasado de tres meses.", "Arma la lista de datos a pedirle al contratista.", "Propón un plan de control para el rebrote con los productos que me deja la etiqueta.", "Haz el mensaje más corto y más firme.", "Escribe qué decir si el productor amenaza con irse.", "Arma un acuerdo de pago en cuotas para mandarle.", "Ayúdame a decidir si conviene ceder en el cobro.", "Prepara la conversación con el contratista que aplicó.", "Escribe una nota interna con lo aprendido para no repetirlo."], "checklista": ["Tienes la receta, la fecha y el registro de la aplicación.", "Sabes las condiciones del día (viento, temperatura, humedad) si las hay registradas.", "Separaste hechos de opiniones antes de hablar.", "Tienes claro qué estás dispuesto a ceder y qué no.", "La conversación termina con un acuerdo escrito.", "Si hay riesgo legal, consultaste antes con un abogado o tu seguro."], "uwaga": "En un reclamo técnico, el registro manda: receta, etiqueta, condiciones de aplicación y fechas. Si no hay registro, el primer acuerdo es empezar a llevarlo.", "przyklad": {"wejscie": "Tengo un lío con Jorge Ferreyra, 900 hectáreas en Paysandú, es cliente hace cinco años y me recomendó a otros dos. Le hice una receta de herbicida el 8 de noviembre para el Lote 3, aplicó el contratista el 10 y ese día había viento. A los 20 días hay rebrote de yuyo colorado. Jorge dice que la receta estaba mal y quiere que no le cobre el mes. Yo creo que la receta estaba bien, que fue el momento y que el yuyo ya estaba grande. Quiero aclarar sin pelear, acordar cómo seguimos con el control y cobrar el mes. Me junto con él el viernes.", "wynik": "CONVERSACIÓN DIFÍCIL: Jorge Ferreyra, Lote 3, Paysandú\n\nA) MAPA\n| tipo | contenido |\n| hechos | receta del 8/11; aplicación del contratista el 10/11; rebrote de yuyo colorado a los 20 días |\n| opinión del cliente | la receta estaba mal |\n| mi opinión | momento de aplicación y tamaño de malezas |\n| datos que faltan | velocidad del viento registrada [A COMPLETAR]; tamaño de las malezas al aplicar [A COMPLETAR]; caudal y pastillas usadas [A COMPLETAR]; etiqueta: malezas y tamaños que controla [VER ETIQUETA] |\n\nB) APERTURA\n«Jorge, entiendo la bronca: el lote no quedó como esperábamos. Quiero que veamos juntos qué pasó, con los datos de la receta y de la aplicación. Y quiero que salgamos de acá con un plan para el Lote 3.»\n\nC) OBJECIONES\n| lo que puede decir | cómo responder |\n| «la receta estaba mal» | «Revisemos la etiqueta y la receta juntos; si hay un error mío, lo asumo.» |\n| «el contratista hace bien su trabajo» | «No culpo a nadie; pidamos el registro del día para ver condiciones.» |\n| «este mes no te pago» | «El seguimiento del mes se hizo. Veamos cómo resolver el lote sin cortar el trabajo.» |\n\nSalidas posibles: 1) plan de control del rebrote sin costo de visita extra; 2) cobrar el mes con un plazo más largo [A COMPLETAR].\n\nD) MENSAJE POSTERIOR\n«Jorge, gracias por la charla. Acordamos: [A COMPLETAR: plan de control], pedir al contratista el registro del 10/11 y el pago del mes el [A COMPLETAR: fecha]. Cualquier cosa, me avisas.»\n\n[VERIFICAR] la causa sigue siendo una hipótesis hasta tener el registro de la aplicación.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "4.08", "nazwa": "Charla técnica y capacitación para productores", "tag": "CAPACITACIÓN", "co_robi": "Arma una charla o capacitación para productores: guion de diapositivas, notas para el orador, ejemplos de campo, preguntas frecuentes y un cierre que invita a trabajar contigo sin vender. Práctica, basada en tus fuentes y lo bastante corta para que nadie mire el celular.", "kiedy": "Cuando una cooperativa, una agronomía o un grupo de productores te invita a dar una charla, o cuando quieres hacer tu propia reunión de presentación.", "brief": [{"pole": "Tema", "opis": "De qué hablas, por ejemplo “cómo leer un análisis de suelo para decidir la fertilización”."}, {"pole": "Público", "opis": "Quién escucha, por ejemplo “30 productores de maíz y sorgo de una cooperativa en Guanajuato, poco técnicos”."}, {"pole": "Duración y formato", "opis": "Cuánto y cómo, por ejemplo “40 minutos con proyector y 15 de preguntas”."}, {"pole": "Mensaje clave", "opis": "Lo único que tienen que llevarse, por ejemplo “sin análisis no hay plan de fertilización, hay costumbre”."}, {"pole": "Material de base", "opis": "Tus fuentes, por ejemplo “un análisis real de un productor de la zona (sin nombre), guías del INIFAP que te paso”."}, {"pole": "Objetivo comercial", "opis": "Qué quieres después, por ejemplo “que 5 productores me pidan un muestreo”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que da charlas técnicas prácticas para productores. Arma esta capacitación.\n\nDATOS:\nTema: [TEMA]\nPúblico: [PÚBLICO]\nDuración y formato: [DURACIÓN Y FORMATO]\nMensaje clave: [MENSAJE CLAVE]\nMaterial de base: [MATERIAL DE BASE]\nObjetivo comercial: [OBJETIVO COMERCIAL]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes cifras, umbrales, dosis, precios ni recomendaciones. Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo el material que te doy; no cites cifras, umbrales, dosis ni recomendaciones de memoria. Donde haga falta un dato, pon [A COMPLETAR] y dime de qué fuente sacarlo.\n4. Máximo una idea por diapositiva y 12 diapositivas para 40 minutos.\n5. Incluye un ejemplo real de campo cada tres diapositivas.\n6. Escribe notas para el orador en lenguaje hablado, no leído.\n7. Prepara las cinco preguntas más probables con respuestas que remitan a la etiqueta, al análisis o al organismo oficial cuando corresponda.\n8. El cierre invita a un próximo paso concreto, sin tono de venta.\n\nFORMATO DE SALIDA:\nA) Guion | diapositiva | título | contenido | nota para el orador |.\nB) Ejemplos de campo y actividad práctica.\nC) Preguntas frecuentes con respuesta.\nD) Cierre, próximo paso y lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Reduce la charla a 20 minutos.", "Agrega una actividad práctica con un análisis impreso.", "Escribe la invitación para la cooperativa.", "Prepara una hoja para llevarse a casa.", "Adapta la charla para técnicos en lugar de productores.", "Agrega una encuesta de cierre de tres preguntas.", "Escribe el guion de un video corto con el mismo tema.", "Arma la versión para una charla por videollamada.", "Prepara respuestas a preguntas incómodas sobre precios de fertilizantes.", "Escribe el mensaje de seguimiento a los asistentes."], "checklista": ["Cada dato de la charla tiene fuente (tu material o el organismo oficial).", "No hay dosis ni recomendaciones de memoria.", "Hay ejemplos de la zona y del cultivo del público.", "El tiempo está calculado con espacio para preguntas.", "El mensaje clave se repite al principio y al final.", "Hay un próximo paso concreto y un registro de interesados."], "uwaga": "La mejor charla es la que el productor puede aplicar el lunes. Si usas datos de otro productor, pide permiso y quita el nombre.", "przyklad": {"wejscie": "Me invitó una cooperativa de Guanajuato a dar una charla. Son unos 30 productores de maíz y sorgo, gente de campo, no muy técnica. Tengo 40 minutos con proyector y 15 de preguntas. El tema: cómo leer un análisis de suelo para decidir la fertilización. Lo que quiero que se lleven es que sin análisis no hay plan, hay costumbre. Tengo un análisis real de un productor de la zona que puedo mostrar sin el nombre, y las guías del INIFAP que te paso. Si de ahí salen cinco productores pidiéndome un muestreo, me doy por bien pagado.", "wynik": "CAPACITACIÓN: cómo leer un análisis de suelo, cooperativa de Guanajuato (40 + 15 min)\n\nA) GUION (extracto)\n| # | título | contenido | nota para el orador |\n| 1 | Sin análisis hay costumbre | mensaje clave | «¿Cuántos compraron el mismo fertilizante que el año pasado?» |\n| 2 | Qué trae un análisis | pH, MO %, P, N-nitratos, CIC | «No hace falta saber química, hace falta saber dónde mirar.» |\n| 3 | Un análisis real de la zona | foto del análisis sin nombre | recorrer valor por valor |\n| 4 | Cómo se toma una buena muestra | profundidad, submuestras, mapa | errores comunes de muestreo |\n| 5 | De la hoja al plan | relación análisis → dosis | dosis según guías del INIFAP [A COMPLETAR] |\n| … | … | … | … |\n| 12 | Sin análisis hay costumbre | repetición del mensaje | invitación a muestrear |\n\nB) ACTIVIDAD\nCada productor recibe el análisis impreso y marca dos valores que le llamen la atención.\n\nC) PREGUNTAS FRECUENTES\n• ¿Cada cuánto analizo? → según la guía regional [A COMPLETAR: fuente del INIFAP].\n• ¿Qué fertilizante compro? → depende del análisis y del rinde objetivo de cada parcela; no hay receta general.\n• ¿Cuánto cuesta el análisis? → [A COMPLETAR: precio del laboratorio].\n\nD) CIERRE\n«Si quieren que muestreemos su parcela antes de la siembra, déjenme su nombre en la planilla.» Meta: 5 muestreos.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "4.09", "nazwa": "Cómo fijar tus honorarios de asesoramiento", "tag": "HONORARIOS", "co_robi": "Calcula el honorario por hectárea, el abono mensual o el valor por hora que necesitas a partir de tus costos, tus horas y tu meta de ingresos. Muestra la cuenta paso a paso y la compara con los valores de mercado que tú aportes; nunca inventa una tarifa de mercado.", "kiedy": "Cuando empiezas a trabajar por tu cuenta, cuando te piden presupuesto y no sabes qué cobrar, o cuando sientes que trabajas mucho y no te queda nada.", "brief": [{"pole": "Costos fijos", "opis": "Gastos anuales de tu actividad, por ejemplo “matrícula y colegio 300, celular 600, programas 1.200, contador 1.000, seguro 1.500 USD por año”."}, {"pole": "Camioneta y viajes", "opis": "Costos del vehículo, por ejemplo “cuota 7.200 USD por año, combustible 6.000 USD por año, mantenimiento no lo tengo”."}, {"pole": "Tiempo de trabajo", "opis": "Horas facturables por año, por ejemplo “1.400 horas facturables, contando viajes e informes”."}, {"pole": "Servicio a cotizar", "opis": "Qué y cuánto tiempo lleva, por ejemplo “seguimiento de cultivos: 1 hora cada 100 ha por visita, 12 visitas por campaña”."}, {"pole": "Meta de ingresos", "opis": "Lo que quieres ganar por año, por ejemplo “36.000 USD por año limpios”."}, {"pole": "Mercado y competencia", "opis": "Lo que sabes de la zona, por ejemplo “en Río Cuarto se cobra por hectárea, pero no tengo valores”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que armó un asesoramiento rentable y ayuda a colegas a ponerle precio a su trabajo con honestidad. Ayúdame a calcular mis honorarios.\n\nDATOS:\nCostos fijos: [COSTOS FIJOS]\nCamioneta y viajes: [CAMIONETA Y VIAJES]\nTiempo de trabajo: [TIEMPO DE TRABAJO]\nServicio a cotizar: [SERVICIO A COTIZAR]\nMeta de ingresos: [META DE INGRESOS]\nMercado y competencia: [MERCADO Y COMPETENCIA]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes tarifas de mercado, honorarios de referencia, costos de vehículo, sueldos ni alícuotas de impuestos. Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Muestra cada cálculo paso a paso: costos anuales totales, ingreso necesario, costo por hora facturable y después por hectárea y por visita.\n4. Convierte a honorario por hectárea con la superficie y la frecuencia de visitas que te doy; cualquier supuesto sobre horas por hectárea va [SUPUESTO].\n5. Arma tres escenarios: solo cubrir costos, mi meta, y meta más un colchón para un mal año (el colchón lo doy yo o queda [A COMPLETAR]).\n6. Si te doy valores de colegas, compáralos; si no, dime qué datos necesito y dónde conseguirlos (colegas, consejo o colegio profesional, grupos técnicos) [VERIFICAR].\n7. Impuestos y aportes: que los confirme con mi contador; no calcules alícuotas.\n\nFORMATO DE SALIDA:\nA) Tabla de costos | costo | por año |.\nB) Cálculo paso a paso a honorario por hora, por hectárea y por visita.\nC) Escenarios | escenario | ingreso necesario | por ha | por hora |.\nD) Recomendación corta, qué revisar y preguntas para el contador.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Calcula un abono mensual fijo en lugar de por hectárea.", "Agrega el costo de mantenimiento de la camioneta que te paso.", "Simula que consigo 2.000 ha más de clientes.", "Calcula cuánto cobrar por una visita suelta de diagnóstico.", "Arma un honorario distinto para productores chicos.", "Compara con los valores de colegas que te paso.", "Calcula cuántas hectáreas necesito para llegar a mi meta.", "Agrega vacaciones y días de lluvia a las horas facturables.", "Escribe cómo explicarle el honorario a un productor que pregunta.", "Arma la tabla para pegarla en una planilla de cálculo."], "checklista": ["Todos tus costos anuales están cargados, incluido el vehículo completo.", "Las horas facturables son realistas (viajes, informes, días perdidos).", "La meta de ingresos es antes o después de impuestos, y está claro cuál.", "Los supuestos de horas por hectárea están marcados.", "Los valores de mercado salen de fuentes reales, no de la IA.", "El contador revisó impuestos y aportes."], "uwaga": "Cobrar poco no te hace más competitivo, te deja sin tiempo para hacer bien el trabajo. La cuenta te dice el piso; el valor que aportas define cuánto puedes cobrar arriba de ese piso.", "przyklad": {"wejscie": "Quiero ver cuánto cobrar. Estoy en Río Cuarto, trabajo solo. Costos por año: matrícula y colegio 300 dólares, celular 600, programas 1.200, contador 1.000, seguro 1.500. La camioneta: cuota 7.200 por año, combustible unos 6.000, el mantenimiento no lo tengo calculado. Calculo 1.400 horas facturables por año contando viajes e informes. Lo que quiero cotizar es seguimiento de cultivos: más o menos una hora cada 100 hectáreas por visita, 12 visitas por campaña. Quiero ganar 36 mil dólares limpios por año. En la zona se cobra por hectárea, pero no sé cuánto.", "wynik": "A) COSTOS\n| costo | por año |\n| matrícula y colegio | 300 USD |\n| celular | 600 USD |\n| programas | 1.200 USD |\n| contador | 1.000 USD |\n| seguro | 1.500 USD |\n| cuota de la camioneta | 7.200 USD |\n| combustible | 6.000 USD |\n| mantenimiento | [A COMPLETAR] |\n| total conocido | 17.800 USD |\n\nB) CÁLCULO\n1. Ingreso necesario = 17.800 + 36.000 = 53.800 USD\n2. Por hora facturable = 53.800 ÷ 1.400 = 38,43 USD/h\n3. Horas por hectárea por campaña = (1 h ÷ 100 ha) × 12 visitas = 0,12 h/ha [SUPUESTO: incluye viajes e informes]\n4. Por hectárea = 0,12 × 38,43 = 4,61 USD/ha por campaña\n5. Superficie que puedes atender = 1.400 ÷ 0,12 = 11.667 ha [SUPUESTO: todas las horas van a este servicio]\n6. Por visita cada 100 ha = 1 h × 38,43 = 38,43 USD\n\nC) ESCENARIOS\n| escenario | ingreso necesario | por ha | por hora |\n| solo costos | 17.800 USD | 1,53 USD | 12,71 USD |\n| meta | 53.800 USD | 4,61 USD | 38,43 USD |\n| meta + colchón | [A COMPLETAR] | [A COMPLETAR] | [A COMPLETAR] |\n\nD) PRÓXIMOS PASOS\n• Conseguir valores por hectárea de colegas o del colegio profesional de la zona [VERIFICAR].\n• Para llegar a la meta necesitas facturar 53.800 USD: a 4,61 USD/ha son 11.670 ha en cartera.\n• Al contador: impuestos, aportes y si los 36.000 USD son antes o después de impuestos.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "4.10", "nazwa": "Seguimiento de propuestas y crecimiento de cartera", "tag": "CARTERA", "co_robi": "Escribe la secuencia de seguimiento para una propuesta que quedó sin respuesta, te da respuestas honestas a las objeciones más comunes (incluida «el agrónomo de la agronomía me lo hace gratis») y arma un plan simple para hacer crecer tu cartera de productores.", "kiedy": "Cuando mandaste una propuesta hace semanas y el productor no contesta, o cuando quieres sumar clientes para la próxima campaña sin depender del boca en boca.", "brief": [{"pole": "Mi rol y oferta", "opis": "Qué haces y cómo cobras, por ejemplo “agrónomo independiente, seguimiento de cultivos por hectárea, sin venta de insumos”."}, {"pole": "Propuesta enviada", "opis": "Qué mandaste y cuándo, por ejemplo “propuesta de 5 USD/ha por campaña, enviada hace tres semanas”."}, {"pole": "Cliente e historial", "opis": "Quién es y qué pasó, por ejemplo “Hnos. Benítez, 800 ha en Canindeyú; la charla fue buena, después silencio”."}, {"pole": "Cartera actual", "opis": "Tus clientes hoy, por ejemplo “6 productores, 4.500 ha, casi todos por recomendación”."}, {"pole": "Metas de crecimiento", "opis": "Adónde quieres llegar, por ejemplo “3 productores nuevos y 2.000 ha más antes de la siembra”."}, {"pole": "Obstáculos", "opis": "Lo que te frena, por ejemplo “la agronomía del pueblo asesora gratis si compras los insumos ahí”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que hizo crecer su cartera de productores sin presionar a nadie. Ayúdame con el seguimiento y el crecimiento.\n\nDATOS:\nMi rol y oferta: [MI ROL Y OFERTA]\nPropuesta enviada: [PROPUESTA ENVIADA]\nCliente e historial: [CLIENTE E HISTORIAL]\nCartera actual: [CARTERA ACTUAL]\nMetas de crecimiento: [METAS DE CRECIMIENTO]\nObstáculos: [OBSTÁCULOS]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes resultados, ahorros, precios de la competencia ni datos del productor. Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Escribe una secuencia de tres mensajes con días sugeridos: cada uno aporta algo útil y no repite el anterior.\n4. Responde las objeciones con honestidad: nunca desprestigies a la agronomía, a la cooperativa ni a colegas.\n5. Explica el valor del asesoramiento independiente con argumentos, no con números que yo no te di; si quiero mostrar resultados, usa solo mis casos.\n6. Arma un plan de 90 días con acciones semanales concretas y medibles.\n7. Respeta al productor que dice que no: incluye un mensaje de cierre amable que deje la puerta abierta.\n\nFORMATO DE SALIDA:\nA) Secuencia de seguimiento | día | canal | mensaje |.\nB) Objeciones | lo que dice | cómo responder |.\nC) Plan de 90 días | semana | acción | meta |.\nD) Indicadores a medir y lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Escribe un mensaje para pedir recomendaciones a mis clientes actuales.", "Prepara una charla corta para la cooperativa como forma de conseguir clientes.", "Arma un caso de éxito con los datos que te paso de un cliente.", "Escribe la respuesta si me dice que lo va a pensar hasta después de la cosecha.", "Propón una oferta de entrada: una visita de diagnóstico.", "Arma una planilla simple para seguir prospectos.", "Escribe el mensaje para retomar contacto con un ex cliente.", "Prepara la presentación de un minuto de mi servicio.", "Haz una lista de lugares donde están los productores que busco.", "Escribe el mensaje de cierre si dice que no."], "checklista": ["Cada mensaje de seguimiento aporta algo, no solo pregunta «¿y?».", "No hay críticas a la competencia.", "Los resultados que muestras son reales y con permiso del cliente.", "El plan de 90 días tiene metas medibles.", "Llevas un registro de propuestas y respuestas.", "Hay un mensaje de cierre para los que dicen que no."], "uwaga": "El seguimiento no es insistir: es ayudar a decidir. Un productor que hoy dice que no puede volver en dos campañas si lo trataste bien.", "przyklad": {"wejscie": "Le mandé hace tres semanas una propuesta a Hnos. Benítez, 800 hectáreas en Canindeyú. La charla fue muy buena, pero después silencio. Les cobro 5 dólares la hectárea por campaña, soy independiente, no vendo insumos. Hoy tengo 6 productores, 4.500 hectáreas, casi todo por recomendación. Quiero sumar 3 productores y 2.000 hectáreas antes de la siembra. Lo que más me frena es que la agronomía del pueblo asesora gratis si les compras los insumos. ¿Cómo hago el seguimiento sin quedar como pesado y cómo crezco?", "wynik": "A) SEGUIMIENTO: Hnos. Benítez\n| día | canal | mensaje |\n| 0 | WhatsApp | «Hola, ¿pudieron ver la propuesta? Si quieren la repasamos en 15 minutos en el campo.» |\n| 7 | WhatsApp | «Les comparto algo útil: qué conviene revisar en los lotes antes de la siembra [A COMPLETAR: tu consejo]. Sin compromiso.» |\n| 14 | llamada | preguntar si la decisión sigue abierta y qué les falta para decidir |\n| 21 | WhatsApp | cierre amable: «Entiendo si no es el momento. Quedo a disposición para la próxima campaña.» |\n\nB) OBJECIONES\n| lo que dice | cómo responder |\n| «la agronomía me asesora gratis» | «Está bien que te asesoren. La diferencia es que yo no vendo insumos: mi recomendación no depende de qué producto se vende.» |\n| «es caro» | «Veámoslo por hectárea: 5 USD/ha. ¿Qué parte del gasto en insumos podemos revisar juntos?» |\n| «lo pensamos después de la cosecha» | «Perfecto. ¿Les parece si los llamo el [A COMPLETAR: fecha]?» |\n\nC) PLAN DE 90 DÍAS\n| semanas | acción | meta |\n| 1-2 | pedir recomendaciones a los 6 clientes actuales | 6 contactos nuevos |\n| 3-4 | ofrecer una visita de diagnóstico | 4 visitas |\n| 5-8 | charla técnica en la cooperativa | 15 interesados |\n| 9-12 | propuestas y seguimiento | 3 productores, 2.000 ha |\n\nD) INDICADORES\nPropuestas enviadas, respuestas, visitas, cierres y hectáreas sumadas. Valor de la visita de diagnóstico [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}]}, {"dzial_nr": 5, "dzial": "Crédito, seguros y trámites", "opis": "Los papeles se comen media campaña del asesor: carpeta de crédito, seguro y denuncia de siniestro, registros del establecimiento, notas del organismo sanitario, certificaciones BPA y lo que pide el acopio o el exportador. Este departamento arma esos documentos con tus datos y las reglas vigentes que pegas, sin adivinar montos ni plazos, y marca cada hueco a verificar antes de que alguien firme.", "skills": [{"id": "5.01", "nazwa": "Registro del establecimiento y declaración de siembra", "tag": "REGISTROS", "co_robi": "Convierte la lista de lotes, cultivos y superficies del productor en una declaración prolija para el registro oficial del establecimiento (por ejemplo, el RENSPA ante SENASA) o la declaración de siembra que pida el organismo: planilla por lote, conciliación de hectáreas, documentos a presentar y diferencias a resolver. No da plazos ni requisitos: trabaja solo con las reglas vigentes que pegas.", "kiedy": "Antes de actualizar el registro del establecimiento o presentar la declaración de superficie sembrada, y cada vez que el productor suma o devuelve campos alquilados y los papeles quedan desfasados.", "brief": [{"pole": "Productor y establecimiento", "opis": "Razón social, localidad, superficie total y cuánto es propio o alquilado. Ej.: “Agropecuaria Don Ernesto, Bragado, 1.240 ha en tres campos, 410 ha alquiladas”."}, {"pole": "Lotes y cultivos", "opis": "Cada lote con cultivo y hectáreas. Ej.: “Lote 7 maíz 78 ha; El Bajo maíz 96 ha; La Loma soja 152 ha”."}, {"pole": "Fechas de siembra", "opis": "Ventana de siembra por cultivo. Ej.: “maíz del 20 al 28 de septiembre; soja del 5 al 15 de noviembre”."}, {"pole": "Cambios desde la campaña anterior", "opis": "Campos que entran o salen, cambios de titular. Ej.: “entran 160 ha alquiladas a Hnos. Benítez, se devuelven 40 ha sobre la ruta”."}, {"pole": "Registro y organismo", "opis": "Qué registro se actualiza y ante quién. Ej.: “RENSPA ante SENASA, número de registro [A COMPLETAR]”."}, {"pole": "Reglas vigentes", "opis": "El instructivo o requisitos actuales que te dio el organismo. Ej.: “pego el instructivo de actualización que bajé de la web del organismo”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que ordena los papeles de los productores ante el organismo oficial de su país. Arma la declaración del establecimiento a partir de mis notas.\n\nDATOS:\n- Productor y establecimiento: [PRODUCTOR Y ESTABLECIMIENTO]\n- Lotes y cultivos: [LOTES Y CULTIVOS]\n- Fechas de siembra: [FECHAS DE SIEMBRA]\n- Cambios desde la campaña anterior: [CAMBIOS DESDE LA CAMPAÑA ANTERIOR]\n- Registro y organismo: [REGISTRO Y ORGANISMO]\n- Reglas vigentes: [REGLAS VIGENTES]\n\nREGLAS:\n1. Si falta algún dato clave, primero hazme hasta 6 preguntas cortas y espera mis respuestas antes de escribir.\n2. Usa solo las reglas vigentes que pego. Todo requisito, plazo o formulario que no esté en mi texto lleva [VERIFICAR CON EL ORGANISMO DE TU PAÍS].\n3. Concilia las hectáreas: la suma por cultivo debe coincidir con la superficie declarada de cada campo; señala cada diferencia.\n4. Marca cada lote donde superficie, cultivo o titular puedan no coincidir entre el registro, el contrato de alquiler, el seguro y los mapas del productor.\n5. No inventes dosis, plazos, montos, tasas, normas ni números de resolución. Marca lo faltante con [A COMPLETAR], lo que supongas con [SUPUESTO] y lo dudoso con [VERIFICAR].\n6. Si calculas algo, muestra la cuenta paso a paso.\n\nFORMATO DE SALIDA:\nA) Tabla por lote: | campo | lote | cultivo | ha | fecha de siembra | propio o alquilado | observaciones |\nB) Conciliación de hectáreas por cultivo y por campo, con la cuenta.\nC) Pasos del trámite en el orden en que suelen darse.\nD) Documentos a juntar (contratos, títulos, mapas, constancias).\nE) Diferencias a resolver y preguntas para el productor antes de firmar.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega una columna con el número de registro de cada campo que te paso.", "Revisa que las hectáreas por cultivo sumen la superficie total de cada campo.", "Lista aparte las decisiones que tiene que tomar el productor.", "Escribe un mensaje corto al productor con lo que tiene que traer.", "Arma una versión de una página para imprimir.", "Compara esta declaración con la de la campaña pasada que te pego.", "Lista todo lo que tengo que confirmar con el organismo antes del trámite.", "Agrega una sección que cruce las hectáreas declaradas con las del seguro.", "Prepara qué declarar si el productor resiembra o cambia de cultivo.", "Redacta un mensaje de WhatsApp pidiendo los contratos que faltan."], "checklista": ["Las hectáreas por lote coinciden con mapas, contratos y la última declaración.", "Cada requisito y fecha se confirmó con las reglas vigentes del organismo.", "Los campos nuevos y los devueltos quedaron actualizados con su titular.", "Los lotes no sembrados o perdidos están documentados aparte.", "Se revisaron todos los [VERIFICAR] antes del trámite.", "El productor leyó la declaración y la firma él."], "uwaga": "Los registros, formularios y plazos cambian según el país, la provincia o el estado y el tipo de producción. La IA no conoce las reglas vigentes: trabaja solo con lo que pegas. Confirma todo con el organismo oficial. Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.", "przyklad": {"wejscie": "Estoy armando la actualización del registro de Agropecuaria Don Ernesto, Bragado. Son unas 1.240 hectáreas en tres campos, 410 alquiladas. Maíz en el Lote 7, 78 hectáreas, y en El Bajo 96; soja en La Loma, 152. El resto te lo paso después. El maíz entró del 20 al 28 de septiembre, la soja del 5 al 15 de noviembre. En El Bajo quedaron unas 12 hectáreas sin sembrar por agua, ya le avisó a la aseguradora. Este año suma 160 hectáreas que alquila a los Benítez y devolvió las 40 de la ruta. No tengo el instructivo a mano, ármame el esqueleto y dime qué falta.", "wynik": "A) Tabla por lote\n| campo | lote | cultivo | ha | siembra | tenencia | observaciones |\n| [A COMPLETAR] | Lote 7 | maíz | 78 | 20–28 sep | [A COMPLETAR] | — |\n| [A COMPLETAR] | El Bajo | maíz | 96 | 20–28 sep | [A COMPLETAR] | 12 ha sin sembrar: ¿dentro de las 96 o aparte? [VERIFICAR] |\n| [A COMPLETAR] | La Loma | soja | 152 | 5–15 nov | [A COMPLETAR] | — |\n| Benítez | [A COMPLETAR] | [A COMPLETAR] | 160 | [A COMPLETAR] | alquilado | contrato nuevo |\n\nB) Conciliación parcial\n78 + 96 + 152 + 160 = 486 ha cargadas de unas 1.240 ha → faltan 754 ha [A COMPLETAR].\n\nC) Pasos del trámite\n1. Dar de alta el campo de los Benítez y de baja las 40 ha de la ruta [VERIFICAR CON EL ORGANISMO DE TU PAÍS si exige contrato inscripto].\n2. Declarar superficie por cultivo y lote.\n3. Informar las 12 ha no sembradas según las reglas vigentes [VERIFICAR].\n\nD) Documentos\n- Contrato con Hnos. Benítez [A COMPLETAR].\n- Constancia del aviso a la aseguradora.\n- Número de registro vigente [A COMPLETAR].\n\nE) Preguntas para el productor\n1. ¿Las 12 ha sin sembrar están dentro de las 96 de El Bajo?\n2. ¿Hay cultivo de servicio o segunda planeados?\n\nPega el instructivo vigente y agrego los requisitos del organismo.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "5.02", "nazwa": "Certificación BPA y GlobalG.A.P.: autoevaluación", "tag": "CERTIFICACIÓN", "co_robi": "Toma la norma o la lista de puntos de control que pegas (BPA oficiales, GlobalG.A.P. u otro protocolo del comprador) y la cruza con lo que hoy tiene el productor: arma una autoevaluación punto por punto, la lista de evidencias faltantes y un plan de cierre de brechas antes de la auditoría. No cita puntos de control de memoria.", "kiedy": "Unos meses antes de la primera auditoría de certificación o de la renovación, o cuando un exportador o un supermercado le exige al productor certificar BPA para seguir comprándole.", "brief": [{"pole": "Productor y cultivo", "opis": "Quién, dónde, qué cultivo y superficie. Ej.: “Rancho Los Álamos, Jalisco, aguacate 38 ha, primera certificación”."}, {"pole": "Norma y versión", "opis": "Qué protocolo y versión pide el comprador. Ej.: “GlobalG.A.P. IFA, versión que exige el empacador [VERIFICAR]”."}, {"pole": "Puntos de control pegados", "opis": "El texto de la lista de verificación o de la norma. Ej.: “pego la lista de puntos de control de la sección de fitosanitarios”."}, {"pole": "Situación actual", "opis": "Qué registros, instalaciones y procedimientos ya existen. Ej.: “tenemos registro de aplicaciones en cuaderno, bodega de agroquímicos sin piso impermeable”."}, {"pole": "Fecha y alcance de la auditoría", "opis": "Cuándo y qué abarca. Ej.: “auditoría en marzo, solo huerta y cosecha, el empaque es del exportador”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que prepara productores para auditorías de Buenas Prácticas Agrícolas y certificaciones privadas. Haz una autoevaluación honesta contra la norma que pego.\n\nDATOS:\n- Productor y cultivo: [PRODUCTOR Y CULTIVO]\n- Norma y versión: [NORMA Y VERSIÓN]\n- Puntos de control pegados: [PUNTOS DE CONTROL PEGADOS]\n- Situación actual: [SITUACIÓN ACTUAL]\n- Fecha y alcance de la auditoría: [FECHA Y ALCANCE DE LA AUDITORÍA]\n\nREGLAS:\n1. Si falta algún dato clave, primero hazme hasta 6 preguntas cortas y espera mis respuestas antes de escribir.\n2. Trabaja solo con los puntos de control que pego. Si no pegué alguna sección, dilo y no la completes de memoria.\n3. Clasifica cada punto en: cumple, cumple parcial, no cumple o no aplica, y explica por qué con la evidencia que te di.\n4. Para cada brecha, propone la evidencia concreta que vería un auditor (registro, foto, procedimiento, capacitación firmada).\n5. No inventes dosis, plazos, montos, tasas, normas ni números de resolución. Marca lo faltante con [A COMPLETAR], lo que supongas con [SUPUESTO] y lo dudoso con [VERIFICAR].\n6. Si calculas algo, muestra la cuenta paso a paso.\n\nFORMATO DE SALIDA:\nA) Tabla: | punto de control | nivel exigido | estado | evidencia actual | qué falta |\nB) Brechas críticas primero, con responsable y fecha [A COMPLETAR].\nC) Lista de registros y procedimientos a armar, con su formato sugerido.\nD) Simulacro: 10 preguntas que probablemente haga el auditor.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Arma el procedimiento escrito para la bodega de agroquímicos.", "Haz una planilla de capacitaciones con firma de cada trabajador.", "Ordena las brechas por costo y por tiempo de cierre.", "Redacta el análisis de riesgo del predio con los datos que te paso.", "Prepara un cronograma semanal hasta la auditoría.", "Escribe el procedimiento de higiene para la cosecha.", "Arma la lista de documentos que tiene que haber en la carpeta.", "Haz el simulacro de auditoría con preguntas y respuestas.", "Compara con la autoevaluación del año pasado que te pego.", "Redacta un mensaje al encargado con las tareas de esta semana."], "checklista": ["La versión de la norma es la que exige el comprador y está vigente.", "Cada punto marcado como cumple tiene evidencia física o registro.", "Las brechas críticas tienen responsable y fecha.", "Los registros de aplicación coinciden con la receta y la etiqueta.", "El personal firmó las capacitaciones exigidas.", "Se revisaron todos los [VERIFICAR] con el organismo certificador."], "uwaga": "Las normas de certificación cambian de versión y cada comprador puede exigir requisitos extra. La IA no conoce la versión vigente: usa solo el texto que pegas. Confirma con el organismo certificador. Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.", "przyklad": {"wejscie": "Rancho Los Álamos, en Jalisco, 38 hectáreas de aguacate. El empacador le pidió GlobalG.A.P. para la próxima temporada, auditoría en marzo. Te pego la parte de fitosanitarios de la lista de puntos de control. Hoy tienen registro de aplicaciones en un cuaderno, a veces sin la dosis. La bodega de agroquímicos es un cuarto con piso de tierra y sin ventilación. No hay procedimiento de triple lavado ni constancia de entrega de envases. Los aplicadores tienen equipo de protección pero nadie firmó capacitación. El agua de riego nunca se analizó. Dime dónde estamos parados y qué hay que hacer primero.", "wynik": "A) Autoevaluación (solo sección pegada)\n| punto | estado | evidencia actual | qué falta |\n| registro de aplicaciones completo | cumple parcial | cuaderno sin dosis | registro con dosis, producto, lote, aplicador y justificación |\n| almacenamiento de fitosanitarios | no cumple | piso de tierra, sin ventilación | piso impermeable, contención de derrames, ventilación, cartelería |\n| manejo de envases vacíos | no cumple | sin procedimiento | procedimiento de triple lavado y constancia de entrega |\n| capacitación de aplicadores | no cumple | sin firmas | registro de capacitación firmado |\n| análisis de agua | fuera de la sección pegada | — | pega la sección de agua para evaluarlo [VERIFICAR] |\n\nB) Brechas críticas\n1. Bodega de agroquímicos: obra con fecha [A COMPLETAR] y responsable [A COMPLETAR].\n2. Registro de aplicaciones: pasar a planilla desde hoy.\n3. Capacitación firmada antes de la próxima aplicación.\n\nC) Documentos a armar\n- Planilla de aplicaciones.\n- Procedimiento de bodega y derrames.\n- Procedimiento de envases y constancias.\n\nD) Preguntas probables del auditor\n1. ¿Dónde está la receta o justificación de esta aplicación?\n2. ¿Quién autorizó la compra de este producto?\n3. ¿Qué hacen con los envases vacíos?\n\nPega la sección de agua y la de cosecha para completar la autoevaluación.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "5.03", "nazwa": "Plan de negocios para programa de apoyo o crédito", "tag": "PLAN DE NEGOCIOS", "co_robi": "Arma el plan de negocios que piden los programas oficiales de apoyo, los fondos de cooperativas o el banco cuando el productor quiere financiar un proyecto: descripción, inversión, flujo proyectado con sus propios números, riesgos y cómo cumple los requisitos de la convocatoria que pegas. No inventa montos de apoyo ni tasas.", "kiedy": "Cuando se abre una convocatoria de un programa oficial o de un banco y el productor tiene un proyecto concreto (riego, galpón, maquinaria, plantación nueva) pero no tiene quién le escriba el plan.", "brief": [{"pole": "Productor y producción", "opis": "Quién es y qué produce hoy. Ej.: “Hnos. Benítez, Itapúa, 320 ha de soja y trigo, tambo de 60 vacas”."}, {"pole": "Proyecto", "opis": "Qué quiere hacer y cuánto cuesta según presupuestos. Ej.: “equipo de riego por pivote para 60 ha, presupuesto de USD 95.000”."}, {"pole": "Resultados económicos", "opis": "Ingresos y costos de las últimas campañas que tiene el productor. Ej.: “margen bruto soja de las dos últimas campañas, te paso la planilla”."}, {"pole": "Bases de la convocatoria", "opis": "El texto del programa o de la línea de crédito. Ej.: “pego las bases del programa con los criterios de evaluación”."}, {"pole": "Fuentes de financiamiento", "opis": "Cómo se paga el proyecto. Ej.: “40 % aporte propio, el resto crédito o apoyo del programa [A COMPLETAR]”."}, {"pole": "Objetivos y justificación", "opis": "Por qué el proyecto mejora el negocio. Ej.: “estabilizar rinde de maíz para el tambo en años secos”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que escribe planes de negocios para productores que se presentan a programas de apoyo y créditos. Redacta el plan con mis datos y las bases que pego.\n\nDATOS:\n- Productor y producción: [PRODUCTOR Y PRODUCCIÓN]\n- Proyecto: [PROYECTO]\n- Resultados económicos: [RESULTADOS ECONÓMICOS]\n- Bases de la convocatoria: [BASES DE LA CONVOCATORIA]\n- Fuentes de financiamiento: [FUENTES DE FINANCIAMIENTO]\n- Objetivos y justificación: [OBJETIVOS Y JUSTIFICACIÓN]\n\nREGLAS:\n1. Si falta algún dato clave, primero hazme hasta 6 preguntas cortas y espera mis respuestas antes de escribir.\n2. Responde a cada criterio de evaluación de las bases en el mismo orden y con sus mismos títulos.\n3. Los montos de apoyo, porcentajes subsidiables, tasas y plazos salen solo de las bases pegadas; si no están, [VERIFICAR CON EL PROGRAMA].\n4. Las proyecciones usan los rindes y precios que te doy; cada supuesto de rinde o precio lleva [SUPUESTO] y un escenario pesimista.\n5. No inventes dosis, plazos, montos, tasas, normas ni números de resolución. Marca lo faltante con [A COMPLETAR], lo que supongas con [SUPUESTO] y lo dudoso con [VERIFICAR].\n6. Si calculas algo, muestra la cuenta paso a paso.\n\nFORMATO DE SALIDA:\nA) Resumen del proyecto en media página.\nB) Descripción del productor y de la situación actual.\nC) Inversión detallada y fuentes de financiamiento: | ítem | monto | fuente |\nD) Flujo proyectado con escenario base y pesimista, con las cuentas.\nE) Cumplimiento de requisitos de las bases, criterio por criterio.\nF) Riesgos, cómo se mitigan y documentos a adjuntar.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Acorta el resumen a 150 palabras.", "Agrega un escenario con 20 % menos de rinde.", "Haz la tabla de inversión en moneda local con el tipo de cambio que te paso.", "Lista los documentos que exige la convocatoria.", "Reescribe la justificación con foco en el impacto ambiental.", "Revisa si cumplimos cada requisito de admisión de las bases.", "Prepara una presentación de cinco diapositivas para el comité.", "Calcula el período de repago con los números del flujo.", "Redacta la carta de presentación del productor.", "Arma preguntas probables del evaluador y sus respuestas."], "checklista": ["Cada monto de apoyo o tasa sale del texto de las bases.", "Los presupuestos de proveedores están adjuntos y son vigentes.", "Las proyecciones usan rindes históricos del productor.", "El escenario pesimista no deja al productor sin capacidad de pago.", "Se respondieron todos los criterios de evaluación.", "Se revisaron los [VERIFICAR] con el programa antes de presentar."], "uwaga": "Las convocatorias, montos y criterios cambian cada año y entre organismos. La IA no conoce las bases vigentes: usa solo lo que pegas y tus números. Confirma todo con el programa o el banco. Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.", "przyklad": {"wejscie": "Hnos. Benítez, Itapúa. Tienen 320 hectáreas de soja y trigo y un tambo chico de 60 vacas. Quieren poner un pivote para 60 hectáreas y hacer maíz para silo bajo riego, así no dependen del año para el tambo. El presupuesto del equipo es de 95.000 dólares con instalación, la perforación aparte, todavía no la presupuestaron. Ponen 40 % ellos, el resto quieren sacarlo de una línea de crédito o de un programa que salió, te pego las bases. Rinde de maíz en secano les dio entre 5,5 y 9 toneladas según el año. Arma el plan y dime qué me falta.", "wynik": "A) Resumen\nHnos. Benítez (Itapúa) propone regar 60 ha con pivote para producir maíz para silo y estabilizar la alimentación del tambo de 60 vacas.\n\nC) Inversión\n| ítem | monto | fuente |\n| pivote con instalación | USD 95.000 | 40 % propio / 60 % [A COMPLETAR] |\n| perforación y bomba | [A COMPLETAR] | [A COMPLETAR] |\n| energía eléctrica | [A COMPLETAR] | [A COMPLETAR] |\n\nCuenta: aporte propio = 95.000 × 0,40 = USD 38.000; a financiar = 95.000 − 38.000 = USD 57.000 (sin perforación).\n\nD) Flujo\nRinde en secano dado: 5,5 a 9 t/ha. Rinde bajo riego [SUPUESTO: pedir dato de ensayos locales o del proveedor]. Precio del silo o costo evitado de compra de forraje [A COMPLETAR]. Sin esos datos no calculo repago.\n\nE) Requisitos de las bases\n- Porcentaje financiable y tasa: según bases pegadas [VERIFICAR CON EL PROGRAMA si incluye perforación].\n- Permiso de uso de agua: [VERIFICAR] si las bases lo exigen.\n\nF) Faltantes\n1. Presupuesto de perforación.\n2. Margen del tambo de las dos últimas campañas.\n3. Títulos o contrato del campo regado.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "5.04", "nazwa": "Carpeta de crédito agropecuario", "tag": "CRÉDITO", "co_robi": "Ordena la carpeta que pide el banco o la cooperativa para un crédito agropecuario: descripción del establecimiento, destino del crédito, plan de campaña, flujo de fondos con los números del productor, deudas y garantías, y lista de documentos según los requisitos que pegas. No inventa tasas ni condiciones de la línea.", "kiedy": "Antes de ir al banco (Banco Nación, FIRA, Finagro, Agrobanco, la cooperativa) a pedir crédito de campaña, de inversión o prendario, o cuando el oficial de crédito devolvió la carpeta pidiendo más información.", "brief": [{"pole": "Productor", "opis": "Quién es, antigüedad, superficie y actividad. Ej.: “Jorge Ferreyra, Venado Tuerto, 15 años en la actividad, 600 ha, 70 % alquiladas”."}, {"pole": "Destino y monto solicitado", "opis": "Para qué y cuánto. Ej.: “crédito de campaña para insumos de maíz, USD 120.000”."}, {"pole": "Plan de campaña", "opis": "Cultivos, hectáreas, rindes esperados y costos. Ej.: “300 ha soja, 200 ha maíz, 100 ha trigo; rindes de las últimas tres campañas en la planilla”."}, {"pole": "Deudas y garantías", "opis": "Lo que ya debe y qué puede ofrecer. Ej.: “saldo de prenda de la sembradora, ofrece hipoteca sobre 120 ha propias”."}, {"pole": "Requisitos del banco", "opis": "La lista o las condiciones que te dio el oficial. Ej.: “pego la lista de documentación que pidió la sucursal”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que prepara carpetas de crédito agropecuario para productores. Arma la carpeta con mis datos y los requisitos que pego.\n\nDATOS:\n- Productor: [PRODUCTOR]\n- Destino y monto solicitado: [DESTINO Y MONTO SOLICITADO]\n- Plan de campaña: [PLAN DE CAMPAÑA]\n- Deudas y garantías: [DEUDAS Y GARANTÍAS]\n- Requisitos del banco: [REQUISITOS DEL BANCO]\n\nREGLAS:\n1. Si falta algún dato clave, primero hazme hasta 6 preguntas cortas y espera mis respuestas antes de escribir.\n2. Tasa, plazo, período de gracia y condiciones salen solo de los requisitos que pego; si faltan, [VERIFICAR CON EL BANCO].\n3. El flujo de fondos usa rindes y precios del productor; los precios futuros llevan [SUPUESTO] y se muestra un escenario pesimista.\n4. Señala cualquier dato que el oficial de crédito pueda ver como riesgo (concentración en alquiler, deuda corta, un solo cultivo) y cómo explicarlo.\n5. No inventes dosis, plazos, montos, tasas, normas ni números de resolución. Marca lo faltante con [A COMPLETAR], lo que supongas con [SUPUESTO] y lo dudoso con [VERIFICAR].\n6. Si calculas algo, muestra la cuenta paso a paso.\n\nFORMATO DE SALIDA:\nA) Ficha del productor y del establecimiento.\nB) Destino del crédito y plan de campaña: | cultivo | ha | rinde | ingreso | costo | margen |\nC) Flujo de fondos mensual de la campaña con el crédito y el repago.\nD) Deudas actuales y garantías ofrecidas.\nE) Lista de documentos según los requisitos pegados, con lo que falta.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega un escenario con precio de soja 15 % más bajo.", "Haz el flujo en moneda local con el tipo de cambio que te paso.", "Redacta la nota de pedido de crédito para el gerente.", "Lista los riesgos que verá el banco y cómo responderlos.", "Arma la manifestación de bienes con los datos que te paso.", "Calcula la relación entre deuda total y margen esperado.", "Prepara un resumen de una página para el oficial de crédito.", "Compara dos alternativas de plazo que te paso.", "Lista los contratos de alquiler que hay que adjuntar.", "Escribe un mensaje al contador pidiendo los balances."], "checklista": ["Los rindes del plan coinciden con el historial del productor.", "Tasa y condiciones salen del banco, no de la IA.", "El flujo muestra repago aun en escenario pesimista.", "Las deudas declaradas coinciden con lo que figura en los registros crediticios.", "Los contratos de alquiler cubren el plazo del crédito.", "Se revisaron todos los [VERIFICAR] con el oficial."], "uwaga": "Las líneas de crédito, tasas y requisitos cambian seguido y entre bancos. La IA no conoce las condiciones vigentes: usa solo lo que pegas. Confirma todo con el banco o la cooperativa. Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.", "przyklad": {"wejscie": "Te paso lo de Jorge Ferreyra, Venado Tuerto. Hace 15 años que trabaja, son 600 hectáreas, 420 alquiladas. Quiere un crédito de campaña para el maíz, unos 120.000 dólares. Este año va 300 de soja, 200 de maíz y 100 de trigo. Los rindes promedio de las tres últimas: soja 35 quintales, maíz 85, trigo 38. Debe el saldo de la prenda de la sembradora, unos 40.000. Ofrece hipoteca sobre las 120 hectáreas propias. El banco le pidió balances, manifestación de bienes y contratos de alquiler. Arma la carpeta y dime qué le falta.", "wynik": "A) Ficha\nJorge Ferreyra, Venado Tuerto. 15 años en la actividad. 600 ha: 180 ha propias y 420 alquiladas (70 %).\nAtención: 600 − 420 = 180 ha propias, pero ofrece hipoteca sobre 120 ha [VERIFICAR qué pasa con las otras 60].\n\nB) Plan de campaña\n| cultivo | ha | rinde | ingreso | costo | margen |\n| soja | 300 | 35 qq/ha | [A COMPLETAR precio] | [A COMPLETAR] | [A COMPLETAR] |\n| maíz | 200 | 85 qq/ha | [A COMPLETAR precio] | [A COMPLETAR] | [A COMPLETAR] |\n| trigo | 100 | 38 qq/ha | [A COMPLETAR precio] | [A COMPLETAR] | [A COMPLETAR] |\n\nProducción esperada de maíz: 200 × 8,5 t = 1.700 t.\n\nC) Flujo\nSin tasa ni plazo de la línea no armo el repago [VERIFICAR CON EL BANCO].\n\nD) Deudas y garantías\n| concepto | monto |\n| prenda sembradora | USD 40.000 |\n| crédito solicitado | USD 120.000 |\n| total | USD 160.000 |\n\nE) Documentos\n- Balances [A COMPLETAR].\n- Manifestación de bienes [A COMPLETAR].\n- Contratos de alquiler: el banco va a mirar que cubran la campaña [VERIFICAR vencimientos].\n\nRiesgo que verá el banco: 70 % alquilado. Explicación sugerida: contratos de largo plazo y rindes estables [SUPUESTO].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "5.05", "nazwa": "Documentación para acopio y exportación", "tag": "ACOPIO Y EXPORTACIÓN", "co_robi": "Arma la lista y los borradores de la documentación que pide el acopio, la cooperativa o el exportador para recibir la mercadería: trazabilidad por lote, registro de aplicaciones de la campaña, declaraciones del productor, análisis requeridos y constancias del organismo sanitario. Todo se cruza con los requisitos que pegas; no inventa límites de residuos ni requisitos de destino.", "kiedy": "Antes de cosechar o de entregar, cuando el acopio o el exportador manda su lista de requisitos o cuando un destino nuevo exige trazabilidad y nadie la tiene ordenada.", "brief": [{"pole": "Productor y lotes", "opis": "Quién entrega y de qué lotes sale la mercadería. Ej.: “Lucía Ramírez, Piura, mango Kent, Parcela 3 y Parcela 5, 22 ha”."}, {"pole": "Comprador y destino", "opis": "A quién se entrega y para qué mercado. Ej.: “exportador de Piura, destino Unión Europea [VERIFICAR]”."}, {"pole": "Requisitos pegados", "opis": "La lista del acopio o exportador. Ej.: “pego el protocolo de recepción que mandó el exportador”."}, {"pole": "Aplicaciones de la campaña", "opis": "Registro de lo aplicado en esos lotes. Ej.: “planilla con fechas, productos y lotes de la campaña”."}, {"pole": "Documentos disponibles", "opis": "Lo que ya tiene el productor. Ej.: “registro del predio ante SENASA, certificado BPA vigente, sin análisis de residuos”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que ayuda a productores a entregar al acopio y a la exportación con la documentación en regla. Cruza mis datos con los requisitos que pego.\n\nDATOS:\n- Productor y lotes: [PRODUCTOR Y LOTES]\n- Comprador y destino: [COMPRADOR Y DESTINO]\n- Requisitos pegados: [REQUISITOS PEGADOS]\n- Aplicaciones de la campaña: [APLICACIONES DE LA CAMPAÑA]\n- Documentos disponibles: [DOCUMENTOS DISPONIBLES]\n\nREGLAS:\n1. Si falta algún dato clave, primero hazme hasta 6 preguntas cortas y espera mis respuestas antes de escribir.\n2. Límites de residuos, carencias exigidas por el destino y requisitos fitosanitarios salen solo del texto pegado o de la etiqueta; si no están, [VERIFICAR CON EL ORGANISMO DE TU PAÍS] o [VER ETIQUETA].\n3. Revisa cada aplicación de la campaña contra la fecha de cosecha prevista y marca toda aplicación cuya carencia no figure: [VER ETIQUETA].\n4. Arma la trazabilidad de forma que cada envío se pueda seguir hasta el lote, la fecha de cosecha y las aplicaciones.\n5. No inventes dosis, plazos, montos, tasas, normas ni números de resolución. Marca lo faltante con [A COMPLETAR], lo que supongas con [SUPUESTO] y lo dudoso con [VERIFICAR].\n6. Si calculas algo, muestra la cuenta paso a paso.\n\nFORMATO DE SALIDA:\nA) Tabla de requisitos: | requisito | documento | estado | qué falta |\nB) Trazabilidad por lote: | lote | cultivo | fecha de cosecha | aplicaciones | carencia cumplida |\nC) Borradores de declaraciones del productor que pida el comprador.\nD) Riesgos de rechazo y cómo evitarlos.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Arma la planilla de trazabilidad para cada remito.", "Revisa las carencias de cada aplicación con las etiquetas que te pego.", "Redacta la declaración jurada de aplicaciones que pide el exportador.", "Lista los análisis de laboratorio a pedir y de qué lotes.", "Prepara un mensaje al exportador preguntando por los requisitos faltantes.", "Compara los requisitos de dos compradores que te pego.", "Haz una lista de control para el día de la cosecha.", "Arma el cronograma desde la última aplicación hasta la entrega.", "Marca qué aplicaciones podrían complicar el destino.", "Escribe instrucciones para el encargado de cosecha."], "checklista": ["Cada requisito del comprador tiene un documento asignado.", "Las carencias se verificaron con la etiqueta de cada producto.", "Los productos aplicados están autorizados para el destino según el comprador.", "La trazabilidad se puede seguir de cada envío al lote.", "Los análisis exigidos se pidieron a tiempo.", "Se revisaron todos los [VERIFICAR] antes de cosechar."], "uwaga": "Los requisitos de cada destino, los límites de residuos y los protocolos del organismo sanitario cambian y dependen del comprador. La IA no los conoce: usa solo lo que pegas. Confirma con el comprador y el organismo oficial. Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.", "przyklad": {"wejscie": "Lucía Ramírez, Piura, mango Kent, Parcela 3 con 12 hectáreas y Parcela 5 con 10. Entrega a un exportador, dicen que va a Europa. Me mandaron un protocolo de recepción, te lo pego. Tiene el registro del predio y el certificado BPA vigente, pero nunca hizo análisis de residuos. En la Parcela 5 aplicaron un fungicida registrado para mango hace 9 días y quieren cosechar la semana que viene. La Parcela 3 tuvo la última aplicación hace un mes. Ordéname los papeles y dime si hay algún problema.", "wynik": "A) Requisitos\n| requisito | documento | estado | qué falta |\n| registro del predio | constancia del organismo | tiene | copia vigente [VERIFICAR fecha] |\n| certificación BPA | certificado | tiene | — |\n| análisis de residuos | informe de laboratorio | no tiene | pedir muestra por parcela [VERIFICAR si el exportador lo exige por lote] |\n| registro de aplicaciones | planilla | [A COMPLETAR] | pasar la planilla de la campaña |\n\nB) Trazabilidad\n| lote | ha | última aplicación | días a cosecha | carencia |\n| Parcela 3 | 12 | hace ~30 días | ~37 | [VER ETIQUETA] |\n| Parcela 5 | 10 | hace 9 días | ~16 | [VER ETIQUETA] |\n\nCuenta Parcela 5: 9 días ya pasados + 7 hasta la cosecha prevista = 16 días desde la aplicación. Si la carencia de la etiqueta es mayor que 16 días, no se puede cosechar en esa fecha. Además, el destino puede exigir más que la etiqueta [VERIFICAR CON EL EXPORTADOR].\n\nD) Riesgo principal\nParcela 5: cosechar antes de confirmar la carencia expone a un rechazo por residuos. Recomendación: cosechar primero la Parcela 3 y sacar muestra de la 5 antes de cosechar.\n\nPega la etiqueta del fungicida y la lista de límites del destino que te dé el exportador.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "5.06", "nazwa": "Seguro agrícola: elección y revisión de póliza", "tag": "SEGURO AGRÍCOLA", "co_robi": "Compara las propuestas de seguro agrícola que pegas (granizo, multirriesgo, por índice, ganadero) con la situación real del productor: qué riesgos cubre cada una, deducibles, exclusiones, plazos de denuncia y obligaciones del asegurado. Arma un cuadro comparativo y las preguntas para el productor de seguros. No inventa primas ni coberturas.", "kiedy": "Antes de la siembra o de renovar la póliza, cuando el productor tiene dos o tres cotizaciones y no entiende qué está comprando, o después de un siniestro mal cubierto.", "brief": [{"pole": "Productor y cultivos", "opis": "Qué se asegura y dónde. Ej.: “Martín Ortiz, Río Cuarto, 250 ha soja y 150 ha maíz”."}, {"pole": "Riesgos principales", "opis": "Qué le preocupa según la historia de la zona. Ej.: “granizo, sequía en enero, heladas tempranas en maíz tardío”."}, {"pole": "Propuestas pegadas", "opis": "Las condiciones de cada póliza o cotización. Ej.: “pego tres cotizaciones de dos aseguradoras con sus condiciones generales”."}, {"pole": "Rindes y valores", "opis": "Rindes históricos y valor a asegurar. Ej.: “soja 32 qq/ha promedio de cinco campañas, valor asegurado por hectárea [A COMPLETAR]”."}, {"pole": "Presupuesto y financiación", "opis": "Cuánto puede pagar y cómo. Ej.: “prefiere pagar a cosecha, presupuesto máximo [A COMPLETAR] por hectárea”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que asesora a productores en la elección de seguros agrícolas. Compara las pólizas que pego con la situación del productor.\n\nDATOS:\n- Productor y cultivos: [PRODUCTOR Y CULTIVOS]\n- Riesgos principales: [RIESGOS PRINCIPALES]\n- Propuestas pegadas: [PROPUESTAS PEGADAS]\n- Rindes y valores: [RINDES Y VALORES]\n- Presupuesto y financiación: [PRESUPUESTO Y FINANCIACIÓN]\n\nREGLAS:\n1. Si falta algún dato clave, primero hazme hasta 6 preguntas cortas y espera mis respuestas antes de escribir.\n2. Primas, sumas aseguradas, deducibles, franquicias y plazos salen solo del texto de las pólizas pegadas; si algo no figura, [VERIFICAR CON LA ASEGURADORA].\n3. Explica cada exclusión con un ejemplo concreto del campo del productor.\n4. Señala las obligaciones del asegurado que, si no se cumplen, hacen perder la cobertura (plazo de denuncia, no cosechar antes de la inspección, fechas de siembra).\n5. No inventes dosis, plazos, montos, tasas, normas ni números de resolución. Marca lo faltante con [A COMPLETAR], lo que supongas con [SUPUESTO] y lo dudoso con [VERIFICAR].\n6. Si calculas algo, muestra la cuenta paso a paso.\n\nFORMATO DE SALIDA:\nA) Cuadro comparativo: | póliza | riesgos cubiertos | suma asegurada | deducible o franquicia | prima | exclusiones clave |\nB) Qué riesgos del productor quedan sin cubrir con cada opción.\nC) Obligaciones del asegurado y plazos, según el texto pegado.\nD) Preguntas para el productor de seguros antes de firmar.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Explica en palabras simples la diferencia entre franquicia y deducible de estas pólizas.", "Calcula cuánto cobraría con un daño del 40 % en cada póliza.", "Arma un resumen para mandar al productor por WhatsApp.", "Lista las fechas límite de siembra que exigen las pólizas.", "Compara el costo por hectárea de cada opción.", "Marca qué cláusulas conviene negociar.", "Arma la lista de control para cuando haya un siniestro.", "Compara con la póliza de la campaña pasada que te pego.", "Prepara una tabla con lo que no cubre ninguna opción.", "Escribe las preguntas para el productor de seguros."], "checklista": ["Cada número del cuadro sale de las pólizas pegadas.", "Las exclusiones se leyeron completas, incluidas las condiciones generales.", "Las fechas de siembra y de denuncia quedaron anotadas.", "El productor entiende qué pasa con un daño parcial.", "Se revisaron los [VERIFICAR] con la aseguradora.", "El productor decide y firma la póliza él."], "uwaga": "Las condiciones de cada póliza cambian según la aseguradora, la zona y la campaña. La IA no conoce primas ni coberturas: usa solo lo que pegas. Confirma todo con el productor de seguros. Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.", "przyklad": {"wejscie": "Martín Ortiz, Río Cuarto, 250 hectáreas de soja y 150 de maíz. Le cotizaron granizo solo y un multirriesgo, te pego las dos. Lo que más le preocupa es el granizo y la seca de enero. El año pasado tuvo granizo en la soja y cobró poco, no entendió por qué. Promedio de soja 32 quintales. Quiere pagar a cosecha y no gastar más de lo que pagó el año pasado, que tampoco sé bien cuánto fue, le pido la póliza vieja. Tiene maíz tardío en un lote bajo que siempre le preocupa por heladas. Compárame las dos y dime qué le conviene preguntar.", "wynik": "A) Cuadro comparativo (según textos pegados)\n| póliza | cubre | suma asegurada | franquicia o deducible | prima | exclusiones |\n| granizo | granizo [VERIFICAR si incluye viento o incendio] | [A COMPLETAR del texto] | [A COMPLETAR] | [A COMPLETAR] | sequía no cubierta |\n| multirriesgo | granizo y sequía según texto | [A COMPLETAR] | [A COMPLETAR] | [A COMPLETAR] | [VERIFICAR fechas de siembra exigidas] |\n\nB) Riesgos sin cubrir\n- Con la de granizo sola, la seca de enero queda afuera: es el riesgo que más le preocupa.\n\nC) Por qué cobró poco el año pasado (hipótesis)\nSi la póliza tenía franquicia, el daño por debajo de ese porcentaje no se paga, y por encima se paga solo la parte asegurada. Ejemplo con datos supuestos: daño 15 %, franquicia 10 % [SUPUESTO] → se indemniza según el sistema de la póliza, que puede no ser el 15 % completo [VERIFICAR CON LA ASEGURADORA]. Pega la póliza anterior para confirmarlo.\n\nD) Preguntas para el productor de seguros\n1. ¿La suma asegurada por hectárea se ajusta a 32 qq/ha o a otro valor?\n2. ¿Cuál es el plazo para denunciar un siniestro?\n3. ¿Qué fecha de siembra límite exige el multirriesgo?\n4. ¿Se puede pagar a cosecha y con qué recargo?\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "5.07", "nazwa": "Denuncia de siniestro y documentación de pérdidas", "tag": "SINIESTRO", "co_robi": "Convierte lo que viste en la recorrida después de un granizo, una helada, una inundación o daño por fauna en una denuncia de siniestro ordenada: fecha y evento, lotes afectados, estimación de daño con método y cuentas, evidencias y pasos según la póliza o las reglas de emergencia agropecuaria que pegas. No promete indemnizaciones.", "kiedy": "En las horas o días después del evento, cuando hay que denunciar dentro del plazo de la póliza, pedir constancia para emergencia agropecuaria o dejar todo documentado antes de que llegue el perito.", "brief": [{"pole": "Productor y póliza", "opis": "Quién, aseguradora y número de póliza. Ej.: “Agropecuaria Don Ernesto, póliza de granizo número [A COMPLETAR]”."}, {"pole": "Evento y fecha", "opis": "Qué pasó y cuándo. Ej.: “granizo el 14 de enero a las 18 h, unos 15 minutos”."}, {"pole": "Lotes y daño observado", "opis": "Lotes, cultivo, estadio y lo que viste. Ej.: “Lote 7 soja en R3, defoliación fuerte en la cabecera norte, tallos quebrados”."}, {"pole": "Evidencias", "opis": "Fotos, coordenadas, muestreos. Ej.: “40 fotos georreferenciadas, 10 estaciones de muestreo de 1 m lineal”."}, {"pole": "Procedimiento de la póliza", "opis": "Las condiciones de denuncia que pegas. Ej.: “pego la cláusula de denuncia y tasación de la póliza”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que documenta siniestros agrícolas para denuncias ante aseguradoras y pedidos de emergencia agropecuaria. Arma la denuncia con mis notas de campo.\n\nDATOS:\n- Productor y póliza: [PRODUCTOR Y PÓLIZA]\n- Evento y fecha: [EVENTO Y FECHA]\n- Lotes y daño observado: [LOTES Y DAÑO OBSERVADO]\n- Evidencias: [EVIDENCIAS]\n- Procedimiento de la póliza: [PROCEDIMIENTO DE LA PÓLIZA]\n\nREGLAS:\n1. Si falta algún dato clave, primero hazme hasta 6 preguntas cortas y espera mis respuestas antes de escribir.\n2. Plazos de denuncia, porcentajes y procedimientos salen solo de la póliza o reglas pegadas; si faltan, [VERIFICAR CON LA ASEGURADORA] o [VERIFICAR CON EL ORGANISMO DE TU PAÍS].\n3. Estima el daño con el método que usé (estaciones, conteos) y muestra cada cuenta; no extrapoles más allá de los lotes muestreados.\n4. Recuerda las obligaciones del asegurado: no cosechar ni modificar el lote hasta la tasación, salvo que la póliza diga otra cosa [VERIFICAR].\n5. No inventes dosis, plazos, montos, tasas, normas ni números de resolución. Marca lo faltante con [A COMPLETAR], lo que supongas con [SUPUESTO] y lo dudoso con [VERIFICAR].\n6. Si calculas algo, muestra la cuenta paso a paso.\n\nFORMATO DE SALIDA:\nA) Texto de la denuncia listo para enviar: productor, póliza, evento, fecha, lotes, cultivo, estadio.\nB) Tabla de daño: | lote | ha | estadio | estaciones | daño estimado | método |\nC) Registro de evidencias y cómo archivarlas.\nD) Pasos y plazos según la póliza pegada, y qué no hacer hasta la tasación.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Acorta la denuncia para mandarla por correo.", "Arma una planilla para cargar las estaciones de muestreo.", "Calcula el daño promedio ponderado por hectárea.", "Redacta el pedido de constancia de emergencia agropecuaria.", "Prepara la lista de fotos que faltan sacar.", "Escribe un mensaje al productor de seguros avisando el siniestro.", "Haz una guía para acompañar al perito en la recorrida.", "Compara mi estimación con la del perito que te pego.", "Arma un informe para el productor con lo que puede esperar.", "Lista qué decisiones de manejo esperan hasta la tasación."], "checklista": ["La denuncia salió dentro del plazo de la póliza.", "Fecha, hora y lotes coinciden con las evidencias.", "El método de estimación está explicado y es repetible.", "Las fotos tienen fecha y ubicación.", "No se cosechó ni se modificó el lote antes de la tasación.", "Se revisaron los [VERIFICAR] con la aseguradora."], "uwaga": "Cada póliza tiene su procedimiento, sus plazos y su forma de tasar; la emergencia agropecuaria depende de lo que declare cada gobierno. La IA no conoce esas reglas: usa lo que pegas. Confirma con la aseguradora y el organismo. Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.", "przyklad": {"wejscie": "Ayer a las 6 de la tarde cayó granizo en lo de Don Ernesto, unos 15 minutos. Hoy recorrí el Lote 7, soja en R3, 78 hectáreas. La cabecera norte está muy defoliada, tallos quebrados en algunos sectores. Hice 10 estaciones de un metro lineal: en las 5 del norte conté entre 40 y 60 % de defoliación y vainas dañadas, en las 5 del sur entre 10 y 20 %. Saqué 40 fotos con ubicación. Tiene póliza de granizo, te pego la cláusula de denuncia. Arma la denuncia y la tabla.", "wynik": "A) Denuncia\nProductor: Agropecuaria Don Ernesto. Póliza de granizo n.º [A COMPLETAR]. Evento: granizo, [A COMPLETAR fecha] a las 18 h, duración aproximada 15 minutos. Lote 7, soja en R3, 78 ha. Daño observado: defoliación y tallos quebrados, mayor en la cabecera norte.\n\nB) Tabla de daño\n| sector | estaciones | rango observado | punto medio |\n| norte | 5 | 40–60 % | 50 % |\n| sur | 5 | 10–20 % | 15 % |\n\nPromedio simple de estaciones: (50 + 15) ÷ 2 = 32,5 %.\nPara ponderar por superficie necesito cuántas hectáreas tiene cada sector [A COMPLETAR]. Ejemplo si fueran 30 ha norte y 48 ha sur [SUPUESTO]: (30 × 50 + 48 × 15) ÷ 78 = (1.500 + 720) ÷ 78 = 28,5 %.\nEsto es daño visual en R3; el efecto final en rinde lo define la tasación [VERIFICAR].\n\nC) Evidencias\n- 40 fotos georreferenciadas: archivar por sector y estación.\n- Planilla de las 10 estaciones con coordenadas.\n\nD) Pasos\n1. Enviar la denuncia dentro del plazo de la cláusula pegada [VERIFICAR CON LA ASEGURADORA].\n2. No modificar el lote hasta la inspección del perito.\n3. Marcar las estaciones para mostrarlas en la recorrida.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "5.08", "nazwa": "Ficha del establecimiento para bancos, programas y compradores", "tag": "FICHA DEL CAMPO", "co_robi": "Escribe una descripción profesional del establecimiento a partir de tus datos: superficie, suelos, producción, infraestructura, maquinaria, personal, trayectoria y mercados. Sale en versión larga y corta, adaptada a quien la va a leer: banco, programa oficial, comprador o certificadora.", "kiedy": "Cuando cada formulario pide «describa el establecimiento» y siempre lo escribes de cero, o cuando un comprador nuevo o un banco pide una presentación del productor.", "brief": [{"pole": "Datos básicos", "opis": "Titular, ubicación y superficie. Ej.: “Hnos. Benítez, Alto Paraná, 320 ha propias y 180 alquiladas”."}, {"pole": "Producción", "opis": "Cultivos, ganado y rindes. Ej.: “soja, maíz y trigo; tambo de 60 vacas; soja 3,2 t/ha promedio de cinco campañas”."}, {"pole": "Recursos", "opis": "Suelos, agua, maquinaria, instalaciones, personal. Ej.: “suelos rojos arcillosos, dos tractores, sembradora propia, silo de 500 t, tres empleados”."}, {"pole": "Trayectoria", "opis": "Años en la actividad, formación, prácticas. Ej.: “tercera generación, siembra directa desde hace 20 años”."}, {"pole": "Mercados", "opis": "A quién vende. Ej.: “soja a la cooperativa, leche a una industria láctea”."}, {"pole": "Destinatario", "opis": "Para quién es la ficha. Ej.: “presentación para un programa de apoyo a la lechería”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que redacta presentaciones de establecimientos agropecuarios para bancos, programas y compradores. Escribe la ficha con mis datos.\n\nDATOS:\n- Datos básicos: [DATOS BÁSICOS]\n- Producción: [PRODUCCIÓN]\n- Recursos: [RECURSOS]\n- Trayectoria: [TRAYECTORIA]\n- Mercados: [MERCADOS]\n- Destinatario: [DESTINATARIO]\n\nREGLAS:\n1. Si falta algún dato clave, primero hazme hasta 6 preguntas cortas y espera mis respuestas antes de escribir.\n2. Usa solo los datos que te doy; no agregues rindes, superficies ni cert
