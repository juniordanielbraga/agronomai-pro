<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AgronomIA"><meta name="theme-color" content="#1E4620">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<title>AgronomIA PRO — la oficina de IA del agrónomo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--g9:#1E4620;--g8:#2C5E2E;--leaf:#7CB342;--cta:#2E7D32;--gold:#D9A82B;--red:#C62828;
--bg:#F5F0E3;--grid:rgba(30,70,32,.055);--card:#fff;--ink:#1d1f1b;--mut:#6b6a5f;--line:#e7e0cc;--soft:#f3eedf;--pre:#17351a;--pretx:#e9f1e3;
--c1:#4E8A3E;--c2:#1E4620;--c3:#D9A82B;--c4:#7A5232;--c5:#3FA34D;--c6:#C62828}
[data-theme=dark]{--bg:#121711;--grid:rgba(165,212,106,.05);--card:#1b2219;--ink:#eef2e8;--mut:#a3ab98;--line:#2c3628;--soft:#222b1f;--pre:#0d130c;--g9:#a5d46a;--g8:#a5d46a}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.55;
background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.mono,.k,.lab,.pill,.cnt,.chip{font-family:'Space Mono',monospace}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.sidetop{padding:22px 20px 0;flex:none}.sidemid{flex:1;overflow:auto;padding:0 12px 10px}.sidebot{flex:none;border-top:1px solid var(--line);padding:14px 20px 18px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px;cursor:pointer}
.brand svg{width:44px;height:44px;flex:none;border-radius:11px}
.brand b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.3px}.brand small{font-family:'Space Mono';font-size:10.5px;letter-spacing:1.6px;color:var(--mut);text-transform:uppercase}
.sbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--soft);margin-bottom:6px}
.sbox input{border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);flex:1;min-width:0;outline:0}
.sbox kbd{font-family:'Space Mono';font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--mut);background:var(--card)}
.lab{font-size:10.5px;letter-spacing:2px;color:var(--mut);margin:18px 10px 8px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:14px;white-space:nowrap}
.nav a span.t{overflow:hidden;text-overflow:ellipsis;flex:1}
.nav a:hover{background:var(--soft)}.nav a.on{background:var(--soft);font-weight:600}
.num{width:27px;height:27px;border-radius:7px;color:#fff;font-family:'Space Mono';font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.ico{width:27px;height:27px;border-radius:7px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.cnt{margin-left:auto;font-size:11px;color:var(--mut);background:var(--soft);border-radius:99px;padding:1px 8px;flex:none}
.nav a.on .cnt{background:var(--card);color:var(--ink);font-weight:700}
.prog{display:flex;justify-content:space-between;font-family:'Space Mono';font-size:10.5px;letter-spacing:1.8px;color:var(--mut)}
.bar{height:6px;background:var(--soft);border-radius:9px;margin:8px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--leaf);border-radius:9px}
.night{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:11px;padding:9px;font:inherit;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
main{padding:34px 48px 60px;max-width:1120px;width:100%;min-width:0}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:1.8px;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;margin-bottom:18px;text-transform:uppercase}
.pill:before{content:'';width:7px;height:7px;border-radius:50%;background:#3FA34D;box-shadow:0 0 0 3px rgba(63,163,77,.18)}
.pill.np:before{display:none}
h1{font-size:64px;line-height:1.02;font-weight:800;letter-spacing:-2.2px}
h1 em{font-style:normal;color:var(--g8);display:block}
h2{font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
h3{font-size:17px;font-weight:700;letter-spacing:-.2px}
.lead{color:var(--ink);opacity:.86;max-width:720px;margin:18px 0 26px;font-size:16.5px;line-height:1.7}.lead b{font-weight:700;opacity:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 34px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.stat b{font-size:32px;font-weight:800;display:block;letter-spacing:-1px;line-height:1.1}.stat small{font-family:'Space Mono';font-size:10.5px;letter-spacing:1.8px;color:var(--mut);text-transform:uppercase;display:block;margin-top:6px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 14px;gap:12px}.sech .k{margin:0}
.k{font-size:10.5px;letter-spacing:1.9px;color:var(--mut);display:block;margin-bottom:6px;text-transform:uppercase}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.step i{font-style:normal;display:inline-flex;width:30px;height:30px;border-radius:8px;background:var(--g9);color:#fff;align-items:center;justify-content:center;font-weight:700;margin-bottom:10px;font-family:'Space Mono'}
[data-theme=dark] .step i{color:#121711}
.step b{display:block;font-weight:700}.step p{font-size:13.5px;color:var(--mut);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:.15s}
.card:hover{border-color:#cfc39f;box-shadow:0 6px 18px rgba(30,70,32,.07)}
.card .top{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.card p{font-size:13.5px;color:var(--mut)}
.list{display:grid;gap:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;gap:16px;align-items:center;cursor:pointer;transition:.15s}
.row:hover{border-color:#cfc39f;box-shadow:0 6px 18px rgba(30,70,32,.07)}
.row .id{font-family:'Space Mono';font-weight:700;font-size:12.5px;color:#fff;border-radius:7px;padding:5px 9px;flex:none}
.row .tx{flex:1;min-width:0}.row b{font-weight:700;font-size:16px;display:block}
.row p{font-size:13.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex:none}
.chip{font-size:10.5px;letter-spacing:1.3px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:4px 10px;color:var(--mut);text-transform:uppercase;white-space:nowrap}
.star{border:0;background:none;font-size:19px;cursor:pointer;color:#c9bd98;flex:none;line-height:1;padding:4px}.star.on{color:var(--gold)}
.dzico{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--soft);border:1px solid var(--line);margin-bottom:18px}
.dh h1{font-size:48px;letter-spacing:-1.6px}
.skh{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.skh .bandx{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--soft)}
.skh .nm{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.skh .nm h1{font-size:34px;letter-spacing:-1px;line-height:1.1;flex:1}
.meta{display:grid;grid-template-columns:repeat(4,1fr)}.meta>div{padding:12px 20px;font-family:'Space Mono';font-size:13.5px;font-weight:700}.meta>div+div{border-left:1px solid var(--line)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.box.acc{border-left:4px solid var(--leaf)}
.field{margin-bottom:14px}.field label{display:block;font-weight:600;font-size:14px}
.field small{display:block;color:var(--mut);font-size:12.5px;margin:1px 0 6px}
.field textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical;background:var(--soft);color:var(--ink)}
.field textarea:focus{outline:2px solid var(--leaf);background:var(--card)}
pre{white-space:pre-wrap;word-wrap:break-word;font-family:'Space Mono',monospace;font-size:12.5px;line-height:1.6;background:var(--pre);color:var(--pretx);border-radius:12px;padding:18px;max-height:420px;overflow:auto}
pre mark,.ex mark{background:none;color:#ffb4a9;font-weight:700}.ex mark{color:var(--red)}
pre .ph{color:#ffd54a}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 15px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:#cfc39f}
.btn.g{background:var(--cta);border-color:var(--cta);color:#fff}.btn.d{background:#1E4620;border-color:#1E4620;color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.cmd{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 16px;margin-bottom:8px;font-size:14.5px}
.cmd .n{font-family:'Space Mono';font-size:12px;color:var(--mut);flex:none}.cmd .t{flex:1}.cmd .b{display:flex;gap:6px;flex:none}
.chk label{display:flex;gap:11px;padding:7px 0;font-size:14.5px;cursor:pointer;border-bottom:1px dashed var(--line)}.chk label:last-child{border:0}
.chk input{accent-color:var(--cta);width:18px;height:18px;flex:none;margin-top:3px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.ex .hd{font-family:'Space Mono';font-size:11.5px;letter-spacing:2px;padding:12px 20px;background:var(--soft);border-bottom:1px solid var(--line);text-transform:uppercase}
.ex .hd:before{content:'● ';color:var(--cta)}
.ex .bd{padding:18px 20px;font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.ex .bd.out{font-family:'Space Mono',monospace;font-size:12.8px;line-height:1.7;border-top:1px solid var(--line)}
.warn{background:#fbf3dc;border:1px solid #ecd9a0;border-radius:13px;padding:13px 16px;font-size:14px;color:#5d4a14;margin-top:14px}
[data-theme=dark] .warn{background:#2a2715;border-color:#4a4320;color:#eadca8}
.agc{display:flex;flex-direction:column}.agc .em{font-size:26px;width:46px;height:46px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.agc .cat{font-family:'Space Mono';font-size:10px;letter-spacing:1.6px;color:var(--mut);text-transform:uppercase}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#1E4620;color:#fff;padding:11px 20px;border-radius:99px;font-weight:600;opacity:0;transition:.2s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.mtop{display:none}
.back{display:none}
.empty{color:var(--mut);padding:20px 0}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 body{overflow-x:hidden}
 aside{position:fixed;inset:0 auto 0 0;width:86%;max-width:330px;z-index:30;transform:translateX(-105%);transition:.22s;box-shadow:0 0 40px rgba(0,0,0,.2)}
 body.menu aside{transform:none}
 .shade{display:none}body.menu .shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
 .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
 .mtop svg{width:34px;height:34px;border-radius:9px}.mtop b{font-weight:700;flex:1;font-size:15.5px}.mtop b span{color:var(--g8)}
 .mtop button{border:1px solid var(--line);background:var(--soft);border-radius:10px;width:40px;height:40px;font-size:18px;color:var(--ink);cursor:pointer}
 main{padding:22px 16px 50px}
 h1{font-size:44px;letter-spacing:-1.4px}.dh h1{font-size:34px}
 .lead{font-size:15px;margin:14px 0 20px}
 .stats{grid-template-columns:1fr 1fr;gap:10px}.stat b{font-size:27px}
 .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
 .steps{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.step{padding:13px}.step p{font-size:12.5px}
 .pill{font-size:10px;letter-spacing:1.2px;padding:6px 11px}
 .sech{flex-wrap:wrap}
 .chips{display:none}.row{padding:14px}
 .skh .nm h1{font-size:25px}.meta{grid-template-columns:1fr 1fr}.meta>div:nth-child(3){border-left:0}.meta>div:nth-child(n+3){border-top:1px solid var(--line)}
 .cmd{flex-wrap:wrap}.cmd .b{width:100%;justify-content:flex-end}
 .back{display:inline-flex;margin-bottom:14px}
 .btn{flex:1 1 auto;justify-content:center}
}
@media print{aside,.mtop{display:none}.app{display:block}}
</style></head><body>

 <div class="sidetop">

  <label class="sbox"><span style="color:var(--mut)">⌕</span><input id="q" placeholder="Buscar Skills o agentes" autocomplete="off"><kbd>/</kbd></label>
 </div>

 </div>

 </div>

<script>
const D={"dzialy": [{"dzial_nr": 1, "dzial": "Recorridas y visitas a campo", "opis": "La recorrida termina en la tranquera, pero el trabajo sigue en el escritorio: informes de monitoreo, fotos, informes de daño y recomendaciones para el productor. Dicta en la camioneta o pega tus notas y recibe el documento terminado, con los cálculos paso a paso y cada hueco marcado antes de que lo firmes.", "skills": [{"id": "1.01", "nazwa": "Plan de recorrida antes de la visita", "tag": "ANTES DE LA VISITA", "co_robi": "Arma el plan de la recorrida antes de salir: orden de los lotes, qué mirar en cada uno, método de muestreo, preguntas para el productor y lista de equipo. Llegas al lote sabiendo a qué vas.", "kiedy": "La noche anterior o a primera hora, cuando tienes varios productores en la agenda y poco tiempo para cada lote.", "brief": [{"pole": "Motivo de la visita", "opis": "Por qué vas, por ejemplo “monitoreo de rutina de soja y consulta por manchas en el maíz tardío”."}, {"pole": "Productor y lotes", "opis": "Productor, campo, lotes y hectáreas, por ejemplo “Hnos. Benítez, Venado Tuerto — Lote 7 (85 ha) y La Loma (60 ha)”."}, {"pole": "Cultivos y estadios", "opis": "Cultivo, híbrido o variedad y estadio aproximado, por ejemplo “soja de primera en R2, maíz tardío en V8”."}, {"pole": "Historial y señales", "opis": "Lo que pasó antes y lo que te comentaron, por ejemplo “el año pasado hubo chinches en La Loma; el encargado vio hojas comidas”."}, {"pole": "Clima y condiciones", "opis": "Lluvias y pronóstico, por ejemplo “35 mm el martes, calor húmedo, pronóstico de tormenta el jueves”."}, {"pole": "Tiempo y equipo", "opis": "Tiempo disponible y lo que llevas, por ejemplo “3 horas, paño vertical, red de arrastre, pala, lupa y celular con GPS”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que planifica recorridas a campo con criterio de manejo integrado de plagas. Arma mi plan de visita para que no se me escape nada importante.\n\nDATOS:\nMotivo de la visita: [MOTIVO DE LA VISITA]\nProductor y lotes: [PRODUCTOR Y LOTES]\nCultivos y estadios: [CULTIVOS Y ESTADIOS]\nHistorial y señales: [HISTORIAL Y SEÑALES]\nClima y condiciones: [CLIMA Y CONDICIONES]\nTiempo y equipo: [TIEMPO Y EQUIPO]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Piensa en manejo integrado: primero observar e identificar, después decidir. Indica qué conviene revisar en cada estadio (V/R en maíz y soja, Zadoks en trigo y cebada, BBCH en otros cultivos), sin citar umbrales de daño económico con números; si hace falta uno, pídeme la fuente (INTA, INIFAP, INIA, la etiqueta).\n4. Escribe las preguntas para el productor en lenguaje simple, como se las harías en la tranquera, agrupadas por tema.\n5. Ajusta el plan al tiempo que tengo. Si no alcanza para todo, marca qué es prioridad y qué puede esperar.\n6. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Plan de visita paso a paso: orden de los lotes y tiempo estimado para cada uno.\nB) Qué revisar en cada lote: observaciones, método (recorrido en W o zigzag, conteo de plantas, paño vertical, red de arrastre, trampas) y qué registrar.\nC) Preguntas para el productor agrupadas: aplicaciones y fertilización, clima y condiciones del lote, decisiones pendientes.\nD) Lista de equipo y materiales.\nE) Datos que faltan, con sus marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Hazme una versión corta para leer en el celular dentro de la camioneta.", "Agrega una planilla vacía para anotar conteos lote por lote.", "Ordena los lotes para minimizar kilómetros entre uno y otro.", "Agrega qué fotos debo sacar en cada lote para el informe.", "Prepara un mensaje de WhatsApp para avisarle al productor a qué hora llego.", "Marca qué muestras conviene llevar al laboratorio y cómo tomarlas.", "Arma un plan B por si llueve y no puedo entrar a algún lote.", "Haz una lista de las decisiones que el productor tiene que tomar esta semana.", "Separa lo que reviso yo y lo que puede revisar el encargado del campo.", "Convierte el plan en una lista de verificación para tachar a campo."], "checklista": ["El orden de los lotes es lógico para el tiempo que tienes.", "Cada lote tiene un método de muestreo claro y qué registrar.", "No aparece ningún umbral con número que no venga de tu fuente.", "Las preguntas para el productor están en lenguaje simple.", "El equipo de la lista es el que realmente llevas.", "Lo marcado [A COMPLETAR] lo puedes conseguir antes de salir."], "uwaga": "Este plan no reemplaza las recomendaciones de tu INTA, INIFAP, INIA o centro de investigación local ni la etiqueta de cada producto. Los umbrales y criterios de decisión los pones tú, con su fuente.", "przyklad": {"wejscie": "Mañana voy a lo de los Hermanos Benítez, cerca de Venado Tuerto. Tengo unas tres horas. Lote 7 son 85 hectáreas de soja de primera, debería andar en R2. La Loma son 60 hectáreas de maíz tardío, más o menos V8. El encargado me dijo que vio hojas comidas en la soja y unas manchas en el maíz que no sabe qué son. El año pasado en La Loma tuvimos chinches tarde. Llovieron 35 milímetros el martes y está pesado, húmedo, pronostican tormenta para el jueves. Llevo paño vertical, red, pala, lupa y el celular. Ármame el plan para no perder tiempo, porque a la tarde tengo otro productor.", "wynik": "A) PLAN DE VISITA (3 h)\n| Orden | Lote | Cultivo y estadio | Tiempo |\n| 1 | Lote 7 (85 ha) | soja de primera, R2 [VERIFICAR] | 1 h 30 |\n| 2 | La Loma (60 ha) | maíz tardío, V8 [VERIFICAR] | 1 h |\n| 3 | Charla con el productor | — | 30 min |\n\nB) QUÉ REVISAR\nLote 7: recorrido en W con 5–10 estaciones [SUPUESTO]. Defoliación por estación (porcentaje estimado), paño vertical para orugas y chinches, estado de las hojas superiores. Registrar conteos y fotos con punto GPS. Comparación con umbral: [A COMPLETAR: umbral y fuente].\nLa Loma: revisar las manchas (en qué hojas, forma, color, si hay esporulación), recorrido en zigzag, sacar fotos de cerca y de lejos. Si no hay diagnóstico claro, tomar muestra para laboratorio [VERIFICAR].\n\nC) PREGUNTAS PARA EL PRODUCTOR\n- Aplicaciones: ¿qué se aplicó en cada lote y cuándo? [A COMPLETAR]\n- Clima: ¿cómo quedaron los bajos después de la lluvia del martes?\n- Decisiones: ¿hay presupuesto y equipo disponible si hace falta aplicar antes del jueves?\n\nD) EQUIPO: paño vertical, red de arrastre, pala, lupa, celular con GPS; agregar bolsas y etiquetas para muestras.\n\nE) FALTA: historial de aplicaciones [A COMPLETAR]; híbrido del maíz [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "1.02", "nazwa": "Informe de recorrida", "tag": "INFORME DE RECORRIDA", "co_robi": "Convierte tus notas de la recorrida en un informe ordenado: estado del cultivo, enfermedades, insectos, malezas, nutrición y conclusiones. Separa los hechos de la interpretación y deja claro lo que todavía no sabes.", "kiedy": "Apenas terminas de recorrer, cuando tienes las notas en el celular y el productor quiere saber qué pasa antes de que termine el día.", "brief": [{"pole": "Productor y lote", "opis": "Productor, lote y hectáreas, por ejemplo “Agropecuaria Don Ernesto, Pergamino — Lote 4, unas 120 ha”."}, {"pole": "Cultivo y estadio", "opis": "Cultivo, variedad, fecha de siembra y estadio, por ejemplo “soja, sembrada el 2 de noviembre, R3”."}, {"pole": "Fecha y condiciones", "opis": "Fecha, hora y clima de la recorrida, por ejemplo “14 de enero, media mañana, 29 °C, húmedo, con rocío”."}, {"pole": "Observaciones a campo", "opis": "Lo que viste, por ejemplo “mancha ojo de rana en hojas superiores de la mitad oeste, algo de defoliación por orugas, escapes de yuyo colorado en las cabeceras”."}, {"pole": "Aplicaciones previas", "opis": "Lo aplicado en la campaña según los registros, por ejemplo “preemergente con residual en octubre y una aplicación de posemergencia el 10 de diciembre”."}, {"pole": "Destinatario del informe", "opis": "Quién lo lee y cómo, por ejemplo “el productor por mail, con copia a la carpeta del lote”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que escribe informes de recorrida que los productores realmente leen. Convierte mis notas de campo en un informe claro y profesional.\n\nDATOS:\nProductor y lote: [PRODUCTOR Y LOTE]\nCultivo y estadio: [CULTIVO Y ESTADIO]\nFecha y condiciones: [FECHA Y CONDICIONES]\nObservaciones a campo: [OBSERVACIONES A CAMPO]\nAplicaciones previas: [APLICACIONES PREVIAS]\nDestinatario del informe: [DESTINATARIO DEL INFORME]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Separa los hechos (lo que vi y conté) de la interpretación (lo que probablemente significa). Nunca conviertas una sospecha en diagnóstico.\n4. Ordena por categoría: población y estado del cultivo, enfermedades, insectos, malezas, nutrición y otros.\n5. No compares nada con un umbral de daño económico salvo que yo te dé el umbral y su fuente (INTA, INIFAP, INIA, etiqueta). Si no, escribe [A COMPLETAR: umbral y fuente].\n6. Nunca nombres un producto ni una dosis por tu cuenta. Si puede hacer falta actuar, escribe la decisión pendiente y marca producto y dosis [VER ETIQUETA].\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Encabezado: productor, lote, hectáreas, cultivo, estadio, fecha y quién recorrió.\nB) Tabla de observaciones: categoría | qué se vio | dónde en el lote | severidad o conteo.\nC) Interpretación y causas probables, cada una marcada como confirmada o [VERIFICAR].\nD) Próximos pasos y cuándo volver a recorrer.\nE) Preguntas abiertas y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Acorta el informe a media página para que el productor lo lea en el celular.", "Agrega una columna con el punto GPS o el número de estaca de cada observación.", "Reescribe la interpretación en lenguaje simple, sin tecnicismos.", "Haz una versión para el encargado del campo solo con decisiones y plazos.", "Indica qué observaciones necesitan muestra de laboratorio para confirmarse.", "Agrega un calendario de recorridas para las próximas dos semanas.", "Saca todos los [VERIFICAR] a una lista para mi próxima visita.", "Agrega una sección que compare esta visita con mi informe anterior de este lote.", "Redacta un WhatsApp corto al productor con los tres hallazgos clave.", "Dale formato para pegarlo en las notas de mi app de monitoreo."], "checklista": ["Productor, lote, cultivo, estadio y fecha son correctos.", "Los hechos y la interpretación están claramente separados.", "Toda comparación con un umbral cita tu propia fuente, no la de la IA.", "Ningún producto o dosis aparece sin [VER ETIQUETA] o sin la etiqueta en la mano.", "Los conteos y porcentajes coinciden con tus notas de campo.", "Cada [VERIFICAR] tiene un plan para confirmarlo.", "El informe va firmado con tu nombre y matrícula."], "uwaga": "Este informe no reemplaza la etiqueta del fitosanitario ni las recomendaciones de tu centro de investigación local. Productos y dosis salen solo de la etiqueta vigente (la etiqueta manda), con receta agronómica donde sea obligatoria, y cada aplicación va al registro de aplicaciones.", "przyklad": {"wejscie": "Agropecuaria Don Ernesto, Lote 4, Pergamino, unas 120 hectáreas de soja. Sembrada el 2 de noviembre, ya está en R3. Recorrí hoy, 14 de enero, como a las diez, 29 grados, muy húmedo, todavía con rocío. En la mitad oeste hay mancha ojo de rana en las hojas de arriba, diría que una de cada cuatro plantas que miré tenía algunas lesiones. Algo de defoliación por orugas, nada grave, calculo menos del diez por ciento. Escapes de yuyo colorado en las cabeceras del este, algunos hasta la rodilla. Tuvieron un preemergente con residual en octubre y una posemergencia el 10 de diciembre. Mándaselo a Don Ernesto por mail y guardo copia en la carpeta.", "wynik": "INFORME DE RECORRIDA\nProductor: Agropecuaria Don Ernesto | Lote 4, Pergamino | ~120 ha\nCultivo: soja, sembrada el 2/11 | Estadio: R3 | Fecha: 14/1, ~10:00, 29 °C, húmedo | Recorrió: [A COMPLETAR]\n\nB) OBSERVACIONES\n| Categoría | Qué se vio | Dónde | Severidad |\n| Enfermedad | mancha ojo de rana, hojas superiores | mitad oeste | ~25 % de plantas revisadas (estimación) |\n| Insectos | defoliación por orugas | dispersa | <10 % (estimación) |\n| Malezas | escapes de yuyo colorado, hasta la rodilla | cabeceras este | localizado |\n| Población | [A COMPLETAR] | — | — |\n\nC) INTERPRETACIÓN\n- Mancha ojo de rana en el estrato superior en R3 con clima húmedo: vale seguirla de cerca; la respuesta depende del comportamiento de la variedad [A COMPLETAR] y del clima. Si se justifica un fungicida [VERIFICAR] contra la recomendación de tu INTA o asesor regional.\n- La defoliación se compara con un umbral solo cuando lo cargues: [A COMPLETAR: umbral y fuente].\n- Escapes de yuyo colorado después de pre y post: posible resistencia o falla de momento [VERIFICAR]; anotar para el plan de la próxima campaña.\n\nD) PRÓXIMOS PASOS\n- Decisión: fungicida sí o no en la mitad oeste; producto, dosis y tiempo de carencia [VER ETIQUETA].\n- Volver a recorrer en unos 7 días [SUPUESTO], mirando avance de la mancha y defoliación.\n- Marcar los manchones de yuyo colorado para el manejo del banco de semillas.\n\nE) FALTA: variedad y su comportamiento sanitario [A COMPLETAR]; producto del post según registros [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "1.03", "nazwa": "De nota de voz a informe", "tag": "NOTA DE VOZ", "co_robi": "Toma la transcripción del audio que grabaste en la camioneta y la convierte en el documento que necesitas: informe, nota para la carpeta del lote o mensaje al productor. Corrige lo que el dictado entendió mal y te muestra cada corrección.", "kiedy": "Cuando grabaste todo de corrido entre lote y lote y no tienes tiempo de pasarlo en limpio a la noche.", "brief": [{"pole": "Transcripción del audio", "opis": "Pega el texto tal como salió del dictado, por ejemplo “bueno estamos en el lote del molino el maíz está en ve seis hay cogollero en algunas plantas…”."}, {"pole": "Productor y lote", "opis": "Productor y lote, por ejemplo “Martín Ortiz, Potrero del Molino, General Villegas, 70 ha”."}, {"pole": "Fecha de la visita", "opis": "Fecha y hora, por ejemplo “3 de diciembre, 16 h”."}, {"pole": "Tipo de documento", "opis": "Qué quieres obtener, por ejemplo “informe de recorrida completo para la carpeta del lote”."}, {"pole": "Destinatario", "opis": "Quién lo va a leer, por ejemplo “el productor, que lo lee en el celular”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que pasa en limpio notas de voz de recorridas. Convierte mi audio transcripto en un documento profesional sin agregar nada que yo no haya dicho.\n\nDATOS:\nTranscripción del audio: [TRANSCRIPCIÓN DEL AUDIO]\nProductor y lote: [PRODUCTOR Y LOTE]\nFecha de la visita: [FECHA DE LA VISITA]\nTipo de documento: [TIPO DE DOCUMENTO]\nDestinatario: [DESTINATARIO]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Corrige las palabras que el dictado claramente entendió mal (términos de cultivos, estadios como V6 o R3, escala Zadoks, nombres de malezas y plagas). Haz una lista de cada corrección para que la revise.\n4. Si una palabra o un número no se entiende con seguridad, no adivines: márcalo [VERIFICAR] y pregúntame.\n5. Conserva solo lo que dije. No agregues observaciones, causas ni recomendaciones que no hice; si algo parece faltar, déjalo como pregunta.\n6. Adapta el tono y el largo al destinatario: un mensaje al productor es corto y simple; una nota para la carpeta del lote es completa y fáctica.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) El documento terminado en el formato pedido.\nB) Correcciones del dictado: palabra original → palabra corregida.\nC) Partes dudosas y preguntas para mí, marcadas [VERIFICAR] o [A COMPLETAR].\nD) Opcional: una versión de 2–3 oraciones para un WhatsApp rápido al productor.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Convierte el mismo audio en un informe de recorrida con tabla de observaciones.", "Haz solo el mensaje de WhatsApp para el productor, en cinco líneas.", "Separa lo que es observación de lo que es tarea pendiente.", "Arma la lista de tareas que salen del audio, con responsable y fecha.", "Saca todos los números del audio a una tabla para que los revise.", "Reescríbelo en un tono más formal para la empresa o la cooperativa.", "Agrega al final las preguntas que tengo que hacerle al productor.", "Haz una versión para el encargado del campo, sin términos técnicos.", "Marca qué partes del audio conviene volver a escuchar.", "Dale formato de entrada para la ficha histórica del lote."], "checklista": ["Revisaste cada corrección del dictado.", "No aparece nada que no hayas dicho.", "Los números (plantas, porcentajes, hectáreas) coinciden con el audio.", "Los estadios y los nombres de plagas y malezas están bien escritos.", "Los [VERIFICAR] quedaron resueltos antes de enviar.", "El largo y el tono sirven para quien lo va a leer."], "uwaga": "La IA puede entender mal un número o un nombre del audio. Antes de enviar, compara el documento con lo que grabaste; cualquier recomendación de producto o dosis sale de la etiqueta y de tu receta agronómica, no del dictado.", "przyklad": {"wejscie": "Te paso el audio de lo de Martín Ortiz, Potrero del Molino, setenta hectáreas, 3 de diciembre a las cuatro de la tarde. Dice así: bueno estamos en el lote del molino el maíz está en ve seis parejo hay cogollero en algunas plantas diría que en diez de cada cien con daño fresco en el cogollo los bajos están encharcados todavía hay un manchón de sorgo de alepo cerca del molino hay que ver si es el mismo de siempre el productor pregunta si conviene aplicar ya o esperar a la semana que viene. Quiero un informe completo para la carpeta del lote y algo corto para mandarle a Martín.", "wynik": "A) NOTA PARA LA CARPETA DEL LOTE\nProductor: Martín Ortiz | Lote: Potrero del Molino | 70 ha | Fecha: 3/12, 16 h\nCultivo: maíz | Estadio: V6, parejo | Híbrido: [A COMPLETAR]\n\n| Categoría | Observación | Dónde |\n| Insectos | cogollero con daño fresco en el cogollo, ~10 de cada 100 plantas (estimación a campo) | sin precisar [VERIFICAR] |\n| Malezas | manchón de sorgo de alepo | cerca del molino |\n| Suelo y agua | bajos todavía encharcados | bajos del lote |\n\nConsulta del productor: ¿aplicar ya o esperar a la semana próxima? Queda pendiente; la decisión depende del umbral [A COMPLETAR: umbral y fuente] y del producto [VER ETIQUETA].\n\nB) CORRECCIONES DEL DICTADO\n| Original | Corregido |\n| “ve seis” | V6 |\n| “sorgo de alepo” | sorgo de Alepo |\n\nC) DUDAS Y PREGUNTAS\n- ¿El 10 % es sobre plantas revisadas en todo el lote o en una zona? [VERIFICAR]\n- ¿Cuántas estaciones de muestreo hiciste? [A COMPLETAR]\n- ¿El sorgo de Alepo es el mismo manchón de campañas anteriores? [VERIFICAR]\n\nD) WHATSAPP PARA MARTÍN\n“Martín, el maíz del Molino está parejo en V6. Hay cogollero en cerca del 10 % de las plantas que miré y un manchón de sorgo de Alepo cerca del molino. Te confirmo mañana si conviene aplicar ahora o esperar.”\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "1.04", "nazwa": "Registro fotográfico de campo", "tag": "REGISTRO DE FOTOS", "co_robi": "Ordena las fotos de la recorrida: número, nombre de archivo, pie de foto y qué demuestra cada una. Te avisa qué tomas faltan para que el registro sirva como evidencia ante el productor, la aseguradora o un reclamo.", "kiedy": "Después de la recorrida, cuando tienes 30 fotos sueltas en el celular y necesitas armarlas para un informe, un reclamo por deriva o un siniestro.", "brief": [{"pole": "Lista de fotos", "opis": "Lo que muestra cada foto, por ejemplo “1: vista general desde la tranquera; 2: hoja con pústulas; 3: plantas volcadas en el bajo”."}, {"pole": "Productor y lote", "opis": "Productor y lote, por ejemplo “Lucía Ramírez, Lote El Bajo, Río Cuarto, 95 ha”."}, {"pole": "Cultivo y estadio", "opis": "Cultivo y estadio, por ejemplo “maíz temprano en R2”."}, {"pole": "Fecha y hora", "opis": "Cuándo se tomaron, por ejemplo “20 de enero, entre 9 y 10 h”."}, {"pole": "Ubicación en el lote", "opis": "Dónde se tomaron, por ejemplo “cabecera norte y bajo central, con puntos GPS en el celular”."}, {"pole": "Objetivo del registro", "opis": "Para qué sirve, por ejemplo “evidencia para la aseguradora por granizo del 18 de enero”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que documenta lotes con fotos que sirven como evidencia. Arma el registro fotográfico ordenado de mi recorrida.\n\nDATOS:\nLista de fotos: [LISTA DE FOTOS]\nProductor y lote: [PRODUCTOR Y LOTE]\nCultivo y estadio: [CULTIVO Y ESTADIO]\nFecha y hora: [FECHA Y HORA]\nUbicación en el lote: [UBICACIÓN EN EL LOTE]\nObjetivo del registro: [OBJETIVO DEL REGISTRO]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Dale a cada foto un número, un nombre de archivo uniforme (fecha_productor_lote_número) y un pie de foto: qué muestra, dónde, estadio del cultivo y por qué importa.\n4. Describe solo lo que se ve o lo que te dije. No diagnostiques a partir de una descripción: si hay una causa sospechada, escríbela como sospecha y márcala [VERIFICAR].\n5. Si el objetivo es evidencia (seguro agrícola, reclamo por deriva, disputa), agrega qué demuestra cada foto y qué podría pedir quien la revise: referencia de escala, toma general o una zona testigo sin daño.\n6. Señala los huecos del conjunto: faltan tomas generales, primeros planos, referencia de tamaño o fecha y hora visibles.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Tabla del registro: n.º | nombre de archivo | pie de foto | ubicación | qué documenta.\nB) Párrafo breve de resumen para el informe o el expediente del siniestro.\nC) Tomas que faltan para la próxima visita.\nD) Datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Ordena las fotos según el recorrido del lote, de la tranquera hacia el fondo.", "Haz una versión del registro solo con las fotos que sirven como evidencia.", "Agrega una columna con las coordenadas de cada foto.", "Escribe los pies de foto más cortos para un PDF de una página.", "Arma la lista de tomas que tengo que repetir con mejor luz.", "Redacta el mensaje para mandarle las fotos al productor por WhatsApp.", "Separa las fotos de daño de las fotos de zona testigo.", "Prepara el texto para adjuntar las fotos al expediente del seguro.", "Agrega qué objeto usar como referencia de escala en cada toma.", "Arma una plantilla de registro para usar en todas mis recorridas."], "checklista": ["Cada foto tiene número, nombre de archivo y pie de foto.", "Los pies describen lo que se ve, sin diagnósticos inventados.", "Hay tomas generales y primeros planos de cada problema.", "Hay referencia de escala donde importa el tamaño.", "La fecha, la hora y la ubicación están registradas.", "Si es evidencia, hay al menos una zona testigo sin daño."], "uwaga": "Las fotos son evidencia solo si se puede comprobar cuándo y dónde se tomaron. Para un siniestro o un reclamo, confirma con la aseguradora o el organismo que corresponda qué formato y qué plazos acepta [VERIFICAR]; la IA no conoce las condiciones de cada póliza.", "przyklad": {"wejscie": "Lucía Ramírez, Lote El Bajo, Río Cuarto, 95 hectáreas de maíz temprano en R2. Las fotos son del 20 de enero entre las nueve y las diez. Es para la aseguradora por el granizo del 18. Tengo: una vista general desde la tranquera, otra vista general desde la cabecera norte, tres primeros planos de hojas deshilachadas, una planta con la caña quebrada, dos de plantas volcadas en el bajo central, una espiga con golpes en la chala y una del cielo con las nubes de la tarde del 18 que me mandó la hija de Lucía. Los puntos GPS están en el celular. Ordénamelas y dime qué me falta.", "wynik": "A) REGISTRO FOTOGRÁFICO\n| N.º | Archivo | Pie de foto | Ubicación | Qué documenta |\n| 1 | 2001_Ramirez_ElBajo_01 | Vista general desde la tranquera, maíz en R2 | entrada | estado general después del evento |\n| 2 | 2001_Ramirez_ElBajo_02 | Vista general desde la cabecera norte | cabecera norte | extensión del daño |\n| 3–5 | 2001_Ramirez_ElBajo_03 a 05 | Hojas deshilachadas, primer plano | [A COMPLETAR] | tipo de daño en hoja |\n| 6 | 2001_Ramirez_ElBajo_06 | Planta con caña quebrada | [A COMPLETAR] | daño en tallo |\n| 7–8 | 2001_Ramirez_ElBajo_07 y 08 | Plantas volcadas | bajo central | vuelco; causa a confirmar [VERIFICAR] |\n| 9 | 2001_Ramirez_ElBajo_09 | Espiga con golpes en la chala | [A COMPLETAR] | daño en espiga |\n| 10 | 1801_Ramirez_ElBajo_10 | Nubes la tarde del 18/1 (foto de terceros) | — | contexto del evento; autor y hora [VERIFICAR] |\n\nB) RESUMEN\nEl 20/1 se recorrió el Lote El Bajo (95 ha, maíz en R2) tras el granizo informado del 18/1. Se registraron daño foliar, caña quebrada, vuelco en el bajo central y golpes en espigas. El porcentaje de superficie afectada queda [A COMPLETAR].\n\nC) TOMAS QUE FALTAN\n- Zona testigo sin daño para comparar.\n- Referencia de escala (regla o bota) en hojas y espiga.\n- Toma general del bajo central.\n\nD) FALTA: puntos GPS por foto [A COMPLETAR]; número de póliza y plazo de denuncia [VERIFICAR CON LA ASEGURADORA].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "1.05", "nazwa": "Evaluación de daño por helada", "tag": "DAÑO POR HELADA", "co_robi": "Ordena la evaluación de un lote después de una helada: cómo muestrear, cuántas plantas quedaron vivas, cómo se reparte el daño y qué opciones hay (seguir o resembrar). Todo con tus conteos y tus criterios, sin números inventados.", "kiedy": "Dos a cinco días después de una helada en trigo, maíz, soja o girasol, cuando el productor pregunta si el lote se salva.", "brief": [{"pole": "Productor y lote", "opis": "Productor, lote y hectáreas, por ejemplo “Jorge Ferreyra, Bragado — La Loma, 110 ha”."}, {"pole": "Cultivo y variedad", "opis": "Cultivo, variedad o híbrido y fecha de siembra, por ejemplo “girasol de ciclo intermedio, sembrado el 5 de septiembre”."}, {"pole": "Estado previo a la helada", "opis": "Cómo estaba el cultivo antes, por ejemplo “emergencia pareja, V2–V4, buena humedad”."}, {"pole": "Evento y condiciones", "opis": "Qué pasó, por ejemplo “helada la madrugada del 22 de septiembre; la estación del campo registró la mínima, el bajo amaneció blanco”."}, {"pole": "Resultados de la evaluación", "opis": "Tus conteos, por ejemplo “6 estaciones de 10 m lineales: plantas vivas 38, 35, 30, 12, 15, 34; muertas 4, 6, 9, 27, 25, 5”."}, {"pole": "Criterios de decisión", "opis": "Los que usas tú, con su fuente, por ejemplo “población mínima para no resembrar según la guía del INTA que uso”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que evalúa daño por helada con método y sin apuros. Ayúdame a ordenar la evaluación y la decisión de seguir o resembrar.\n\nDATOS:\nProductor y lote: [PRODUCTOR Y LOTE]\nCultivo y variedad: [CULTIVO Y VARIEDAD]\nEstado previo a la helada: [ESTADO PREVIO A LA HELADA]\nEvento y condiciones: [EVENTO Y CONDICIONES]\nResultados de la evaluación: [RESULTADOS DE LA EVALUACIÓN]\nCriterios de decisión: [CRITERIOS DE DECISIÓN]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Explica cómo evaluar: dónde y cuántas estaciones contar, cuántos días esperar para ver rebrote, qué mirar en la planta (punto de crecimiento, tejido sano firme o tejido oscuro y blando) según el cultivo y el estadio.\n4. Calcula el porcentaje de plantas vivas y las plantas por hectárea con mis números, y muestra la diferencia entre estaciones.\n5. Compara los resultados solo con los criterios que yo te dé, con su fuente. Nunca pongas una población mínima propia: si no la di, escribe [A COMPLETAR: población mínima y fuente].\n6. Presenta la decisión de seguir o resembrar con honestidad, incluido el daño desparejo por zonas, y recuérdame avisar a la aseguradora antes de resembrar o destruir hectáreas aseguradas.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Método de evaluación usado y qué conviene repetir o agregar.\nB) Cálculos paso a paso: plantas vivas por estación, porcentaje de supervivencia, plantas/ha y variación entre estaciones.\nC) Mapa simple por zonas del lote (loma, media loma, bajo) con el daño.\nD) Opciones: seguir, resembrar por zonas o resembrar todo, con lo que falta para decidir.\nE) Datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Arma una planilla para repetir el conteo dentro de 5 días.", "Calcula las plantas/ha por zona, separando loma y bajo.", "Haz una tabla comparando seguir contra resembrar solo el bajo.", "Redacta el mensaje para avisarle al productor cómo quedó el lote.", "Prepara la lista de datos que me va a pedir la aseguradora.", "Explícame cómo hacer la prueba de rebrote en bolsa con plantas del lote.", "Agrega qué fotos tengo que sacar para documentar la helada.", "Arma las preguntas para el semillero sobre disponibilidad de semilla para resembrar.", "Haz una versión corta para el encargado con lo que tiene que mirar a diario.", "Resume la evaluación en un párrafo para la ficha histórica del lote."], "checklista": ["El número y la ubicación de las estaciones representan todo el lote.", "Los cálculos de plantas vivas y plantas/ha están bien hechos.", "La población mínima viene de tu fuente, no de la IA.", "Se esperó el tiempo necesario para ver rebrote antes de decidir.", "Se tuvo en cuenta el daño desparejo por zonas.", "La aseguradora está avisada antes de resembrar hectáreas aseguradas."], "uwaga": "La decisión de resembrar depende de la fecha, la semilla disponible, los costos y las condiciones de la póliza. Confirma los criterios con tu centro de investigación local o tu guía de referencia y avisa a la aseguradora antes de mover un lote asegurado.", "przyklad": {"wejscie": "Jorge Ferreyra, Bragado, lote La Loma, 110 hectáreas de girasol sembrado el 5 de septiembre. Antes de la helada estaba parejo, entre V2 y V4, con buena humedad. Heló la madrugada del 22, el bajo amaneció blanco, la mínima la tengo de la estación del campo pero no la tengo acá. Hoy 25 hice seis estaciones de diez metros lineales. Plantas vivas: 38, 35, 30, 12, 15, 34. Muertas: 4, 6, 9, 27, 25, 5. Las estaciones 4 y 5 son del bajo. Distancia entre hileras 70 centímetros. Jorge me pregunta si resembramos. La población mínima la tengo que buscar en la guía del INTA.", "wynik": "A) MÉTODO\n6 estaciones de 10 m lineales, a 70 cm entre hileras (superficie por estación: 10 × 0,7 = 7 m²). Recomendable repetir el conteo en 3–5 días [SUPUESTO] para ver rebrote real.\n\nB) CÁLCULOS\n| Est. | Vivas | Muertas | % vivas | Plantas/ha |\n| 1 | 38 | 4 | 90 % | 38 ÷ 7 × 10.000 = 54.286 |\n| 2 | 35 | 6 | 85 % | 50.000 |\n| 3 | 30 | 9 | 77 % | 42.857 |\n| 4 (bajo) | 12 | 27 | 31 % | 17.143 |\n| 5 (bajo) | 15 | 25 | 38 % | 21.429 |\n| 6 | 34 | 5 | 87 % | 48.571 |\nLoma y media loma (1, 2, 3, 6): promedio 34,3 vivas → 48.929 plantas/ha.\nBajo (4 y 5): promedio 13,5 vivas → 19.286 plantas/ha.\nTodo el lote: 164 vivas ÷ 42 m² × 10.000 = 39.048 plantas/ha.\n\nC) ZONAS: daño concentrado en el bajo; superficie del bajo [A COMPLETAR: ha].\n\nD) OPCIONES\n- Seguir en todo el lote: depende de la población mínima [A COMPLETAR: población mínima y fuente].\n- Resembrar solo el bajo: necesita semilla [A COMPLETAR], costo [A COMPLETAR] y fecha límite de siembra [VERIFICAR].\n- Avisar a la aseguradora antes de tocar el lote [VERIFICAR CON LA ASEGURADORA].\n\nE) FALTA: temperatura mínima registrada [A COMPLETAR]; híbrido [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "1.06", "nazwa": "Recuento de plantas logradas", "tag": "PLANTAS LOGRADAS", "co_robi": "Convierte tus conteos de emergencia en plantas logradas por hectárea, con promedio, rango y uniformidad. Te deja la pregunta de la resiembra planteada con números, no a ojo.", "kiedy": "Entre una y tres semanas después de la siembra, cuando el productor ve fallas en las hileras y quiere saber si vale la pena resembrar.", "brief": [{"pole": "Productor y lote", "opis": "Productor, lote y hectáreas, por ejemplo “Rancho Los Álamos, Guanajuato — Parcela 3, 40 ha”."}, {"pole": "Cultivo y siembra", "opis": "Cultivo, híbrido, fecha y densidad sembrada, por ejemplo “maíz, sembrado el 12 de junio a la densidad que indicó el productor, surcos a 76 cm”."}, {"pole": "Método de conteo", "opis": "Cómo contaste, por ejemplo “plantas en 5,2 m lineales de surco (equivale a 1/2.500 de ha a 76 cm)”."}, {"pole": "Resultados del conteo", "opis": "Tus números, por ejemplo “8 estaciones: 33, 35, 30, 34, 22, 31, 36, 29 plantas”."}, {"pole": "Población objetivo", "opis": "Población buscada y su fuente, por ejemplo “la que recomienda el semillero para ese híbrido en temporal”."}, {"pole": "Notas de emergencia", "opis": "Lo que viste, por ejemplo “algunas plantas atrasadas en dos hojas, fallas seguidas en la zona compactada, pocas dobles”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que evalúa la implantación de cultivos. Convierte mis conteos en plantas logradas por hectárea y ordena la decisión de resembrar.\n\nDATOS:\nProductor y lote: [PRODUCTOR Y LOTE]\nCultivo y siembra: [CULTIVO Y SIEMBRA]\nMétodo de conteo: [MÉTODO DE CONTEO]\nResultados del conteo: [RESULTADOS DEL CONTEO]\nPoblación objetivo: [POBLACIÓN OBJETIVO]\nNotas de emergencia: [NOTAS DE EMERGENCIA]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Convierte mis conteos a plantas por hectárea con el método que describo (metros lineales de surco según mi distancia entre hileras, aro o marco, o plantas por metro). Usa siempre hectáreas.\n4. Muestra el promedio, el rango y la variación entre estaciones, y comenta la uniformidad de emergencia (plantas atrasadas, fallas, dobles) solo con lo que te informé.\n5. Compara el resultado solo con la población objetivo o el criterio de resiembra que yo te dé, con su fuente. Si no lo di, escribe [A COMPLETAR: población objetivo y fuente]. Nunca pongas una densidad ni un porcentaje de pérdida de rinde por tu cuenta.\n6. Plantea la resiembra con equilibrio: población, uniformidad, fecha, semilla y costo [A COMPLETAR], y recuérdame avisar a la aseguradora antes de resembrar hectáreas aseguradas.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Tabla de conteo: estación | plantas contadas | plantas/ha.\nB) Cálculos paso a paso: factor de conversión, promedio, rango y coeficiente de variación.\nC) Uniformidad de emergencia y posibles causas, marcadas [VERIFICAR].\nD) Comparación con la población objetivo y opciones (dejar, resembrar por zonas, resembrar todo).\nE) Datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Calcula cuántos metros lineales contar para 1/1.000 de ha con mi distancia entre hileras.", "Separa los resultados por ambiente: loma, media loma y bajo.", "Arma una planilla de conteo para que la complete el encargado.", "Compara la población lograda con la densidad sembrada y calcula el porcentaje de logro.", "Haz una tabla con lo que necesito saber para decidir la resiembra.", "Redacta un WhatsApp al productor con el resultado en tres líneas.", "Lista las posibles causas de las fallas que tengo que revisar en el próximo lote.", "Prepara un mensaje para el contratista sobre la regulación de la sembradora.", "Explícame cómo medir la uniformidad de distancia entre plantas.", "Resume el conteo para la ficha histórica del lote."], "checklista": ["El factor de conversión corresponde a tu distancia entre hileras.", "Las estaciones representan los distintos ambientes del lote.", "Promedio, rango y variación están bien calculados.", "La población objetivo viene del semillero o de tu fuente, no de la IA.", "Las causas de las fallas están marcadas como sospecha hasta confirmarlas.", "La aseguradora está avisada si se va a resembrar."], "uwaga": "La población objetivo y el criterio de resiembra dependen del híbrido, la zona y la fecha. Usa la recomendación del semillero y de tu centro de investigación local; la IA solo hace las cuentas con tus datos.", "przyklad": {"wejscie": "Rancho Los Álamos, en Guanajuato, Parcela 3, cuarenta hectáreas de maíz de temporal. Se sembró el 12 de junio, surcos a 76 centímetros. Conté plantas en 5,2 metros lineales, que a esa distancia es un dos mil quinientosavo de hectárea. Ocho estaciones: 33, 35, 30, 34, 22, 31, 36 y 29. La de 22 está en la parte compactada donde dan vuelta las máquinas. Hay algunas plantas atrasadas como dos hojas y pocas dobles. El semillero recomienda para ese híbrido en temporal 80 mil plantas por hectárea, eso me dijo el productor. Quiere saber si resiembra la zona mala.", "wynik": "A) CONTEO\n| Est. | Plantas | Plantas/ha (× 2.500) |\n| 1 | 33 | 82.500 |\n| 2 | 35 | 87.500 |\n| 3 | 30 | 75.000 |\n| 4 | 34 | 85.000 |\n| 5 | 22 | 55.000 |\n| 6 | 31 | 77.500 |\n| 7 | 36 | 90.000 |\n| 8 | 29 | 72.500 |\n\nB) CÁLCULOS\nFactor: 5,2 m × 0,76 m = 3,95 m² ≈ 1/2.500 ha → ×2.500.\nSuma: 250 plantas ÷ 8 = 31,25 por estación → 78.125 plantas/ha.\nRango: 55.000 a 90.000 plantas/ha.\nSin la estación 5: 228 ÷ 7 = 32,6 → 81.429 plantas/ha.\n\nC) UNIFORMIDAD\nPlantas atrasadas en dos hojas: competirán poco [SUPUESTO]; su proporción [A COMPLETAR]. La caída en la estación 5 coincide con la zona compactada; causa a confirmar [VERIFICAR].\n\nD) COMPARACIÓN\nObjetivo informado: 80.000 plantas/ha (semillero, vía productor) [VERIFICAR].\n- Lote en general: 78.125, muy cerca del objetivo.\n- Zona compactada: 55.000, claramente por debajo; superficie de esa zona [A COMPLETAR: ha].\nOpciones: dejar todo; resembrar solo la zona compactada (semilla [A COMPLETAR], costo [A COMPLETAR], fecha límite [VERIFICAR]). Avisar a la aseguradora antes de resembrar.\n\nE) FALTA: superficie de la zona compactada; porcentaje de plantas atrasadas.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "1.07", "nazwa": "Informe de daño en cultivo", "tag": "INFORME DE DAÑO", "co_robi": "Arma el informe técnico de un daño (granizo, viento, inundación, deriva, plaga) con el evento, el método, los hallazgos y la evidencia. Separa lo medido de lo estimado y no promete nada que dependa de la póliza.", "kiedy": "Después de un granizo, una inundación o una deriva, cuando el productor necesita un informe para la aseguradora, el banco o un reclamo.", "brief": [{"pole": "Tipo de daño", "opis": "Qué pasó, por ejemplo “granizo con viento”."}, {"pole": "Productor y lote", "opis": "Productor, lote y hectáreas, por ejemplo “Hnos. Benítez, Itapúa — Lote 12, 150 ha”."}, {"pole": "Cultivo y estadio", "opis": "Cultivo y estadio al momento del evento, por ejemplo “soja en R4”."}, {"pole": "Fechas del evento e inspección", "opis": "Cuándo pasó y cuándo inspeccionaste, por ejemplo “granizo el 8 de febrero a la tarde; inspección el 10 de febrero”."}, {"pole": "Hallazgos de la inspección", "opis": "Lo que mediste, por ejemplo “10 estaciones: defoliación estimada entre 20 y 60 %, tallos quebrados en 3 de cada 10 plantas en el sector norte”."}, {"pole": "Objetivo y presentes", "opis": "Para qué es y quién estuvo, por ejemplo “denuncia ante la aseguradora; presentes el productor y el perito”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que redacta informes técnicos de daño en cultivos con criterio de perito. Arma el informe del daño a partir de mi inspección.\n\nDATOS:\nTipo de daño: [TIPO DE DAÑO]\nProductor y lote: [PRODUCTOR Y LOTE]\nCultivo y estadio: [CULTIVO Y ESTADIO]\nFechas del evento e inspección: [FECHAS DEL EVENTO E INSPECCIÓN]\nHallazgos de la inspección: [HALLAZGOS DE LA INSPECCIÓN]\nObjetivo y presentes: [OBJETIVO Y PRESENTES]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Describe el evento, el método y los hallazgos de forma fáctica. Separa lo medido de lo estimado, y lo estimado de las opiniones.\n4. No estimes pérdida de rinde con una fórmula o tabla salvo que yo te dé el método oficial y su fuente; si no, escribe [A COMPLETAR: método de pérdida y fuente].\n5. No afirmes condiciones de la póliza, plazos, coberturas ni lo que pagará la aseguradora. Escribe lo que el productor debe confirmar con su aseguradora y márcalo [VERIFICAR].\n6. Agrega una lista de evidencias (fotos, puntos GPS, datos de lluvia o de la estación) y una lista de lo que todavía falta.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Encabezado: productor, lote, hectáreas, cultivo, estadio, fechas del evento y de la inspección, presentes.\nB) Descripción del evento.\nC) Método de evaluación y muestreo.\nD) Tabla de hallazgos y cálculos: superficie afectada, promedios, rangos.\nE) Evidencias, pendientes y puntos a confirmar con la aseguradora.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Haz una versión más corta para mandar con la denuncia del siniestro.", "Agrega una tabla de superficie afectada por sector del lote.", "Escribe la descripción del evento en tono más neutral para el perito.", "Arma la lista de documentos que tiene que juntar el productor.", "Prepara las preguntas para hacerle al perito durante la visita.", "Separa en dos columnas lo medido y lo estimado.", "Redacta una nota para el banco explicando el daño y sus efectos posibles.", "Agrega un plan de seguimiento para ver la recuperación del cultivo.", "Prepara un resumen para la ficha histórica del lote.", "Haz un mensaje al productor explicando los próximos pasos."], "checklista": ["Las fechas del evento y de la inspección son correctas.", "El método de muestreo está descrito y se puede repetir.", "Lo medido y lo estimado están separados.", "No hay cálculo de pérdida sin método oficial y fuente.", "No hay afirmaciones sobre la póliza ni sobre lo que se pagará.", "La lista de evidencias está completa o con sus pendientes."], "uwaga": "Este informe es técnico y no reemplaza la evaluación del perito ni las condiciones de la póliza. Plazos de denuncia, coberturas y métodos de tasación se confirman con la aseguradora; en casos de deriva, también con el organismo sanitario o ambiental que corresponda.", "przyklad": {"wejscie": "Hermanos Benítez, Itapúa, Lote 12, ciento cincuenta hectáreas de soja que estaba en R4. Cayó granizo con viento el 8 de febrero a la tarde. Inspeccioné el 10 a la mañana con el productor y el perito de la aseguradora. Hice diez estaciones. Defoliación estimada entre 20 y 60 por ciento, más fuerte en el sector norte, que serán unas 50 hectáreas. En el sector norte 3 de cada 10 plantas tienen el tallo quebrado. Vainas golpeadas en algunas plantas, no las conté. El pluviómetro del galpón marcó 42 milímetros esa tarde. Necesito el informe para la denuncia.", "wynik": "INFORME DE DAÑO\nProductor: Hnos. Benítez | Lote 12, Itapúa | 150 ha | Soja en R4\nEvento: granizo con viento, 8/2 por la tarde | Inspección: 10/2, mañana\nPresentes: productor, perito de la aseguradora, asesor [A COMPLETAR: nombre y matrícula]\n\nB) EVENTO\nGranizo con viento sobre el lote; lluvia registrada en el pluviómetro del galpón: 42 mm (dato del productor).\n\nC) MÉTODO\n10 estaciones distribuidas en el lote [VERIFICAR: ubicación de cada una]. Defoliación estimada a ojo por estación; tallos quebrados contados en el sector norte.\n\nD) HALLAZGOS\n| Indicador | Valor | Tipo |\n| Defoliación | 20–60 % según estación | estimado |\n| Sector más afectado | norte, ~50 ha (33 % del lote: 50 ÷ 150) | estimado |\n| Tallos quebrados (norte) | 3 de cada 10 plantas = 30 % | medido |\n| Vainas golpeadas | presentes, sin contar | observado |\nPérdida de rinde: [A COMPLETAR: método de pérdida y fuente].\n\nE) EVIDENCIAS Y PENDIENTES\n- Fotos y puntos GPS por estación [A COMPLETAR].\n- Conteo de vainas dañadas por planta [A COMPLETAR].\n- Plazo de denuncia, cobertura y franquicia [VERIFICAR CON LA ASEGURADORA].\n- Reevaluar en 7–10 días [SUPUESTO] para ver rebrote y llenado.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "1.08", "nazwa": "Carta de recomendaciones al productor", "tag": "RECOMENDACIONES", "co_robi": "Convierte lo que viste y lo que acordaste con el productor en una carta de recomendaciones clara: qué hacer, en qué lote, cuándo y qué falta definir. Sin dosis inventadas: lo que sale de la etiqueta queda marcado.", "kiedy": "Al volver de la visita, cuando quedaron decisiones habladas en la tranquera y hay que dejarlas por escrito antes de que se olviden.", "brief": [{"pole": "Hallazgos de la visita", "opis": "Lo principal que viste, por ejemplo “roya común en el maíz tardío, chinche en la soja de segunda por encima de lo habitual”."}, {"pole": "Productor y lotes", "opis": "Productor y lotes, por ejemplo “Agropecuaria Don Ernesto, Pergamino — Lotes 4, 7 y El Bajo”."}, {"pole": "Acordado con el productor", "opis": "Lo que ya hablaron, por ejemplo “aplicar en la soja de segunda esta semana si el clima deja, esperar en el maíz”."}, {"pole": "Recursos del campo", "opis": "Equipo, personal y contratistas, por ejemplo “pulverizadora propia de 24 m, contratista para el avión si hace falta”."}, {"pole": "Pronóstico del clima", "opis": "Lo que viene, por ejemplo “viento fuerte el miércoles, lluvia el viernes”."}, {"pole": "Formato de entrega", "opis": "Cómo la mandas, por ejemplo “PDF por mail y resumen por WhatsApp”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que escribe recomendaciones técnicas claras para productores. Redacta la carta de recomendaciones de esta visita.\n\nDATOS:\nHallazgos de la visita: [HALLAZGOS DE LA VISITA]\nProductor y lotes: [PRODUCTOR Y LOTES]\nAcordado con el productor: [ACORDADO CON EL PRODUCTOR]\nRecursos del campo: [RECURSOS DEL CAMPO]\nPronóstico del clima: [PRONÓSTICO DEL CLIMA]\nFormato de entrega: [FORMATO DE ENTREGA]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Ordena por prioridad y por lote: qué hacer, dónde, cuándo y por qué, en lenguaje simple.\n4. Nunca indiques un producto ni una dosis por tu cuenta. Escribe el objetivo de la aplicación (por ejemplo, fungicida registrado para maíz) y marca producto, dosis, tiempo de carencia y de reingreso [VER ETIQUETA]. Recuerda que la receta agronómica es obligatoria donde lo exija la norma.\n5. Ten en cuenta el pronóstico y los recursos del campo para proponer las ventanas de trabajo, sin prometer condiciones de aplicación que no conozco.\n6. Incluye las Buenas Prácticas Agrícolas que aplican: condiciones para evitar deriva, registro de aplicaciones y triple lavado de envases.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Encabezado: productor, fecha de la visita y lotes.\nB) Resumen de la situación en 3–5 líneas.\nC) Tabla de recomendaciones: prioridad | lote | acción | momento | responsable.\nD) Condiciones y cuidados de la aplicación.\nE) Pendientes y datos a confirmar, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Haz la versión de WhatsApp con solo las acciones de esta semana.", "Agrega una columna con la fecha límite de cada acción.", "Redacta la parte de la receta agronómica que tengo que completar.", "Escribe la carta en un tono más formal para la empresa.", "Prepara una orden de trabajo para el aplicador o el contratista.", "Agrega un plan alternativo si el clima no deja aplicar.", "Separa lo que decide el productor de lo que hago yo.", "Arma la lista de insumos que hay que tener en el campo.", "Agrega cuándo vuelvo a recorrer cada lote.", "Resume la carta en un párrafo para la ficha del lote."], "checklista": ["Cada recomendación tiene lote, momento y responsable.", "Ningún producto o dosis aparece sin [VER ETIQUETA] o sin la etiqueta en la mano.", "La receta agronómica está prevista donde corresponde.", "Las ventanas de trabajo tienen en cuenta el pronóstico.", "Las Buenas Prácticas Agrícolas están mencionadas.", "Lo acordado con el productor coincide con lo que se habló."], "uwaga": "La carta no reemplaza la receta agronómica ni la etiqueta. Producto, dosis, tiempo de carencia y de reingreso salen de la etiqueta vigente; la firma y la responsabilidad de la recomendación son tuyas.", "przyklad": {"wejscie": "Volví de lo de Don Ernesto, Pergamino. En el maíz tardío del Lote 4 hay roya común, todavía en hojas de abajo, la quiero seguir. En la soja de segunda del Lote 7 hay chinches más de lo que vemos normalmente, en el paño me dio por arriba de lo que usamos como referencia. El Bajo está bien. Quedamos con Don Ernesto en aplicar la soja de segunda esta semana si el clima deja y esperar en el maíz. Tiene pulverizadora propia de 24 metros. Pronóstico: viento fuerte el miércoles, lluvia el viernes. Mándale un PDF por mail y un resumen por WhatsApp.", "wynik": "CARTA DE RECOMENDACIONES\nProductor: Agropecuaria Don Ernesto, Pergamino | Visita: [A COMPLETAR: fecha] | Lotes 4, 7 y El Bajo\n\nB) SITUACIÓN\nLa soja de segunda del Lote 7 tiene chinches por encima de la referencia que usamos [A COMPLETAR: conteo y umbral con fuente]. El maíz tardío del Lote 4 tiene roya común en hojas inferiores: por ahora, seguimiento. El Bajo, sin novedades.\n\nC) RECOMENDACIONES\n| Prioridad | Lote | Acción | Momento | Responsable |\n| 1 | Lote 7 | Aplicar insecticida registrado para chinches en soja; producto y dosis [VER ETIQUETA] | lunes o martes, antes del viento del miércoles [VERIFICAR] | aplicador del campo |\n| 2 | Lote 4 | Volver a recorrer y ver avance de la roya en hojas medias | en 5–7 días [SUPUESTO] | asesor |\n| 3 | El Bajo | Recorrida de rutina | próxima visita | asesor |\n\nD) CONDICIONES Y CUIDADOS\n- Receta agronómica antes de aplicar.\n- No aplicar con viento fuerte ni con inversión térmica; condiciones exactas según etiqueta y BPA [VER ETIQUETA].\n- Tiempo de carencia y de reingreso [VER ETIQUETA].\n- Registrar la aplicación y hacer triple lavado de envases.\n\nE) PENDIENTES: conteo de chinches por metro [A COMPLETAR]; producto disponible en el campo [A COMPLETAR].\n\nWHATSAPP: “Don Ernesto, aplicamos la soja del 7 lunes o martes, antes del viento. El maíz del 4 lo vuelvo a ver la semana que viene. Le mando el PDF por mail.”\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "1.09", "nazwa": "Plan semanal de recorridas", "tag": "PLAN SEMANAL", "co_robi": "Arma tu semana de visitas: qué productor primero, qué lote no puede esperar, cuánto tiempo de ruta y qué hacer si llueve. Ordena la agenda por urgencia, no por quién llamó último.", "kiedy": "El domingo a la noche o el lunes temprano, cuando tienes 10 productores, plagas avanzando y un pronóstico que cambia todo.", "brief": [{"pole": "Lista de productores", "opis": "Productores, lotes y qué hay en cada uno, por ejemplo “Ferreyra: 3 lotes de soja en R3; Ortiz: maíz tardío V10; Ramírez: trigo en macollaje”."}, {"pole": "Urgencias y plazos", "opis": "Lo que no puede esperar, por ejemplo “Ferreyra quiere decidir el fungicida antes del jueves”."}, {"pole": "Base y disponibilidad", "opis": "Desde dónde sales y qué días trabajas, por ejemplo “salgo desde Río Cuarto, lunes a viernes, el miércoles a la tarde tengo reunión en la cooperativa”."}, {"pole": "Tiempos de traslado", "opis": "Distancias o tiempos aproximados, por ejemplo “Ferreyra 40 min, Ortiz 1 h 15, Ramírez 25 min”."}, {"pole": "Pronóstico del clima", "opis": "Lo que viene, por ejemplo “lluvia martes y miércoles, viernes despejado”."}, {"pole": "Restricciones de productores", "opis": "Horarios o pedidos, por ejemplo “Ortiz solo puede a la mañana”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que atiende a muchos productores y organiza bien su semana. Arma mi plan semanal de recorridas.\n\nDATOS:\nLista de productores: [LISTA DE PRODUCTORES]\nUrgencias y plazos: [URGENCIAS Y PLAZOS]\nBase y disponibilidad: [BASE Y DISPONIBILIDAD]\nTiempos de traslado: [TIEMPOS DE TRASLADO]\nPronóstico del clima: [PRONÓSTICO DEL CLIMA]\nRestricciones de productores: [RESTRICCIONES DE PRODUCTORES]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Prioriza por urgencia agronómica y plazos de decisión, no por orden de llamada. Explica brevemente por qué cada visita va en ese lugar.\n4. Agrupa visitas por zona para ahorrar kilómetros y respeta los tiempos de traslado que te di; si no los di, márcalos [A COMPLETAR].\n5. Ten en cuenta el pronóstico: no pongas recorridas que necesitan entrar al lote en días de lluvia sin un plan B.\n6. Deja un margen para imprevistos y avisa si la semana no alcanza para todo, con lo que se puede postergar.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Tabla semanal: día | horario | productor | lotes | motivo | tiempo de ruta.\nB) Prioridades de la semana y por qué.\nC) Plan B por lluvia u otros imprevistos.\nD) Lo que queda para la semana próxima.\nE) Datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Hazme los mensajes de WhatsApp para confirmar cada visita.", "Calcula cuántos kilómetros y horas de ruta tengo en la semana.", "Reorganiza la semana si se suma un productor urgente el martes.", "Agrega el tiempo de oficina para escribir informes cada día.", "Marca qué visitas pueden hacerse por videollamada o con fotos del encargado.", "Arma una versión para pegar en el calendario del celular.", "Agrega una columna con lo que tengo que llevar a cada visita.", "Haz una lista de llamadas que tengo que hacer antes del lunes.", "Prioriza solo las tres visitas que no pueden faltar.", "Resume la semana en un mensaje para mi socio o mi jefe."], "checklista": ["Las urgencias con plazo están primero.", "Las visitas están agrupadas por zona.", "Los tiempos de traslado son reales.", "Hay plan B para los días de lluvia.", "Las restricciones de cada productor se respetan.", "Queda tiempo para escribir informes."], "uwaga": "El plan ordena la agenda con los datos que cargaste; el pronóstico cambia y los productores también. Revísalo cada mañana antes de salir.", "przyklad": {"wejscie": "Esta semana tengo a Ferreyra con tres lotes de soja en R3, quiere decidir el fungicida antes del jueves. Ortiz con maíz tardío en V10, solo puede a la mañana. Lucía Ramírez con trigo en macollaje, nada urgente. Y los Benítez, que quieren que pase a ver un lote de girasol que tiene algo raro. Salgo desde Río Cuarto, lunes a viernes, el miércoles a la tarde tengo reunión en la cooperativa. Ferreyra está a 40 minutos, Ortiz a una hora y cuarto, Ramírez a 25, Benítez a 50. Pronostican lluvia martes y miércoles, el viernes despejado. Ármame la semana.", "wynik": "A) SEMANA\n| Día | Horario | Productor | Lotes | Motivo | Ruta |\n| Lunes | 7:30–11:30 | Ferreyra | 3 lotes de soja R3 | decisión de fungicida antes del jueves | 40 min |\n| Lunes | 13:30–16:30 | Benítez | girasol | problema sin identificar | 50 min [VERIFICAR distancia entre ambos] |\n| Martes | — | lluvia | — | oficina: informes de Ferreyra y Benítez | — |\n| Miércoles | mañana | lluvia | — | llamadas y planificación | — |\n| Miércoles | tarde | cooperativa | — | reunión | [A COMPLETAR] |\n| Jueves | 7:00–10:30 | Ortiz | maíz tardío V10 | seguimiento | 1 h 15 |\n| Viernes | 8:00–10:00 | Ramírez | trigo en macollaje | rutina | 25 min |\n\nB) PRIORIDADES\n1. Ferreyra el lunes: tiene plazo de decisión el jueves y martes y miércoles llueve.\n2. Benítez el lunes a la tarde: problema sin diagnóstico; conviene verlo antes de la lluvia.\n3. Ortiz el jueves a la mañana: respeta su horario; si el lote no está transitable, pasa al viernes [SUPUESTO].\n4. Ramírez el viernes: sin urgencia.\n\nC) PLAN B\nSi el jueves no se puede entrar: Ortiz el viernes a la mañana y Ramírez el viernes a la tarde. Si Ferreyra necesita otra mirada, pedir fotos al encargado el miércoles.\n\nD) SEMANA PRÓXIMA: nada pendiente por ahora.\n\nE) FALTA: horario de la reunión en la cooperativa [A COMPLETAR]; ubicación del lote de los Benítez [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "1.10", "nazwa": "Ficha histórica del lote", "tag": "HISTORIA DEL LOTE", "co_robi": "Junta en una sola ficha todo lo del lote: antecesores, análisis de suelo, recorridas, aplicaciones, fertilización y rindes. Te queda la historia del lote ordenada para planificar la próxima campaña.", "kiedy": "Al cierre de la campaña o cuando tomas un productor nuevo y tienes la información repartida en cuadernos, mails y audios.", "brief": [{"pole": "Datos del lote", "opis": "Nombre, ubicación y superficie, por ejemplo “Potrero del Molino, General Villegas, 70 ha, suelo franco arenoso con bajos”."}, {"pole": "Cultivo y antecesor", "opis": "Campaña actual y anteriores, por ejemplo “2025/26 maíz tardío; antes soja de primera, antes trigo y soja de segunda”."}, {"pole": "Análisis de suelo", "opis": "Resultados del laboratorio, por ejemplo “agosto: MO 2,1 %, pH 6,3, P Bray 11 ppm, N-nitratos 0–60 cm 48 kg/ha”."}, {"pole": "Registros de recorridas", "opis": "Lo importante de las visitas, por ejemplo “cogollero en V6, manchón de sorgo de Alepo cerca del molino, bajos encharcados en diciembre”."}, {"pole": "Aplicaciones y fertilización", "opis": "Lo aplicado, por ejemplo “barbecho químico en agosto, fertilización a la siembra y en V6 según registros del productor”."}, {"pole": "Rinde y notas finales", "opis": "Resultado y aprendizajes, por ejemplo “rinde de monitor 92 qq/ha, el bajo rindió menos”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que lleva registros prolijos de cada lote. Arma la ficha histórica de este lote con toda la información que te paso.\n\nDATOS:\nDatos del lote: [DATOS DEL LOTE]\nCultivo y antecesor: [CULTIVO Y ANTECESOR]\nAnálisis de suelo: [ANÁLISIS DE SUELO]\nRegistros de recorridas: [REGISTROS DE RECORRIDAS]\nAplicaciones y fertilización: [APLICACIONES Y FERTILIZACIÓN]\nRinde y notas finales: [RINDE Y NOTAS FINALES]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Ordena todo por campaña y por fecha. No completes campañas o datos que no te di: márcalos [A COMPLETAR].\n4. Copia los valores de análisis, rindes y aplicaciones tal como los cargué; no los redondees ni los interpretes sin decirlo.\n5. Para las aplicaciones registra producto, fecha y lote solo si los di; las dosis van como figuran en el registro del productor o [VER ETIQUETA].\n6. Al final, saca 3–5 aprendizajes del lote y las preguntas abiertas para la próxima campaña, marcadas como interpretación.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Datos generales del lote.\nB) Tabla de rotación por campaña: campaña | cultivo | antecesor | rinde.\nC) Análisis de suelo por fecha.\nD) Registro de recorridas, aplicaciones y fertilización.\nE) Aprendizajes, preguntas abiertas y datos que faltan.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega una tabla de evolución del análisis de suelo entre campañas.", "Calcula el rinde promedio del lote en las campañas cargadas.", "Haz una versión de una página para mostrarle al productor.", "Marca los problemas que se repiten campaña tras campaña.", "Prepara la lista de datos que le tengo que pedir al productor para completar la ficha.", "Separa la información por ambiente: loma, media loma y bajo.", "Arma la plantilla vacía para usar en todos m
