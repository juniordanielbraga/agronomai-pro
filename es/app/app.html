| 315.000 |\n| flete | −77,0 | −23.100 |\n| comisión y gastos 3 % | −31,5 | −9.450 |\n| ingreso neto | 941,5 | 282.450 |\n| costos directos | −372,0 | −111.600 |\n| margen bruto | 569,5 | 170.850 |\n| alquiler 12 qq/ha | −322,8 | −96.840 |\n| margen después de alquiler | 246,7 | 74.010 |\n\nCuentas:\n1. Rinde: 35 qq/ha = 3,5 t/ha; bruto: 3,5 × 300 = 1.050 USD/ha\n2. Flete: 3,5 × 22 = 77 USD/ha; comisión: 1.050 × 3 % = 31,5 USD/ha\n3. Costos directos: 70 + 45 + 95 + 150 + 12 = 372 USD/ha\n4. Precio neto: 941,5 ÷ 3,5 = 269,0 USD/t\n5. Alquiler: 1,2 t × 269,0 = 322,8 USD/ha\n\nComparación: margen antes de alquiler 569,5 contra 480 USD/ha de la campaña pasada = +89,5 USD/ha. Para saber si vino del rinde, del precio o del costo necesito el detalle de la campaña pasada [A COMPLETAR].\n\nConclusiones: 1) el alquiler se lleva el 57 % del margen bruto; 2) cada quintal de rinde vale 26,9 USD/ha netos; 3) el precio del corredor es de referencia, confirma el precio de venta real [VERIFICAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "3.03", "nazwa": "Precio y rinde de indiferencia", "tag": "INDIFERENCIA", "co_robi": "Calcula el rinde y el precio de indiferencia de un lote: cuántos quintales necesitas para cubrir los costos a un precio dado y qué precio necesitas con el rinde esperado. Suma una tabla de sensibilidad para ver el riesgo de un vistazo.", "kiedy": "Antes de decidir la siembra, cuando llega una oferta de venta anticipada o cuando el productor pregunta «¿con cuánto salgo hecho?».", "brief": [{"pole": "Cultivo y lote", "opis": "Cultivo, lote, hectáreas, zona, por ejemplo “trigo en La Loma, 180 ha, Río Cuarto”."}, {"pole": "Costos por hectárea", "opis": "Costo total por hectárea y qué incluye, por ejemplo “520 USD/ha con insumos, labores, seguro y alquiler prorrateado”."}, {"pole": "Rinde esperado", "opis": "Rinde objetivo y de dónde sale, por ejemplo “38 qq/ha, promedio de cinco campañas”."}, {"pole": "Precio ofrecido", "opis": "Precio que te ofrecen, neto o bruto, por ejemplo “210 USD/t puesto en campo, ya descontado flete y comisión”."}, {"pole": "Rango de sensibilidad", "opis": "Qué rindes y precios quieres probar, por ejemplo “rindes de 30, 38 y 46 qq/ha; precios de 190, 210 y 230 USD/t”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que ayuda a productores a decidir siembras y ventas con números claros. Calcula el rinde y el precio de indiferencia de este lote.\n\nDATOS:\nCultivo y lote: [CULTIVO Y LOTE]\nCostos por hectárea: [COSTOS POR HECTÁREA]\nRinde esperado: [RINDE ESPERADO]\nPrecio ofrecido: [PRECIO OFRECIDO]\nRango de sensibilidad: [RANGO DE SENSIBILIDAD]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes precios, rindes, dosis, tasas, montos de programas ni valores «típicos». Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Muestra cada cálculo paso a paso con unidades y redondea solo el resultado final.\n4. Rinde de indiferencia = costo total USD/ha ÷ precio neto USD/t; expresa el resultado en t/ha y en qq/ha.\n5. Precio de indiferencia = costo total USD/ha ÷ rinde esperado t/ha.\n6. Si el precio que te doy es bruto, pídeme los gastos de comercialización o márcalos [A COMPLETAR]; no los estimes.\n7. Arma una tabla de sensibilidad con el rango que te doy: margen en USD/ha para cada combinación de rinde y precio.\n8. Di claramente qué costos están incluidos y cuáles no, para no comparar números que no son equivalentes.\n\nFORMATO DE SALIDA:\nA) Rinde de indiferencia y precio de indiferencia, con la cuenta.\nB) Margen esperado con rinde y precio base.\nC) Tabla de sensibilidad | rinde \\ precio |.\nD) Lectura del riesgo en tres líneas y lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega una columna con rindes de un año seco.", "Recalcula con el costo sin alquiler para ver el margen del dueño del campo.", "Hazlo para los tres lotes que te paso y compáralos.", "Calcula cuánto conviene vender anticipado para cubrir el costo.", "Muestra el resultado en quintales y en dólares.", "Prepara un mensaje corto para el productor con la conclusión.", "Suma el seguro con la prima que te doy y recalcula.", "Repite la cuenta con el precio de la posición a cosecha que te paso.", "Arma un gráfico simple de margen según rinde.", "Arma la tabla para pegarla en una planilla de cálculo."], "checklista": ["El costo por hectárea incluye lo mismo que vas a comparar (con o sin alquiler, con o sin estructura).", "El precio usado es neto de flete y comisión, o están cargados aparte.", "El rinde esperado tiene respaldo en el historial del lote.", "La tabla de sensibilidad cubre un año malo realista.", "Las conversiones qq/ha y t/ha están bien hechas (1 t = 10 qq).", "Los [A COMPLETAR] se cierran antes de decidir una venta."], "uwaga": "El rinde de indiferencia no es una recomendación de siembra ni de venta: es una referencia. Las decisiones de comercialización conviene charlarlas con el corredor o el acopio con los precios del día.", "przyklad": {"wejscie": "Trigo en La Loma, 180 hectáreas en Río Cuarto. El costo total me da 520 dólares por hectárea con todo, insumos, labores, seguro y la parte del alquiler. El rinde esperado ponle 38 quintales, es el promedio de cinco campañas. El acopio me ofrece 210 la tonelada puesto en campo, ya con flete y comisión descontados. Quiero saber con cuántos quintales salgo hecho, a qué precio salgo hecho con 38, y una tablita con 30, 38 y 46 quintales y precios de 190, 210 y 230.", "wynik": "INDIFERENCIA: trigo, La Loma, 180 ha, Río Cuarto\n\nCuentas:\n1. Rinde de indiferencia: 520 ÷ 210 = 2,48 t/ha = 24,8 qq/ha\n2. Precio de indiferencia: 520 ÷ 3,8 = 136,84 USD/t\n3. Margen base: 3,8 × 210 = 798; 798 − 520 = 278 USD/ha; × 180 ha = 50.040 USD\n\nSensibilidad (margen USD/ha):\n| rinde \\ precio | 190 | 210 | 230 |\n| 30 qq/ha | 50 | 110 | 170 |\n| 38 qq/ha | 202 | 278 | 354 |\n| 46 qq/ha | 354 | 446 | 538 |\n\nLectura del riesgo:\n• Con 30 qq/ha y precio bajo todavía cubre el costo, pero el margen casi desaparece.\n• Hay 13,2 qq/ha de colchón entre el rinde esperado y el de indiferencia.\n• El precio puede bajar hasta 136,84 USD/t antes de perder plata con 38 qq/ha.\n\n[SUPUESTO] el precio de 210 USD/t ya es neto de flete y comisión, como dijiste.\n[VERIFICAR] qué parte del alquiler está dentro de los 520 USD/ha.\n[A COMPLETAR] rinde de un año seco en ese lote, para sumar una fila más.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "3.04", "nazwa": "Presupuesto de campaña y flujo de caja", "tag": "FLUJO DE CAJA", "co_robi": "Ordena ingresos y egresos de la campaña mes a mes y muestra cuándo falta plata, cuánto y por cuánto tiempo. Sirve para negociar plazos con la agronomía, pedir crédito a tiempo y no vender granos apurado.", "kiedy": "Antes de empezar la campaña, cuando se juntan las compras de insumos con la siembra, o cuando el productor necesita mostrarle al banco cómo va a pagar.", "brief": [{"pole": "Empresa", "opis": "Productor, actividades y superficie, por ejemplo “Martín Ortiz, 450 ha de soja y maíz en Itapúa”."}, {"pole": "Saldo inicial", "opis": "Plata disponible al arrancar, por ejemplo “40.000 USD en cuenta al 1 de septiembre”."}, {"pole": "Egresos previstos", "opis": "Pagos por mes, por ejemplo “septiembre 25.000, octubre 30.000, noviembre 15.000, diciembre 12.000 USD”."}, {"pole": "Ingresos previstos", "opis": "Cobros por mes, por ejemplo “octubre 10.000 USD por venta de trigo, diciembre 45.000 USD por soja guardada en silo bolsa”."}, {"pole": "Compromisos fijos", "opis": "Cuotas, sueldos, alquileres, por ejemplo “sueldos 3.000 USD por mes, cuota del préstamo 8.000 USD en noviembre”."}, {"pole": "Período y objetivo", "opis": "Meses a cubrir y para qué, por ejemplo “septiembre a diciembre, saber si necesito crédito y cuánto”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia en administración rural que arma flujos de caja de campaña con productores. Arma el flujo de caja mensual de esta empresa.\n\nDATOS:\nEmpresa: [EMPRESA]\nSaldo inicial: [SALDO INICIAL]\nEgresos previstos: [EGRESOS PREVISTOS]\nIngresos previstos: [INGRESOS PREVISTOS]\nCompromisos fijos: [COMPROMISOS FIJOS]\nPeríodo y objetivo: [PERÍODO Y OBJETIVO]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes precios, rindes, dosis, tasas, montos de programas ni valores «típicos». Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Muestra el saldo de cada mes: saldo inicial + ingresos − egresos − compromisos fijos = saldo final, que pasa a ser el inicial del mes siguiente.\n4. Señala el mes de mayor déficit y su monto; es el dato clave para negociar.\n5. No supongas condiciones de crédito, tasas ni plazos: si hace falta financiamiento, marca [A COMPLETAR] y pregúntame qué opciones tengo (banca pública, cooperativa, agronomía, canje).\n6. Si un ingreso depende de vender granos, márcalo [SUPUESTO] con la cantidad y el precio que yo te di.\n7. Propón tres palancas concretas para cubrir el déficit (correr pagos, adelantar ventas, financiar insumos) sin inventar números.\n\nFORMATO DE SALIDA:\nA) Tabla mensual | mes | saldo inicial | ingresos | egresos | fijos | saldo final |.\nB) Mes crítico y monto máximo de déficit.\nC) Tres palancas para cubrir el déficit, con lo que hay que confirmar en cada una.\nD) Lista de supuestos y [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega los meses hasta la cosecha de maíz.", "Simula que la venta de soja se atrasa un mes.", "Arma la versión para presentar al banco.", "Separa el flujo por actividad: soja, maíz y ganadería.", "Agrega el pago de impuestos en las fechas que te paso.", "Simula un canje de insumos por granos con las condiciones que te doy.", "Calcula cuánto grano hay que vender en cada mes para no quedar en negativo.", "Marca los pagos que conviene negociar con la agronomía.", "Escribe un resumen de cuatro líneas para el productor.", "Arma la tabla para pegarla en una planilla de cálculo."], "checklista": ["Cada ingreso y egreso tiene fecha y monto confirmados por el productor.", "El saldo final de cada mes pasa bien al mes siguiente.", "Las ventas de granos tienen cantidad y precio realistas, marcados como supuestos.", "Las cuotas de crédito y los sueldos están todos cargados.", "El mes de mayor déficit está identificado con su monto.", "Las condiciones de cualquier crédito nuevo se confirman con el banco, no con la IA."], "uwaga": "El flujo de caja es tan bueno como las fechas que se cargan. Los impuestos y las retenciones dependen de cada empresa y cada país: eso lo confirma el contador.", "przyklad": {"wejscie": "Martín Ortiz, 450 hectáreas de soja y maíz en Itapúa. Arranca septiembre con 40 mil dólares en cuenta. Pagos: septiembre 25 mil de semilla y fertilizante, octubre 30 mil de siembra e insumos, noviembre 15 mil, diciembre 12 mil. Entra plata en octubre, 10 mil por el trigo, y en diciembre piensa vender la soja que tiene en silo bolsa, unos 45 mil. Fijo tiene 3 mil por mes de sueldos y en noviembre vence una cuota del préstamo de 8 mil. Quiero ver de septiembre a diciembre si le alcanza o si tiene que salir a pedir crédito, y cuánto.", "wynik": "FLUJO DE CAJA: Martín Ortiz, septiembre a diciembre (USD)\n\n| mes | inicial | ingresos | egresos | fijos | final |\n| sep | 40.000 | 0 | 25.000 | 3.000 | 12.000 |\n| oct | 12.000 | 10.000 | 30.000 | 3.000 | −11.000 |\n| nov | −11.000 | 0 | 15.000 | 11.000 | −37.000 |\n| dic | −37.000 | 45.000 | 12.000 | 3.000 | −7.000 |\n\nCuentas: noviembre = −11.000 + 0 − 15.000 − (3.000 sueldos + 8.000 cuota) = −37.000.\n\nMes crítico: noviembre, con un déficit de 37.000 USD. Aun con la venta de soja, cierra diciembre en −7.000 USD.\n\nPalancas:\n1. Pasar parte de los pagos de octubre a cosecha con la agronomía: [A COMPLETAR: qué plazo y recargo ofrece].\n2. Adelantar una parte de la venta de soja a octubre: [A COMPLETAR: precio y cantidad].\n3. Crédito de campaña por al menos 37.000 USD de octubre a diciembre: [A COMPLETAR: entidad, tasa y plazo].\n\n[SUPUESTO] la soja de silo bolsa se vende en diciembre por 45.000 USD, como dijiste.\n[VERIFICAR] si hay impuestos o retenciones a pagar en estos meses.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "3.05", "nazwa": "Comparación de cotizaciones de insumos por hectárea", "tag": "COTIZACIONES", "co_robi": "Pone lado a lado las cotizaciones de varias agronomías y las lleva a costo por hectárea con la dosis de etiqueta, el registro del producto y las condiciones de pago. Así comparas lo que de verdad cuesta tratar una hectárea, no el precio por litro.", "kiedy": "Cuando te llegan tres presupuestos por WhatsApp para el mismo tratamiento y el productor quiere saber cuál conviene.", "brief": [{"pole": "Objetivo y cultivo", "opis": "Qué se quiere controlar o aplicar, en qué cultivo y superficie, por ejemplo “fungicida para enfermedades de fin de ciclo en soja, 250 ha en Canindeyú”."}, {"pole": "Cotizaciones", "opis": "Producto, envase, precio y proveedor, por ejemplo “A: 28 USD/L contado; B: 19 USD/L a cosecha; C: 45 USD/L en canje”."}, {"pole": "Dosis de etiqueta", "opis": "Dosis registrada para ese uso, tomada del marbete, por ejemplo “la saco de cada etiqueta, todavía no las tengo”."}, {"pole": "Registro del producto", "opis": "Si está registrado para ese cultivo y ese uso, por ejemplo “A y B registrados para soja; C no lo sé”."}, {"pole": "Condiciones de compra", "opis": "Plazo, recargo, canje, flete, por ejemplo “B tiene 6 % de recargo por pago a cosecha; C en canje por soja”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que compara cotizaciones de fitosanitarios y fertilizantes para productores. Compara estas cotizaciones en costo por hectárea.\n\nDATOS:\nObjetivo y cultivo: [OBJETIVO Y CULTIVO]\nCotizaciones: [COTIZACIONES]\nDosis de etiqueta: [DOSIS DE ETIQUETA]\nRegistro del producto: [REGISTRO DEL PRODUCTO]\nCondiciones de compra: [CONDICIONES DE COMPRA]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes precios, rindes, dosis, tasas, montos de programas ni valores «típicos». Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. La dosis sale solo de la etiqueta registrada que yo te dé; si no la tengo, escribe [VER ETIQUETA] y muestra la fórmula costo/ha = precio por L o kg × dosis.\n4. No recomiendes un producto que no esté registrado para ese cultivo y ese uso en el país; si no está confirmado, márcalo [VERIFICAR CON EL ORGANISMO DE TU PAÍS].\n5. Lleva todas las condiciones de pago a un precio comparable (contado equivalente) usando solo los recargos o descuentos que yo te dé.\n6. Recuerda que toda aplicación necesita receta agronómica donde sea obligatoria y que la etiqueta manda.\n7. Muestra cada cálculo paso a paso con unidades.\n\nFORMATO DE SALIDA:\nA) Tabla | cotización | precio | condición | precio contado equivalente | dosis | costo USD/ha | registro |.\nB) Costo total para la superficie, con la cuenta.\nC) Lectura: qué conviene y qué falta confirmar antes de comprar.\nD) Lista de [VER ETIQUETA], [VERIFICAR] y [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega el costo de aplicación con la tarifa del contratista que te paso.", "Compara también por kilo de principio activo con la concentración de cada etiqueta.", "Recalcula con la dosis mínima y máxima del marbete.", "Arma el mensaje para pedirle a cada agronomía la etiqueta y el registro.", "Suma el flete hasta el campo y recalcula.", "Compara el canje en quintales de soja con el precio de contado.", "Prepara el resumen para el productor en cinco líneas.", "Agrega una columna con la banda toxicológica que te paso.", "Haz la misma comparación para el herbicida del barbecho.", "Arma la tabla para pegarla en una planilla de cálculo."], "checklista": ["Todas las dosis salen de la etiqueta registrada, no de la memoria de nadie.", "Cada producto está registrado para ese cultivo y ese uso en el país.", "Los precios están en la misma unidad y la misma moneda.", "Los recargos, descuentos y canjes están llevados a contado equivalente.", "La aplicación tiene receta agronómica cuando es obligatoria.", "Los productos comparados controlan lo mismo (mismo objetivo y mismo espectro)."], "uwaga": "Comparar precio sin comparar registro, concentración y espectro es comparar peras con manzanas. La IA no conoce las etiquetas vigentes: la dosis, el tiempo de carencia y el de reingreso salen siempre del marbete.", "przyklad": {"wejscie": "Tengo tres cotizaciones para el fungicida de fin de ciclo en soja, 250 hectáreas en Canindeyú. La A es a 28 dólares el litro de contado. La B, 19 el litro pero a cosecha con 6 por ciento de recargo. La C, 45 el litro en canje por soja, no sé cuántos quintales. Las dosis no las tengo, las tengo que sacar de cada etiqueta. A y B me dijeron que están registrados para soja, la C no sé. Quiero algo para mostrarle al productor y saber qué me falta pedir.", "wynik": "COMPARACIÓN DE COTIZACIONES: fungicida para fin de ciclo en soja, 250 ha, Canindeyú\n\n| cot. | precio | condición | contado equivalente | dosis | USD/ha | registro |\n| A | 28 USD/L | contado | 28,00 USD/L | [VER ETIQUETA] | 28,00 × dosis | sí [VERIFICAR] |\n| B | 19 USD/L | a cosecha +6 % | 20,14 USD/L | [VER ETIQUETA] | 20,14 × dosis | sí [VERIFICAR] |\n| C | 45 USD/L | canje | [A COMPLETAR: qq de soja por litro] | [VER ETIQUETA] | — | [VERIFICAR CON EL ORGANISMO DE TU PAÍS] |\n\nCuentas:\n1. B con recargo: 19 × 1,06 = 20,14 USD/L\n2. Costo por hectárea = precio por L × dosis de etiqueta en L/ha\n3. Costo total = costo USD/ha × 250 ha\n\nLectura:\n• El precio por litro no alcanza para comparar: si la dosis de B es mayor que la de A, puede terminar más caro por hectárea.\n• C no se puede evaluar sin registro confirmado ni relación de canje.\n• Antes de comprar, confirma que los tres controlan las mismas enfermedades.\n\nFalta pedir: etiqueta de cada producto (dosis, carencia, reingreso) [VER ETIQUETA], constancia de registro de C [VERIFICAR], relación de canje de C [A COMPLETAR]. La aplicación va con receta agronómica.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "3.06", "nazwa": "Alquiler fijo en quintales o aparcería", "tag": "ALQUILER", "co_robi": "Compara un alquiler fijo en quintales contra un contrato a porcentaje (aparcería o mediería) con la producción y los costos del productor. Muestra el margen de cada opción, el rinde donde se igualan y quién se queda con el riesgo.", "kiedy": "Cuando se renueva un contrato, cuando aparece un campo nuevo para tomar o cuando el dueño propone cambiar de quintales fijos a porcentaje.", "brief": [{"pole": "Campo y contrato", "opis": "Ubicación, hectáreas, plazo, quién pone qué, por ejemplo “200 ha agrícolas en General Villegas, contrato por una campaña de soja”."}, {"pole": "Oferta de alquiler", "opis": "Las opciones sobre la mesa, por ejemplo “fijo 14 qq/ha de soja pagado por adelantado, o 30 % de la producción para el dueño”."}, {"pole": "Producción prevista", "opis": "Cultivo, rinde esperado y precio neto, por ejemplo “soja de primera, 32 qq/ha, precio neto 270 USD/t”."}, {"pole": "Costos de producción", "opis": "Costo por hectárea sin alquiler y quién lo paga, por ejemplo “380 USD/ha sin alquiler, todo a cargo del productor”."}, {"pole": "Otros gastos y condiciones", "opis": "Adelantos, impuestos, mejoras, por ejemplo “el fijo se paga la mitad en mayo y la mitad a cosecha”."}, {"pole": "Objetivo de la decisión", "opis": "Qué quieres decidir, por ejemplo “saber qué opción conviene y hasta qué rinde aguanta el fijo”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia en gestión que ayuda a productores a negociar arrendamientos y contratos accidentales. Compara estas opciones de alquiler.\n\nDATOS:\nCampo y contrato: [CAMPO Y CONTRATO]\nOferta de alquiler: [OFERTA DE ALQUILER]\nProducción prevista: [PRODUCCIÓN PREVISTA]\nCostos de producción: [COSTOS DE PRODUCCIÓN]\nOtros gastos y condiciones: [OTROS GASTOS Y CONDICIONES]\nObjetivo de la decisión: [OBJETIVO DE LA DECISIÓN]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes precios, rindes, dosis, tasas, montos de programas ni valores «típicos». Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Muestra cada cálculo paso a paso con unidades (qq/ha, t/ha, USD/t, USD/ha) y redondea solo el final.\n4. Valúa el alquiler fijo en quintales al precio neto que te doy y muestra la cuenta.\n5. En el contrato a porcentaje, aplica el reparto exactamente como te lo doy; si no sé quién paga cada costo, márcalo [A COMPLETAR].\n6. Calcula el rinde en que las dos opciones dan el mismo margen y explica qué pasa por encima y por debajo.\n7. Arma una tabla con tres rindes (malo, esperado, bueno) que salgan de mis datos o márcalos [SUPUESTO].\n8. No opines sobre cláusulas legales, impuestos ni normas de arrendamiento: indica que el contrato lo revise un abogado o escribano [VERIFICAR].\n\nFORMATO DE SALIDA:\nA) Margen por hectárea y total de cada opción, con las cuentas.\nB) Rinde de indiferencia entre las opciones.\nC) Tabla | rinde | margen fijo | margen porcentaje |.\nD) Quién se queda con el riesgo en cada opción y qué negociar.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega el costo financiero del pago adelantado con la tasa que te doy.", "Repite la cuenta para maíz con los números que te paso.", "Mira la misma comparación desde el lado del dueño del campo.", "Arma una contrapropuesta en quintales para llevar a la negociación.", "Simula un año seco con el rinde que te doy.", "Compara con hacer el campo a medias con otro productor.", "Escribe un mensaje cordial al dueño con la propuesta.", "Haz la tabla para tres campañas seguidas con rotación soja-maíz.", "Resume los puntos a revisar con el abogado en el contrato.", "Arma la tabla para pegarla en una planilla de cálculo."], "checklista": ["El rinde esperado tiene respaldo en el historial del campo o de la zona.", "Los quintales del alquiler están valuados al mismo precio neto que la producción.", "Está claro quién paga cada costo en el contrato a porcentaje.", "Se considera el costo financiero del pago adelantado.", "La tabla incluye un año malo realista.", "El contrato final lo revisa un abogado o escribano."], "uwaga": "La cuenta no reemplaza al contrato: forma, plazos mínimos, registro e impuestos de los arrendamientos dependen de la ley de cada país. Eso se confirma con el abogado o el escribano.", "przyklad": {"wejscie": "Me ofrecen un campo en General Villegas, 200 hectáreas agrícolas, por una campaña de soja. El dueño da dos opciones: fijo 14 quintales de soja por hectárea, la mitad en mayo y la mitad a cosecha, o 30 por ciento de la producción para él. Todos los costos los pone el productor, unos 380 dólares la hectárea sin el alquiler. Esperamos 32 quintales de soja de primera y el precio neto ponle 270 la tonelada. Quiero saber cuál conviene, hasta qué rinde aguanta el fijo y qué pasa si el año viene malo, digamos 25 quintales, o bueno, 40.", "wynik": "ALQUILER: 200 ha, General Villegas, soja de primera\n\nCuentas con 32 qq/ha (3,2 t/ha):\n1. Ingreso: 3,2 × 270 = 864 USD/ha\n2. Fijo: 1,4 t × 270 = 378 USD/ha; margen = 864 − 380 − 378 = 106 USD/ha → 21.200 USD\n3. Porcentaje: 70 % × 864 = 604,8 USD/ha; margen = 604,8 − 380 = 224,8 USD/ha → 44.960 USD\n\nRinde de indiferencia: 30 % × Y × 270 = 378 → Y = 378 ÷ 81 = 4,67 t/ha = 46,7 qq/ha. Por debajo de 46,7 qq/ha conviene el porcentaje; por encima, el fijo.\n\n| rinde | margen fijo | margen porcentaje |\n| 25 qq/ha | −83,0 | 92,5 |\n| 32 qq/ha | 106,0 | 224,8 |\n| 40 qq/ha | 322,0 | 376,0 |\n\nRiesgo: con el fijo, el productor carga todo el riesgo de rinde y precio, y además adelanta plata en mayo. Con el porcentaje, el dueño comparte el riesgo.\n\nA negociar: si el dueño insiste con el fijo, bajar los quintales o pasar todo el pago a cosecha.\n\n[SUPUESTO] 25 y 40 qq/ha como año malo y bueno, según lo que dijiste.\n[A COMPLETAR] costo financiero de pagar 7 qq/ha en mayo.\n[VERIFICAR] forma del contrato con el abogado.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "3.07", "nazwa": "Contratar al contratista o comprar la máquina", "tag": "CONTRATISTA O PROPIA", "co_robi": "Compara el costo por hectárea de tener la máquina propia (amortización, interés, seguro, operación) contra pagarle al contratista. Calcula las hectáreas por año a partir de las cuales comprar empieza a convenir.", "kiedy": "Cuando el productor se entusiasma con una pulverizadora o una sembradora nueva, o cuando el contratista no llega a tiempo y aparece la idea de comprar.", "brief": [{"pole": "Máquina y labor", "opis": "Qué máquina y para qué labor, por ejemplo “pulverizadora autopropulsada para Rancho Los Álamos, Sinaloa, maíz y frijol”."}, {"pole": "Precio y vida útil", "opis": "Precio, años de uso y valor de reventa, por ejemplo “180.000 USD, 10 años, valor residual 30.000 USD”."}, {"pole": "Costos de propiedad", "opis": "Seguro, galpón, interés del capital, por ejemplo “seguro 1.500 USD por año, tasa de oportunidad del capital 6 % anual”."}, {"pole": "Hectáreas por año", "opis": "Superficie trabajada por año, contando pasadas, por ejemplo “4.000 ha de pulverización por año”."}, {"pole": "Costos operativos por hectárea", "opis": "Combustible, operador, reparaciones, por ejemplo “3,5 USD/ha entre gasoil, operador y reparaciones, de mis registros”."}, {"pole": "Tarifa del contratista", "opis": "Lo que cobra el contratista hoy, por ejemplo “9 USD/ha la pasada, cotizado esta semana”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia en costos de maquinaria que ayuda a productores a decidir entre contratar servicios o comprar equipos. Compara contratar contra comprar.\n\nDATOS:\nMáquina y labor: [MÁQUINA Y LABOR]\nPrecio y vida útil: [PRECIO Y VIDA ÚTIL]\nCostos de propiedad: [COSTOS DE PROPIEDAD]\nHectáreas por año: [HECTÁREAS POR AÑO]\nCostos operativos por hectárea: [COSTOS OPERATIVOS POR HECTÁREA]\nTarifa del contratista: [TARIFA DEL CONTRATISTA]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes precios, rindes, dosis, tasas, montos de programas ni valores «típicos». Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Muestra cada cálculo paso a paso con unidades y redondea solo el final.\n4. Costos fijos anuales = amortización (precio − valor residual) ÷ vida útil + interés sobre el capital promedio + seguro y otros fijos que te doy.\n5. Costo propio por hectárea = costos fijos anuales ÷ hectáreas por año + costos operativos por hectárea.\n6. Calcula las hectáreas de indiferencia = costos fijos anuales ÷ (tarifa del contratista − costo operativo por hectárea).\n7. No uses tarifas de referencia ni coeficientes de reparación de memoria: solo mis datos o las tarifas de referencia de tu zona que yo te pase; si faltan, [A COMPLETAR].\n8. Suma lo que no está en la cuenta: oportunidad de las labores, disponibilidad del contratista, carga de gestión.\n\nFORMATO DE SALIDA:\nA) Tabla de costos fijos anuales y costo propio por hectárea.\nB) Comparación con la tarifa del contratista.\nC) Hectáreas de indiferencia y tabla con tres superficies.\nD) Factores que no son plata y preguntas antes de decidir.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega el sueldo completo del operador como costo fijo.", "Recalcula con una máquina usada al precio que te paso.", "Simula que le prestas servicio a vecinos por las hectáreas que te digo.", "Compara con un leasing con las condiciones que te doy.", "Haz la cuenta para la sembradora.", "Calcula cuánto cambia si la tarifa del contratista sube un 10 %.", "Agrega la pérdida por aplicar fuera de momento con el valor que te paso.", "Escribe el resumen para el productor en cinco líneas.", "Arma la tabla de hectáreas contra costo por hectárea para graficar.", "Arma la tabla para pegarla en una planilla de cálculo."], "checklista": ["El precio de la máquina es una cotización real y reciente.", "La vida útil y el valor residual son razonables para ese uso.", "Las hectáreas por año cuentan todas las pasadas reales.", "Los costos operativos salen de registros propios.", "La tarifa del contratista es actual y de la zona.", "Se consideró la oportunidad de labor, no solo el costo."], "uwaga": "La cuenta de costo es una parte de la decisión. Impuestos, amortización impositiva y financiamiento cambian el número final: eso se revisa con el contador y el banco.", "przyklad": {"wejscie": "Rancho Los Álamos, en Sinaloa, maíz y frijol. El dueño quiere comprar una pulverizadora autopropulsada de 180 mil dólares. Calcula 10 años de uso y que la vende en 30 mil. Seguro 1.500 al año y que le ponga 6 por ciento al capital, que es lo que le daría en otro lado. Entre todas las pasadas son unas 4.000 hectáreas por año. Gasoil, operador y reparaciones me dan 3,5 dólares la hectárea de mis registros de otro cliente. La maquila hoy le cobra 9 dólares la hectárea. ¿Le conviene comprarla?", "wynik": "CONTRATISTA O PROPIA: pulverizadora autopropulsada, Rancho Los Álamos, Sinaloa\n\nCostos fijos anuales:\n| concepto | USD/año |\n| amortización (180.000 − 30.000) ÷ 10 | 15.000 |\n| interés: (180.000 + 30.000) ÷ 2 × 6 % | 6.300 |\n| seguro | 1.500 |\n| TOTAL | 22.800 |\n\nCosto propio por hectárea: 22.800 ÷ 4.000 = 5,70 + 3,50 operativo = 9,20 USD/ha\nContratista: 9,00 USD/ha\nDiferencia: la máquina propia cuesta 0,20 USD/ha más → 800 USD/año más.\n\nHectáreas de indiferencia: 22.800 ÷ (9,00 − 3,50) = 4.145 ha/año\n\n| ha/año | costo propio USD/ha | contratista |\n| 3.000 | 11,10 | 9,00 |\n| 4.000 | 9,20 | 9,00 |\n| 5.000 | 8,06 | 9,00 |\n\nLo que no está en la cuenta: aplicar en el momento justo (si el contratista se atrasa, ¿cuánto se pierde?) [A COMPLETAR]; quién la maneja y la mantiene; el sueldo completo del operador si queda todo el año [VERIFICAR].\n\n[SUPUESTO] los 3,5 USD/ha vienen de otro cliente; conviene confirmarlos para este rancho.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "3.08", "nazwa": "Plan de comercialización de granos", "tag": "COMERCIALIZACIÓN", "co_robi": "Ordena la venta de la cosecha: cuánto vender hoy para cubrir la caja, cuánto guardar y hasta qué precio conviene esperar, con el costo de almacenaje, la merma y el costo financiero a la vista.", "kiedy": "Con la cosecha en silo bolsa o en el acopio, cuando el corredor manda precios todos los días y el productor no sabe si vender o aguantar.", "brief": [{"pole": "Grano y cantidad", "opis": "Grano, toneladas y dónde están, por ejemplo “1.200 t de soja en silo bolsa en el campo de Jorge Ferreyra, Bragado”."}, {"pole": "Precios y contratos", "opis": "Precio disponible, posiciones futuras y contratos firmados, por ejemplo “disponible 285 USD/t, posición mayo 300 USD/t, nada vendido todavía”."}, {"pole": "Costos de almacenaje", "opis": "Bolsa, embolsado, extracción, merma, por ejemplo “3 USD/t entre bolsa y extracción, merma ponle 0,5 %”."}, {"pole": "Costo financiero", "opis": "Tasa de su deuda o de oportunidad, por ejemplo “8 % anual en dólares, lo que paga el crédito”."}, {"pole": "Necesidades de caja", "opis": "Pagos a cubrir y cuándo, por ejemplo “120.000 USD en los próximos dos meses”."}, {"pole": "Almacenaje y logística", "opis": "Riesgos y limitaciones, por ejemplo “bolsas en un bajo, camiones escasos en abril”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia en comercialización de granos que ayuda a productores a ordenar sus ventas. Arma un plan de comercialización.\n\nDATOS:\nGrano y cantidad: [GRANO Y CANTIDAD]\nPrecios y contratos: [PRECIOS Y CONTRATOS]\nCostos de almacenaje: [COSTOS DE ALMACENAJE]\nCosto financiero: [COSTO FINANCIERO]\nNecesidades de caja: [NECESIDADES DE CAJA]\nAlmacenaje y logística: [ALMACENAJE Y LOGÍSTICA]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes precios, rindes, dosis, tasas, montos de programas ni valores «típicos». Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Muestra cada cálculo paso a paso con unidades y redondea solo el final.\n4. Compara vender hoy contra esperar: ingreso neto de cada opción, descontando almacenaje, merma y costo financiero de no cobrar hoy.\n5. Calcula el precio futuro de indiferencia: el precio que hace falta para que esperar dé lo mismo que vender hoy.\n6. Primero cubre la caja: calcula las toneladas a vender para los pagos comprometidos.\n7. No pronostiques precios ni recomiendes instrumentos financieros concretos: explica opciones (venta disponible, a fijar, futuros u opciones) y que se definan con el corredor [VERIFICAR].\n8. No uses mermas ni costos de almacenaje de memoria; si faltan, [A COMPLETAR].\n\nFORMATO DE SALIDA:\nA) Tabla vender hoy contra esperar | opción | toneladas | ingreso neto |.\nB) Precio de indiferencia de la posición futura.\nC) Plan por tramos: cuánto, cuándo y con qué condición.\nD) Riesgos de almacenaje y logística, y lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega una tercera opción: vender a fijar con las condiciones que te paso.", "Recalcula con una merma del 1 %.", "Separa las ventas por calidad según el análisis que te doy.", "Arma el plan para el maíz que se cosecha después.", "Calcula cuánto cuesta por mes tener el grano guardado.", "Escribe un mensaje al corredor pidiendo las posiciones del día.", "Simula que el precio de mayo baja 15 USD/t.", "Agrega la entrega de grano por canje que tiene firmado.", "Prepara el resumen para el productor en cinco líneas.", "Arma la tabla para pegarla en una planilla de cálculo."], "checklista": ["Las toneladas en silo bolsa o en acopio están confirmadas.", "Los precios son del día y de un corredor o acopio real.", "La merma y el costo de almacenaje salen de datos del productor.", "El costo financiero refleja la tasa real del productor.", "La venta para caja cubre los pagos a tiempo.", "Las bolsas en riesgo (bajos, roturas) tienen prioridad de venta."], "uwaga": "El plan no es una recomendación financiera. Precios, contratos, impuestos y retenciones se confirman con el corredor y el contador. La IA no sabe adónde va el mercado.", "przyklad": {"wejscie": "Jorge Ferreyra, de Bragado, tiene 1.200 toneladas de soja en silo bolsa en el campo. Nada vendido. El corredor me pasó hoy 285 dólares disponible y 300 la posición mayo. Bolsa y extracción ponle 3 dólares la tonelada, merma 0,5 por ciento. La plata le cuesta 8 por ciento anual en dólares, lo que paga el crédito. Necesita 120 mil dólares en los próximos dos meses. Ojo que tiene bolsas en un bajo y en abril cuesta conseguir camiones. ¿Cuánto vende ya y cuánto guarda hasta mayo? Son cuatro meses.", "wynik": "PLAN DE COMERCIALIZACIÓN: 1.200 t de soja, Jorge Ferreyra, Bragado\n\nCuentas (todo vendido, para comparar):\n1. Hoy: 1.200 × 285 = 342.000 USD\n2. Mayo: 1.200 × 0,995 = 1.194 t × 300 = 358.200 USD\n3. Almacenaje: 1.200 × 3 = 3.600 USD\n4. Costo financiero de no cobrar hoy: 342.000 × 8 % × 4/12 = 9.120 USD\n5. Mayo neto comparable: 358.200 − 3.600 − 9.120 = 345.480 USD\n\n| opción | t | ingreso neto USD |\n| vender hoy | 1.200 | 342.000 |\n| esperar a mayo | 1.194 | 345.480 |\n\nEsperar deja 3.480 USD más (1 %), con todo el riesgo de precio y de bolsa.\nPrecio de indiferencia en mayo: (342.000 + 9.120 + 3.600) ÷ 1.194 = 297,09 USD/t\n\nPlan por tramos:\n1. Hoy: 421 t para la caja (120.000 ÷ 285), empezando por las bolsas del bajo.\n2. El resto (779 t): definir con el corredor si se fija mayo a 300 USD/t o se deja una parte abierta [VERIFICAR].\n3. Reservar camiones antes de abril [A COMPLETAR: transportista].\n\n[SUPUESTO] merma de 0,5 % y almacenaje de 3 USD/t, según tus datos.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "3.09", "nazwa": "Resultado por lote después de cosecha", "tag": "RESULTADO POR LOTE", "co_robi": "Cierra la campaña lote por lote: rinde, precio cobrado, costo, margen y rinde de indiferencia de cada uno. Ordena los lotes de mejor a peor y separa lo que fue clima de lo que fue manejo para planificar la próxima.", "kiedy": "Después de la cosecha, con los tickets de balanza y las facturas a mano, antes de sentarse a planificar la próxima campaña con el productor.", "brief": [{"pole": "Empresa y campaña", "opis": "Productor, campaña y zona, por ejemplo “Lucía Ramírez, campaña de verano, Soriano”."}, {"pole": "Lotes y cultivos", "opis": "Lotes, hectáreas y cultivo, por ejemplo “El Bajo 80 ha soja, Potrero del Molino 60 ha maíz, La Loma 100 ha soja”."}, {"pole": "Rindes y precios cobrados", "opis": "Rinde de balanza y precio neto por lote, por ejemplo “El Bajo 28 qq/ha, Molino 85 qq/ha, La Loma 18 qq/ha; soja 280 y maíz 160 USD/t netos”."}, {"pole": "Costos por lote", "opis": "Costo total por hectárea de cada lote, por ejemplo “El Bajo 420, Molino 690, La Loma 400 USD/ha”."}, {"pole": "Notas de la campaña", "opis": "Lo que pasó en cada lote, por ejemplo “La Loma: sequía en floración y piedra en febrero; Molino: siembra temprana”."}, {"pole": "Objetivo del análisis", "opis": "Para qué es el análisis, por ejemplo “decidir qué lotes repiten cultivo y dónde ajustar costos”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que analiza el resultado de cada campaña con sus productores. Analiza el resultado por lote.\n\nDATOS:\nEmpresa y campaña: [EMPRESA Y CAMPAÑA]\nLotes y cultivos: [LOTES Y CULTIVOS]\nRindes y precios cobrados: [RINDES Y PRECIOS COBRADOS]\nCostos por lote: [COSTOS POR LOTE]\nNotas de la campaña: [NOTAS DE LA CAMPAÑA]\nObjetivo del análisis: [OBJETIVO DEL ANÁLISIS]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes precios, rindes, dosis, tasas, montos de programas ni valores «típicos». Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Muestra cada cálculo paso a paso con unidades y redondea solo el final.\n4. Por lote: ingreso = rinde × precio neto; margen = ingreso − costo; rinde de indiferencia = costo ÷ precio neto, en qq/ha.\n5. Ordena los lotes por margen por hectárea y muestra el resultado total de la empresa.\n6. Separa causas: clima, manejo, costo o precio, apoyándote solo en mis notas; lo que no esté claro, [VERIFICAR].\n7. No compares contra rindes de la zona ni promedios que no te di.\n8. Propón tres preguntas para la próxima campaña, no recetas.\n\nFORMATO DE SALIDA:\nA) Tabla | lote | cultivo | ha | rinde | ingreso | costo | margen USD/ha | margen total | rinde de indiferencia |.\nB) Resultado total y margen promedio por hectárea.\nC) Lectura por lote con causas probables.\nD) Tres preguntas para planificar la próxima campaña y lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega el alquiler de los lotes alquilados con lo que te paso.", "Compara con la campaña anterior que te pego.", "Separa costo de insumos y costo de labores en cada lote.", "Arma un informe de dos páginas para el productor.", "Calcula cuánto perdió La Loma por la piedra con el seguro que cobró.", "Agrega los datos de los mapas de rendimiento por ambiente.", "Ordena los lotes por rinde en lugar de margen.", "Prepara la presentación para la reunión de cierre.", "Propón qué ensayo hacer en el lote peor.", "Arma la tabla para pegarla en una planilla de cálculo."], "checklista": ["Los rindes salen de balanza o de monitor calibrado.", "Los precios son los netos efectivamente cobrados.", "Los costos de cada lote incluyen lo mismo.", "Las indemnizaciones de seguro están aparte.", "Las causas se apoyan en notas y registros, no en impresiones.", "Los [A COMPLETAR] se cierran antes de la reunión con el productor."], "uwaga": "Un mal resultado no siempre es mal manejo. Antes de cambiar el plan de un lote, revisa varios años y los registros de lluvia. La IA no conoce tu zona: compara con tus propios datos o con los de tu grupo técnico.", "przyklad": {"wejscie": "Lucía Ramírez, campaña de verano en Soriano. Tres lotes. El Bajo, 80 hectáreas de soja, dio 28 quintales. Potrero del Molino, 60 hectáreas de maíz, 85 quintales, sembrado temprano. La Loma, 100 hectáreas de soja, 18 quintales, le pegó la seca en floración y piedra en febrero. Precios netos: soja 280 y maíz 160 la tonelada. Costos por hectárea: El Bajo 420, el Molino 690, La Loma 400. Los tickets de balanza y las facturas ya los tengo ordenados. Quiero ver cuánto dejó cada lote, qué fue clima y qué fue manejo, y qué conviene repetir la próxima.", "wynik": "RESULTADO POR LOTE: Lucía Ramírez, Soriano\n\n| lote | cultivo | ha | rinde qq/ha | ingreso USD/ha | costo | margen USD/ha | margen total | indiferencia qq/ha |\n| Potrero del Molino | maíz | 60 | 85 | 1.360 | 690 | 670 | 40.200 | 43,1 |\n| El Bajo | soja | 80 | 28 | 784 | 420 | 364 | 29.120 | 15,0 |\n| La Loma | soja | 100 | 18 | 504 | 400 | 104 | 10.400 | 14,3 |\n\nCuentas: Molino 8,5 × 160 = 1.360; El Bajo 2,8 × 280 = 784; La Loma 1,8 × 280 = 504. Indiferencia: 690 ÷ 160 = 4,31 t; 420 ÷ 280 = 1,50 t; 400 ÷ 280 = 1,43 t.\n\nTotal: 79.720 USD en 240 ha = 332,2 USD/ha promedio.\n\nLectura:\n• Molino: el mejor margen; la siembra temprana aparece en tus notas como diferencia [VERIFICAR con fecha de siembra].\n• El Bajo: margen sólido con costo moderado.\n• La Loma: quedó solo 3,7 qq/ha arriba de la indiferencia; sequía y piedra explican gran parte [VERIFICAR con registro de lluvias]. ¿Hubo cobro de seguro? [A COMPLETAR]\n\nPreguntas para la próxima:\n1. ¿La Loma tiene limitantes de suelo que repiten en años secos?\n2. ¿Se puede pasar más superficie a maíz temprano?\n3. ¿Qué renglón de costo de El Bajo se puede ajustar sin tocar el rinde?\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "3.10", "nazwa": "Análisis de inversión y recupero", "tag": "RECUPERO", "co_robi": "Evalúa una inversión (riego, equipos, galpón, agricultura de precisión) con los números del productor: recupero simple, recupero descontado y valor actual neto, más un escenario pesimista para ver si aguanta.", "kiedy": "Cuando el productor está por firmar una compra grande, cuando un proveedor promete que «se paga sola en dos años» o cuando el banco pide el análisis de la inversión.", "brief": [{"pole": "Inversión", "opis": "Qué se compra y para qué, por ejemplo “kit de dosificación variable para la sembradora, Jorge Ferreyra, Santa Cruz de la Sierra”."}, {"pole": "Costo inicial", "opis": "Precio total instalado, por ejemplo “25.000 USD instalado, cotización del concesionario”."}, {"pole": "Beneficios anuales", "opis": "Ahorro o ingreso extra por año y de dónde sale, por ejemplo “ahorro de semilla y fertilizante de 8 USD/ha en 1.500 ha, estimado por el productor”."}, {"pole": "Costos operativos", "opis": "Gastos anuales que agrega la inversión, por ejemplo “2.000 USD por año entre licencia del programa y mapas”."}, {"pole": "Período y tasa", "opis": "Años a evaluar y tasa de descuento, por ejemplo “6 años, tasa 10 % anual en dólares”."}, {"pole": "Financiamiento", "opis": "Cómo se paga, por ejemplo “el concesionario ofrece dos cuotas, todavía no sé el recargo”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia en evaluación de proyectos que ayuda a productores a decidir inversiones con números. Evalúa esta inversión.\n\nDATOS:\nInversión: [INVERSIÓN]\nCosto inicial: [COSTO INICIAL]\nBeneficios anuales: [BENEFICIOS ANUALES]\nCostos operativos: [COSTOS OPERATIVOS]\nPeríodo y tasa: [PERÍODO Y TASA]\nFinanciamiento: [FINANCIAMIENTO]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes precios, rindes, dosis, tasas, montos de programas ni valores «típicos». Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Muestra cada cálculo paso a paso con unidades y redondea solo el final.\n4. Beneficio neto anual = beneficios anuales − costos operativos anuales.\n5. Calcula recupero simple, flujo descontado año por año, recupero descontado y valor actual neto con la tasa que te doy.\n6. Agrega un escenario pesimista con la mitad del beneficio (o el que yo te diga) y di si la inversión se recupera dentro del período.\n7. No asumas rindes extra, ahorros ni tasas que no te di; marca lo que falte [A COMPLETAR] y lo que venga de un vendedor [VERIFICAR].\n8. No calcules impuestos ni amortizaciones impositivas: eso queda para el contador.\n\nFORMATO DE SALIDA:\nA) Resumen: inversión, beneficio neto anual, recupero simple, recupero descontado, VAN.\nB) Tabla | año | flujo | flujo descontado | acumulado |.\nC) Escenario pesimista con conclusión.\nD) Qué confirmar antes de firmar y lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega el financiamiento en cuotas con la tasa que te paso.", "Recalcula con una tasa de descuento del 15 %.", "Simula que el beneficio llega recién en el segundo año.", "Compara esta inversión con la otra que te paso.", "Calcula cuántas hectáreas hacen falta para que se pague en tres años.", "Agrega un valor de reventa al final del período.", "Arma la versión de una página para el banco.", "Escribe las preguntas para hacerle al vendedor.", "Haz un análisis de sensibilidad del ahorro por hectárea.", "Arma la tabla para pegarla en una planilla de cálculo."], "checklista": ["El costo inicial incluye instalación, flete y capacitación.", "Los beneficios están respaldados por datos propios o ensayos, no solo por el folleto.", "Los costos operativos anuales están todos.", "La tasa de descuento refleja el costo real del capital del productor.", "El escenario pesimista es creíble.", "Impuestos y financiamiento se revisan con el contador y el banco."], "uwaga": "Los beneficios prometidos por un vendedor son una hipótesis hasta que los mide el productor. Conviene empezar con una franja de prueba o con datos de otros usuarios de la zona.", "przyklad": {"wejscie": "Jorge Ferreyra, en Santa Cruz de la Sierra, quiere ponerle dosificación variable a la sembradora. Sale 25 mil dólares instalado, cotización del concesionario. Él calcula que se ahorra unos 8 dólares por hectárea entre semilla y fertilizante, en 1.500 hectáreas. Agrega 2 mil por año entre la licencia del programa y los mapas. Evalúalo a 6 años con 10 por ciento anual. El concesionario le ofrece pagarlo en dos cuotas, pero no sé el recargo. Y quiero ver qué pasa si el ahorro es la mitad.", "wynik": "INVERSIÓN: dosificación variable, Jorge Ferreyra, Santa Cruz de la Sierra\n\n1. Beneficio anual: 8 × 1.500 = 12.000 USD\n2. Beneficio neto: 12.000 − 2.000 = 10.000 USD/año\n3. Recupero simple: 25.000 ÷ 10.000 = 2,5 años\n\n| año | flujo | descontado (10 %) | acumulado |\n| 0 | −25.000 | −25.000,0 | −25.000,0 |\n| 1 | 10.000 | 9.090,9 | −15.909,1 |\n| 2 | 10.000 | 8.264,5 | −7.644,6 |\n| 3 | 10.000 | 7.513,1 | −131,5 |\n| 4 | 10.000 | 6.830,1 | 6.698,6 |\n| 5 | 10.000 | 6.209,2 | 12.907,8 |\n| 6 | 10.000 | 5.644,7 | 18.552,5 |\n\nRecupero descontado: 3 + 131,5 ÷ 6.830,1 = 3,02 años\nVAN a 6 años: 18.552 USD\n\nEscenario pesimista (ahorro de 4 USD/ha): beneficio neto 6.000 − 2.000 = 4.000 USD/año; recupero simple 6,25 años. No se recupera dentro de los 6 años.\n\nConclusión: la inversión depende casi toda del ahorro por hectárea. Antes de firmar, medirlo en una franja o con datos de otros usuarios.\n\n[VERIFICAR] los 8 USD/ha de ahorro: es estimación del productor.\n[A COMPLETAR] recargo de las dos cuotas del concesionario.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}]}, {"dzial_nr": 4, "dzial": "Productores clientes y asesoramiento profesional", "opis": "Saber mucho de campo no alcanza: ese conocimiento hay que ponerle precio, escribirlo en una propuesta, dejarlo en un contrato y mostrárselo al productor mes a mes. Este departamento se ocupa del lado comercial del asesoramiento independiente: desde fijar tus honorarios y dar de alta a un productor nuevo hasta los informes mensuales, las jornadas a campo, las conversaciones difíciles y el crecimiento de tu cartera.", "skills": [{"id": "4.01", "nazwa": "Propuesta de asesoramiento con honorarios", "tag": "PROPUESTA", "co_robi": "Convierte tus notas en una propuesta de asesoramiento clara y profesional, con paquetes, alcance y condiciones. Los honorarios los pones tú: la IA nunca sugiere un valor, ordena lo que ofreces y le muestra al productor qué recibe por cada peso que paga.", "kiedy": "Después de la primera charla con un productor nuevo, cuando te pide «mándame algo por escrito» y no quieres que quede en un mensaje suelto de WhatsApp.", "brief": [{"pole": "Perfil del asesor", "opis": "Quién eres y qué te diferencia, por ejemplo “ingeniero agrónomo independiente, 12 años en la zona, especialista en malezas y fertilización”."}, {"pole": "Productor objetivo", "opis": "Empresa, superficie y situación, por ejemplo “Agropecuaria Don Ernesto, 1.200 ha agrícolas en Venado Tuerto, hoy sin asesor fijo”."}, {"pole": "Alcance del servicio", "opis": "Qué incluye, por ejemplo “recorridas cada 15 días en campaña, recetas, plan de fertilización, informe mensual”."}, {"pole": "Paquetes y honorarios", "opis": "Tus paquetes con tus valores, por ejemplo “Básico 4 USD/ha/año; Completo 7 USD/ha/año con plan de fertilización y cierre de campaña”."}, {"pole": "Condiciones", "opis": "Forma de pago, plazo, exclusiones, por ejemplo “pago trimestral, contrato por una campaña, no incluye análisis de laboratorio”."}, {"pole": "Tono y formato", "opis": "Cómo la quieres, por ejemplo “formal pero cercano, dos páginas, para mandar en PDF”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que vive del asesoramiento independiente y escribe propuestas que los productores entienden y firman. Redacta una propuesta de asesoramiento.\n\nDATOS:\nPerfil del asesor: [PERFIL DEL ASESOR]\nProductor objetivo: [PRODUCTOR OBJETIVO]\nAlcance del servicio: [ALCANCE DEL SERVICIO]\nPaquetes y honorarios: [PAQUETES Y HONORARIOS]\nCondiciones: [CONDICIONES]\nTono y formato: [TONO Y FORMATO]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes honorarios, tarifas, precios, plazos legales, normas, datos del productor ni resultados. Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo los honorarios que te doy. Si falta alguno, escribe [A COMPLETAR] y sigue con la estructura.\n4. Calcula el total anual de cada paquete para la superficie del productor y muestra la cuenta.\n5. Describe el alcance en términos concretos (frecuencia de visitas, entregables, tiempos de respuesta) y aclara qué no incluye.\n6. Deja escrito que las decisiones finales y la contratación de insumos y labores son del productor, y que las aplicaciones van con receta agronómica cuando corresponde.\n7. Nada de promesas de rinde ni de ahorro: si quiero mostrar resultados, usa solo casos que yo te dé.\n8. Escribe en español claro, sin palabras de marketing.\n\nFORMATO DE SALIDA:\nA) Propuesta lista para enviar: presentación, diagnóstico breve, alcance, paquetes, condiciones, próximos pasos.\nB) Tabla de paquetes | paquete | incluye | honorario | total anual |.\nC) Mensaje corto para acompañar el envío por WhatsApp o mail.\nD) Lista de [A COMPLETAR] antes de mandarla.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega un tercer paquete solo por campaña de cosecha fina.", "Acórtala a una página.", "Escríbela más informal para un productor joven.", "Agrega una sección con dos casos que te paso.", "Arma la versión para una cooperativa con varios socios.", "Prepara las respuestas si dice que es caro.", "Agrega un descuento por pago anual con el porcentaje que te doy.", "Escribe el mensaje de seguimiento a la semana.", "Convierte la propuesta en un guion para presentarla en persona.", "Haz una versión con honorarios por visita en lugar de por hectárea."], "checklista": ["Todos los honorarios son tuyos, no sugeridos por la IA.", "Los totales por paquete están bien calculados con las hectáreas reales.", "El alcance dice qué incluye y qué no.", "Queda claro que la decisión final es del productor.", "No hay promesas de rinde ni de ahorro sin respaldo.", "Las condiciones de pago y el plazo están escritos."], "uwaga": "Una propuesta no es un contrato. Si el productor acepta, cierra las condiciones en un acuerdo escrito y, si el monto lo justifica, que lo revise un abogado.", "przyklad": {"wejscie": "Te cuento. Me junté con Ernesto, de Agropecuaria Don Ernesto, 1.200 hectáreas agrícolas en Venado Tuerto, hoy no tiene asesor fijo, le compra todo a la agronomía y lo asesoran ellos. Yo soy independiente, doce años en la zona, lo mío es malezas y fertilización. Le quiero ofrecer dos paquetes: Básico a 4 dólares la hectárea por año, con recorridas cada 15 días en campaña, recetas e informe mensual; y Completo a 7, que suma plan de fertilización por lote y reunión de cierre de campaña. Pago trimestral, contrato por una campaña, los análisis de laboratorio los paga aparte. Que sea formal pero cercana, dos páginas.", "wynik": "PROPUESTA DE ASESORAMIENTO AGRONÓMICO\nPara: Agropecuaria Don Ernesto, 1.200 ha, Venado Tuerto\n\n1. Quién soy\nIngeniero agrónomo independiente, con 12 años de trabajo en la zona. Me especializo en manejo de malezas y fertilización. No vendo insumos: mi único interés es el resultado de tu campo.\n\n2. Qué proponemos\nUn seguimiento técnico ordenado, con recorridas programadas, decisiones por escrito e información para planificar.\n\n3. Paquetes\n| paquete | incluye | honorario | total anual |\n| Básico | recorridas cada 15 días en campaña, recetas, informe mensual | 4 USD/ha/año | 4.800 USD |\n| Completo | todo lo anterior + plan de fertilización por lote + reunión de cierre | 7 USD/ha/año | 8.400 USD |\n\nCuenta: 1.200 × 4 = 4.800 USD; 1.200 × 7 = 8.400 USD.\n\n4. Qué no incluye\nAnálisis de laboratorio, compra de insumos y contratación de labores.\n\n5. Condiciones\nPago trimestral. Plazo: una campaña [A COMPLETAR: fechas de inicio y fin]. Las decisiones finales son del productor; las aplicaciones van con receta agronómica.\n\n6. Próximos pasos\nSi te parece bien, coordinamos una recorrida inicial [A COMPLETAR: fecha].\n\nMensaje de envío:\n«Ernesto, te mando la propuesta que charlamos. Son dos páginas. Cualquier duda la vemos en el campo. Saludos.»\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "4.02", "nazwa": "Contrato de servicios de asesoramiento", "tag": "CONTRATO", "co_robi": "Redacta un borrador de contrato de asesoramiento en lenguaje claro entre tú y el productor: alcance, honorarios, plazo, responsabilidades, datos y la cláusula clave de que la decisión final es del productor. Es un borrador de trabajo para revisar con un abogado.", "kiedy": "Cuando el productor aceptó la propuesta y quieres dejar todo por escrito antes de la primera recorrida, o cuando un cliente viejo nunca firmó nada.", "brief": [{"pole": "Partes", "opis": "Asesor y productor con sus datos, por ejemplo “Ing. Agr. Martín Ortiz, matrícula [A COMPLETAR]; Hnos. Benítez, 800 ha en Itapúa”."}, {"pole": "Alcance del trabajo", "opis": "Qué servicios incluye, por ejemplo “recorridas quincenales, recetas, plan de siembra y fertilización, informe mensual”."}, {"pole": "Honorarios y forma de pago", "opis": "Tus valores y fechas, por ejemplo “5 USD/ha por campaña, pagadero en cuatro cuotas”."}, {"pole": "Plazo y rescisión", "opis": "Duración y cómo se termina, por ejemplo “una campaña, renovable; cualquiera puede rescindir avisando con 30 días”."}, {"pole": "Responsabilidad y riesgos", "opis": "Límites de responsabilidad, por ejemplo “no respondo por clima, aplicaciones mal hechas por terceros ni productos fuera de receta”."}, {"pole": "Datos y confidencialidad", "opis": "Quién es dueño de los datos, por ejemplo “los datos del campo son del productor; yo puedo usarlos sin nombre para ensayos”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia en asesoramiento independiente que ayuda a colegas a ordenar sus acuerdos por escrito. Redacta un borrador de contrato de servicios de asesoramiento.\n\nDATOS:\nPartes: [PARTES]\nAlcance del trabajo: [ALCANCE DEL TRABAJO]\nHonorarios y forma de pago: [HONORARIOS Y FORMA DE PAGO]\nPlazo y rescisión: [PLAZO Y RESCISIÓN]\nResponsabilidad y riesgos: [RESPONSABILIDAD Y RIESGOS]\nDatos y confidencialidad: [DATOS Y CONFIDENCIALIDAD]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes honorarios, tarifas, precios, plazos legales, normas, datos del productor ni resultados. Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo los honorarios, plazos y condiciones que te doy; lo que falte, [A COMPLETAR].\n4. No cites leyes, artículos, resoluciones ni requisitos legales del país; donde haga falta una forma legal, escribe [VERIFICAR CON UN ABOGADO].\n5. Incluye siempre: la decisión final y la ejecución son del productor; el asesor recomienda por escrito; las aplicaciones se hacen con receta agronómica y según la etiqueta.\n6. Separa la responsabilidad del asesor de la de contratistas, proveedores y aplicadores.\n7. Escribe cláusulas cortas, numeradas y en lenguaje simple.\n8. Agrega al final una lista de puntos que el abogado debe revisar.\n\nFORMATO DE SALIDA:\nA) Borrador de contrato con cláusulas numeradas.\nB) Anexo con alcance y calendario de honorarios en tabla.\nC) Puntos a revisar con el abogado.\nD) Lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega una cláusula de exclusividad en la zona.", "Escribe la versión corta de una página para productores chicos.", "Agrega una cláusula sobre uso de datos de monitores y mapas.", "Suma un anexo con los entregables por mes.", "Agrega qué pasa si el productor se atrasa en el pago.", "Adáptalo para un servicio de una sola visita de diagnóstico.", "Escribe el mail para mandarlo a firmar.", "Agrega una cláusula de seguro de responsabilidad profesional.", "Revisa el texto y marca lo que suene ambiguo.", "Haz la versión para una cooperativa con varios socios."], "checklista": ["Las partes están bien identificadas con datos completos.", "El alcance coincide con la propuesta aceptada.", "Los honorarios, fechas y moneda están claros.", "Queda escrito que la decisión final es del productor.", "Se separa la responsabilidad del asesor de la de terceros.", "Un abogado revisó el borrador antes de firmar."], "uwaga": "Esto es un borrador de trabajo, no asesoramiento legal. Requisitos de forma, impuestos, facturación y responsabilidad profesional dependen de cada país y de tu colegio o consejo profesional.", "przyklad": {"wejscie": "Necesito un contrato con Hnos. Benítez, 800 hectáreas en Itapúa, soja y maíz. Yo soy Martín Ortiz, ingeniero agrónomo, la matrícula la completo después. Les hago recorridas cada quince días, recetas, plan de siembra y fertilización, y un informe mensual. Cobro 5 dólares la hectárea por campaña, en cuatro cuotas. Una campaña, renovable, y cualquiera lo corta avisando con 30 días. Quiero dejar claro que no respondo por el clima, ni por aplicaciones mal hechas por el contratista, ni por productos que usen sin mi receta. Los datos del campo son de ellos, pero yo los puedo usar sin el nombre para ensayos.", "wynik": "BORRADOR DE CONTRATO DE ASESORAMIENTO AGRONÓMICO\n\n1. Partes. Ing. Agr. Martín Ortiz, matrícula [A COMPLETAR] («el asesor»), y Hnos. Benítez [A COMPLETAR: datos fiscales] («el productor»), por 800 ha en Itapúa.\n2. Objeto. Asesoramiento técnico en soja y maíz según el Anexo A.\n3. Honorarios. 5 USD/ha por campaña: 800 × 5 = 4.000 USD, en cuatro cuotas de 1.000 USD [A COMPLETAR: fechas].\n4. Plazo. Una campaña, renovable. Cualquiera de las partes puede rescindir con 30 días de aviso por escrito.\n5. Decisiones. El asesor recomienda por escrito; la decisión final y la ejecución son del productor.\n6. Aplicaciones. Toda aplicación se hace con receta agronómica y según la etiqueta del producto.\n7. Responsabilidad. El asesor no responde por clima, por labores mal ejecutadas por terceros ni por productos usados sin su receta [VERIFICAR CON UN ABOGADO].\n8. Datos. Los datos del campo son del productor. El asesor puede usarlos sin identificar al productor para ensayos y análisis.\n\nAnexo A\n| servicio | frecuencia |\n| recorridas | cada 15 días en campaña |\n| recetas | según necesidad |\n| plan de siembra y fertilización | una vez por campaña |\n| informe | mensual |\n\nPara el abogado: validez de la cláusula 7, facturación e impuestos, forma de firma.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "4.03", "nazwa": "Mensajes de temporada para tus productores", "tag": "MENSAJES", "co_robi": "Escribe mensajes cortos para toda tu cartera según el momento de la campaña (presiembra, en cultivo, cosecha, planificación) con tu propio estilo. Útiles y concretos, para que el productor los lea en lugar de archivarlos.", "kiedy": "Al empezar cada etapa de la campaña, cuando quieres recordarle a todos tus productores algo importante y no tienes tiempo de escribirle a cada uno.", "brief": [{"pole": "Momento de la campaña", "opis": "Etapa y fecha, por ejemplo “presiembra de maíz de temporal, mediados de mayo, en Jalisco”."}, {"pole": "Destinatarios", "opis": "A quién va, por ejemplo “40 productores de maíz y sorgo, de 20 a 300 ha”."}, {"pole": "Canal", "opis": "Por dónde sale, por ejemplo “lista de difusión de WhatsApp, y una versión para mail”."}, {"pole": "Mensaje principal", "opis": "Lo que tienen que hacer o saber, por ejemplo “sacar muestras de suelo antes de comprar fertilizante”."}, {"pole": "Llamado a la acción", "opis": "Qué quieres que respondan, por ejemplo “que me escriban para agendar el muestreo esta semana”."}, {"pole": "Mi estilo", "opis": "Cómo hablas, por ejemplo “directo, con confianza, sin palabras raras, firmo como Ing. Ramírez”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que se comunica todas las semanas con sus productores y sabe escribir mensajes que se leen. Escribe mensajes de temporada para mi cartera.\n\nDATOS:\nMomento de la campaña: [MOMENTO DE LA CAMPAÑA]\nDestinatarios: [DESTINATARIOS]\nCanal: [CANAL]\nMensaje principal: [MENSAJE PRINCIPAL]\nLlamado a la acción: [LLAMADO A LA ACCIÓN]\nMi estilo: [MI ESTILO]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, fechas, umbrales, precios ni datos técnicos. Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo la información técnica que te doy; no agregues dosis, fechas de siembra, umbrales ni precios que no te di.\n4. Un mensaje, una idea: lo que hay que hacer, por qué y cómo responder.\n5. WhatsApp: máximo 60 palabras, sin listas largas. Mail: asunto claro y hasta 150 palabras.\n6. Escribe con mi estilo y mi firma; nada de lenguaje de publicidad ni exceso de signos.\n7. Si mencionas un fitosanitario, recuerda que va con receta y que la etiqueta manda.\n8. Propón también un recordatorio corto para quienes no respondan.\n\nFORMATO DE SALIDA:\nA) Mensaje de WhatsApp.\nB) Versión para mail con asunto.\nC) Guion de audio de 30 segundos.\nD) Recordatorio para los que no respondieron y lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Escribe el mensaje para la etapa de cosecha.", "Haz una versión para productores grandes y otra para chicos.", "Agrega una foto sugerida para acompañar el mensaje.", "Escribe un mensaje de alerta por una plaga que estoy viendo.", "Arma el calendario de mensajes de toda la campaña.", "Haz el mensaje más corto todavía.", "Escribe un mensaje de agradecimiento al cierre de la campaña.", "Prepara la respuesta cuando alguien pregunta el precio.", "Traduce el mensaje a un tono más formal para una empresa.", "Escribe la invitación a una charla técnica en mi oficina."], "checklista": ["El mensaje tiene una sola idea y un pedido claro.", "No hay datos técnicos que no hayas confirmado.", "Suena a ti, no a una publicidad.", "Respeta el largo de cada canal.", "Los destinatarios aceptaron recibir mensajes tuyos.", "Hay un plan para los que no responden."], "uwaga": "Los mensajes masivos funcionan si aportan algo. Si cada mensaje vende, los productores dejan de leer. Respeta a quien pida no recibir más.", "przyklad": {"wejscie": "Quiero mandar un mensaje a mis productores de Jalisco, son unos 40 de maíz y sorgo, de 20 a 300 hectáreas. Estamos a mediados de mayo, presiembra de maíz de temporal. Lo que quiero que hagan es sacar muestras de suelo antes de comprar el fertilizante, porque muchos compran lo mismo de siempre sin saber qué tiene el suelo. Que me escriban para agendar el muestreo esta semana. Va por la lista de difusión de WhatsApp y también quiero una versión para mail. Escribo directo, con confianza, firmo como Ing. Ramírez.", "wynik": "A) WHATSAPP\n«Buen día. Antes de comprar el fertilizante para el maíz de temporal, conviene saber qué tiene tu suelo. Con un análisis compras lo que hace falta y no lo de siempre. Esta semana estoy sacando muestras: escríbeme y agendamos tu parcela. Ing. Ramírez»\n\nB) MAIL\nAsunto: Antes de comprar fertilizante, muestreo de suelo\n«Hola. Estamos a semanas de sembrar el maíz de temporal y es el momento de decidir el fertilizante. Un análisis de suelo te dice qué falta en cada parcela y te evita gastar en lo que no hace falta. Esta semana estoy haciendo muestreos en la zona. Respóndeme este mail o escríbeme por WhatsApp para agendar. Los resultados del laboratorio tardan [A COMPLETAR: días], así que conviene no dejarlo para el final. Saludos, Ing. Ramírez»\n\nC) AUDIO (30 s)\n«Qué tal, habla el ingeniero Ramírez. Antes de comprar el fertilizante para el maíz, saquemos muestras de suelo. Así compras lo que tu parcela necesita. Esta semana ando muestreando: mándame un mensaje y lo agendamos.»\n\nD) RECORDATORIO (a los 4 días)\n«¿Agendamos el muestreo? Me quedan lugares hasta el [A COMPLETAR: fecha]. Ing. Ramírez»\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "4.04", "nazwa": "Alta de un productor nuevo", "tag": "ALTA DE CLIENTE", "co_robi": "Arma el paquete completo para empezar con un productor nuevo: qué información pedirle (mapas de lotes, análisis de suelo, registros de rindes y aplicaciones), la agenda de la primera visita y un plan de 30 días. Que no se escape nada desde el primer día.", "kiedy": "Apenas firma un productor nuevo, antes de la primera recorrida, para que la relación arranque ordenada y el productor vea que trabajas en serio.", "brief": [{"pole": "Empresa", "opis": "Productor, ubicación, contacto, por ejemplo “Martín Ortiz, Alto Paraná, el encargado es su hijo Diego”."}, {"pole": "Cultivos y hectáreas", "opis": "Qué siembra y cuánto, por ejemplo “600 ha: soja de verano y maíz zafriña, 8 lotes”."}, {"pole": "Lo que ya tiene", "opis": "Información disponible, por ejemplo “mapas de lotes en papel, análisis de suelo de hace 4 años, rindes de balanza”."}, {"pole": "Expectativas del productor", "opis": "Qué espera de ti, por ejemplo “bajar costos de fitosanitarios y tener todo registrado para la cooperativa”."}, {"pole": "Alcance del servicio", "opis": "Lo que contrató, por ejemplo “paquete completo: recorridas quincenales, recetas, plan de fertilización”."}, {"pole": "Fecha de la primera visita", "opis": "Cuándo, por ejemplo “jueves 12 de septiembre, a las 8”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que incorpora productores nuevos con un proceso ordenado. Prepara el alta de este productor.\n\nDATOS:\nEmpresa: [EMPRESA]\nCultivos y hectáreas: [CULTIVOS Y HECTÁREAS]\nLo que ya tiene: [LO QUE YA TIENE]\nExpectativas del productor: [EXPECTATIVAS DEL PRODUCTOR]\nAlcance del servicio: [ALCANCE DEL SERVICIO]\nFecha de la primera visita: [FECHA DE LA PRIMERA VISITA]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes honorarios, tarifas, precios, plazos legales, normas, datos del productor ni resultados. Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. No supongas datos del campo: lo que no esté, va a la lista de información a pedir con [A COMPLETAR].\n4. Ordena lo que hay que pedir por prioridad: imprescindible antes de la visita, en el primer mes y deseable.\n5. Incluye siempre: límites y superficie de cada lote, historial de cultivos y rindes, análisis de suelo, registro de aplicaciones, contratos de alquiler si los hay, contactos de contratistas y proveedores, y requisitos oficiales que deba cumplir según el organismo de su país [VERIFICAR].\n6. Arma la agenda de la primera visita con tiempos y un plan de 30 días con entregables y fechas.\n7. Escribe el mensaje al productor pidiendo la información, corto y amable.\n\nFORMATO DE SALIDA:\nA) Lista de información a pedir, por prioridad.\nB) Agenda de la primera visita con horarios.\nC) Plan de 30 días | semana | tarea | entregable |.\nD) Mensaje al productor y lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Arma una planilla para cargar los datos de cada lote.", "Escribe las preguntas para la charla con el encargado.", "Agrega un plan de muestreo de suelo para los lotes sin análisis reciente.", "Prepara la carpeta de bienvenida en PDF.", "Arma un mapa de prioridades de recorrida.", "Escribe el mensaje de agradecimiento después de la primera visita.", "Hazlo para un productor ganadero.", "Agrega un registro de aplicaciones para empezar a usar desde hoy.", "Prepara la primera reunión con los contratistas.", "Resume las expectativas del productor en compromisos medibles."], "checklista": ["Tienes la superficie y los límites de cada lote.", "Sabes qué análisis de suelo existen y de qué fecha.", "Tienes el historial de cultivos y rindes al menos de tres campañas.", "Conoces los contratistas y proveedores habituales.", "Las expectativas del productor quedaron escritas.", "El plan de 30 días tiene fechas y entregables."], "uwaga": "Empezar ordenado ahorra problemas después. Si el productor no tiene registros, el primer entregable es armarlos; no los completes con supuestos.", "przyklad": {"wejscie": "Empiezo con Martín Ortiz, en Alto Paraná, 600 hectáreas, soja de verano y maíz zafriña, son 8 lotes. El que maneja el día a día es su hijo Diego. Tiene mapas de los lotes en papel, análisis de suelo de hace cuatro años y los rindes de balanza. Quiere bajar el gasto en fitosanitarios y tener todo registrado porque se lo pide la cooperativa. Contrató el paquete completo: recorridas cada quince días, recetas y plan de fertilización. La primera visita es el jueves 12 de septiembre a las 8. Ármame todo para arrancar bien.", "wynik": "ALTA: Martín Ortiz, 600 ha, Alto Paraná\n\nA) INFORMACIÓN A PEDIR\nAntes de la visita:\n• Mapas de los 8 lotes, aunque sea en papel, con hectáreas [A COMPLETAR]\n• Cultivos y rindes de las últimas tres campañas por lote\n• Registro de aplicaciones de la última campaña, si existe\nPrimer mes:\n• Contratos de alquiler, si hay lotes alquilados [A COMPLETAR]\n• Contactos de contratistas y proveedores\n• Requisitos de registro que pide la cooperativa y el organismo oficial [VERIFICAR]\nDeseable:\n• Mapas de rendimiento o fotos satelitales\n\nB) AGENDA DEL JUEVES 12/9\n| hora | actividad |\n| 8:00 | charla con Martín y Diego: expectativas y forma de trabajo |\n| 9:00 | recorrida de los 8 lotes |\n| 12:00 | revisión de registros y facturas de fitosanitarios |\n| 13:00 | acuerdos y próximos pasos |\n\nC) PLAN DE 30 DÍAS\n| semana | tarea | entregable |\n| 1 | primera visita | acta con acuerdos |\n| 2 | muestreo de suelo de los lotes con análisis viejo | muestras al laboratorio |\n| 3 | armado del registro de aplicaciones | planilla compartida |\n| 4 | plan de fertilización y revisión del gasto en fitosanitarios | informe |\n\nD) MENSAJE\n«Diego, para la visita del jueves me sirve que tengas a mano los mapas de los lotes, los rindes de las últimas campañas y lo que haya de aplicaciones. Con eso arrancamos. Gracias.»\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "4.05", "nazwa": "Informe mensual al productor", "tag": "INFORME MENSUAL", "co_robi": "Convierte tus notas de recorrida y tus datos en un informe mensual claro para el productor: qué hiciste, qué viste, qué se decidió y qué sigue. Muestra el valor de tu trabajo en un formato que el productor, el socio o el banco entienden.", "kiedy": "A fin de mes, con las notas de voz de la camioneta y las fotos del celular, cuando tienes que mandar el informe y no quieres pasar la noche escribiendo.", "brief": [{"pole": "Cliente y período", "opis": "Productor y mes, por ejemplo “Agropecuaria Don Ernesto, noviembre”."}, {"pole": "Visitas y acciones", "opis": "Qué hiciste, por ejemplo “4 recorridas, 2 recetas de herbicida, ajuste de densidad en el Lote 7”."}, {"pole": "Observaciones a campo", "opis": "Qué viste, por ejemplo “soja en V3 con buen stand; maíz en V6 con algo de cogollero bajo el umbral que acordamos”."}, {"pole": "Resultados y números", "opis": "Datos del mes, por ejemplo “lluvia 85 mm en el mes; control de malezas del barbecho bueno en 3 de 4 lotes”."}, {"pole": "Plan del mes siguiente", "opis": "Qué viene, por ejemplo “monitoreo de chinches en soja, decisión de fertilización en maíz”."}, {"pole": "Pendientes", "opis": "Lo que quedó abierto, por ejemplo “análisis de suelo del Lote 9 sin llegar; falta la factura del contratista”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que manda informes mensuales claros y breves a sus productores. Redacta el informe mensual.\n\nDATOS:\nCliente y período: [CLIENTE Y PERÍODO]\nVisitas y acciones: [VISITAS Y ACCIONES]\nObservaciones a campo: [OBSERVACIONES A CAMPO]\nResultados y números: [RESULTADOS Y NÚMEROS]\nPlan del mes siguiente: [PLAN DEL MES SIGUIENTE]\nPendientes: [PENDIENTES]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes observaciones, estadios, umbrales, dosis ni datos del campo. Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo lo que te doy; no agregues observaciones, estadios, umbrales ni datos que no estén en mis notas.\n4. Escribe para el productor: frases cortas, sin jerga innecesaria, lo importante primero.\n5. Separa hechos observados, decisiones tomadas y recomendaciones pendientes de decisión.\n6. Si menciono una aplicación, anota producto genérico y que se hizo con receta; las dosis van [VER ETIQUETA] o como figuran en la receta que te paso.\n7. Agrega una tabla de lotes con estado y próxima acción.\n8. Cierra con los pendientes y quién es responsable de cada uno.\n\nFORMATO DE SALIDA:\nA) Resumen del mes en cinco líneas.\nB) Tabla | lote | cultivo | estado | acción del mes | próxima acción |.\nC) Plan del mes siguiente.\nD) Pendientes con responsable y lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega fotos sugeridas en cada lote.", "Hazlo más corto, para leer en el celular.", "Agrega un gráfico de lluvias del mes con mis datos.", "Escribe la versión para el banco.", "Suma el gasto del mes en insumos con las facturas que te paso.", "Agrega una sección de valor: qué se ahorró o se evitó, con mis números.", "Prepara el mensaje de WhatsApp para mandarlo.", "Compara con el informe del mes pasado.", "Arma el informe de cierre de campaña juntando todos los meses.", "Pásalo a formato de una página para imprimir."], "checklista": ["Todo lo que dice el informe sale de tus notas y registros.", "Los estadios y observaciones son los que viste.", "Las decisiones están separadas de las recomendaciones.", "Las aplicaciones tienen su receta.", "Los pendientes tienen responsable.", "El informe se lee en menos de cinco minutos."], "uwaga": "El informe es también un registro: lo que escribes puede servir si hay un reclamo. Que diga lo que viste y lo que recomendaste, con fecha.", "przyklad": {"wejscie": "Informe de noviembre para Agropecuaria Don Ernesto. Hice cuatro recorridas. Dos recetas de herbicida, en el Lote 7 y La Loma. En el Lote 7 ajustamos la densidad de la soja porque la sembradora venía pasada. La soja está en V3, buen stand. El maíz en V6, con algo de cogollero pero abajo del umbral que acordamos con Ernesto. Llovieron 85 milímetros en el mes. El barbecho quedó limpio en tres de cuatro lotes, en El Bajo hay escapes de rama negra. Para diciembre: monitorear chinches en soja y decidir la fertilización del maíz. Pendiente: no llegó el análisis de suelo del Lote 9 y falta la factura del contratista.", "wynik": "INFORME MENSUAL: Agropecuaria Don Ernesto, noviembre\n\nRESUMEN\n• 4 recorridas y 2 recetas de herbicida.\n• Soja en V3 con buen stand; maíz en V6.\n• Cogollero en maíz por debajo del umbral acordado: sin aplicación.\n• 85 mm de lluvia en el mes.\n• Barbecho limpio en 3 de 4 lotes; escapes de rama negra en El Bajo.\n\n| lote | cultivo | estado | acción del mes | próxima acción |\n| Lote 7 | soja | V3, buen stand | receta de herbicida; ajuste de d
