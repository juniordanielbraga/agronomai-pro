ote, cultivo, estadio, problema observado, método, valor, el umbral que yo cargo de mi referencia local, si lo supera o no, fotos, acción recomendada, fecha de revisita, kilómetros y si el informe ya se envió. Dame: 1) la lista de columnas con los encabezados en la fila 1; 2) las fórmulas para pegar en la fila 2 y cómo arrastrarlas; 3) validación de datos (listas desplegables) y formato condicional; 4) tres filas de ejemplo marcadas como «EJEMPLO». No completes de memoria dosis, precios, tiempos de carencia ni recomendaciones: déjalos como celdas para que yo las complete y márcalas [A COMPLETAR]. Antes hazme como máximo 5 preguntas sobre mis clientes, mis cultivos y mi forma de trabajar. Termina con la nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»"}, {"tytul": "Cronograma de labores", "tekst": "COLUMNAS:\nA Productor | B Lote | C Cultivo | D Labor (análisis de suelo / barbecho / fertilización / siembra / monitoreo / aplicación / cosecha / entrega de informe) | E Ventana desde | F Ventana hasta | G Fecha programada | H Fecha realizada | I Responsable (productor / contratista / asesor) | J Insumo o servicio necesario | K ¿Insumo confirmado? (Sí/No) | L Estado | M Días de atraso | N Notas\n\nFÓRMULAS (Excel y Google Sheets en español, separador punto y coma; si tu Excel está en inglés usa SI→IF, SUMA→SUM, SUMAR.SI→SUMIF, SI.ERROR→IFERROR, HOY→TODAY y separa con coma):\nL2: =SI(H2<>\"\";\"Hecha\";SI(G2=\"\";\"Sin fecha\";SI(HOY()>F2;\"Fuera de ventana\";SI(HOY()>=E2;\"En ventana\";\"Próxima\"))))\nM2: =SI(Y(H2=\"\";F2<>\"\";HOY()>F2);HOY()-F2;0)\nLabores de la semana: filtra G entre HOY() y HOY()+7.\nFormato condicional: L2 = «Fuera de ventana» → rojo; L2 = «En ventana» y K2 = «No» → naranja.\nNota: las ventanas de siembra, de aplicación y de cosecha las defines tú con tu referencia local y la etiqueta [VERIFICAR]. La planilla solo te avisa cuando una fecha se te pasa.\n\nPROMPT PARA QUE LA IA TE LA ARME:\nÁrmame una planilla «Cronograma de labores» para Excel o Google Sheets, para la oficina de un ingeniero agrónomo asesor. Una fila por labor y lote: ventana desde y hasta, fecha programada y realizada, responsable, insumo o servicio necesario y si está confirmado, con un estado automático (próxima, en ventana, fuera de ventana, hecha) y los días de atraso. Dame: 1) la lista de columnas con los encabezados en la fila 1; 2) las fórmulas para pegar en la fila 2 y cómo arrastrarlas; 3) validación de datos (listas desplegables) y formato condicional; 4) tres filas de ejemplo marcadas como «EJEMPLO». No completes de memoria dosis, precios, tiempos de carencia ni recomendaciones: déjalos como celdas para que yo las complete y márcalas [A COMPLETAR]. Antes hazme como máximo 5 preguntas sobre mis clientes, mis cultivos y mi forma de trabajar. Termina con la nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»"}, {"tytul": "Cartera de productores", "tekst": "COLUMNAS:\nA Productor o empresa | B Contacto | C Celular (WhatsApp) | D Correo | E Localidad y provincia o estado | F Hectáreas totales | G Cultivos principales | H Servicio contratado (básico / campaña completa / puntual) | I Tipo de honorario (por ha / abono mensual / por visita) | J Valor del honorario [A COMPLETAR] | K Honorario de la campaña (USD) | L Inicio del contrato | M Renovación | N Visitas incluidas | O Visitas hechas | P Última visita | Q Próxima acción | R Cobrado (USD) | S Saldo (USD) | T Estado (activo / propuesta / perdido)\n\nFÓRMULAS (Excel y Google Sheets en español, separador punto y coma; si tu Excel está en inglés usa SI→IF, SUMA→SUM, SUMAR.SI→SUMIF, SI.ERROR→IFERROR, HOY→TODAY y separa con coma):\nK2: =SI(I2=\"por ha\";F2*J2;SI(I2=\"abono mensual\";J2*12;J2*N2))\nS2: =K2-R2\nU2 (días a la renovación): =SI(M2=\"\";\"\";M2-HOY())\nV2 (días sin visita): =SI(P2=\"\";\"\";HOY()-P2)\nResumen: hectáreas por servicio =SUMAR.SI(H:H;\"campaña completa\";F:F); facturación total =SUMA(K:K); saldo por cobrar =SUMA(S:S).\nFormato condicional: U2 menor que 30 → naranja; V2 mayor que 30 con estado «activo» → rojo (cliente que se enfría); S2 mayor que 0 con más de 60 días → rojo.\n\nPROMPT PARA QUE LA IA TE LA ARME:\nÁrmame una planilla «Cartera de productores» para Excel o Google Sheets, para la oficina de un ingeniero agrónomo asesor. Una fila por cliente: contacto, localidad, hectáreas, cultivos, servicio contratado, tipo y valor de honorario, honorario de la campaña, fechas de contrato y renovación, visitas incluidas y hechas, cobrado y saldo, días sin visita y un resumen de hectáreas y facturación por servicio. Dame: 1) la lista de columnas con los encabezados en la fila 1; 2) las fórmulas para pegar en la fila 2 y cómo arrastrarlas; 3) validación de datos (listas desplegables) y formato condicional; 4) tres filas de ejemplo marcadas como «EJEMPLO». No completes de memoria dosis, precios, tiempos de carencia ni recomendaciones: déjalos como celdas para que yo las complete y márcalas [A COMPLETAR]. Antes hazme como máximo 5 preguntas sobre mis clientes, mis cultivos y mi forma de trabajar. Termina con la nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»"}, {"tytul": "Lista de insumos y stock", "tekst": "COLUMNAS:\nA Producto (nombre comercial) | B Tipo (herbicida / insecticida / fungicida / fertilizante / coadyuvante / curasemilla / semilla) | C Número de registro oficial o grado del fertilizante | D Banda toxicológica | E Lote y vencimiento | F Unidad (L, kg, bolsa, bidón) | G Stock inicial | H Ingresos | I Usado | J Devuelto | K Stock actual | L Lugar de guardado | M Costo por unidad (USD) | N Valor en stock (USD) | O Hoja de seguridad y etiqueta archivadas (Sí/No) | P Envases vacíos con triple lavado (cantidad) | Q Notas\n\nFÓRMULAS (Excel y Google Sheets en español, separador punto y coma; si tu Excel está en inglés usa SI→IF, SUMA→SUM, SUMAR.SI→SUMIF, SI.ERROR→IFERROR, HOY→TODAY y separa con coma):\nK2: =G2+H2-I2-J2\nN2: =K2*M2\nUsado en la campaña (vinculado a la planilla de registros de aplicación): =SUMAR.SI(Registros!K:K;A2;Registros!P:P)\nNecesidad para el plan: hectáreas del plan × dosis de la etiqueta [VER ETIQUETA] − stock actual.\nFormato condicional: vencimiento a menos de 90 días → naranja; O2 = «No» → rojo; K2 negativo → rojo (algo se cargó mal).\nNota: la dosis nunca se escribe de memoria en esta planilla. Si no tienes la etiqueta a mano, la celda queda [VER ETIQUETA].\n\nPROMPT PARA QUE LA IA TE LA ARME:\nÁrmame una planilla «Lista de insumos y stock» para Excel o Google Sheets, para la oficina de un ingeniero agrónomo asesor. Stock inicial, ingresos, usado, devuelto y stock actual por producto, con número de registro o grado del fertilizante, banda toxicológica, lote y vencimiento, lugar de guardado, hoja de seguridad archivada, envases con triple lavado, costo unitario y valor en stock. Vincula «usado» con mi planilla de registros de aplicación. Dame: 1) la lista de columnas con los encabezados en la fila 1; 2) las fórmulas para pegar en la fila 2 y cómo arrastrarlas; 3) validación de datos (listas desplegables) y formato condicional; 4) tres filas de ejemplo marcadas como «EJEMPLO». No completes de memoria dosis, precios, tiempos de carencia ni recomendaciones: déjalos como celdas para que yo las complete y márcalas [A COMPLETAR]. Antes hazme como máximo 5 preguntas sobre mis clientes, mis cultivos y mi forma de trabajar. Termina con la nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»"}, {"tytul": "Pendientes y seguimiento", "tekst": "COLUMNAS:\nA Fecha de alta | B Productor | C Lote o tema | D Pendiente (qué hay que hacer) | E Origen (visita / llamada / WhatsApp / banco / organismo) | F Responsable (yo / productor / contratista / proveedor) | G Prioridad (1 urgente, 2 esta semana, 3 puede esperar) | H Fecha límite | I Estado (abierto / esperando a otro / cerrado) | J Fecha de cierre | K Días abierto | L Próximo paso\n\nFÓRMULAS (Excel y Google Sheets en español, separador punto y coma; si tu Excel está en inglés usa SI→IF, SUMA→SUM, SUMAR.SI→SUMIF, SI.ERROR→IFERROR, HOY→TODAY y separa con coma):\nK2: =SI(J2<>\"\";J2-A2;HOY()-A2)\nVencido: =SI(Y(I2<>\"cerrado\";H2<>\"\";HOY()>H2);\"VENCIDO\";\"\")\nPendientes abiertos por productor: =CONTAR.SI.CONJUNTO(B:B;B2;I:I;\"<>cerrado\")\nFormato condicional: «VENCIDO» → rojo; prioridad 1 abierta → negrita; «esperando a otro» con más de 7 días → naranja (hay que llamar).\nUso diario: cada mañana ordena por prioridad y fecha límite; cada noche, pega en la IA tus notas del día y pídele «sácame la lista de pendientes en el formato de mi planilla».\n\nPROMPT PARA QUE LA IA TE LA ARME:\nÁrmame una planilla «Pendientes y seguimiento» para Excel o Google Sheets, para la oficina de un ingeniero agrónomo asesor. Una fila por pendiente: fecha de alta, productor, lote o tema, qué hay que hacer, origen, responsable, prioridad, fecha límite, estado, días abierto y próximo paso, con alerta de vencidos y un resumen de pendientes abiertos por productor. Dame: 1) la lista de columnas con los encabezados en la fila 1; 2) las fórmulas para pegar en la fila 2 y cómo arrastrarlas; 3) validación de datos (listas desplegables) y formato condicional; 4) tres filas de ejemplo marcadas como «EJEMPLO». No completes de memoria dosis, precios, tiempos de carencia ni recomendaciones: déjalos como celdas para que yo las complete y márcalas [A COMPLETAR]. Antes hazme como máximo 5 preguntas sobre mis clientes, mis cultivos y mi forma de trabajar. Termina con la nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»"}]}, {"id": "B2", "ikona": "📝", "tytul": "Biblioteca de modelos editables", "podtytul": "8 modelos listos para completar: del informe de visita a la presentación para el productor.", "opis": "Los documentos que más escribe un agrónomo, con el mismo formato profesional siempre. Completa los campos entre corchetes o pega el modelo en la IA junto con tus notas de campo y pídele que lo llene. Dosis, umbrales y plazos quedan como huecos para completar desde la etiqueta y las fuentes vigentes.", "sekcje": [{"tytul": "Informe de visita a campo", "tekst": "INFORME DE RECORRIDA\nProductor: [PRODUCTOR] | Lote: [LOTE] | Superficie: [HA] ha\nFecha y hora: [FECHA, HORA] | Clima: [CONDICIONES] | Técnico: [NOMBRE, MATRÍCULA]\nCultivo e híbrido o variedad: [CULTIVO, MATERIAL] | Fecha de siembra: [FECHA] | Estadio: [V/R, ZADOKS O BBCH]\n\n1. Estado general del cultivo: [STAND, UNIFORMIDAD, COLOR, VIGOR]\n2. Observaciones:\n| Plaga, enfermedad o maleza | Método | Resultado | Umbral (tu referencia) | Evaluación |\n| [OBJETIVO] | [MÉTODO] | [VALOR] | [UMBRAL — VERIFICAR] | [POR DEBAJO / SUPERA] |\n3. Estado nutricional: [SÍNTOMAS / SIN SÍNTOMAS]\n4. Conclusiones: [CONCLUSIONES]\n5. Recomendaciones: [ACCIÓN — producto y dosis según etiqueta: VER ETIQUETA; receta agronómica si corresponde]\n6. Próxima visita: [FECHA O ESTADIO]\nFotos: [N.º DE FOTOS, ANEXO]\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "Cuaderno de campo del lote", "tekst": "CUADERNO DE CAMPO — [PRODUCTOR] — [LOTE] — CAMPAÑA [AÑO]\nSuperficie: [HA] ha | Ubicación: [COORDENADAS O REFERENCIA] | Tipo de suelo: [SUELO] | Antecesor: [CULTIVO ANTERIOR]\n\n| Fecha | Labor | Insumo (nombre comercial) | Dosis | Superficie (ha) | Equipo o contratista | Condiciones | Responsable | Observaciones |\n| [FECHA] | [SIEMBRA / FERTILIZACIÓN / APLICACIÓN / COSECHA] | [PRODUCTO] | [VER ETIQUETA] | [HA] | [EQUIPO] | [VIENTO, TEMPERATURA, HUMEDAD] | [NOMBRE] | [NOTAS] |\n\nAnálisis de suelo: fecha [FECHA], laboratorio [LABORATORIO], pH [A COMPLETAR], MO [A COMPLETAR] %, P Bray [A COMPLETAR] ppm, N-nitratos [A COMPLETAR].\nCosecha: fecha [FECHA], rinde [T/HA O QQ/HA], humedad [%].\nCarencias respetadas: [VER ETIQUETA, fecha de última aplicación contra fecha de cosecha].\n\nUso: este cuaderno es la base para las BPA, para certificaciones y para cualquier reclamo. Cárgalo el mismo día de la labor."}, {"tytul": "Plan de acción para el productor", "tekst": "PLAN DE ACCIÓN — [PRODUCTOR]\nPreparado por: [ASESOR] | Fecha: [FECHA] | Período: [DESDE — HASTA]\n\nDiagnóstico en tres líneas: [QUÉ ESTÁ PASANDO, DÓNDE, POR QUÉ IMPORTA]\n\n| Prioridad | Lote | Acción | Quién | Hasta cuándo | Insumo o recurso | Cómo sabemos que se hizo |\n| 1 | [LOTE] | [ACCIÓN] | [PRODUCTOR / CONTRATISTA / ASESOR] | [FECHA] | [INSUMO — dosis VER ETIQUETA] | [EVIDENCIA: foto, registro, análisis] |\n| 2 | [LOTE] | [ACCIÓN] | [QUIÉN] | [FECHA] | [RECURSO] | [EVIDENCIA] |\n\nLo que puede esperar: [TEMAS A MONITOREAR]\nRiesgos si no se hace: [RIESGO, en lenguaje llano]\nRevisión del plan: [FECHA DE LA PRÓXIMA REUNIÓN]\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "Planificación de campaña", "tekst": "PLANIFICACIÓN DE CAMPAÑA [AÑO] — [PRODUCTOR]\nSuperficie total: [HA] ha | Zona: [LOCALIDAD] | Asesor: [NOMBRE]\n\n1. Objetivos del productor: [RENTABILIDAD, ROTACIÓN, SUELO, FINANCIERO]\n2. Plan por lote:\n| Lote | Ha | Antecesor | Cultivo | Híbrido o variedad | Fecha de siembra objetivo | Densidad | Fertilización (plan 4C) | Rinde objetivo |\n| [LOTE] | [HA] | [ANTECESOR] | [CULTIVO] | [MATERIAL — según ensayos, VERIFICAR] | [VENTANA] | [A COMPLETAR] | [SEGÚN ANÁLISIS DE SUELO] | [T/HA] |\n\n3. Rotación y cultivos de servicio: [ESQUEMA 3 A 5 AÑOS]\n4. Insumos a comprar y cuándo: [LISTA — precios del proveedor, A COMPLETAR]\n5. Riesgos y plan B: [CLIMA, PRECIOS, LOGÍSTICA]\n6. Seguro agrícola: [COBERTURA A COTIZAR — VERIFICAR con la aseguradora]\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "Presupuesto para el productor", "tekst": "PRESUPUESTO — [CULTIVO] — [PRODUCTOR] — CAMPAÑA [AÑO]\nSuperficie: [HA] ha | Rinde esperado: [T/HA] | Precio neto esperado: [USD/T — A COMPLETAR]\n\n| Rubro | Detalle | USD/ha | Total (USD) |\n| Semilla | [MATERIAL, DENSIDAD] | [A COMPLETAR] | [USD/HA × HA] |\n| Fertilizantes | [PRODUCTO, KG/HA] | [A COMPLETAR] | [CÁLCULO] |\n| Fitosanitarios | [PROGRAMA — dosis VER ETIQUETA] | [A COMPLETAR] | [CÁLCULO] |\n| Labores | [SIEMBRA, PULVERIZACIONES — tarifas de tu zona] | [A COMPLETAR] | [CÁLCULO] |\n| Cosecha | [TARIFA] | [A COMPLETAR] | [CÁLCULO] |\n| Flete y comercialización | [DISTANCIA, GASTOS] | [A COMPLETAR] | [CÁLCULO] |\n| Total costo directo | | [SUMA] | [SUMA] |\n\nMargen bruto = ingreso bruto − costo directo = [CÁLCULO PASO A PASO]\nRinde de indiferencia = costo total / precio neto = [CÁLCULO]\nValidez de los precios: [FECHA DE LAS COTIZACIONES]\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "Propuesta de servicio", "tekst": "PROPUESTA DE ASESORAMIENTO\nPara: [PRODUCTOR O EMPRESA] | Preparada por: [NOMBRE, MATRÍCULA, EMPRESA] | Fecha: [FECHA]\n\n1. Tu empresa: [HECTÁREAS, CULTIVOS, ZONA, OBJETIVOS]\n2. Lo que me dijiste que más importa: [PRIORIDAD 1, 2, 3]\n3. Lo que propongo: [SERVICIO] para [HA] ha\n4. Alcance:\n| Servicio | Frecuencia | Entregable |\n| [MONITOREO] | [CADA CUÁNTO] | [INFORME DESPUÉS DE CADA VISITA] |\n| [PLAN DE FERTILIZACIÓN] | [UNA VEZ POR CAMPAÑA] | [PLAN POR LOTE] |\n5. Honorarios: [A COMPLETAR: USD/ha × ha = total, o abono] | Forma de pago: [A COMPLETAR]\n6. Lo que necesito de ti: [MAPAS DE LOTES, ANÁLISIS DE SUELO, RINDES ANTERIORES, FACTURAS DE INSUMOS]\n7. Independencia: [NO VENDO INSUMOS / TRABAJO PARA LA AGRONOMÍA X — ajústalo a tu caso]\n8. Validez de la propuesta: [FECHA]\n\nVer el kit de propuestas y honorarios (bono 4) para modelos por tipo de servicio."}, {"tytul": "Resumen de proyecto", "tekst": "RESUMEN DE PROYECTO — [NOMBRE DEL PROYECTO]\nTitular: [PRODUCTOR O EMPRESA] | Establecimiento: [NOMBRE, LOCALIDAD] | Responsable técnico: [NOMBRE, MATRÍCULA]\n\n1. Qué se quiere hacer (dos líneas): [RIEGO, GALPÓN, SILO, PLANTACIÓN, MAQUINARIA, CAMBIO DE SISTEMA]\n2. Situación actual: [HA, CULTIVOS O RODEO, RINDES O PRODUCCIÓN, INFRAESTRUCTURA]\n3. Situación con el proyecto: [QUÉ CAMBIA Y EN CUÁNTO — datos del productor, SUPUESTO donde corresponda]\n4. Inversión: [MONTO DE COTIZACIONES, A COMPLETAR] | Aporte propio: [A COMPLETAR] | Financiación buscada: [ENTIDAD, LÍNEA — VERIFICAR condiciones vigentes]\n5. Cronograma: [ETAPAS Y MESES]\n6. Resultados esperados: [INDICADORES MEDIBLES]\n7. Riesgos y cómo se mitigan: [RIESGO — MEDIDA]\n8. Anexos: [COTIZACIONES, PLANOS, ANÁLISIS, FOTOS]\n\nSirve como portada de la carpeta de crédito (bono 3) o para presentar el proyecto a un socio.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "Presentación para el productor o reunión técnica", "tekst": "ESTRUCTURA DE PRESENTACIÓN (8 diapositivas)\n1. Portada: [TÍTULO], [PRODUCTOR O GRUPO], [FECHA], [ASESOR]\n2. Cómo vino la campaña: [3 DATOS CLAVE — lluvias, eventos, precios]\n3. Resultados por lote: tabla | Lote | Cultivo | Ha | Rinde | Objetivo | Margen |\n4. Lo que funcionó: [3 PUNTOS CON EVIDENCIA]\n5. Lo que no funcionó y por qué: [3 PUNTOS, sin culpas, con datos]\n6. Propuesta para la próxima campaña: [ROTACIÓN, MATERIALES, NUTRICIÓN, PROTECCIÓN]\n7. Números: presupuesto y rinde de indiferencia [CÁLCULO]\n8. Próximos pasos: [QUÉ, QUIÉN, CUÁNDO]\n\nPROMPT: «Con estos datos [PEGA TUS NOTAS Y TABLAS], arma el texto de una presentación de 8 diapositivas para un productor con la estructura de arriba. Máximo 5 líneas por diapositiva, lenguaje llano, y una sugerencia de gráfico o foto para cada una. No inventes datos: lo que falte márcalo [A COMPLETAR].»\nTip: Gemini puede pasarlo directo a Google Slides; en ChatGPT o Claude pide el texto y pégalo en tu plantilla."}]}, {"id": "B3", "ikona": "🏦", "tytul": "Kit crédito agropecuario organizado", "podtytul": "La carpeta de crédito ordenada: guía de armado, checklist de documentos, cuadro de inversiones y cronograma físico-financiero.", "opis": "Para cuando el productor te pide «ayúdame con el crédito del banco». Te da el orden de la carpeta, la lista de papeles, el modelo de resumen del establecimiento, el cuadro de inversiones con fórmulas, el cronograma físico-financiero y un mapa de pendientes para no perder semanas yendo y viniendo. Ordena los papeles y el proyecto: no garantiza la aprobación, que depende de la entidad, del historial del productor y de las condiciones vigentes. Sin tasas ni montos inventados: esos los da el banco.", "sekcje": [{"tytul": "Guía de armado de la carpeta", "tekst": "Orden recomendado (el analista del banco o de la cooperativa lee en este orden):\n1. Nota de presentación: quién pide, cuánto, para qué y en qué plazo, en una página.\n2. Resumen del establecimiento: superficie, tenencia, actividades, producción de las últimas campañas.\n3. Descripción del proyecto: qué se compra o se construye, por qué y qué cambia en la producción.\n4. Cuadro de inversiones: cada ítem con su cotización, aporte propio y monto a financiar.\n5. Cronograma físico-financiero: cuándo se hace cada etapa y cuándo se necesita cada desembolso.\n6. Flujo de fondos con y sin proyecto: de dónde sale la plata para pagar las cuotas.\n7. Documentación legal, contable e impositiva del titular.\n8. Anexos: cotizaciones, planos, títulos o contratos, análisis, fotos.\n\nAntes de armar nada, pide a la entidad (Banco Nación, FIRA a través de su intermediario, Finagro a través del banco, Agrobanco, Crédito Agrícola de Habilitación, la cooperativa o el banco privado del productor) la lista vigente de requisitos de la línea que van a usar [VERIFICAR CON LA ENTIDAD]. Cada línea pide algo distinto y cambia seguido.\nTu rol: ordenar la información técnica y el proyecto. La firma de la solicitud, las declaraciones juradas y la decisión de endeudarse son del productor."}, {"tytul": "Checklist de documentos", "tekst": "TITULAR\n☐ Documento de identidad del titular y de los socios o apoderados\n☐ Constancia de inscripción fiscal [A COMPLETAR: CUIT, RUC, RFC, NIT o RUT según el país]\n☐ Estatuto, acta de autoridades y poderes (si es sociedad)\n☐ Constancia de domicilio\n\nESTABLECIMIENTO\n☐ Título de propiedad, contrato de arrendamiento o aparcería vigente (y plazo que cubra el crédito)\n☐ Registro sanitario o productivo del establecimiento [VERIFICAR: por ejemplo RENSPA en Argentina o el registro que pida el organismo de tu país]\n☐ Plano o croquis con lotes y superficies\n☐ Declaración de siembra o existencias de hacienda de la última campaña\n\nECONÓMICO Y CONTABLE\n☐ Balances o estados contables de los últimos ejercicios [A COMPLETAR: cuántos pide la entidad]\n☐ Manifestación de bienes\n☐ Constancias de ventas de granos o hacienda de las últimas campañas\n☐ Deudas vigentes con otras entidades y proveedores\n☐ Constancias de pago de impuestos al día\n\nPROYECTO\n☐ Cotizaciones firmadas y vigentes (al menos dos por ítem si la entidad lo pide)\n☐ Proyecto técnico (riego, galpón, silo, plantación) con responsable y matrícula\n☐ Permisos que correspondan (agua, ambiental, municipal) [VERIFICAR CON EL ORGANISMO DE TU PAÍS]\n☐ Seguro agrícola o de los bienes, si la línea lo exige [VERIFICAR]\n\nUsa la columna «Estado» del mapa de pendientes (última sección) para marcar cada papel."}, {"tytul": "Resumen del establecimiento (modelo)", "tekst": "RESUMEN DEL ESTABLECIMIENTO\nTitular: [PRODUCTOR O EMPRESA] | Establecimiento: [NOMBRE] | Ubicación: [LOCALIDAD, PROVINCIA O ESTADO, COORDENADAS]\nSuperficie total: [HA] ha | Propia: [HA] ha | Arrendada: [HA] ha (contratos hasta [FECHA])\nActividades: [AGRICULTURA, GANADERÍA, LECHERÍA, FRUTICULTURA]\n\nProducción de las últimas campañas (datos del productor):\n| Campaña | Cultivo o actividad | Ha o cabezas | Rinde o producción | Destino de la venta |\n| [CAMPAÑA] | [CULTIVO] | [HA] | [T/HA] | [ACOPIO, EXPORTADOR, INDUSTRIA] |\n\nInfraestructura y maquinaria: [LISTA RESUMIDA]\nPersonal: [PERMANENTE, TEMPORARIO, CONTRATISTAS]\nAsesoramiento técnico: [NOMBRE, desde cuándo]\nFortalezas para el crédito: [HISTORIAL, DIVERSIFICACIÓN, SEGURO, CONTRATOS DE VENTA]\n\nPROMPT: «Con estos datos [PEGA TUS DATOS] redacta el resumen del establecimiento para una carpeta de crédito agropecuario, en una página, tono sobrio. No inventes producciones ni montos: lo que falte márcalo [A COMPLETAR]. Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»"}, {"tytul": "Cuadro de inversiones", "tekst": "COLUMNAS:\nA Ítem | B Descripción técnica | C Proveedor | D N.º de cotización y fecha | E Cantidad | F Precio unitario (moneda de la cotización) | G Subtotal | H Impuestos [A COMPLETAR] | I Total del ítem | J Aporte propio | K Monto a financiar | L % financiado | M Etapa del cronograma\n\nFÓRMULAS (Excel y Google Sheets en español, separador punto y coma; si tu Excel está en inglés usa SI→IF, SUMA→SUM, SUMAR.SI→SUMIF, SI.ERROR→IFERROR, HOY→TODAY y separa con coma):\nG2: =E2*F2\nI2: =G2+H2\nK2: =I2-J2\nL2: =SI.ERROR(K2/I2;\"\")  (formato %)\nTotales: =SUMA(I2:I50), =SUMA(J2:J50), =SUMA(K2:K50)\nControl: si la línea financia hasta cierto porcentaje [VERIFICAR CON LA ENTIDAD], compara el % total con ese tope y pinta en rojo si lo supera.\nNota: los precios salen de cotizaciones firmadas con fecha; si la cotización vence antes de la aprobación, anótalo en «Pendientes». Si la cotización está en otra moneda, deja el tipo de cambio en una celda aparte con su fecha [A COMPLETAR]."}, {"tytul": "Cronograma físico-financiero", "tekst": "COLUMNAS:\nA Etapa | B Actividad | C Mes de inicio | D Mes de fin | E Avance físico esperado (%) | F Monto de la etapa | G Fuente (aporte propio / crédito / proveedor) | H Desembolso esperado (mes) | I Ingreso que genera (mes y monto, datos del productor) | J Comprobante de avance (factura, certificado, foto)\n\nDebajo, una tabla mes a mes:\n| Mes | Inversión | Aporte propio | Desembolso del crédito | Ingresos del establecimiento | Cuota del crédito [A COMPLETAR según la entidad] | Saldo del mes | Saldo acumulado |\n\nFÓRMULAS (Excel y Google Sheets en español, separador punto y coma; si tu Excel está en inglés usa SI→IF, SUMA→SUM, SUMAR.SI→SUMIF, SI.ERROR→IFERROR, HOY→TODAY y separa con coma):\nSaldo del mes: =Aporte+Desembolso+Ingresos-Inversión-Cuota\nSaldo acumulado: mes 1 = saldo inicial [A COMPLETAR] + saldo del mes; luego = acumulado anterior + saldo del mes.\nFormato condicional: saldo acumulado negativo → rojo.\n\nClaves: las cuotas se calculan con la tasa, el plazo y el período de gracia que informa la entidad [VERIFICAR CON LA ENTIDAD], nunca con una tasa supuesta. Haz coincidir los vencimientos con los meses de cosecha o de venta de hacienda; un cronograma que paga cuotas en meses sin ingresos es la objeción más común del analista."}, {"tytul": "Mapa de pendientes de la carpeta", "tekst": "| Documento o tarea | Quién lo consigue | Dónde se pide | Fecha pedida | Fecha recibida | Vence | Estado |\n| Constancia fiscal | Productor | [ORGANISMO FISCAL] | [FECHA] | [FECHA] | [A COMPLETAR] | [PEDIDO / RECIBIDO / FALTA] |\n| Balances | Contador | Estudio contable | [FECHA] | | | [ESTADO] |\n| Cotizaciones | Asesor | Proveedores | [FECHA] | | [VALIDEZ] | [ESTADO] |\n| Proyecto técnico | Asesor o profesional matriculado | — | [FECHA] | | | [ESTADO] |\n| Permisos | Productor | [ORGANISMO — VERIFICAR] | [FECHA] | | | [ESTADO] |\n\nRegla de oro: el pendiente que depende de un tercero (contador, organismo, proveedor) se pide el primer día, porque es el que más tarda.\nUna vez por semana, manda al productor por WhatsApp la lista de lo que falta, con quién lo tiene que conseguir y para cuándo. Ejemplo: «Martín, para la carpeta del banco nos faltan 3 cosas: 1) balance del último ejercicio (tu contador), 2) contrato de arrendamiento de La Loma firmado, 3) segunda cotización del silo. Con eso la presentamos.»"}, {"tytul": "Prompt para armar la carpeta con la IA", "tekst": "Eres un ingeniero agrónomo asesor con experiencia en proyectos de inversión agropecuaria. Ayúdame a ordenar la carpeta de crédito de [PRODUCTOR] para [INVERSIÓN] en [ENTIDAD Y LÍNEA].\n\nDATOS: te pego lo que tengo: [DATOS DEL ESTABLECIMIENTO, COTIZACIONES, PRODUCCIÓN, DEUDAS].\n\nREGLAS:\n1. Antes de redactar, hazme como máximo 6 preguntas sobre lo que falta.\n2. No inventes tasas, plazos, montos máximos, requisitos ni porcentajes financiables: márcalos [VERIFICAR CON LA ENTIDAD].\n3. Toda cifra de producción o de ingresos sale de mis datos; si estimas algo, márcalo [SUPUESTO].\n4. Muestra las cuentas paso a paso.\n\nFORMATO DE SALIDA:\nA. Nota de presentación (una página)\nB. Resumen del establecimiento\nC. Descripción del proyecto\nD. Cuadro de inversiones (tabla)\nE. Cronograma físico-financiero (tabla)\nF. Lista de documentos faltantes con responsable\nG. Puntos débiles que el analista puede objetar y cómo responderlos\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "Errores que traban una carpeta", "tekst": "1. Cotizaciones vencidas o sin fecha. Pide que tengan validez de al menos el tiempo que tarda la aprobación [VERIFICAR CON LA ENTIDAD].\n2. Contrato de arrendamiento más corto que el plazo del crédito. El analista lo detecta enseguida.\n3. Cuotas que caen en meses sin ingresos. Ajusta el cronograma a la cosecha o a la venta.\n4. Producciones sin respaldo. Toda cifra de rinde o venta debería tener una constancia (liquidaciones, facturas, declaraciones).\n5. Proyecto técnico sin firma de un profesional habilitado cuando la línea lo exige.\n6. Deudas no declaradas. Aparecen en la central de riesgo y le quitan credibilidad a toda la carpeta.\n7. Mezclar el proyecto con gastos corrientes. Si el productor necesita capital de trabajo, va en una línea o un renglón aparte.\n8. Prometer la aprobación. Tu trabajo es dejar la carpeta completa y coherente; la decisión es de la entidad. Dilo así, por escrito, en tu propuesta de servicio."}]}, {"id": "B4", "ikona": "🤝", "tytul": "Kit propuestas y honorarios de asesoramiento", "podtytul": "Alcance, tabla de honorarios calculada con tus costos, propuestas por tipo de servicio y seguimiento.", "opis": "Todo lo que necesitas para vender tu asesoramiento como profesional: cómo definir el alcance, cómo calcular tu honorario a partir de tus costos y del ingreso que buscas (sin cifras inventadas), modelos de propuesta para asesoramiento por campaña, servicios puntuales y gestión de crédito, quién se hace cargo de qué y la secuencia de mensajes de seguimiento.", "sekcje": [{"tytul": "Estructura de alcance", "tekst": "Antes de hablar de plata, deja por escrito qué incluye y qué no. Un alcance claro evita el «pensé que eso entraba».\n\n| Bloque | Qué incluye | Frecuencia | Entregable |\n| Monitoreo | Recorridas en ventanas clave del cultivo | [CADA CUÁNTOS DÍAS] | Informe con fotos en 24 h |\n| Nutrición | Muestreo de suelo, interpretación y plan 4C por lote | [UNA VEZ POR CAMPAÑA] | Plan por lote |\n| Protección | Decisiones por umbral, recetas agronómicas | [SEGÚN NECESIDAD] | Receta y registro |\n| Números | Presupuesto, margen bruto, rinde de indiferencia | [ANTES DE SIEMBRA Y AL CIERRE] | Planilla y resumen |\n| Papeles | Apoyo en carpeta de crédito, seguro, registros | [A PEDIDO] | Carpeta ordenada |\n| Cierre | Informe de campaña y reunión de planificación | [UNA VEZ] | Informe y presentación |\n\nNO INCLUIDO (escríbelo siempre): compra de insumos, labores, análisis de laboratorio (se facturan aparte), gestiones presenciales ante organismos, [A COMPLETAR].\nLímites: hectáreas cubiertas [HA], lotes [LISTA], zona [LOCALIDAD], visitas extra a [VALOR A COMPLETAR]."}, {"tytul": "Cómo calcular tu tabla de honorarios", "tekst": "Tu honorario no se copia del colega: se calcula con tus números. Método en 5 pasos:\n\n1. Costos fijos del año: camioneta (amortización, seguro, patente), celular, software, matrícula, contador, capacitación. Suma = CF [A COMPLETAR].\n2. Costo variable por visita: combustible por kilómetro × kilómetros promedio + viáticos. = CV [A COMPLETAR].\n3. Ingreso que quieres para ti en el año (lo que te llevas limpio) = IO [A COMPLETAR].\n4. Horas facturables reales en el año (descuenta oficina, viajes, temporada baja) = H [A COMPLETAR].\n5. Valor hora = (CF + IO) / H. Valor visita = valor hora × horas que dura la visita con informe + CV.\n\nEjemplo con números de un asesor (no son una referencia de mercado): CF = 9.600 USD; IO = 30.000 USD; H = 1.200 h.\nValor hora = (9.600 + 30.000) / 1.200 = 39.600 / 1.200 = 33 USD/h.\nVisita de 3 h con informe y 25 USD de camioneta: 33 × 3 + 25 = 124 USD por visita.\nPasarlo a USD/ha por campaña: (visitas de la campaña × valor visita + horas de oficina × valor hora) / hectáreas del cliente.\n\nDespués compáralo con lo que se cobra en tu zona (colegas, colegio o consejo profesional, cámaras) [VERIFICAR]. Si tu número da muy por encima, revisa horas y costos antes de bajar el precio."}, {"tytul": "Tabla de honorarios (estructura)", "tekst": "TABLA DE HONORARIOS — [TU NOMBRE O EMPRESA] — CAMPAÑA [AÑO]\n(Valores calculados con tus costos; actualízalos cada campaña.)\n\n| Servicio | Unidad | Valor | Mínimo | Notas |\n| Asesoramiento básico | USD/ha por campaña | [A COMPLETAR] | [HA MÍNIMAS] | Visitas en ventanas clave |\n| Asesoramiento de campaña completa | USD/ha por campaña o abono mensual | [A COMPLETAR] | [HA MÍNIMAS] | Incluye plan de nutrición y números |\n| Visita extra | USD/visita | [A COMPLETAR] | | Kilómetros: [POLÍTICA] |\n| Muestreo de suelo | USD/muestra o USD/ha | [A COMPLETAR] | | Laboratorio [INCLUIDO / APARTE] |\n| Plan de fertilización por lote | USD/plan o USD/ha | [A COMPLETAR] | | |\n| Informe de siniestro para seguro | USD/informe | [A COMPLETAR] | | Urgencia 24 h: [RECARGO] |\n| Carpeta de crédito | USD/carpeta o % acordado | [A COMPLETAR] | | No garantiza aprobación |\n| Receta agronómica suelta | USD/receta | [A COMPLETAR] | | Según norma local [VERIFICAR] |\n\nForma de pago: [ADELANTO %, CUOTAS, A COSECHA, EN QUINTALES] [A COMPLETAR]. Si cobras en producto, fija la fecha y el precio de referencia por escrito."}, {"tytul": "Propuesta: asesoramiento por campaña", "tekst": "PROPUESTA DE ASESORAMIENTO — CAMPAÑA [AÑO]\nPara: [PRODUCTOR] | De: [ASESOR, MATRÍCULA] | Fecha: [FECHA]\n\nTu situación: [HA, CULTIVOS, ZONA, LO QUE TE PREOCUPA]\nObjetivo de la campaña: [EJEMPLO: bajar el costo por tonelada sin resignar rinde]\n\nQué hago:\n1. Recorridas cada [DÍAS] en el ciclo del cultivo, informe con fotos dentro de las 24 h.\n2. Muestreo de suelo y plan de fertilización 4C por lote.\n3. Decisiones de protección por umbral, con receta agronómica.\n4. Presupuesto, margen bruto y rinde de indiferencia por lote.\n5. Informe de cierre y reunión para la próxima campaña.\n\nHonorarios: [VALOR USD/HA] × [HA] ha = [TOTAL] | Forma de pago: [A COMPLETAR]\nLo que necesito de ti: mapas de lotes, rindes de las últimas campañas, análisis de suelo previos, facturas de insumos.\nVálida hasta: [FECHA]\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "Propuesta: servicio puntual", "tekst": "Para trabajos de una sola vez: plan de fertilización, informe de siniestro, diagnóstico de un lote problema, evaluación de stand.\n\nPROPUESTA DE SERVICIO PUNTUAL\nPara: [PRODUCTOR] | Servicio: [NOMBRE DEL SERVICIO] | Lotes: [LOTES, HA]\n\nQué voy a entregar: [ENTREGABLE CONCRETO, por ejemplo: informe de daño por granizo con fotos georreferenciadas y estimación de superficie afectada]\nPlazo: [DÍAS HÁBILES desde la visita]\nQué no incluye: [ANÁLISIS DE LABORATORIO, SEGUNDA VISITA, TRÁMITE ANTE LA ASEGURADORA]\nHonorario: [VALOR] + kilómetros [POLÍTICA] | Pago: [CONTRA ENTREGA / ADELANTO]\n\nTruco comercial: al entregar el trabajo puntual, ofrece el asesoramiento de campaña descontando lo ya pagado si contrata antes de [FECHA]. Es la forma más natural de convertir un cliente de una vez en un cliente fijo."}, {"tytul": "Propuesta: carpeta de crédito y papeles", "tekst": "PROPUESTA — ORDEN DE CARPETA DE CRÉDITO\nPara: [PRODUCTOR] | Proyecto: [INVERSIÓN] | Entidad: [BANCO, COOPERATIVA O INTERMEDIARIO]\n\nIncluye: relevamiento del establecimiento, resumen del establecimiento, descripción del proyecto, cuadro de inversiones, cronograma físico-financiero, lista de documentos faltantes y seguimiento semanal hasta la presentación.\nNo incluye: documentación contable (la prepara tu contador), firmas, garantías, gestiones presenciales [A COMPLETAR].\n\nHonorario: [MONTO FIJO O ESQUEMA ACORDADO — A COMPLETAR]\n\nAclaración que va siempre por escrito: «Mi trabajo es dejar la carpeta completa, ordenada y coherente. La aprobación, el monto, la tasa y el plazo dependen exclusivamente de la entidad y de su análisis. No garantizo la aprobación del crédito.»"}, {"tytul": "Responsabilidades del asesor y del productor", "tekst": "Pégalo como anexo de cualquier propuesta.\n\nEL ASESOR SE COMPROMETE A:\n• Recorrer en las fechas acordadas y avisar con 24 h si hay cambios.\n• Entregar informes en el plazo acordado.\n• Basar cada recomendación en lo observado, en el análisis de suelo y en la etiqueta del producto.\n• Emitir receta agronómica cuando la norma lo exige [VERIFICAR CON LA NORMA DE TU PAÍS].\n• Avisar si tiene relación comercial con algún proveedor.\n\nEL PRODUCTOR SE COMPROMETE A:\n• Dar acceso a los lotes y a la información (rindes, análisis, facturas).\n• Avisar enseguida de cualquier evento (granizo, helada, plaga, deriva).\n• Respetar la etiqueta y las recomendaciones al aplicar, o avisar si decide otra cosa.\n• Llevar el registro de aplicaciones o pasar los datos al asesor.\n• Pagar en los plazos acordados.\n\nDECISIONES: la decisión final de cada labor es del productor. Si decide algo distinto a lo recomendado, se deja constancia por escrito (un WhatsApp sirve)."}, {"tytul": "Seguimiento de la propuesta", "tekst": "Secuencia de contacto después de enviar la propuesta:\n\nDÍA 0 (al enviarla): «Hola [NOMBRE], te mandé la propuesta para la campaña [AÑO]. En corto: [SERVICIO] para [HA] ha, informe después de cada visita y el plan de fertilización por lote. Si te sirve, la repasamos 15 minutos por teléfono. ¿Te queda bien [DÍA] o [DÍA]?»\n\nDÍA 3: «[NOMBRE], ¿pudiste mirar la propuesta? Si hay algo que quieras sacar o agregar, la ajusto a lo que necesitas.»\n\nDÍA 7: «[NOMBRE], te escribo por las fechas: para llegar al muestreo de suelo antes de la siembra necesitaríamos confirmar antes del [FECHA]. ¿Cómo lo ves?»\n\nDÍA 14 (último): «[NOMBRE], no te quiero llenar de mensajes. Dejo la propuesta abierta hasta el [FECHA]. Si este año no se da, cuenta conmigo igual para cualquier consulta.»\n\nRESPUESTAS A OBJECIONES:\n«Es caro» → «Hagamos la cuenta juntos con tus números: en [HA] ha son [USD/HA]. Una aplicación innecesaria o un problema que no se detecta a tiempo suele costar más que eso.»\n«El técnico de la agronomía viene gratis» → «Hace un buen trabajo. La diferencia es que su servicio va incluido en el precio de lo que vende; mi recomendación es independiente y compras donde más te convenga.»\n«Lo pienso para la próxima» → «Perfecto. ¿Te parece si al menos hacemos el muestreo de suelo ahora, así la próxima campaña arrancamos con datos?»"}]}, {"id": "B5", "ikona": "📚", "tytul": "Biblioteca de 30 ejemplos completados", "podtytul": "Mira exactamente qué escribir y qué te devuelve la IA: 5 ejemplos por cada uno de los 6 departamentos.", "opis": "30 situaciones reales de la campaña de un agrónomo: informe de recorrida, nota de voz convertida en informe, conteo de plantas, plan de nitrógeno 4C, margen bruto, rinde de indiferencia, propuesta de asesoramiento, carpeta de crédito, siniestro para el seguro, registro de aplicación y decisión por umbral. Cada ejemplo muestra lo que escribe o dicta el agrónomo y lo que devuelve la IA. Todos los números vienen del usuario: la IA no inventa dosis, umbrales ni plazos, y marca los huecos con [A COMPLETAR], [VERIFICAR] y [VER ETIQUETA].", "sekcje": [{"tytul": "1. Informe de recorrida: soja en R3 con manchas foliares en Pergamino (Skill 1.02 · Recorridas y visitas a campo)", "tekst": "LO QUE ESCRIBES:\n«Agropecuaria Don Ernesto, Pergamino, Lote 7, 95 ha, soja de primera en R3. En el bajo del lado este veo manchas foliares en hojas del tercio medio, calculo 1 de cada 5 plantas con síntomas. Canopeo cerrado, llovió mucho las últimas dos semanas, el año pasado hubo problemas de enfermedades de fin de ciclo en este lote. Ármale el informe a Ernesto.»\n\nLO QUE TE DEVUELVE LA IA:\nINFORME DE RECORRIDA — Agropecuaria Don Ernesto, Lote 7 (95 ha), soja R3\n| Tema | Observación | Evaluación |\n| Manchas foliares | ~20 % de plantas con síntomas en el tercio medio, bajo este | Localizado; mapear superficie [A COMPLETAR: % del lote] |\n| Diagnóstico | Síntomas compatibles con enfermedades de fin de ciclo | [VERIFICAR: confirmar con lupa o laboratorio] |\n| Estadio | R3 | [VERIFICAR en 10 plantas] |\n| Condiciones | Canopeo cerrado, lluvias frecuentes, antecedentes del lote | Riesgo alto para progresión |\nDecisión: depende de la incidencia y severidad en el tercio medio y del umbral que uses [A COMPLETAR]. Si se aplica, producto registrado para soja, dosis y carencia [VER ETIQUETA], con receta agronómica.\nPróxima visita: [A COMPLETAR: fecha] para ver avance hacia el tercio superior.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "2. Nota de voz a informe: roya en trigo en General Villegas (Skill 1.03 · Recorridas y visitas a campo)", "tekst": "LO QUE ESCRIBES:\nDictado en la camioneta: «Hnos. Benítez, General Villegas, trigo en La Loma, yo diría Zadoks 37, hoja bandera asomando. Pústulas de roya en la hoja de abajo de la bandera, una planta de cada diez más o menos, la bandera limpia. La variedad no me acuerdo. Quieren saber si aplicamos. Hazlo cortito.»\n\nLO QUE TE DEVUELVE LA IA:\nINFORME DE VISITA — Hnos. Benítez, La Loma, trigo\n1. Estadio: Zadoks 37 [VERIFICAR: ¿bandera totalmente expandida?].\n2. Roya: pústulas en hoja bandera −1, ~10 % de plantas; bandera sana en esta visita.\n3. Variedad: [A COMPLETAR] — su comportamiento frente a roya define buena parte de la decisión.\n4. Factores para decidir: comportamiento varietal, pronóstico, potencial de rinde y precio del trigo frente al costo de aplicar [A COMPLETAR: precios].\n5. Umbral: el que uses según tu referencia local [A COMPLETAR].\n6. Si se aplica: fungicida registrado para trigo y roya, dosis, momento y carencia [VER ETIQUETA], con receta.\nPróxima revisión: [A COMPLETAR: en pocos días] con foco en la hoja bandera.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "3. Conteo de plantas de maíz en Río Cuarto (Skill 1.06 · Recorridas y visitas a campo)", "tekst": "LO QUE ESCRIBES:\n«Río Cuarto, Potrero del Molino, maíz de primera a 52,5 cm entre surcos, sembrado a 80.000 semillas/ha. Conté 10 metros lineales en 5 lugares: 38, 36, 40, 35 y 37 plantas. Hay algunas fallas cerca del canal donde la sembradora saltó. ¿Está bien el stand?»\n\nLO QUE TE DEVUELVE LA IA:\nSTAND — Potrero del Molino, maíz a 52,5 cm\nPromedio: (38+36+40+35+37)/5 = 186/5 = 37,2 plantas en 10 m = 3,72 plantas/m\nMetros lineales por ha: 10.000 / 0,525 = 19.047,6 m\nPlantas/ha: 3,72 × 19.047,6 = 70.857 plantas/ha\nLogro: 70.857 / 80.000 × 100 = 88,6 %\n| Indicador | Valor |\n| Densidad de siembra | 80.000 sem/ha (tu dato) |\n| Stand logrado | 70.857 pl/ha |\n| Pérdida | 9.143 pl/ha |\nFallas junto al canal: medir superficie aparte [A COMPLETAR: ha] y no promediarlas con el resto.\nResiembra: comparar con la densidad objetivo de tu referencia local y con la fecha de siembra [VERIFICAR]; la uniformidad pesa tanto como el promedio.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "4. Informe de daño por granizo en soja en Itapúa (Skill 1.07 · Recorridas y visitas a campo)", "tekst": "LO QUE ESCRIBES:\n«Martín Ortiz, Itapúa, Parcela 3, 160 ha de soja en R1. Cayó granizo anoche como a las 21. En la franja sur tallos golpeados y como la mitad del área foliar perdida, la mitad norte casi nada. Martín ya avisó a la aseguradora. Necesito el informe de daño y la lista de fotos.»\n\nLO QUE TE DEVUELVE LA IA:\nINFORME DE DAÑO — Martín Ortiz, Parcela 3 (160 ha), soja\nEvento: granizo, [A COMPLETAR: fecha], ~21 h (dato del productor)\nEstadio: R1 [VERIFICAR en 10 plantas por zona]\n| Zona | Daño observado | Superficie |\n| Franja sur | Tallos golpeados, ~50 % de defoliación | [A COMPLETAR: ha] |\n| Mitad norte | Daño mínimo visible | [A COMPLETAR: ha] |\nRecuperación: revisar rebrote y estado de tallos en 7 a 10 días antes de estimar pérdida [SUPUESTO: plazo a confirmar con el perito].\nLista de fotos: vista general por zona, hojas, tallos quebrados, testigo sin daño, granizo acumulado si queda; todas con ubicación y hora.\nNo laborear ni aplicar en la franja dañada hasta que la vea el perito [VERIFICAR con la póliza].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "5. Carta de recomendación para un productor de aguacate en Jalisco (Skill 1.08 · Recorridas y visitas a campo)", "tekst": "LO QUE ESCRIBES:\n«Rancho Los Álamos, Jalisco, huerta de aguacate de 25 ha. Hoy vi trips en brotes nuevos en la parte alta, el riego por goteo tiene dos líneas tapadas en el bloque 4 y el productor quiere fertilizar ya. Escríbele una carta clara con qué hacer esta semana y qué puede esperar.»\n\nLO QUE TE DEVUELVE LA IA:\nRECOMENDACIONES DESPUÉS DE LA VISITA — Rancho Los Álamos\nLo que vimos:\n• Trips en brotes nuevos, parte alta de la huerta [A COMPLETAR: nivel observado].\n• Dos líneas de goteo tapadas en el bloque 4.\nQué hacer y cuándo:\n| Prioridad | Bloque | Acción | Cuándo |\n| 1 | 4 | Destapar y lavar las líneas; revisar presión y caudal de goteros | Esta semana |\n| 2 | Parte alta | Monitorear trips en 20 brotes por bloque y comparar con tu umbral [A COMPLETAR] | En 3 días |\n| 3 | Toda la huerta | Fertilización según análisis foliar y de suelo [A COMPLETAR: análisis] | Después de normalizar el riego |\nSi hace falta controlar trips: producto registrado para aguacate, dosis y carencia [VER ETIQUETA], respetando requisitos del mercado de destino [VERIFICAR].\nLo que puede esperar: poda de formación.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "6. Plan de nitrógeno 4C para maíz en Venado Tuerto (Skill 2.01 · Planificación productiva y nutrición)", "tekst": "LO QUE ESCRIBES:\n«Venado Tuerto, 180 ha de maíz temprano. El N objetivo que me da mi modelo de recomendación local es 150 kg N/ha (suelo + fertilizante). Análisis 0-60 cm: 45 kg N-nitratos/ha. A la siembra va fosfato monoamónico a 90 kg/ha. El resto con urea. Ármame el plan.»\n\nLO QUE TE DEVUELVE LA IA:\nPLAN DE NITRÓGENO 4C — 180 ha de maíz\nN objetivo (tu modelo): 150 kg N/ha\nN de suelo (análisis): 45 kg N/ha\nN a aportar: 150 − 45 = 105 kg N/ha\nN del fosfato monoamónico: 90 × 11 % = 9,9 kg N/ha\nN restante: 105 − 9,9 = 95,1 kg N/ha\nUrea (46 % N): 95,1 / 0,46 = 206,7 kg urea/ha\nTotal del lote: 206,7 × 180 = 37.206 kg ≈ 37,2 t de urea\n| 4C | Plan |\n| Fuente | Urea + fosfato monoamónico |\n| Dosis | 206,7 kg urea/ha (cálculo arriba) |\n| Momento | [A COMPLETAR: siembra o V4-V6] |\n| Lugar | [A COMPLETAR: incorporada o al voleo; si va al voleo, considerar pérdidas por volatilización] |\nPrecio de la urea: [A COMPLETAR] para el costo por ha.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "7. Interpretación de análisis de suelo para el productor en Paysandú (Skill 2.03 · Planificación productiva y nutrición)", "tekst": "LO QUE ESCRIBES:\n«Jorge Ferreyra, Paysandú, El Bajo, 72 ha. Análisis nuevo: pH 5,6, MO 3,2 %, P Bray 9 ppm, CIC 18, sin dato de potasio. Rotación soja-trigo. Explícaselo a Jorge en simple y dime qué falta para recomendar.»\n\nLO QUE TE DEVUELVE LA IA:\nRESUMEN DEL ANÁLISIS DE SUELO — El Bajo (72 ha)\n| Parámetro | Resultado | Lectura |\n| pH | 5,6 | Algo ácido para la rotación [VERIFICAR: rango objetivo de tu referencia] |\n| MO | 3,2 % | Dato del laboratorio |\n| P Bray | 9 ppm | Categoría [VERIFICAR: tabla de interpretación local] |\n| CIC | 18 | Buena capacidad de retener nutrientes |\n| K | Sin dato | [A COMPLETAR] |\nPara Jorge, en simple: «El suelo tiene buena materia orgánica, pero está un poco ácido y bajo en fósforo para lo que pide la rotación. Antes de decidir encalado y fertilización necesito dos datos más».\nFalta para recomendar: potasio, profundidad y fecha de muestreo, rinde objetivo y la tabla de dosis de tu referencia local [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "8. Balance de fósforo por extracción en soja (Skill 2.04 · Planificación productiva y nutrición)", "tekst": "LO QUE ESCRIBES:\n«Lucía Ramírez, 250 ha de soja, rinde esperado 3,5 t/ha. Uso como coeficiente de extracción de fósforo el de mi tabla de referencia: 5 kg P por tonelada. Quiero reponer lo que se lleva con fosfato monoamónico 11-52-0. ¿Cuánto por hectárea y en total?»\n\nLO QUE TE DEVUELVE LA IA:\nBALANCE DE FÓSFORO — 250 ha de soja\nExtracción: 3,5 t/ha × 5 kg P/t = 17,5 kg P/ha (coeficiente tuyo)\nP en el fosfato monoamónico: 52 % P2O5 × 0,436 = 22,7 % P\nProducto para reponer: 17,5 / 0,227 = 77,1 kg/ha\nN que aporta de paso: 77,1 × 11 % = 8,5 kg N/ha\nTotal: 77,1 × 250 = 19.275 kg ≈ 19,3 t\n| Concepto | Valor |\n| Extracción de P | 17,5 kg P/ha |\n| Fosfato monoamónico | 77,1 kg/ha |\n| Total del campo | 19,3 t |\nOjo: reponer la extracción mantiene el nivel; si el P Bray está bajo, tu referencia local puede indicar dosis de construcción [A COMPLETAR: análisis de suelo]. Precio: [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "9. Plan de rotación a 4 años en Canindeyú (Skill 2.05 · Planificación productiva y nutrición)", "tekst": "LO QUE ESCRIBES:\n«Hnos. Benítez, Canindeyú, 600 ha. Vienen haciendo soja sobre soja con maíz zafriña en parte. Tienen problemas de malezas resistentes y el suelo compactado en los lotes viejos. Quieren algo para 4 años sin perder caja.»\n\nLO QUE TE DEVUELVE LA IA:\nPLAN DE ROTACIÓN — Hnos. Benítez (600 ha)\n| Año | Verano | Invierno | Objetivo |\n| 1 | Soja (2/3 del área) + maíz (1/3) | Cultivo de cobertura o trigo en lotes con maíz | Romper monocultivo y cubrir suelo |\n| 2 | Maíz donde hubo soja en lotes compactados | Trigo o cobertura | Aportar rastrojo y raíces |\n| 3 | Soja | Maíz zafriña donde la ventana lo permita | Caja |\n| 4 | Repetir esquema por tercios | Cobertura | Estabilizar |\nMalezas: la cobertura y el cambio de cultivo permiten rotar modos de acción [A COMPLETAR: especies presentes].\nCaja: comparar margen bruto por año con tus costos y precios [A COMPLETAR] antes de definir proporciones.\nMateriales y fechas: según ensayos de la zona [VERIFICAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "10. Elección de híbrido de maíz con datos de ensayos (Skill 2.10 · Planificación productiva y nutrición)", "tekst": "LO QUE ESCRIBES:\n«Para Agropecuaria Don Ernesto. Ensayos de 3 sitios de la zona, rinde en kg/ha. Híbrido A: 7.900, 8.100, 7.600. Híbrido B: 8.300, 7.500, 7.700. Híbrido C: 7.700, 7.800, 7.900. ¿Cuál le recomiendo?»\n\nLO QUE TE DEVUELVE LA IA:\nCOMPARACIÓN DE HÍBRIDOS — 3 sitios\n| Híbrido | Promedio | Rango (máx. − mín.) |\n| A | (7.900+8.100+7.600)/3 = 7.866,7 kg/ha | 500 |\n| B | (8.300+7.500+7.700)/3 = 7.833,3 kg/ha | 800 |\n| C | (7.700+7.800+7.900)/3 = 7.800,0 kg/ha | 200 |\nDiferencia entre el mejor y el peor promedio: 66,7 kg/ha, menos del 1 %.\nLectura: con 3 sitios esa diferencia probablemente no es significativa [VERIFICAR: ¿el ensayo informa DMS o CV?]. C es el más estable; B el más variable.\nPara decidir faltan: sanidad y vuelco, ciclo, precio de la bolsa [A COMPLETAR] y si los sitios se parecen a los lotes de Ernesto.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "11. Costo por hectárea y por tonelada de maíz en Bragado (Skill 3.01 · Costos, presupuestos y márgenes)", "tekst": "LO QUE ESCRIBES:\n«Bragado, 300 ha de maíz. Por hectárea: semilla 180 USD, fertilizantes 210, fitosanitarios 70, labores de contratista 120, cosecha 95, arrendamiento 380. Rinde esperado 9,5 t/ha. Dame costo por hectárea y por tonelada.»\n\nLO QUE TE DEVUELVE LA IA:\nCOSTO DE PRODUCCIÓN — 300 ha de maíz\n| Rubro | USD/ha |\n| Semilla | 180 |\n| Fertilizantes | 210 |\n| Fitosanitarios | 70 |\n| Labores | 120 |\n| Cosecha | 95 |\n| Arrendamiento | 380 |\n| Total | 1.055 |\nControl: 180+210+70+120+95+380 = 1.055 USD/ha\nTodo el campo: 1.055 × 300 = 316.500 USD\nCosto por tonelada: 1.055 / 9,5 = 111,05 USD/t\nNo incluido: flete, comercialización, secada, seguro, intereses y estructura [A COMPLETAR]. Rinde 9,5 t/ha es tu estimación [SUPUESTO].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "12. Margen bruto de soja en Venado Tuerto (Skill 3.02 · Costos, presupuestos y márgenes)", "tekst": "LO QUE ESCRIBES:\n«200 ha de soja de primera, rinde esperado 35 qq/ha, precio 290 USD/t. Gastos de comercialización y flete 110 USD/ha. Costos directos 420 USD/ha. ¿Margen bruto?»\n\nLO QUE TE DEVUELVE LA IA:\nMARGEN BRUTO — soja, 200 ha\nRinde: 35 qq/ha = 3,5 t/ha\nIngreso bruto: 3,5 × 290 = 1.015 USD/ha\nIngreso neto: 1.015 − 110 = 905 USD/ha\nMargen bruto: 905 − 420 = 485 USD/ha\n| Concepto | USD/ha | Total (USD) |\n| Ingreso neto | 905 | 181.000 |\n| Costos directos | 420 | 84.000 |\n| Margen bruto | 485 | 97.000 |\nSensibilidad: −3 qq/ha = −0,3 t × 290 = −87 USD/ha → margen 398 USD/ha.\nNo incluye: arrendamiento, estructura ni impuestos [A COMPLETAR]. Precio 290 USD/t es tu supuesto [VERIFICAR: fecha y condición de entrega].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "13. Rinde y precio de indiferencia en trigo (Skill 3.03 · Costos, presupuestos y márgenes)", "tekst": "LO QUE ESCRIBES:\n«Trigo, costo total 520 USD/ha con arrendamiento. Precio neto que me dan en el acopio: 190 USD/t. Rinde esperado 3,2 t/ha. ¿Cuál es el rinde de indiferencia y el precio de indiferencia?»\n\nLO QUE TE DEVUELVE LA IA:\nINDIFERENCIA — trigo\nRinde de indiferencia: 520 / 190 = 2,74 t/ha = 27,4 qq/ha\nPrecio de indiferencia con 3,2 t/ha: 520 / 3,2 = 162,5 USD/t\nMargen con 3,2 t/ha: 3,2 × 190 − 520 = 608 − 520 = 88 USD/ha\n| Indicador | Valor |\n| Costo total | 520 USD/ha (tu dato) |\n| Rinde de indiferencia | 27,4 qq/ha |\n| Precio de indiferencia | 162,5 USD/t |\n| Margen de seguridad en rinde | 3,2 − 2,74 = 0,46 t/ha (14 %) |\nPrecio neto: confirmar fecha y descuentos del acopio [VERIFICAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "14. Comparación de dos presupuestos de insumos en Guanajuato (Skill 3.05 · Costos, presupuestos y márgenes)", "tekst": "LO QUE ESCRIBES:\n«120 ha de maíz en Guanajuato. Proveedor A: herbicidas 38 USD/ha y fertilizante 165 USD/ha, pago a cosecha. Proveedor B: herbicidas 41 y fertilizante 152, pago de contado. ¿Cuál conviene?»\n\nLO QUE TE DEVUELVE LA IA:\nCOMPARACIÓN DE PRESUPUESTOS — 120 ha\n| Proveedor | Herbicidas | Fertilizante | Total USD/ha | Total (USD) |\n| A | 38 | 165 | 203 | 203 × 120 = 24.360 |\n| B | 41 | 152 | 193 | 193 × 120 = 23.160 |\nDiferencia: 24.360 − 23.160 = 1.200 USD a favor de B.\nPero A financia hasta cosecha: el costo de pagar B hoy es lo que le cuesta al productor esa plata durante esos meses [A COMPLETAR: tasa de su crédito o costo de oportunidad y meses].\nSi el costo financiero de 23.160 USD por esos meses supera 1.200 USD, conviene A.\nRevisar además: mismos productos y formulaciones, fletes y fecha de entrega [VERIFICAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "15. Pulverizadora propia o contratista en Alto Paraná (Skill 3.07 · Costos, presupuestos y márgenes)", "tekst": "LO QUE ESCRIBES:\n«¿Conviene mantener la pulverizadora? Costos fijos al año: amortización 18.000 USD, intereses 5.000, seguro y galpón 2.000, reparaciones 4.000. Combustible y operario 2,5 USD/ha. Hacemos 3.000 ha de pasadas al año. El contratista cobra 8 USD/ha.»\n\nLO QUE TE DEVUELVE LA IA:\nPROPIA O CONTRATISTA — 3.000 ha/año\nFijos: 18.000 + 5.000 + 2.000 + 4.000 = 29.000 USD\nPor ha: 29.000 / 3.000 = 9,67 + 2,5 = 12,17 USD/ha\n| Opción | USD/ha | Anual (USD) |\n| Propia | 12,17 | 29.000 + 2,5 × 3.000 = 36.500 |\n| Contratista | 8,00 | 8 × 3.000 = 24.000 |\n| Diferencia | 4,17 | 12.500 |\nHectáreas de equilibrio: 29.000 / (8 − 2,5) = 29.000 / 5,5 ≈ 5.273 ha\n[SUPUESTO: reparaciones tomadas como fijas; en realidad suben con el uso.]\nSin valorar todavía: oportunidad de aplicación y disponibilidad del contratista en momentos críticos [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "16. Propuesta de asesoramiento para un productor nuevo (Skill 4.01 · Clientes y asesoramiento)", "tekst": "LO QUE ESCRIBES:\n«Propuesta para Hnos. Benítez, 1.200 ha de soja y maíz en General Villegas. Soy independiente, no vendo insumos. Recorridas cada 10 días de noviembre a marzo, plan de fertilización, decisiones de fungicida e informe de cierre. Mi honorario es 4 USD/ha por campaña.»\n\nLO QUE TE DEVUELVE LA IA:\nPROPUESTA — Asesoramiento independiente, campaña [A COMPLETAR: año]\nCliente: Hnos. Benítez, 1.200 ha de soja y maíz\nAlcance:\n1. Recorridas cada 10 días de noviembre a marzo, informe escrito después de cada visita.\n2. Plan de fertilización 4C por lote según análisis de suelo.\n3. Decisiones de fungicida e insecticida documentadas por umbral, con receta.\n4. Informe de cierre con rindes y notas por lote.\nIndependencia: no vendo semillas, fertilizantes ni fitosanitarios; cada recomendación sale de sus lotes.\n| Concepto | Valor |\n| Honorario | 4 USD/ha |\n| Superficie | 1.200 ha |\n| Total campaña | 4 × 1.200 = 4.800 USD |\nForma de pago: [A COMPLETAR]. Validez: [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "17. Respuesta a «el técnico de la agronomía viene gratis» (Skill 4.10 · Clientes y asesoramiento)", "tekst": "LO QUE ESCRIBES:\n«El productor Jorge Ferreyra me dice: ¿por qué te voy a pagar 5 USD/ha si el de la agronomía viene gratis? Tiene 900 ha. Escríbeme una respuesta corta y respetuosa por WhatsApp, sin hablar mal de nadie.»\n\nLO QUE TE DEVUELVE LA IA:\nRESPUESTA POR WHATSAPP:\n«Jorge, es una buena pregunta. El técnico de la agronomía hace un buen trabajo, y su visita no se cobra porque va incluida en lo que vende. Mis recomendaciones salen solo de tus lotes: no gano más si aplicas, y te voy a decir cuándo no hace falta. En tus 900 ha, 5 USD/ha son 4.500 USD por campaña. Una aplicación que no era necesaria o un fungicida en el momento justo pueden cubrir eso [SUPUESTO: lo deciden tus números]. ¿Te parece si recorremos un lote juntos este mes, sin costo, y lo comparas?»\nCuenta: 900 × 5 = 4.500 USD.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "18. Informe mensual para el productor (Skill 4.05 · Clientes y asesoramiento)", "tekst": "LO QUE ESCRIBES:\n«Informe de enero para Agropecuaria Don Ernesto. 4 visitas, 9 lotes. Mancha en maíz en 2 lotes, por debajo de lo que uso para decidir, en seguimiento. Defoliadoras en soja con 10 % de defoliación. Una aplicación de fungicida en el Lote 7 el 22 de enero. Lo que viene: monitoreo de chinches y estimación de rinde en febrero.»\n\nLO QUE TE DEVUELVE LA IA:\nINFORME MENSUAL — Agropecuaria Don Ernesto, enero\n| Indicador | Valor |\n| Visitas | 4 |\n| Lotes recorridos | 9 |\n| Aplicaciones | 1 (Lote 7, fungicida, 22/01) |\nHallazgos:\n1. Mancha foliar en maíz — 2 lotes, por debajo de tu nivel de decisión; seguimiento semanal [A COMPLETAR: nombres de lotes].\n2. Defoliadoras en soja — ~10 % de defoliación; comparar con tu umbral para el estadio [VERIFICAR].\n3. Lote 7 — fungicida aplicado; registro completo con receta [A COMPLETAR: producto y dosis según VER ETIQUETA].\nFebrero: monitoreo de chinches y estimación de rinde por lote.\nPendientes del productor: [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "19. Cálculo de tu honorario con tus costos (Skill 4.09 · Clientes y asesoramiento)", "tekst": "LO QUE ESCRIBES:\n«Quiero saber cuánto cobrar. Mis costos fijos al año: 9.600 USD (camioneta, celular, contador, software). Quiero llevarme 30.000 USD limpios. Calculo 1.200 horas facturables. Cada visita me lleva 3 horas con el informe y 25 USD de camioneta. Un cliente de 600 ha me pide 10 visitas y unas 8 horas de oficina.»\n\nLO QUE TE DEVUELVE LA IA:\nCÁLCULO DE HONORARIOS\nValor hora: (9.600 + 30.000) / 1.200 = 39.600 / 1.200 = 33 USD/h\nValor visita: 33 × 3 + 25 = 99 + 25 = 124 USD\nCliente de 600 ha:\n| Concepto | Cálculo | USD |\n| 10 visitas | 10 × 124 | 1.240 |\n| Oficina | 8 × 33 | 264 |\n| Total campaña | 1.240 + 264 | 1.504 |\n| Por hectárea | 1.504 / 600 | 2,51 USD/ha |\nCompáralo con lo que se cobra en tu zona [VERIFICAR]. Si quedas por debajo, no bajes tu ingreso objetivo: revisa horas facturables y costos.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "20. Bienvenida a un productor nuevo en Meta, Colombia (Skill 4.04 · Clientes y asesoramiento)", "tekst": "LO QUE ESCRIBES:\n«Nuevo cliente: arrocera de Lucía Ramírez en Meta, 300 ha de arroz con riego. Firmó ayer. Arma el plan de arranque: qué le pido, qué hacemos el primer mes y cómo nos comunicamos.»\n\nLO QUE TE DEVUELVE LA IA:\nBIENVENIDA — Lucía Ramírez, 300 ha de arroz\nSemana 1:\n| Qué | Quién | Para cuándo |\n| Mapa de lotes y fuentes de agua | Lucía | [A COMPLETAR] |\n| Rindes de las últimas 3 cosechas por lote | Lucía | [A COMPLETAR] |\n| Análisis de suelo previos | Lucía | [A COMPLETAR] |\n| Recorrida completa de reconocimiento | Asesor | [A COMPLETAR] |\nPrimer mes: diagnóstico por lote, plan de muestreo de suelo, revisión del registro de aplicaciones y de los requisitos del ICA [VERIFICAR] y propuesta de calendario de visitas.\nComunicación: un grupo de WhatsApp con Lucía y su encargado; informe después de cada visita; llamada quincenal de 15 minutos.\nPrimer entregable: diagnóstico inicial a los 30 días.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "21. Checklist para actualizar el registro del establecimiento (Skill 5.01 · Crédito, seguros y trámites)", "tekst": "LO QUE ESCRIBES:\n«Martín Ortiz tiene campo en Bragado, 420 ha, agricultura y algo de hacienda. Me pide ayuda para actualizar el RENSPA porque cambió un arrendamiento. Hazme la lista de lo que tiene que juntar.»\n\nLO QUE TE DEVUELVE LA IA:\nCHECKLIST — Actualización de registro, Martín Ortiz\n| Ítem | Estado |\n| Número de RENSPA actual | [A COMPLETAR] |\n| Clave fiscal del titular y acceso al trámite | [A COMPLETAR] |\n| Nuevo contrato de arrendamiento con superficie y vigencia | [A COMPLETAR] |\n| Superficie por actividad: agricultura y ganadería | 420 ha totales [A COMPLETAR: desglose] |\n| Ubicación de los lotes (coordenadas o partida) | [A COMPLETAR] |\n| Existencias de hacienda, si corresponde | [A COMPLETAR] |\n| Plazo para informar el cambio | [VERIFICAR CON SENASA] |\nNota: los requisitos y plazos cambian; confirma la versión vigente del trámite en el organismo antes de presentarlo.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "22. Descripción del proyecto para crédito de riego en Jalisco (Skill 5.04 · Crédito, seguros y trámites)", "tekst": "LO QUE ESCRIBES:\n«Rancho Los Álamos, Jalisco, quiere financiar riego por goteo para 25 ha de aguacate. Cotización del proveedor: 1.450.000 pesos. Pone 30 % de aporte propio. Lo va a pedir por un intermediario de FIRA. Ármame la descripción del proyecto.»\n\nLO QUE TE DEVUELVE LA IA:\nDESCRIPCIÓN DEL PROYECTO — Riego por goteo, Rancho Los Álamos\nObjetivo: instalar riego por goteo en 25 ha de aguacate para asegurar el agua en los meses secos y mejorar la uniformidad de la producción.\n| Concepto | Monto (pesos) |\n| Inversión (cotización) | 1.450.000 |\n| Aporte propio 30 % | 1.450.000 × 0,30 = 435.000 |\n| Monto a financiar | 1.450.000 − 435.000 = 1.015.000 |\nPor hectárea: 1.450.000 / 25 = 58.000 pesos/ha\nImpacto esperado: [A COMPLETAR: producción actual y esperada, datos del productor] [SUPUESTO donde no haya historial].\nCondiciones de la línea (tasa, plazo, gracia, porcentaje financiable): [VERIFICAR CON LA ENTIDAD].\nAnexos: cotización vigente, permiso o concesión de agua [VERIFICAR], plano del sistema.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "23. Documentación de siniestro para el seguro agrícola en Soriano (Skill 5.07 · Crédito, seguros y trámites)", "tekst": "LO QUE ESCRIBES:\n«Hnos. Benítez, Soriano, soja en R2, granizo sobre 140 ha de un campo de 320. Hojas destrozadas, algunos tallos quebrados. Ya hicieron la denuncia esta mañana. Ayúdame a ordenar todo para el perito.»\n\nLO QUE TE DEVUELVE LA IA:\nDOCUMENTACIÓN DE SINIESTRO — Hnos. Benítez, granizo en soja (R2)\n| Ítem | Estado |\n| Denuncia a la aseguradora | Hecha hoy [A COMPLETAR: hora y número de siniestro] |\n| Lotes y superficie | ~140 de 320 ha [A COMPLETAR: lotes afectados] |\n| Estadio al momento del evento | R2 [VERIFICAR en 10 plantas por lote] |\n| Fotos | Con ubicación, por lote: hojas, tallos quebrados, testigo sin daño |\n| Clima | Fecha y hora de la tormenta, registros de la zona [A COMPLETAR] |\n| Franjas testigo sin tocar | Dejar sin labores hasta la visita del perito [VERIFICAR con la póliza] |\n| Póliza y condiciones | [A COMPLETAR: número, cobertura, franquicia] |\nProporción afectada: 140 / 320 = 43,8 % del campo.\nPlazos de denuncia y de inspección: [VERIFICAR con la aseguradora].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "24. Preparación para una inspección de SENAVE en Paraguay (Skill 5.09 · Crédito, seguros y trámites)", "tekst": "LO QUE ESCRIBES:\n«Llegó una nota: SENAVE va a revisar registros de aplicaciones y el depósito de agroquímicos de la estancia de Jorge Ferreyra en Itapúa el mes que viene. Jorge está nervioso. Ármale una lista para prepararse.»\n\nLO QUE TE DEVUELVE LA IA:\nPREPARACIÓN PARA INSPECCIÓN — Jorge Ferreyra\n| Ítem | ¿Listo? |\n| Registros de aplicación del período que pide la norma | [VERIFICAR: cuántos años exige el organismo] |\n| Cada registro: fecha, lote, cultivo, producto, registro, dosis, superficie, aplicador | [A COMPLETAR: huecos] |\n| Recetas agronómicas archivadas | [A COMPLETAR] |\n| Habilitación del aplicador y del equipo | [VERIFICAR vencimientos] |\n| Depósito: ventilado, cerrado, señalizado, separado de la vivienda | [A COMPLETAR] |\n| Etiquetas y hojas de seguridad de cada producto | [A COMPLETAR] |\n| Envases vacíos con triple lavado y su destino | [A COMPLETAR] |\n| Equipo de protección personal disponible | [A COMPLETAR] |\nAntes de la visita: completar huecos con la información real, nunca reconstruir registros con datos inventados.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "25. Calendario de vencimientos para un exportador de uva en Ica (Skill 5.10 · Crédito, seguros y trámites)", "tekst": "LO QUE ESCRIBES:\n«Productor de uva de mesa en Ica, 80 ha, exporta. Quiere un calendario con todo lo que vence en el año: certificaciones, registros ante SENASA, auditorías, renovaciones. No me acuerdo de todas las fechas.»\n\nLO QUE TE DEVUELVE LA IA:\nCALENDARIO DE VENCIMIENTOS — uva de mesa, 80 ha\n| Obligación | Organismo o entidad | Fecha | Aviso |\n| Registro del lugar de producción | SENASA | [VERIFICAR CON SENASA] | 60 días antes |\n| Certificación de BPA para exportación | Certificadora | [A COMPLETAR: fecha de la última auditoría] | 90 días antes |\n| Auditoría interna previa | Asesor | [A COMPLETAR] | 30 días antes |\n| Análisis de residuos antes de cosecha | Laboratorio | [A COMPLETAR] | Según carencias [VER ETIQUETA] |\n| Habilitación de aplicadores | [VERIFICAR] | [A COMPLETAR] | 30 días antes |\n| Requisitos del mercado de destino | Exportador | [VERIFICAR cada temporada] | Antes de la poda |\nNinguna fecha se completó de memoria: cárgalas desde los certificados y las constancias del productor.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "26. Registro de aplicación desde una nota de voz (Skill 6.01 · Protección de cultivos y registros de aplicación)", "tekst": "LO QUE ESCRIBES:\nDictado: «Hoy aplicamos en el Lote 7 de Río Cuarto, barbecho para maíz, 80 hectáreas, herbicida que pusimos a 1,5 litros por hectárea con 80 litros de caldo, viento del sur 8 a 10 km/h, empezamos 7:40 y terminamos 10:15. Aplicador Martín, la habilitación la tiene él.»\n\nLO QUE TE DEVUELVE LA IA:\nREGISTRO DE APLICACIÓN\n| Campo | Dato |\n| Fecha | [A COMPLETAR: fecha de hoy] |\n| Lote | Lote 7, Río Cuarto |\n| Cultivo o situación | Barbecho para maíz |\n| Superficie | 80 ha |\n| Producto (nombre comercial) | [A COMPLETAR: exacto según etiqueta] |\n| Número de registro | [A COMPLETAR] |\n| Dosis | 1,5 L/ha (tu dato) [VER ETIQUETA] |\n| Producto total | 80 × 1,5 = 120 L |\n| Caudal | 80 L/ha → 80 × 80 = 6.400 L de caldo |\n| Viento | Sur, 8-10 km/h |\n| Horario | 7:40 a 10:15 |\n| Aplicador y habilitación | Martín [A COMPLETAR: número] |\n| Receta agronómica | [A COMPLETAR: número] |\nCon una pulverizadora de 3.000 L: 6.400 / 3.000 = 2,13 → 3 cargas.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "27. Decisión por umbral: chinches en soja en Itapúa (Skill 6.02 · Protección de cultivos y registros de aplicación)", "tekst": "LO QUE ESCRIBES:\n«Soja en R5, Itapúa. Paño vertical en 10 sitios, chinches por metro: 1, 2, 0, 3, 1, 2, 1, 0, 2, 1. El umbral que uso según mi referencia local para este estadio es 1 por metro. La semana pasada el promedio era 0,6. ¿Aplico?»\n\nLO QUE TE DEVUELVE LA IA:\nDECISIÓN POR UMBRAL — soja R5\nPromedio: (1+2+0+3+1+2+1+0+2+1)/10 = 13/10 = 1,3 chinches/m\nSitios con 2 o más: 4 de 10\nTendencia: 0,6 → 1,3 = más del doble en una semana\n| Control | Resultado |\n| Promedio frente a umbral (1/m) | 1,3 — supera |\n| Población en aumento | Sí |\n| Enemigos naturales | [A COMPLETAR] |\nDecisión: supera tu umbral y sube; justifica control. Producto registrado para soja y chinches, dosis, carencia y reingreso [VER ETIQUETA], con receta agronómica. Revisar bordes y lotes vecinos.\nRecontar 5 a 7 días después [SUPUESTO] para evaluar control.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "28. Chequeo de etiqueta antes de recomendar un fungicida en café (Skill 6.04 · Protección de cultivos y registros de aplicación)", "tekst": "LO QUE ESCRIBES:\n«Finca en Tolima, café, quiero recomendar un fungicida para roya. Tengo el nombre del producto y la etiqueta en PDF. ¿Qué tengo que revisar de la etiqueta antes de escribir la receta?»\n\nLO QUE TE DEVUELVE LA IA:\nCHEQUEO DE ETIQUETA — fungicida, café, roya\n| Qué revisar | Resultado |\n| Café y roya figuran en la etiqueta | [VER ETIQUETA] |\n| Registro vigente ante el ICA | [VERIFICAR] |\n| Dosis por ha o por planta | [VER ETIQUETA] |\n| Momento y número máximo de aplicaciones | [VER ETIQUETA] |\n| Tiempo de carencia | [VER ETIQUETA] |\n| Tiempo de reingreso | [VER ETIQUETA] |\n| Volumen de caldo y equipo | [VER ETIQUETA] |\n| Banda toxicológica y equipo de protección | [VER ETIQUETA] |\n| Compatibilidad en mezcla | [VER ETIQUETA] |\n| Restricciones del comprador o certificación | [VERIFICAR] |\nSi algún punto no figura en la etiqueta, no se recomienda ese uso.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "29. Orden de trabajo para dron pulverizador en arroz (Skill 6.06 · Protección de cultivos y registros de aplicación)", "tekst": "LO QUE ESCRIBES:\n«Arrocera en Tolima, 60 ha, contraté un servicio de dron para un fungicida. Necesito la orden de trabajo para el operador con todo lo que tiene que respetar. El producto ya está definido y la etiqueta permite aplicación aérea.»\n\nLO QUE TE DEVUELVE LA IA:\nORDEN DE TRABAJO — aplicación con dron\n| Campo | Dato |\n| Productor y lotes | [A COMPLETAR], 60 ha |\n| Cultivo y estadio | Arroz [A COMPLETAR: estadio] |\n| Producto | [A COMPLETAR: nombre y registro] |\n| Dosis | [VER ETIQUETA] |\n| Volumen de caldo por ha | [VER ETIQUETA: mínimo para aplicación aérea] |\n| Producto total | 60 × dosis = [A COMPLETAR] |\n| Condiciones | Viento, temperatura y humedad dentro de lo que indica la etiqueta [VER ETIQUETA] |\n| Zonas de resguardo | Casas, cursos de agua, apiarios [A COMPLETAR: mapa] |\n| Habilitación del operador y del equipo | [VERIFICAR con la norma local] |\n| Receta agronómica | [A COMPLETAR: número] |\n| Registro posterior | Fecha, hora, superficie real, condiciones y firma |\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "30. Estrategia contra malezas resistentes en Pergamino (Skill 6.07 · Protección de cultivos y registros de aplicación)", "tekst": "LO QUE ESCRIBES:\n«Lote El Bajo, Pergamino, 120 ha, yuyo colorado que no se controla con lo que veníamos usando. Rotación soja-maíz. Quiero una estrategia de 2 campañas para el productor, sin poner dosis.»\n\nLO QUE TE DEVUELVE LA IA:\nESTRATEGIA ANTIRRESISTENCIA — El Bajo (120 ha)\nDiagnóstico: falla de control en yuyo colorado [VERIFICAR: confirmar resistencia y descartar errores de aplicación].\n| Momento | Campaña 1 (soja) | Campaña 2 (maíz) |\n| Barbecho | Residual con modo de acción distinto al que falló | Residual con otro modo de acción |\n| Preemergencia | Residual registrado para soja | Residual registrado para maíz |\n| Postemergencia | Modo de acción no usado en barbecho | Rotar respecto de la campaña 1 |\n| Cultural | Cultivo de cobertura invernal, menor distancia entre surcos | Cobertura y siembra temprana |\nReglas: nunca dos aplicaciones seguidas con el mismo modo de acción; dosis plenas de etiqueta [VER ETIQUETA]; controlar escapes antes de semillar; limpiar la cosechadora al salir del lote.\nProductos: [A COMPLETAR según disponibilidad y registro].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}]}, {"id": "B6", "ikona": "🤖", "tytul": "Agentes del agro para ChatGPT y Gemini", "podtytul": "Carga los agentes y las Skills como Proyecto en ChatGPT, Gem en Gemini y Proyecto en Claude, e instala la app en el celular y la computadora.", "opis": "Paso a paso para dejar tu oficina agronómica funcionando en 10 minutos, también con cuentas gratis. Cómo cargar las instrucciones de sistema y los agentes para no pegarlos en cada chat, cómo subir tus planillas y modelos como conocimiento, y cómo poner el ícono de AgronomIA PRO en la pantalla de inicio del celular y en la computadora. Los nombres de los botones cambian cada tanto: si algo se ve distinto, busca la opción con un nombre parecido.", "sekcje": [{"tytul": "ChatGPT: cuenta gratis, Proyecto y GPT propio", "tekst": "1. Entra en chatgpt.com o descarga la app de ChatGPT para iPhone o Android y regístrate gratis con tu correo, Google, Microsoft o Apple.\n2. Cuenta gratis: abre un chat nuevo, pega como primer mensaje las instrucciones de sistema (última sección de esta guía) y después el PROMPT MAESTRO de la Skill que necesitas.\n3. Para no pegarlas cada vez: Configuración → Personalización → Instrucciones personalizadas, y pégalas ahí. Se aplican a todos tus chats.\n4. Proyecto: crea un Proyecto llamado «Oficina agro», abre las instrucciones del proyecto y pega las instrucciones de sistema. Sube como archivos tu tabla de honorarios, los modelos del bono 2 y una etiqueta o un análisis de suelo de ejemplo.\n5. Un agente por GPT (planes pagos): Explorar GPT → Crear → pega las instrucciones del agente (por ejemplo, el de nutrición o el de papeles) en «Instrucciones». Ponle nombre y foto: queda como un colega fijo.\n6. En el campo, usa el botón del micrófono para dictar la recorrida y pídele que la convierta en informe con la Skill correspondiente."}, {"tytul": "Gemini: Gem del agro", "tekst": "1. Entra en gemini.google.com o abre la app de Gemini en el celular con tu cuenta de Google; una cuenta de Gmail gratis alcanza.\n2. Cuenta gratis: chat nuevo, pega las instrucciones de sistema y después el PROMPT MAESTRO de la Skill.\n3. Gems: abre Gems → Nuevo Gem, ponle nombre (por ejemplo «AgronomIA PRO») y pega las instrucciones de sistema en el campo de instrucciones. Puedes crear un Gem por agente: «Agente de nutrición», «Agente de costos», «Agente de crédito».\n4. Adjunta a cada Gem los archivos de referencia: tus planillas del bono 1 y los modelos del bono 2.\n5. Gemini se lleva bien con Google Sheets y Google Docs: pídele la planilla o el informe y ábrelo directo en tu Drive.\nTip: si tu cuenta no tiene Gems, pega las instrucciones al principio de cada chat."}, {"tytul": "Claude: Proyecto con conocimiento", "tekst": "1. Entra en claude.ai o descarga la app para iPhone o Android y regístrate gratis con tu correo o tu cuenta de Google.\n2. Cuenta gratis: chat nuevo, pega las instrucciones de sistema y después el PROMPT MAESTRO de la Skill.\n3. Proyectos: crea un Proyecto «Oficina agro», abre «Instrucciones del proyecto» y pega las instrucciones de sistema. Todos los chats del proyecto las siguen solos.\n4. Conocimiento del proyecto: sube los modelos de informe, tu tabla de honorarios, una etiqueta y un análisis de suelo de ejemplo. La IA los usa como referencia de formato.\n5. Puedes pegar documentos largos (etiquetas, análisis, requisitos de una línea de crédito) o subir PDF y fotos y pedirle que trabaje con ellos.\nTip: una Skill = un chat nuevo dentro del proyecto."}, {"tytul": "Cómo cargar las Skills y los agentes", "tekst": "Opción rápida (cualquier cuenta): copia el PROMPT MAESTRO de la Skill desde la app y pégalo en un chat nuevo. Si lo pegas sin datos, la IA te hace las preguntas.\n\nOpción oficina armada (Proyecto o Gem):\n1. Instrucciones de sistema → en el campo de instrucciones del Proyecto o Gem.\n2. Las Skills que más usas (por ejemplo, informe de recorrida, plan de nitrógeno, margen bruto) → cópialas en un documento «Mis Skills» y súbelo como archivo de conocimiento.\n3. Escribe en el chat: «Usa la Skill de informe de recorrida con estos datos: …». La IA la busca en el archivo.\n\nAgentes: un agente es un especialista para trabajos largos. Crea un Proyecto o Gem por agente, pega sus instrucciones, responde sus 5 preguntas iniciales y trabaja con él como con un colega de oficina.\nRegla: un tema o un productor por chat. Los chats largos con muchos lotes y temas pierden el hilo."}, {"tytul": "Instalar la app AgronomIA PRO en el celular y la computadora", "tekst": "AgronomIA PRO es una app web (PWA): no se descarga de ninguna tienda de apps. Usa el enlace que te llegó en el correo de acceso.\n\niPhone (Safari):\n1. Abre el enlace de la app en Safari.\n2. Toca el ícono de compartir (el cuadrado con la flecha).\n3. Elige «Agregar a inicio» → «Agregar».\n\nAndroid (Chrome):\n1. Abre el enlace en Chrome.\n2. Toca el menú (⋮, tres puntos arriba a la derecha).\n3. Elige «Agregar a la pantalla principal» o «Instalar app» → confirma.\n\nComputadora (Chrome o Edge, Windows o Mac):\n1. Abre el enlace en el navegador.\n2. Haz clic en el ícono de instalar de la barra de direcciones (una pantalla con una flecha o un «+») o abre el menú → «Instalar AgronomIA PRO».\n\nMac (Safari):\n1. Abre el enlace en Safari.\n2. Archivo → Agregar al Dock.\n\nUna vez instalada, abre desde el ícono como cualquier app. Funciona también con poca señal una vez cargada."}, {"tytul": "Cómo usar una Skill de principio a fin", "tekst": "1. Elige el departamento (por ejemplo «6 Protección de cultivos y registros de aplicación») y la Skill que corresponde a la tarea.\n2. Lee «Cuándo usarla» y junta los datos del brief: productor, lote, cultivo, estadio, observaciones, análisis de suelo, precios.\n3. Copia el PROMPT MAESTRO, pégalo en ChatGPT, Claude o Gemini y reemplaza los campos entre corchetes con tus datos.\n4. Responde las preguntas de la IA. ¿No sabes un dato? Escribe «no sé» y la IA lo marca [A COMPLETAR].\n5. Ajusta el resultado con los comandos cortos de cada Skill: «Acórtalo a una página», «Agrega la tabla de aplicación», «Pásalo a lenguaje para el productor».\n6. Recorre la lista de control y revisa cada marcador [VERIFICAR] y [VER ETIQUETA], sobre todo dosis, carencias y plazos.\n7. Firma solo lo que revisaste. Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}, {"tytul": "Dictado en el campo y cuidado de los datos", "tekst": "Dictado: en la camioneta, toca el micrófono de la app de ChatGPT, Claude o Ge
