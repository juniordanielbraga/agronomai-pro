<script>
const D={"dzialy": [{"dzial_nr": 1, "dzial": "Recorridas y visitas a campo", "opis": "La recorrida termina en la tranquera, pero el trabajo sigue en el escritorio: informes de monitoreo, fotos, informes de daño y recomendaciones para el productor. Dicta en la camioneta o pega tus notas y recibe el documento terminado, con los cálculos paso a paso y cada hueco marcado antes de que lo firmes.", "skills": [{"id": "1.01", "nazwa": "Plan de recorrida antes de la visita", "tag": "ANTES DE LA VISITA", "co_robi": "Arma el plan de la recorrida antes de salir: orden de los lotes, qué mirar en cada uno, método de muestreo, preguntas para el productor y lista de equipo. Llegas al lote sabiendo a qué vas.", "kiedy": "La noche anterior o a primera hora, cuando tienes varios productores en la agenda y poco tiempo para cada lote.", "brief": [{"pole": "Motivo de la visita", "opis": "Por qué vas, por ejemplo “monitoreo de rutina de soja y consulta por manchas en el maíz tardío”."}, {"pole": "Productor y lotes", "opis": "Productor, campo, lotes y hectáreas, por ejemplo “Hnos. Benítez, Venado Tuerto — Lote 7 (85 ha) y La Loma (60 ha)”."}, {"pole": "Cultivos y estadios", "opis": "Cultivo, híbrido o variedad y estadio aproximado, por ejemplo “soja de primera en R2, maíz tardío en V8”."}, {"pole": "Historial y señales", "opis": "Lo que pasó antes y lo que te comentaron, por ejemplo “el año pasado hubo chinches en La Loma; el encargado vio hojas comidas”."}, {"pole": "Clima y condiciones", "opis": "Lluvias y pronóstico, por ejemplo “35 mm el martes, calor húmedo, pronóstico de tormenta el jueves”."}, {"pole": "Tiempo y equipo", "opis": "Tiempo disponible y lo que llevas, por ejemplo “3 horas, paño vertical, red de arrastre, pala, lupa y celular con GPS”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que planifica recorridas a campo con criterio de manejo integrado de plagas. Arma mi plan de visita para que no se me escape nada importante.\n\nDATOS:\nMotivo de la visita: [MOTIVO DE LA VISITA]\nProductor y lotes: [PRODUCTOR Y LOTES]\nCultivos y estadios: [CULTIVOS Y ESTADIOS]\nHistorial y señales: [HISTORIAL Y SEÑALES]\nClima y condiciones: [CLIMA Y CONDICIONES]\nTiempo y equipo: [TIEMPO Y EQUIPO]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Piensa en manejo integrado: primero observar e identificar, después decidir. Indica qué conviene revisar en cada estadio (V/R en maíz y soja, Zadoks en trigo y cebada, BBCH en otros cultivos), sin citar umbrales de daño económico con números; si hace falta uno, pídeme la fuente (INTA, INIFAP, INIA, la etiqueta).\n4. Escribe las preguntas para el productor en lenguaje simple, como se las harías en la tranquera, agrupadas por tema.\n5. Ajusta el plan al tiempo que tengo. Si no alcanza para todo, marca qué es prioridad y qué puede esperar.\n6. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Plan de visita paso a paso: orden de los lotes y tiempo estimado para cada uno.\nB) Qué revisar en cada lote: observaciones, método (recorrido en W o zigzag, conteo de plantas, paño vertical, red de arrastre, trampas) y qué registrar.\nC) Preguntas para el productor agrupadas: aplicaciones y fertilización, clima y condiciones del lote, decisiones pendientes.\nD) Lista de equipo y materiales.\nE) Datos que faltan, con sus marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Hazme una versión corta para leer en el celular dentro de la camioneta.", "Agrega una planilla vacía para anotar conteos lote por lote.", "Ordena los lotes para minimizar kilómetros entre uno y otro.", "Agrega qué fotos debo sacar en cada lote para el informe.", "Prepara un mensaje de WhatsApp para avisarle al productor a qué hora llego.", "Marca qué muestras conviene llevar al laboratorio y cómo tomarlas.", "Arma un plan B por si llueve y no puedo entrar a algún lote.", "Haz una lista de las decisiones que el productor tiene que tomar esta semana.", "Separa lo que reviso yo y lo que puede revisar el encargado del campo.", "Convierte el plan en una lista de verificación para tachar a campo."], "checklista": ["El orden de los lotes es lógico para el tiempo que tienes.", "Cada lote tiene un método de muestreo claro y qué registrar.", "No aparece ningún umbral con número que no venga de tu fuente.", "Las preguntas para el productor están en lenguaje simple.", "El equipo de la lista es el que realmente llevas.", "Lo marcado [A COMPLETAR] lo puedes conseguir antes de salir."], "uwaga": "Este plan no reemplaza las recomendaciones de tu INTA, INIFAP, INIA o centro de investigación local ni la etiqueta de cada producto. Los umbrales y criterios de decisión los pones tú, con su fuente.", "przyklad": {"wejscie": "Mañana voy a lo de los Hermanos Benítez, cerca de Venado Tuerto. Tengo unas tres horas. Lote 7 son 85 hectáreas de soja de primera, debería andar en R2. La Loma son 60 hectáreas de maíz tardío, más o menos V8. El encargado me dijo que vio hojas comidas en la soja y unas manchas en el maíz que no sabe qué son. El año pasado en La Loma tuvimos chinches tarde. Llovieron 35 milímetros el martes y está pesado, húmedo, pronostican tormenta para el jueves. Llevo paño vertical, red, pala, lupa y el celular. Ármame el plan para no perder tiempo, porque a la tarde tengo otro productor.", "wynik": "A) PLAN DE VISITA (3 h)\n| Orden | Lote | Cultivo y estadio | Tiempo |\n| 1 | Lote 7 (85 ha) | soja de primera, R2 [VERIFICAR] | 1 h 30 |\n| 2 | La Loma (60 ha) | maíz tardío, V8 [VERIFICAR] | 1 h |\n| 3 | Charla con el productor | — | 30 min |\n\nB) QUÉ REVISAR\nLote 7: recorrido en W con 5–10 estaciones [SUPUESTO]. Defoliación por estación (porcentaje estimado), paño vertical para orugas y chinches, estado de las hojas superiores. Registrar conteos y fotos con punto GPS. Comparación con umbral: [A COMPLETAR: umbral y fuente].\nLa Loma: revisar las manchas (en qué hojas, forma, color, si hay esporulación), recorrido en zigzag, sacar fotos de cerca y de lejos. Si no hay diagnóstico claro, tomar muestra para laboratorio [VERIFICAR].\n\nC) PREGUNTAS PARA EL PRODUCTOR\n- Aplicaciones: ¿qué se aplicó en cada lote y cuándo? [A COMPLETAR]\n- Clima: ¿cómo quedaron los bajos después de la lluvia del martes?\n- Decisiones: ¿hay presupuesto y equipo disponible si hace falta aplicar antes del jueves?\n\nD) EQUIPO: paño vertical, red de arrastre, pala, lupa, celular con GPS; agregar bolsas y etiquetas para muestras.\n\nE) FALTA: historial de aplicaciones [A COMPLETAR]; híbrido del maíz [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "1.02", "nazwa": "Informe de recorrida", "tag": "INFORME DE RECORRIDA", "co_robi": "Convierte tus notas de la recorrida en un informe ordenado: estado del cultivo, enfermedades, insectos, malezas, nutrición y conclusiones. Separa los hechos de la interpretación y deja claro lo que todavía no sabes.", "kiedy": "Apenas terminas de recorrer, cuando tienes las notas en el celular y el productor quiere saber qué pasa antes de que termine el día.", "brief": [{"pole": "Productor y lote", "opis": "Productor, lote y hectáreas, por ejemplo “Agropecuaria Don Ernesto, Pergamino — Lote 4, unas 120 ha”."}, {"pole": "Cultivo y estadio", "opis": "Cultivo, variedad, fecha de siembra y estadio, por ejemplo “soja, sembrada el 2 de noviembre, R3”."}, {"pole": "Fecha y condiciones", "opis": "Fecha, hora y clima de la recorrida, por ejemplo “14 de enero, media mañana, 29 °C, húmedo, con rocío”."}, {"pole": "Observaciones a campo", "opis": "Lo que viste, por ejemplo “mancha ojo de rana en hojas superiores de la mitad oeste, algo de defoliación por orugas, escapes de yuyo colorado en las cabeceras”."}, {"pole": "Aplicaciones previas", "opis": "Lo aplicado en la campaña según los registros, por ejemplo “preemergente con residual en octubre y una aplicación de posemergencia el 10 de diciembre”."}, {"pole": "Destinatario del informe", "opis": "Quién lo lee y cómo, por ejemplo “el productor por mail, con copia a la carpeta del lote”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que escribe informes de recorrida que los productores realmente leen. Convierte mis notas de campo en un informe claro y profesional.\n\nDATOS:\nProductor y lote: [PRODUCTOR Y LOTE]\nCultivo y estadio: [CULTIVO Y ESTADIO]\nFecha y condiciones: [FECHA Y CONDICIONES]\nObservaciones a campo: [OBSERVACIONES A CAMPO]\nAplicaciones previas: [APLICACIONES PREVIAS]\nDestinatario del informe: [DESTINATARIO DEL INFORME]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Separa los hechos (lo que vi y conté) de la interpretación (lo que probablemente significa). Nunca conviertas una sospecha en diagnóstico.\n4. Ordena por categoría: población y estado del cultivo, enfermedades, insectos, malezas, nutrición y otros.\n5. No compares nada con un umbral de daño económico salvo que yo te dé el umbral y su fuente (INTA, INIFAP, INIA, etiqueta). Si no, escribe [A COMPLETAR: umbral y fuente].\n6. Nunca nombres un producto ni una dosis por tu cuenta. Si puede hacer falta actuar, escribe la decisión pendiente y marca producto y dosis [VER ETIQUETA].\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Encabezado: productor, lote, hectáreas, cultivo, estadio, fecha y quién recorrió.\nB) Tabla de observaciones: categoría | qué se vio | dónde en el lote | severidad o conteo.\nC) Interpretación y causas probables, cada una marcada como confirmada o [VERIFICAR].\nD) Próximos pasos y cuándo volver a recorrer.\nE) Preguntas abiertas y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Acorta el informe a media página para que el productor lo lea en el celular.", "Agrega una columna con el punto GPS o el número de estaca de cada observación.", "Reescribe la interpretación en lenguaje simple, sin tecnicismos.", "Haz una versión para el encargado del campo solo con decisiones y plazos.", "Indica qué observaciones necesitan muestra de laboratorio para confirmarse.", "Agrega un calendario de recorridas para las próximas dos semanas.", "Saca todos los [VERIFICAR] a una lista para mi próxima visita.", "Agrega una sección que compare esta visita con mi informe anterior de este lote.", "Redacta un WhatsApp corto al productor con los tres hallazgos clave.", "Dale formato para pegarlo en las notas de mi app de monitoreo."], "checklista": ["Productor, lote, cultivo, estadio y fecha son correctos.", "Los hechos y la interpretación están claramente separados.", "Toda comparación con un umbral cita tu propia fuente, no la de la IA.", "Ningún producto o dosis aparece sin [VER ETIQUETA] o sin la etiqueta en la mano.", "Los conteos y porcentajes coinciden con tus notas de campo.", "Cada [VERIFICAR] tiene un plan para confirmarlo.", "El informe va firmado con tu nombre y matrícula."], "uwaga": "Este informe no reemplaza la etiqueta del fitosanitario ni las recomendaciones de tu centro de investigación local. Productos y dosis salen solo de la etiqueta vigente (la etiqueta manda), con receta agronómica donde sea obligatoria, y cada aplicación va al registro de aplicaciones.", "przyklad": {"wejscie": "Agropecuaria Don Ernesto, Lote 4, Pergamino, unas 120 hectáreas de soja. Sembrada el 2 de noviembre, ya está en R3. Recorrí hoy, 14 de enero, como a las diez, 29 grados, muy húmedo, todavía con rocío. En la mitad oeste hay mancha ojo de rana en las hojas de arriba, diría que una de cada cuatro plantas que miré tenía algunas lesiones. Algo de defoliación por orugas, nada grave, calculo menos del diez por ciento. Escapes de yuyo colorado en las cabeceras del este, algunos hasta la rodilla. Tuvieron un preemergente con residual en octubre y una posemergencia el 10 de diciembre. Mándaselo a Don Ernesto por mail y guardo copia en la carpeta.", "wynik": "INFORME DE RECORRIDA\nProductor: Agropecuaria Don Ernesto | Lote 4, Pergamino | ~120 ha\nCultivo: soja, sembrada el 2/11 | Estadio: R3 | Fecha: 14/1, ~10:00, 29 °C, húmedo | Recorrió: [A COMPLETAR]\n\nB) OBSERVACIONES\n| Categoría | Qué se vio | Dónde | Severidad |\n| Enfermedad | mancha ojo de rana, hojas superiores | mitad oeste | ~25 % de plantas revisadas (estimación) |\n| Insectos | defoliación por orugas | dispersa | <10 % (estimación) |\n| Malezas | escapes de yuyo colorado, hasta la rodilla | cabeceras este | localizado |\n| Población | [A COMPLETAR] | — | — |\n\nC) INTERPRETACIÓN\n- Mancha ojo de rana en el estrato superior en R3 con clima húmedo: vale seguirla de cerca; la respuesta depende del comportamiento de la variedad [A COMPLETAR] y del clima. Si se justifica un fungicida [VERIFICAR] contra la recomendación de tu INTA o asesor regional.\n- La defoliación se compara con un umbral solo cuando lo cargues: [A COMPLETAR: umbral y fuente].\n- Escapes de yuyo colorado después de pre y post: posible resistencia o falla de momento [VERIFICAR]; anotar para el plan de la próxima campaña.\n\nD) PRÓXIMOS PASOS\n- Decisión: fungicida sí o no en la mitad oeste; producto, dosis y tiempo de carencia [VER ETIQUETA].\n- Volver a recorrer en unos 7 días [SUPUESTO], mirando avance de la mancha y defoliación.\n- Marcar los manchones de yuyo colorado para el manejo del banco de semillas.\n\nE) FALTA: variedad y su comportamiento sanitario [A COMPLETAR]; producto del post según registros [A COMPLETAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "1.03", "nazwa": "De nota de voz a informe", "tag": "NOTA DE VOZ", "co_robi": "Toma la transcripción del audio que grabaste en la camioneta y la convierte en el documento que necesitas: informe, nota para la carpeta del lote o mensaje al productor. Corrige lo que el dictado entendió mal y te muestra cada corrección.", "kiedy": "Cuando grabaste todo de corrido entre lote y lote y no tienes tiempo de pasarlo en limpio a la noche.", "brief": [{"pole": "Transcripción del audio", "opis": "Pega el texto tal como salió del dictado, por ejemplo “bueno estamos en el lote del molino el maíz está en ve seis hay cogollero en algunas plantas…”."}, {"pole": "Productor y lote", "opis": "Productor y lote, por ejemplo “Martín Ortiz, Potrero del Molino, General Villegas, 70 ha”."}, {"pole": "Fecha de la visita", "opis": "Fecha y hora, por ejemplo “3 de diciembre, 16 h”."}, {"pole": "Tipo de documento", "opis": "Qué quieres obtener, por ejemplo “informe de recorrida completo para la carpeta del lote”."}, {"pole": "Destinatario", "opis": "Quién lo va a leer, por ejemplo “el productor, que lo lee en el celular”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que pasa en limpio notas de voz de recorridas. Convierte mi audio transcripto en un documento profesional sin agregar nada que yo no haya dicho.\n\nDATOS:\nTranscripción del audio: [TRANSCRIPCIÓN DEL AUDIO]\nProductor y lote: [PRODUCTOR Y LOTE]\nFecha de la visita: [FECHA DE LA VISITA]\nTipo de documento: [TIPO DE DOCUMENTO]\nDestinatario: [DESTINATARIO]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Corrige las palabras que el dictado claramente entendió mal (términos de cultivos, estadios como V6 o R3, escala Zadoks, nombres de malezas y plagas). Haz una lista de cada corrección para que la revise.\n4. Si una palabra o un número no se entiende con seguridad, no adivines: márcalo [VERIFICAR] y pregúntame.\n5. Conserva solo lo que dije. No agregues observaciones, causas ni recomendaciones que no hice; si algo parece faltar, déjalo como pregunta.\n6. Adapta el tono y el largo al destinatario: un mensaje al productor es corto y simple; una nota para la carpeta del lote es completa y fáctica.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) El documento terminado en el formato pedido.\nB) Correcciones del dictado: palabra original → palabra corregida.\nC) Partes dudosas y preguntas para mí, marcadas [VERIFICAR] o [A COMPLETAR].\nD) Opcional: una versión de 2–3 oraciones para un WhatsApp rápido al productor.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Convierte el mismo audio en un informe de recorrida con tabla de observaciones.", "Haz solo el mensaje de WhatsApp para el productor, en cinco líneas.", "Separa lo que es observación de lo que es tarea pendiente.", "Arma la lista de tareas que salen del audio, con responsable y fecha.", "Saca todos los números del audio a una tabla para que los revise.", "Reescríbelo en un tono más formal para la empresa o la cooperativa.", "Agrega al final las preguntas que tengo que hacerle al productor.", "Haz una versión para el encargado del campo, sin términos técnicos.", "Marca qué partes del audio conviene volver a escuchar.", "Dale formato de entrada para la ficha histórica del lote."], "checklista": ["Revisaste cada corrección del dictado.", "No aparece nada que no hayas dicho.", "Los números (plantas, porcentajes, hectáreas) coinciden con el audio.", "Los estadios y los nombres de plagas y malezas están bien escritos.", "Los [VERIFICAR] quedaron resueltos antes de enviar.", "El largo y el tono sirven para quien lo va a leer."], "uwaga": "La IA puede entender mal un número o un nombre del audio. Antes de enviar, compara el documento con lo que grabaste; cualquier recomendación de producto o dosis sale de la etiqueta y de tu receta agronómica, no del dictado.", "przyklad": {"wejscie": "Te paso el audio de lo de Martín Ortiz, Potrero del Molino, setenta hectáreas, 3 de diciembre a las cuatro de la tarde. Dice así: bueno estamos en el lote del molino el maíz está en ve seis parejo hay cogollero en algunas plantas diría que en diez de cada cien con daño fresco en el cogollo los bajos están encharcados todavía hay un manchón de sorgo de alepo cerca del molino hay que ver si es el mismo de siempre el productor pregunta si conviene aplicar ya o esperar a la semana que viene. Quiero un informe completo para la carpeta del lote y algo corto para mandarle a Martín.", "wynik": "A) NOTA PARA LA CARPETA DEL LOTE\nProductor: Martín Ortiz | Lote: Potrero del Molino | 70 ha | Fecha: 3/12, 16 h\nCultivo: maíz | Estadio: V6, parejo | Híbrido: [A COMPLETAR]\n\n| Categoría | Observación | Dónde |\n| Insectos | cogollero con daño fresco en el cogollo, ~10 de cada 100 plantas (estimación a campo) | sin precisar [VERIFICAR] |\n| Malezas | manchón de sorgo de alepo | cerca del molino |\n| Suelo y agua | bajos todavía encharcados | bajos del lote |\n\nConsulta del productor: ¿aplicar ya o esperar a la semana próxima? Queda pendiente; la decisión depende del umbral [A COMPLETAR: umbral y fuente] y del producto [VER ETIQUETA].\n\nB) CORRECCIONES DEL DICTADO\n| Original | Corregido |\n| “ve seis” | V6 |\n| “sorgo de alepo” | sorgo de Alepo |\n\nC) DUDAS Y PREGUNTAS\n- ¿El 10 % es sobre plantas revisadas en todo el lote o en una zona? [VERIFICAR]\n- ¿Cuántas estaciones de muestreo hiciste? [A COMPLETAR]\n- ¿El sorgo de Alepo es el mismo manchón de campañas anteriores? [VERIFICAR]\n\nD) WHATSAPP PARA MARTÍN\n“Martín, el maíz del Molino está parejo en V6. Hay cogollero en cerca del 10 % de las plantas que miré y un manchón de sorgo de Alepo cerca del molino. Te confirmo mañana si conviene aplicar ahora o esperar.”\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "1.08", "nazwa": "Carta de recomendaciones al productor", "tag": "RECOMENDACIONES", "co_robi": "Convierte lo que viste y lo que acordaste con el productor en una carta de recomendaciones clara: qué hacer, en qué lote, cuándo y qué falta definir. Sin dosis inventadas: lo que sale de la etiqueta queda marcado.", "kiedy": "Al volver de la visita, cuando quedaron decisiones habladas en la tranquera y hay que dejarlas por escrito antes de que se olviden.", "brief": [{"pole": "Hallazgos de la visita", "opis": "Lo principal que viste, por ejemplo “roya común en el maíz tardío, chinche en la soja de segunda por encima de lo habitual”."}, {"pole": "Productor y lotes", "opis": "Productor y lotes, por ejemplo “Agropecuaria Don Ernesto, Pergamino — Lotes 4, 7 y El Bajo”."}, {"pole": "Acordado con el productor", "opis": "Lo que ya hablaron, por ejemplo “aplicar en la soja de segunda esta semana si el clima deja, esperar en el maíz”."}, {"pole": "Recursos del campo", "opis": "Equipo, personal y contratistas, por ejemplo “pulverizadora propia de 24 m, contratista para el avión si hace falta”."}, {"pole": "Pronóstico del clima", "opis": "Lo que viene, por ejemplo “viento fuerte el miércoles, lluvia el viernes”."}, {"pole": "Formato de entrega", "opis": "Cómo la mandas, por ejemplo “PDF por mail y resumen por WhatsApp”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que escribe recomendaciones técnicas claras para productores. Redacta la carta de recomendaciones de esta visita.\n\nDATOS:\nHallazgos de la visita: [HALLAZGOS DE LA VISITA]\nProductor y lotes: [PRODUCTOR Y LOTES]\nAcordado con el productor: [ACORDADO CON EL PRODUCTOR]\nRecursos del campo: [RECURSOS DEL CAMPO]\nPronóstico del clima: [PRONÓSTICO DEL CLIMA]\nFormato de entrega: [FORMATO DE ENTREGA]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Ordena por prioridad y por lote: qué hacer, dónde, cuándo y por qué, en lenguaje simple.\n4. Nunca indiques un producto ni una dosis por tu cuenta. Escribe el objetivo de la aplicación (por ejemplo, fungicida registrado para maíz) y marca producto, dosis, tiempo de carencia y de reingreso [VER ETIQUETA]. Recuerda que la receta agronómica es obligatoria donde lo exija la norma.\n5. Ten en cuenta el pronóstico y los recursos del campo para proponer las ventanas de trabajo, sin prometer condiciones de aplicación que no conozco.\n6. Incluye las Buenas Prácticas Agrícolas que aplican: condiciones para evitar deriva, registro de aplicaciones y triple lavado de envases.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Encabezado: productor, fecha de la visita y lotes.\nB) Resumen de la situación en 3–5 líneas.\nC) Tabla de recomendaciones: prioridad | lote | acción | momento | responsable.\nD) Condiciones y cuidados de la aplicación.\nE) Pendientes y datos a confirmar, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Haz la versión de WhatsApp con solo las acciones de esta semana.", "Agrega una columna con la fecha límite de cada acción.", "Redacta la parte de la receta agronómica que tengo que completar.", "Escribe la carta en un tono más formal para la empresa.", "Prepara una orden de trabajo para el aplicador o el contratista.", "Agrega un plan alternativo si el clima no deja aplicar.", "Separa lo que decide el productor de lo que hago yo.", "Arma la lista de insumos que hay que tener en el campo.", "Agrega cuándo vuelvo a recorrer cada lote.", "Resume la carta en un párrafo para la ficha del lote."], "checklista": ["Cada recomendación tiene lote, momento y responsable.", "Ningún producto o dosis aparece sin [VER ETIQUETA] o sin la etiqueta en la mano.", "La receta agronómica está prevista donde corresponde.", "Las ventanas de trabajo tienen en cuenta el pronóstico.", "Las Buenas Prácticas Agrícolas están mencionadas.", "Lo acordado con el productor coincide con lo que se habló."], "uwaga": "La carta no reemplaza la receta agronómica ni la etiqueta. Producto, dosis, tiempo de carencia y de reingreso salen de la etiqueta vigente; la firma y la responsabilidad de la recomendación son tuyas.", "przyklad": {"wejscie": "Volví de lo de Don Ernesto, Pergamino. En el maíz tardío del Lote 4 hay roya común, todavía en hojas de abajo, la quiero seguir. En la soja de segunda del Lote 7 hay chinches más de lo que vemos normalmente, en el paño me dio por arriba de lo que usamos como referencia. El Bajo está bien. Quedamos con Don Ernesto en aplicar la soja de segunda esta semana si el clima deja y esperar en el maíz. Tiene pulverizadora propia de 24 metros. Pronóstico: viento fuerte el miércoles, lluvia el viernes. Mándale un PDF por mail y un resumen por WhatsApp.", "wynik": "CARTA DE RECOMENDACIONES\nProductor: Agropecuaria Don Ernesto, Pergamino | Visita: [A COMPLETAR: fecha] | Lotes 4, 7 y El Bajo\n\nB) SITUACIÓN\nLa soja de segunda del Lote 7 tiene chinches por encima de la referencia que usamos [A COMPLETAR: conteo y umbral con fuente]. El maíz tardío del Lote 4 tiene roya común en hojas inferiores: por ahora, seguimiento. El Bajo, sin novedades.\n\nC) RECOMENDACIONES\n| Prioridad | Lote | Acción | Momento | Responsable |\n| 1 | Lote 7 | Aplicar insecticida registrado para chinches en soja; producto y dosis [VER ETIQUETA] | lunes o martes, antes del viento del miércoles [VERIFICAR] | aplicador del campo |\n| 2 | Lote 4 | Volver a recorrer y ver avance de la roya en hojas medias | en 5–7 días [SUPUESTO] | asesor |\n| 3 | El Bajo | Recorrida de rutina | próxima visita | asesor |\n\nD) CONDICIONES Y CUIDADOS\n- Receta agronómica antes de aplicar.\n- No aplicar con viento fuerte ni con inversión térmica; condiciones exactas según etiqueta y BPA [VER ETIQUETA].\n- Tiempo de carencia y de reingreso [VER ETIQUETA].\n- Registrar la aplicación y hacer triple lavado de envases.\n\nE) PENDIENTES: conteo de chinches por metro [A COMPLETAR]; producto disponible en el campo [A COMPLETAR].\n\nWHATSAPP: “Don Ernesto, aplicamos la soja del 7 lunes o martes, antes del viento. El maíz del 4 lo vuelvo a ver la semana que viene. Le mando el PDF por mail.”\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}]}, {"dzial_nr": 2, "dzial": "Planificación productiva y nutrición", "opis": "Planes de nitrógeno, encalado, análisis de suelo, balances de nutrientes, rotaciones, siembra y elección de semilla: cada campaña arranca con números y papeles. Cargas tus análisis, las recomendaciones de tu centro de investigación local y los datos de ensayos, y recibes un plan listo con las cuentas paso a paso, sin nada inventado y con todo lo que hay que revisar bien marcado.", "skills": [{"id": "2.01", "nazwa": "Plan de nitrógeno por lote (4C)", "tag": "PLAN DE NITRÓGENO", "co_robi": "Arma el plan de nitrógeno de cada lote con las 4C (fuente, dosis, momento y lugar correctos), usando tu análisis de suelo, tu rinde objetivo y el modelo de recomendación local que tú eliges. Las cuentas quedan a la vista y nada sale inventado.", "kiedy": "Antes de la siembra de maíz, trigo o sorgo, cuando hay que cerrar la compra de fertilizante y el productor quiere saber cuánto y cuándo.", "brief": [{"pole": "Productor y lotes", "opis": "Productor, lotes y hectáreas, por ejemplo “Agropecuaria Don Ernesto, Pergamino — Lote 4 (120 ha) y Lote 9 (80 ha)”."}, {"pole": "Cultivo y rinde objetivo", "opis": "Cultivo, fecha de siembra y rinde objetivo, por ejemplo “maíz temprano, rinde objetivo 100 qq/ha en Lote 4 y 85 qq/ha en Lote 9”."}, {"pole": "Recomendación local de N", "opis": "El modelo o guía que usas, con su fuente, por ejemplo “umbral de N disponible a la siembra de la guía regional del INTA que uso”."}, {"pole": "Aportes y análisis de suelo", "opis": "Análisis y aportes, por ejemplo “N-nitratos 0–60 cm: 52 kg/ha en Lote 4 y 38 kg/ha en Lote 9; antecesor soja”."}, {"pole": "Fuentes y momentos de N", "opis": "Fuentes disponibles y momentos posibles, por ejemplo “urea y UAN, a la siembra y en V6 con la pulverizadora”."}, {"pole": "Requisitos del plan", "opis": "Qué debe cumplir, por ejemplo “presupuesto acotado, presentar al productor en una página”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que arma planes de fertilización nitrogenada con el criterio de las 4C (fuente, dosis, momento y lugar correctos). Prepara el plan de nitrógeno por lote con mis datos.\n\nDATOS:\nProductor y lotes: [PRODUCTOR Y LOTES]\nCultivo y rinde objetivo: [CULTIVO Y RINDE OBJETIVO]\nRecomendación local de N: [RECOMENDACIÓN LOCAL DE N]\nAportes y análisis de suelo: [APORTES Y ANÁLISIS DE SUELO]\nFuentes y momentos de N: [FUENTES Y MOMENTOS DE N]\nRequisitos del plan: [REQUISITOS DEL PLAN]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo el modelo de recomendación que yo te dé (umbral de N a la siembra, balance, curva de respuesta) y cita su fuente. Si no lo di, escribe [A COMPLETAR: modelo de recomendación y fuente]. Nunca pongas un umbral, un coeficiente ni una dosis propia.\n4. Descuenta los aportes que yo informe (N del suelo, antecesor, efluentes) solo con los valores que te di; si falta alguno, márcalo [A COMPLETAR].\n5. Convierte kg de N/ha a kg de producto/ha usando la concentración de cada fuente que yo te confirme [VERIFICAR].\n6. Propón momento y lugar según los equipos y las fuentes disponibles, y señala los riesgos de pérdidas (volatilización, lavado) sin cuantificarlos si no tengo el dato.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Resumen por lote: cultivo, rinde objetivo, N necesario, N disponible y N a aplicar.\nB) Cálculos paso a paso con la fuente de cada número.\nC) Plan 4C: fuente | dosis de producto | momento | forma de aplicación, por lote.\nD) Cantidades totales de cada fertilizante para la compra.\nE) Supuestos, riesgos y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Calcula la cantidad total de urea y UAN para comprar.", "Arma un escenario con el rinde objetivo 10 % más bajo.", "Haz la versión de una página para el productor.", "Agrega el costo por hectárea con los precios que te paso.", "Divide la dosis entre siembra y V6 y muestra cuánto va en cada momento.", "Prepara la orden de trabajo para el aplicador de UAN.", "Compara el plan con el que se hizo en este lote la campaña pasada.", "Agrega una tabla de seguimiento para registrar lo aplicado.", "Explícame en lenguaje simple por qué cada lote lleva distinta dosis.", "Arma la lista de análisis que convendría hacer antes de la refertilización."], "checklista": ["El modelo de recomendación y su fuente son los tuyos.", "El N del análisis de suelo es el del informe del laboratorio.", "Las concentraciones de cada fertilizante son las del proveedor.", "Las conversiones de kg de N a kg de producto están bien hechas.", "Los momentos son posibles con los equipos del campo.", "Los totales para la compra coinciden con la suma por lote."], "uwaga": "Este plan no reemplaza la recomendación de tu centro de investigación local (INTA, INIFAP, INIA u otro) ni tu criterio. El modelo, los umbrales y las dosis finales los defines tú.", "przyklad": {"wejscie": "Plan de nitrógeno para Don Ernesto, Pergamino. Lote 4, 120 hectáreas, y Lote 9, 80 hectáreas, maíz temprano, los dos con antecesor soja. Rinde objetivo: 100 quintales en el 4 y 85 en el 9. Nitratos de 0 a 60 centímetros: 52 kilos de N por hectárea en el 4 y 38 en el 9. Uso el modelo de umbral de N a la siembra: el umbral que tomo de la guía regional es 150 kilos de N por hectárea para 100 quintales y 130 para 85. Tenemos urea al 46 por ciento y UAN al 32. Quiero aplicar parte a la siembra y parte en V6 con la pulverizadora. Presupuesto acotado, presentarlo en una página.", "wynik": "A) RESUMEN POR LOTE\n| Lote | ha | Rinde obj. | Umbral N (tu guía) | N suelo | N a aplicar |\n| 4 | 120 | 100 qq/ha | 150 kg/ha | 52 kg/ha | 98 kg/ha |\n| 9 | 80 | 85 qq/ha | 130 kg/ha | 38 kg/ha | 92 kg/ha |\n\nB) CÁLCULOS\nLote 4: 150 − 52 = 98 kg N/ha. Lote 9: 130 − 38 = 92 kg N/ha.\nFuente del umbral: guía regional que indicaste [VERIFICAR: nombre y año de la publicación].\nAporte extra del antecesor soja: no descontado [SUPUESTO]; si tu guía lo contempla, ajústalo.\n\nC) PLAN 4C (reparto propuesto 50/50 [SUPUESTO])\n| Lote | Siembra | V6 |\n| 4 | 49 kg N = 49 ÷ 0,46 = 106,5 kg urea/ha | 49 kg N = 49 ÷ 0,32 = 153,1 kg UAN/ha |\n| 9 | 46 kg N = 100,0 kg urea/ha | 46 kg N = 143,8 kg UAN/ha |\nLugar: urea incorporada o al costado de la línea; UAN chorreado entre hileras para reducir volatilización [VERIFICAR con tus equipos].\n\nD) COMPRA\nUrea: 106,5 × 120 + 100,0 × 80 = 12.780 + 8.000 = 20.780 kg.\nUAN: 153,1 × 120 + 143,8 × 80 = 18.372 + 11.504 = 29.876 kg (densidad para pasar a litros [A COMPLETAR]).\n\nE) PENDIENTES: precios para el costo por hectárea [A COMPLETAR]; confirmar concentraciones con el proveedor [VERIFICAR].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "2.03", "nazwa": "Interpretación del análisis de suelo para el productor", "tag": "ANÁLISIS DE SUELO", "co_robi": "Traduce el informe del laboratorio a algo que el productor entiende: qué está bien, qué está bajo, qué significa para los cultivos que vienen y qué decisiones abre. Usa tus rangos de interpretación, no unos genéricos.", "kiedy": "Cuando llegan los análisis y el productor te pregunta «¿y esto qué quiere decir?» antes de planificar la fertilización.", "brief": [{"pole": "Productor y lotes", "opis": "Productor y lotes, por ejemplo “Lucía Ramírez, Paysandú — Lote 2 y La Loma”."}, {"pole": "Resultados del laboratorio", "opis": "Los valores, por ejemplo “Lote 2: MO 3,4 %, pH 5,8, P Bray 9 ppm, K 0,6 cmol/kg, S-sulfatos 7 ppm, CIC 18”."}, {"pole": "Rangos de interpretación", "opis": "La tabla que usas y su fuente, por ejemplo “rangos de suficiencia del laboratorio para P y K; para S uso la guía del INIA”."}, {"pole": "Cultivos previstos", "opis": "Lo que viene, por ejemplo “soja de primera en Lote 2, trigo y soja de segunda en La Loma”."}, {"pole": "Público", "opis": "Quién lo lee, por ejemplo “la productora, que no es agrónoma, y su hijo que maneja la planilla de costos”."}, {"pole": "Preguntas del productor", "opis": "Lo que preguntó, por ejemplo “¿hace falta fósforo este año o puedo saltearlo?”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que explica análisis de suelo a productores sin perder rigor. Interpreta este análisis para el productor.\n\nDATOS:\nProductor y lotes: [PRODUCTOR Y LOTES]\nResultados del laboratorio: [RESULTADOS DEL LABORATORIO]\nRangos de interpretación: [RANGOS DE INTERPRETACIÓN]\nCultivos previstos: [CULTIVOS PREVISTOS]\nPúblico: [PÚBLICO]\nPreguntas del productor: [PREGUNTAS DEL PRODUCTOR]\n\nREGLAS:\n1. Antes de empezar, revisa si los datos están completos. Si falta algo importante, hazme como máximo 5–7 preguntas cortas y espera mis respuestas.\n2. No inventes dosis, umbrales, tiempos de carencia o de reingreso, precios, tasas, montos, plazos ni normas. Marca los datos que faltan [A COMPLETAR], los supuestos [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Interpreta cada valor solo con los rangos que yo te dé y cita su fuente. Si un nutriente no tiene rango, escribe [A COMPLETAR: rango y fuente] y no lo califiques.\n4. Explica qué significa cada valor para los cultivos previstos en lenguaje simple, sin recomendar dosis: las dosis van en el plan de fertilización.\n5. Señala valores que parecen raros o inconsistentes (por ejemplo, saltos grandes frente a análisis anteriores) y márcalos [VERIFICAR].\n6. Responde las preguntas del productor con lo que permiten los datos y di qué falta para contestarlas del todo.\n7. Muestra cada cálculo paso a paso, con sus unidades (ha, kg/ha, t/ha, qq/ha, plantas/ha).\n\nFORMATO DE SALIDA:\nA) Tabla: parámetro | valor | rango de referencia (fuente) | lectura (bajo, medio, alto).\nB) Qué significa para cada cultivo previsto.\nC) Respuestas a las preguntas del productor.\nD) Decisiones que abre el análisis y próximos pasos.\nE) Valores dudosos y datos que faltan, con marcadores.\n\nTermina siempre con: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Haz una versión de media página para el productor.", "Agrega una comparación con el análisis anterior del mismo lote.", "Prepara un gráfico simple en texto de semáforo por nutriente.", "Explica qué es la CIC y por qué importa, en tres líneas.", "Arma la lista de preguntas que le haría al laboratorio.", "Redacta un audio de WhatsApp de un minuto explicando el resultado.", "Indica qué análisis convendría agregar la próxima vez.", "Separa lo que hay que decidir este año y lo que puede esperar.", "Prepara la base para el plan de fertilización de cada lote.", "Resume el análisis para la ficha histórica del lote."], "checklista": ["Los valores coinciden con el informe del laboratorio.", "Cada rango de referencia tiene su fuente.", "Las unidades son las del laboratorio (ppm, cmol/kg, %).", "No aparecen dosis de fertilización en la interpretación.", "Los valores raros están marcados para revisar.", "El lenguaje es claro para quien lo va a leer."], "uwaga": "Los rangos de interpretación cambian según el método del laboratorio y la región. Usa la tabla de tu laboratorio o de tu centro de investigación local; la IA no debe calificar un valor sin esa referencia.", "przyklad": {"wejscie": "Necesito explicarle a Lucía Ramírez, de Paysandú, los análisis. Lote 2: materia orgánica 3,4 por ciento, pH 5,8, fósforo Bray 9 ppm, potasio 0,6 cmol por kilo, sulfatos 7 ppm, CIC 18. Para fósforo y potasio uso los rangos de suficiencia del laboratorio, que dicen que para soja el fósforo es bajo por debajo de 12 ppm y el potasio es suficiente arriba de 0,4. Para azufre no tengo rango a mano. Viene soja de primera. Lucía no es agrónoma, el hijo maneja los costos. Ella me preguntó si hace falta fósforo este año o lo puede saltear.", "wynik": "A) LOTE 2\n| Parámetro | Valor | Referencia (fuente) | Lectura |\n| MO | 3,4 % | [A COMPLETAR: rango y fuente] | sin calificar |\n| pH | 5,8 | [A COMPLETAR: rango y fuente] | sin calificar |\n| P Bray | 9 ppm | bajo si <12 ppm para soja (laboratorio) | bajo |\n| K | 0,6 cmol/kg | suficiente si >0,4 (laboratorio) | suficiente |\n| S-sulfatos | 7 ppm | [A COMPLETAR: rango y fuente] | sin calificar |\n| CIC | 18 | — | dato de contexto |\n\nB) QUÉ SIGNIFICA PARA LA SOJA\n- Fósforo: está por debajo del nivel que el laboratorio considera suficiente (9 frente a 12 ppm). Es el nutriente que más probablemente limite el rinde este año.\n- Potasio: alcanza según la referencia del laboratorio; no es prioridad.\n- Azufre: no se puede opinar sin rango de referencia.\n\nC) ¿HACE FALTA FÓSFORO ESTE AÑO?\nCon un P Bray bajo según tu propio laboratorio, saltearlo tiene riesgo de perder rinde [SUPUESTO]. Cuánto aplicar va en el plan de fertilización, con la recomendación local [A COMPLETAR: criterio de dosis y fuente].\n\nD) DECISIONES\n- Incluir fósforo en el plan de la soja; dosis a definir.\n- Conseguir el rango de azufre para decidir si se agrega.\n\nE) PENDIENTES: análisis anterior para comparar [A COMPLETAR]; La Loma sin datos [A COMPLETAR].\n\nPARA LUCÍA: “El análisis muestra poco fósforo para la soja; conviene ponerlo este año. El resto está bien o falta información para decirlo.”\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}]}, {"dzial_nr": 3, "dzial": "Costos, presupuestos y márgenes", "opis": "La agronomía termina en el lote, pero la decisión se toma en la mesa de la cocina: cuánto cuesta la tonelada, si el precio que ofrecen cubre los costos, si conviene tomar el campo, comprar la máquina o guardar el grano. Cargas tus propias facturas, cotizaciones y rindes, y recibes una cuenta paso a paso para revisar, sin un solo número inventado.", "skills": [{"id": "3.01", "nazwa": "Costo de producción por hectárea", "tag": "COSTO POR HA", "co_robi": "Arma el presupuesto de un cultivo con las facturas y el plan del productor: cada renglón en USD/ha, USD por lote y USD por tonelada. Separa insumos, labores y otros gastos para que veas exactamente adónde se va la plata.", "kiedy": "Antes de la siembra, cuando planificas la campaña, o cuando el productor te pregunta cuánto le cuesta de verdad cada tonelada y las facturas están en una carpeta en la guantera de la camioneta.", "brief": [{"pole": "Productor y cultivo", "opis": "Productor, cultivo, lote, hectáreas y zona, por ejemplo “Agropecuaria Don Ernesto, maíz en el Lote 7, 120 ha, Pergamino, campo propio”."}, {"pole": "Insumos directos", "opis": "Semilla, fertilizantes y fitosanitarios en USD/ha, de facturas o del plan, por ejemplo “semilla 210 USD/ha, fertilizantes 230 USD/ha, fitosanitarios 85 USD/ha”."}, {"pole": "Labores y contratistas", "opis": "Siembra, pulverizaciones, cosecha, propias o contratadas, por ejemplo “siembra 60 USD/ha, 3 pulverizaciones de 12 USD/ha, cosecha 95 USD/ha, todo con contratista”."}, {"pole": "Otros costos", "opis": "Seguro, interés, alquiler, mano de obra, por ejemplo “seguro de granizo 18 USD/ha, interés del crédito 15 USD/ha, el campo es propio”."}, {"pole": "Rinde esperado", "opis": "Tu historial o el objetivo del lote, por ejemplo “95 qq/ha, promedio de las últimas tres campañas en ese lote”."}, {"pole": "Para qué", "opis": "Para qué haces la cuenta, por ejemplo “saber cuánto cuesta la tonelada antes de vender y mostrárselo al banco”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que arma presupuestos de cultivo con productores todos los años antes de la siembra. Prepara el costo de producción de un cultivo.\n\nDATOS:\nProductor y cultivo: [PRODUCTOR Y CULTIVO]\nInsumos directos: [INSUMOS DIRECTOS]\nLabores y contratistas: [LABORES Y CONTRATISTAS]\nOtros costos: [OTROS COSTOS]\nRinde esperado: [RINDE ESPERADO]\nPara qué: [PARA QUÉ]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes precios, rindes, dosis, tasas, montos de programas ni valores «típicos». Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Muestra cada cálculo paso a paso con unidades (USD/ha, USD/lote, USD/t, t/ha, qq/ha) y redondea solo el resultado final.\n4. Agrupa los costos en insumos directos, labores y contratistas, y otros costos. Muestra cada renglón en USD/ha, en USD para todo el lote y su participación en el total.\n5. Costo por tonelada = total USD/ha dividido por el rinde esperado en t/ha (1 t = 10 qq). Si no te di rinde, no lo adivines.\n6. Si te doy un precio, calcula también los quintales por hectárea que hacen falta para cubrir el costo; si no, márcalo [A COMPLETAR].\n7. Aclara qué deja afuera el presupuesto (amortizaciones, mano de obra familiar, renta de la tierra propia, gastos de estructura) para que nadie lo compare con un costo completo del banco o del INTA.\n\nFORMATO DE SALIDA:\nA) Tabla de costos | renglón | USD/ha | USD/lote | % del total |.\nB) Totales en USD/ha, USD/lote y USD/t, con la cuenta a la vista.\nC) Los tres renglones más pesados y una pregunta que vale la pena hacerse sobre cada uno.\nD) Lista de huecos y supuestos a cerrar antes de usar el presupuesto.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega la amortización de maquinaria con los valores que te paso.", "Recalcula el costo por tonelada con 10 qq/ha menos y 10 qq/ha más.", "Abre los fertilizantes por producto, dosis y momento según el plan de fertilización.", "Conviértelo en un presupuesto de una página para el banco.", "Compáralo con el presupuesto de la campaña pasada, que te pego ahora.", "Agrega la renta de la tierra propia con el valor que te doy.", "Escálalo a todas las hectáreas de maíz de la empresa.", "Marca cualquier renglón raro que convenga revisar contra las facturas.", "Arma la tabla para pegarla en una planilla de cálculo.", "Escribe un resumen de tres oraciones para el productor."], "checklista": ["Cada número en dólares sale de facturas, cotizaciones de la agronomía o del plan del productor, no de la memoria de la IA.", "Las unidades son coherentes: USD/ha, USD/lote y USD/t, sin mezclar precio por envase con precio por hectárea.", "Las hectáreas del lote coinciden con los mapas o el registro del productor.", "El rinde usado para el costo por tonelada es realista para el historial de ese lote.", "El presupuesto dice qué no incluye (amortizaciones, mano de obra propia, renta de la tierra).", "Todos los [A COMPLETAR] están cerrados antes de mandarlo al banco."], "uwaga": "El presupuesto vale lo que valen los números del productor. Revisa si las facturas incluyen descuentos por pago anticipado, intereses de financiación o impuestos: la IA no conoce la situación impositiva de la empresa; eso se consulta con el contador.", "przyklad": {"wejscie": "Bueno, Agropecuaria Don Ernesto, maíz en el Lote 7, 120 hectáreas, Pergamino. El campo es de ellos, así que no hay alquiler. De las facturas por hectárea tengo semilla 210, fertilizante 230 todo junto, fitosanitarios 85. Labores con contratista: siembra 60 la hectárea, tres pasadas de pulverizadora a 12 cada una, y la cosecha 95 la hectárea. Seguro de granizo 18 por hectárea y el interés del crédito para insumos sale unos 15. Rinde ponle 95 quintales, es el promedio de tres campañas en ese lote. No metas amortizaciones que no tengo los valores de las máquinas, y la mano de obra de Ernesto tampoco. Quiero saber cuánto le cuesta la tonelada antes de que salga a vender y algo para mostrarle al banco.", "wynik": "COSTO DE PRODUCCIÓN: maíz, Lote 7, 120 ha, Pergamino\n\n| renglón | USD/ha | USD/lote | % |\n| semilla | 210 | 25.200 | 28,0 |\n| fertilizantes | 230 | 27.600 | 30,7 |\n| fitosanitarios | 85 | 10.200 | 11,3 |\n| siembra | 60 | 7.200 | 8,0 |\n| pulverizaciones (3 × 12) | 36 | 4.320 | 4,8 |\n| cosecha | 95 | 11.400 | 12,7 |\n| seguro de granizo | 18 | 2.160 | 2,4 |\n| interés | 15 | 1.800 | 2,0 |\n| TOTAL | 749 | 89.880 | 100 |\n\nCuentas:\n1. Insumos directos: 210 + 230 + 85 = 525 USD/ha\n2. Labores: 60 + 36 + 95 = 191 USD/ha\n3. Otros: 18 + 15 = 33 USD/ha\n4. Total: 525 + 191 + 33 = 749 USD/ha; × 120 ha = 89.880 USD\n5. Rinde: 95 qq/ha = 9,5 t/ha\n6. Costo por tonelada: 749 ÷ 9,5 = 78,84 USD/t\n7. Quintales para cubrir el costo: [A COMPLETAR: precio neto esperado en USD/t]\n\nRenglones más pesados: fertilizantes (30,7 %): ¿la dosis sale del último análisis de suelo del lote?; semilla (28,0 %): ¿la densidad acompaña el ambiente de ese lote?; cosecha (12,7 %): ¿la tarifa es fija o porcentaje del rinde? [VERIFICAR]\n\nNo incluye: amortizaciones [A COMPLETAR], mano de obra propia [A COMPLETAR], renta de la tierra propia [A COMPLETAR]. El costo completo por tonelada será mayor a 78,84 USD/t.\n\n[SUPUESTO] 95 qq/ha = promedio de tres campañas en el Lote 7.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "3.04", "nazwa": "Presupuesto de campaña y flujo de caja", "tag": "FLUJO DE CAJA", "co_robi": "Ordena ingresos y egresos de la campaña mes a mes y muestra cuándo falta plata, cuánto y por cuánto tiempo. Sirve para negociar plazos con la agronomía, pedir crédito a tiempo y no vender granos apurado.", "kiedy": "Antes de empezar la campaña, cuando se juntan las compras de insumos con la siembra, o cuando el productor necesita mostrarle al banco cómo va a pagar.", "brief": [{"pole": "Empresa", "opis": "Productor, actividades y superficie, por ejemplo “Martín Ortiz, 450 ha de soja y maíz en Itapúa”."}, {"pole": "Saldo inicial", "opis": "Plata disponible al arrancar, por ejemplo “40.000 USD en cuenta al 1 de septiembre”."}, {"pole": "Egresos previstos", "opis": "Pagos por mes, por ejemplo “septiembre 25.000, octubre 30.000, noviembre 15.000, diciembre 12.000 USD”."}, {"pole": "Ingresos previstos", "opis": "Cobros por mes, por ejemplo “octubre 10.000 USD por venta de trigo, diciembre 45.000 USD por soja guardada en silo bolsa”."}, {"pole": "Compromisos fijos", "opis": "Cuotas, sueldos, alquileres, por ejemplo “sueldos 3.000 USD por mes, cuota del préstamo 8.000 USD en noviembre”."}, {"pole": "Período y objetivo", "opis": "Meses a cubrir y para qué, por ejemplo “septiembre a diciembre, saber si necesito crédito y cuánto”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia en administración rural que arma flujos de caja de campaña con productores. Arma el flujo de caja mensual de esta empresa.\n\nDATOS:\nEmpresa: [EMPRESA]\nSaldo inicial: [SALDO INICIAL]\nEgresos previstos: [EGRESOS PREVISTOS]\nIngresos previstos: [INGRESOS PREVISTOS]\nCompromisos fijos: [COMPROMISOS FIJOS]\nPeríodo y objetivo: [PERÍODO Y OBJETIVO]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes precios, rindes, dosis, tasas, montos de programas ni valores «típicos». Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Muestra el saldo de cada mes: saldo inicial + ingresos − egresos − compromisos fijos = saldo final, que pasa a ser el inicial del mes siguiente.\n4. Señala el mes de mayor déficit y su monto; es el dato clave para negociar.\n5. No supongas condiciones de crédito, tasas ni plazos: si hace falta financiamiento, marca [A COMPLETAR] y pregúntame qué opciones tengo (banca pública, cooperativa, agronomía, canje).\n6. Si un ingreso depende de vender granos, márcalo [SUPUESTO] con la cantidad y el precio que yo te di.\n7. Propón tres palancas concretas para cubrir el déficit (correr pagos, adelantar ventas, financiar insumos) sin inventar números.\n\nFORMATO DE SALIDA:\nA) Tabla mensual | mes | saldo inicial | ingresos | egresos | fijos | saldo final |.\nB) Mes crítico y monto máximo de déficit.\nC) Tres palancas para cubrir el déficit, con lo que hay que confirmar en cada una.\nD) Lista de supuestos y [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega los meses hasta la cosecha de maíz.", "Simula que la venta de soja se atrasa un mes.", "Arma la versión para presentar al banco.", "Separa el flujo por actividad: soja, maíz y ganadería.", "Agrega el pago de impuestos en las fechas que te paso.", "Simula un canje de insumos por granos con las condiciones que te doy.", "Calcula cuánto grano hay que vender en cada mes para no quedar en negativo.", "Marca los pagos que conviene negociar con la agronomía.", "Escribe un resumen de cuatro líneas para el productor.", "Arma la tabla para pegarla en una planilla de cálculo."], "checklista": ["Cada ingreso y egreso tiene fecha y monto confirmados por el productor.", "El saldo final de cada mes pasa bien al mes siguiente.", "Las ventas de granos tienen cantidad y precio realistas, marcados como supuestos.", "Las cuotas de crédito y los sueldos están todos cargados.", "El mes de mayor déficit está identificado con su monto.", "Las condiciones de cualquier crédito nuevo se confirman con el banco, no con la IA."], "uwaga": "El flujo de caja es tan bueno como las fechas que se cargan. Los impuestos y las retenciones dependen de cada empresa y cada país: eso lo confirma el contador.", "przyklad": {"wejscie": "Martín Ortiz, 450 hectáreas de soja y maíz en Itapúa. Arranca septiembre con 40 mil dólares en cuenta. Pagos: septiembre 25 mil de semilla y fertilizante, octubre 30 mil de siembra e insumos, noviembre 15 mil, diciembre 12 mil. Entra plata en octubre, 10 mil por el trigo, y en diciembre piensa vender la soja que tiene en silo bolsa, unos 45 mil. Fijo tiene 3 mil por mes de sueldos y en noviembre vence una cuota del préstamo de 8 mil. Quiero ver de septiembre a diciembre si le alcanza o si tiene que salir a pedir crédito, y cuánto.", "wynik": "FLUJO DE CAJA: Martín Ortiz, septiembre a diciembre (USD)\n\n| mes | inicial | ingresos | egresos | fijos | final |\n| sep | 40.000 | 0 | 25.000 | 3.000 | 12.000 |\n| oct | 12.000 | 10.000 | 30.000 | 3.000 | −11.000 |\n| nov | −11.000 | 0 | 15.000 | 11.000 | −37.000 |\n| dic | −37.000 | 45.000 | 12.000 | 3.000 | −7.000 |\n\nCuentas: noviembre = −11.000 + 0 − 15.000 − (3.000 sueldos + 8.000 cuota) = −37.000.\n\nMes crítico: noviembre, con un déficit de 37.000 USD. Aun con la venta de soja, cierra diciembre en −7.000 USD.\n\nPalancas:\n1. Pasar parte de los pagos de octubre a cosecha con la agronomía: [A COMPLETAR: qué plazo y recargo ofrece].\n2. Adelantar una parte de la venta de soja a octubre: [A COMPLETAR: precio y cantidad].\n3. Crédito de campaña por al menos 37.000 USD de octubre a diciembre: [A COMPLETAR: entidad, tasa y plazo].\n\n[SUPUESTO] la soja de silo bolsa se vende en diciembre por 45.000 USD, como dijiste.\n[VERIFICAR] si hay impuestos o retenciones a pagar en estos meses.\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}]}, {"dzial_nr": 4, "dzial": "Productores clientes y asesoramiento profesional", "opis": "Saber mucho de campo no alcanza: ese conocimiento hay que ponerle precio, escribirlo en una propuesta, dejarlo en un contrato y mostrárselo al productor mes a mes. Este departamento se ocupa del lado comercial del asesoramiento independiente: desde fijar tus honorarios y dar de alta a un productor nuevo hasta los informes mensuales, las jornadas a campo, las conversaciones difíciles y el crecimiento de tu cartera.", "skills": [{"id": "4.01", "nazwa": "Propuesta de asesoramiento con honorarios", "tag": "PROPUESTA", "co_robi": "Convierte tus notas en una propuesta de asesoramiento clara y profesional, con paquetes, alcance y condiciones. Los honorarios los pones tú: la IA nunca sugiere un valor, ordena lo que ofreces y le muestra al productor qué recibe por cada peso que paga.", "kiedy": "Después de la primera charla con un productor nuevo, cuando te pide «mándame algo por escrito» y no quieres que quede en un mensaje suelto de WhatsApp.", "brief": [{"pole": "Perfil del asesor", "opis": "Quién eres y qué te diferencia, por ejemplo “ingeniero agrónomo independiente, 12 años en la zona, especialista en malezas y fertilización”."}, {"pole": "Productor objetivo", "opis": "Empresa, superficie y situación, por ejemplo “Agropecuaria Don Ernesto, 1.200 ha agrícolas en Venado Tuerto, hoy sin asesor fijo”."}, {"pole": "Alcance del servicio", "opis": "Qué incluye, por ejemplo “recorridas cada 15 días en campaña, recetas, plan de fertilización, informe mensual”."}, {"pole": "Paquetes y honorarios", "opis": "Tus paquetes con tus valores, por ejemplo “Básico 4 USD/ha/año; Completo 7 USD/ha/año con plan de fertilización y cierre de campaña”."}, {"pole": "Condiciones", "opis": "Forma de pago, plazo, exclusiones, por ejemplo “pago trimestral, contrato por una campaña, no incluye análisis de laboratorio”."}, {"pole": "Tono y formato", "opis": "Cómo la quieres, por ejemplo “formal pero cercano, dos páginas, para mandar en PDF”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que vive del asesoramiento independiente y escribe propuestas que los productores entienden y firman. Redacta una propuesta de asesoramiento.\n\nDATOS:\nPerfil del asesor: [PERFIL DEL ASESOR]\nProductor objetivo: [PRODUCTOR OBJETIVO]\nAlcance del servicio: [ALCANCE DEL SERVICIO]\nPaquetes y honorarios: [PAQUETES Y HONORARIOS]\nCondiciones: [CONDICIONES]\nTono y formato: [TONO Y FORMATO]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes honorarios, tarifas, precios, plazos legales, normas, datos del productor ni resultados. Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo los honorarios que te doy. Si falta alguno, escribe [A COMPLETAR] y sigue con la estructura.\n4. Calcula el total anual de cada paquete para la superficie del productor y muestra la cuenta.\n5. Describe el alcance en términos concretos (frecuencia de visitas, entregables, tiempos de respuesta) y aclara qué no incluye.\n6. Deja escrito que las decisiones finales y la contratación de insumos y labores son del productor, y que las aplicaciones van con receta agronómica cuando corresponde.\n7. Nada de promesas de rinde ni de ahorro: si quiero mostrar resultados, usa solo casos que yo te dé.\n8. Escribe en español claro, sin palabras de marketing.\n\nFORMATO DE SALIDA:\nA) Propuesta lista para enviar: presentación, diagnóstico breve, alcance, paquetes, condiciones, próximos pasos.\nB) Tabla de paquetes | paquete | incluye | honorario | total anual |.\nC) Mensaje corto para acompañar el envío por WhatsApp o mail.\nD) Lista de [A COMPLETAR] antes de mandarla.\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega un tercer paquete solo por campaña de cosecha fina.", "Acórtala a una página.", "Escríbela más informal para un productor joven.", "Agrega una sección con dos casos que te paso.", "Arma la versión para una cooperativa con varios socios.", "Prepara las respuestas si dice que es caro.", "Agrega un descuento por pago anual con el porcentaje que te doy.", "Escribe el mensaje de seguimiento a la semana.", "Convierte la propuesta en un guion para presentarla en persona.", "Haz una versión con honorarios por visita en lugar de por hectárea."], "checklista": ["Todos los honorarios son tuyos, no sugeridos por la IA.", "Los totales por paquete están bien calculados con las hectáreas reales.", "El alcance dice qué incluye y qué no.", "Queda claro que la decisión final es del productor.", "No hay promesas de rinde ni de ahorro sin respaldo.", "Las condiciones de pago y el plazo están escritos."], "uwaga": "Una propuesta no es un contrato. Si el productor acepta, cierra las condiciones en un acuerdo escrito y, si el monto lo justifica, que lo revise un abogado.", "przyklad": {"wejscie": "Te cuento. Me junté con Ernesto, de Agropecuaria Don Ernesto, 1.200 hectáreas agrícolas en Venado Tuerto, hoy no tiene asesor fijo, le compra todo a la agronomía y lo asesoran ellos. Yo soy independiente, doce años en la zona, lo mío es malezas y fertilización. Le quiero ofrecer dos paquetes: Básico a 4 dólares la hectárea por año, con recorridas cada 15 días en campaña, recetas e informe mensual; y Completo a 7, que suma plan de fertilización por lote y reunión de cierre de campaña. Pago trimestral, contrato por una campaña, los análisis de laboratorio los paga aparte. Que sea formal pero cercana, dos páginas.", "wynik": "PROPUESTA DE ASESORAMIENTO AGRONÓMICO\nPara: Agropecuaria Don Ernesto, 1.200 ha, Venado Tuerto\n\n1. Quién soy\nIngeniero agrónomo independiente, con 12 años de trabajo en la zona. Me especializo en manejo de malezas y fertilización. No vendo insumos: mi único interés es el resultado de tu campo.\n\n2. Qué proponemos\nUn seguimiento técnico ordenado, con recorridas programadas, decisiones por escrito e información para planificar.\n\n3. Paquetes\n| paquete | incluye | honorario | total anual |\n| Básico | recorridas cada 15 días en campaña, recetas, informe mensual | 4 USD/ha/año | 4.800 USD |\n| Completo | todo lo anterior + plan de fertilización por lote + reunión de cierre | 7 USD/ha/año | 8.400 USD |\n\nCuenta: 1.200 × 4 = 4.800 USD; 1.200 × 7 = 8.400 USD.\n\n4. Qué no incluye\nAnálisis de laboratorio, compra de insumos y contratación de labores.\n\n5. Condiciones\nPago trimestral. Plazo: una campaña [A COMPLETAR: fechas de inicio y fin]. Las decisiones finales son del productor; las aplicaciones van con receta agronómica.\n\n6. Próximos pasos\nSi te parece bien, coordinamos una recorrida inicial [A COMPLETAR: fecha].\n\nMensaje de envío:\n«Ernesto, te mando la propuesta que charlamos. Son dos páginas. Cualquier duda la vemos en el campo. Saludos.»\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}, {"id": "4.05", "nazwa": "Informe mensual al productor", "tag": "INFORME MENSUAL", "co_robi": "Convierte tus notas de recorrida y tus datos en un informe mensual claro para el productor: qué hiciste, qué viste, qué se decidió y qué sigue. Muestra el valor de tu trabajo en un formato que el productor, el socio o el banco entienden.", "kiedy": "A fin de mes, con las notas de voz de la camioneta y las fotos del celular, cuando tienes que mandar el informe y no quieres pasar la noche escribiendo.", "brief": [{"pole": "Cliente y período", "opis": "Productor y mes, por ejemplo “Agropecuaria Don Ernesto, noviembre”."}, {"pole": "Visitas y acciones", "opis": "Qué hiciste, por ejemplo “4 recorridas, 2 recetas de herbicida, ajuste de densidad en el Lote 7”."}, {"pole": "Observaciones a campo", "opis": "Qué viste, por ejemplo “soja en V3 con buen stand; maíz en V6 con algo de cogollero bajo el umbral que acordamos”."}, {"pole": "Resultados y números", "opis": "Datos del mes, por ejemplo “lluvia 85 mm en el mes; control de malezas del barbecho bueno en 3 de 4 lotes”."}, {"pole": "Plan del mes siguiente", "opis": "Qué viene, por ejemplo “monitoreo de chinches en soja, decisión de fertilización en maíz”."}, {"pole": "Pendientes", "opis": "Lo que quedó abierto, por ejemplo “análisis de suelo del Lote 9 sin llegar; falta la factura del contratista”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que manda informes mensuales claros y breves a sus productores. Redacta el informe mensual.\n\nDATOS:\nCliente y período: [CLIENTE Y PERÍODO]\nVisitas y acciones: [VISITAS Y ACCIONES]\nObservaciones a campo: [OBSERVACIONES A CAMPO]\nResultados y números: [RESULTADOS Y NÚMEROS]\nPlan del mes siguiente: [PLAN DEL MES SIGUIENTE]\nPendientes: [PENDIENTES]\n\nREGLAS:\n1. Revisa primero los datos. Si falta algo importante, hazme como máximo 6 preguntas cortas y espera mis respuestas.\n2. No inventes observaciones, estadios, umbrales, dosis ni datos del campo. Trabaja solo con mis datos. Marca lo que falta [A COMPLETAR], lo que supongas [SUPUESTO] y lo dudoso [VERIFICAR].\n3. Usa solo lo que te doy; no agregues observaciones, estadios, umbrales ni datos que no estén en mis notas.\n4. Escribe para el productor: frases cortas, sin jerga innecesaria, lo importante primero.\n5. Separa hechos observados, decisiones tomadas y recomendaciones pendientes de decisión.\n6. Si menciono una aplicación, anota producto genérico y que se hizo con receta; las dosis van [VER ETIQUETA] o como figuran en la receta que te paso.\n7. Agrega una tabla de lotes con estado y próxima acción.\n8. Cierra con los pendientes y quién es responsable de cada uno.\n\nFORMATO DE SALIDA:\nA) Resumen del mes en cinco líneas.\nB) Tabla | lote | cultivo | estado | acción del mes | próxima acción |.\nC) Plan del mes siguiente.\nD) Pendientes con responsable y lista de [A COMPLETAR].\n\nTermina con esta nota: «Esto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas.»", "polecenia": ["Agrega fotos sugeridas en cada lote.", "Hazlo más corto, para leer en el celular.", "Agrega un gráfico de lluvias del mes con mis datos.", "Escribe la versión para el banco.", "Suma el gasto del mes en insumos con las facturas que te paso.", "Agrega una sección de valor: qué se ahorró o se evitó, con mis números.", "Prepara el mensaje de WhatsApp para mandarlo.", "Compara con el informe del mes pasado.", "Arma el informe de cierre de campaña juntando todos los meses.", "Pásalo a formato de una página para imprimir."], "checklista": ["Todo lo que dice el informe sale de tus notas y registros.", "Los estadios y observaciones son los que viste.", "Las decisiones están separadas de las recomendaciones.", "Las aplicaciones tienen su receta.", "Los pendientes tienen responsable.", "El informe se lee en menos de cinco minutos."], "uwaga": "El informe es también un registro: lo que escribes puede servir si hay un reclamo. Que diga lo que viste y lo que recomendaste, con fecha.", "przyklad": {"wejscie": "Informe de noviembre para Agropecuaria Don Ernesto. Hice cuatro recorridas. Dos recetas de herbicida, en el Lote 7 y La Loma. En el Lote 7 ajustamos la densidad de la soja porque la sembradora venía pasada. La soja está en V3, buen stand. El maíz en V6, con algo de cogollero pero abajo del umbral que acordamos con Ernesto. Llovieron 85 milímetros en el mes. El barbecho quedó limpio en tres de cuatro lotes, en El Bajo hay escapes de rama negra. Para diciembre: monitorear chinches en soja y decidir la fertilización del maíz. Pendiente: no llegó el análisis de suelo del Lote 9 y falta la factura del contratista.", "wynik": "INFORME MENSUAL: Agropecuaria Don Ernesto, noviembre\n\nRESUMEN\n• 4 recorridas y 2 recetas de herbicida.\n• Soja en V3 con buen stand; maíz en V6.\n• Cogollero en maíz por debajo del umbral acordado: sin aplicación.\n• 85 mm de lluvia en el mes.\n• Barbecho limpio en 3 de 4 lotes; escapes de rama negra en El Bajo.\n\n| lote | cultivo | estado | acción del mes | próxima acción |\n| Lote 7 | soja | V3, buen stand | receta de herbicida; ajuste de densidad de siembra | monitoreo de chinches |\n| La Loma | [A COMPLETAR] | [A COMPLETAR] | receta de herbicida | [A COMPLETAR] |\n| El Bajo | [A COMPLETAR] | escapes de rama negra | — | evaluar control [VERIFICAR] |\n| maíz [A COMPLETAR: lote] | maíz | V6, cogollero bajo umbral | monitoreo | decidir fertilización |\n\nPLAN DE DICIEMBRE\n1. Monitoreo de chinches en soja.\n2. Decisión de fertilización del maíz, con el análisis de suelo disponible.\n3. Definir qué hacer con la rama negra en El Bajo.\n\nPENDIENTES\n| pendiente | responsable |\n| análisis de suelo del Lote 9 | laboratorio; lo sigo yo |\n| factura del contratista | Ernesto |\n\nLas aplicaciones del mes se hicieron con receta; dosis según receta y etiqueta [VER ETIQUETA].\n\nEsto es un borrador para tu revisión: la decisión final, la firma y la responsabilidad son tuyas."}}]}, {"dzial_nr": 5, "dzial": "Crédito, seguros y trámites", "opis": "Los papeles se comen media campaña del asesor: carpeta de crédito, seguro y denuncia de siniestro, registros del establecimiento, notas del organismo sanitario, certificaciones BPA y lo que pide el acopio o el exportador. Este departamento arma esos documentos con tus datos y las reglas vigentes que pegas, sin adivinar montos ni plazos, y marca cada hueco a verificar antes de que alguien firme.", "skills": []}, {"dzial_nr": 6, "dzial": "Protección de cultivos y registros de aplicación", "opis": "La aplicación lleva una hora; los papeles de alrededor, la receta, el registro, la orden de trabajo y la revisión de la etiqueta, se comen tus noches. Este departamento convierte tus notas de campo y las etiquetas que pegas en registros, programas y órdenes terminados, sin inventar una sola dosis, carencia ni reingreso: todo sale de la etiqueta y de tus propios datos.", "skills": [{"id": "6.01", "nazwa": "Registro de aplicaciones de fitosanitarios", "tag": "REGISTRO DE APLICACIONES", "co_robi": "Convierte tus notas de la aplicación en un registro completo: lote, cultivo y estadio, producto con su número de registro, dosis copiada de la etiqueta, total aplicado, plaga objetivo, condiciones, equipo y aplicador. Calcula total de producto, fin del reingreso y primera fecha de cosecha solo con los tiempos de la etiqueta.", "kiedy": "El mismo día de la aplicación o al cerrar la semana, cuando las notas están en el celular y el registro tiene que quedar listo para la auditoría BPA, el acopio o una inspección.", "brief": [{"pole": "Productor y lote", "opis": "Productor, lote, superficie tratada y cultivo. Ej.: “Agropecuaria Don Ernesto, Lote 7, 78 ha de soja”."}, {"pole": "Fecha y estadio", "opis": "Fecha, hora de inicio y fin, estadio del cultivo. Ej.: “29 de enero, de 6:40 a 9:15, soja en R3”."}, {"pole": "Producto y dosis de etiqueta", "opis": "Producto, número de registro y dosis copiada de la etiqueta. Ej.: “insecticida registrado para soja, registro n.º [A COMPLETAR], dosis [VER ETIQUETA], 80 L/ha de caldo”."}, {"pole": "Plaga y justificación", "opis": "Qué se controló y por qué. Ej.: “chinche, monitoreo del 26 de enero por encima del umbral que fijó el asesor”."}, {"pole": "Condiciones y equipo", "opis": "Clima y máquina. Ej.: “24 °C, humedad 65 %, viento sur 6 a 9 km/h, autopropulsada de 28 m, pastillas de inducción de aire”."}, {"pole": "Aplicador", "opis": "Quién aplicó y su habilitación. Ej.: “Martín Ortiz, aplicador habilitado, carnet n.º [A COMPLETAR]”."}], "prompt": "Eres un ingeniero agrónomo asesor con experiencia que ayuda a productores a llevar registros de aplicación de fitosanitarios que resistan una auditoría BPA o una inspección del organismo sanitario. Convierte mis notas en un registro completo.\n\nDATOS:\n- Productor y lote: [PRODUCTOR Y LOTE]\n- Fecha y estadio: [FECHA Y ESTADIO]\n- Producto y dosis de etiqueta: [PRODUCTO Y DOSIS DE ETIQUETA]\n- Plaga y justificación: [PLAGA Y JUSTIFICACIÓN]\n- Condiciones y equipo: [CONDICIONES Y EQUIPO]\n- Aplicador: [APLICADOR]\n\nREGLAS:\n1. Si falta algún dato clave, primero hazme hasta 6 preguntas cortas y espera mis respuestas antes de escribir.\n2. Dosis, tiempo de carencia, tiempo de reingreso, banda toxicológica y restricciones salen solo de la etiqueta; si no la pegué, [VER ETIQUETA].\n3. Total de producto = dosis de etiqueta × hectáreas tratadas, solo si te doy la dosis.\n4. Fin del reingreso = hora de fin + reingreso de la etiqueta; primera cosecha = fecha de aplicación + carencia de la etiqueta.\n5. Los campos que exija la norma de tu jurisdicción y el tiempo de archivo llevan [VERIFICAR CON EL ORGANISMO DE TU PAÍS].\n6. No inventes dosis, plazos, montos, tasas, normas ni números de resolución. Marca lo faltante con [A COMPLETAR], lo que supongas con [SUPUESTO] y lo dudoso con [VERIFICAR].\n7. Si calculas algo, muestra la cuenta paso a paso.\n\nFORMATO DE SALIDA:\nA) Tabla: | fecha | hora | lote | cultivo y estadio | ha | producto | registro | dosis | total | plaga | aplicador |\nB) Cuentas paso a paso: total de producto, volumen de caldo, fin del reingreso y primera cosecha.\nC) Campos que faltan completar o verificar.\nD) Qué adjuntar: foto de la etiqueta,
