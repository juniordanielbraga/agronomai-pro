<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dziennik PRO"><meta name="theme-color" content="#1E4620">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="../app/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../app/icon-192.png">
<title>Dziennik polowy PRO — AgronomAI PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" rel="stylesheet">
<style>
:root{--g9:#1E4620;--g8:#2C5E2E;--leaf:#7CB342;--cta:#2E7D32;--gold:#D9A82B;--red:#C62828;--blue:#1565C0;
--bg:#F5F0E3;--grid:rgba(30,70,32,.055);--card:#fff;--ink:#1d1f1b;--mut:#62614f;--line:#e2dac3;--soft:#f3eedf;--onp:#fff;--warnbg:#fff6dc;--warnln:#ecd58a;--warntx:#5d4a14}
[data-theme=dark]{--bg:#121711;--grid:rgba(165,212,106,.05);--card:#1b2219;--ink:#eef2e8;--mut:#a3ab98;--line:#2f3a2a;--soft:#222b1f;--g9:#a5d46a;--g8:#a5d46a;--cta:#4f9a3f;--warnbg:#2a2715;--warnln:#4a4320;--warntx:#eadca8}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.5;min-height:100vh;
background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;
padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono,.k,.pill,.chip,.cnt{font-family:'Space Mono',monospace}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--g9);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 10px}
[data-theme=dark] .top{background:#17351a}
.top .wrap{display:flex;align-items:center;gap:10px}
.top .bk{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;text-decoration:none}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:17px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-family:'Space Mono';font-size:10px;letter-spacing:1.8px;opacity:.75;text-transform:uppercase}
.top svg.lg{width:40px;height:40px;border-radius:10px;flex:none}
.top .tb{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:18px;cursor:pointer;flex:none}
main{padding:16px 0 24px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px;color:var(--g8);text-decoration:none;padding:10px 0;min-height:44px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:1.6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;text-transform:uppercase}
.pill:before{content:'';width:7px;height:7px;border-radius:50%;background:#3FA34D;box-shadow:0 0 0 3px rgba(63,163,77,.18)}
h1{font-size:36px;line-height:1.05;font-weight:800;letter-spacing:-1.2px;margin:12px 0 8px}
h1 em{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;color:var(--gold);letter-spacing:-.5px}
h2{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
h3{font-size:16.5px;font-weight:700}
.lead{color:var(--mut);font-size:15px;margin-bottom:16px}
.k{font-size:10.5px;letter-spacing:1.8px;color:var(--mut);text-transform:uppercase;display:block;margin:22px 0 8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.stat small{font-family:'Space Mono';font-size:9px;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px 14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:8px;min-height:168px;box-shadow:0 2px 0 rgba(30,70,32,.04);position:relative;overflow:hidden}
.tile:active{transform:scale(.98)}
.tile .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}
.tile .ic svg{width:28px;height:28px}
.tile b{font-size:17px;font-weight:700;line-height:1.2;letter-spacing:-.2px}
.tile p{font-size:12.5px;color:var(--mut);line-height:1.4}
.tile .cnt{position:absolute;top:14px;right:12px;font-size:11px;background:var(--soft);border-radius:99px;padding:2px 9px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card.acc{border-left:5px solid var(--leaf)}
.card.gold{border-left:5px solid var(--gold)}
.card h3{margin-bottom:6px}
.btn{min-height:52px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:600;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);text-align:center;line-height:1.2}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--cta);border-color:var(--cta);color:#fff}
.btn.dk{background:#1E4620;border-color:#1E4620;color:#fff}
.btn.gd{background:var(--gold);border-color:var(--gold);color:#2a2105}
.btn.red{color:var(--red);border-color:rgba(198,40,40,.35)}
.btn.sm{min-height:44px;padding:8px 12px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bgrid.c3{grid-template-columns:1fr 1fr 1fr}
.items{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-align:left;width:100%}
.item:active{background:var(--soft)}
.item .dt{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--soft);padding:6px 2px;font-family:'Space Mono';line-height:1.1}
.item .dt b{display:block;font-size:19px}.item .dt small{font-size:10px;text-transform:uppercase;color:var(--mut)}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:15.5px;font-weight:700;line-height:1.3}
.item .tx p{font-size:13.5px;color:var(--mut);margin-top:2px;overflow-wrap:anywhere}
.item .ar{flex:none;color:var(--mut);font-size:20px;align-self:center}
.chip{display:inline-block;font-size:10.5px;letter-spacing:.8px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:2px 9px;color:var(--mut);text-transform:uppercase;margin:4px 4px 0 0;white-space:nowrap}
.chip.g{background:#e6f2d9;border-color:#cfe5b6;color:#2C5E2E}.chip.r{background:#fde7e5;border-color:#f6c3be;color:#9b1c1c}.chip.y{background:#fbf0cf;border-color:#efd78c;color:#6b5210}.chip.b{background:#e3eefb;border-color:#bdd5f2;color:#0f4c96}
[data-theme=dark] .chip.g,[data-theme=dark] .chip.r,[data-theme=dark] .chip.y,[data-theme=dark] .chip.b{background:var(--soft);border-color:var(--line);color:var(--ink)}
.empty{text-align:center;color:var(--mut);padding:26px 16px;border:2px dashed var(--line);border-radius:16px;font-size:14.5px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.warn{background:var(--warnbg);border:1px solid var(--warnln);color:var(--warntx);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.45;display:flex;gap:10px}
.warn:before{content:'!';flex:none;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#2a2105;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:1px}
.alert{background:#fde7e5;border:1px solid #f1b3ac;color:#8c1b14;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px;font-weight:600}
[data-theme=dark] .alert{background:#3a1c19;border-color:#6b2a24;color:#ffcfc9}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:14px}
.kv div small{display:block;font-family:'Space Mono';font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.kv div b{font-weight:700}
/* forms */
.fl{display:block;margin-bottom:12px}
.fl>span{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.fl>span i{font-style:normal;color:var(--red)}
.fl small{display:block;color:var(--mut);font-size:12.5px;margin-top:4px}
.fl input,.fl select,.fl textarea,.inp{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;background:var(--soft);color:var(--ink);-webkit-appearance:none;appearance:none}
.fl select,.inp.sel{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.fl textarea{min-height:96px;resize:vertical;line-height:1.45}
.fl input:focus,.fl select:focus,.fl textarea:focus,.inp:focus{outline:3px solid rgba(124,179,66,.55);border-color:var(--leaf);background:var(--card)}
.fl.err input,.fl.err select,.fl.err textarea{border-color:var(--red);background:#fff3f2}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mic{margin-top:8px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
.sh-bg{position:absolute;inset:0;background:rgba(10,20,10,.55)}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:94vh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;max-width:720px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sh-h{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.sh-h b{flex:1;font-size:18px;font-weight:800;letter-spacing:-.3px}
.sh-h .x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:24px;cursor:pointer;line-height:1}
.sh-b{overflow:auto;padding:14px 16px 6px;flex:1}
.sh-f{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sh-f .btn{flex:1}
.sh-note{font-size:12.5px;color:var(--mut);margin:-2px 0 12px}
/* tabs, filters */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{min-height:46px;border:0;background:transparent;border-radius:11px;font-weight:600;font-size:14px;cursor:pointer;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.filt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.filt .fl{margin-bottom:8px}
.filt .fl>span{font-size:12.5px;margin-bottom:3px}
.filt .fl input,.filt .fl select{min-height:46px;padding:9px 11px;font-size:15px}
.sum{font-size:13.5px;color:var(--mut);margin:4px 2px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:30;min-height:60px;border-radius:30px;padding:0 22px;border:0;background:var(--gold);color:#2a2105;font-weight:800;font-size:16px;box-shadow:0 8px 24px rgba(30,70,32,.3);cursor:pointer;display:flex;align-items:center;gap:8px}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--mut);font-size:11px;font-weight:600}
.nav a svg{width:25px;height:25px}
.nav a.on{color:var(--cta)}
[data-theme=dark] .nav a.on{color:#a5d46a}
.nav a.on svg{stroke-width:2.4}
/* calc */
.res{background:var(--g9);color:#fff;border-radius:18px;padding:18px 16px;margin-bottom:12px}
[data-theme=dark] .res{background:#17351a}
.res .big{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.res .big small{font-size:18px;letter-spacing:0;font-weight:600;opacity:.85;margin-left:4px}
.res .lb{font-family:'Space Mono';font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;opacity:.8}
.res .eq{font-size:13px;opacity:.9;margin-top:10px;line-height:1.6;font-family:'Space Mono'}
.res .eq b{color:#ffd56a}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-family:'Space Mono';font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);text-align:left;font-weight:700;padding:6px 4px;border-bottom:1.5px solid var(--line)}
table.t td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t input{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--soft);font-size:15px;text-align:right}
table.t input.l{text-align:left}
.tsc{overflow-x:auto;margin:0 -4px;padding:0 4px}
.pkg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.pkg div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.pkg b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px}
.pkg small{font-family:'Space Mono';font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
details.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
details.ex summary{padding:16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:56px}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary:after{content:'+';font-size:22px;color:var(--mut)}
details.ex[open] summary:after{content:'–'}
details.ex .dbody{padding:0 16px 16px}
/* calendar */
.calh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calh b{flex:1;text-align:center;font-size:18px;font-weight:800;text-transform:capitalize}
.calh button{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:22px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px}
.cal .wd{font-family:'Space Mono';font-size:10px;text-align:center;color:var(--mut);padding:4px 0;text-transform:uppercase}
.cal button{aspect-ratio:1/1.05;min-height:44px;border:1px solid transparent;border-radius:10px;background:var(--soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:15px;padding:0}
.cal button.o{opacity:.35}
.cal button.td{border-color:var(--leaf);background:#e6f2d9}
[data-theme=dark] .cal button.td{background:#24361f}
.cal button.sel{background:var(--g9);color:#fff;border-color:var(--g9)}
[data-theme=dark] .cal button.sel{color:#121711}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.chk{width:30px;height:30px;flex:none;accent-color:var(--cta);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin:8px 2px 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.done .tx b{text-decoration:line-through;opacity:.6}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1d1f1b;color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:12px;color:var(--mut);margin:26px 0 6px}
@media (min-width:700px){h1{font-size:46px}.tiles{grid-template-columns:repeat(4,1fr)}}
@media (max-width:360px){.stats{grid-template-columns:1fr 1fr}.bgrid.c3{grid-template-columns:1fr 1fr}}
@media print{.top,.nav,.fab,.noprint,#sheet,.back{display:none!important}body{background:#fff;padding:0}.res{background:#fff!important;color:#000;border:2px solid #1E4620}.card,details.ex{break-inside:avoid}}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="topbar"></div></header>
<main><div class="wrap" id="view"></div></main>
<nav class="nav noprint"><div class="in" id="nav"></div></nav>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="impfile" accept=".json,application/json" hidden>
<script>
'use strict';
/* =============== narzędzia =============== */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:null};
const fmt=(n,d=1)=>n==null||!isFinite(n)?'—':Number(n).toLocaleString('pl-PL',{maximumFractionDigits:d});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const fdate=s=>s?s.slice(0,10).split('-').reverse().join('.'):'—';
const MON=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const MONF=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const plN=(n,a,b,c)=>{n=Math.abs(n);if(n===1)return a;const d=n%10,dd=n%100;return d>=2&&d<=4&&(dd<12||dd>14)?b:c};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

/* =============== dane referencyjne (edytowalne) =============== */
// pobranie jednostkowe: kg składnika na 1 t plonu głównego (z plonem ubocznym), wartości orientacyjne, zaokrąglone
const DEF_CROPS=[
 {n:'Pszenica ozima',N:25,P:11,K:19,y:7,u:'t ziarna',split:[[50,'Ruszenie wegetacji (BBCH 20–25)'],[30,'Strzelanie w źdźbło (BBCH 30–32)'],[20,'Liść flagowy – kłoszenie (BBCH 37–51)']]},

function go(h){if(location.hash===h)render();else location.hash=h}
function topBar(title,sub,back){$('#topbar').innerHTML=(back?`<a class="bk" href="${back}" aria-label="Wstecz">←</a>`:`<svg class="lg" viewBox="0 0 64 64">${I.leaf.replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg>`)+`<div class="ttl"><b>${esc(title)}</b><small>${esc(sub||'AgronomAI PRO')}</small></div><button class="tb" data-act="theme" aria-label="Tryb nocny/dzienny">${document.documentElement.dataset.theme==='dark'?'☀':'☾'}</button>`}
function nav(cur){const L=[['#/','Start',I.home],['#/gospodarstwa','Pola',I.farm],['#/dziennik','Dziennik',I.book],['#/kalkulator','Nawożenie',I.calc],['#/kalendarz','Kalendarz',I.cal]];
 $('#nav').innerHTML=L.map(([h,t,ic])=>`<a href="${h}" class="${cur===h?'on':''}">${ic}<span>${t}</span></a>`).join('')}
function render(){const h=location.hash||'#/';const [p,q]=h.slice(1).split('?');const parts=p.split('/').filter(Boolean);
 const fab=document.querySelector('.fab');if(fab)fab.remove();
 const V=$('#view');window.scrollTo(0,0);
 try{switch(parts[0]){
  case 'gospodarstwa':nav('#/gospodarstwa');V.innerHTML=vFarms();break;
  case 'gospodarstwo':nav('#/gospodarstwa');V.innerHTML=vFarm(parts[1]);break;
  case 'pole':nav('#/gospodarstwa');V.innerHTML=vField(parts[1]);break;
  case 'dziennik':nav('#/dziennik');if(q){const s=new URLSearchParams(q);if(s.get('t'))DZ.t=s.get('t');if(s.has('f'))DZ.f=s.get('f')}V.innerHTML=vDz();addFab();break;
  case 'kalkulator':nav('#/kalkulator');if(q){const s=new URLSearchParams(q);if(s.get('f'))calcFromField(s.get('f'))}V.innerHTML=vCalc();calcUpd();break;
  case 'kalendarz':nav('#/kalendarz');V.innerHTML=vCal();addFab('Termin','event');break;
  case 'kopia':nav('');V.innerHTML=vBackup();break;
  default:nav('#/');V.innerHTML=vHome()}}catch(e){console.error(e);V.innerHTML='<div class="card"><h3>Coś poszło nie tak</h3><p>Odśwież stronę. Dane są bezpieczne na urządzeniu.</p></div>'}}
function addFab(label,act){const b=document.createElement('button');b.className='fab noprint';const m={lus:['Lustracja','entry'],zab:['Zabieg','spray'],naw:['Nawożenie','fert']};const [l,a]=label?[label,act]:m[DZ.t];b.innerHTML='＋ '+l;b.dataset.act='add-'+a;document.body.appendChild(b)}

function calc(){const crop=cropBy(C.crop)||D.crops[0];const y=num(C.y)||0,area=num(C.area);
 const upt=y*crop.N, prevN=num(C.prevN)||0, natDose=num(C.natDose)||0, natN=num(C.natN)||0, natR=num(C.natR)||0, other=num(C.other)||0;
 const natTot=natDose*natN, natEff=natTot*natR/100;
 const raw=upt-prevN-natEff-other;const N=Math.max(0,Math.round(raw/5)*5);
 const prod=NPROD.find(p=>p[0]===C.prod)||NPROD[0];
 const splits=crop.split.map(([pct,term])=>{const n=N*pct/100;const kg=n/(prod[1]/100);return{pct,term,n,kg,tot:area?kg*area:null}});

 const iP=C.clsP!==''?+C.clsP:(p!=null?clsIdx(p,TH_P):2), iK=C.clsK!==''?+C.clsK:(k!=null?clsIdx(k,TH_K[C.cat]):2);
 const P=Math.round(y*crop.P*D.pkf[iP]/5)*5, K=Math.round(y*crop.K*D.pkf[iK]/5)*5;

 let lime=null;if(ph!=null){const L=LIME[C.cat];const lv=ph<=L.ph[0]?0:ph<=L.ph[1]?1:ph<=L.ph[2]?2:ph<=L.ph[3]?3:4;lime={lv,txt:['konieczne','potrzebne','wskazane','ograniczone','zbędne'][lv],CaO:lv<3?L.d[lv]:0}}
 return{crop,y,area,upt,prevN,natTot,natEff,other,raw,N,prod,splits,P,K,iP,iK,iMg,pAuto:C.clsP===''&&p==null,kAuto:C.clsK===''&&k==null,lime}}

 const a=iso(start);const endD=new Date(start);endD.setDate(endD.getDate()+41);const evs=evsInRange(a,iso(endD));const by={};evs.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
 let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(d.getDate()+i);const s=iso(d);const es=by[s]||[];
  cells+=`<button class="${d.getMonth()!==m?'o ':''}${s===today()?'td ':''}${s===CAL.sel?'sel':''}" data-act="cal-day" data-d="${s}" aria-label="${fdate(s)}">${d.getDate()}<span class="dots">${es.slice(0,3).map(e=>`<i style="background:${(KINDS[e.kind]||KINDS.inne)[1]}"></i>`).join('')}</span></button>`}
 const dayE=evsInRange(CAL.sel,CAL.sel);const up=(()=>{const d=new Date();d.setDate(d.getDate()+90);return evsInRange(today(),iso(d)).filter(e=>!e.done)})();
 return `<div class="filt"><label class="fl" style="margin-bottom:0"><span>Pole</span><select data-act="cal-f" id="calf">${`<option value="">Wszystkie pola + terminy stałe</option>`+fieldOpts(CAL.f,false)}</select></label></div>
 <div class="calh"><button data-act="cal-prev" aria-label="Poprzedni miesiąc">‹</button><b>${MONF[m]} ${y}</b><button data-act="cal-next" aria-label="Następny miesiąc">›</button></div>
 <div class="cal">${['pn','wt','śr','cz','pt','sb','nd'].map(w=>`<span class="wd">${w}</span>`).join('')}${cells}</div>
 <div class="legend">${Object.values(KINDS).map(k=>`<span><i style="background:${k[1]}"></i>${k[0]}</span>`).join('')}</div>
 <span class="k">${fdate(CAL.sel)}</span>
 ${dayE.length?`<div class="items">${dayE.map(evItem).join('')}</div>`:`<div class="empty" style="padding:16px">Brak terminów tego dnia</div>`}
 <span class="k">Najbliższe 90 dni</span>
 ${up.length?`<div class="items">${up.map(evItem).join('')}</div>`:'<div class="empty" style="padding:16px">Brak zaplanowanych terminów</div>'}
 <div class="card gold" style="margin-top:16px"><h3>Eksport do kalendarza telefonu</h3><p style="font-size:13.5px;color:var(--mut);margin-bottom:10px">Pobierz plik .ics i otwórz go – terminy z przypomnieniami trafią do Kalendarza Google, iPhone lub Outlook.${CAL.f?' Eksport obejmie wybrane pole.':''}</p>
 <div class="bgrid"><button class="btn dk" data-act="ics">📅 Pobierz .ics</button><button class="btn" data-act="add-event">＋ Termin</button></div></div>
 <details class="ex"><summary>Terminy stałe (co roku, edytowalne)</summary><div class="dbody"><p style="font-size:12.5px;color:var(--mut);margin-bottom:10px">Daty są przykładowe. Ustaw je zgodnie z aktualnymi przepisami (np. Programem azotanowym) i warunkami w regionie.</p>
 <div class="items">${D.terms.map(t=>`<button class="item" data-act="open-term" data-id="${t.id}"><span class="dt" style="border-left:4px solid #8E6BBF"><b>${+t.md.slice(3)}</b><small>${MON[+t.md.slice(0,2)-1]}</small></span><span class="tx"><b>${esc(t.title)}</b><p>${esc(t.notes||'')}</p>${t.on?'':'<span class="chip">ukryty</span>'}</span><span class="ar">›</span></button>`).join('')}</div>
 <button class="btn full" style="margin-top:10px" data-act="add-term">＋ Termin stały</button></div></details>`}
function icsOut(){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AgronomAI PRO//Dziennik polowy PRO//PL','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:AgronomAI – zabiegi i terminy','X-WR-TIMEZONE:Europe/Warsaw'];
 const e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
 const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
 const nd=s=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+1);return iso(d).replace(/-/g,'')};
 let n=0;
 D.events.filter(v=>!CAL.f||v.fieldId===CAL.f).forEach(v=>{if(!v.date)return;n++;const K=KINDS[v.kind]||KINDS.inne;
  L.push('BEGIN:VEVENT','UID:'+v.id+'@agronomai-pro','DTSTAMP:'+stamp);
  if(v.time){const t=v.time.replace(':','')+'00';const h=(+v.time.slice(0,2)+1);L.push('DTSTART;TZID=Europe/Warsaw:'+v.date.replace(/-/g,'')+'T'+t);L.push('DTEND;TZID=Europe/Warsaw:'+v.date.replace(/-/g,'')+'T'+(h<24?String(h).padStart(2,'0')+v.time.slice(3,5)+'00':'235900'))}
  else L.push('DTSTART;VALUE=DATE:'+v.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+nd(v.date));
  L.push('SUMMARY:'+e(K[0]+': '+v.title+(v.fieldId?' – '+fLabel(v.fieldId):'')),'DESCRIPTION:'+e([v.fieldId?fLabel(v.fieldId):'',v.notes].filter(Boolean).join('\n')),'CATEGORIES:'+e(K[0]));
  if(v.done)L.push('STATUS:CONFIRMED');
  if(v.remind&&v.remind!=='0')L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e(v.title),'TRIGGER:-P'+v.remind+'D','END:VALARM');
  L.push('END:VEVENT')});
 if(!CAL.f){const y=new Date().getFullYear();D.terms.filter(t=>t.on).forEach(t=>{n++;const d=y+'-'+t.md;L.push('BEGIN:VEVENT','UID:term-'+t.id+'@agronomai-pro','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d.replace(/-/g,''),'DTEND;VALUE=DATE:'+nd(d),'RRULE:FREQ=YEARLY','SUMMARY:'+e(t.title),'DESCRIPTION:'+e(t.notes||''),'CATEGORIES:'+e('Termin stały'),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e(t.title),'TRIGGER:-P3D','END:VALARM','END:VEVENT')})}
 L.push('END:VCALENDAR');
 const enc=new TextEncoder();const fold=l=>{if(enc.encode(l).length<=74)return l;let out='',cur='',first=true;for(const ch of l){const lim=first?74:73;if(enc.encode(cur+ch).length>lim){out+=(first?'':'\r\n ')+cur;cur=ch;first=false}else cur+=ch}return out+(first?'':'\r\n ')+cur};
 if(!n){toast('Brak terminów do eksportu');return}
 download(new Blob([L.map(fold).join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}),`agronomai_kalendarz_${today()}.ics`);toast('Pobrano plik .ics ('+n+')')}

/* ---- kopia ---- */
function vBackup(){topBar('Kopia i eksport','Dane na tym urządzeniu','#/');
 const sz=(()=>{try{return(JSON.stringify(D).length/1024).toFixed(0)}catch(e){return'?'}})();
 return `<div class="card gold"><h3>Kopia zapasowa (JSON)</h3><p class="lead" style="margin-bottom:12px">Pełna kopia gospodarstw, pól, wpisów, zabiegów, terminów i Twoich tabel. Zapisz ją na Dysku Google, w mailu lub na komputerze. Rozmiar: ~${sz} KB.</p>
 <div class="bgrid"><button class="btn dk" data-act="export-json">⬇ Zapisz kopię</button><button class="btn" data-act="import-json">⬆ Wczytaj kopię</button></div></div>
 <div class="card"><h3>Eksport CSV (Excel)</h3><p class="lead" style="margin-bottom:12px">Arkusze do kontroli i dla rolnika. Separator „;”, polskie znaki (UTF-8).</p>
 <div class="items"><button class="btn full" data-act="csv-all" data-t="zab">⬇ Ewidencja zabiegów ŚOR</button><button class="btn full" data-act="csv-all" data-t="lus">⬇ Lustracje</button><button class="btn full" data-act="csv-all" data-t="naw">⬇ Nawożenie</button><button class="btn full" data-act="csv-fields">⬇ Pola i analizy gleby</button></div></div>
 <div class="card"><h3>Instalacja na telefonie</h3><p class="lead" style="margin-bottom:0">Android (Chrome): menu ⋮ → „Dodaj do ekranu głównego”. iPhone (Safari): Udostępnij → „Do ekranu początkowego”. Moduł działa także bez internetu.</p></div>
 <div class="card"><h3>Usuń wszystkie dane</h3><p class="lead" style="margin-bottom:12px">Nieodwracalne. Najpierw zapisz kopię.</p><button class="btn red full" data-act="wipe">Usuń dane z tego urządzenia</button></div>`}
function exportJson(){const o=Object.assign({app:'AgronomAI PRO – Dziennik polowy PRO',exported:new Date().toISOString()},D);delete o._savedAt;
 download(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}),`agronomai_dziennik_kopia_${today()}.json`);toast('Zapisano kopię JSON')}
$('#impfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||!Array.isArray(o.farms))throw 0;
  if(!confirm(`Wczytać kopię (${o.farms.length} gosp., ${(o.fields||[]).length} pól)? Obecne dane zostaną zastąpione.`))return;D=normalize(o);save();go('#/');toast('Wczytano kopię')}catch(err){toast('To nie jest poprawny plik kopii')}};rd.readAsText(f)});
function csvFields(){const n=v=>v==null||v===''?'':String(v).replace('.',',');const H=['Gospodarstwo','Pole','Nr działki','Powierzchnia (ha)','Uprawa','Przedplon','Plon planowany (t/ha)','Kategoria agronomiczna','Klasa bonitacyjna','pH','P2O5 (mg/100 g)','K2O (mg/100 g)','MgO (mg/100 g)','Data analizy','Notatki'];
 const R=D.fields.map(f=>{const g=farm(f.farmId);return[g?g.name:'',f.name,f.plot,n(f.area),f.crop,f.prev,n(f.yield),f.cat,f.bon,n(f.ph),n(f.p),n(f.k),n(f.mg),f.adate,f.notes]});
 const s='\ufeff'+[H,...R].map(r=>r.map(c=>{c=c==null?'':String(c);return /[;"\n\r]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');download(new Blob([s],{type:'text/csv;charset=utf-8'}),`pola_${today()}.csv`);toast('Wyeksportowano CSV')}

/* =============== akcje =============== */
const ACT={
 closesheet:()=>closeSheet(), sheetdel:()=>SH&&SH.del&&SH.del(),
 theme:()=>{const t=document.documentElement.dataset.theme==='dark'?null:'dark';store('theme',t);theme(t);render()},
 'add-farm':()=>editFarm(), 'edit-farm':el=>editFarm(el.dataset.id),
 'add-field':el=>editField(null,el.dataset.farm), 'edit-field':el=>editField(el.dataset.id),
 'add-entry':el=>editEntry(null,{fieldId:el.dataset.field||(DZ.f&&!DZ.f.startsWith('g:')?DZ.f:'')}),
 'add-spray':el=>editSpray(null,{fieldId:el.dataset.field||(DZ.f&&!DZ.f.startsWith('g:')?DZ.f:'')}),
 'add-fert':el=>editFert(null,{fieldId:el.dataset.field||(DZ.f&&!DZ.f.startsWith('g:')?DZ.f:'')}),
 'add-event':el=>editEvent(null,{fieldId:el.dataset.field||CAL.f||''}),
 'open-lus':el=>editEntry(el.dataset.id),'open-zab':el=>editSpray(el.dataset.id),'open-naw':el=>editFert(el.dataset.id),
 'open-ev':el=>editEvent(el.dataset.id),'open-term':el=>editTerm(el.dataset.id),'add-term':()=>editTerm(),
 'ev-done':(el,e)=>{e.stopPropagation();const v=D.events.find(x=>x.id===el.dataset.id);if(v){v.done=el.checked;save();setTimeout(render,150);toast(v.done?'Oznaczono jako wykonane':'Przywrócono')}},
 'ev-rec':(el,e)=>{e.stopPropagation();const v=D.events.find(x=>x.id===el.dataset.id);if(!v)return;const pre={fieldId:v.fieldId,date:v.date<=today()?v.date:today(),eventId:v.id,notes:v.notes};if(v.kind==='zabieg')editSpray(null,Object.assign(pre,{product:v.title}));else editFert(null,pre)},
 dztab:el=>{DZ.t=el.dataset.t;render()},
 'dz-farm':(el,e)=>{e.preventDefault();DZ.f='g:'+el.dataset.id;DZ.t='zab';go('#/dziennik')},
 csv:()=>csvOut(), 'csv-all':el=>{const s={...DZ};Object.assign(DZ,{t:el.dataset.t,f:'',from:'',to:'',q:''});csvOut();Object.assign(DZ,s)}, 'csv-fields':()=>csvFields(),
 'export-json':()=>exportJson(),'import-json':()=>$('#impfile').click(),
 wipe:()=>{if(!confirm('Na pewno usunąć wszystkie dane modułu z tego urządzenia?'))return;if(!confirm('Ostatnie potwierdzenie: dane zostaną usunięte bezpowrotnie.'))return;D=blank();save();go('#/');toast('Dane usunięte')},
 'cal-prev':()=>{CAL.m--;if(CAL.m<0){CAL.m=11;CAL.y--}render()},'cal-next':()=>{CAL.m++;if(CAL.m>11){CAL.m=0;CAL.y++}render()},
 'cal-day':el=>{CAL.sel=el.dataset.d;const d=new Date(CAL.sel+'T12:00:00');CAL.y=d.getFullYear();CAL.m=d.getMonth();render();const k=document.querySelectorAll('.k')[0];k&&k.scrollIntoView({behavior:'smooth',block:'start'})},
 ics:()=>icsOut(), print:()=>window.print(),
 'up-add':()=>{D.crops.push({n:'Nowa uprawa '+(D.crops.length+1),N:20,P:10,K:20,y:5,u:'t',split:[[60,'Pierwsza dawka'],[40,'Druga dawka']]});save();rerenderCalcKeepOpen()},
 'up-del':el=>{if(D.crops.length<=1)return;const c=D.crops[+el.dataset.i];if(!confirm(`Usunąć „${c.n}” z tabeli?`))return;D.crops.splice(+el.dataset.i,1);save();rerenderCalcKeepOpen()},
 'up-reset':()=>{if(!confirm('Przywrócić domyślną tabelę pobrania i współczynniki?'))return;D.crops=JSON.parse(JSON.stringify(DEF_CROPS));D.pkf=DEF_PKF.slice();save();rerenderCalcKeepOpen()},
 'calc-save':()=>{const f=field(C.fieldId);if(!f)return;const r=calc();f.plan={year:new Date().getFullYear(),date:today(),crop:r.crop.n,y:r.y,N:r.N,P:r.P,K:r.K,CaO:r.lime?r.lime.CaO:0,prod:r.prod[0],splits:r.splits.map(s=>({pct:s.pct,term:s.term,n:Math.round(s.n),kg:Math.round(s.kg)}))};save();toast('Plan zapisany w karcie pola')},
 'calc-plan':()=>{const r=calc();if(!D.fields.length){toast('Najpierw dodaj pole');return}
  const fs=r.splits.map((s,i)=>({k:'d'+i,l:`${s.pct}% · ${s.term} – ${fmt(s.kg,0)} kg/ha`,t:'date'}));
  sheet({title:'Zaplanuj dawki w kalendarzu',note:`${r.crop.n}: ${fmt(r.N,0)} kg N/ha jako ${r.prod[0]}. Podaj daty – puste pominiemy.`,obj:{fieldId:C.fieldId},fields:[{k:'fieldId',l:'Pole',t:'select',o:fieldOpts(C.fieldId,true),req:1},...fs],
   save:v=>{let n=0;r.splits.forEach((s,i)=>{if(v['d'+i]){D.events.push({id:uid(),title:`${r.prod[0]} – ${fmt(s.kg,0)} kg/ha (${fmt(s.n,0)} kg N)`,kind:'nawozenie',fieldId:v.fieldId,date:v['d'+i],remind:'1',notes:s.term,done:false});n++}});if(!n){toast('Podaj co najmniej jedną datę');return false}}})}
};
function rerenderCalcKeepOpen(){$('#view').innerHTML=vCalc();const d=document.querySelector('details.ex');if(d)d.open=true;if(!cropBy(C.crop))C.crop=D.crops[0].n;calcUpd()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;if(a==='cal-f')return;
 const fn=ACT[a];if(fn)fn(el,e)});
document.addEventListener('input',e=>{if(e.target.closest('#view')&&location.hash.startsWith('#/kalkulator'))onCalcInput(e)
 ;if(e.target.classList.contains('dzf')&&e.target.dataset.k==='q'){DZ.q=e.target.value;$('#dzlist').innerHTML=dzList()}});
document.addEventListener('change',e=>{const t=e.target;if(t.closest('#view')&&location.hash.startsWith('#/kalkulator')){onCalcInput(e);return}
 if(t.classList.contains('dzf')){DZ[t.dataset.k]=t.value;$('#dzlist').innerHTML=dzList()}
 if(t.id==='calf'){CAL.f=t.value;render()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act="dictate"]');if(!b)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
 try{const r=new SR();r.lang='pl-PL';r.interimResults=false;const ta=document.getElementById(b.dataset.target);b.textContent='● Słucham…';
  r.onresult=ev=>{const t=Array.from(ev.results).map(x=>x[0].transcript).join(' ');ta.value=(ta.value?ta.value+' ':'')+t};r.onend=()=>{b.textContent='🎤 Dyktuj (pl)'};r.onerror=()=>{b.textContent='🎤 Dyktuj (pl)';toast('Dyktowanie niedostępne – wklej tekst')};r.start()}catch(err){toast('Dyktowanie niedostępne – wklej tekst')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SH)closeSheet()});

render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
